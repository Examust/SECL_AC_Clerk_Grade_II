न बीमा प्रीमियम भुगतान\",\"बच्चों की ट्यूशन फीस\"],\"a\":0,\"ee\":\"Section 80D is for health insurance.\",\"eh\":\"धारा 80D स्वास्थ्य बीमा (Health insurance) के लिए है।\"},{\"n\":9,\"d\":\"\",\"se\":\"The maximum deduction under Section 80D for a <strong>senior citizen</strong> (aged 60 years or above) for health insurance premium is:\",\"sh\":\"एक <strong>वरिष्ठ नागरिक</strong> (60 वर्ष या उससे अधिक आयु) के लिए स्वास्थ्य बीमा प्रीमियम के लिए धारा 80D के तहत अधिकतम कटौती है:\",\"oe\":[\"₹30,000\",\"₹50,000\",\"₹75,000\",\"₹25,000\"],\"oh\":[\"₹30,000\",\"₹50,000\",\"₹75,000\",\"₹25,000\"],\"a\":1,\"ee\":\"₹50,000 (For non-senior citizens, it is ₹25,000).\",\"eh\":\"₹50,000 (गैर-वरिष्ठ नागरिकों के लिए यह ₹25,000 है)।\"},{\"n\":10,\"d\":\"\",\"se\":\"The deduction under <strong>Section 80G</strong> is allowed for:\",\"sh\":\"<strong>धारा 80G</strong> के तहत कटौती किसके लिए अनुमत है:\",\"oe\":[\"Donations to dependent relatives\",\"Donations to foreign NGOs\",\"Donations to specified charitable funds and relief trusts\",\"Contributions to political parties\"],\"oh\":[\"आश्रित रिश्तेदारों को दान\",\"विदेशी गैर सरकारी संगठनों को दान\",\"निर्दिष्ट धर्मार्थ निधियों और राहत ट्रस्टों को दान (Donations to charitable trusts)\",\"राजनीतिक दलों को चंदा\"],\"a\":2,\"ee\":\"Donations to approved charitable institutions.\",\"eh\":\"स्वीकृत धर्मार्थ संस्थानों को दान।\"},{\"n\":11,\"d\":\"\",\"se\":\"The deduction under <strong>Section 80TTA</strong> (Old Regime) is available exclusively for:\",\"sh\":\"<strong>धारा 80TTA</strong> (पुरानी व्यवस्था) के तहत कटौती विशेष रूप से किसके लिए उपलब्ध है:\",\"oe\":[\"Interest earned on fixed deposits (FDs)\",\"Interest paid on education loans\",\"Dividend income\",\"Interest earned on savings bank accounts\"],\"oh\":[\"सावधि जमा (FDs) पर अर्जित ब्याज\",\"शिक्षा ऋण पर दिया गया ब्याज\",\"लाभांश आय\",\"बचत बैंक खातों (Savings bank accounts) पर अर्जित ब्याज\"],\"a\":3,\"ee\":\"Interest on savings bank accounts (up to ₹10,000).\",\"eh\":\"बचत बैंक खातों पर ब्याज (₹10,000 तक)।\"},{\"n\":12,\"d\":\"\",\"se\":\"The deduction under <strong>Section 80E</strong> is allowed for:\",\"sh\":\"<strong>धारा 80E</strong> के तहत कटौती की अनुमति है:\",\"oe\":[\"Interest paid on an education loan for higher studies\",\"Principal repayment of a home loan\",\"Medical treatment expenses for specific diseases\",\"Life insurance premium\"],\"oh\":[\"उच्च अध्ययन के लिए शिक्षा ऋण (Education loan) पर भुगतान किया गया ब्याज\",\"होम लोन का मूलधन चुकौती\",\"विशिष्ट बीमारियों के लिए चिकित्सा व्यय\",\"जीवन बीमा प्रीमियम\"],\"a\":0,\"ee\":\"Education loan interest.\",\"eh\":\"शिक्षा ऋण पर ब्याज।\"},{\"n\":13,\"d\":\"\",\"se\":\"<strong>Tax Deducted at Source (TDS)</strong> under Section 192 applies to:\",\"sh\":\"धारा 192 के तहत <strong>स्रोत पर कर कटौती (TDS)</strong> किस पर लागू होती है:\",\"oe\":[\"Rent\",\"Salary\",\"Professional fees\",\"Interest on securities\"],\"oh\":[\"किराया (Rent)\",\"वेतन (Salary)\",\"व्यावसायिक शुल्क\",\"प्रतिभूतियों पर ब्याज\"],\"a\":1,\"ee\":\"Section 192 mandates employers to deduct TDS on estimated salary income.\",\"eh\":\"धारा 192 नियोक्ताओं (employers) को अनुमानित वेतन आय पर टीडीएस काटने का निर्देश देती है।\"},{\"n\":14,\"d\":\"\",\"se\":\"The rate of TDS on the payment of <strong>interest by banks</strong> on Fixed Deposits (under Section 194A) is:\",\"sh\":\"सावधि जमा (Fixed Deposits) पर <strong>बैंकों द्वारा ब्याज</strong> के भुगतान पर (धारा 194A के तहत) टीडीएस की दर क्या है:\",\"oe\":[\"15%\",\"20%\",\"10%\",\"5%\"],\"oh\":[\"15%\",\"20%\",\"10%\",\"5%\"],\"a\":2,\"ee\":\"10% (If PAN is not provided, the rate is 20%).\",\"eh\":\"10% (यदि पैन (PAN) नहीं दिया गया है, तो दर 20% है)।\"},{\"n\":15,\"d\":\"\",\"se\":\"The threshold limit for deducting TDS on <strong>rent</strong> under Section 194-I (for land, building, or furniture) is:\",\"sh\":\"भूमि, भवन या फर्नीचर के लिए <strong>किराए (Rent)</strong> पर धारा 194-I के तहत टीडीएस काटने की सीमा (Threshold limit) है:\",\"oe\":[\"₹5,00,000\",\"₹1,00,000\",\"₹1,80,000\",\"₹2,40,000\"],\"oh\":[\"₹5,00,000\",\"₹1,00,000\",\"₹1,80,000\",\"₹2,40,000\"],\"a\":3,\"ee\":\"₹2,40,000 per financial year.\",\"eh\":\"₹2,40,000 प्रति वित्तीय वर्ष।\"},{\"n\":16,\"d\":\"\",\"se\":\"The TDS rate on payments made to <strong>contractors</strong> (Section 194C) when the payee is an Individual or HUF is:\",\"sh\":\"<strong>ठेकेदारों (Contractors)</strong> को किए गए भुगतान पर टीडीएस दर (धारा 194C) क्या है, जब प्राप्तकर्ता एक व्यक्ति (Individual) या HUF हो:\",\"oe\":[\"1%\",\"0.1%\",\"2%\",\"5%\"],\"oh\":[\"1%\",\"0.1%\",\"2%\",\"5%\"],\"a\":0,\"ee\":\"1% (If the payee is a company or firm, it is 2%).\",\"eh\":\"1% (यदि प्राप्तकर्ता कंपनी या फर्म है, तो यह 2% है)।\"},{\"n\":17,\"d\":\"\",\"se\":\"The monetary threshold limit for deducting TDS on <strong>professional or technical fees</strong> under Section 194J is:\",\"sh\":\"धारा 194J के तहत <strong>व्यावसायिक या तकनीकी शुल्क (Professional fees)</strong> पर टीडीएस काटने के लिए मौद्रिक सीमा क्या है:\",\"oe\":[\"₹20,000\",\"₹30,000\",\"₹50,000\",\"₹1,00,000\"],\"oh\":[\"₹20,000\",\"₹30,000\",\"₹50,000\",\"₹1,00,000\"],\"a\":1,\"ee\":\"₹30,000 per financial year.\",\"eh\":\"₹30,000 प्रति वित्तीय वर्ष।\"},{\"n\":18,\"d\":\"\",\"se\":\"A taxpayer is mandatorily required to pay <strong>Advance Tax</strong> if their estimated net tax liability for the financial year is:\",\"sh\":\"एक करदाता को अनिवार्य रूप से <strong>अग्रिम कर (Advance Tax)</strong> का भुगतान करना आवश्यक है यदि वित्तीय वर्ष के लिए उनकी अनुमानित शुद्ध कर देयता है:\",\"oe\":[\"₹15,000 or more\",\"₹50,000 or more\",\"₹10,000 or more\",\"₹5,000 or more\"],\"oh\":[\"₹15,000 या अधिक\",\"₹50,000 या अधिक\",\"₹10,000 या अधिक\",\"₹5,000 या अधिक\"],\"a\":2,\"ee\":\"₹10,000 or more.\",\"eh\":\"₹10,000 या अधिक।\"},{\"n\":19,\"d\":\"\",\"se\":\"The cumulative percentage of advance tax to be paid by non-corporate taxpayers by the <strong>second instalment (15th September)</strong> is:\",\"sh\":\"गैर-कॉर्पोरेट करदाताओं द्वारा <strong>दूसरी किस्त (15 सितंबर)</strong> तक भुगतान किए जाने वाले अग्रिम कर का संचयी (cumulative) प्रतिशत क्या है:\",\"oe\":[\"30% of total tax\",\"15% of total tax\",\"60% of total tax\",\"45% of total tax\"],\"oh\":[\"कुल कर का 30%\",\"कुल कर का 15%\",\"कुल कर का 60%\",\"कुल कर का 45%\"],\"a\":3,\"ee\":\"The schedule is 15% (Jun), 45% (Sep), 75% (Dec), and 100% (Mar).\",\"eh\":\"अनुसूची 15% (जून), 45% (सितंबर), 75% (दिसंबर), और 100% (मार्च) है।\"},{\"n\":20,\"d\":\"\",\"se\":\"Interest charged under <strong>Section 234B</strong> of the Income Tax Act is levied for:\",\"sh\":\"आयकर अधिनियम की <strong>धारा 234B</strong> के तहत ब्याज किस लिए लगाया जाता है:\",\"oe\":[\"Default in the payment of advance tax (paying less than 90% of assessed tax)\",\"Concealment of income\",\"Late filing of the income tax return\",\"Late payment of TDS to the government\"],\"oh\":[\"अग्रिम कर के भुगतान में चूक (निर्धारित कर का 90% से कम भुगतान)\",\"आय छिपाना\",\"आयकर रिटर्न देर से दाखिल करना\",\"सरकार को टीडीएस का देर से भुगतान\"],\"a\":0,\"ee\":\"Default or shortfall in advance tax payment.\",\"eh\":\"अग्रिम कर (Advance tax) के भुगतान में चूक या कमी।\"},{\"n\":21,\"d\":\"\",\"se\":\"The rate of penal interest levied under Sections 234A, 234B, and 234C is:\",\"sh\":\"धारा 234A, 234B और 234C के तहत लगाए गए दंडात्मक ब्याज (penal interest) की दर क्या है:\",\"oe\":[\"1.5% per month\",\"1% per month or part of a month\",\"12% per annum calculated daily\",\"2% per month\"],\"oh\":[\"1.5% प्रति माह\",\"1% प्रति माह या महीने का हिस्सा\",\"12% प्रति वर्ष दैनिक गणना\",\"2% प्रति माह\"],\"a\":1,\"ee\":\"1% per month or part of a month.\",\"eh\":\"1% प्रति माह या महीने का एक हिस्सा।\"},{\"n\":22,\"d\":\"\",\"se\":\"Taxable <strong>Perquisites</strong> (fringe benefits) provided by an employer are defined under Section:\",\"sh\":\"नियोक्ता द्वारा प्रदान किए जाने वाले कर योग्य <strong>अनुलाभ (Perquisites/fringe benefits)</strong> किस धारा के तहत परिभाषित हैं:\",\"oe\":[\"56\",\"28\",\"17(2)\",\"22\"],\"oh\":[\"56\",\"28\",\"17(2)\",\"22\"],\"a\":2,\"ee\":\"Section 17(2).\",\"eh\":\"धारा 17(2)।\"},{\"n\":24,\"d\":\"\",\"se\":\"<strong>House Rent Allowance (HRA)</strong> exemption is claimed under Section:\",\"sh\":\"<strong>मकान किराया भत्ता (HRA)</strong> की छूट किस धारा के तहत क्लेम की जाती है:\",\"oe\":[\"10(10)\",\"10(15)\",\"10(14)\",\"10(13A)\"],\"oh\":[\"10(10)\",\"10(15)\",\"10(14)\",\"10(13A)\"],\"a\":3,\"ee\":\"Section 10(13A).\",\"eh\":\"धारा 10(13A)।\"},{\"n\":25,\"d\":\"\",\"se\":\"For claiming HRA exemption, the exempted amount is the <strong>least</strong> of the following three:\",\"sh\":\"HRA छूट का दावा करने के लिए, निम्नलिखित तीन में से <strong>सबसे कम (least)</strong> राशि को कर-मुक्त माना जाता है:\",\"oe\":[\"Actual HRA received\",\"50% of salary (for metro cities) or 40% (for non-metros)\",\"Actual rent paid minus 10% of salary\",\"All of the above\"],\"oh\":[\"प्राप्त वास्तविक HRA\",\"वेतन का 50% (मेट्रो शहरों के लिए) या 40% (गैर-मेट्रो के लिए)\",\"भुगतान किया गया वास्तविक किराया माइनस वेतन का 10%\",\"उपरोक्त सभी\"],\"a\":3,\"ee\":\"The least of these three calculations is exempt.\",\"eh\":\"इन तीन गणनाओं में से जो भी सबसे कम हो, वह छूट प्राप्त है।\"},{\"n\":26,\"d\":\"\",\"se\":\"Under the Income Tax Act, <strong>Capital Gains</strong> are broadly categorized into:\",\"sh\":\"आयकर अधिनियम के तहत, <strong>पूंजीगत लाभ (Capital Gains)</strong> को व्यापक रूप से वर्गीकृत किया गया है:\",\"oe\":[\"Short-term and Long-term\",\"Ordinary and Special\",\"Exempt and Taxable\",\"Business and Personal\"],\"oh\":[\"अल्पकालिक और दीर्घकालिक (Short-term and Long-term)\",\"साधारण और विशेष\",\"छूट प्राप्त और कर योग्य\",\"व्यवसाय और व्यक्तिगत\"],\"a\":0,\"ee\":\"Short-term capital gains (STCG) and Long-term capital gains (LTCG).\",\"eh\":\"शॉर्ट-टर्म कैपिटल गेन्स (STCG) और लॉन्ग-टर्म कैपिटल गेन्स (LTCG)।\"},{\"n\":27,\"d\":\"\",\"se\":\"For a resident individual, the holding period required for listed equity shares to qualify as <strong>Long-Term Capital Assets</strong> is more than:\",\"sh\":\"एक निवासी व्यक्ति के लिए, सूचीबद्ध (listed) इक्विटी शेयरों को <strong>दीर्घकालिक पूंजीगत संपत्ति (Long-Term Capital Assets)</strong> के रूप में अर्हता प्राप्त करने के लिए कितनी अवधि तक होल्ड करना आवश्यक है:\",\"oe\":[\"60 months\",\"12 months\",\"36 months\",\"24 months\"],\"oh\":[\"60 महीने से अधिक\",\"12 महीने से अधिक\",\"36 महीने से अधिक\",\"24 महीने से अधिक\"],\"a\":1,\"ee\":\"12 months for listed securities.\",\"eh\":\"सूचीबद्ध प्रतिभूतियों के लिए 12 महीने।\"},{\"n\":28,\"d\":\"\",\"se\":\"The holding period for immovable property (land, building) to qualify as a <strong>Long-Term Capital Asset</strong> is more than:\",\"sh\":\"अचल संपत्ति (Immovable property - भूमि, भवन) को <strong>दीर्घकालिक पूंजीगत संपत्ति</strong> के रूप में अर्हता प्राप्त करने के लिए होल्डिंग अवधि कितनी होनी चाहिए:\",\"oe\":[\"48 months\",\"12 months\",\"24 months\",\"36 months\"],\"oh\":[\"48 महीने से अधिक\",\"12 महीने से अधिक\",\"24 महीने से अधिक\",\"36 महीने से अधिक\"],\"a\":2,\"ee\":\"24 months.\",\"eh\":\"24 महीने।\"},{\"n\":29,\"d\":\"\",\"se\":\"The capital gains exemption under <strong>Section 54</strong> is available on the:\",\"sh\":\"<strong>धारा 54</strong> के तहत पूंजीगत लाभ में छूट किस पर उपलब्ध है:\",\"oe\":[\"Sale of commercial property and buying bonds\",\"Sale of unlisted shares\",\"Sale of agricultural land\",\"Sale of a residential house property and reinvestment in another residential house\"],\"oh\":[\"वाणिज्यिक संपत्ति की बिक्री\",\"गैर-सूचीबद्ध शेयरों की बिक्री\",\"कृषि भूमि की बिक्री\",\"एक आवासीय गृह संपत्ति (Residential house property) की बिक्री और दूसरे आवासीय घर में पुनर्निवेश (reinvestment)\"],\"a\":3,\"ee\":\"Section 54 applies exclusively to residential house property.\",\"eh\":\"धारा 54 विशेष रूप से आवासीय घर की संपत्ति पर लागू होती है।\"},{\"n\":30,\"d\":\"\",\"se\":\"The exemption under <strong>Section 54F</strong> is available when:\",\"sh\":\"<strong>धारा 54F</strong> के तहत छूट तब उपलब्ध होती है जब:\",\"oe\":[\"Any long-term capital asset (other than a residential house) is sold and the net consideration is reinvested in a residential house\",\"A short-term capital asset is sold\",\"A residential house is sold and another house is bought\",\"A commercial building is sold and shares are bought\"],\"oh\":[\"किसी दीर्घकालिक पूंजीगत संपत्ति (आवासीय घर के अलावा) को बेचा जाता है और शुद्ध प्रतिफल को एक आवासीय घर में फिर से निवेश किया जाता है\",\"एक अल्पकालिक पूंजीगत संपत्ति बेची जाती है\",\"एक आवासीय घर बेचा जाता है और दूसरा घर खरीदा जाता है\",\"एक वाणिज्यिक इमारत बेची जाती है और शेयर खरीदे जाते हैं\"],\"a\":0,\"ee\":\"Reinvesting proceeds from assets like shares/jewelry into a residential house.\",\"eh\":\"शेयर/आभूषण जैसी संपत्तियों से प्राप्त आय को आवासीय घर में पुनर्निवेश करना।\"},{\"n\":31,\"d\":\"\",\"se\":\"Capital gains tax on the transfer of <strong>agricultural land</strong> does not apply if the land is:\",\"sh\":\"<strong>कृषि भूमि</strong> के हस्तांतरण पर पूंजीगत लाभ कर लागू नहीं होता है यदि वह भूमि:\",\"oe\":[\"Inherited from ancestors\",\"Located in a rural area (as defined by population metrics)\",\"Held for less than 12 months\",\"Located in a notified urban area\"],\"oh\":[\"पूर्वजों से विरासत में मिली है\",\"ग्रामीण क्षेत्र (जनसंख्या मेट्रिक्स द्वारा परिभाषित) में स्थित है\",\"12 महीने से कम समय के लिए रखी गई है\",\"एक अधिसूचित शहरी क्षेत्र में स्थित है\"],\"a\":1,\"ee\":\"Rural agricultural land is entirely excluded from the definition of a 'Capital Asset'.\",\"eh\":\"ग्रामीण कृषि भूमि को 'पूंजीगत संपत्ति' (Capital Asset) की परिभाषा से पूरी तरह बाहर रखा गया है।\"},{\"n\":32,\"d\":\"\",\"se\":\"The statutory provisions regarding the <strong>‘Clubbing of Income&rsquo;</strong> are contained in Sections:\",\"sh\":\"<strong>'आय की क्लबिंग' (Clubbing of Income)</strong> से संबंधित वैधानिक प्रावधान किन धाराओं में निहित हैं:\",\"oe\":[\"70 to 80\",\"120 to 140\",\"60 to 64\",\"100 to 110\"],\"oh\":[\"70 से 80\",\"120 से 140\",\"60 से 64\",\"100 से 110\"],\"a\":2,\"ee\":\"Sections 60 to 64.\",\"eh\":\"धारा 60 से 64।\"},{\"n\":33,\"d\":\"\",\"se\":\"The income earned by a minor child (not deriving from manual work or special skill) is clubbed with the income of:\",\"sh\":\"एक नाबालिग बच्चे द्वारा अर्जित आय (जो शारीरिक श्रम या विशेष कौशल से प्राप्त नहीं होती है) को किसकी आय के साथ क्लब किया जाता है:\",\"oe\":[\"The legal guardian\",\"The Mother always\",\"The Father always\",\"The parent whose total income (before this clubbing) is higher\"],\"oh\":[\"कानूनी अभिभावक के साथ\",\"हमेशा माता के साथ\",\"हमेशा पिता के साथ\",\"उस माता या पिता के साथ जिसकी कुल आय (इस क्लबिंग से पहले) अधिक हो\"],\"a\":3,\"ee\":\"Clubbed with the higher-earning parent.\",\"eh\":\"अधिक कमाने वाले माता या पिता के साथ क्लब किया जाता है।\"},{\"n\":34,\"d\":\"\",\"se\":\"The rules regarding the <strong>set-off and carry forward of losses</strong> are governed by Sections:\",\"sh\":\"<strong>हानियों के सेट-ऑफ़ और कैरी फ़ॉरवर्ड (Set-off and carry forward of losses)</strong> से संबंधित नियम किन धाराओं द्वारा नियंत्रित होते हैं:\",\"oe\":[\"70 to 80\",\"40 to 50\",\"50 to 60\",\"100 to 110\"],\"oh\":[\"70 से 80\",\"40 से 50\",\"50 से 60\",\"100 से 110\"],\"a\":0,\"ee\":\"Sections 70 to 80.\",\"eh\":\"धारा 70 से 80।\"},{\"n\":35,\"d\":\"\",\"se\":\"<strong>Inter-head adjustment</strong> of losses (setting off loss from one head of income against another head in the same year) is permitted under:\",\"sh\":\"<strong>इंटर-हेड एडजस्टमेंट</strong> (एक ही वर्ष में आय के एक शीर्षक से नुकसान को दूसरे शीर्षक से सेट करना) किस धारा के तहत अनुमत है:\",\"oe\":[\"Section 73\",\"Section 71\",\"Section 72\",\"Section 70\"],\"oh\":[\"धारा 73\",\"धारा 71\",\"धारा 72\",\"धारा 70\"],\"a\":1,\"ee\":\"Section 71.\",\"eh\":\"धारा 71।\"},{\"n\":36,\"d\":\"\",\"se\":\"A loss arising from a <strong>speculation business</strong> can be set off exclusively against:\",\"sh\":\"<strong>सट्टा व्यापार (Speculation business)</strong> से उत्पन्न होने वाले नुकसान को विशेष रूप से किसके विरुद्ध सेट-ऑफ़ किया जा सकता है:\",\"oe\":[\"Income from House Property\",\"Income from Salary\",\"Profits from another speculation business\",\"Short-Term Capital Gains\"],\"oh\":[\"गृह संपत्ति से आय\",\"वेतन से आय\",\"किसी अन्य सट्टा व्यापार से होने वाला लाभ\",\"अल्पकालिक पूंजीगत लाभ\"],\"a\":2,\"ee\":\"Speculative losses can only be set off against speculative profits.\",\"eh\":\"सट्टा घाटे को केवल सट्टा मुनाफे के विरुद्ध ही सेट-ऑफ़ किया जा सकता है।\"},{\"n\":37,\"d\":\"\",\"se\":\"What is the maximum period for which a normal <strong>business loss</strong> (non-speculative) can be carried forward?\",\"sh\":\"एक सामान्य <strong>व्यापारिक हानि (Business loss)</strong> (गैर-सट्टा) को अधिकतम कितनी अवधि के लिए आगे (carry forward) ले जाया जा सकता है?\",\"oe\":[\"4 Assessment Years\",\"6 Assessment Years\",\"Indefinitely\",\"8 Assessment Years\"],\"oh\":[\"4 आकलन वर्ष\",\"6 आकलन वर्ष\",\"अनिश्चित काल तक\",\"8 आकलन वर्ष\"],\"a\":3,\"ee\":\"8 Assessment Years.\",\"eh\":\"8 आकलन वर्ष (Assessment Years)।\"},{\"n\":38,\"d\":\"\",\"se\":\"Both Short-Term and Long-Term <strong>Capital Losses</strong> can be carried forward for a maximum of:\",\"sh\":\"अल्पकालिक और दीर्घकालिक दोनों <strong>पूंजीगत हानियों (Capital Losses)</strong> को अधिकतम कितने समय के लिए आगे (carry forward) ले जाया जा सकता है:\",\"oe\":[\"8 years\",\"4 years\",\"10 years\",\"6 years\"],\"oh\":[\"8 वर्ष\",\"4 वर्ष\",\"10 वर्ष\",\"6 वर्ष\"],\"a\":0,\"ee\":\"8 Assessment Years.\",\"eh\":\"8 आकलन वर्ष।\"},{\"n\":39,\"d\":\"\",\"se\":\"A regular <strong>Scrutiny Assessment</strong> of income is conducted by the Assessing Officer under Section:\",\"sh\":\"आय का एक नियमित <strong>स्क्रूटनी असेसमेंट (Scrutiny Assessment)</strong> असेसिंग ऑफिसर (AO) द्वारा किस धारा के तहत किया जाता है:\",\"oe\":[\"147\",\"143(3)\",\"140A\",\"139\"],\"oh\":[\"147\",\"143(3)\",\"140A\",\"139\"],\"a\":1,\"ee\":\"Section 143(3).\",\"eh\":\"धारा 143(3)।\"},{\"n\":40,\"d\":\"\",\"se\":\"Under recent amendments (applicable currently), the time limit for the completion of a scrutiny assessment under Section 143(3) is generally:\",\"sh\":\"हाल के संशोधनों (वर्तमान में लागू) के तहत, धारा 143(3) के अंतर्गत स्क्रूटनी असेसमेंट (Scrutiny assessment) पूरा करने की समय सीमा सामान्यतः क्या है:\",\"oe\":[\"24 months from the end of the Assessment Year\",\"3 years from the date of filing the return\",\"12 months from the end of the Assessment Year\",\"9 months from the end of the Assessment Year\"],\"oh\":[\"आकलन वर्ष के अंत से 24 महीने\",\"रिटर्न दाखिल करने की तिथि से 3 वर्ष\",\"आकलन वर्ष (AY) के अंत से 12 महीने\",\"आकलन वर्ष (AY) के अंत से 9 महीने\"],\"a\":2,\"ee\":\"12 months from the end of the relevant Assessment Year.\",\"eh\":\"संबंधित आकलन वर्ष (Assessment Year) के अंत से 12 महीने।\"},{\"n\":41,\"d\":\"\",\"se\":\"If the Assessing Officer has reason to believe that income has escaped assessment, a notice for <strong>Reassessment</strong> is issued under Section:\",\"sh\":\"यदि असेसिंग ऑफिसर (AO) के पास यह विश्वास करने का कारण है कि आय कर-निर्धारण से बच गई है (escaped assessment), तो <strong>पुनर्मूल्यांकन (Reassessment)</strong> के लिए नोटिस किस धारा के तहत जारी किया जाता है:\",\"oe\":[\"143(2)\",\"144\",\"156\",\"148\"],\"oh\":[\"143(2)\",\"144\",\"156\",\"148\"],\"a\":3,\"ee\":\"Section 148 (initiating reassessment under Sec 147).\",\"eh\":\"धारा 148 (धारा 147 के तहत पुनर्मूल्यांकन शुरू करने के लिए)।\"},{\"n\":42,\"d\":\"\",\"se\":\"The standard <strong>rate of income tax</strong> for a domestic company (under the old regime, assuming turnover exceeds ₹400 Cr) is:\",\"sh\":\"एक घरेलू कंपनी (पुरानी व्यवस्था के तहत, यह मानते हुए कि टर्नओवर ₹400 करोड़ से अधिक है) के लिए <strong>आयकर की मानक दर</strong> क्या है:\",\"oe\":[\"30%\",\"15%\",\"22%\",\"25%\"],\"oh\":[\"30%\",\"15%\",\"22%\",\"25%\"],\"a\":0,\"ee\":\"30% (plus applicable surcharge and cess).\",\"eh\":\"30% (प्लस लागू अधिभार और उपकर)।\"},{\"n\":43,\"d\":\"\",\"se\":\"For an individual opting for the old tax regime, the <strong>surcharge</strong> levied on total income falling between ₹50 lakh and ₹1 crore is:\",\"sh\":\"पुरानी कर व्यवस्था को चुनने वाले व्यक्ति के लिए, ₹50 लाख और ₹1 करोड़ के बीच की कुल आय पर लगाया जाने वाला <strong>अधिभार (Surcharge)</strong> है:\",\"oe\":[\"15% of income tax\",\"10% of income tax\",\"20% of income tax\",\"25% of income tax\"],\"oh\":[\"आयकर का 15%\",\"आयकर का 10%\",\"आयकर का 20%\",\"आयकर का 25%\"],\"a\":1,\"ee\":\"10% surcharge.\",\"eh\":\"10% अधिभार।\"},{\"n\":44,\"d\":\"\",\"se\":\"The <strong>Health and Education Cess</strong> is levied on the aggregate of income tax and surcharge at the rate of:\",\"sh\":\"आयकर और अधिभार के कुल योग पर <strong>स्वास्थ्य और शिक्षा उपकर (Health and Education Cess)</strong> किस दर से लगाया जाता है:\",\"oe\":[\"5%\",\"2%\",\"4%\",\"3%\"],\"oh\":[\"5%\",\"2%\",\"4%\",\"3%\"],\"a\":2,\"ee\":\"4%.\",\"eh\":\"4%।\"},{\"n\":45,\"d\":\"\",\"se\":\"Under the <strong>New Tax Regime</strong> (Section 115BAC), the peak marginal tax rate for income exceeding ₹15 lakh is:\",\"sh\":\"<strong>नई कर व्यवस्था</strong> (धारा 115BAC) के तहत, ₹15 लाख से अधिक की आय के लिए पीक सीमांत कर दर (Peak marginal tax rate) क्या है:\",\"oe\":[\"25%\",\"40%\",\"35%\",\"30%\"],\"oh\":[\"25%\",\"40%\",\"35%\",\"30%\"],\"a\":3,\"ee\":\"30%.\",\"eh\":\"30%।\"},{\"n\":46,\"d\":\"\",\"se\":\"<strong>Dividend income</strong> received by an individual shareholder is taxable under the head:\",\"sh\":\"एक व्यक्तिगत शेयरधारक को प्राप्त <strong>लाभांश आय (Dividend income)</strong> किस शीर्षक के तहत कर योग्य है:\",\"oe\":[\"Income from Other Sources (IFOS)\",\"Income from House Property\",\"Capital Gains\",\"Income from Salary\"],\"oh\":[\"अन्य स्रोतों से आय (Income from Other Sources - IFOS)\",\"गृह संपत्ति से आय\",\"पूंजीगत लाभ\",\"वेतन से आय\"],\"a\":0,\"ee\":\"Income from Other Sources.\",\"eh\":\"अन्य स्रोतों से आय।\"},{\"n\":47,\"d\":\"\",\"se\":\"<strong>Interest earned on a savings bank account</strong> is taxable under which head of income?\",\"sh\":\"<strong>बचत बैंक खाते (Savings bank account) पर अर्जित ब्याज</strong> आय के किस शीर्षक के तहत कर योग्य है?\",\"oe\":[\"Profits and Gains of Business or Profession\",\"Income from Other Sources\",\"Capital Gains\",\"Income from Salary\"],\"oh\":[\"व्यापार या पेशे का लाभ और लाभ\",\"अन्य स्रोतों से आय\",\"पूंजीगत लाभ\",\"वेतन से आय\"],\"a\":1,\"ee\":\"Income from Other Sources.\",\"eh\":\"अन्य स्रोतों से आय।\"},{\"n\":48,\"d\":\"\",\"se\":\"The specific exemption limit under Section 10(32) in respect of the clubbed income of a minor child is:\",\"sh\":\"नाबालिग बच्चे की क्लब की गई आय के संबंध में धारा 10(32) के तहत विशिष्ट <strong>छूट सीमा (Exemption limit)</strong> है:\",\"oe\":[\"₹5,000 per child\",\"₹1,000 per child\",\"₹1,500 per child\",\"₹2,500 per child\"],\"oh\":[\"₹5,000 प्रति बच्चा\",\"₹1,000 प्रति बच्चा\",\"₹1,500 प्रति बच्चा\",\"₹2,500 प्रति बच्चा\"],\"a\":2,\"ee\":\"Up to ₹1,500 per child per annum.\",\"eh\":\"अधिकतम ₹1,500 प्रति बच्चा प्रति वर्ष।\"},{\"n\":49,\"d\":\"\",\"se\":\"Winnings from lotteries, crossword puzzles, races, and game shows are taxed at a flat rate of:\",\"sh\":\"लॉटरी, क्रॉसवर्ड पज़ल, रेस और गेम शो से होने वाली जीत (Winnings) पर किस फ्लैट दर से कर लगाया जाता है:\",\"oe\":[\"40%\",\"20%\",\"10%\",\"30%\"],\"oh\":[\"40%\",\"20%\",\"10%\",\"30%\"],\"a\":3,\"ee\":\"30% (Under Section 115BB, plus cess and surcharge).\",\"eh\":\"30% (धारा 115BB के तहत, प्लस उपकर और अधिभार)।\"},{\"n\":50,\"d\":\"\",\"se\":\"Under GST, the broad definition of <strong>‘Supply&rsquo;</strong> includes:\",\"sh\":\"जीएसटी (GST) के तहत, <strong>'आपूर्ति' (Supply)</strong> की व्यापक परिभाषा में शामिल है:\",\"oe\":[\"All forms of supply such as sale, transfer, barter, exchange, license, rental, lease, or disposal made for a consideration in the course of business\",\"Only transfer of title\",\"Only supply of goods, not services\",\"Only physical sale of goods\"],\"oh\":[\"व्यवसाय के दौरान प्रतिफल (consideration) के लिए की गई बिक्री, हस्तांतरण, वस्तु विनिमय, लाइसेंस, किराये, पट्टे या निपटान जैसे आपूर्ति के सभी रूप\",\"केवल स्वामित्व (Title) का हस्तांतरण\",\"केवल माल की आपूर्ति, सेवाओं की नहीं\",\"केवल माल की भौतिक बिक्री\"],\"a\":0,\"ee\":\"It covers all forms of business transactions for consideration.\",\"eh\":\"यह प्रतिफल (consideration) के लिए व्यावसायिक लेनदेन के सभी रूपों को कवर करता है।\"},{\"n\":51,\"d\":\"\",\"se\":\"<strong>Schedule III</strong> of the CGST Act strictly specifies:\",\"sh\":\"CGST अधिनियम की <strong>अनुसूची III (Schedule III)</strong> सख्ती से किसे निर्दिष्ट करती है:\",\"oe\":[\"Goods eligible for the Composition scheme\",\"Activities or transactions that are treated neither as a supply of goods nor a supply of services (Non-taxable supplies)\",\"Exempt supplies\",\"Blocked Input Tax Credits\"],\"oh\":[\"संरचना योजना (Composition scheme) के लिए पात्र माल\",\"वे गतिविधियां या लेनदेन जिन्हें न तो माल की आपूर्ति और न ही सेवाओं की आपूर्ति के रूप में माना जाता है (गैर-कर योग्य आपूर्तियां)\",\"छूट प्राप्त आपूर्तियां (Exempt supplies)\",\"अवरुद्ध इनपुट टैक्स क्रेडिट (Blocked ITC)\"],\"a\":1,\"ee\":\"Examples include services by an employee to an employer, or functions performed by MPs/MLAs.\",\"eh\":\"उदाहरणों में एक कर्मचारी द्वारा नियोक्ता को दी गई सेवाएं, या सांसदों/विधायकों द्वारा किए गए कार्य शामिल हैं।\"},{\"n\":52,\"d\":\"\",\"se\":\"Under the forward charge mechanism, the <strong>Time of Supply</strong> for goods is generally the:\",\"sh\":\"फॉरवर्ड चार्ज मैकेनिज्म के तहत, माल के लिए <strong>आपूर्ति का समय (Time of Supply)</strong> आमतौर पर होता है:\",\"oe\":[\"Date of physical delivery\",\"Date of receipt of payment\",\"Date of issue of invoice or date of receipt of payment, whichever is earlier\",\"Date of invoice\"],\"oh\":[\"भौतिक वितरण की तिथि\",\"भुगतान प्राप्ति की तिथि\",\"चालान जारी करने की तिथि या भुगतान प्राप्त होने की तिथि, जो भी पहले हो\",\"चालान की तिथि\"],\"a\":2,\"ee\":\"The earlier of the invoice date (or last date it should be issued) or the payment receipt date.\",\"eh\":\"चालान की तिथि (या वह अंतिम तिथि जब इसे जारी किया जाना चाहिए) या भुगतान प्राप्ति की तिथि में से जो पहले हो।\"},{\"n\":53,\"d\":\"\",\"se\":\"Under the <strong>Reverse Charge Mechanism (RCM)</strong> for goods, the Time of Supply is the earliest of:\",\"sh\":\"माल के लिए <strong>रिवर्स चार्ज मैकेनिज्म (RCM)</strong> के तहत, 'आपूर्ति का समय' (Time of Supply) निम्नलिखित में से सबसे प्रारंभिक (earliest) है:\",\"oe\":[\"Date immediately following 30 days from the date of invoice\",\"Date of receipt of goods\",\"Date of payment recorded in books\",\"The earliest of (A), (B), or (C)\"],\"oh\":[\"आपूर्तिकर्ता के चालान की तिथि से 30 दिनों के तुरंत बाद की तिथि (31st day)\",\"माल की प्राप्ति की तिथि\",\"पुस्तकों में दर्ज भुगतान की तिथि\",\"(A), (B), या (C) में से जो भी सबसे पहले हो\"],\"a\":3,\"ee\":\"Earliest of receipt, payment, or 31st day from supplier's invoice.\",\"eh\":\"प्राप्ति, भुगतान, या आपूर्तिकर्ता के चालान से 31वें दिन में से जो भी सबसे पहले हो।\"},{\"n\":54,\"d\":\"\",\"se\":\"When a supply involves the movement of goods, the <strong>Place of Supply</strong> is legally considered to be the:\",\"sh\":\"जब किसी आपूर्ति में माल की आवाजाही शामिल होती है, तो <strong>आपूर्ति का स्थान (Place of Supply)</strong> कानूनी रूप से किसे माना जाता है:\",\"oe\":[\"Place where the movement of goods terminates for delivery to the recipient (Destination)\",\"Place of origin of the goods\",\"Place of the supplier's billing office\",\"State where the supplier is registered\"],\"oh\":[\"वह स्थान जहाँ प्राप्तकर्ता को वितरण के लिए माल की आवाजाही समाप्त होती है (गंतव्य)\",\"माल की उत्पत्ति का स्थान\",\"आपूर्तिकर्ता के बिलिंग कार्यालय का स्थान\",\"वह राज्य जहाँ आपूर्तिकर्ता पंजीकृत है\"],\"a\":0,\"ee\":\"The termination point for delivery.\",\"eh\":\"वितरण के लिए समाप्ति बिंदु (Destination)।\"},{\"n\":55,\"d\":\"\",\"se\":\"The <strong>Place of Supply</strong> for general B2B services provided to a registered person is the:\",\"sh\":\"किसी पंजीकृत व्यक्ति को प्रदान की जाने वाली सामान्य B2B सेवाओं के लिए <strong>आपूर्ति का स्थान</strong> क्या है:\",\"oe\":[\"Location of the payment bank\",\"Location of the recipient (registered person)\",\"Location where the service is physically performed\",\"Location of the supplier\"],\"oh\":[\"भुगतान बैंक का स्थान\",\"प्राप्तकर्ता का स्थान (पंजीकृत व्यक्ति)\",\"वह स्थान जहाँ सेवा भौतिक रूप से की जाती है\",\"आपूर्तिकर्ता का स्थान\"],\"a\":1,\"ee\":\"Location of such registered person.\",\"eh\":\"ऐसे पंजीकृत व्यक्ति (प्राप्तकर्ता) का स्थान।\"},{\"n\":56,\"d\":\"\",\"se\":\"Under GST, the <strong>Value of Supply</strong> for unrelated parties where price is the sole consideration is the:\",\"sh\":\"जीएसटी के तहत, असंबद्ध (unrelated) पक्षों के लिए जहां मूल्य ही एकमात्र प्रतिफल (sole consideration) है, <strong>आपूर्ति का मूल्य (Value of Supply)</strong> क्या होता है:\",\"oe\":[\"Manufacturing Cost Price\",\"Maximum Retail Price (MRP)\",\"Transaction Value (price actually paid or payable)\",\"MRP minus standard discount\"],\"oh\":[\"विनिर्माण लागत मूल्य\",\"अधिकतम खुदरा मूल्य (MRP)\",\"लेनदेन मूल्य (Transaction Value - वास्तव में भुगतान की गई या देय कीमत)\",\"MRP माइनस मानक छूट\"],\"a\":2,\"ee\":\"Transaction Value (Section 15).\",\"eh\":\"लेनदेन मूल्य (धारा 15)।\"},{\"n\":57,\"d\":\"\",\"se\":\"A registered taxpayer can claim <strong>Input Tax Credit (ITC)</strong> on:\",\"sh\":\"एक पंजीकृत करदाता <strong>इनपुट टैक्स क्रेडिट (ITC)</strong> का दावा किस पर कर सकता है:\",\"oe\":[\"Only input services like transport\",\"Only heavy capital goods\",\"Only raw material inputs\",\"Inputs, capital goods, and input services used in the course or furtherance of business\"],\"oh\":[\"परिवहन जैसी केवल इनपुट सेवाएं\",\"केवल भारी पूंजीगत माल\",\"केवल कच्चा माल इनपुट\",\"व्यवसाय के दौरान या उसे आगे बढ़ाने के लिए उपयोग किए जाने वाले इनपुट, पूंजीगत माल और इनपुट सेवाएं\"],\"a\":3,\"ee\":\"All three, provided they are for business use.\",\"eh\":\"तीनों पर, बशर्ते वे व्यावसायिक उपयोग के लिए हों।\"},{\"n\":58,\"d\":\"\",\"se\":\"<strong>ITC</strong> is strictly blocked and not available for:\",\"sh\":\"<strong>ITC</strong> सख्ती से अवरुद्ध (blocked) है और किसके लिए उपलब्ध नहीं है:\",\"oe\":[\"Goods and services used for making exempt supplies\",\"Capital goods used for business manufacturing\",\"Goods exported out of India\",\"Goods used for making zero-rated supplies\"],\"oh\":[\"छूट प्राप्त (Exempt) आपूर्तियां करने के लिए उपयोग की जाने वाली वस्तुएं और सेवाएं\",\"व्यवसाय विनिर्माण के लिए उपयोग किया जाने वाला पूंजीगत माल\",\"भारत से बाहर निर्यात किया गया माल\",\"शून्य-रेटेड (zero-rated) आपूर्तियां करने के लिए उपयोग किया जाने वाला माल\"],\"a\":0,\"ee\":\"ITC is not allowed against exempt supplies.\",\"eh\":\"छूट प्राप्त आपूर्तियों (Exempt supplies) के विरुद्ध ITC की अनुमति नहीं है।\"},{\"n\":59,\"d\":\"\",\"se\":\"The maximum time limit to claim <strong>ITC</strong> pertaining to a specific financial year is the:\",\"sh\":\"किसी विशिष्ट वित्तीय वर्ष से संबंधित <strong>ITC</strong> का दावा करने की अधिकतम समय सीमा क्या है:\",\"oe\":[\"31st March of that financial year\",\"30th November of the following financial year (or actual date of filing annual return, whichever is earlier)\",\"30th September of the following financial year\",\"31st December of the following financial year\"],\"oh\":[\"उस वित्तीय वर्ष का 31 मार्च\",\"अगले वित्तीय वर्ष का 30 नवंबर (या वार्षिक रिटर्न दाखिल करने की वास्तविक तिथि, जो भी पहले हो)\",\"अगले वित्तीय वर्ष का 30 सितंबर\",\"अगले वित्तीय वर्ष का 31 दिसंबर\"],\"a\":1,\"ee\":\"30th November of the subsequent FY.\",\"eh\":\"बाद के वित्तीय वर्ष का 30 नवंबर।\"},{\"n\":60,\"d\":\"\",\"se\":\"The <strong>Inverted Duty Structure</strong> under GST refers to a scenario where:\",\"sh\":\"जीएसटी के तहत <strong>इनवर्टेड ड्यूटी स्ट्रक्चर (Inverted Duty Structure)</strong> उस परिदृश्य को संदर्भित करता है जहाँ:\",\"oe\":[\"The final output is completely zero-rated\",\"No GST is paid on inputs\",\"The GST rate paid on inputs is higher than the GST rate payable on the final output\",\"The GST rate on output is higher than inputs\"],\"oh\":[\"अंतिम आउटपुट पूरी तरह से शून्य-रेटेड है\",\"इनपुट पर कोई जीएसटी नहीं दिया जाता है\",\"इनपुट (कच्चे माल) पर भुगतान की गई जीएसटी दर अंतिम आउटपुट (उत्पाद) पर देय जीएसटी दर से अधिक होती है\",\"आउटपुट पर जीएसटी दर इनपुट से अधिक होती है\"],\"a\":2,\"ee\":\"This creates an accumulation of ITC, eligible for refund.\",\"eh\":\"इससे ITC का संचय होता है, जो रिफंड के लिए योग्य है।\"},{\"n\":61,\"d\":\"\",\"se\":\"<strong>Registration</strong> under GST is mandatory for a supplier dealing exclusively in goods (in normal category states) if their aggregate turnover exceeds:\",\"sh\":\"केवल वस्तुओं (goods) का व्यापार करने वाले आपूर्तिकर्ता (सामान्य श्रेणी के राज्यों में) के लिए जीएसटी के तहत <strong>पंजीकरण (Registration)</strong> अनिवार्य है यदि उनका कुल टर्नओवर अधिक हो:\",\"oe\":[\"₹10 lakh\",\"₹50 lakh\",\"₹20 lakh\",\"₹40 lakh\"],\"oh\":[\"₹10 लाख\",\"₹50 लाख\",\"₹20 लाख\",\"₹40 लाख\"],\"a\":3,\"ee\":\"₹40 lakh limit applies to exclusive goods suppliers in normal states.\",\"eh\":\"सामान्य राज्यों में विशेष वस्तु आपूर्तिकर्ताओं पर ₹40 लाख की सीमा लागू होती है।\"},{\"n\":62,\"d\":\"\",\"se\":\"For determining GST registration thresholds, the <strong>Aggregate Turnover</strong> includes:\",\"sh\":\"जीएसटी पंजीकरण सीमा का निर्धारण करने के लिए, <strong>कुल टर्नओवर (Aggregate Turnover)</strong> में शामिल हैं:\",\"oe\":[\"Taxable supplies, exempt supplies, zero-rated supplies, and exports of persons with the same PAN\",\"Only intra-state supplies\",\"Only taxable supplies\",\"Only inter-state supplies\"],\"oh\":[\"एक ही पैन (PAN) वाले व्यक्तियों की कर योग्य आपूर्तियाँ, छूट प्राप्त आपूर्तियाँ, शून्य-रेटेड आपूर्तियाँ और निर्यात\",\"केवल अंतर-राज्यीय आपूर्तियां\",\"केवल कर योग्य आपूर्तियां\",\"केवल अंतर्राज्यीय आपूर्तियां\"],\"a\":0,\"ee\":\"It is a comprehensive PAN-India total.\",\"eh\":\"यह एक व्यापक पैन-इंडिया कुल (PAN-India total) है।\"},{\"n\":63,\"d\":\"\",\"se\":\"The <strong>Standard Composition Scheme</strong> (Section 10(1)) under GST is generally available to eligible taxpayers with an aggregate turnover in the preceding FY up to:\",\"sh\":\"जीएसटी के तहत <strong>मानक संरचना योजना (Standard Composition Scheme - धारा 10(1))</strong> आम तौर पर उन पात्र करदाताओं के लिए उपलब्ध है जिनका पिछले वित्तीय वर्ष में कुल टर्नओवर था:\",\"oe\":[\"₹5 crore\",\"₹1.5 crore\",\"₹2 crore\",\"₹50 lakh\"],\"oh\":[\"₹5 करोड़ तक\",\"₹1.5 करोड़ तक\",\"₹2 करोड़ तक\",\"₹50 लाख तक\"],\"a\":1,\"ee\":\"₹1.5 crore (₹75 lakh for special category states).\",\"eh\":\"₹1.5 करोड़ (विशेष श्रेणी के राज्यों के लिए ₹75 लाख)।\"},{\"n\":64,\"d\":\"\",\"se\":\"The total rate of GST payable under the Composition Scheme by a <strong>manufacturer</strong> of goods is:\",\"sh\":\"वस्तुओं के <strong>निर्माता (manufacturer)</strong> द्वारा संरचना योजना (Composition Scheme) के तहत देय जीएसटी की कुल दर है:\",\"oe\":[\"6%\",\"2%\",\"1% (0.5% CGST + 0.5% SGST) of turnover\",\"5%\"],\"oh\":[\"6%\",\"2%\",\"टर्नओवर का 1% (0.5% CGST + 0.5% SGST)\",\"5%\"],\"a\":2,\"ee\":\"1% flat rate on turnover in the state.\",\"eh\":\"राज्य में टर्नओवर पर 1% फ्लैट दर।\"},{\"n\":65,\"d\":\"\",\"se\":\"A taxpayer registered under the <strong>Composition Scheme</strong>:\",\"sh\":\"<strong>संरचना योजना (Composition Scheme)</strong> के तहत पंजीकृत करदाता:\",\"oe\":[\"Can claim Input Tax Credit on purchases\",\"Can legally collect GST from customers\",\"Can issue a standard 'Tax Invoice'\",\"Cannot collect any tax from customers and cannot claim ITC\"],\"oh\":[\"खरीद पर इनपुट टैक्स क्रेडिट का दावा कर सकता है\",\"कानूनी रूप से ग्राहकों से जीएसटी वसूल सकता है\",\"एक मानक 'टैक्स इनवॉइस' जारी कर सकता है\",\"ग्राहकों से कोई कर वसूल नहीं कर सकता है और आईटीसी (ITC) का दावा नहीं कर सकता है\"],\"a\":3,\"ee\":\"They must issue a &quot;Bill of Supply&quot; and absorb the tax cost.\",\"eh\":\"उन्हें &quot;बिल ऑफ सप्लाई&quot; जारी करना होगा और कर लागत (tax cost) को स्वयं वहन करना होगा।\"},{\"n\":66,\"d\":\"\",\"se\":\"The <strong>GSTR-1</strong> return filed by a registered person contains details of:\",\"sh\":\"पंजीकृत व्यक्ति द्वारा दाखिल <strong>GSTR-1</strong> रिटर्न में किसका विवरण होता है:\",\"oe\":[\"Outward supplies (Sales)\",\"Annual reconciliation\",\"Final payment of tax\",\"Inward supplies (Purchases)\"],\"oh\":[\"जावक आपूर्तियां (बिक्री / Outward supplies)\",\"वार्षिक समाधान (Annual reconciliation)\",\"कर का अंतिम भुगतान\",\"आवक आपूर्तियां (खरीद)\"],\"a\":0,\"ee\":\"Outward supplies.\",\"eh\":\"जावक आपूर्तियां (Outward supplies)।\"},{\"n\":67,\"d\":\"\",\"se\":\"The due date for filing <strong>GSTR-1</strong> for taxpayers filing on a monthly basis is the:\",\"sh\":\"मासिक आधार पर रिटर्न दाखिल करने वाले करदाताओं के लिए <strong>GSTR-1</strong> दाखिल करने की नियत तिथि है:\",\"oe\":[\"20th of the following month\",\"11th of the following month\",\"15th of the following month\",\"10th of the following month\"],\"oh\":[\"अगले महीने की 20 तारीख\",\"अगले महीने की 11 तारीख\",\"अगले महीने की 15 तारीख\",\"अगले महीने की 10 तारीख\"],\"a\":1,\"ee\":\"11th of the succeeding month.\",\"eh\":\"अगले महीने की 11 तारीख।\"},{\"n\":68,\"d\":\"\",\"se\":\"The standard due date for filing the monthly summary return, <strong>GSTR-3B</strong>, is the:\",\"sh\":\"मासिक सारांश रिटर्न, <strong>GSTR-3B</strong> दाखिल करने की मानक नियत तिथि है:\",\"oe\":[\"10th of the following month\",\"30th of the following month\",\"20th of the following month\",\"15th of the following month\"],\"oh\":[\"अगले महीने की 10 तारीख\",\"अगले महीने की 30 तारीख\",\"अगले महीने की 20 तारीख\",\"अगले महीने की 15 तारीख\"],\"a\":2,\"ee\":\"20th of the succeeding month.\",\"eh\":\"अगले महीने की 20 तारीख।\"},{\"n\":69,\"d\":\"\",\"se\":\"The mandatory <strong>Annual Return</strong> under regular GST provisions is filed in Form:\",\"sh\":\"नियमित जीएसटी प्रावधानों के तहत अनिवार्य <strong>वार्षिक रिटर्न (Annual Return)</strong> किस फॉर्म में दाखिल किया जाता है:\",\"oe\":[\"GSTR-3B\",\"GSTR-10\",\"GSTR-1\",\"GSTR-9\"],\"oh\":[\"GSTR-3B\",\"GSTR-10\",\"GSTR-1\",\"GSTR-9\"],\"a\":3,\"ee\":\"GSTR-9.\",\"eh\":\"GSTR-9।\"},{\"n\":70,\"d\":\"\",\"se\":\"The statutory due date for filing the Annual Return (<strong>GSTR-9</strong>) is:\",\"sh\":\"वार्षिक रिटर्न (<strong>GSTR-9</strong>) दाखिल करने की वैधानिक नियत तिथि है:\",\"oe\":[\"31st December of the following Financial Year\",\"30th September of the following FY\",\"31st March of the current FY\",\"30th June of the following FY\"],\"oh\":[\"अगले वित्तीय वर्ष का 31 दिसंबर\",\"अगले वित्तीय वर्ष का 30 सितंबर\",\"चालू वित्तीय वर्ष का 31 मार्च\",\"अगले वित्तीय वर्ष का 30 जून\"],\"a\":0,\"ee\":\"31st December.\",\"eh\":\"31 दिसंबर।\"},{\"n\":71,\"d\":\"\",\"se\":\"Generating an <strong>E-way Bill</strong> is generally mandatory for the inter-state movement of goods when the consignment value exceeds:\",\"sh\":\"वस्तुओं के अंतर-राज्यीय आवाजाही के लिए <strong>ई-वे बिल (E-way Bill)</strong> बनाना आम तौर पर अनिवार्य है जब खेप (consignment) का मूल्य इससे अधिक हो:\",\"oe\":[\"₹25,000\",\"₹50,000\",\"₹5,00,000\",\"₹1,00,000\"],\"oh\":[\"₹25,000\",\"₹50,000\",\"₹5,00,000\",\"₹1,00,000\"],\"a\":1,\"ee\":\"₹50,000.\",\"eh\":\"₹50,000।\"},{\"n\":72,\"d\":\"\",\"se\":\"The <strong>E-way Bill</strong> portal is developed and officially maintained by the:\",\"sh\":\"<strong>ई-वे बिल</strong> पोर्टल किसके द्वारा विकसित और आधिकारिक तौर पर प्रबंधित किया जाता है:\",\"oe\":[\"RBI (Reserve Bank of India)\",\"MCA (Ministry of Corporate Affairs)\",\"NIC (National Informatics Centre)\",\"GSTN (Goods and Services Tax Network)\"],\"oh\":[\"RBI (भारतीय रिजर्व बैंक)\",\"MCA (कॉर्पोरेट मामलों का मंत्रालय)\",\"NIC (राष्ट्रीय सूचना विज्ञान केंद्र / National Informatics Centre)\",\"GSTN (गुड्स एंड सर्विसेज टैक्स नेटवर्क)\"],\"a\":2,\"ee\":\"The NIC operates the e-way bill system.\",\"eh\":\"NIC ई-वे बिल सिस्टम संचालित करता है।\"},{\"n\":73,\"d\":\"\",\"se\":\"<strong>Tax Deducted at Source (TDS) under GST</strong> (Section 51) is required to be deducted primarily by:\",\"sh\":\"<strong>जीएसटी के तहत टीडीएस (TDS under GST - धारा 51)</strong> मुख्य रूप से किसके द्वारा काटा जाना आवश्यक है:\",\"oe\":[\"All exporters\",\"All registered corporate taxpayers\",\"Unregistered individuals\",\"Government departments, local authorities, and notified governmental agencies\"],\"oh\":[\"सभी निर्यातक\",\"सभी पंजीकृत कॉर्पोरेट करदाता\",\"अपंजीकृत व्यक्ति\",\"सरकारी विभाग, स्थानीय प्राधिकरण और अधिसूचित सरकारी एजेंसियां\"],\"a\":3,\"ee\":\"For contract values exceeding ₹2.5 Lakhs.\",\"eh\":\"₹2.5 लाख से अधिक के अनुबंध मूल्यों के लिए सरकारी और अधिसूचित संस्थाएं।\"},{\"n\":74,\"d\":\"\",\"se\":\"The statutory rate of <strong>TDS under GST</strong> is:\",\"sh\":\"<strong>जीएसटी के तहत टीडीएस</strong> की वैधानिक दर क्या है:\",\"oe\":[\"2% (1% CGST + 1% SGST)\",\"1%\",\"10%\",\"5%\"],\"oh\":[\"2% (1% CGST + 1% SGST)\",\"1%\",\"10%\",\"5%\"],\"a\":0,\"ee\":\"2% total.\",\"eh\":\"कुल 2%।\"},{\"n\":75,\"d\":\"\",\"se\":\"E-commerce operators must collect <strong>Tax Collected at Source (TCS) under GST</strong> at the rate of:\",\"sh\":\"ई-कॉमर्स ऑपरेटरों को किस दर पर <strong>जीएसटी के तहत टीसीएस (TCS under GST)</strong> एकत्र करना आवश्यक है:\",\"oe\":[\"5%\",\"1% (0.5% CGST + 0.5% SGST)\",\"10%\",\"2%\"],\"oh\":[\"5%\",\"1% (0.5% CGST + 0.5% SGST)\",\"10%\",\"2%\"],\"a\":1,\"ee\":\"1% total.\",\"eh\":\"कुल 1%।\"},{\"n\":76,\"d\":\"\",\"se\":\"The <strong>Reverse Charge Mechanism (RCM)</strong> under GST implies that the liability to pay tax rests on the:\",\"sh\":\"जीएसटी के तहत <strong>रिवर्स चार्ज मैकेनिज्म (RCM)</strong> का तात्पर्य है कि कर का भुगतान करने का दायित्व किस पर है:\",\"oe\":[\"Supplier of goods/services\",\"E-commerce operator\",\"Recipient of specified goods/services\",\"Transporter\"],\"oh\":[\"माल/सेवाओं का आपूर्तिकर्ता\",\"ई-कॉमर्स ऑपरेटर\",\"निर्दिष्ट माल/सेवाओं का प्राप्तकर्ता (Recipient)\",\"ट्रांसपोर्टर\"],\"a\":2,\"ee\":\"The buyer/recipient is liable to deposit the tax directly to the government.\",\"eh\":\"खरीदार/प्राप्तकर्ता सीधे सरकार को कर जमा करने के लिए उत्तरदायी है।\"},{\"n\":77,\"d\":\"\",\"se\":\"If a taxpayer fails to pay their GST liability, interest is levied on the delayed payment at the rate of:\",\"sh\":\"यदि कोई करदाता अपने जीएसटी दायित्व का भुगतान करने में विफल रहता है, तो विलंबित भुगतान पर किस दर से ब्याज लगाया जाता है:\",\"oe\":[\"12% p.a\",\"30% p.a\",\"24% p.a\",\"18% p.a\"],\"oh\":[\"12% प्रति वर्ष\",\"30% प्रति वर्ष\",\"24% प्रति वर्ष\",\"18% प्रति वर्ष\"],\"a\":3,\"ee\":\"18% per annum (calculated on the net cash tax liability).\",\"eh\":\"18% प्रति वर्ष (शुद्ध नकद कर देयता पर गणना)।\"},{\"n\":78,\"d\":\"\",\"se\":\"The general penalty for a person who fails to obtain mandatory GST registration is:\",\"sh\":\"अनिवार्य जीएसटी पंजीकरण प्राप्त करने में विफल रहने वाले व्यक्ति के लिए सामान्य जुर्माना (penalty) है:\",\"oe\":[\"₹10,000 or the amount of tax evaded, whichever is higher\",\"Flat ₹25,000\",\"Flat ₹50,000\",\"100% of turnover\"],\"oh\":[\"₹10,000 या चोरी किए गए कर की राशि, जो भी अधिक हो\",\"फ्लैट ₹25,000\",\"फ्लैट ₹50,000\",\"टर्नओवर का 100%\"],\"a\":0,\"ee\":\"₹10,000 or equivalent to the tax evaded, whichever is greater.\",\"eh\":\"₹10,000 या चोरी किए गए कर के बराबर, जो भी अधिक हो।\"},{\"n\":79,\"d\":\"\",\"se\":\"<strong>Zero-rated supplies</strong> under the IGST Act strictly include:\",\"sh\":\"IGST अधिनियम के तहत <strong>शून्य-रेटेड आपूर्तियों (Zero-rated supplies)</strong> में सख्ती से शामिल हैं:\",\"oe\":[\"Supplies to any government agency\",\"Export of goods/services and supplies made to an SEZ developer/unit\",\"Any inter-state supply of goods\",\"Intra-state supply of essential goods\"],\"oh\":[\"किसी भी सरकारी एजेंसी को की गई आपूर्तियां\",\"माल/सेवाओं का निर्यात और SEZ डेवलपर/यूनिट को की गई आपूर्तियां\",\"माल की कोई भी अंतर-राज्यीय आपूर्ति\",\"आवश्यक वस्तुओं की अंतर-राज्यीय आपूर्ति\"],\"a\":1,\"ee\":\"Exports and SEZ supplies are zero-rated, meaning input tax can be fully refunded.\",\"eh\":\"निर्यात और SEZ आपूर्तियां शून्य-रेटेड हैं, जिसका अर्थ है कि इनपुट टैक्स पूरी तरह से वापस (refund) किया जा सकता है।\"},{\"n\":80,\"d\":\"\",\"se\":\"The application for a <strong>refund of ITC</strong> related to zero-rated exports must be filed within:\",\"sh\":\"शून्य-रेटेड निर्यात से संबंधित <strong>ITC के रिफंड</strong> के लिए आवेदन किसके भीतर दाखिल किया जाना चाहिए:\",\"oe\":[\"5 years from the relevant date\",\"1 year from the relevant date\",\"2 years from the relevant date\",\"3 years from the relevant date\"],\"oh\":[\"प्रासंगिक तिथि से 5 वर्ष\",\"प्रासंगिक तिथि से 1 वर्ष\",\"प्रासंगिक तिथि से 2 वर्ष\",\"प्रासंगिक तिथि से 3 वर्ष\"],\"a\":2,\"ee\":\"2 years from the date of export.\",\"eh\":\"निर्यात की तिथि से 2 वर्ष।\"},{\"n\":81,\"d\":\"\",\"se\":\"Under GST, the <strong>Input Tax Credit (ITC)</strong> on purchased capital goods used for business is:\",\"sh\":\"जीएसटी के तहत, व्यवसाय के लिए खरीदे गए पूंजीगत माल (Capital goods) पर <strong>इनपुट टैक्स क्रेडिट (ITC)</strong> है:\",\"oe\":[\"Not allowed at all\",\"Claimed over a period of 5 years\",\"Claimed over a period of 3 years\",\"Fully available and can be claimed in the year of purchase itself\"],\"oh\":[\"बिल्कुल अनुमति नहीं है\",\"5 साल की अवधि में दावा किया जाता है\",\"3 साल की अवधि में दावा किया जाता है\",\"पूरी तरह से उपलब्ध है और खरीद के वर्ष में ही दावा किया जा सकता है\"],\"a\":3,\"ee\":\"Full ITC is available immediately upon capitalization (if depreciation is not claimed on the GST component).\",\"eh\":\"पूंजीकरण (capitalization) पर तत्काल पूर्ण ITC उपलब्ध है (यदि जीएसटी घटक पर मूल्यह्रास का दावा नहीं किया गया है)।\"},{\"n\":82,\"d\":\"\",\"se\":\"A person who is <strong>exclusively required to pay tax under Reverse Charge Mechanism (RCM)</strong> must:\",\"sh\":\"वह व्यक्ति जिसे <strong>रिवर्स चार्ज मैकेनिज्म (RCM) के तहत विशेष रूप से कर का भुगतान करना आवश्यक है</strong>, उसे:\",\"oe\":[\"Register under GST mandatorily, regardless of their annual turnover threshold\",\"File only an annual return\",\"Never register under GST\",\"Pay tax only if turnover exceeds ₹40 Lakhs\"],\"oh\":[\"अपनी वार्षिक टर्नओवर सीमा की परवाह किए बिना अनिवार्य रूप से जीएसटी के तहत पंजीकरण करना होगा\",\"केवल वार्षिक रिटर्न दाखिल करें\",\"जीएसटी के तहत कभी पंजीकरण न करें\",\"केवल तभी कर का भुगतान करें जब टर्नओवर ₹40 लाख से अधिक हो\"],\"a\":0,\"ee\":\"Mandatory registration applies regardless of the threshold limit.\",\"eh\":\"थ्रेसहोल्ड सीमा की परवाह किए बिना अनिवार्य पंजीकरण लागू होता है।\"},{\"n\":83,\"d\":\"\",\"se\":\"Decisions in the <strong>GST Council</strong> are taken by a weighted majority of not less than:\",\"sh\":\"<strong>जीएसटी परिषद (GST Council)</strong> में निर्णय कितने के भारित बहुमत (weighted majority) द्वारा लिए जाते हैं:\",\"oe\":[\"Simple majority (51%)\",\"3/4th (75%) of the weighted votes of members present and voting\",\"Unanimous consent (100%)\",\"2/3rd (66.6%) majority\"],\"oh\":[\"साधारण बहुमत (51%)\",\"उपस्थित और मतदान करने वाले सदस्यों के भारित मतों का 3/4 (75%)\",\"सर्वसम्मति (100%)\",\"2/3 (66.6%) बहुमत\"],\"a\":1,\"ee\":\"75% weighted majority (Center holds 1/3rd weight, States collectively hold 2/3rd weight).\",\"eh\":\"75% भारित बहुमत (केंद्र का 1/3 भार होता है, राज्यों का सामूहिक रूप से 2/3 भार होता है)।\"},{\"n\":84,\"d\":\"\",\"se\":\"The <strong>CGST Act, 2017</strong> was constitutionally enabled by the insertion of Article:\",\"sh\":\"<strong>CGST अधिनियम, 2017</strong> को किस अनुच्छेद को सम्मिलित करके संवैधानिक रूप से सक्षम बनाया गया था:\",\"oe\":[\"269A\",\"300A\",\"246A\",\"279A\"],\"oh\":[\"269A\",\"300A\",\"246A\",\"279A\"],\"a\":2,\"ee\":\"Article 246A grants concurrent powers to Parliament and State Legislatures to make laws regarding GST.\",\"eh\":\"अनुच्छेद 246A संसद और राज्य विधानसभाओं को जीएसटी के संबंध में कानून बनाने की समवर्ती शक्तियां प्रदान करता है।\"},{\"n\":85,\"d\":\"\",\"se\":\"The levy and collection of tax on <strong>inter-state supply of goods</strong> is governed by the:\",\"sh\":\"<strong>माल की अंतर-राज्यीय (Inter-state) आपूर्ति</strong> पर कर लगाना और वसूलना किसके द्वारा नियंत्रित होता है:\",\"oe\":[\"UTGST Act\",\"SGST Act\",\"CGST Act\",\"IGST Act\"],\"oh\":[\"UTGST अधिनियम\",\"SGST अधिनियम\",\"CGST अधिनियम\",\"IGST अधिनियम\"],\"a\":3,\"ee\":\"Integrated Goods and Services Tax (IGST) Act.\",\"eh\":\"एकीकृत वस्तु एवं सेवा कर (IGST) अधिनियम।\"},{\"n\":86,\"d\":\"\",\"se\":\"The <strong>State GST (SGST)</strong> component on an intra-state supply is levied and collected by the:\",\"sh\":\"एक राज्य के भीतर (Intra-state) आपूर्ति पर <strong>राज्य जीएसटी (SGST)</strong> घटक किसके द्वारा लगाया और एकत्र किया जाता है:\",\"oe\":[\"Central Government\",\"State Government\",\"Both jointly\",\"Local Municipal Corporation\"],\"oh\":[\"केंद्र सरकार\",\"राज्य सरकार\",\"दोनों संयुक्त रूप से\",\"स्थानीय नगर निगम\"],\"a\":1,\"ee\":\"State Government.\",\"eh\":\"राज्य सरकार।\"},{\"n\":87,\"d\":\"\",\"se\":\"The term <strong>&quot;Exempt Supply&quot;</strong> under GST law broadly includes:\",\"sh\":\"जीएसटी कानून के तहत <strong>&quot;छूट प्राप्त आपूर्ति&quot; (Exempt Supply)</strong> शब्द में मोटे तौर पर शामिल हैं:\",\"oe\":[\"Nil-rated goods, wholly exempt goods, and non-taxable supplies (like alcohol/petrol)\",\"Only fully tax-exempt goods\",\"Zero-rated supplies\",\"Only Nil-rated goods\"],\"oh\":[\"शून्य-रेटेड माल, पूर्णतः छूट प्राप्त माल और गैर-कर योग्य आपूर्तियां (जैसे शराब/पेट्रोल)\",\"केवल पूर्णतः कर-मुक्त माल\",\"शून्य-रेटेड आपूर्तियां (Zero-rated supplies)\",\"केवल शून्य-रेटेड (Nil-rated) माल\"],\"a\":0,\"ee\":\"It covers nil-rated, wholly exempt, and non-taxable supplies.\",\"eh\":\"यह शून्य-रेटेड, पूर्णतः छूट प्राप्त और गैर-कर योग्य आपूर्तियों को कवर करता है।\"},{\"n\":88,\"d\":\"\",\"se\":\"The threshold limit for mandatory GST registration for goods in certain <strong>Special Category States</strong> (like Mizoram, Tripura, Manipur, Nagaland) is:\",\"sh\":\"कुछ <strong>विशेष श्रेणी के राज्यों</strong> (जैसे मिजोरम, त्रिपुरा, मणिपुर, नागालैंड) में माल के लिए अनिवार्य जीएसटी पंजीकरण की सीमा क्या है:\",\"oe\":[\"₹20 lakh\",\"₹10 lakh\",\"₹40 lakh\",\"₹50 lakh\"],\"oh\":[\"₹20 लाख\",\"₹10 लाख\",\"₹40 लाख\",\"₹50 लाख\"],\"a\":1,\"ee\":\"₹10 lakh.\",\"eh\":\"₹10 लाख।\"},{\"n\":89,\"d\":\"\",\"se\":\"Under the standard Composition Scheme (Section 10(1) for turnover up to ₹1.5 Cr), who among the following is <strong>NOT</strong> eligible to opt into the scheme?\",\"sh\":\"मानक संरचना योजना (Standard Composition Scheme - ₹1.5 करोड़ तक टर्नओवर के लिए धारा 10(1)) के तहत, निम्नलिखित में से कौन योजना का विकल्प चुनने के लिए <strong>पात्र नहीं (NOT eligible)</strong> है?\",\"oe\":[\"A restaurant service provider\",\"A manufacturer of general goods\",\"A supplier of services (other than restaurant services)\",\"A retail trader of goods\"],\"oh\":[\"एक रेस्तरां सेवा प्रदाता\",\"सामान्य वस्तुओं का निर्माता\",\"सेवाओं का आपूर्तिकर्ता (रेस्तरां सेवाओं के अलावा)\",\"माल का एक खुदरा व्यापारी\"],\"a\":2,\"ee\":\"General service providers cannot opt for the standard 1% scheme (though a separate 6% scheme exists for them up to ₹50L).\",\"eh\":\"सामान्य सेवा प्रदाता मानक 1% योजना का विकल्प नहीं चुन सकते हैं (हालांकि उनके लिए ₹50 लाख तक की एक अलग 6% योजना मौजूद है)।\"},{\"n\":90,\"d\":\"\",\"se\":\"The maximum time limit to issue and declare a <strong>Credit Note</strong> under GST for a particular financial year is:\",\"sh\":\"किसी विशेष वित्तीय वर्ष के लिए जीएसटी के तहत <strong>क्रेडिट नोट (Credit Note)</strong> जारी करने और घोषित करने की अधिकतम समय सीमा क्या है:\",\"oe\":[\"60 days\",\"90 days\",\"30 days from the date of the original invoice\",\"30th November of the following financial year (or the date of furnishing annual return, whichever is earlier)\"],\"oh\":[\"60 दिन\",\"90 दिन\",\"मूल चालान की तिथि से 30 दिन\",\"अगले वित्तीय वर्ष का 30 नवंबर (या वार्षिक रिटर्न प्रस्तुत करने की तिथि, जो भी पहले हो)\"],\"a\":3,\"ee\":\"30th November of the subsequent FY (as per recent Finance Act amendments).\",\"eh\":\"बाद के वित्तीय वर्ष का 30 नवंबर (हाल के वित्त अधिनियम संशोधनों के अनुसार)।\"},{\"n\":91,\"d\":\"\",\"se\":\"If the transaction value of a supply is not available or is not wholly in money, the <strong>Valuation</strong> is primarily done according to CGST Valuation Rules using the:\",\"sh\":\"यदि किसी आपूर्ति का लेनदेन मूल्य उपलब्ध नहीं है या पूरी तरह से पैसे में नहीं है, तो <strong>मूल्यांकन (Valuation)</strong> मुख्य रूप से CGST मूल्यांकन नियमों के अनुसार किसके उपयोग से किया जाता है:\",\"oe\":[\"Open Market Value (Rule 27)\",\"Value fixed by the GST Council\",\"Flat 110% of Cost\",\"Maximum Retail Price (MRP)\"],\"oh\":[\"खुला बाजार मूल्य / Open Market Value (नियम 27)\",\"जीएसटी परिषद द्वारा निर्धारित मूल्य\",\"लागत का फ्लैट 110%\",\"अधिकतम खुदरा मूल्य (MRP)\"],\"a\":0,\"ee\":\"Rule 27 prioritizes the Open Market Value.\",\"eh\":\"नियम 27 खुले बाजार मूल्य (Open Market Value) को प्राथमिकता देता है।\"},{\"n\":92,\"d\":\"\",\"se\":\"If goods are lost, stolen, or <strong>destroyed by fire</strong>, the Input Tax Credit (ITC) previously claimed on those goods:\",\"sh\":\"यदि माल खो जाता है, चोरी हो जाता है, या <strong>आग से नष्ट हो जाता है</strong>, तो उन सामानों पर पहले दावा किया गया इनपुट टैक्स क्रेडिट (ITC):\",\"oe\":[\"Is carried forward indefinitely\",\"Must be reversed/blocked as per Section 17(5)(h)\",\"Remains fully available\",\"Is partially available\"],\"oh\":[\"अनिश्चित काल के लिए आगे ले जाया जाता है\",\"धारा 17(5)(h) के अनुसार उलट/अवरुद्ध (reversed/blocked) किया जाना चाहिए\",\"पूरी तरह से उपलब्ध रहता है\",\"आंशिक रूप से उपलब्ध है\"],\"a\":1,\"ee\":\"Blocked credits; ITC must be reversed.\",\"eh\":\"अवरुद्ध क्रेडिट; ITC को रिवर्स किया जाना चाहिए।\"},{\"n\":93,\"d\":\"\",\"se\":\"A taxpayer operating under the <strong>Composition Scheme</strong> is required to file their annual return in Form:\",\"sh\":\"<strong>संरचना योजना (Composition Scheme)</strong> के तहत काम करने वाले करदाता को अपना वार्षिक रिटर्न किस फॉर्म में दाखिल करना होता है:\",\"oe\":[\"GSTR-3B\",\"GSTR-9\",\"GSTR-4\",\"GSTR-1\"],\"oh\":[\"GSTR-3B\",\"GSTR-9\",\"GSTR-4\",\"GSTR-1\"],\"a\":2,\"ee\":\"GSTR-4 (Filed annually by 30th April).\",\"eh\":\"GSTR-4 (सालाना 30 अप्रैल तक दाखिल किया जाता है)।\"},{\"n\":94,\"d\":\"\",\"se\":\"Regarding the <strong>revision of filed GST returns</strong>:\",\"sh\":\"दाखिल किए गए <strong>जीएसटी रिटर्न में संशोधन (revision)</strong> के संबंध में:\",\"oe\":[\"Revisions are allowed only once within the financial year\",\"Allowed only upon payment of a ₹5,000 fee\",\"Returns can be revised at any time\",\"Revisions of filed returns are completely prohibited (errors must be rectified in subsequent period returns)\"],\"oh\":[\"वित्तीय वर्ष के भीतर केवल एक बार संशोधन की अनुमति है\",\"केवल ₹5,000 के शुल्क के भुगतान पर अनुमति है\",\"रिटर्न को किसी भी समय संशोधित किया जा सकता है\",\"दाखिल किए गए रिटर्न में संशोधन पूरी तरह से प्रतिबंधित है (त्रुटियों को बाद की अवधि के रिटर्न में सुधारा जाना चाहिए)\"],\"a\":3,\"ee\":\"GST law does not permit the revision of a filed return.\",\"eh\":\"जीएसटी कानून दाखिल किए गए रिटर्न में संशोधन (revision) की अनुमति नहीं देता है।\"},{\"n\":95,\"d\":\"\",\"se\":\"GST was officially rolled out in India (via the 101st Constitutional Amendment Act) on:\",\"sh\":\"भारत में जीएसटी (101वें संविधान संशोधन अधिनियम के माध्यम से) आधिकारिक तौर पर कब लागू किया गया था:\",\"oe\":[\"1st July 2017\",\"1st July 2015\",\"1st April 2016\",\"1st January 2018\"],\"oh\":[\"1 जुलाई 2017\",\"1 जुलाई 2015\",\"1 अप्रैल 2016\",\"1 जनवरी 2018\"],\"a\":0,\"ee\":\"1st July 2017.\",\"eh\":\"1 जुलाई 2017।\"},{\"n\":96,\"d\":\"\",\"se\":\"A <strong>Tax Invoice</strong> issued under GST for a taxable supply must mandatorily contain:\",\"sh\":\"कर योग्य आपूर्ति के लिए जीएसटी के तहत जारी किए गए <strong>टैक्स इनवॉइस (Tax Invoice)</strong> में अनिवार्य रूप से क्या शामिल होना चाहिए:\",\"oe\":[\"GSTIN of the supplier and recipient (if registered)\",\"HSN or SAC code\",\"Date of issue and signature/digital signature\",\"All of the above\"],\"oh\":[\"आपूर्तिकर्ता और प्राप्तकर्ता (यदि पंजीकृत है) का GSTIN\",\"HSN या SAC कोड\",\"जारी करने की तिथि और हस्ताक्षर/डिजिटल हस्ताक्षर\",\"उपरोक्त सभी\"],\"a\":3,\"ee\":\"All are mandatory invoice particulars.\",\"eh\":\"ये सभी अनिवार्य इनवॉइस विवरण हैं।\"},{\"n\":97,\"d\":\"\",\"se\":\"The mandatory <strong>TDS under GST</strong> (Section 51) applies specifically to payments made to suppliers by:\",\"sh\":\"अनिवार्य <strong>जीएसटी टीडीएस (TDS under GST - धारा 51)</strong> विशेष रूप से किसके द्वारा आपूर्तिकर्ताओं को किए गए भुगतान पर लागू होता है:\",\"oe\":[\"Individuals buying for personal use\",\"Government departments, local authorities, and public sector undertakings\",\"Private manufacturing companies\",\"E-commerce operators\"],\"oh\":[\"व्यक्तिगत उपयोग के लिए खरीदारी करने वाले व्यक्ति\",\"सरकारी विभाग, स्थानीय प्राधिकरण और सार्वजनिक क्षेत्र के उपक्रम (PSUs)\",\"निजी निर्माण कंपनियां\",\"ई-कॉमर्स ऑपरेटर\"],\"a\":1,\"ee\":\"Government and notified entities.\",\"eh\":\"सरकार और अधिसूचित संस्थाएं।\"},{\"n\":98,\"d\":\"\",\"se\":\"Under Section 50 of the CGST Act, the interest on the delayed payment of tax is calculated on the:\",\"sh\":\"CGST अधिनियम की धारा 50 के तहत, कर के विलंबित भुगतान पर ब्याज की गणना किस पर की जाती है:\",\"oe\":[\"Value of the supply\",\"Gross turnover\",\"Net tax liability (tax paid by debiting the electronic cash ledger)\",\"Total gross tax liability\"],\"oh\":[\"आपूर्ति का मूल्य\",\"सकल टर्नओवर\",\"शुद्ध कर देयता (इलेक्ट्रॉनिक नकद बही / cash ledger को डेबिट करके भुगतान किया गया कर)\",\"कुल सकल कर देयता (Total gross tax liability)\"],\"a\":2,\"ee\":\"Interest is levied only on the net cash liability.\",\"eh\":\"ब्याज केवल शुद्ध नकद देयता (net cash liability) पर लगाया जाता है।\"},{\"n\":99,\"d\":\"\",\"se\":\"The <strong>Anti-Profiteering</strong> measures, designed to ensure that the benefits of ITC and reduced tax rates are passed on to consumers, are contained in Section:\",\"sh\":\"<strong>एंटी-प्रॉफिटियरिंग (Anti-Profiteering)</strong> उपाय, जो यह सुनिश्चित करने के लिए बनाए गए हैं कि आईटीसी (ITC) और कम कर दरों का लाभ उपभोक्ताओं तक पहुंचाया जाए, किस धारा में निहित हैं:\",\"oe\":[\"173\",\"170\",\"172\",\"171\"],\"oh\":[\"173\",\"170\",\"172\",\"171\"],\"a\":3,\"ee\":\"Section 171 of the CGST Act.\",\"eh\":\"CGST अधिनियम की धारा 171।\"},{\"n\":100,\"d\":\"\",\"se\":\"The core <strong>Destination-Based Principle</strong> of GST implies that:\",\"sh\":\"जीएसटी का मुख्य <strong>गंतव्य-आधारित सिद्धांत (Destination-Based Principle)</strong> यह दर्शाता है कि:\",\"oe\":[\"Tax revenue belongs to the state where the goods or services are finally consumed (Destination)\",\"Tax revenue belongs to the state where the goods are manufactured (Origin)\",\"Tax is equally split among all states\",\"Tax is levied at the headquarters of the supplier\"],\"oh\":[\"कर राजस्व उस राज्य का है जहाँ माल या सेवाओं की अंतिम खपत होती है (Destination)\",\"कर राजस्व उस राज्य का है जहाँ माल निर्मित होता है (Origin)\",\"कर सभी राज्यों के बीच समान रूप से विभाजित किया जाता है\",\"कर आपूर्तिकर्ता के मुख्यालय पर लगाया जाता है\"],\"a\":0,\"ee\":\"Consumption state receives the revenue.\",\"eh\":\"उपभोग (Consumption) राज्य को राजस्व प्राप्त होता है।\"}]},{\"id\":\"as3\",\"num\":3,\"name\":\"Quantitative Ability\",\"q\":[{\"n\":1,\"d\":\"\",\"se\":\"The sum of the squares of two consecutive odd numbers is 290. The numbers are:\",\"sh\":\"दो लगातार विषम संख्याओं (odd numbers) के वर्गों का योग 290 है। वे संख्याएँ हैं:\",\"oe\":[\"9 and 11\",\"11 and 13\",\"15 and 17\",\"13 and 15\"],\"oh\":[\"9 और 11\",\"11 और 13\",\"15 और 17\",\"13 और 15\"],\"a\":1,\"ee\":\"11² + 13² = 121 + 169 = 290.\",\"eh\":\"11² + 13² = 121 + 169 = 290।\"},{\"n\":2,\"d\":\"\",\"se\":\"The difference between the squares of two consecutive numbers is 37. The numbers are:\",\"sh\":\"दो लगातार संख्याओं के वर्गों के बीच का अंतर 37 है। संख्याएँ हैं:\",\"oe\":[\"16 and 17\",\"17 and 18\",\"18 and 19\",\"19 and 20\"],\"oh\":[\"16 और 17\",\"17 और 18\",\"18 और 19\",\"19 और 20\"],\"a\":2,\"ee\":\"Let numbers be x and (x+1). (x+1)² - x² = 2x + 1 = 37 → 2x = 36 → x = 18. The numbers are 18 and 19.\",\"eh\":\"मान लें संख्याएँ x और (x+1) हैं। (x+1)² - x² = 2x + 1 = 37 → 2x = 36 → x = 18।\"},{\"n\":3,\"d\":\"\",\"se\":\"The value of (√5 + √3)² – (√5 – √3)² is:\",\"sh\":\"(√5 + √3)² – (√5 – √3)² का मान है:\",\"oe\":[\"2√15\",\"6√15\",\"8√15\",\"4√15\"],\"oh\":[\"2√15\",\"6√15\",\"8√15\",\"4√15\"],\"a\":3,\"ee\":\"Using the algebraic identity (a+b)² - (a-b)² = 4ab. 4(√5)(√3) = 4√15.\",\"eh\":\"बीजगणितीय पहचान (a+b)² - (a-b)² = 4ab का उपयोग करने पर। 4(√5)(√3) = 4√15।\"},{\"n\":4,\"d\":\"\",\"se\":\"If 2ˣ = 32, then x = ?\",\"sh\":\"यदि 2ˣ = 32 है, तो x = ?\",\"oe\":[\"5\",\"4\",\"6\",\"3\"],\"oh\":[\"5\",\"4\",\"6\",\"3\"],\"a\":0,\"ee\":\"2⁵ = 32. Therefore, x = 5.\",\"eh\":\"2⁵ = 32। अतः x = 5।\"},{\"n\":5,\"d\":\"\",\"se\":\"The value of 0.2 × 0.2 × 0.2 is:\",\"sh\":\"0.2 × 0.2 × 0.2 का मान है:\",\"oe\":[\"0.8\",\"0.008\",\"0.08\",\"8\"],\"oh\":[\"0.8\",\"0.008\",\"0.08\",\"8\"],\"a\":1,\"ee\":\"(0.2)³ = 0.008.\",\"eh\":\"(0.2)³ = 0.008।\"},{\"n\":6,\"d\":\"\",\"se\":\"(3/4) of (2/3) of (6/7) of a certain number is 36. The number is:\",\"sh\":\"किसी संख्या के (6/7) के (2/3) का (3/4) हिस्सा 36 है। वह संख्या है:\",\"oe\":[\"96\",\"108\",\"84\",\"72\"],\"oh\":[\"96\",\"108\",\"84\",\"72\"],\"a\":2,\"ee\":\"(3/4) × (2/3) × (6/7) = 36/84 = 3/7. Let the number be x. (3/7)x = 36 → x = (36 × 7) / 3 = 84.\",\"eh\":\"(3/4) × (2/3) × (6/7) = 36/84 = 3/7। यदि संख्या x है, तो (3/7)x = 36 → x = (36 × 7) / 3 = 84।\"},{\"n\":7,\"d\":\"\",\"se\":\"The value of 12.5 × 8.4 + 12.5 × 1.6 is:\",\"sh\":\"12.5 × 8.4 + 12.5 × 1.6 का मान है:\",\"oe\":[\"150\",\"80\",\"100\",\"125\"],\"oh\":[\"150\",\"80\",\"100\",\"125\"],\"a\":3,\"ee\":\"Factoring out 12.5: 12.5 × (8.4 + 1.6) = 12.5 × 10 = 125.\",\"eh\":\"12.5 को बाहर निकालने पर: 12.5 × (8.4 + 1.6) = 12.5 × 10 = 125।\"},{\"n\":8,\"d\":\"\",\"se\":\"The smallest 4-digit number perfectly divisible by 6, 8, and 12 is:\",\"sh\":\"6, 8, और 12 से पूर्णतः विभाज्य 4-अंकों की सबसे छोटी संख्या है:\",\"oe\":[\"1008\",\"1012\",\"1000\",\"1020\"],\"oh\":[\"1008\",\"1012\",\"1000\",\"1020\"],\"a\":0,\"ee\":\"LCM of 6, 8, 12 is 24. The smallest 4-digit number is 1000. 1000 / 24 leaves a remainder of 16. The next multiple is 1000 + (24 - 16) = 1008.\",\"eh\":\"6, 8, 12 का LCM 24 है। 4 अंकों की सबसे छोटी संख्या 1000 है। 1000/24 में 16 शेष बचता है। अगला गुणज = 1000 + (24 - 16) = 1008।\"},{\"n\":9,\"d\":\"\",\"se\":\"The product of two numbers is 256 and their HCF is 8. Their LCM is:\",\"sh\":\"दो संख्याओं का गुणनफल 256 है और उनका HCF 8 है। उनका LCM क्या है:\",\"oe\":[\"16\",\"32\",\"48\",\"24\"],\"oh\":[\"16\",\"32\",\"48\",\"24\"],\"a\":1,\"ee\":\"Product of numbers = LCM × HCF. LCM = 256 / 8 = 32.\",\"eh\":\"संख्याओं का गुणनफल = LCM × HCF। LCM = 256 / 8 = 32।\"},{\"n\":10,\"d\":\"\",\"se\":\"The value of 10³ – 9³ – 1³ is:\",\"sh\":\"10³ – 9³ – 1³ का मान है:\",\"oe\":[\"300\",\"250\",\"270\",\"280\"],\"oh\":[\"300\",\"250\",\"270\",\"280\"],\"a\":2,\"ee\":\"1000 - 729 - 1 = 270.\",\"eh\":\"1000 - 729 - 1 = 270।\"},{\"n\":11,\"d\":\"\",\"se\":\"The average of 8 numbers is 45. If one number is excluded, the average becomes 42. The excluded number is:\",\"sh\":\"8 संख्याओं का औसत 45 है। यदि एक संख्या को हटा दिया जाए, तो औसत 42 हो जाता है। हटाई गई संख्या है:\",\"oe\":[\"60\",\"56\",\"64\",\"66\"],\"oh\":[\"60\",\"56\",\"64\",\"66\"],\"a\":3,\"ee\":\"Sum of 8 = 8 × 45 = 360. Sum of 7 = 7 × 42 = 294. Excluded number = 360 - 294 = 66.\",\"eh\":\"8 का योग = 8 × 45 = 360। 7 का योग = 7 × 42 = 294। हटाई गई संख्या = 360 - 294 = 66।\"},{\"n\":12,\"d\":\"\",\"se\":\"The average age of 5 boys is 12 years. If the age of one specific boy is 15 years, the average age of the remaining 4 boys is:\",\"sh\":\"5 लड़कों की औसत आयु 12 वर्ष है। यदि एक विशिष्ट लड़के की आयु 15 वर्ष है, तो शेष 4 लड़कों की औसत आयु है:\",\"oe\":[\"11.25 years\",\"10.5 years\",\"11 years\",\"12 years\"],\"oh\":[\"11.25 वर्ष\",\"10.5 वर्ष\",\"11 वर्ष\",\"12 वर्ष\"],\"a\":0,\"ee\":\"Total age of 5 = 60. Remaining sum = 60 - 15 = 45. Average of 4 = 45 / 4 = 11.25 years.\",\"eh\":\"5 की कुल आयु = 60। शेष योग = 60 - 15 = 45। 4 का औसत = 45 / 4 = 11.25 वर्ष।\"},{\"n\":13,\"d\":\"\",\"se\":\"The average of 6 numbers is 30. If each number is increased by 5, the new average is:\",\"sh\":\"6 संख्याओं का औसत 30 है। यदि प्रत्येक संख्या में 5 की वृद्धि की जाए, तो नया औसत क्या होगा:\",\"oe\":[\"25\",\"35\",\"40\",\"30\"],\"oh\":[\"25\",\"35\",\"40\",\"30\"],\"a\":1,\"ee\":\"If every observation increases by a constant, the average increases by the exact same constant. 30 + 5 = 35.\",\"eh\":\"यदि प्रत्येक पद एक समान बढ़ता है, तो औसत भी उसी मात्रा में बढ़ता है। 30 + 5 = 35।\"},{\"n\":14,\"d\":\"\",\"se\":\"A man is 5 times as old as his son. After 4 years, he will be 4 times as old as his son. The son's present age is:\",\"sh\":\"एक आदमी की उम्र अपने बेटे की उम्र की 5 गुनी है। 4 साल बाद, उसकी उम्र बेटे की 4 गुनी हो जाएगी। बेटे की वर्तमान आयु है:\",\"oe\":[\"14\",\"18\",\"12\",\"16\"],\"oh\":[\"14\",\"18\",\"12\",\"16\"],\"a\":2,\"ee\":\"Let son = x, father = 5x. (5x + 4) = 4(x + 4) → 5x + 4 = 4x + 16 → x = 12.\",\"eh\":\"बेटा = x, पिता = 5x। (5x + 4) = 4(x + 4) → 5x + 4 = 4x + 16 → x = 12।\"},{\"n\":15,\"d\":\"\",\"se\":\"The ratio of the present ages of A and B is 3:5. After 6 years, the ratio will be 2:3. The present age of A is:\",\"sh\":\"A और B की वर्तमान आयु का अनुपात 3:5 है। 6 वर्ष बाद, अनुपात 2:3 होगा। A की वर्तमान आयु है:\",\"oe\":[\"20\",\"24\",\"22\",\"18\"],\"oh\":[\"20\",\"24\",\"22\",\"18\"],\"a\":3,\"ee\":\"Ages = 3x and 5x. (3x + 6) / (5x + 6) = 2/3 → 9x + 18 = 10x + 12 → x = 6. A's age = 3 × 6 = 18.\",\"eh\":\"आयु = 3x और 5x। (3x + 6) / (5x + 6) = 2/3 → 9x + 18 = 10x + 12 → x = 6। A की आयु = 3 × 6 = 18।\"},{\"n\":16,\"d\":\"\",\"se\":\"The average of 5 consecutive even numbers is 24. The largest of these numbers is:\",\"sh\":\"5 लगातार सम (even) संख्याओं का औसत 24 है। इनमें से सबसे बड़ी संख्या कौन सी है:\",\"oe\":[\"28\",\"22\",\"26\",\"30\"],\"oh\":[\"28\",\"22\",\"26\",\"30\"],\"a\":0,\"ee\":\"The middle number is 24. The sequence is 20, 22, 24, 26, 28. The largest is 28.\",\"eh\":\"मध्य संख्या 24 है। क्रम 20, 22, 24, 26, 28 है। सबसे बड़ी 28 है।\"},{\"n\":17,\"d\":\"\",\"se\":\"The average of a batsman in 15 innings is 40 runs. In his next innings, he scores 70 runs. His new average is:\",\"sh\":\"एक बल्लेबाज का 15 पारियों में औसत 40 रन है। अपनी अगली पारी में वह 70 रन बनाता है। उसका नया औसत है:\",\"oe\":[\"43\",\"41.875\",\"42\",\"42.5\"],\"oh\":[\"43\",\"41.875\",\"42\",\"42.5\"],\"a\":1,\"ee\":\"Total runs = (15 × 40) + 70 = 670. New average = 670 / 16 = 41.875.\",\"eh\":\"कुल रन = (15 × 40) + 70 = 670। नया औसत = 670 / 16 = 41.875।\"},{\"n\":18,\"d\":\"\",\"se\":\"The average of 11 numbers is 35. If one of the numbers is 50, the average of the remaining 10 numbers is:\",\"sh\":\"11 संख्याओं का औसत 35 है। यदि उनमें से एक संख्या 50 है, तो शेष 10 संख्याओं का औसत है:\",\"oe\":[\"34.5\",\"34\",\"33.5\",\"35\"],\"oh\":[\"34.5\",\"34\",\"33.5\",\"35\"],\"a\":2,\"ee\":\"Total sum = 11 × 35 = 385. Remaining sum = 385 - 50 = 335. New average = 335 / 10 = 33.5.\",\"eh\":\"कुल योग = 11 × 35 = 385। शेष योग = 385 - 50 = 335। नया औसत = 335 / 10 = 33.5।\"},{\"n\":19,\"d\":\"\",\"se\":\"The present age of a father is 4 times his daughter's age. After 8 years, the father's age will be 3 times the daughter's age. The daughter's present age is:\",\"sh\":\"पिता की वर्तमान आयु अपनी बेटी की आयु की 4 गुनी है। 8 वर्ष बाद पिता की आयु बेटी की आयु की 3 गुनी होगी। बेटी की वर्तमान आयु है:\",\"oe\":[\"18\",\"14\",\"12\",\"16\"],\"oh\":[\"18\",\"14\",\"12\",\"16\"],\"a\":3,\"ee\":\"Daughter = x, Father = 4x. (4x + 8) = 3(x + 8) → 4x + 8 = 3x + 24 → x = 16.\",\"eh\":\"बेटी = x, पिता = 4x। (4x + 8) = 3(x + 8) → 4x + 8 = 3x + 24 → x = 16।\"},{\"n\":20,\"d\":\"\",\"se\":\"The average weight of 10 students is 50 kg. If the teacher's weight is included, the average becomes 52 kg. The teacher's weight is:\",\"sh\":\"10 छात्रों का औसत वजन 50 किलो है। यदि शिक्षक का वजन भी शामिल कर लिया जाए, तो औसत 52 किलो हो जाता है। शिक्षक का वजन है:\",\"oe\":[\"72 kg\",\"62 kg\",\"52 kg\",\"60 kg\"],\"oh\":[\"72 किलो\",\"62 किलो\",\"52 किलो\",\"60 किलो\"],\"a\":0,\"ee\":\"Total weight of 10 students = 500 kg. Total weight of 11 people = 11 × 52 = 572 kg. Teacher's weight = 572 - 500 = 72 kg.\",\"eh\":\"10 छात्रों का कुल वजन = 500 किलो। 11 लोगों का कुल वजन = 11 × 52 = 572 किलो। शिक्षक का वजन = 572 - 500 = 72 किलो।\"},{\"n\":21,\"d\":\"\",\"se\":\"If a : b = 2 : 3 and b : c = 5 : 6, then a : c is:\",\"sh\":\"यदि a : b = 2 : 3 और b : c = 5 : 6 है, तो a : c का मान है:\",\"oe\":[\"9:5\",\"5:9\",\"9:10\",\"10:9\"],\"oh\":[\"9:5\",\"5:9\",\"9:10\",\"10:9\"],\"a\":1,\"ee\":\"a:b = 10:15. b:c = 15:18. Therefore, a:c = 10:18, which simplifies to 5:9.\",\"eh\":\"a:b = 10:15 और b:c = 15:18। अतः a:c = 10:18, जिसे सरल करने पर 5:9 मिलता है।\"},{\"n\":22,\"d\":\"\",\"se\":\"If 4 litres of water is added to 16 litres of milk, the ratio of milk to water is:\",\"sh\":\"यदि 16 लीटर दूध में 4 लीटर पानी मिलाया जाए, तो दूध और पानी का अनुपात क्या होगा:\",\"oe\":[\"2:1\",\"1:2\",\"4:1\",\"1:4\"],\"oh\":[\"2:1\",\"1:2\",\"4:1\",\"1:4\"],\"a\":2,\"ee\":\"Milk : Water = 16 : 4 = 4:1.\",\"eh\":\"दूध : पानी = 16 : 4 = 4:1।\"},{\"n\":23,\"d\":\"\",\"se\":\"A bag contains ₹1, 50 paise, and 25 paise coins in the ratio 2:3:4. If the total amount is ₹120, the number of 50 paise coins is:\",\"sh\":\"एक थैले में ₹1, 50 पैसे और 25 पैसे के सिक्के 2:3:4 के अनुपात में हैं। यदि कुल राशि ₹120 है, तो 50 पैसे के सिक्कों की संख्या है:\",\"oe\":[\"120\",\"60\",\"100\",\"80\"],\"oh\":[\"120\",\"60\",\"100\",\"80\"],\"a\":3,\"ee\":\"Values = (2x × 1) + (3x × 0.5) + (4x × 0.25) = 120. 2x + 1.5x + 1x = 120 → 4.5x = 120 → x = 80/3. 50p coins = 3x = 3 × (80/3) = 80.\",\"eh\":\"मूल्य = (2x × 1) + (3x × 0.5) + (4x × 0.25) = 120। 2x + 1.5x + 1x = 120 → 4.5x = 120 → x = 80/3। 50 पैसे के सिक्के = 3x = 3 × (80/3) = 80।\"},{\"n\":24,\"d\":\"\",\"se\":\"A number is increased by 20% and then the resulting number is decreased by 20%. The net change is:\",\"sh\":\"एक संख्या में 20% की वृद्धि की जाती है और फिर प्राप्त संख्या में 20% की कमी की जाती है। शुद्ध परिवर्तन (Net change) है:\",\"oe\":[\"4% decrease\",\"5% decrease\",\"4% increase\",\"No change\"],\"oh\":[\"4% कमी\",\"5% कमी\",\"4% वृद्धि\",\"कोई परिवर्तन नहीं\"],\"a\":0,\"ee\":\"Let number = 100. Increase by 20% = 120. Decrease by 20% = 120 - 24 = 96. Net change = -4%.\",\"eh\":\"मान लें संख्या = 100। 20% की वृद्धि = 120। 20% की कमी = 120 - 24 = 96। शुद्ध परिवर्तन = 4% की कमी।\"},{\"n\":25,\"d\":\"\",\"se\":\"If 60% of a number is 240, then the number is:\",\"sh\":\"यदि किसी संख्या का 60%, 240 के बराबर है, तो वह संख्या है:\",\"oe\":[\"600\",\"400\",\"500\",\"300\"],\"oh\":[\"600\",\"400\",\"500\",\"300\"],\"a\":1,\"ee\":\"0.60x = 240 → x = 240 / 0.60 = 400.\",\"eh\":\"0.60x = 240 → x = 240 / 0.60 = 400।\"},{\"n\":26,\"d\":\"\",\"se\":\"In an election, a candidate got 45% of the total votes and lost the election by a margin of 1,000 votes. The total number of votes polled is:\",\"sh\":\"एक चुनाव में, एक उम्मीदवार को कुल वोटों का 45% मिला और वह 1,000 वोटों के अंतर से चुनाव हार गया। डाले गए कुल वोटों की संख्या है:\",\"oe\":[\"20,000\",\"5,000\",\"10,000\",\"15,000\"],\"oh\":[\"20,000\",\"5,000\",\"10,000\",\"15,000\"],\"a\":2,\"ee\":\"Loser = 45%, Winner = 55%. Difference = 10%. 10% of Total = 1000. Total = 10,000.\",\"eh\":\"हारने वाला = 45%, जीतने वाला = 55%। अंतर = 10%। कुल का 10% = 1000। कुल = 10,000।\"},{\"n\":27,\"d\":\"\",\"se\":\"The ratio of milk to water in a mixture is 3:2. If 10 litres of water are added, the ratio becomes 3:3 (or 1:1). The quantity of milk in the mixture is:\",\"sh\":\"एक मिश्रण में दूध और पानी का अनुपात 3:2 है। यदि 10 लीटर पानी मिलाया जाए, तो अनुपात 3:3 (या 1:1) हो जाता है। मिश्रण में दूध की मात्रा है:\",\"oe\":[\"50 L\",\"20 L\",\"40 L\",\"30 L\"],\"oh\":[\"50 L\",\"20 L\",\"40 L\",\"30 L\"],\"a\":3,\"ee\":\"Milk = 3x, Water = 2x. (3x) / (2x + 10) = 3/3 → 3x = 2x + 10 → x = 10. Milk = 3(10) = 30 L.\",\"eh\":\"दूध = 3x, पानी = 2x। (3x) / (2x + 10) = 3/3 → 3x = 2x + 10 → x = 10। दूध = 3(10) = 30 L।\"},{\"n\":28,\"d\":\"\",\"se\":\"A man spends 75% of his income. If his income increases by 20% and his expenditure increases by 10%, his savings increase by:\",\"sh\":\"एक आदमी अपनी आय का 75% खर्च करता है। यदि उसकी आय में 20% की वृद्धि होती है और उसके खर्च में 10% की वृद्धि होती है, तो उसकी बचत में कितनी वृद्धि होगी:\",\"oe\":[\"50%\",\"60%\",\"30%\",\"40%\"],\"oh\":[\"50%\",\"60%\",\"30%\",\"40%\"],\"a\":0,\"ee\":\"Original: Inc=100, Exp=75, Sav=25. New: Inc=120, Exp=82.5, Sav=37.5. Increase in savings = 12.5. % Increase = (12.5 / 25) × 100 = 50%.\",\"eh\":\"मूल: आय=100, खर्च=75, बचत=25। नया: आय=120, खर्च=82.5, बचत=37.5। बचत में वृद्धि = 12.5। % वृद्धि = (12.5 / 25) × 100 = 50%।\"},{\"n\":29,\"d\":\"\",\"se\":\"If the side of a square is increased by 10%, its area increases by:\",\"sh\":\"यदि किसी वर्ग की भुजा (side) 10% बढ़ा दी जाए, तो उसके क्षेत्रफल में कितनी वृद्धि होगी:\",\"oe\":[\"20%\",\"21%\",\"15%\",\"10%\"],\"oh\":[\"20%\",\"21%\",\"15%\",\"10%\"],\"a\":1,\"ee\":\"Formula for successive percentage: A + B + (A×B)/100 = 10 + 10 + (100/100) = 21%.\",\"eh\":\"क्रमिक प्रतिशत सूत्र: A + B + (A×B)/100 = 10 + 10 + (100/100) = 21%।\"},{\"n\":30,\"d\":\"\",\"se\":\"A student scored 35% marks and failed by 40 marks. Another student scored 45% marks and secured 20 marks more than the minimum passing marks. The maximum marks of the exam are:\",\"sh\":\"एक छात्र ने 35% अंक प्राप्त किए और वह 40 अंकों से अनुत्तीर्ण (fail) हो गया। दूसरे छात्र ने 45% अंक प्राप्त किए और न्यूनतम उत्तीर्ण अंकों से 20 अंक अधिक प्राप्त किए। परीक्षा के अधिकतम अंक हैं:\",\"oe\":[\"700\",\"500\",\"600\",\"400\"],\"oh\":[\"700\",\"500\",\"600\",\"400\"],\"a\":2,\"ee\":\"Let max marks = x. 0.35x + 40 = 0.45x - 20 → 0.10x = 60 → x = 600.\",\"eh\":\"मान लें अधिकतम अंक = x। 0.35x + 40 = 0.45x - 20 → 0.10x = 60 → x = 600।\"},{\"n\":31,\"d\":\"\",\"se\":\"A shopkeeper allows a discount of 10% on a marked price of ₹500 and still manages to gain 20%. The cost price of the article is:\",\"sh\":\"एक दुकानदार ₹500 के अंकित मूल्य पर 10% की छूट देता है और फिर भी 20% का लाभ प्राप्त करने में सफल होता है। वस्तु का क्रय मूल्य (Cost Price) है:\",\"oe\":[\"₹320\",\"₹400\",\"₹360\",\"₹375\"],\"oh\":[\"₹320\",\"₹400\",\"₹360\",\"₹375\"],\"a\":3,\"ee\":\"Selling Price = 500 × 0.90 = ₹450. Cost Price = 450 / 1.20 = ₹375.\",\"eh\":\"विक्रय मूल्य = 500 × 0.90 = ₹450। क्रय मूल्य = 450 / 1.20 = ₹375।\"},{\"n\":32,\"d\":\"\",\"se\":\"The marked price of an article is ₹600. If it is sold at a discount of 15%, the seller realizes a profit of 20%. The cost price is:\",\"sh\":\"किसी वस्तु का अंकित मूल्य ₹600 है। यदि इसे 15% की छूट पर बेचा जाता है, तो विक्रेता को 20% का लाभ होता है। क्रय मूल्य है:\",\"oe\":[\"₹425\",\"₹480\",\"₹400\",\"₹450\"],\"oh\":[\"₹425\",\"₹480\",\"₹400\",\"₹450\"],\"a\":0,\"ee\":\"SP = 600 × 0.85 = ₹510. CP = 510 / 1.20 = ₹425.\",\"eh\":\"SP = 600 × 0.85 = ₹510। CP = 510 / 1.20 = ₹425।\"},{\"n\":33,\"d\":\"\",\"se\":\"A dealer marks his goods 40% above cost price and then gives a discount of 20%. His net profit percentage is:\",\"sh\":\"एक डीलर अपने माल का मूल्य क्रय मूल्य से 40% अधिक अंकित करता है और फिर 20% की छूट देता है। उसका शुद्ध लाभ प्रतिशत है:\",\"oe\":[\"15%\",\"12%\",\"18%\",\"20%\"],\"oh\":[\"15%\",\"12%\",\"18%\",\"20%\"],\"a\":1,\"ee\":\"Let CP = 100. MP = 140. SP = 140 × 0.80 = 112. Profit = 12%.\",\"eh\":\"मान लें CP = 100। MP = 140। SP = 140 × 0.80 = 112। लाभ = 12%।\"},{\"n\":34,\"d\":\"\",\"se\":\"A shopkeeper bought 20 kg of sugar at ₹40 per kg and 30 kg at ₹50 per kg. He mixes them and sells the mixture at ₹55 per kg. His profit percentage is approximately:\",\"sh\":\"एक दुकानदार ने ₹40 प्रति किलो की दर से 20 किलो चीनी और ₹50 प्रति किलो की दर से 30 किलो चीनी खरीदी। वह उन्हें मिलाता है और मिश्रण को ₹55 प्रति किलो के हिसाब से बेचता है। उसका लाभ प्रतिशत लगभग है:\",\"oe\":[\"22.22%\",\"16.67%\",\"19.56%\",\"25%\"],\"oh\":[\"22.22%\",\"16.67%\",\"19.56%\",\"25%\"],\"a\":2,\"ee\":\"Total CP = (20×40) + (30×50) = 800 + 1500 = ₹2300. Total SP = 50 × 55 = ₹2750. Profit = 450. % = (450 / 2300) × 100 = 19.56%.\",\"eh\":\"कुल CP = (20×40) + (30×50) = 800 + 1500 = ₹2300। कुल SP = 50 × 55 = ₹2750। लाभ = 450। % = (450 / 2300) × 100 = 19.56%।\"},{\"n\":35,\"d\":\"\",\"se\":\"A man buys 4 pencils for ₹3 and sells 3 pencils for ₹4. His profit percentage is:\",\"sh\":\"एक व्यक्ति ₹3 में 4 पेंसिल खरीदता है और ₹4 में 3 पेंसिल बेचता है। उसका लाभ प्रतिशत है:\",\"oe\":[\"44.44%\",\"50%\",\"33.33%\",\"77.77%\"],\"oh\":[\"44.44%\",\"50%\",\"33.33%\",\"77.77%\"],\"a\":3,\"ee\":\"CP of 1 pencil = 3/4 = ₹0.75. SP of 1 pencil = 4/3 = ₹1.333. Profit = 0.5833. % = (0.5833 / 0.75) × 100 = 77.77%.\",\"eh\":\"1 पेंसिल का CP = 3/4 = ₹0.75। 1 पेंसिल का SP = 4/3 = ₹1.333। लाभ = 0.5833। % = (0.5833 / 0.75) × 100 = 77.77%।\"},{\"n\":36,\"d\":\"\",\"se\":\"A shopkeeper claims to sell his goods at cost price, but he uses a false weight of 950 grams instead of 1 kg. His profit percentage is:\",\"sh\":\"एक दुकानदार अपने माल को क्रय मूल्य पर बेचने का दावा करता है, लेकिन वह 1 किलो के स्थान पर 950 ग्राम के झूठे वजन का उपयोग करता है। उसका लाभ प्रतिशत है:\",\"oe\":[\"5.26%\",\"6%\",\"10%\",\"5%\"],\"oh\":[\"5.26%\",\"6%\",\"10%\",\"5%\"],\"a\":0,\"ee\":\"Profit = (True Weight - False Weight) / False Weight × 100 = (50 / 950) × 100 = 5.26%.\",\"eh\":\"लाभ = (सही वजन - गलत वजन) / गलत वजन × 100 = (50 / 950) × 100 = 5.26%।\"},{\"n\":37,\"d\":\"\",\"se\":\"An article is originally sold at a profit of 20%. If both the cost price and the selling price are increased by 10%, the new profit percentage is:\",\"sh\":\"एक वस्तु मूल रूप से 20% के लाभ पर बेची जाती है। यदि क्रय मूल्य और विक्रय मूल्य दोनों में 10% की वृद्धि की जाती है, तो नया लाभ प्रतिशत क्या होगा:\",\"oe\":[\"22%\",\"20%\",\"21%\",\"18%\"],\"oh\":[\"22%\",\"20%\",\"21%\",\"18%\"],\"a\":1,\"ee\":\"Let CP = 100, SP = 120. New CP = 110, New SP = 132. Profit = 132 - 110 = 22. Profit % = (22 / 110) × 100 = 20%.\",\"eh\":\"मान लें CP = 100, SP = 120। नया CP = 110, नया SP = 132। लाभ = 132 - 110 = 22। लाभ % = (22 / 110) × 100 = 20%।\"},{\"n\":38,\"d\":\"\",\"se\":\"The difference between the selling prices of an article when sold at a profit of 20% and a profit of 30% is ₹50. The cost price of the article is:\",\"sh\":\"20% लाभ और 30% लाभ पर बेची जाने वाली वस्तु के विक्रय मूल्यों के बीच का अंतर ₹50 है। वस्तु का क्रय मूल्य है:\",\"oe\":[\"₹700\",\"₹400\",\"₹500\",\"₹600\"],\"oh\":[\"₹700\",\"₹400\",\"₹500\",\"₹600\"],\"a\":2,\"ee\":\"Difference in percentage = 10%. 10% of CP = 50. Therefore, CP = ₹500.\",\"eh\":\"प्रतिशत में अंतर = 10%। CP का 10% = 50। इसलिए, CP = ₹500।\"},{\"n\":39,\"d\":\"\",\"se\":\"A trader bought 10 dozen eggs for ₹180 and sold them at ₹2 per egg. His profit percentage is:\",\"sh\":\"एक व्यापारी ने 10 दर्जन अंडे ₹180 में खरीदे और उन्हें ₹2 प्रति अंडे के हिसाब से बेचा। उसका लाभ प्रतिशत है:\",\"oe\":[\"25%\",\"20%\",\"30%\",\"33.33%\"],\"oh\":[\"25%\",\"20%\",\"30%\",\"33.33%\"],\"a\":3,\"ee\":\"10 dozen = 120 eggs. CP per egg = 180 / 120 = ₹1.50. Profit = 2.00 - 1.50 = ₹0.50. Profit % = (0.50 / 1.50) × 100 = 33.33%.\",\"eh\":\"10 दर्जन = 120 अंडे। प्रति अंडे का CP = 180 / 120 = ₹1.50। लाभ = 2.00 - 1.50 = ₹0.50। लाभ % = (0.50 / 1.50) × 100 = 33.33%।\"},{\"n\":40,\"d\":\"\",\"se\":\"A discount of 10% on a product is followed by a successive discount of 20%. The single equivalent discount percentage is:\",\"sh\":\"किसी उत्पाद पर 10% की छूट के बाद 20% की एक और क्रमिक (successive) छूट दी जाती है। एकल समतुल्य छूट (single equivalent discount) प्रतिशत है:\",\"oe\":[\"28%\",\"30%\",\"25%\",\"22%\"],\"oh\":[\"28%\",\"30%\",\"25%\",\"22%\"],\"a\":0,\"ee\":\"Successive discount formula: A + B - (A×B)/100 = 10 + 20 - (200/100) = 30 - 2 = 28%.\",\"eh\":\"सूत्र: A + B - (A×B)/100 = 10 + 20 - (200/100) = 30 - 2 = 28%।\"},{\"n\":41,\"d\":\"\",\"se\":\"The simple interest on ₹5,000 for 3 years at 8% p.a. is:\",\"sh\":\"₹5,000 पर 3 वर्ष के लिए 8% प्रति वर्ष की दर से साधारण ब्याज है:\",\"oe\":[\"₹1,400\",\"₹1,200\",\"₹1,600\",\"₹1,000\"],\"oh\":[\"₹1,400\",\"₹1,200\",\"₹1,600\",\"₹1,000\"],\"a\":1,\"ee\":\"SI = (P × R × T) / 100 = (5000 × 8 ×
