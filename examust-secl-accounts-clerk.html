The account that is credited when shares are forfeited due to non-payment of calls is the:\",\"sh\":\"जब बकाया किस्तों का भुगतान न करने पर शेयरों को जब्त (Forfeit) किया जाता है, तो किस खाते को क्रेडिट किया जाता है:\",\"oe\":[\"Calls in Arrear A/c\",\"Share Forfeiture A/c\",\"Share Capital A/c\",\"Bank A/c\"],\"oh\":[\"बकाया कॉल खाता\",\"शेयर जब्ती खाता (Share Forfeiture A/c)\",\"शेयर पूंजी खाता\",\"बैंक खाता\"],\"a\":1,\"ee\":\"The amount already received is credited to the Share Forfeiture account.\",\"eh\":\"जो राशि पहले ही प्राप्त हो चुकी है उसे शेयर जब्ती खाते में क्रेडिट कर दिया जाता है।\"},{\"n\":31,\"d\":\"\",\"se\":\"The maximum rate of GST on <strong>sin goods</strong> (like luxury cars, aerated drinks, tobacco) is:\",\"sh\":\"पाप वस्तुओं (Sin goods - जैसे लक्जरी कारें, तंबाकू) पर जीएसटी (GST) की अधिकतम दर क्या है?\",\"oe\":[\"5%\",\"12%\",\"28%\",\"18%\"],\"oh\":[\"5%\",\"12%\",\"28%\",\"18%\"],\"a\":2,\"ee\":\"The highest tax slab is 28% (often plus a compensation cess).\",\"eh\":\"उच्चतम टैक्स स्लैब 28% है (इसके ऊपर उपकर/Cess भी लग सकता है)।\"},{\"n\":32,\"d\":\"\",\"se\":\"Under the Income Tax Act (Old Tax Regime), the maximum aggregate deduction available under Section 80C is:\",\"sh\":\"आयकर अधिनियम (पुरानी कर व्यवस्था) के तहत, धारा 80C के अंतर्गत अधिकतम कटौती (Deduction) कितनी उपलब्ध है?\",\"oe\":[\"₹2,50,000\",\"₹2,00,000\",\"₹1,00,000\",\"₹1,50,000\"],\"oh\":[\"₹2,50,000\",\"₹2,00,000\",\"₹1,00,000\",\"₹1,50,000\"],\"a\":3,\"ee\":\"₹1,50,000.\",\"eh\":\"₹1,50,000।\"},{\"n\":33,\"d\":\"\",\"se\":\"GST is fundamentally levied on the:\",\"sh\":\"जीएसटी (GST) मूल रूप से किस पर लगाया जाता है:\",\"oe\":[\"Supply of goods and services\",\"Import of services only\",\"Manufacture of goods only\",\"Sale of goods only\"],\"oh\":[\"वस्तुओं और सेवाओं की आपूर्ति (Supply) पर\",\"केवल सेवाओं के आयात पर\",\"केवल वस्तुओं के निर्माण पर\",\"केवल वस्तुओं की बिक्री पर\"],\"a\":0,\"ee\":\"GST is a destination-based tax on &quot;supply&quot;.\",\"eh\":\"जीएसटी &quot;आपूर्ति (Supply)&quot; पर आधारित गंतव्य कर है।\"},{\"n\":34,\"d\":\"\",\"se\":\"Under GST, the time of supply for services (where the invoice is issued within the prescribed period) is generally the date of:\",\"sh\":\"जीएसटी के तहत, सेवाओं के लिए आपूर्ति का समय (Time of supply) आम तौर पर क्या होता है (यदि निर्धारित अवधि के भीतर चालान जारी किया गया हो)?\",\"oe\":[\"Issue of invoice or receipt of payment, whichever is later\",\"Issue of invoice or receipt of payment, whichever is earlier\",\"Agreement signing\",\"Completion of the service\"],\"oh\":[\"चालान या भुगतान, जो भी बाद में हो\",\"चालान जारी करने की तिथि या भुगतान प्राप्त होने की तिथि, जो भी पहले हो\",\"समझौते पर हस्ताक्षर करने की तिथि\",\"सेवा पूर्ण होने की तिथि\"],\"a\":1,\"ee\":\"Earlier of invoice date or payment receipt date.\",\"eh\":\"चालान तिथि या भुगतान प्राप्ति तिथि में से जो पहले (Earlier) हो।\"},{\"n\":35,\"d\":\"\",\"se\":\"Which type of GST is collected by the Central Government on an <strong>inter-state</strong> supply of goods?\",\"sh\":\"केंद्र सरकार द्वारा <strong>अंतर-राज्यीय (Inter-state)</strong> आपूर्ति पर किस प्रकार का जीएसटी एकत्र किया जाता है?\",\"oe\":[\"SGST\",\"UTGST\",\"IGST\",\"CGST\"],\"oh\":[\"SGST\",\"UTGST\",\"IGST\",\"CGST\"],\"a\":2,\"ee\":\"Integrated Goods and Services Tax (IGST).\",\"eh\":\"एकीकृत वस्तु एवं सेवा कर (IGST)।\"},{\"n\":36,\"d\":\"\",\"se\":\"Income earned by an employee from their employer is taxable under the head:\",\"sh\":\"किसी कर्मचारी द्वारा अपने नियोक्ता से अर्जित आय किस शीर्षक (Head) के तहत कर योग्य है:\",\"oe\":[\"Profits and Gains of Business\",\"Income from House Property\",\"Income from Other Sources\",\"Income from Salaries\"],\"oh\":[\"व्यापार से लाभ\",\"गृह संपत्ति से आय\",\"अन्य स्रोतों से आय\",\"वेतन से आय (Income from Salaries)\"],\"a\":3,\"ee\":\"Income from Salaries.\",\"eh\":\"वेतन (Salaries) शीर्षक के अंतर्गत।\"},{\"n\":37,\"d\":\"\",\"se\":\"The highest base tax rate slab for individuals under the old tax regime for AY 2025‑26 is:\",\"sh\":\"AY 2025-26 के लिए पुरानी कर व्यवस्था के तहत व्यक्तियों के लिए अधिकतम आधार कर दर (Highest base tax rate slab) क्या है:\",\"oe\":[\"30%\",\"25%\",\"35%\",\"40%\"],\"oh\":[\"30%\",\"25%\",\"35%\",\"40%\"],\"a\":0,\"ee\":\"30% (applicable on income exceeding ₹10 lakh, excluding surcharge/cess).\",\"eh\":\"30% (₹10 लाख से अधिक की आय पर, अधिभार/उपकर छोड़कर)।\"},{\"n\":38,\"d\":\"\",\"se\":\"GST registration is generally mandatory for suppliers of goods (in normal category states) if their aggregate annual turnover exceeds:\",\"sh\":\"वस्तुओं के आपूर्तिकर्ताओं (सामान्य राज्यों में) के लिए जीएसटी पंजीकरण अनिवार्य है, यदि उनका कुल वार्षिक टर्नओवर इससे अधिक हो:\",\"oe\":[\"₹10 lakh\",\"₹40 lakh\",\"₹20 lakh\",\"₹50 lakh\"],\"oh\":[\"₹10 लाख\",\"₹40 लाख\",\"₹20 लाख\",\"₹50 लाख\"],\"a\":1,\"ee\":\"The threshold is ₹40 lakh for exclusive supply of goods in normal states.\",\"eh\":\"विशेष राज्यों को छोड़कर, वस्तुओं की विशेष आपूर्ति के लिए सीमा ₹40 लाख है।\"},{\"n\":39,\"d\":\"\",\"se\":\"If 3x + 5 = 20, then the value of x is:\",\"sh\":\"यदि 3x + 5 = 20 है, तो x का मान है:\",\"oe\":[\"6\",\"3\",\"5\",\"4\"],\"oh\":[\"6\",\"3\",\"5\",\"4\"],\"a\":2,\"ee\":\"3x = 15 → x = 5.\",\"eh\":\"3x = 15 → x = 5।\"},{\"n\":40,\"d\":\"\",\"se\":\"The sum of the digits of a two‑digit number is 9. If the digits are reversed, the new number is 27 more than the original. The original number is:\",\"sh\":\"दो अंकों की एक संख्या के अंकों का योग 9 है। यदि अंकों को उलट दिया जाए, तो नई संख्या मूल संख्या से 27 अधिक हो जाती है। मूल संख्या क्या है?\",\"oe\":[\"54\",\"63\",\"45\",\"36\"],\"oh\":[\"54\",\"63\",\"45\",\"36\"],\"a\":3,\"ee\":\"Check options: 3+6=9. Reversed is 63. 63 - 36 = 27.\",\"eh\":\"विकल्पों की जाँच करें: 3+6=9। उलटने पर 63 बनता है। 63 - 36 = 27।\"},{\"n\":41,\"d\":\"\",\"se\":\"A man spends 60% of his income. If his income increases by 20% and his expenditure increases by 10%, what is the percentage change in his savings?\",\"sh\":\"एक आदमी अपनी आय का 60% खर्च करता है। यदि उसकी आय में 20% की वृद्धि होती है और उसके खर्च में 10% की वृद्धि होती है, तो उसकी बचत में प्रतिशत परिवर्तन क्या है?\",\"oe\":[\"35% increase\",\"30% increase\",\"30% decrease\",\"35% decrease\"],\"oh\":[\"35% वृद्धि\",\"30% वृद्धि\",\"30% कमी\",\"35% कमी\"],\"a\":0,\"ee\":\"Original: Inc=100, Exp=60, Sav=40. New: Inc=120, Exp=66, Sav=54. Change in Sav = +14. % Increase = (14/40) × 100 = 35%.\",\"eh\":\"आय=100, खर्च=60, बचत=40। नई आय=120, नया खर्च=66, नई बचत=54। बचत में वृद्धि = +14। प्रतिशत वृद्धि = (14/40) × 100 = 35%।\"},{\"n\":42,\"d\":\"\",\"se\":\"The LCM of 12, 18, and 24 is:\",\"sh\":\"12, 18, और 24 का लघुत्तम समापवर्त्य (LCM) है:\",\"oe\":[\"48\",\"72\",\"36\",\"144\"],\"oh\":[\"48\",\"72\",\"36\",\"144\"],\"a\":1,\"ee\":\"72 is the lowest number divisible by all three.\",\"eh\":\"72 वह सबसे छोटी संख्या है जो तीनों से विभाज्य है।\"},{\"n\":43,\"d\":\"\",\"se\":\"A train 200 m long passes a pole in 10 seconds. Its speed in km/hr is:\",\"sh\":\"200 मीटर लंबी एक ट्रेन एक खंभे को 10 सेकंड में पार करती है। किमी/घंटा में इसकी गति क्या है:\",\"oe\":[\"20\",\"54\",\"72\",\"36\"],\"oh\":[\"20\",\"54\",\"72\",\"36\"],\"a\":2,\"ee\":\"Speed = 200/10 = 20 m/s. Convert to km/hr: 20 × (18/5) = 72 km/hr.\",\"eh\":\"गति = 200/10 = 20 मीटर/सेकंड। किमी/घंटा में: 20 × (18/5) = 72 किमी/घंटा।\"},{\"n\":44,\"d\":\"\",\"se\":\"The compound interest on ₹8,000 at 10% p.a. for 3 years, compounded annually, is:\",\"sh\":\"₹8,000 पर 10% प्रति वर्ष की दर से 3 वर्ष का चक्रवृद्धि ब्याज (वार्षिक रूप से संयोजित) कितना होगा:\",\"oe\":[\"₹2,400\",\"₹2,480\",\"₹2,500\",\"₹2,648\"],\"oh\":[\"₹2,400\",\"₹2,480\",\"₹2,500\",\"₹2,648\"],\"a\":3,\"ee\":\"Amount = 8000(1.1)³ = 8000 × 1.331 = ₹10,648. CI = 10,648 - 8000 = ₹2,648.\",\"eh\":\"मिश्रधन = 8000(1.1)³ = 8000 × 1.331 = ₹10,648। चक्रवृद्धि ब्याज = 10,648 - 8000 = ₹2,648।\"},{\"n\":45,\"d\":\"\",\"se\":\"If a:b = 2:3 and b:c = 4:5, then a:c is:\",\"sh\":\"यदि a:b = 2:3 और b:c = 4:5 है, तो a:c का मान है:\",\"oe\":[\"8:15\",\"2:5\",\"6:10\",\"4:5\"],\"oh\":[\"8:15\",\"2:5\",\"6:10\",\"4:5\"],\"a\":0,\"ee\":\"(a/b) × (b/c) = (2/3) × (4/5) = 8/15.\",\"eh\":\"(a/b) × (b/c) = (2/3) × (4/5) = 8/15।\"},{\"n\":46,\"d\":\"\",\"se\":\"The average of 5 consecutive odd numbers is 31. The smallest number among them is:\",\"sh\":\"5 लगातार विषम संख्याओं का औसत 31 है। उनमें से सबसे छोटी संख्या कौन सी है:\",\"oe\":[\"31\",\"27\",\"33\",\"29\"],\"oh\":[\"31\",\"27\",\"33\",\"29\"],\"a\":1,\"ee\":\"The average of a symmetrical sequence is the middle term (31). The numbers are 27, 29, 31, 33, 35.\",\"eh\":\"सममित अनुक्रम का औसत मध्य पद (31) होता है। संख्याएँ 27, 29, 31, 33, 35 हैं।\"},{\"n\":47,\"d\":\"\",\"se\":\"A person covers a distance of 300 km in 6 hours. If he increases his speed by 25%, how long will he take for the same distance?\",\"sh\":\"एक व्यक्ति 300 किमी की दूरी 6 घंटे में तय करता है। यदि वह अपनी गति 25% बढ़ा देता है, तो उसे समान दूरी के लिए कितना समय लगेगा?\",\"oe\":[\"5.0 h\",\"5.2 h\",\"4.8 h\",\"4.5 h\"],\"oh\":[\"5.0 घंटे\",\"5.2 घंटे\",\"4.8 घंटे\",\"4.5 घंटे\"],\"a\":2,\"ee\":\"Original speed = 300/6 = 50 km/h. New speed = 50 × 1.25 = 62.5 km/h. New time = 300/62.5 = 4.8 hours.\",\"eh\":\"मूल गति = 300/6 = 50 किमी/घंटा। नई गति = 50 × 1.25 = 62.5 किमी/घंटा। नया समय = 300/62.5 = 4.8 घंटे।\"},{\"n\":48,\"d\":\"\",\"se\":\"20% of 200 + 10% of 150 = ?\",\"sh\":\"200 का 20% + 150 का 10% = ?\",\"oe\":[\"50\",\"45\",\"60\",\"55\"],\"oh\":[\"50\",\"45\",\"60\",\"55\"],\"a\":3,\"ee\":\"40 + 15 = 55.\",\"eh\":\"40 + 15 = 55।\"},{\"n\":49,\"d\":\"\",\"se\":\"If the selling price of an article is doubled, the profit becomes four times the original profit. What is the original profit percentage?\",\"sh\":\"यदि किसी वस्तु का विक्रय मूल्य (Selling Price) दोगुना कर दिया जाए, तो लाभ मूल लाभ का चार गुना हो जाता है। मूल लाभ प्रतिशत क्या है?\",\"oe\":[\"50%\",\"33.33%\",\"100%\",\"25%\"],\"oh\":[\"50%\",\"33.33%\",\"100%\",\"25%\"],\"a\":0,\"ee\":\"Let CP=100. P1 = SP - 100. P2 = 2SP - 100. If P2 = 4(P1), then 2SP - 100 = 4SP - 400. 2SP = 300, SP = 150. Profit = 50. Profit % = 50%.\",\"eh\":\"मान लें CP=100। लाभ (P1) = SP - 100। नया लाभ (P2) = 2SP - 100। यदि P2 = 4(P1), तो 2SP - 100 = 4SP - 400। 2SP = 300 → SP = 150। मूल लाभ = 50। लाभ % = 50%।\"},{\"n\":50,\"d\":\"\",\"se\":\"A and B together can do a piece of work in 12 days. B alone can do it in 30 days. A alone can do it in:\",\"sh\":\"A और B मिलकर किसी कार्य को 12 दिनों में कर सकते हैं। B अकेला इसे 30 दिनों में कर सकता है। A अकेला इसे कितने दिनों में करेगा:\",\"oe\":[\"24 days\",\"20 days\",\"15 days\",\"18 days\"],\"oh\":[\"24 दिन\",\"20 दिन\",\"15 दिन\",\"18 दिन\"],\"a\":1,\"ee\":\"A&rsquo;s 1-day work = 1/12 – 1/30 = (5–2)/60 = 3/60 = 1/20. So, A takes 20 days.\",\"eh\":\"A का 1 दिन का कार्य = 1/12 – 1/30 = (5–2)/60 = 3/60 = 1/20। अतः A को 20 दिन लगेंगे।\"},{\"n\":51,\"d\":\"\",\"se\":\"The value of (0.6)² + (0.4)² + (2 × 0.6 × 0.4) is:\",\"sh\":\"(0.6)² + (0.4)² + (2 × 0.6 × 0.4) का मान है:\",\"oe\":[\"0.6\",\"1.2\",\"1\",\"0.8\"],\"oh\":[\"0.6\",\"1.2\",\"1\",\"0.8\"],\"a\":2,\"ee\":\"Uses formula a² + b² + 2ab = (a+b)². (0.6 + 0.4)² = 1² = 1.\",\"eh\":\"सूत्र a² + b² + 2ab = (a+b)² का प्रयोग। (0.6 + 0.4)² = 1² = 1।\"},{\"n\":52,\"d\":\"\",\"se\":\"If x/y = 3/4, find the value of (y + x) / (y - x).\",\"sh\":\"यदि x/y = 3/4, तो (y + x) / (y - x) का मान ज्ञात करें:\",\"oe\":[\"1\",\"7\",\"1/7\",\"7\"],\"oh\":[\"1\",\"7\",\"1/7\",\"7\"],\"a\":3,\"ee\":\"(4 + 3) / (4 - 3) = 7 / 1 = 7.\",\"eh\":\"(4 + 3) / (4 - 3) = 7 / 1 = 7।\"},{\"n\":53,\"d\":\"\",\"se\":\"The population of a town increases by 10% every year. If the present population is 50,000, what will it be after 2 years?\",\"sh\":\"एक कस्बे की जनसंख्या में हर साल 10% की वृद्धि होती है। यदि वर्तमान जनसंख्या 50,000 है, तो 2 वर्ष बाद यह क्या होगी?\",\"oe\":[\"60,500\",\"55,500\",\"55,000\",\"60,000\"],\"oh\":[\"60,500\",\"55,500\",\"55,000\",\"60,000\"],\"a\":0,\"ee\":\"50,000 × 1.1 × 1.1 = 60,500.\",\"eh\":\"50,000 × 1.1 × 1.1 = 60,500।\"},{\"n\":54,\"d\":\"\",\"se\":\"A sum of money doubles itself in 8 years at simple interest. The rate of interest per annum is:\",\"sh\":\"साधारण ब्याज पर कोई राशि 8 वर्षों में स्वयं की दोगुनी हो जाती है। प्रति वर्ष ब्याज दर है:\",\"oe\":[\"20%\",\"12.5%\",\"10%\",\"16%\"],\"oh\":[\"20%\",\"12.5%\",\"10%\",\"16%\"],\"a\":1,\"ee\":\"Interest equals Principal in 8 years. Rate = (100 / 8) = 12.5%.\",\"eh\":\"8 वर्षों में ब्याज मूलधन के बराबर हो जाता है। दर = (100 / 8) = 12.5%।\"},{\"n\":55,\"d\":\"\",\"se\":\"The HCF of 24 and 36 is:\",\"sh\":\"24 और 36 का महत्तम समापवर्तक (HCF) है:\",\"oe\":[\"24\",\"6\",\"12\",\"18\"],\"oh\":[\"24\",\"6\",\"12\",\"18\"],\"a\":2,\"ee\":\"The largest number dividing both without a remainder is 12.\",\"eh\":\"वह सबसे बड़ी संख्या जो दोनों को पूर्णतः विभाजित करे, 12 है।\"},{\"n\":56,\"d\":\"\",\"se\":\"The product of two numbers is 120 and their sum is 23. The numbers are:\",\"sh\":\"दो संख्याओं का गुणनफल 120 है और उनका योग 23 है। संख्याएँ हैं:\",\"oe\":[\"10 and 12\",\"6 and 20\",\"9 and 14\",\"8 and 15\"],\"oh\":[\"10 और 12\",\"6 और 20\",\"9 और 14\",\"8 और 15\"],\"a\":3,\"ee\":\"8 + 15 = 23 and 8 × 15 = 120.\",\"eh\":\"8 + 15 = 23 और 8 × 15 = 120।\"},{\"n\":57,\"d\":\"\",\"se\":\"A man buys 10 oranges for ₹20 and sells them at ₹3 per orange. His profit percent is:\",\"sh\":\"एक आदमी ₹20 में 10 संतरे खरीदता है और उन्हें ₹3 प्रति संतरे की दर से बेचता है। उसका लाभ प्रतिशत है:\",\"oe\":[\"50%\",\"33.33%\",\"20%\",\"25%\"],\"oh\":[\"50%\",\"33.33%\",\"20%\",\"25%\"],\"a\":0,\"ee\":\"CP of 1 orange = ₹2. SP = ₹3. Profit = ₹1. Profit % = (1/2) × 100 = 50%.\",\"eh\":\"1 संतरे का क्रय मूल्य (CP) = ₹2। विक्रय मूल्य (SP) = ₹3। लाभ = ₹1। लाभ % = (1/2) × 100 = 50%।\"},{\"n\":58,\"d\":\"\",\"se\":\"The difference between the compound interest and simple interest on ₹2,000 for 2 years at 10% p.a. is:\",\"sh\":\"₹2,000 पर 2 वर्ष के लिए 10% प्रति वर्ष की दर से चक्रवृद्धि ब्याज और साधारण ब्याज के बीच का अंतर है:\",\"oe\":[\"₹40\",\"₹20\",\"₹10\",\"₹30\"],\"oh\":[\"₹40\",\"₹20\",\"₹10\",\"₹30\"],\"a\":1,\"ee\":\"Difference = P(R/100)² = 2000(10/100)² = 2000 × 0.01 = ₹20.\",\"eh\":\"अंतर = P(R/100)² = 2000(10/100)² = 2000 × 0.01 = ₹20।\"},{\"n\":59,\"d\":\"\",\"se\":\"Which number will replace the question mark? 2, 5, 10, 17, 26, ?\",\"sh\":\"प्रश्न चिह्न (?) के स्थान पर कौन सी संख्या आएगी: 2, 5, 10, 17, 26, ?\",\"oe\":[\"40\",\"36\",\"37\",\"34\"],\"oh\":[\"40\",\"36\",\"37\",\"34\"],\"a\":2,\"ee\":\"The differences between consecutive terms are consecutive odd numbers: 3, 5, 7, 9, 11. Next is 26 + 11 = 37.\",\"eh\":\"क्रमागत पदों के बीच का अंतर लगातार विषम संख्याएं हैं: 3, 5, 7, 9, 11। अगली संख्या 26 + 11 = 37 होगी।\"},{\"n\":60,\"d\":\"\",\"se\":\"A man walks 10 km north, then turns right and walks 5 km, then turns left and walks 5 km. He is now in which direction relative to his starting point?\",\"sh\":\"एक आदमी उत्तर की ओर 10 किमी चलता है, फिर दाएँ मुड़ता है और 5 किमी चलता है, फिर बाएँ मुड़ता है और 5 किमी चलता है। अब वह अपने प्रारंभिक बिंदु के संबंध में किस दिशा में है?\",\"oe\":[\"South‑West\",\"South‑East\",\"North‑West\",\"North‑East\"],\"oh\":[\"दक्षिण-पश्चिम (South-West)\",\"दक्षिण-पूर्व (South-East)\",\"उत्तर-पश्चिम (North-West)\",\"उत्तर-पूर्व (North-East)\"],\"a\":3,\"ee\":\"Total movement is 15 km North and 5 km East. This places him North-East of his start.\",\"eh\":\"कुल दूरी उत्तर में 15 किमी और पूर्व में 5 किमी है। इसलिए वह उत्तर-पूर्व दिशा में है।\"},{\"n\":61,\"d\":\"\",\"se\":\"In a family, A is the brother of B. B is the daughter of C. C is the wife of D. How is D related to A?\",\"sh\":\"एक परिवार में, A, B का भाई है। B, C की पुत्री है। C, D की पत्नी है। D, A से किस प्रकार संबंधित है?\",\"oe\":[\"Father\",\"Mother\",\"Brother\",\"Uncle\"],\"oh\":[\"पिता\",\"माता\",\"भाई\",\"चाचा\"],\"a\":0,\"ee\":\"C and D are parents to B. Since A is B's brother, D is A's father.\",\"eh\":\"C और D, B के माता-पिता हैं। चूँकि A, B का भाई है, इसलिए D, A का पिता है।\"},{\"n\":62,\"d\":\"\",\"se\":\"If every Sunday is a holiday and 1st January is a Sunday, the number of holidays in January (which has 31 days) is:\",\"sh\":\"यदि हर रविवार को छुट्टी होती है और 1 जनवरी को रविवार है, तो जनवरी (31 दिन) के महीने में छुट्टियों की संख्या कितनी होगी:\",\"oe\":[\"7\",\"5\",\"6\",\"4\"],\"oh\":[\"7\",\"5\",\"6\",\"4\"],\"a\":1,\"ee\":\"Sundays will fall on the 1st, 8th, 15th, 22nd, and 29th (5 days).\",\"eh\":\"रविवार 1, 8, 15, 22, और 29 तारीख को पड़ेंगे (कुल 5 दिन)।\"},{\"n\":63,\"d\":\"\",\"se\":\"Find the next term: 1, 4, 9, 16, 25, ?\",\"sh\":\"श्रृंखला में अगला पद खोजें: 1, 4, 9, 16, 25, ?\",\"oe\":[\"32\",\"35\",\"36\",\"30\"],\"oh\":[\"32\",\"35\",\"36\",\"30\"],\"a\":2,\"ee\":\"Sequence of squares (1², 2², 3², 4², 5², 6²).\",\"eh\":\"यह प्राकृत संख्याओं के वर्गों की श्रृंखला है (1², 2², 3², 4², 5², 6²)।\"},{\"n\":64,\"d\":\"\",\"se\":\"Which number comes next? 2, 6, 18, 54, ?\",\"sh\":\"अगली संख्या कौन सी आएगी: 2, 6, 18, 54, ?\",\"oe\":[\"216\",\"72\",\"108\",\"162\"],\"oh\":[\"216\",\"72\",\"108\",\"162\"],\"a\":3,\"ee\":\"Each number is multiplied by 3. 54 × 3 = 162.\",\"eh\":\"प्रत्येक संख्या को 3 से गुणा किया गया है। 54 × 3 = 162।\"},{\"n\":65,\"d\":\"\",\"se\":\"A person faces North. He turns 90 degrees clockwise, and then turns 135 degrees anti-clockwise. Which direction is he facing now?\",\"sh\":\"एक व्यक्ति उत्तर (North) की ओर मुंह करके खड़ा है। वह घड़ी की दिशा (Clockwise) में 90 डिग्री घूमता है, और फिर घड़ी की विपरीत दिशा (Anti-clockwise) में 135 डिग्री घूमता है। अब वह किस दिशा की ओर मुंह किए हुए है?\",\"oe\":[\"North-West\",\"South-East\",\"North-East\",\"South-West\"],\"oh\":[\"उत्तर-पश्चिम (North-West)\",\"दक्षिण-पूर्व (South-East)\",\"उत्तर-पूर्व (North-East)\",\"दक्षिण-पश्चिम (South-West)\"],\"a\":0,\"ee\":\"North + 90 CW = East. East + 135 ACW = North-West.\",\"eh\":\"उत्तर + 90 CW = पूर्व (East)। पूर्व + 135 ACW = उत्तर-पश्चिम (North-West)।\"},{\"n\":66,\"d\":\"\",\"se\":\"A clock shows 10:15. What is the smaller angle between the hour and minute hands?\",\"sh\":\"एक घड़ी 10:15 का समय दिखाती है। घंटे और मिनट की सुइयों के बीच का (छोटा) कोण क्या है?\",\"oe\":[\"147.5°\",\"142.5°\",\"150°\",\"145°\"],\"oh\":[\"147.5°\",\"142.5°\",\"150°\",\"145°\"],\"a\":1,\"ee\":\"Hour hand moves 30° per hour. At 10:15, it's at (10 × 30) + (15 × 0.5) = 307.5°. Minute hand is at 90°. 307.5 - 90 = 217.5°. The smaller angle is 360° - 217.5° = 142.5°.\",\"eh\":\"घंटे की सुई 10:15 पर (10 × 30) + (15 × 0.5) = 307.5° पर है। मिनट की सुई 90° पर है। अंतर = 217.5°। छोटा कोण = 360° - 217.5° = 142.5°।\"},{\"n\":67,\"d\":\"\",\"se\":\"Find the next term in the series: AZ, BY, CX, DW, ?\",\"sh\":\"श्रृंखला में अगला पद ज्ञात कीजिए: AZ, BY, CX, DW, ?\",\"oe\":[\"EW\",\"FU\",\"EV\",\"EU\"],\"oh\":[\"EW\",\"FU\",\"EV\",\"EU\"],\"a\":2,\"ee\":\"The first letters go forward (A,B,C,D,E) and second go backwards (Z,Y,X,W,V).\",\"eh\":\"पहला अक्षर आगे की ओर (A,B,C,D,E) और दूसरा पीछे की ओर (Z,Y,X,W,V) बढ़ रहा है।\"},{\"n\":68,\"d\":\"\",\"se\":\"Find the missing number: 2, 3, 5, 7, 11, ?\",\"sh\":\"लुप्त संख्या ज्ञात कीजिए: 2, 3, 5, 7, 11, ?\",\"oe\":[\"15\",\"17\",\"19\",\"13\"],\"oh\":[\"15\",\"17\",\"19\",\"13\"],\"a\":3,\"ee\":\"This is a series of consecutive prime numbers.\",\"eh\":\"यह लगातार अभाज्य (Prime) संख्याओं की श्रृंखला है।\"},{\"n\":69,\"d\":\"\",\"se\":\"In a certain code language, &quot;253&quot; means &quot;books are old&quot;, &quot;546&quot; means &quot;man is old&quot;, and &quot;378&quot; means &quot;buy good books&quot;. What digit stands for &quot;are&quot;?\",\"sh\":\"एक निश्चित कूट भाषा में, &quot;253&quot; का अर्थ &quot;books are old&quot; है, &quot;546&quot; का अर्थ &quot;man is old&quot; है, और &quot;378&quot; का अर्थ &quot;buy good books&quot; है। कौन सा अंक &quot;are&quot; को दर्शाता है?\",\"oe\":[\"2\",\"5\",\"6\",\"4\"],\"oh\":[\"2\",\"5\",\"6\",\"4\"],\"a\":0,\"ee\":\"Between 1st and 2nd statement, &quot;old&quot; is common, digit '5' is common. Between 1st and 3rd, &quot;books&quot; is common, digit '3' is common. Thus, in &quot;253&quot;, '2' stands for &quot;are&quot;.\",\"eh\":\"पहले और दूसरे वाक्य में &quot;old&quot; और अंक '5' आम (common) है। पहले और तीसरे में &quot;books&quot; और अंक '3' आम है। अतः &quot;253&quot; में, '2' का अर्थ &quot;are&quot; है।\"},{\"n\":70,\"d\":\"\",\"se\":\"A statement is given followed by two assumptions. Mark the correct option. <em>Statement:</em> &ldquo;You must have a smart phone to access this application.&rdquo; <em>Assumptions:</em> I. Smart phones are readily available in the market. II. The application cannot be accessed via a desktop computer.\",\"sh\":\"एक कथन और उसके बाद दो पूर्वधारणाएँ दी गई हैं। सही विकल्प चुनें। <em>कथन:</em> &quot;इस एप्लिकेशन को एक्सेस करने के लिए आपके पास एक स्मार्ट फोन होना चाहिए।&quot; <em>पूर्वधारणाएँ:</em> I. स्मार्ट फोन बाजार में आसानी से उपलब्ध हैं। II. एप्लिकेशन को डेस्कटॉप कंप्यूटर के माध्यम से एक्सेस नहीं किया जा सकता है।\",\"oe\":[\"Only I is implicit\",\"Only II is implicit\",\"Both I and II are implicit\",\"Neither is implicit\"],\"oh\":[\"केवल I अंतर्निहित है\",\"केवल II अंतर्निहित है\",\"I और II दोनों अंतर्निहित हैं\",\"कोई भी अंतर्निहित नहीं है\"],\"a\":1,\"ee\":\"The statement expressly makes a smartphone a requirement, implying no other method (like a desktop) works. Availability is an extraneous assumption.\",\"eh\":\"कथन स्पष्ट रूप से स्मार्ट फोन को अनिवार्य बनाता है, जिसका तात्पर्य है कि कोई अन्य तरीका (जैसे डेस्कटॉप) काम नहीं करता। उपलब्धता एक बाहरी पूर्वधारणा है।\"},{\"n\":71,\"d\":\"\",\"se\":\"Pointing to a photograph, a man says, &quot;She is the only daughter of my wife's mother-in-law.&quot; How is the woman in the photograph related to the man?\",\"sh\":\"एक तस्वीर की ओर इशारा करते हुए एक आदमी कहता है, &quot;वह मेरी पत्नी की सास की इकलौती बेटी है।&quot; तस्वीर में दिख रही महिला का उस आदमी से क्या संबंध है?\",\"oe\":[\"Wife\",\"Sister\",\"Mother\",\"Daughter\"],\"oh\":[\"पत्नी (Wife)\",\"बहन (Sister)\",\"माँ (Mother)\",\"बेटी (Daughter)\"],\"a\":1,\"ee\":\"The man's wife's mother-in-law is the man's mother. The only daughter of his mother is his sister.\",\"eh\":\"आदमी की पत्नी की सास उसकी माँ होती है। उसकी माँ की इकलौती बेटी उस आदमी की बहन है।\"},{\"n\":72,\"d\":\"\",\"se\":\"Which of the following is a valid conclusion from the given statements? <em>Statements:</em> All dogs are animals. Some animals are pets.\",\"sh\":\"दिए गए कथनों से निम्नलिखित में से कौन सा निष्कर्ष वैध (valid) है? <em>कथन:</em> सभी कुत्ते जानवर हैं। कुछ जानवर पालतू हैं।\",\"oe\":[\"All dogs are pets\",\"Some dogs are pets\",\"No definite conclusion regarding dogs and pets\",\"Some pets are dogs\"],\"oh\":[\"सभी कुत्ते पालतू हैं\",\"कुछ कुत्ते पालतू हैं\",\"कुत्तों और पालतू जानवरों के बीच कोई निश्चित निष्कर्ष नहीं निकाला जा सकता\",\"कुछ पालतू कुत्ते हैं\"],\"a\":2,\"ee\":\"The overlapping category (pets) connects to animals generally, not specifically to dogs.\",\"eh\":\"&quot;पालतू&quot; जानवर श्रेणी से जुड़ता है, विशेष रूप से कुत्तों से नहीं। कोई सीधा संबंध स्थापित नहीं होता।\"},{\"n\":73,\"d\":\"\",\"se\":\"If in a certain code, &quot;STAR&quot; is coded as &quot;TUBS&quot;, then how will &quot;MOON&quot; be coded?\",\"sh\":\"यदि एक निश्चित कूट में &quot;STAR&quot; को &quot;TUBS&quot; लिखा जाता है, तो &quot;MOON&quot; को कैसे लिखा जाएगा?\",\"oe\":[\"NQPO\",\"NPPN\",\"NPPM\",\"NPPO\"],\"oh\":[\"NQPO\",\"NPPN\",\"NPPM\",\"NPPO\"],\"a\":3,\"ee\":\"Each letter is shifted forward by +1 in the alphabet series. (S→T, T→U, A→B, R→S).\",\"eh\":\"प्रत्येक अक्षर वर्णमाला श्रृंखला में +1 आगे बढ़ाया गया है। (M→N, O→P, O→P, N→O)।\"},{\"n\":74,\"d\":\"\",\"se\":\"Choose the correct synonym of &ldquo;Diligent&rdquo;:\",\"sh\":\"Choose the correct synonym of &ldquo;Diligent&rdquo;:\",\"oe\":[\"Hardworking\",\"Careless\",\"Sloppy\",\"Lazy\"],\"oh\":[\"Hardworking\",\"Careless\",\"Sloppy\",\"Lazy\"],\"a\":0,\"ee\":\"Diligent implies careful and persistent work (hardworking).\",\"eh\":\"Diligent implies careful and persistent work (hardworking).\"},{\"n\":75,\"d\":\"\",\"se\":\"Select the antonym of &ldquo;Frugal&rdquo;:\",\"sh\":\"Select the antonym of &ldquo;Frugal&rdquo;:\",\"oe\":[\"Thrifty\",\"Extravagant\",\"Prudent\",\"Economical\"],\"oh\":[\"Thrifty\",\"Extravagant\",\"Prudent\",\"Economical\"],\"a\":1,\"ee\":\"Frugal means sparing or economical. The opposite is extravagant.\",\"eh\":\"Frugal means sparing or economical. The opposite is extravagant.\"},{\"n\":76,\"d\":\"\",\"se\":\"Identify the error in the sentence: &ldquo;One of the boys have broken the glass.&rdquo;\",\"sh\":\"Identify the error in the sentence: &ldquo;One of the boys have broken the glass.&rdquo;\",\"oe\":[\"broken\",\"of the boys\",\"have\",\"One\"],\"oh\":[\"broken\",\"of the boys\",\"have\",\"One\"],\"a\":2,\"ee\":\"The phrase &quot;One of the...&quot; takes a singular verb. &quot;Have&quot; should be &quot;has&quot;.\",\"eh\":\"The phrase &quot;One of the...&quot; takes a singular verb. &quot;Have&quot; should be &quot;has&quot;.\"},{\"n\":77,\"d\":\"\",\"se\":\"Fill in the blank: &ldquo;She is ____ to her work.&rdquo;\",\"sh\":\"Fill in the blank: &ldquo;She is ____ to her work.&rdquo;\",\"oe\":[\"commits\",\"committing\",\"commit\",\"committed\"],\"oh\":[\"commits\",\"committing\",\"commit\",\"committed\"],\"a\":3,\"ee\":\"Committed (adjective form used here).\",\"eh\":\"Committed (adjective form used here).\"},{\"n\":78,\"d\":\"\",\"se\":\"One‑word substitution for &ldquo;A person who is unable to pay his debts&rdquo;:\",\"sh\":\"One‑word substitution for &ldquo;A person who is unable to pay his debts&rdquo;:\",\"oe\":[\"Insolvent\",\"Bankrupt\",\"Both A and B\",\"Defaulter\"],\"oh\":[\"Insolvent\",\"Bankrupt\",\"Both A and B\",\"Defaulter\"],\"a\":2,\"ee\":\"Both insolvent and bankrupt mean the inability to pay debts.\",\"eh\":\"Both insolvent and bankrupt mean the inability to pay debts.\"},{\"n\":79,\"d\":\"\",\"se\":\"What is the correct plural form of &ldquo;alumnus&rdquo;?\",\"sh\":\"What is the correct plural form of &ldquo;alumnus&rdquo;?\",\"oe\":[\"Alumni\",\"Alum\",\"Alumnae\",\"Alumnuses\"],\"oh\":[\"Alumni\",\"Alum\",\"Alumnae\",\"Alumnuses\"],\"a\":0,\"ee\":\"Alumni is the plural of the masculine singular alumnus.\",\"eh\":\"Alumni is the plural of the masculine singular alumnus.\"},{\"n\":80,\"d\":\"\",\"se\":\"Choose the correctly spelt word:\",\"sh\":\"Choose the correctly spelt word:\",\"oe\":[\"Necassary\",\"Necessary\",\"Neccessary\",\"Necesary\"],\"oh\":[\"Necassary\",\"Necessary\",\"Neccessary\",\"Necesary\"],\"a\":1,\"ee\":\"Necessary (one 'c', two 's's).\",\"eh\":\"Necessary (one 'c', two 's's).\"},{\"n\":81,\"d\":\"\",\"se\":\"Change the voice: &ldquo;The letter was written by him.&rdquo;\",\"sh\":\"Change the voice: &ldquo;The letter was written by him.&rdquo;\",\"oe\":[\"He was writing the letter\",\"He has written the letter\",\"He wrote the letter\",\"He writes the letter\"],\"oh\":[\"He was writing the letter\",\"He has written the letter\",\"He wrote the letter\",\"He writes the letter\"],\"a\":2,\"ee\":\"Simple past active voice equivalent.\",\"eh\":\"Simple past active voice equivalent.\"},{\"n\":82,\"d\":\"\",\"se\":\"Choose the appropriate preposition: &ldquo;He is very interested ____ sports.&rdquo;\",\"sh\":\"Choose the appropriate preposition: &ldquo;He is very interested ____ sports.&rdquo;\",\"oe\":[\"for\",\"at\",\"on\",\"in\"],\"oh\":[\"for\",\"at\",\"on\",\"in\"],\"a\":3,\"ee\":\"&quot;Interested&quot; is followed by the preposition &quot;in&quot;.\",\"eh\":\"&quot;Interested&quot; is followed by the preposition &quot;in&quot;.\"},{\"n\":83,\"d\":\"\",\"se\":\"The sentence &ldquo;He is too weak to walk&rdquo; means:\",\"sh\":\"The sentence &ldquo;He is too weak to walk&rdquo; means:\",\"oe\":[\"He is so weak that he cannot walk\",\"He walks weakly\",\"He is weak enough to walk\",\"He is weak but can walk\"],\"oh\":[\"He is so weak that he cannot walk\",\"He walks weakly\",\"He is weak enough to walk\",\"He is weak but can walk\"],\"a\":0,\"ee\":\"&quot;Too [adjective] to [verb]&quot; structure implies a negative consequence.\",\"eh\":\"&quot;Too [adjective] to [verb]&quot; structure implies a negative consequence.\"},{\"n\":84,\"d\":\"\",\"se\":\"Identify the part of speech of the underlined word: &ldquo;She ran <strong>quickly</strong>.&rdquo;\",\"sh\":\"Identify the part of speech of the underlined word: &ldquo;She ran <strong>quickly</strong>.&rdquo;\",\"oe\":[\"Verb\",\"Adverb\",\"Adjective\",\"Noun\"],\"oh\":[\"Verb\",\"Adverb\",\"Adjective\",\"Noun\"],\"a\":1,\"ee\":\"Quickly modifies the verb &quot;ran&quot;.\",\"eh\":\"Quickly modifies the verb &quot;ran&quot;.\"},{\"n\":85,\"d\":\"\",\"se\":\"Choose the correct article: &ldquo;He is ____ honest man.&rdquo;\",\"sh\":\"Choose the correct article: &ldquo;He is ____ honest man.&rdquo;\",\"oe\":[\"a\",\"no article\",\"an\",\"the\"],\"oh\":[\"a\",\"no article\",\"an\",\"the\"],\"a\":2,\"ee\":\"&quot;Honest&quot; begins with a vowel sound (silent 'h').\",\"eh\":\"&quot;Honest&quot; begins with a vowel sound (silent 'h').\"},{\"n\":86,\"d\":\"\",\"se\":\"The capital of Madhya Pradesh is:\",\"sh\":\"मध्य प्रदेश की राजधानी क्या है:\",\"oe\":[\"Lucknow\",\"Jaipur\",\"Raipur\",\"Bhopal\"],\"oh\":[\"लखनऊ\",\"जयपुर\",\"रायपुर\",\"भोपाल\"],\"a\":3,\"ee\":\"Bhopal.\",\"eh\":\"भोपाल।\"},{\"n\":87,\"d\":\"\",\"se\":\"Which is the longest river in India (by distance within the country)?\",\"sh\":\"भारत में बहने वाली सबसे लंबी नदी (देश के भीतर) कौन सी है?\",\"oe\":[\"Ganga\",\"Brahmaputra\",\"Yamuna\",\"Godavari\"],\"oh\":[\"गंगा\",\"ब्रह्मपुत्र\",\"यमुना\",\"गोदावरी\"],\"a\":0,\"ee\":\"Ganga (~2,525 km).\",\"eh\":\"गंगा (लगभग 2,525 किमी)।\"},{\"n\":88,\"d\":\"\",\"se\":\"India&rsquo;s first woman President was:\",\"sh\":\"भारत की पहली महिला राष्ट्रपति कौन थीं?\",\"oe\":[\"Indira Gandhi\",\"Pratibha Patil\",\"Sarojini Naidu\",\"Sonia Gandhi\"],\"oh\":[\"इंदिरा गांधी\",\"प्रतिभा पाटिल\",\"सरोजिनी नायडू\",\"सोनिया गांधी\"],\"a\":1,\"ee\":\"Pratibha Patil served as the 12th President of India (2007–2012).\",\"eh\":\"प्रतिभा पाटिल भारत की 12वीं राष्ट्रपति थीं (2007–2012)।\"},{\"n\":89,\"d\":\"\",\"se\":\"The 2024 Summer Olympics were hosted in:\",\"sh\":\"2024 के ग्रीष्मकालीन ओलंपिक खेलों का आयोजन कहाँ किया गया?\",\"oe\":[\"Beijing\",\"London\",\"Paris\",\"Tokyo\"],\"oh\":[\"बीजिंग\",\"लंदन\",\"पेरिस\",\"टोक्यो\"],\"a\":2,\"ee\":\"Paris, France.\",\"eh\":\"पेरिस, फ्रांस में।\"},{\"n\":90,\"d\":\"\",\"se\":\"Who was the first Chief Minister of Chhattisgarh?\",\"sh\":\"छत्तीसगढ़ के पहले मुख्यमंत्री कौन थे?\",\"oe\":[\"Bhupesh Baghel\",\"Vishnu Deo Sai\",\"Raman Singh\",\"Ajit Jogi\"],\"oh\":[\"भूपेश बघेल\",\"विष्णु देव साय\",\"रमन सिंह\",\"अजीत जोगी\"],\"a\":3,\"ee\":\"Ajit Jogi served as the first CM when the state was formed in 2000.\",\"eh\":\"वर्ष 2000 में राज्य के गठन के समय अजीत जोगी पहले मुख्यमंत्री बने थे।\"},{\"n\":91,\"d\":\"\",\"se\":\"Which planet is known as the &ldquo;Morning Star&rdquo; as well as the &ldquo;Evening Star&rdquo;?\",\"sh\":\"किस ग्रह को &quot;भोर का तारा&quot; (Morning Star) और &quot;सांझ का तारा&quot; (Evening Star) कहा जाता है?\",\"oe\":[\"Venus\",\"Mars\",\"Mercury\",\"Jupiter\"],\"oh\":[\"शुक्र (Venus)\",\"मंगल\",\"बुध\",\"बृहस्पति\"],\"a\":0,\"ee\":\"Venus is extremely bright and visible at dawn and dusk.\",\"eh\":\"शुक्र, जो सूर्योदय और सूर्यास्त के समय बहुत चमकीला दिखाई देता है।\"},{\"n\":92,\"d\":\"\",\"se\":\"The de-facto national sport of India is:\",\"sh\":\"भारत का अघोषित (De-facto) राष्ट्रीय खेल कौन सा है:\",\"oe\":[\"Cricket\",\"Hockey\",\"Football\",\"Kabaddi\"],\"oh\":[\"क्रिकेट\",\"हॉकी\",\"फुटबॉल\",\"कबड्डी\"],\"a\":1,\"ee\":\"Field Hockey.\",\"eh\":\"फील्ड हॉकी।\"},{\"n\":93,\"d\":\"\",\"se\":\"India&rsquo;s first nuclear test (Operation Smiling Buddha) was conducted in:\",\"sh\":\"भारत का पहला परमाणु परीक्षण (ऑपरेशन स्माइलिंग बुद्धा) किस वर्ष किया गया था?\",\"oe\":[\"1947\",\"1998\",\"1974\",\"1965\"],\"oh\":[\"1947\",\"1998\",\"1974\",\"1965\"],\"a\":2,\"ee\":\"Conducted in Pokhran in 1974.\",\"eh\":\"1974 में पोखरण में किया गया था।\"},{\"n\":94,\"d\":\"\",\"se\":\"The full form of SEBI is:\",\"sh\":\"SEBI का पूर्ण रूप क्या है:\",\"oe\":[\"State Exchange Board\",\"Stock Exchange Board of India\",\"Securities and Exchange Bureau\",\"Securities and Exchange Board of India\"],\"oh\":[\"स्टेट एक्सचेंज बोर्ड\",\"स्टॉक एक्सचेंज बोर्ड ऑफ इंडिया\",\"सिक्योरिटीज एंड एक्सचेंज ब्यूरो\",\"सिक्योरिटीज एंड एक्सचेंज बोर्ड ऑफ इंडिया (Securities and Exchange Board of India)\"],\"a\":3,\"ee\":\"Securities and Exchange Board of India.\",\"eh\":\"भारतीय प्रतिभूति और विनिमय बोर्ड (SEBI)।\"},{\"n\":95,\"d\":\"\",\"se\":\"The headquarters of UNESCO is located in:\",\"sh\":\"यूनेस्को (UNESCO) का मुख्यालय कहाँ स्थित है:\",\"oe\":[\"Paris\",\"Geneva\",\"New York\",\"London\"],\"oh\":[\"पेरिस\",\"जिनेवा\",\"न्यूयॉर्क\",\"लंदन\"],\"a\":0,\"ee\":\"Paris, France.\",\"eh\":\"पेरिस, फ्रांस।\"},{\"n\":96,\"d\":\"\",\"se\":\"South Eastern Coalfields Limited (SECL) is a subsidiary of:\",\"sh\":\"साउथ ईस्टर्न कोलफील्ड्स लिमिटेड (SECL) किसकी सहायक कंपनी है:\",\"oe\":[\"GAIL\",\"Coal India Limited\",\"NTPC\",\"SAIL\"],\"oh\":[\"GAIL\",\"कोल इंडिया लिमिटेड (CIL)\",\"NTPC\",\"SAIL\"],\"a\":1,\"ee\":\"SECL is the largest coal-producing subsidiary of CIL.\",\"eh\":\"SECL, कोल इंडिया लिमिटेड (CIL) की सबसे अधिक कोयला उत्पादन करने वाली सहायक कंपनी है।\"},{\"n\":97,\"d\":\"\",\"se\":\"The registered corporate office of Coal India Limited (CIL) is located in:\",\"sh\":\"कोल इंडिया लिमिटेड (CIL) का पंजीकृत कॉर्पोरेट कार्यालय कहाँ स्थित है:\",\"oe\":[\"Mumbai\",\"Bilaspur\",\"Kolkata\",\"Ranchi\"],\"oh\":[\"मुंबई\",\"बिलासपुर\",\"कोलकाता\",\"रांची\"],\"a\":2,\"ee\":\"Kolkata, West Bengal. (SECL's HQ is in Bilaspur).\",\"eh\":\"कोलकाता, पश्चिम बंगाल। (SECL का मुख्यालय बिलासपुर में है)।\"},{\"n\":98,\"d\":\"\",\"se\":\"The latest wage pact operational for non-executive coal employees (effective until June 2026) is:\",\"sh\":\"गैर-कार्यकारी कोयला कर्मचारियों के लिए लागू नवीनतम वेतन समझौता (जो जून 2026 तक प्रभावी है) कौन सा है:\",\"oe\":[\"NCWA‑XII\",\"NCWA‑IX\",\"NCWA‑X\",\"NCWA‑XI\"],\"oh\":[\"NCWA‑XII\",\"NCWA‑IX\",\"NCWA‑X\",\"NCWA‑XI\"],\"a\":3,\"ee\":\"National Coal Wage Agreement (NCWA) XI.\",\"eh\":\"नेशनल कोल वेज एग्रीमेंट (NCWA) XI।\"},{\"n\":99,\"d\":\"\",\"se\":\"The primary mining areas of SECL are located in:\",\"sh\":\"SECL के मुख्य खनन क्षेत्र मुख्य रूप से कहाँ स्थित हैं:\",\"oe\":[\"Korba and Raigarh\",\"Jharia and Raniganj\",\"Singrauli\",\"Talcher and Ib Valley\"],\"oh\":[\"कोरबा और रायगढ़\",\"झरिया और रानीगंज\",\"सिंगरौली\",\"तालचेर और इब वैली\"],\"a\":0,\"ee\":\"Korba and Raigarh (Chhattisgarh) are core operational areas of SECL.\",\"eh\":\"कोरबा और रायगढ़ (छत्तीसगढ़) SECL के प्रमुख परिचालन क्षेत्र हैं।\"},{\"n\":100,\"d\":\"\",\"se\":\"The official coal production target set for Coal India Limited (CIL) for the fiscal year 2025‑26 is approximately:\",\"sh\":\"वित्तीय वर्ष 2025‑26 के लिए कोल इंडिया लिमिटेड (CIL) का आधिकारिक कोयला उत्पादन लक्ष्य लगभग कितना निर्धारित किया गया है:\",\"oe\":[\"800 MT\",\"1000 MT (1 Billion Tonne)\",\"900 MT\",\"700 MT\"],\"oh\":[\"800 MT\",\"1000 MT (1 बिलियन टन)\",\"900 MT\",\"700 MT\"],\"a\":1,\"ee\":\"The Ministry of Coal revised CIL's ambitious 1 Billion Tonne target mapping to FY 2025-26.\",\"eh\":\"कोयला मंत्रालय ने CIL के महत्वाकांक्षी 1 बिलियन टन (1000 MT) उत्पादन लक्ष्य को वित्तीय वर्ष 2025-26 के लिए निर्धारित किया है।\"}]},{\"id\":\"ahp2\",\"num\":2,\"name\":\"High Probability Paper 2\",\"sub\":\"100 questions · 100 bilingual\",\"q\":[{\"n\":1,\"d\":\"\",\"se\":\"The process of recording transactions in the journal is called:\",\"sh\":\"जर्नल (Journal) में लेन-देन दर्ज करने की प्रक्रिया क्या कहलाती है:\",\"oe\":[\"Summarising\",\"Balancing\",\"Journalising\",\"Posting\"],\"oh\":[\"संक्षिप्तीकरण (Summarising)\",\"संतुलन (Balancing)\",\"जर्नलाइजिंग (Journalising)\",\"खतौनी (Posting)\"],\"a\":2,\"ee\":\"Recording in the primary book (Journal) is called journalising.\",\"eh\":\"प्राथमिक पुस्तक (जर्नल) में रिकॉर्ड करने को जर्नलाइजिंग कहा जाता है।\"},{\"n\":2,\"d\":\"\",\"se\":\"Which of the following errors will <strong>affect</strong> the agreement of a trial balance?\",\"sh\":\"निम्नलिखित में से कौन सी अशुद्धि (Error) तलपट (Trial balance) के मिलान को <strong>प्रभावित करेगी</strong>?\",\"oe\":[\"Compensating error\",\"Complete omission\",\"Error of principle\",\"Wrong casting of a subsidiary book\"],\"oh\":[\"क्षतिपूरक अशुद्धि (Compensating error)\",\"पूर्ण भूल (Complete omission)\",\"सैद्धांतिक अशुद्धि (Error of principle)\",\"सहायक बही के योग में गलती (Wrong casting)\"],\"a\":3,\"ee\":\"Wrong casting (totalling) affects only one side (debit or credit), disrupting the trial balance.\",\"eh\":\"योग (Totalling) में गलती केवल एक पक्ष (डेबिट या क्रेडिट) को प्रभावित करती है, जिससे तलपट नहीं मिलता।\"},{\"n\":3,\"d\":\"\",\"se\":\"If a bill of exchange is dishonoured, the drawer will debit the:\",\"sh\":\"यदि विनिमय विपत्र (Bill of exchange) का अनादरण (Dishonour) हो जाता है, तो आहर्ता (Drawer) किस खाते को डेबिट करेगा:\",\"oe\":[\"Debtor&rsquo;s (Drawee's) A/c\",\"Bank A/c\",\"Bills Receivable A/c\",\"Bills Payable A/c\"],\"oh\":[\"देनदार का खाता (Debtor&rsquo;s A/c)\",\"बैंक खाता\",\"प्राप्य बिल खाता (Bills Receivable A/c)\",\"देय बिल खाता (Bills Payable A/c)\"],\"a\":0,\"ee\":\"The original debtor is once again held liable, so their account is debited.\",\"eh\":\"मूल देनदार फिर से उत्तरदायी हो जाता है, इसलिए उसका खाता डेबिट किया जाता है।\"},{\"n\":4,\"d\":\"\",\"se\":\"The provision for doubtful debts is created by debiting the:\",\"sh\":\"संदिग्ध ऋणों के लिए प्रावधान (Provision for doubtful debts) किसे डेबिट करके बनाया जाता है:\",\"oe\":[\"Provision A/c\",\"Profit &amp; Loss A/c\",\"Bad Debts A/c\",\"Debtors A/c\"],\"oh\":[\"प्रावधान खाता\",\"लाभ और हानि खाता (P&amp;L A/c)\",\"डूबत ऋण खाता\",\"देनदार खाता\"],\"a\":1,\"ee\":\"It is charged as an anticipated expense to the P&amp;L Account.\",\"eh\":\"इसे P&amp;L खाते में एक अनुमानित व्यय के रूप में प्रभारित किया जाता है।\"},{\"n\":5,\"d\":\"\",\"se\":\"In the absence of a partnership deed, the profit-sharing ratio among partners is:\",\"sh\":\"साझेदारी विलेख (Partnership deed) के अभाव में, साझेदारों के बीच लाभ-विभाजन अनुपात क्या होता है:\",\"oe\":[\"As per mutual agreement\",\"Capital ratio\",\"Equal\",\"2:1\"],\"oh\":[\"आपसी सहमति के अनुसार\",\"पूंजी अनुपात\",\"समान (Equal)\",\"2:1\"],\"a\":2,\"ee\":\"Under the Indian Partnership Act, 1932, profits are shared equally.\",\"eh\":\"भारतीय साझेदारी अधिनियम, 1932 के तहत लाभ समान रूप से साझा किया जाता है।\"},{\"n\":6,\"d\":\"\",\"se\":\"When shares are forfeited, the Share Capital Account is debited with the:\",\"sh\":\"जब शेयरों को जब्त (Forfeit) किया जाता है, तो शेयर पूंजी खाते (Share Capital A/c) को किस राशि से डेबिट किया जाता है:\",\"oe\":[\"Issue price\",\"Paid‑up amount\",\"Face value\",\"Called‑up amount\"],\"oh\":[\"निर्गम मूल्य (Issue price)\",\"चुकता राशि (Paid-up amount)\",\"अंकित मूल्य (Face value)\",\"मांगी गई राशि (Called-up amount)\"],\"a\":3,\"ee\":\"Share Capital is reversed/debited only to the extent the company had &quot;called up&quot; on those shares.\",\"eh\":\"शेयर पूंजी खाते को केवल उसी सीमा तक कम/डेबिट किया जाता है जितना कंपनी ने उन शेयरों पर मांगा (call up) था।\"},{\"n\":7,\"d\":\"\",\"se\":\"Which of the following is considered a <strong>revenue receipt</strong>?\",\"sh\":\"निम्नलिखित में से किसे <strong>राजस्व प्राप्ति (Revenue receipt)</strong> माना जाता है?\",\"oe\":[\"Sale of goods\",\"Issue of shares\",\"Loan from a bank\",\"Sale of fixed assets\"],\"oh\":[\"माल की बिक्री (Sale of goods)\",\"शेयरों का निर्गमन\",\"बैंक से ऋण\",\"स्थायी संपत्तियों की बिक्री\"],\"a\":0,\"ee\":\"Sale of goods is routine operational income (revenue).\",\"eh\":\"माल की बिक्री कंपनी की दैनिक/परिचालन आय (राजस्व) है।\"},{\"n\":8,\"d\":\"\",\"se\":\"A company&rsquo;s authorised capital is ₹20 lakh, issued capital ₹15 lakh, subscribed capital ₹14 lakh, and called‑up capital ₹12 lakh. Assuming no calls-in-arrears, the paid‑up capital is:\",\"sh\":\"एक कंपनी की अधिकृत पूंजी ₹20 लाख, जारी पूंजी ₹15 लाख, सब्सक्राइब की गई पूंजी ₹14 लाख, और मांगी गई (called-up) पूंजी ₹12 लाख है। यदि कोई बकाया (calls-in-arrears) नहीं है, तो चुकता (paid-up) पूंजी है:\",\"oe\":[\"₹20 lakh\",\"₹12 lakh\",\"₹14 lakh\",\"₹15 lakh\"],\"oh\":[\"₹20 लाख\",\"₹12 lakh\",\"₹14 लाख\",\"₹15 लाख\"],\"a\":1,\"ee\":\"Paid-up capital is the amount actually received against the called-up capital.\",\"eh\":\"चुकता पूंजी वह राशि है जो मांगी गई पूंजी के एवज में वास्तव में प्राप्त हुई है।\"},{\"n\":9,\"d\":\"\",\"se\":\"The adjusting entry for recording closing stock (lying unsold) in final accounts is:\",\"sh\":\"अंतिम खातों में अंतिम स्टॉक (Closing stock) दर्ज करने के लिए समायोजन प्रविष्टि क्या है:\",\"oe\":[\"Purchases A/c Dr. To Stock A/c\",\"Stock A/c Dr. To P&amp;L A/c\",\"Closing Stock A/c Dr. To Trading A/c\",\"Trading A/c Dr. To Stock A/c\"],\"oh\":[\"Purchases A/c Dr. To Stock A/c\",\"Stock A/c Dr. To P&amp;L A/c\",\"Closing Stock A/c Dr. To Trading A/c\",\"Trading A/c Dr. To Stock A/c\"],\"a\":2,\"ee\":\"Closing stock is debited (created as an asset) and credited to the Trading A/c.\",\"eh\":\"अंतिम स्टॉक को डेबिट (संपत्ति के रूप में) किया जाता है और व्यापार खाते (Trading A/c) में क्रेडिट किया जाता है।\"},{\"n\":10,\"d\":\"\",\"se\":\"If an existing goodwill account is to be written off, the journal entry will be:\",\"sh\":\"यदि किसी मौजूदा ख्याति (Goodwill) खाते को अपलिखित (Write-off) करना हो, तो जर्नल प्रविष्टि होगी:\",\"oe\":[\"Goodwill A/c Dr. To Cash A/c\",\"Cash A/c Dr. To Goodwill A/c\",\"Goodwill A/c Dr. To Partners&rsquo; Capital A/c\",\"Partners&rsquo; Capital A/c Dr. To Goodwill A/c\"],\"oh\":[\"Goodwill A/c Dr. To Cash A/c\",\"Cash A/c Dr. To Goodwill A/c\",\"Goodwill A/c Dr. To Partners&rsquo; Capital A/c\",\"Partners&rsquo; Capital A/c Dr. To Goodwill A/c\"],\"a\":3,\"ee\":\"Goodwill is written off by debiting (reducing) old partners' capital accounts in their old profit-sharing ratio.\",\"eh\":\"पुराने साझेदारों के पूंजी खाते को उनके पुराने लाभ-विभाजन अनुपात में डेबिट (कम) करके ख्याति को अपलिखित किया जाता है।\"},{\"n\":11,\"d\":\"\",\"se\":\"A Balance Sheet reveals the:\",\"sh\":\"बैलेंस शीट (चिट्ठा) क्या प्रकट करता है:\",\"oe\":[\"Financial position at a specific point of time\",\"Cash flows during the year\",\"Revenue earned\",\"Profit for the year\"],\"oh\":[\"किसी विशिष्ट समय/तिथि पर वित्तीय स्थिति\",\"वर्ष के दौरान नकदी प्रवाह\",\"अर्जित राजस्व\",\"वर्ष के लिए लाभ\"],\"a\":0,\"ee\":\"It is a snapshot of assets and liabilities on a particular date.\",\"eh\":\"यह किसी विशेष तिथि पर संपत्तियों और देनदारियों का स्नैपशॉट है।\"},{\"n\":12,\"d\":\"\",\"se\":\"A transaction recorded in the cash book but not in the bank passbook leads to a difference. Which of the following is <strong>not</strong> a reason for such a timing difference?\",\"sh\":\"एक लेन-देन जो रोकड़ बही (Cash book) में दर्ज है लेकिन पासबुक में नहीं, वह अंतर पैदा करता है। बैंक समाधान के संदर्भ में, निम्नलिखित में से कौन सा ऐसा 'समय-अंतर' (Timing difference) <strong>नहीं</strong> है?\",\"oe\":[\"Cheques issued but not presented\",\"Error in totalling the cash book\",\"Interest credited directly by the bank\",\"Cheques deposited but not cleared\"],\"oh\":[\"जारी किए गए लेकिन प्रस्तुत नहीं किए गए चेक\",\"रोकड़ बही के योग (totalling) में गलती\",\"बैंक द्वारा सीधे जमा किया गया ब्याज\",\"जमा किए गए लेकिन क्लीयर नहीं हुए चेक\"],\"a\":1,\"ee\":\"Totalling errors are human/arithmetic errors, not timing differences in bank reconciliation.\",\"eh\":\"योग की गलतियां मानवीय/गणितीय गलतियां हैं, न कि बैंक और कैश बुक के बीच समय का अंतर।\"},{\"n\":13,\"d\":\"\",\"se\":\"Which ratio primarily measures the efficiency of a company's inventory management?\",\"sh\":\"कौन सा अनुपात मुख्य रूप से कंपनी के इन्वेंट्री (स्टॉक) प्रबंधन की दक्षता को मापता है?\",\"oe\":[\"Net profit ratio\",\"Current ratio\",\"Inventory turnover ratio\",\"Debt‑equity ratio\"],\"oh\":[\"शुद्ध लाभ अनुपात\",\"चालू अनुपात\",\"इन्वेंट्री टर्नओवर अनुपात (Inventory turnover ratio)\",\"ऋण-इक्विटी अनुपात\"],\"a\":2,\"ee\":\"It indicates how many times inventory is sold and replaced over a period.\",\"eh\":\"यह दर्शाता है कि एक अवधि में इन्वेंट्री कितनी बार बेची और बदली जाती है।\"},{\"n\":14,\"d\":\"\",\"se\":\"When a newly admitted partner brings their share of goodwill in cash, the amount is shared by the old partners in their:\",\"sh\":\"जब एक नया प्रवेशित साझेदार ख्याति के अपने हिस्से को नकद में लाता है, तो पुरानी साझेदारों द्वारा उस राशि को किस अनुपात में साझा किया जाता है:\",\"oe\":[\"Gaining ratio\",\"Equal ratio\",\"New profit-sharing ratio\",\"Sacrificing ratio\"],\"oh\":[\"लाभ-प्राप्ति अनुपात (Gaining ratio)\",\"समान अनुपात\",\"नया लाभ-विभाजन अनुपात\",\"त्याग अनुपात (Sacrificing ratio)\"],\"a\":3,\"ee\":\"The premium compensates the old partners for the share of profit they sacrificed.\",\"eh\":\"यह प्रीमियम पुराने साझेदारों को उनके द्वारा त्यागे गए लाभ के हिस्से की भरपाई के लिए दिया जाता है।\"},{\"n\":15,\"d\":\"\",\"se\":\"An accountant debits a routine repair expense to the Machinery account. This represents an error of:\",\"sh\":\"एक लेखाकार मशीनरी की नियमित मरम्मत के खर्च को मशीनरी खाते में डेबिट कर देता है। यह किस प्रकार की अशुद्धि है:\",\"oe\":[\"Principle\",\"Omission\",\"Commission\",\"Compensating\"],\"oh\":[\"सैद्धांतिक अशुद्धि (Principle)\",\"भूल की अशुद्धि (Omission)\",\"लेखे की अशुद्धि (Commission)\",\"क्षतिपूरक अशुद्धि\"],\"a\":0,\"ee\":\"Treating a revenue expense as a capital expenditure violates accounting principles.\",\"eh\":\"राजस्व व्यय (Revenue exp.) को पूंजीगत व्यय (Capital exp.) मानना लेखांकन सिद्धांतों का उल्लंघन है।\"},{\"n\":16,\"d\":\"\",\"se\":\"If a company issues shares at a price higher than their face value, the excess amount is credited to:\",\"sh\":\"यदि कोई कंपनी अपने शेयरों को अंकित मूल्य (Face value) से अधिक कीमत पर जारी करती है, तो अतिरिक्त राशि को किसमें क्रेडिट किया जाता है:\",\"oe\":[\"Share Capital A/c\",\"Securities Premium A/c\",\"General Reserve A/c\",\"Capital Reserve A/c\"],\"oh\":[\"शेयर पूंजी खाता\",\"प्रतिभूति प्रीमियम खाता (Securities Premium A/c)\",\"सामान्य संचय\",\"पूंजीगत संचय\"],\"a\":1,\"ee\":\"Securities Premium Account.\",\"eh\":\"प्रतिभूति प्रीमियम खाता (Securities Premium Account)।\"},{\"n\":17,\"d\":\"\",\"se\":\"Prepaid expenses are presented in the balance sheet as a:\",\"sh\":\"पूर्वदत्त व्यय (Prepaid expenses) को बैलेंस शीट में किस रूप में प्रस्तुत किया जाता है:\",\"oe\":[\"Current liability\",\"Fixed asset\",\"Current asset\",\"Intangible asset\"],\"oh\":[\"चालू दायित्व\",\"स्थायी संपत्ति\",\"चालू संपत्ति (Current asset)\",\"अमूर्त संपत्ति\"],\"a\":2,\"ee\":\"They represent services or benefits due to the company in the short term.\",\"eh\":\"ये ऐसी सेवाएं या लाभ हैं जो कंपनी को अल्पावधि में प्राप्त होने हैं, अतः संपत्ति हैं।\"},{\"n\":18,\"d\":\"\",\"se\":\"In a corporate entity, dividends are declared and paid as a percentage of the:\",\"sh\":\"एक कॉर्पोरेट इकाई में, लाभांश (Dividends) की घोषणा और भुगतान किस पूंजी के प्रतिशत के रूप में किया जाता है:\",\"oe\":[\"Called‑up capital\",\"Authorised capital\",\"Issued capital\",\"Paid‑up capital\"],\"oh\":[\"मांगी गई पूंजी\",\"अधिकृत पूंजी\",\"जारी पूंजी\",\"चुकता पूंजी (Paid-up capital)\"],\"a\":3,\"ee\":\"Dividends are paid only on the amount actually paid up by shareholders.\",\"eh\":\"लाभांश का भुगतान केवल शेयरधारकों द्वारा वास्तव में चुकाई गई राशि (Paid-up) पर किया जाता है।\"},{\"n\":19,\"d\":\"\",\"se\":\"The accounting concept that dictates expenses incurred to generate revenue must be recognized in the same accounting period is the:\",\"sh\":\"वह लेखांकन अवधारणा जो यह निर्देश देती है कि राजस्व उत्पन्न करने के लिए किए गए खर्चों को उसी लेखांकन अवधि में मान्यता दी जानी चाहिए, कहलाती है:\",\"oe\":[\"Matching concept\",\"Consistency concept\",\"Materiality concept\",\"Going concern concept\"],\"oh\":[\"मिलान अवधारणा (Matching concept)\",\"निरंतरता अवधारणा\",\"सारता अवधारणा\",\"चालू व्यापार अवधारणा\"],\"a\":0,\"ee\":\"The matching concept.\",\"eh\":\"मिलान अवधारणा।\"},{\"n\":20,\"d\":\"\",\"se\":\"An asset is classified as &quot;liquid&quot; if it is:\",\"sh\":\"किसी संपत्ति को &quot;तरल&quot; (Liquid) के रूप में वर्गीकृत किया जाता है यदि वह:\",\"oe\":[\"Intangible in nature\",\"Easily and quickly convertible into cash\",\"Fixed and long‑term\",\"Held purely for resale\"],\"oh\":[\"प्रकृति में अमूर्त हो\",\"आसानी से और जल्दी से नकदी में परिवर्तित हो सके\",\"निश्चित और दीर्घकालिक हो\",\"पूरी तरह से पुनर्विक्रय के लिए रखी गई हो\"],\"a\":1,\"ee\":\"Highly liquid assets include cash, bank balances, and marketable securities.\",\"eh\":\"अत्यधिक तरल संपत्तियों में नकद, बैंक बैलेंस और विपणन योग्य प्रतिभूतियां शामिल हैं।\"},{\"n\":21,\"d\":\"\",\"se\":\"Which of the following is <strong>not</strong> considered a fictitious asset?\",\"sh\":\"निम्नलिखित में से किसे कृत्रिम/नाममात्र संपत्ति (Fictitious asset) <strong>नहीं</strong> माना जाता है?\",\"oe\":[\"Debit balance of P&amp;L A/c\",\"Preliminary expenses\",\"Goodwill\",\"Discount on issue of shares/debentures\"],\"oh\":[\"P&amp;L खाते का डेबिट शेष\",\"प्रारंभिक व्यय\",\"ख्याति (Goodwill)\",\"शेयरों/डिबेंचर के निर्गम पर छूट\"],\"a\":2,\"ee\":\"Goodwill is a real, intangible asset with realizable value; fictitious assets have no real value.\",\"eh\":\"ख्याति एक वास्तविक अमूर्त संपत्ति है जिसका वसूली योग्य मूल्य होता है। कृत्रिम संपत्तियों का कोई वास्तविक मूल्य नहीं होता है।\"},{\"n\":22,\"d\":\"\",\"se\":\"The difference between total assets and external liabilities of a business represents its:\",\"sh\":\"किसी व्यवसाय की कुल संपत्तियों और बाहरी देनदारियों के बीच का अंतर क्या दर्शाता है:\",\"oe\":[\"Gross profit\",\"Net profit\",\"Working capital\",\"Net worth (Owner&rsquo;s Equity)\"],\"oh\":[\"सकल लाभ\",\"शुद्ध लाभ\",\"कार्यशील पूंजी\",\"निवल मूल्य / स्वामी की इक्विटी (Net worth)\"],\"a\":3,\"ee\":\"Net worth or capital.\",\"eh\":\"निवल मूल्य (Net worth) या पूंजी।\"},{\"n\":23,\"d\":\"\",\"se\":\"When a partner retires, the retiring partner&rsquo;s share of goodwill is credited to the:\",\"sh\":\"जब कोई साझेदार सेवानिवृत्त (retire) होता है, तो सेवानिवृत्त साझेदार के ख्याति के हिस्से को किसमें क्रेडिट किया जाता है:\",\"oe\":[\"Retiring partner&rsquo;s capital A/c\",\"Remaining partners&rsquo; capital A/c\",\"Goodwill A/c\",\"Profit &amp; Loss A/c\"],\"oh\":[\"सेवानिवृत्त साझेदार का पूंजी खाता\",\"शेष साझेदारों का पूंजी खाता\",\"ख्याति खाता\",\"लाभ और हानि खाता\"],\"a\":0,\"ee\":\"The retiring partner must be compensated for their share of the firm's accumulated goodwill.\",\"eh\":\"फर्म की संचित ख्याति में उनके हिस्से के लिए सेवानिवृत्त साझेदार को मुआवजा दिया जाना चाहिए।\"},{\"n\":24,\"d\":\"\",\"se\":\"Under the straight‑line method of depreciation, the annual depreciation amount remains:\",\"sh\":\"मूल्यह्रास की सीधी रेखा विधि (Straight-line method) के तहत, वार्षिक मूल्यह्रास राशि क्या होती है:\",\"oe\":[\"Decreasing every year\",\"Constant every year\",\"Variable based on usage\",\"Increasing every year\"],\"oh\":[\"हर साल घटती है\",\"हर साल स्थिर (Constant) रहती है\",\"उपयोग के आधार पर बदलती रहती है\",\"हर साल बढ़ती है\"],\"a\":1,\"ee\":\"It is calculated as a fixed percentage of the original cost.\",\"eh\":\"इसकी गणना मूल लागत के एक निश्चित प्रतिशत के रूप में की जाती है, इसलिए यह समान रहती है।\"},{\"n\":25,\"d\":\"\",\"se\":\"The foundational document that contains the internal rules and regulations of a company is the:\",\"sh\":\"वह मूलभूत दस्तावेज जिसमें कंपनी के आंतरिक नियम और कानून शामिल होते हैं, क्या कहलाता है:\",\"oe\":[\"Share certificate\",\"Prospectus\",\"Articles of Association\",\"Memorandum of Association\"],\"oh\":[\"शेयर प्रमाणपत्र\",\"प्रॉस्पेक्टस\",\"आर्टिकल्स ऑफ एसोसिएशन (Articles of Association)\",\"मेमोरेंडम ऑफ एसोसिएशन\"],\"a\":2,\"ee\":\"The Articles of Association (AoA) govern internal management.\",\"eh\":\"आर्टिकल्स ऑफ एसोसिएशन (AoA) आंतरिक प्रबंधन को नियंत्रित करता है।\"},{\"n\":26,\"d\":\"\",\"se\":\"If the provision for bad debts is increased at the end of the year, the net profit will:\",\"sh\":\"यदि वर्ष के अंत में डूबत ऋण के लिए प्रावधान (Provision for bad debts) बढ़ा दिया जाता है, तो शुद्ध लाभ पर क्या प्रभाव पड़ेगा:\",\"oe\":[\"Remain unchanged\",\"Increase\",\"Become zero\",\"Decrease\"],\"oh\":[\"अपरिवर्तित रहेगा\",\"बढ़ेगा\",\"शून्य हो जाएगा\",\"घटेगा (Decrease)\"],\"a\":3,\"ee\":\"An increase in provision acts as an expense, reducing net profit.\",\"eh\":\"प्रावधान में वृद्धि एक व्यय के रूप में कार्य करती है, जिससे शुद्ध लाभ कम हो जाता है।\"},{\"n\":27,\"d\":\"\",\"se\":\"Which of the following is an example of a <strong>capital receipt</strong>?\",\"sh\":\"निम्नलिखित में से कौन सा <strong>पूंजीगत प्राप्ति (Capital receipt)</strong> का एक उदाहरण है?\",\"oe\":[\"Sale proceeds of long-term investments\",\"Rent received from tenants\",\"Interest received on bank deposits\",\"Dividend received on shares\"],\"oh\":[\"दीर्घकालिक निवेश की बिक्री से प्राप्त राशि\",\"किरायेदारों से प्राप्त किराया\",\"बैंक जमा पर प्राप्त ब्याज\",\"शेयरों पर प्राप्त लाभांश\"],\"a\":0,\"ee\":\"Selling an asset (investments) generates a capital receipt.\",\"eh\":\"किसी संपत्ति (निवेश) को बेचने से पूंजीगत प्राप्ति होती है।\"},{\"n\":28,\"d\":\"\",\"se\":\"The debit total of a trial balance is ₹2,50,000 and the credit total is ₹2,30,000. The ₹20,000 difference is placed on the credit side of a Suspense Account. This most likely indicates:\",\"sh\":\"एक तलपट का डेबिट योग ₹2,50,000 है और क्रेडिट योग ₹2,30,000 है। ₹20,000 का अंतर उचंती खाते (Suspense A/c) के क्रेडिट पक्ष में रखा गया है। यह सबसे अधिक क्या दर्शाता है:\",\"oe\":[\"Some credit balance was omitted\",\"Some debit balance was omitted\",\"Both sides have equal errors\",\"No error\"],\"oh\":[\"कोई क्रेडिट शेष छूट गया था\",\"कोई डेबिट शेष छूट गया था\",\"दोनों पक्षों में समान त्रुटियां हैं\",\"कोई त्रुटि नहीं है\"],\"a\":0,\"ee\":\"Since the credit side is short by ₹20,000, a credit balance was either omitted or under-cast.\",\"eh\":\"चूंकि क्रेडिट पक्ष में ₹20,000 की कमी है, इसका मतलब है कि कोई क्रेडिट शेष छूट गया है या कम जोड़ा गया है।\"},{\"n\":29,\"d\":\"\",\"se\":\"Under the Companies Act, 2013, the maximum number of partners permitted in a standard partnership firm (non-professional) is:\",\"sh\":\"कंपनी अधिनियम, 2013 के तहत, एक मानक साझेदारी फर्म (गैर-पेशेवर) में अनुमत साझेदारों की अधिकतम संख्या क्या है:\",\"oe\":[\"100\",\"50\",\"10\",\"20\"],\"oh\":[\"100\",\"50\",\"10\",\"20\"],\"a\":1,\"ee\":\"Rule 10 of Companies (Miscellaneous) Rules, 2014 restricts it to 50.\",\"eh\":\"कंपनी (विविध) नियम, 2014 का नियम 10 इसे 50 तक सीमित करता है।\"},{\"n\":30,\"d\":\"\",\"se\":\"The detailed accounting treatment, additions, and deductions of Reserves and Surplus are presented in the:\",\"sh\":\"संचय और अधिशेष (Reserves and Surplus) के विस्तृत लेखांकन व्यवहार, परिवर्धन और कटौतियों को कहाँ प्रस्तुत किया जाता है:\",\"oe\":[\"Directors&rsquo; Report\",\"Face of the Balance Sheet\",\"Notes to Accounts\",\"Profit &amp; Loss A/c\"],\"oh\":[\"निदेशक रिपोर्ट में\",\"बैलेंस शीट के मुख्य पृष्ठ पर\",\"खातों के नोट्स (Notes to Accounts) में\",\"P&amp;L खाते में\"],\"a\":2,\"ee\":\"Detailed breakdowns are mandatory in the Notes to Accounts.\",\"eh\":\"'खातों के नोट्स' (Notes to Accounts) में विस्तृत विवरण देना अनिवार्य है।\"},{\"n\":31,\"d\":\"\",\"se\":\"Under the GST regime, the standard due date for filing GSTR‑1 (for monthly filers) is the:\",\"sh\":\"जीएसटी व्यवस्था के तहत, GSTR-1 (मासिक फाइलर्स के लिए) दाखिल करने की मानक नियत तिथि क्या है:\",\"oe\":[\"20th of the next month\",\"10th of the next month\",\"30th of the next month\",\"11th of the next month\"],\"oh\":[\"अगले महीने की 20 तारीख\",\"अगले महीने की 10 तारीख\",\"अगले महीने की 30 तारीख\",\"अगले महीने की 11 तारीख\"],\"a\":3,\"ee\":\"11th of the succeeding month.\",\"eh\":\"अगले महीने की 11 तारीख।\"},{\"n\":32,\"d\":\"\",\"se\":\"Rental income earned from letting out a building is taxable under which head of income?\",\"sh\":\"किसी इमारत को किराए पर देने से अर्जित किराये की आय किस आय शीर्षक के तहत कर योग्य है?\",\"oe\":[\"Income from House Property\",\"Income from Salaries\",\"Income from Other Sources\",\"Profits and Gains from Business\"],\"oh\":[\"गृह संपत्ति से आय (Income from House Property)\",\"वेतन से आय\",\"अन्य स्रोतों से आय\",\"व्यापार से लाभ\"],\"a\":0,\"ee\":\"Income from House Property.\",\"eh\":\"गृह संपत्ति से आय।\"},{\"n\":33,\"d\":\"\",\"se\":\"The GST Council of India is chaired by the:\",\"sh\":\"भारत की जीएसटी परिषद (GST Council) की अध्यक्षता किसके द्वारा की जाती है:\",\"oe\":[\"RBI Governor\",\"Union Finance Minister\",\"Prime Minister\",\"President of India\"],\"oh\":[\"आरबीआई गवर्नर\",\"केंद्रीय वित्त मंत्री (Union Finance Minister)\",\"प्रधान मंत्री\",\"भारत के राष्ट्रपति\"],\"a\":1,\"ee\":\"The Union Finance Minister serves as the ex-officio chairperson.\",\"eh\":\"केंद्रीय वित्त मंत्री पदेन अध्यक्ष (ex-officio chairperson) के रूप में कार्य करते हैं।\"},{\"n\":34,\"d\":\"\",\"se\":\"What is the rate of Tax Deducted at Source (TDS) on salary under Section 192 of the Income Tax Act?\",\"sh\":\"आयकर अधिनियम की धारा 192 के तहत वेतन (Salary) पर स्रोत पर कर कटौती (TDS) की दर क्या है?\",\"oe\":[\"Flat 30%\",\"Flat 20%\",\"Average rate based on the applicable slab rates\",\"Flat 10%\"],\"oh\":[\"फ्लैट 30%\",\"फ्लैट 20%\",\"लागू स्लैब दरों के आधार पर औसत दर (Average rate based on slab)\",\"फ्लैट 10%\"],\"a\":2,\"ee\":\"TDS on salary is calculated based on the employee's estimated total income and their respective tax slab.\",\"eh\":\"वेतन पर टीडीएस की गणना कर्मचारी की अनुमानित कुल आय और उनके संबंधित टैक्स स्लैब के आधार पर की जाती है।\"},{\"n\":35,\"d\":\"\",\"se\":\"Which of the following taxes is <strong>not</strong> a direct tax?\",\"sh\":\"निम्नलिखित में से कौन सा कर <strong>प्रत्यक्ष कर (Direct tax)</strong> नहीं है?\",\"oe\":[\"Capital Gains Tax\",\"Income Tax\",\"Corporate Tax\",\"Goods and Services Tax (GST)\"],\"oh\":[\"पूंजीगत लाभ कर\",\"आयकर\",\"कॉर्पोरेट टैक्स\",\"वस्तु एवं सेवा कर (GST)\"],\"a\":3,\"ee\":\"GST is an indirect tax borne by the end consumer.\",\"eh\":\"जीएसटी एक अप्रत्यक्ष कर है जिसे अंतिम उपभोक्ता द्वारा वहन किया जाता है।\"},{\"n\":36,\"d\":\"\",\"se\":\"The maximum aggregate deduction allowed under Section 80C (Old Tax Regime) is:\",\"sh\":\"पुरानी कर व्यवस्था (Old Tax Regime) के तहत धारा 80C के अंतर्गत अनुमत अधिकतम कुल कटौती है:\",\"oe\":[\"₹1,50,000\",\"₹1,00,000\",\"₹2,00,000\",\"₹2,50,000\"],\"oh\":[\"₹1,50,000\",\"₹1,00,000\",\"₹2,00,000\",\"₹2,50,000\"],\"a\":0,\"ee\":\"₹1.5 Lakh.\",\"eh\":\"₹1.5 लाख।\"},{\"n\":37,\"d\":\"\",\"se\":\"The Composition Scheme under GST is generally available to small taxpayers (trading goods in regular states) with an aggregate annual turnover up to:\",\"sh\":\"जीएसटी के तहत संरचना योजना (Composition Scheme) आम तौर पर छोटे करदाताओं (माल के आपूर्तिकर्ताओं के लिए) के लिए उपलब्ध है, जिनका कुल वार्षिक टर्नओवर है:\",\"oe\":[\"₹1 crore\",\"₹1.5 crore\",\"₹2 crore\",\"₹50 lakh\"],\"oh\":[\"₹1 करोड़ तक\",\"₹1.5 करोड़ तक\",\"₹2 करोड़ तक\",\"₹50 लाख तक\"],\"a\":1,\"ee\":\"₹1.5 crore for eligible suppliers of goods.\",\"eh\":\"माल के योग्य आपूर्तिकर्ताओं के लिए ₹1.5 करोड़।\"},{\"n\":38,\"d\":\"\",\"se\":\"As per Section 194C of the Income Tax Act, the rate of TDS on payments made to an <strong>individual resident contractor</strong> is:\",\"sh\":\"आयकर अधिनियम की धारा 194C के अनुसार, एक <strong>व्यक्तिगत निवासी ठेकेदार (Individual resident contractor)</strong> को किए गए भुगतान पर TDS की दर क्या है:\",\"oe\":[\"5%\",\"2%\",\"1%\",\"10%\"],\"oh\":[\"5%\",\"2%\",\"1%\",\"10%\"],\"a\":2,\"ee\":\"1% for individuals/HUFs, and 2% for other entities.\",\"eh\":\"व्यक्तियों/HUF के लिए 1%, और अन्य संस्थाओं के लिए 2%।\"},{\"n\":39,\"d\":\"\",\"se\":\"Two numbers are in the ratio 3:5. If 8 is added to each number, the new ratio becomes 5:7. Find the smaller number.\",\"sh\":\"दो संख्याएं 3:5 के अनुपात में हैं। यदि प्रत्येक संख्या में 8 जोड़ दिया जाए, तो नया अनुपात 5:7 हो जाता है। छोटी संख्या ज्ञात कीजिए।\",\"oe\":[\"9\",\"18\",\"15\",\"12\"],\"oh\":[\"9\",\"18\",\"15\",\"12\"],\"a\":3,\"ee\":\"Let numbers be 3x and 5x. (3x+8)/(5x+8) = 5/7 → 21x + 56 = 25x + 40 → 4x = 16 → x = 4. Smaller number = 3 × 4 = 12.\",\"eh\":\"मान लें संख्याएं 3x और 5x हैं। (3x+8)/(5x+8) = 5/7 → 21x + 56 = 25x + 40 → 4x = 16 → x = 4। छोटी संख्या = 3 × 4 = 12।\"},{\"n\":40,\"d\":\"\",\"se\":\"A sum of money becomes ₹2,160 in 2 years and ₹2,592 in 3 years when invested at compound interest (compounded annually). The rate of interest is:\",\"sh\":\"कोई धनराशि चक्रवृद्धि ब्याज (वार्षिक रूप से संयोजित) पर निवेश करने पर 2 वर्षों में ₹2,160 और 3 वर्षों में ₹2,592 हो जाती है। ब्याज की दर क्या है:\",\"oe\":[\"20%\",\"15%\",\"12%\",\"10%\"],\"oh\":[\"20%\",\"15%\",\"12%\",\"10%\"],\"a\":0,\"ee\":\"Interest for the 3rd year = 2592 - 2160 = ₹432. Rate = (432 / 2160) × 100 = 20%.\",\"eh\":\"तीसरे वर्ष का ब्याज = 2592 - 2160 = ₹432। दर = (432 / 2160) × 100 = 20%।\"},{\"n\":41,\"d\":\"\",\"se\":\"If 15 workers can complete a project in 20 days, how many days will 25 workers take to complete the same project?\",\"sh\":\"यदि 15 कर्मचारी किसी प्रोजेक्ट को 20 दिनों में पूरा कर सकते हैं, तो 25 कर्मचारी उसी प्रोजेक्ट को पूरा करने में कितने दिन लेंगे?\",\"oe\":[\"18\",\"12\",\"15\",\"10\"],\"oh\":[\"18\",\"12\",\"15\",\"10\"],\"a\":1,\"ee\":\"(M1 × D1) = (M2 × D2) → 15 × 20 = 25 × D2 → 300 / 25 = 12 days.\",\"eh\":\"(M1 × D1) = (M2 × D2) → 15 × 20 = 25 × D2 → 300 / 25 = 12 दिन।\"},{\"n\":42,\"d\":\"\",\"se\":\"A train 150 m long crosses a stationary platform 250 m long in 20 seconds. Its speed in km/hr is:\",\"sh\":\"150 मीटर लंबी एक ट्रेन 250 मीटर लंबे एक स्थिर प्लेटफॉर्म को 20 सेकंड में पार करती है। किमी/घंटा में इसकी गति है:\",\"oe\":[\"60\",\"45\",\"72\",\"54\"],\"oh\":[\"60\",\"45\",\"72\",\"54\"],\"a\":2,\"ee\":\"Total distance = 150 + 250 = 400 m. Speed = 400 / 20 = 20 m/s. In km/hr = 20 × (18/5) = 72 km/hr.\",\"eh\":\"कुल दूरी = 150 + 250 = 400 मीटर। गति = 400 / 20 = 20 मीटर/सेकंड। किमी/घंटा में = 20 × (18/5) = 72 किमी/घंटा।\"},{\"n\":43,\"d\":\"\",\"se\":\"The exact value of √(81) + √(64) is:\",\"sh\":\"√(81) + √(64) का सटीक मान है:\",\"oe\":[\"15\",\"13\",\"19\",\"17\"],\"oh\":[\"15\",\"13\",\"19\",\"17\"],\"a\":3,\"ee\":\"9 + 8 = 17.\",\"eh\":\"9 + 8 = 17।\"},{\"n\":44,\"d\":\"\",\"se\":\"A shopkeeper offers a 20% discount on an item marked at ₹500. Even after the discount, he makes a profit of 25%. What is the cost price (CP) of the item?\",\"sh\":\"एक दुकानदार ₹500 अंकित मूल्य (Marked Price) वाली वस्तु पर 20% की छूट देता है। छूट के बाद भी वह 25% का लाभ कमाता है। वस्तु का क्रय मूल्य (CP) क्या है?\",\"oe\":[\"₹320\",\"₹400\",\"₹360\",\"₹280\"],\"oh\":[\"₹320\",\"₹400\",\"₹360\",\"₹280\"],\"a\":0,\"ee\":\"Selling Price = 500 × 0.80 = ₹400. Since SP = CP × 1.25, CP = 400 / 1.25 = ₹320.\",\"eh\":\"विक्रय मूल्य = 500 × 0.80 = ₹400। चूँकि SP = CP × 1.25, अतः CP = 400 / 1.25 = ₹320।\"},{\"n\":45,\"d\":\"\",\"se\":\"The average of 7 numbers is 42. If one number is removed, the average of the remaining numbers becomes 40. The removed number is:\",\"sh\":\"7 संख्याओं का औसत 42 है। यदि एक संख्या हटा दी जाए, तो शेष संख्याओं का औसत 40 हो जाता है। हटाई गई संख्या है:\",\"oe\":[\"50\",\"54\",\"56\",\"48\"],\"oh\":[\"50\",\"54\",\"56\",\"48\"],\"a\":1,\"ee\":\"Sum of 7 numbers = 7 × 42 = 294. Sum of 6 numbers = 6 × 40 = 240. Removed number = 294 - 240 = 54.\",\"eh\":\"7 संख्याओं का योग = 7 × 42 = 294। 6 संख्याओं का योग = 6 × 40 = 240। हटाई गई संख्या = 294 - 240 = 54।\"},{\"n\":46,\"d\":\"\",\"se\":\"If (x + y) = 12 and (xy) = 27, find the value of (x² + y²).\",\"sh\":\"यदि (x + y) = 12 और (xy) = 27, तो (x² + y²) का मान ज्ञात करें।\",\"oe\":[\"72\",\"144\",\"90\",\"100\"],\"oh\":[\"72\",\"144\",\"90\",\"100\"],\"a\":2,\"ee\":\"Formula: x² + y² = (x + y)² - 2xy = (12)² - 2(27) = 144 - 54 = 90.\",\"eh\":\"सूत्र: x² + y² = (x + y)² - 2xy = (12)² - 2(27) = 144 - 54 = 90।\"},{\"n\":47,\"d\":\"\",\"se\":\"A boat can row 18 km upstream and 30 km downstream in a total of 6 hours. If the speed of the stream is 2 km/hr, find the speed of the boat in still water.\",\"sh\":\"एक नाव 6 घंटे के कुल समय में 18 किमी धारा के प्रतिकूल (upstream) और 30 किमी धारा के अनुकूल (downstream) जा सकती है। यदि धारा की गति 2 किमी/घंटा है, तो शांत जल में नाव की गति ज्ञात कीजिए।\",\"oe\":[\"6 km/hr\",\"10 km/hr\",\"12 km/hr\",\"8 km/hr\"],\"oh\":[\"6 किमी/घंटा\",\"10 किमी/घंटा\",\"12 किमी/घंटा\",\"8 किमी/घंटा\"],\"a\":3,\"ee\":\"Let boat speed be b. Upstream speed = (b-2), Downstream = (b+2). If b=8, time = 18/(8-2) + 30/(8+2) = 18/6 + 30/10 = 3 + 3 = 6 hours.\",\"eh\":\"मान लें नाव की गति b है। धारा के प्रतिकूल गति = (b-2), अनुकूल = (b+2)। यदि b=8 है, तो समय = 18/(8-2) + 30/(8+2) = 18/6 + 30/10 = 3 + 3 = 6 घंटे।\"},{\"n\":48,\"d\":\"\",\"se\":\"The simple interest on a certain principal for 4 years at 8% p.a. is ₹1,600. The principal amount is:\",\"sh\":\"किसी निश्चित मूलधन पर 4 वर्ष के लिए 8% प्रति वर्ष की दर से साधारण ब्याज ₹1,600 है। मूलधन राशि है:\",\"oe\":[\"₹5,000\",\"₹4,500\",\"₹6,000\",\"₹4,000\"],\"oh\":[\"₹5,000\",\"₹4,500\",\"₹6,000\",\"₹4,000\"],\"a\":0,\"ee\":\"P = (SI × 100) / (R × T) = (1600 × 100) / (8 × 4) = 160000 / 32 = ₹5,000.\",\"eh\":\"P = (SI × 100) / (R × T) = (1600 × 100) / (8 × 4) = 160000 / 32 = ₹5,000।\"},{\"n\":49,\"d\":\"\",\"se\":\"If 5% of x equals 25, then the value of x is:\",\"sh\":\"यदि x का 5% 25 के बराबर है, तो x का मान है:\",\"oe\":[\"600\",\"500\",\"400\",\"300\"],\"oh\":[\"600\",\"500\",\"400\",\"300\"],\"a\":1,\"ee\":\"0.05x = 25 → x = 25 / 0.05 = 500.\",\"eh\":\"0.05x = 25 → x = 25 / 0.05 = 500।\"},{\"n\":50,\"d\":\"\",\"se\":\"Find the median of the data set: 3, 7, 9, 11, 15, 19.\",\"sh\":\"डेटा सेट की माध्यिका (Median) ज्ञात कीजिए: 3, 7, 9, 11, 15, 19।\",\"oe\":[\"10.5\",\"11\",\"10\",\"9.5\"],\"oh\":[\"10.5\",\"11\",\"10\",\"9.5\"],\"a\":2,\"ee\":\"The data has an even number of terms (6). The median is the average of the 3rd and 4th terms: (9 + 11) / 2 = 10.\",\"eh\":\"डेटा में पदों की संख्या सम (6) है। माध्यिका 3रे और 4थे पदों का औसत है: (9 + 11) / 2 = 10।\"},{\"n\":51,\"d\":\"\",\"se\":\"A sum of money doubles itself in 5 years at compound interest. In how many years will it become 4 times its original value?\",\"sh\":\"चक्रवृद्धि ब्याज पर कोई धनराशि 5 वर्षों में स्वयं की दोगुनी हो जाती है। यह अपने मूल मूल्य का 4 गुना कितने वर्षों में हो जाएगी?\",\"oe\":[\"8\",\"15\",\"7\",\"10\"],\"oh\":[\"8\",\"15\",\"7\",\"10\"],\"a\":3,\"ee\":\"Money grows exponentially in CI. It doubles (×2) in 5 years. It will quadruple (×4) in another 5 years. Total = 10 years.\",\"eh\":\"CI में पैसा तेजी से बढ़ता है। यह 5 साल में दोगुना (×2) हो जाता है। अगले 5 वर्षों में यह चौगुना (×4) हो जाएगा। कुल = 10 वर्ष।\"},{\"n\":52,\"d\":\"\",\"se\":\"The Lowest Common Multiple (LCM) of 15, 20, and 25 is:\",\"sh\":\"15, 20 और 25 का लघुत्तम समापवर्त्य (LCM) है:\",\"oe\":[\"300\",\"100\",\"150\",\"200\"],\"oh\":[\"300\",\"100\",\"150\",\"200\"],\"a\":0,\"ee\":\"300 is the smallest number evenly divisible by 15, 20, and 25.\",\"eh\":\"300 वह सबसे छोटी संख्या है जो 15, 20 और 25 से पूरी तरह विभाज्य है।\"},{\"n\":53,\"d\":\"\",\"se\":\"A discount of 10% is given on a marked price of ₹500, followed by a successive 5% discount. What is the final selling price?\",\"sh\":\"₹500 के अंकित मूल्य पर 10% की छूट दी जाती है, जिसके बाद 5% की एक और क्रमिक (successive) छूट दी जाती है। अंतिम विक्रय मूल्य क्या है?\",\"oe\":[\"₹425\",\"₹427.50\",\"₹450\",\"₹400\"],\"oh\":[\"₹425\",\"₹427.50\",\"₹450\",\"₹400\"],\"a\":1,\"ee\":\"Price after 1st discount = 500 × 0.90 = ₹450. Price after 2nd discount = 450 × 0.95 = ₹427.50.\",\"eh\":\"पहली छूट के बाद मूल्य = 500 × 0.90 = ₹450। दूसरी छूट के बाद मूल्य = 450 × 0.95 = ₹427.50।\"},{\"n\":54,\"d\":\"\",\"se\":\"A and B start a business with capital investments of ₹40,000 and ₹60,000 respectively. At the end of the year, they make a profit of ₹25,000. What is A&rsquo;s share of the profit?\",\"sh\":\"A और B क्रमशः ₹40,000 और ₹60,000 के पूंजी निवेश के साथ एक व्यवसाय शुरू करते हैं। वर्ष के अंत में, वे ₹25,000 का लाभ कमाते हैं। लाभ में A का हिस्सा कितना है?\",\"oe\":[\"₹15,000\",\"₹7,500\",\"₹10,000\",\"₹12,500\"],\"oh\":[\"₹15,000\",\"₹7,500\",\"₹10,000\",\"₹12,500\"],\"a\":2,\"ee\":\"Capital Ratio = 40,000 : 60,000 = 2:3. A's profit share = (2/5) × 25000 = ₹10,000.\",\"eh\":\"पूंजी अनुपात = 40,000 : 60,000 = 2:3। A का लाभ में हिस्सा = (2/5) × 25000 = ₹10,000।\"},{\"n\":55,\"d\":\"\",\"se\":\"The profit percentage when Cost Price = ₹600 and Selling Price = ₹750 is:\",\"sh\":\"जब क्रय मूल्य = ₹600 और विक्रय मूल्य = ₹750 हो, तो लाभ प्रतिशत है:\",\"oe\":[\"30%\",\"15%\",\"20%\",\"25%\"],\"oh\":[\"30%\",\"15%\",\"20%\",\"25%\"],\"a\":3,\"ee\":\"Profit = ₹150. Profit % = (150 / 600) × 100 = 25%.\",\"eh\":\"लाभ = ₹150। लाभ % = (150 / 600) × 100 = 25%।\"},{\"n\":56,\"d\":\"\",\"se\":\"If 2x + 3y = 12 and x - y = 1, find the value of x.\",\"sh\":\"यदि 2x + 3y = 12 और x - y = 1 है, तो x का मान ज्ञात कीजिए।\",\"oe\":[\"3\",\"4\",\"5\",\"2\"],\"oh\":[\"3\",\"4\",\"5\",\"2\"],\"a\":0,\"ee\":\"From eq 2: x = y + 1. Substitute in eq 1: 2(y + 1) + 3y = 12 → 5y + 2 = 12 → y = 2. Therefore, x = 3.\",\"eh\":\"समीकरण 2 से: x = y + 1। समीकरण 1 में रखने पर: 2(y + 1) + 3y = 12 → 5y + 2 = 12 → y = 2। इसलिए, x = 3।\"},{\"n\":57,\"d\":\"\",\"se\":\"A man&rsquo;s age is 4 times his son&rsquo;s age. After 10 years, he will be 3 times his son&rsquo;s age. The son&rsquo;s present age is:\",\"sh\":\"एक आदमी की उम्र उसके बेटे की उम्र की 4 गुनी है। 10 साल बाद, वह अपने बेटे की उम्र का 3 गुना हो जाएगा। बेटे की वर्तमान उम्र है:\",\"oe\":[\"5\",\"20\",\"15\",\"10\"],\"oh\":[\"5\",\"20\",\"15\",\"10\"],\"a\":1,\"ee\":\"Let son = x, man = 4x. In 10 years: (4x + 10) = 3(x + 10) → 4x + 10 = 3x + 30 → x = 20.\",\"eh\":\"मान लें बेटा = x, पिता = 4x। 10 वर्ष बाद: (4x + 10) = 3(x + 10) → 4x + 10 = 3x + 30 → x = 20।\"},{\"n\":58,\"d\":\"\",\"se\":\"The ratio of the areas of two squares is 16:25. The ratio of their perimeters is:\",\"sh\":\"दो वर्गों के क्षेत्रफलों का अनुपात 16:25 है। उनके परिमापों (perimeters) का अनुपात क्या होगा:\",\"oe\":[\"2:5\",\"3:4\",\"4:5\",\"16:25\"],\"oh\":[\"2:5\",\"3:4\",\"4:5\",\"16:25\"],\"a\":2,\"ee\":\"Area ratio = (Side Ratio)². Therefore, side ratio = √16 : √25 = 4:5. Perimeter ratio is identical to the side ratio.\",\"eh\":\"क्षेत्रफल अनुपात = (भुजा अनुपात)²। इसलिए, भुजा अनुपात = √16 : √25 = 4:5। परिमाप का अनुपात भुजा के अनुपात के समान होता है।\"},{\"n\":59,\"d\":\"\",\"se\":\"Find the missing term in the series: 3, 10, 29, 66, 127, ?\",\"sh\":\"श्रृंखला में लुप्त पद ज्ञात कीजिए: 3, 10, 29, 66, 127, ?\",\"oe\":[\"205\",\"198\",\"210\",\"218\"],\"oh\":[\"205\",\"198\",\"210\",\"218\"],\"a\":3,\"ee\":\"The pattern is n³ + 2. (1³+2=3, 2³+2=10, 3³+2=29, 4³+2=66, 5³+2=127). The next is 6³ + 2 = 216 + 2 = 218.\",\"eh\":\"पैटर्न n³ + 2 है। (1³+2=3, 2³+2=10, 3³+2=29, 4³+2=66, 5³+2=127)। अगला पद 6³ + 2 = 216 + 2 = 218 होगा।\"},{\"n\":60,\"d\":\"\",\"se\":\"Pointing to a lady, a man said, &ldquo;She is the daughter of my mother&rsquo;s only brother.&rdquo; How is the lady related to the man?\",\"sh\":\"एक महिला की ओर इशारा करते हुए एक आदमी ने कहा, &quot;वह मेरी माँ के इकलौते भाई की बेटी है।&quot; महिला का आदमी से क्या संबंध है?\",\"oe\":[\"Cousin\",\"Sister\",\"Aunt\",\"Niece\"],\"oh\":[\"चचेरी/ममेरी बहन (Cousin)\",\"बहन\",\"बुआ/मौसी\",\"भतीजी/भांजी\"],\"a\":0,\"ee\":\"The man's mother's only brother is his maternal uncle. His uncle's daughter is his cousin.\",\"eh\":\"आदमी की माँ का इकलौता भाई उसका मामा है। उसके मामा की बेटी उसकी ममेरी बहन (कज़िन) है।\"},{\"n\":61,\"d\":\"\",\"se\":\"In a certain code language, &quot;MONDAY&quot; is coded as &quot;NPOEBZ&quot;. How will &quot;TODAY&quot; be coded?\",\"sh\":\"एक निश्चित कूट भाषा में, &quot;MONDAY&quot; को &quot;NPOEBZ&quot; लिखा जाता है। उसी भाषा में &quot;TODAY&quot; को कैसे लिखा जाएगा?\",\"oe\":[\"UPEFZ\",\"UPEBZ\",\"UQEBZ\",\"UPECZ\"],\"oh\":[\"UPEFZ\",\"UPEBZ\",\"UQEBZ\",\"UPECZ\"],\"a\":1,\"ee\":\"Each letter is shifted exactly +1 in the alphabet series. T(+1)=U, O(+1)=P, D(+1)=E, A(+1)=B, Y(+1)=Z.\",\"eh\":\"प्रत्येक अक्षर वर्णमाला श्रृंखला में ठीक +1 आगे बढ़ता है। T(+1)=U, O(+1)=P, D(+1)=E, A(+1)=B, Y(+1)=Z।\"},{\"n\":62,\"d\":\"\",\"se\":\"A man walks 8 km South, turns right and walks 6 km, then turns right again and walks 8 km. How far is he from his starting point?\",\"sh\":\"एक आदमी दक्षिण की ओर 8 किमी चलता है, दाएँ मुड़ता है और 6 किमी चलता है, फिर से दाएँ मुड़ता है और 8 किमी चलता है। वह अपने प्रारंभिक बिंदु से कितनी दूर है?\",\"oe\":[\"8 km\",\"2 km\",\"6 km\",\"10 km\"],\"oh\":[\"8 किमी\",\"2 किमी\",\"6 किमी\",\"10 किमी\"],\"a\":2,\"ee\":\"He walks 8 km South, 6 km West (right turn), and 8 km North (right turn). He ends up exactly 6 km West of his start.\",\"eh\":\"वह 8 किमी दक्षिण, 6 किमी पश्चिम (दायां मोड़) और 8 किमी उत्तर (दायां मोड़) चलता है। वह अपने शुरुआत के स्थान से ठीक 6 किमी पश्चिम में है।\"},{\"n\":63,\"d\":\"\",\"se\":\"Find the odd number out in the following series: 1, 4, 9, 16, 25, 36, 49, 60, 81\",\"sh\":\"निम्नलिखित श्रृंखला में बेजोड़ (odd) संख्या ज्ञात कीजिए: 1, 4, 9, 16, 25, 36, 49, 60, 81\",\"oe\":[\"36\",\"16\",\"81\",\"60\"],\"oh\":[\"36\",\"16\",\"81\",\"60\"],\"a\":3,\"ee\":\"All other numbers are perfect squares. 60 is not.\",\"eh\":\"अन्य सभी संख्याएँ पूर्ण वर्ग (Perfect squares) हैं। 60 पूर्ण वर्ग नहीं है।\"},{\"n\":64,\"d\":\"\",\"se\":\"In a family, A is the father of B. C is the sister of B. D is the son of C. F is the brother of D. How is F related to B?\",\"sh\":\"एक परिवार में, A, B का पिता है। C, B की बहन है। D, C का पुत्र है। F, D का भाई है। F, B से कैसे संबंधित है?\",\"oe\":[\"Nephew\",\"Brother\",\"Grandson\",\"Son\"],\"oh\":[\"भतीजा/भांजा (Nephew)\",\"भाई\",\"पोता\",\"बेटा\"],\"a\":0,\"ee\":\"B and C are siblings. D is C's son, making D the nephew of B. F is D's brother, so F is also B's nephew.\",\"eh\":\"B और C भाई-बहन हैं। D, C का बेटा है, जिससे D, B का भतीजा/भांजा बन जाता है। F, D का भाई है, इसलिए F भी B का भतीजा/भांजा है।\"},{\"n\":65,\"d\":\"\",\"se\":\"Which number will replace the question mark? 2, 8, 18, 32, 50, ?\",\"sh\":\"प्रश्न चिह्न के स्थान पर कौन सी संख्या आएगी? 2, 8, 18, 32, 50, ?\",\"oe\":[\"81\",\"72\",\"64\",\"100\"],\"oh\":[\"81\",\"72\",\"64\",\"100\"],\"a\":1,\"ee\":\"The pattern is 2n² (where n = 1, 2, 3, 4, 5). The 6th term is 2 × 6² = 2 × 36 = 72.\",\"eh\":\"पैटर्न 2n² है (जहाँ n = 1, 2, 3, 4, 5)। छठा पद 2 × 6² = 2 × 36 = 72 है।\"},{\"n\":66,\"d\":\"\",\"se\":\"Select the set of letters that completes the series: AZ, BY, CX, DW, ?\",\"sh\":\"अक्षरों के उस समूह का चयन करें जो श्रृंखला को पूरा करता है: AZ, BY, CX, DW, ?\",\"oe\":[\"EU\",\"FU\",\"EV\",\"EW\"],\"oh\":[\"EU\",\"FU\",\"EV\",\"EW\"],\"a\":2,\"ee\":\"The first letters follow A, B, C, D (next is E). The second letters follow Z, Y, X, W (next is V).\",\"eh\":\"पहले अक्षर आगे की ओर (A, B, C, D, E) बढ़ते हैं। दूसरे अक्षर पीछे की ओर (Z, Y, X, W, V) चलते हैं।\"},{\"n\":67,\"d\":\"\",\"se\":\"In a certain language, &ldquo;MOUSE&rdquo; is coded as &ldquo;NPVTF&rdquo;. How is &ldquo;CHAIR&rdquo; coded in that language?\",\"sh\":\"एक निश्चित भाषा में, &quot;MOUSE&quot; को &quot;NPVTF&quot; के रूप में कोडित किया गया है। उसी भाषा में &quot;CHAIR&quot; को कैसे कोडित किया जाएगा?\",\"oe\":[\"EJCKS\",\"DIBJT\",\"DHBJS\",\"DIBJS\"],\"oh\":[\"EJCKS\",\"DIBJT\",\"DHBJS\",\"DIBJS\"],\"a\":3,\"ee\":\"Each letter shifts forward by +1. C→D, H→I, A→B, I→J, R→S.\",\"eh\":\"प्रत्येक अक्षर +1 से आगे बढ़ता है। C→D, H→I, A→B, I→J, R→S।\"},{\"n\":68,\"d\":\"\",\"se\":\"Read the statements and identify which conclusion logically follows. <em>Statements:</em> Some apples are fruits. All fruits are healthy. <em>Conclusions:</em> I. Some apples are healthy. II. All healthy things are apples.\",\"sh\":\"कथनों को पढ़ें और पहचानें कि कौन सा निष्कर्ष तार्किक रूप से अनुसरण करता है। <em>कथन:</em> कुछ सेब फल हैं। सभी फल स्वस्थ (healthy) हैं। <em>निष्कर्ष:</em> I. कुछ सेब स्वस्थ हैं। II. सभी स्वस्थ चीजें सेब हैं।\",\"oe\":[\"Only I follows\",\"Only II follows\",\"Both I and II follow\",\"Neither follows\"],\"oh\":[\"केवल I अनुसरण करता है\",\"केवल II अनुसरण करता है\",\"I और II दोनों अनुसरण करते हैं\",\"न तो I और न ही II अनुसरण करता है\"],\"a\":0,\"ee\":\"Since apples overlap with fruits, and all fruits sit inside the &quot;healthy&quot; circle, some apples must be healthy. Conclusion II is illogical.\",\"eh\":\"चूंकि सेब फलों के साथ ओवरलैप करते हैं, और सभी फल &quot;स्वस्थ&quot; सर्कल के अंदर आते हैं, इसलिए कुछ सेब स्वस्थ होने चाहिए। निष्कर्ष II अतार्किक है।\"},{\"n\":69,\"d\":\"\",\"se\":\"Which word does not belong to the group?\",\"sh\":\"कौन सा शब्द समूह से संबंधित नहीं है (Odd one out)?\",\"oe\":[\"Tomato\",\"Carrot\",\"Radish\",\"Potato\"],\"oh\":[\"टमाटर (Tomato)\",\"गाजर (Carrot)\",\"मूली (Radish)\",\"आलू (Potato)\"],\"a\":0,\"ee\":\"Carrot, Potato, and Radish grow underground (root/tuber crops), while a Tomato grows above ground (botanically a fruit).\",\"eh\":\"गाजर, आलू और मूली जमीन के नीचे (जड़/कंद) उगते हैं, जबकि टमाटर जमीन के ऊपर उगता है (वानस्पतिक रूप से यह एक फल है)।\"},{\"n\":70,\"d\":\"\",\"se\":\"A clock shows the time as 8:20. What is the angle between the hour and minute hands?\",\"sh\":\"एक घड़ी में समय 8:20 हो रहा है। घंटे और मिनट की सुइयों के बीच का कोण क्या है?\",\"oe\":[\"150°\",\"130°\",\"120°\",\"140°\"],\"oh\":[\"150°\",\"130°\",\"120°\",\"140°\"],\"a\":1,\"ee\":\"Hour hand position: 8 × 30° + (20/2)° = 250°. Minute hand position: 20 × 6° = 120°. Difference = 250° - 120° = 130°.\",\"eh\":\"घंटे की सुई की स्थिति: 8 × 30° + (20/2)° = 250°। मिनट की सुई की स्थिति: 20 × 6° = 120°। अंतर = 250° - 120° = 130°।\"},{\"n\":71,\"d\":\"\",\"se\":\"Find the next term in the series: 1, 8, 27, 64, ?\",\"sh\":\"श्रृंखला में अगला पद ज्ञात कीजिए: 1, 8, 27, 64, ?\",\"oe\":[\"100\",\"216\",\"125\",\"81\"],\"oh\":[\"100\",\"216\",\"125\",\"81\"],\"a\":2,\"ee\":\"This is a series of perfect cubes (1³, 2³, 3³, 4³, 5³).\",\"eh\":\"यह पूर्ण घनों (Perfect cubes) की श्रृंखला है (1³, 2³, 3³, 4³, 5³)।\"},{\"n\":72,\"d\":\"\",\"se\":\"If A is the brother of B, B is the sister of C, and C is the daughter of D, how is A related to D?\",\"sh\":\"यदि A, B का भाई है, B, C की बहन है, और C, D की पुत्री है, तो A, D से किस प्रकार संबंधित है?\",\"oe\":[\"Nephew\",\"Brother\",\"Daughter\",\"Son\"],\"oh\":[\"भतीजा\",\"भाई\",\"बेटी\",\"बेटा\"],\"a\":3,\"ee\":\"A, B, and C are all siblings. Since C is the child of D, A is also the child (son) of D.\",\"eh\":\"A, B, और C सभी भाई-बहन हैं। चूँकि C, D की संतान है, A भी D की संतान (बेटा) है।\"},{\"n\":73,\"d\":\"\",\"se\":\"Which of the following is a &quot;strong&quot; argument regarding the statement below? <em>Statement:</em> Should schools teach coding to all students? <em>Argument I:</em> Yes, it prepares them logically for a technology-driven future. <em>Argument II:</em> No, it is a difficult subject for young children to grasp.\",\"sh\":\"नीचे दिए गए कथन के संबंध में निम्नलिखित में से कौन सा एक &quot;ठोस/मजबूत&quot; (Strong) तर्क है? <em>कथन:</em> क्या स्कूलों को सभी छात्रों को कोडिंग (Coding) सिखानी चाहिए? <em>तर्क I:</em> हाँ, यह उन्हें तकनीक-संचालित भविष्य के लिए तार्किक रूप से तैयार करता है। <em>तर्क II:</em> नहीं, यह छोटे बच्चों के समझने के लिए एक कठिन विषय है।\",\"oe\":[\"Only I is strong\",\"Only II is strong\",\"Both are strong\",\"Neither is strong\"],\"oh\":[\"केवल I मजबूत है\",\"केवल II मजबूत है\",\"दोनों मजबूत हैं\",\"कोई भी मजबूत नहीं है\"],\"a\":0,\"ee\":\"Argument I provides a practical, beneficial rationale. Argument II relies on an unproven, subjective generalization.\",\"eh\":\"तर्क I एक व्यावहारिक, लाभकारी आधार प्रदान करता है। तर्क II एक अप्रमाणित, व्यक्तिपरक सामान्यीकरण पर निर्भर करता है।\"},{\"n\":74,\"d\":\"\",\"se\":\"Choose the correct synonym of &ldquo;Abandon&rdquo;:\",\"sh\":\"Choose the correct synonym of &ldquo;Abandon&rdquo;:\",\"oe\":[\"Forsake\",\"Retain\",\"Uphold\",\"Keep\"],\"oh\":[\"Forsake\",\"Retain\",\"Uphold\",\"Keep\"],\"a\":0,\"ee\":\"To abandon means to forsake or leave completely.\",\"eh\":\"To abandon means to forsake or leave completely.\"},{\"n\":75,\"d\":\"\",\"se\":\"Select the antonym of &ldquo;Ancient&rdquo;:\",\"sh\":\"Select the antonym of &ldquo;Ancient&rdquo;:\",\"oe\":[\"Antique\",\"Modern\",\"Outdated\",\"Old\"],\"oh\":[\"Antique\",\"Modern\",\"Outdated\",\"Old\"],\"
