</strong> (&quot;Jana Gana Mana&quot;) is:\",\"sh\":\"भारतीय <strong>राष्ट्रगान (&quot;जन गण मन&quot;)</strong> के रचयिता कौन हैं:\",\"oe\":[\"Rabindranath Tagore\",\"Subramania Bharati\",\"Mahatma Gandhi\",\"Bankim Chandra Chatterjee\"],\"oh\":[\"रवींद्रनाथ टैगोर\",\"सुब्रमण्यम भारती\",\"महात्मा गांधी\",\"बंकिम चंद्र चटर्जी\"],\"a\":0,\"ee\":\"Rabindranath Tagore.\",\"eh\":\"रवींद्रनाथ टैगोर।\"},{\"n\":74,\"d\":\"\",\"se\":\"The <strong>author of the National Song &quot;Vande Mataram&quot;</strong> is:\",\"sh\":\"<strong>राष्ट्रीय गीत &quot;वंदे मातरम&quot;</strong> के रचयिता कौन हैं:\",\"oe\":[\"Mahatma Gandhi\",\"Bankim Chandra Chatterjee\",\"Subramania Bharati\",\"Rabindranath Tagore\"],\"oh\":[\"महात्मा गांधी\",\"बंकिम चंद्र चटर्जी\",\"सुब्रमण्यम भारती\",\"रवींद्रनाथ टैगोर\"],\"a\":1,\"ee\":\"Bankim Chandra Chatterjee.\",\"eh\":\"बंकिम चंद्र चटर्जी।\"},{\"n\":75,\"d\":\"\",\"se\":\"The <strong>first printed newspaper in India</strong> (started in 1780) was:\",\"sh\":\"भारत का <strong>पहला मुद्रित समाचार पत्र</strong> (1780 में शुरू हुआ) कौन सा था:\",\"oe\":[\"The Hindu\",\"Times of India\",\"Bengal Gazette\",\"Bombay Samachar\"],\"oh\":[\"द हिंदू\",\"टाइम्स ऑफ इंडिया\",\"बंगाल गजट (Bengal Gazette)\",\"बॉम्बे समाचार\"],\"a\":2,\"ee\":\"Hicky's Bengal Gazette.\",\"eh\":\"हिक्की का बंगाल गजट।\"},{\"n\":76,\"d\":\"\",\"se\":\"India's <strong>Republic Day</strong> is celebrated annually on:\",\"sh\":\"भारत का <strong>गणतंत्र दिवस (Republic Day)</strong> प्रतिवर्ष मनाया जाता है:\",\"oe\":[\"26th November\",\"2nd October\",\"15th August\",\"26th January\"],\"oh\":[\"26 नवंबर\",\"2 अक्टूबर\",\"15 अगस्त\",\"26 जनवरी\"],\"a\":3,\"ee\":\"26th January.\",\"eh\":\"26 जनवरी।\"},{\"n\":77,\"d\":\"\",\"se\":\"India's <strong>Independence Day</strong> is celebrated annually on:\",\"sh\":\"भारत का <strong>स्वतंत्रता दिवस (Independence Day)</strong> प्रतिवर्ष मनाया जाता है:\",\"oe\":[\"15th August\",\"2nd October\",\"26th January\",\"26th November\"],\"oh\":[\"15 अगस्त\",\"2 अक्टूबर\",\"26 जनवरी\",\"26 नवंबर\"],\"a\":0,\"ee\":\"15th August.\",\"eh\":\"15 अगस्त।\"},{\"n\":78,\"d\":\"\",\"se\":\"<strong>Gandhi Jayanti</strong> (and the International Day of Non-Violence) is celebrated on:\",\"sh\":\"<strong>गांधी जयंती</strong> (और अंतर्राष्ट्रीय अहिंसा दिवस) कब मनाया जाता है:\",\"oe\":[\"26th November\",\"2nd October\",\"26th January\",\"15th August\"],\"oh\":[\"26 नवंबर\",\"2 अक्टूबर\",\"26 जनवरी\",\"15 अगस्त\"],\"a\":1,\"ee\":\"2nd October.\",\"eh\":\"2 अक्टूबर।\"},{\"n\":79,\"d\":\"\",\"se\":\"<strong>Constitution Day (Samvidhan Divas)</strong> in India is celebrated on:\",\"sh\":\"भारत में <strong>संविधान दिवस (Samvidhan Divas)</strong> कब मनाया जाता है:\",\"oe\":[\"26th January\",\"2nd October\",\"26th November\",\"15th August\"],\"oh\":[\"26 जनवरी\",\"2 अक्टूबर\",\"26 नवंबर\",\"15 अगस्त\"],\"a\":2,\"ee\":\"26th November (marking the adoption of the Constitution in 1949).\",\"eh\":\"26 नवंबर (1949 में संविधान को अपनाने के उपलक्ष्य में)।\"},{\"n\":80,\"d\":\"\",\"se\":\"National <strong>Teachers' Day</strong> in India (honoring Dr. S. Radhakrishnan) is celebrated on:\",\"sh\":\"भारत में राष्ट्रीय <strong>शिक्षक दिवस</strong> (डॉ. एस. राधाकृष्णन के सम्मान में) कब मनाया जाता है:\",\"oe\":[\"10th October\",\"10th September\",\"5th October\",\"5th September\"],\"oh\":[\"10 अक्टूबर\",\"10 सितंबर\",\"5 अक्टूबर\",\"5 सितंबर\"],\"a\":3,\"ee\":\"5th September.\",\"eh\":\"5 सितंबर।\"},{\"n\":81,\"d\":\"\",\"se\":\"National <strong>Children's Day</strong> in India is celebrated on:\",\"sh\":\"भारत में राष्ट्रीय <strong>बाल दिवस</strong> कब मनाया जाता है:\",\"oe\":[\"14th November\",\"14th December\",\"14th October\",\"14th September\"],\"oh\":[\"14 नवंबर\",\"14 दिसंबर\",\"14 अक्टूबर\",\"14 सितंबर\"],\"a\":0,\"ee\":\"14th November.\",\"eh\":\"14 नवंबर।\"},{\"n\":82,\"d\":\"\",\"se\":\"<strong>World Health Day</strong> is celebrated globally on:\",\"sh\":\"<strong>विश्व स्वास्थ्य दिवस</strong> विश्व स्तर पर कब मनाया जाता है:\",\"oe\":[\"7th July\",\"7th April\",\"7th June\",\"7th May\"],\"oh\":[\"7 जुलाई\",\"7 अप्रैल\",\"7 जून\",\"7 मई\"],\"a\":1,\"ee\":\"7th April.\",\"eh\":\"7 अप्रैल।\"},{\"n\":83,\"d\":\"\",\"se\":\"<strong>International Women's Day</strong> is celebrated globally on:\",\"sh\":\"<strong>अंतर्राष्ट्रीय महिला दिवस</strong> विश्व स्तर पर कब मनाया जाता है:\",\"oe\":[\"8th June\",\"8th April\",\"8th March\",\"8th May\"],\"oh\":[\"8 जून\",\"8 अप्रैल\",\"8 मार्च\",\"8 मई\"],\"a\":2,\"ee\":\"8th March.\",\"eh\":\"8 मार्च।\"},{\"n\":84,\"d\":\"\",\"se\":\"India's <strong>first commercial nuclear power plant</strong> is located at:\",\"sh\":\"भारत का <strong>पहला वाणिज्यिक परमाणु ऊर्जा संयंत्र (nuclear power plant)</strong> कहाँ स्थित है:\",\"oe\":[\"Narora\",\"Kalpakkam\",\"Kota\",\"Tarapur\"],\"oh\":[\"नरोरा\",\"कलपक्कम\",\"कोटा\",\"तारापुर (Tarapur)\"],\"a\":3,\"ee\":\"Tarapur Atomic Power Station in Maharashtra.\",\"eh\":\"महाराष्ट्र में तारापुर परमाणु ऊर्जा स्टेशन।\"},{\"n\":85,\"d\":\"\",\"se\":\"India's <strong>first indigenously built satellite</strong> was:\",\"sh\":\"भारत का <strong>पहला स्वदेशी रूप से निर्मित उपग्रह (satellite)</strong> था:\",\"oe\":[\"Aryabhata\",\"Rohini\",\"INSAT‑1A\",\"Bhaskara\"],\"oh\":[\"आर्यभट्ट\",\"रोहिणी\",\"इनसैट-1A\",\"भास्कर\"],\"a\":0,\"ee\":\"Aryabhata (launched in 1975).\",\"eh\":\"आर्यभट्ट (1975 में लॉन्च किया गया)।\"},{\"n\":86,\"d\":\"\",\"se\":\"The full form of <strong>ISRO</strong>, India's premier space agency, is:\",\"sh\":\"भारत की प्रमुख अंतरिक्ष एजेंसी, <strong>ISRO</strong> का पूर्ण रूप है:\",\"oe\":[\"Indian Space Reorganisation\",\"Indian Space Research Organisation\",\"Indian Scientific Research Organisation\",\"International Space Research Organisation\"],\"oh\":[\"इंडियन स्पेस रिऑर्गनाइजेशन\",\"इंडियन स्पेस रिसर्च ऑर्गनाइजेशन (Indian Space Research Organisation)\",\"इंडियन साइंटिफिक रिसर्च ऑर्गनाइजेशन\",\"इंटरनेशनल स्पेस रिसर्च ऑर्गनाइजेशन\"],\"a\":1,\"ee\":\"Indian Space Research Organisation.\",\"eh\":\"इंडियन स्पेस रिसर्च ऑर्गनाइजेशन।\"},{\"n\":87,\"d\":\"\",\"se\":\"The <strong>first Indian citizen to travel into space</strong> was:\",\"sh\":\"<strong>अंतरिक्ष में यात्रा करने वाले पहले भारतीय नागरिक</strong> थे:\",\"oe\":[\"Ravish Malhotra\",\"Kalpana Chawla\",\"Rakesh Sharma\",\"Sunita Williams\"],\"oh\":[\"रवीश मल्होत्रा\",\"कल्पना चावला\",\"राकेश शर्मा\",\"सुनीता विलियम्स\"],\"a\":2,\"ee\":\"Wing Commander Rakesh Sharma (1984).\",\"eh\":\"विंग कमांडर राकेश शर्मा (1984)।\"},{\"n\":88,\"d\":\"\",\"se\":\"The <strong>first Indian-born woman to travel into space</strong> was:\",\"sh\":\"<strong>अंतरिक्ष में जाने वाली भारत में जन्मी पहली महिला</strong> थीं:\",\"oe\":[\"Sirisha Bandla\",\"Shawna Pandya\",\"Sunita Williams\",\"Kalpana Chawla\"],\"oh\":[\"सिरीशा बांदला\",\"शौना पांड्या\",\"सुनीता विलियम्स\",\"कल्पना चावला\"],\"a\":3,\"ee\":\"Kalpana Chawla.\",\"eh\":\"कल्पना चावला।\"},{\"n\":89,\"d\":\"\",\"se\":\"In the field of space exploration, the full form of the US agency <strong>NASA</strong> is:\",\"sh\":\"अंतरिक्ष अन्वेषण के क्षेत्र में, अमेरिकी एजेंसी <strong>NASA</strong> का पूर्ण रूप है:\",\"oe\":[\"National Aeronautics and Space Administration\",\"National Aerospace and Space Agency\",\"National Aerospace and Space Administration\",\"National Aeronautics and Space Agency\"],\"oh\":[\"नेशनल एयरोनॉटिक्स एंड स्पेस एडमिनिस्ट्रेशन (National Aeronautics and Space Administration)\",\"नेशनल एयरोस्पेस एंड स्पेस एजेंसी\",\"नेशनल एयरोस्पेस एंड स्पेस एडमिनिस्ट्रेशन\",\"नेशनल एयरोनॉटिक्स एंड स्पेस एजेंसी\"],\"a\":0,\"ee\":\"National Aeronautics and Space Administration.\",\"eh\":\"नेशनल एयरोनॉटिक्स एंड स्पेस एडमिनिस्ट्रेशन।\"},{\"n\":90,\"d\":\"\",\"se\":\"India's <strong>first indigenous COVID-19 vaccine</strong>, developed by Bharat Biotech, is:\",\"sh\":\"भारत बायोटेक द्वारा विकसित भारत का <strong>पहला स्वदेशी COVID-19 वैक्सीन</strong> कौन सा है:\",\"oe\":[\"ZyCoV-D\",\"Covaxin\",\"Covishield\",\"Sputnik V\"],\"oh\":[\"ZyCoV-D\",\"कोवैक्सिन (Covaxin)\",\"कोविशील्ड\",\"स्पुतनिक वी\"],\"a\":1,\"ee\":\"Covaxin.\",\"eh\":\"कोवैक्सिन।\"},{\"n\":91,\"d\":\"\",\"se\":\"The <strong>national currency of India</strong> is the:\",\"sh\":\"<strong>भारत की राष्ट्रीय मुद्रा</strong> है:\",\"oe\":[\"Euro\",\"Yen\",\"Rupee\",\"Dollar\"],\"oh\":[\"यूरो\",\"येन\",\"रुपया (Rupee)\",\"डॉलर\"],\"a\":2,\"ee\":\"Indian Rupee (INR).\",\"eh\":\"भारतीय रुपया (INR)।\"},{\"n\":92,\"d\":\"\",\"se\":\"The <strong>national animal of India</strong> is the:\",\"sh\":\"<strong>भारत का राष्ट्रीय पशु</strong> है:\",\"oe\":[\"Lion\",\"Elephant\",\"Leopard\",\"Bengal Tiger\"],\"oh\":[\"शेर\",\"हाथी\",\"तेंदुआ\",\"बंगाल टाइगर (Tiger)\"],\"a\":3,\"ee\":\"Bengal Tiger.\",\"eh\":\"बंगाल टाइगर।\"},{\"n\":93,\"d\":\"\",\"se\":\"The <strong>national bird of India</strong> is the:\",\"sh\":\"<strong>भारत का राष्ट्रीय पक्षी</strong> है:\",\"oe\":[\"Indian Peafowl (Peacock)\",\"Eagle\",\"Parrot\",\"Swan\"],\"oh\":[\"भारतीय मोर (Peacock)\",\"चील\",\"तोता\",\"हंस\"],\"a\":0,\"ee\":\"Peacock.\",\"eh\":\"मोर।\"},{\"n\":94,\"d\":\"\",\"se\":\"The <strong>national flower of India</strong> is the:\",\"sh\":\"<strong>भारत का राष्ट्रीय फूल</strong> है:\",\"oe\":[\"Jasmine\",\"Lotus\",\"Sunflower\",\"Rose\"],\"oh\":[\"चमेली\",\"कमल (Lotus)\",\"सूरजमुखी\",\"गुलाब\"],\"a\":1,\"ee\":\"Lotus.\",\"eh\":\"कमल।\"},{\"n\":95,\"d\":\"\",\"se\":\"The <strong>national tree of India</strong> is the:\",\"sh\":\"<strong>भारत का राष्ट्रीय वृक्ष</strong> है:\",\"oe\":[\"Peepal Tree\",\"Neem Tree\",\"Banyan Tree\",\"Mango Tree\"],\"oh\":[\"पीपल का पेड़\",\"नीम का पेड़\",\"बरगद का पेड़ (Banyan Tree)\",\"आम का पेड़\"],\"a\":2,\"ee\":\"Banyan Tree.\",\"eh\":\"बरगद का पेड़।\"},{\"n\":96,\"d\":\"\",\"se\":\"The global headquarters of the <strong>United Nations (UN)</strong> is situated in:\",\"sh\":\"<strong>संयुक्त राष्ट्र (UN)</strong> का वैश्विक मुख्यालय कहाँ स्थित है:\",\"oe\":[\"Geneva\",\"Paris\",\"London\",\"New York\"],\"oh\":[\"जिनेवा\",\"पेरिस\",\"लंदन\",\"न्यूयॉर्क\"],\"a\":3,\"ee\":\"New York City, USA.\",\"eh\":\"न्यूयॉर्क शहर, अमेरिका।\"},{\"n\":97,\"d\":\"\",\"se\":\"The headquarters of <strong>UNESCO</strong> (United Nations Educational, Scientific and Cultural Organization) is situated in:\",\"sh\":\"<strong>यूनेस्को (UNESCO)</strong> का मुख्यालय कहाँ स्थित है:\",\"oe\":[\"Paris\",\"New York\",\"London\",\"Geneva\"],\"oh\":[\"पेरिस\",\"न्यूयॉर्क\",\"लंदन\",\"जिनेवा\"],\"a\":0,\"ee\":\"Paris, France.\",\"eh\":\"पेरिस, फ्रांस।\"},{\"n\":98,\"d\":\"\",\"se\":\"The headquarters of the <strong>World Health Organization (WHO)</strong> is situated in:\",\"sh\":\"<strong>विश्व स्वास्थ्य संगठन (WHO)</strong> का मुख्यालय कहाँ स्थित है:\",\"oe\":[\"London\",\"Geneva\",\"Paris\",\"New York\"],\"oh\":[\"लंदन\",\"जिनेवा\",\"पेरिस\",\"न्यूयॉर्क\"],\"a\":1,\"ee\":\"Geneva, Switzerland.\",\"eh\":\"जिनेवा, स्विट्जरलैंड।\"},{\"n\":99,\"d\":\"\",\"se\":\"The <strong>current Prime Minister of India</strong> is:\",\"sh\":\"भारत के <strong>वर्तमान प्रधानमंत्री</strong> कौन हैं:\",\"oe\":[\"Manmohan Singh\",\"Amit Shah\",\"Narendra Modi\",\"Rahul Gandhi\"],\"oh\":[\"मनमोहन सिंह\",\"अमित शाह\",\"नरेंद्र मोदी\",\"राहुल गांधी\"],\"a\":2,\"ee\":\"Narendra Modi.\",\"eh\":\"नरेंद्र मोदी।\"},{\"n\":100,\"d\":\"\",\"se\":\"The <strong>current Chief Minister of Chhattisgarh</strong> is:\",\"sh\":\"छत्तीसगढ़ के <strong>वर्तमान मुख्यमंत्री</strong> कौन हैं:\",\"oe\":[\"Raman Singh\",\"Mohan Yadav\",\"Bhupesh Baghel\",\"Vishnu Deo Sai\"],\"oh\":[\"रमन सिंह\",\"मोहन यादव\",\"भूपेश बघेल\",\"विष्णु देव साय\"],\"a\":3,\"ee\":\"Vishnu Deo Sai.\",\"eh\":\"विष्णु देव साय।\"}]},{\"id\":\"as8\",\"num\":8,\"name\":\"Computer Awareness\",\"q\":[{\"n\":1,\"d\":\"\",\"se\":\"The <strong>brain</strong> of a computer is the:\",\"sh\":\"कंप्यूटर का <strong>मस्तिष्क (brain)</strong> किसे कहा जाता है:\",\"oe\":[\"CPU\",\"RAM\",\"Motherboard\",\"Hard Disk\"],\"oh\":[\"CPU\",\"RAM\",\"मदरबोर्ड\",\"हार्ड डिस्क\"],\"a\":0,\"ee\":\"The Central Processing Unit (CPU) is the brain of the computer.\",\"eh\":\"सेंट्रल प्रोसेसिंग यूनिट (CPU) कंप्यूटर का मस्तिष्क है।\"},{\"n\":2,\"d\":\"\",\"se\":\"Which of the following is <strong>not</strong> a standard type/classification of computer?\",\"sh\":\"निम्नलिखित में से कौन सा कंप्यूटर का मानक प्रकार/वर्गीकरण <strong>नहीं</strong> है?\",\"oe\":[\"Mainframe\",\"Multiframe\",\"Supercomputer\",\"Minicomputer\"],\"oh\":[\"मेनफ्रेम (Mainframe)\",\"मल्टीफ्रेम (Multiframe)\",\"सुपरकंप्यूटर (Supercomputer)\",\"मिनीकंप्यूटर (Minicomputer)\"],\"a\":1,\"ee\":\"&quot;Multiframe&quot; is not a standard computer classification.\",\"eh\":\"&quot;मल्टीफ्रेम&quot; कंप्यूटर का कोई मानक प्रकार नहीं है।\"},{\"n\":3,\"d\":\"\",\"se\":\"The <strong>first generation</strong> of computers used:\",\"sh\":\"कंप्यूटर की <strong>पहली पीढ़ी (first generation)</strong> में किसका उपयोग किया गया था:\",\"oe\":[\"Transistors\",\"Integrated Circuits\",\"Vacuum Tubes\",\"Microprocessors\"],\"oh\":[\"ट्रांजिस्टर\",\"इंटीग्रेटेड सर्किट (IC)\",\"वैक्यूम ट्यूब (Vacuum Tubes)\",\"माइक्रोप्रोसेसर\"],\"a\":2,\"ee\":\"Vacuum tubes were the core electronic component in first-generation computers.\",\"eh\":\"पहली पीढ़ी के कंप्यूटरों में वैक्यूम ट्यूब का उपयोग किया गया था।\"},{\"n\":4,\"d\":\"\",\"se\":\"The <strong>second generation</strong> of computers used:\",\"sh\":\"कंप्यूटर की <strong>दूसरी पीढ़ी</strong> में किसका उपयोग किया गया था:\",\"oe\":[\"Integrated Circuits\",\"Microprocessors\",\"Vacuum Tubes\",\"Transistors\"],\"oh\":[\"इंटीग्रेटेड सर्किट\",\"माइक्रोप्रोसेसर\",\"वैक्यूम ट्यूब\",\"ट्रांजिस्टर (Transistors)\"],\"a\":3,\"ee\":\"Transistors replaced vacuum tubes in the second generation.\",\"eh\":\"दूसरी पीढ़ी में वैक्यूम ट्यूब की जगह ट्रांजिस्टर ने ले ली।\"},{\"n\":5,\"d\":\"\",\"se\":\"The <strong>third generation</strong> of computers used:\",\"sh\":\"कंप्यूटर की <strong>तीसरी पीढ़ी</strong> में किसका उपयोग किया गया था:\",\"oe\":[\"Integrated Circuits\",\"Transistors\",\"Microprocessors\",\"Vacuum Tubes\"],\"oh\":[\"इंटीग्रेटेड सर्किट (IC)\",\"ट्रांजिस्टर\",\"माइक्रोप्रोसेसर\",\"वैक्यूम ट्यूब\"],\"a\":0,\"ee\":\"Integrated Circuits (ICs) were introduced in third-generation computers.\",\"eh\":\"तीसरी पीढ़ी के कंप्यूटरों में इंटीग्रेटेड सर्किट (ICs) का उपयोग किया गया।\"},{\"n\":6,\"d\":\"\",\"se\":\"The <strong>fourth generation</strong> of computers used:\",\"sh\":\"कंप्यूटर की <strong>चौथी पीढ़ी</strong> में किसका उपयोग किया गया था:\",\"oe\":[\"Vacuum Tubes\",\"Microprocessors\",\"Transistors\",\"Integrated Circuits\"],\"oh\":[\"वैक्यूम ट्यूब\",\"माइक्रोप्रोसेसर (Microprocessors)\",\"ट्रांजिस्टर\",\"इंटीग्रेटेड सर्किट\"],\"a\":1,\"ee\":\"Microprocessors (VLSI) were used in fourth-generation computers.\",\"eh\":\"चौथी पीढ़ी के कंप्यूटरों में माइक्रोप्रोसेसर (VLSI) का उपयोग किया गया।\"},{\"n\":7,\"d\":\"\",\"se\":\"The <strong>smallest unit of data</strong> in a computer is the:\",\"sh\":\"कंप्यूटर में <strong>डेटा की सबसे छोटी इकाई</strong> है:\",\"oe\":[\"Word\",\"Byte\",\"Bit\",\"Nibble\"],\"oh\":[\"वर्ड (Word)\",\"बाइट (Byte)\",\"बिट (Bit)\",\"निबल (Nibble)\"],\"a\":2,\"ee\":\"A bit (binary digit) is the smallest unit of data.\",\"eh\":\"बिट (बाइनरी अंक) डेटा की सबसे छोटी इकाई है।\"},{\"n\":8,\"d\":\"\",\"se\":\"<strong>One byte</strong> is equal to:\",\"sh\":\"<strong>एक बाइट (One byte)</strong> किसके बराबर होता है:\",\"oe\":[\"6 bits\",\"4 bits\",\"10 bits\",\"8 bits\"],\"oh\":[\"6 बिट्स\",\"4 बिट्स\",\"10 बिट्स\",\"8 बिट्स\"],\"a\":3,\"ee\":\"1 byte = 8 bits. (A nibble is 4 bits).\",\"eh\":\"1 बाइट = 8 बिट्स। (एक निबल 4 बिट्स का होता है)।\"},{\"n\":9,\"d\":\"\",\"se\":\"<strong>One Kilobyte (KB)</strong> is equal to:\",\"sh\":\"<strong>एक किलोबाइट (1 KB)</strong> किसके बराबर होता है:\",\"oe\":[\"1024 bytes\",\"100 bytes\",\"2048 bytes\",\"1000 bytes\"],\"oh\":[\"1024 बाइट्स\",\"100 बाइट्स\",\"2048 बाइट्स\",\"1000 बाइट्स\"],\"a\":0,\"ee\":\"In binary computing, 1 KB = 1024 bytes.\",\"eh\":\"बाइनरी कंप्यूटिंग में, 1 KB = 1024 बाइट्स।\"},{\"n\":10,\"d\":\"\",\"se\":\"<strong>One Megabyte (MB)</strong> is equal to:\",\"sh\":\"<strong>एक मेगाबाइट (1 MB)</strong> किसके बराबर होता है:\",\"oe\":[\"2048 KB\",\"1024 KB\",\"512 KB\",\"1000 KB\"],\"oh\":[\"2048 KB\",\"1024 KB\",\"512 KB\",\"1000 KB\"],\"a\":1,\"ee\":\"1 MB = 1024 KB.\",\"eh\":\"1 MB = 1024 KB।\"},{\"n\":11,\"d\":\"\",\"se\":\"<strong>One Gigabyte (GB)</strong> is equal to:\",\"sh\":\"<strong>एक गीगाबाइट (1 GB)</strong> किसके बराबर होता है:\",\"oe\":[\"1000 MB\",\"512 MB\",\"1024 MB\",\"2048 MB\"],\"oh\":[\"1000 MB\",\"512 MB\",\"1024 MB\",\"2048 MB\"],\"a\":2,\"ee\":\"1 GB = 1024 MB.\",\"eh\":\"1 GB = 1024 MB।\"},{\"n\":12,\"d\":\"\",\"se\":\"The <strong>binary number system</strong> uses which digits?\",\"sh\":\"<strong>बाइनरी संख्या प्रणाली (binary number system)</strong> किन अंकों का उपयोग करती है?\",\"oe\":[\"0 to F\",\"0 to 7\",\"0 to 9\",\"0 and 1\"],\"oh\":[\"0 से F\",\"0 से 7\",\"0 से 9\",\"0 और 1\"],\"a\":3,\"ee\":\"Binary is a base-2 system using only 0 and 1.\",\"eh\":\"बाइनरी बेस-2 प्रणाली है जिसमें केवल 0 और 1 का उपयोग होता है।\"},{\"n\":13,\"d\":\"\",\"se\":\"The <strong>decimal equivalent</strong> of the binary number 1010 is:\",\"sh\":\"बाइनरी संख्या 1010 का <strong>दशमलव (decimal) समतुल्य</strong> क्या है:\",\"oe\":[\"10\",\"8\",\"12\",\"9\"],\"oh\":[\"10\",\"8\",\"12\",\"9\"],\"a\":0,\"ee\":\"(1×2³) + (0×2²) + (1×2¹) + (0×2⁰) = 8 + 0 + 2 + 0 = 10.\",\"eh\":\"(1×2³) + (0×2²) + (1×2¹) + (0×2⁰) = 8 + 0 + 2 + 0 = 10।\"},{\"n\":14,\"d\":\"\",\"se\":\"The <strong>hexadecimal number system</strong> uses base:\",\"sh\":\"<strong>हेक्साडेसिमल (Hexadecimal)</strong> संख्या प्रणाली का बेस (base) क्या है:\",\"oe\":[\"10\",\"16\",\"8\",\"2\"],\"oh\":[\"10\",\"16\",\"8\",\"2\"],\"a\":1,\"ee\":\"Hexadecimal uses base 16 (0-9 and A-F).\",\"eh\":\"हेक्साडेसिमल बेस 16 (0-9 और A-F) का उपयोग करता है।\"},{\"n\":15,\"d\":\"\",\"se\":\"The <strong>octal number system</strong> uses base:\",\"sh\":\"<strong>ऑक्टल (Octal)</strong> संख्या प्रणाली का बेस क्या है:\",\"oe\":[\"16\",\"2\",\"8\",\"10\"],\"oh\":[\"16\",\"2\",\"8\",\"10\"],\"a\":2,\"ee\":\"Octal uses base 8 (0-7).\",\"eh\":\"ऑक्टल बेस 8 (0-7) का उपयोग करता है।\"},{\"n\":16,\"d\":\"\",\"se\":\"Which of the following is <strong>volatile memory</strong>?\",\"sh\":\"निम्नलिखित में से कौन सी <strong>अस्थिर (volatile) मेमोरी</strong> है?\",\"oe\":[\"Hard Disk\",\"DVD\",\"ROM\",\"RAM\"],\"oh\":[\"हार्ड डिस्क\",\"DVD\",\"ROM\",\"RAM\"],\"a\":3,\"ee\":\"RAM is volatile; it loses all its data when the power is turned off.\",\"eh\":\"RAM अस्थिर है; बिजली बंद होने पर इसका सारा डेटा नष्ट हो जाता है।\"},{\"n\":17,\"d\":\"\",\"se\":\"Which of the following is <strong>non-volatile memory</strong>?\",\"sh\":\"निम्नलिखित में से कौन सी <strong>गैर-वाष्पशील / स्थायी (non-volatile) मेमोरी</strong> है?\",\"oe\":[\"ROM\",\"Register\",\"RAM\",\"Cache\"],\"oh\":[\"ROM\",\"रजिस्टर\",\"RAM\",\"कैश (Cache)\"],\"a\":0,\"ee\":\"ROM (Read-Only Memory) retains data even without power.\",\"eh\":\"ROM (रीड-ओनली मेमोरी) बिजली न होने पर भी डेटा को बरकरार रखती है।\"},{\"n\":18,\"d\":\"\",\"se\":\"The <strong>primary memory</strong> of a computer broadly includes:\",\"sh\":\"कंप्यूटर की <strong>प्राथमिक (primary) मेमोरी</strong> में व्यापक रूप से शामिल हैं:\",\"oe\":[\"Pen Drive\",\"RAM and ROM\",\"Hard Disk\",\"CD-ROM\"],\"oh\":[\"पेन ड्राइव\",\"RAM और ROM\",\"हार्ड डिस्क\",\"CD-ROM\"],\"a\":1,\"ee\":\"Primary (main) memory includes both RAM and ROM.\",\"eh\":\"प्राथमिक (मुख्य) मेमोरी में RAM और ROM दोनों शामिल हैं।\"},{\"n\":19,\"d\":\"\",\"se\":\"The <strong>secondary memory</strong> of a computer includes:\",\"sh\":\"कंप्यूटर की <strong>द्वितीयक (secondary) मेमोरी</strong> में शामिल है:\",\"oe\":[\"ROM\",\"Cache\",\"Hard Disk\",\"RAM\"],\"oh\":[\"ROM\",\"कैश (Cache)\",\"हार्ड डिस्क\",\"RAM\"],\"a\":2,\"ee\":\"Hard Disk is a secondary/auxiliary storage device.\",\"eh\":\"हार्ड डिस्क एक द्वितीयक/सहायक भंडारण उपकरण है।\"},{\"n\":20,\"d\":\"\",\"se\":\"<strong>Cache memory</strong> is a type of:\",\"sh\":\"<strong>कैश मेमोरी (Cache memory)</strong> किसका एक प्रकार है:\",\"oe\":[\"Secondary memory\",\"Virtual memory\",\"Tertiary memory\",\"High-speed primary memory\"],\"oh\":[\"द्वितीयक मेमोरी\",\"वर्चुअल मेमोरी\",\"तृतीयक मेमोरी\",\"उच्च गति वाली प्राथमिक मेमोरी\"],\"a\":3,\"ee\":\"Cache is a small, extremely fast memory located near or inside the CPU.\",\"eh\":\"कैश एक छोटी, अत्यधिक तेज़ मेमोरी है जो CPU के पास या अंदर स्थित होती है।\"},{\"n\":21,\"d\":\"\",\"se\":\"<strong>ROM</strong> stands for:\",\"sh\":\"<strong>ROM</strong> का पूर्ण रूप है:\",\"oe\":[\"Read Only Memory\",\"Read Only Mode\",\"Random Only Mode\",\"Random Only Memory\"],\"oh\":[\"Read Only Memory\",\"Read Only Mode\",\"Random Only Mode\",\"Random Only Memory\"],\"a\":0,\"ee\":\"Read Only Memory.\",\"eh\":\"रीड ओनली मेमोरी।\"},{\"n\":22,\"d\":\"\",\"se\":\"<strong>PROM</strong> stands for:\",\"sh\":\"<strong>PROM</strong> का पूर्ण रूप है:\",\"oe\":[\"Primary Read Only Memory\",\"Programmable Read Only Memory\",\"Programmed Read Only Memory\",\"Programmable Random Only Memory\"],\"oh\":[\"Primary Read Only Memory\",\"Programmable Read Only Memory\",\"Programmed Read Only Memory\",\"Programmable Random Only Memory\"],\"a\":1,\"ee\":\"Programmable Read Only Memory.\",\"eh\":\"प्रोग्रामाबल रीड ओनली मेमोरी।\"},{\"n\":23,\"d\":\"\",\"se\":\"<strong>EPROM</strong> stands for:\",\"sh\":\"<strong>EPROM</strong> का पूर्ण रूप है:\",\"oe\":[\"Electrical Programmable Read Only Memory\",\"Erasable Primary Read Only Memory\",\"Erasable Programmable Read Only Memory\",\"Electrical Primary Read Only Memory\"],\"oh\":[\"Electrical Programmable Read Only Memory\",\"Erasable Primary Read Only Memory\",\"Erasable Programmable Read Only Memory\",\"Electrical Primary Read Only Memory\"],\"a\":2,\"ee\":\"Erasable Programmable Read Only Memory (erased using UV light).\",\"eh\":\"इरेज़ेबल प्रोग्रामाबल रीड ओनली मेमोरी (UV प्रकाश का उपयोग करके मिटाया जाता है)।\"},{\"n\":24,\"d\":\"\",\"se\":\"<strong>EEPROM</strong> stands for:\",\"sh\":\"<strong>EEPROM</strong> का पूर्ण रूप है:\",\"oe\":[\"Erasable Electrical Programmable Read Only Memory\",\"Electrically Erasable Primary Read Only Memory\",\"Electrical Erasable Primary Read Only Memory\",\"Electrically Erasable Programmable Read Only Memory\"],\"oh\":[\"Erasable Electrical Programmable Read Only Memory\",\"Electrically Erasable Primary Read Only Memory\",\"Electrical Erasable Primary Read Only Memory\",\"Electrically Erasable Programmable Read Only Memory\"],\"a\":3,\"ee\":\"Electrically Erasable Programmable Read Only Memory.\",\"eh\":\"इलेक्ट्रिकली इरेज़ेबल प्रोग्रामाबल रीड ओनली मेमोरी।\"},{\"n\":25,\"d\":\"\",\"se\":\"<strong>Virtual memory</strong> is:\",\"sh\":\"<strong>वर्चुअल मेमोरी (Virtual memory)</strong> क्या है:\",\"oe\":[\"A memory management technique that temporarily uses hard disk space to extend RAM\",\"A physical type of ROM\",\"A type of cache memory\",\"A physical type of RAM\"],\"oh\":[\"एक मेमोरी प्रबंधन तकनीक जो RAM का विस्तार करने के लिए अस्थायी रूप से हार्ड डिस्क स्थान का उपयोग करती है\",\"ROM का एक भौतिक प्रकार\",\"कैश मेमोरी का एक प्रकार\",\"RAM का एक भौतिक प्रकार\"],\"a\":0,\"ee\":\"It uses secondary storage to simulate extra primary memory.\",\"eh\":\"यह अतिरिक्त प्राथमिक मेमोरी को अनुकरण (simulate) करने के लिए सेकेंडरी स्टोरेज का उपयोग करती है।\"},{\"n\":26,\"d\":\"\",\"se\":\"Which of the following is <strong>not</strong> an input device?\",\"sh\":\"निम्नलिखित में से कौन सा <strong>इनपुट डिवाइस नहीं</strong> है?\",\"oe\":[\"Mouse\",\"Monitor\",\"Scanner\",\"Keyboard\"],\"oh\":[\"माउस\",\"मॉनिटर\",\"स्कैनर\",\"कीबोर्ड\"],\"a\":1,\"ee\":\"A monitor displays visual output.\",\"eh\":\"मॉनिटर दृश्य आउटपुट (visual output) प्रदर्शित करता है।\"},{\"n\":27,\"d\":\"\",\"se\":\"Which of the following is <strong>not</strong> an output device?\",\"sh\":\"निम्नलिखित में से कौन सा <strong>आउटपुट डिवाइस नहीं</strong> है?\",\"oe\":[\"Speaker\",\"Printer\",\"Scanner\",\"Monitor\"],\"oh\":[\"स्पीकर\",\"प्रिंटर\",\"स्कैनर\",\"मॉनिटर\"],\"a\":2,\"ee\":\"A scanner captures data, making it an input device.\",\"eh\":\"स्कैनर डेटा कैप्चर करता है, जिससे यह एक इनपुट डिवाइस बन जाता है।\"},{\"n\":28,\"d\":\"\",\"se\":\"A <strong>joystick</strong> is an example of an:\",\"sh\":\"<strong>जॉयस्टिक (Joystick)</strong> किसका उदाहरण है:\",\"oe\":[\"Output device\",\"Storage device\",\"Processing device\",\"Input device\"],\"oh\":[\"आउटपुट डिवाइस\",\"स्टोरेज डिवाइस\",\"प्रोसेसिंग डिवाइस\",\"इनपुट डिवाइस\"],\"a\":3,\"ee\":\"A joystick is an input device primarily used for gaming.\",\"eh\":\"जॉयस्टिक मुख्य रूप से गेमिंग के लिए उपयोग किया जाने वाला एक इनपुट डिवाइस है।\"},{\"n\":29,\"d\":\"\",\"se\":\"A <strong>plotter</strong> is an example of an:\",\"sh\":\"<strong>प्लॉटर (Plotter)</strong> किसका उदाहरण है:\",\"oe\":[\"Output device\",\"Storage device\",\"Input device\",\"Processing device\"],\"oh\":[\"आउटपुट डिवाइस\",\"स्टोरेज डिवाइस\",\"इनपुट डिवाइस\",\"प्रोसेसिंग डिवाइस\"],\"a\":0,\"ee\":\"A plotter is a specialized output device used to print large vector graphics (like architectural blueprints).\",\"eh\":\"प्लॉटर एक विशेष आउटपुट डिवाइस है जिसका उपयोग बड़े वेक्टर ग्राफिक्स (जैसे वास्तुशिल्प ब्लूप्रिंट) को प्रिंट करने के लिए किया जाता है।\"},{\"n\":30,\"d\":\"\",\"se\":\"A <strong>barcode reader</strong> is an example of an:\",\"sh\":\"<strong>बारकोड रीडर (Barcode reader)</strong> किसका उदाहरण है:\",\"oe\":[\"Processing device\",\"Input device\",\"Storage device\",\"Output device\"],\"oh\":[\"प्रोसेसिंग डिवाइस\",\"इनपुट डिवाइस\",\"स्टोरेज डिवाइस\",\"आउटपुट डिवाइस\"],\"a\":1,\"ee\":\"It inputs optical data into the computer.\",\"eh\":\"यह ऑप्टिकल डेटा को कंप्यूटर में इनपुट करता है।\"},{\"n\":31,\"d\":\"\",\"se\":\"A <strong>scanner</strong> is used to convert:\",\"sh\":\"<strong>स्कैनर</strong> का उपयोग किसे परिवर्तित करने के लिए किया जाता है:\",\"oe\":[\"Digital images into physical documents\",\"Video into digital format\",\"Physical documents into digital images/data\",\"Audio into digital format\"],\"oh\":[\"डिजिटल छवियों को भौतिक दस्तावेज़ों में\",\"वीडियो को डिजिटल प्रारूप में\",\"भौतिक दस्तावेज़ों को डिजिटल छवियों/डेटा में\",\"ऑडियो को डिजिटल प्रारूप में\"],\"a\":2,\"ee\":\"Converts physical hard copies into digital files.\",\"eh\":\"भौतिक हार्ड प्रतियों को डिजिटल फ़ाइलों में परिवर्तित करता है।\"},{\"n\":32,\"d\":\"\",\"se\":\"A <strong>printer</strong> is an example of an:\",\"sh\":\"<strong>प्रिंटर</strong> किसका उदाहरण है:\",\"oe\":[\"Processing device\",\"Input device\",\"Storage device\",\"Output device\"],\"oh\":[\"प्रोसेसिंग डिवाइस\",\"इनपुट डिवाइस\",\"स्टोरेज डिवाइस\",\"आउटपुट डिवाइस\"],\"a\":3,\"ee\":\"It provides a hard-copy output of digital files.\",\"eh\":\"यह डिजिटल फ़ाइलों का हार्ड-कॉपी आउटपुट प्रदान करता है।\"},{\"n\":33,\"d\":\"\",\"se\":\"The <strong>resolution</strong> of a printer is measured in:\",\"sh\":\"प्रिंटर का <strong>रेज़ोल्यूशन (resolution)</strong> मापा जाता है:\",\"oe\":[\"DPI\",\"PPI\",\"CPI\",\"SPI\"],\"oh\":[\"DPI में\",\"PPI में\",\"CPI में\",\"SPI में\"],\"a\":0,\"ee\":\"DPI stands for Dots Per Inch.\",\"eh\":\"DPI का मतलब डॉट्स प्रति इंच (Dots Per Inch) है।\"},{\"n\":34,\"d\":\"\",\"se\":\"The <strong>resolution</strong> of a digital display monitor is generally measured in:\",\"sh\":\"डिजिटल डिस्प्ले मॉनिटर का <strong>रेज़ोल्यूशन</strong> आमतौर पर मापा जाता है:\",\"oe\":[\"CPI\",\"PPI (or total pixels)\",\"SPI\",\"DPI\"],\"oh\":[\"CPI में\",\"PPI (या कुल पिक्सल) में\",\"SPI में\",\"DPI में\"],\"a\":1,\"ee\":\"PPI stands for Pixels Per Inch (defining pixel density).\",\"eh\":\"PPI का अर्थ पिक्सल प्रति इंच (Pixels Per Inch) है।\"},{\"n\":35,\"d\":\"\",\"se\":\"A <strong>touch screen</strong> is classified as:\",\"sh\":\"एक <strong>टच स्क्रीन (Touch screen)</strong> को वर्गीकृत किया गया है:\",\"oe\":[\"Both an Input and Output device\",\"Only an Input device\",\"Only an Output device\",\"A Storage device\"],\"oh\":[\"इनपुट और आउटपुट डिवाइस दोनों के रूप में\",\"केवल एक इनपुट डिवाइस के रूप में\",\"केवल एक आउटपुट डिवाइस के रूप में\",\"एक स्टोरेज डिवाइस के रूप में\"],\"a\":0,\"ee\":\"It accepts input (touch) and provides output (display).\",\"eh\":\"यह इनपुट (स्पर्श) स्वीकार करता है और आउटपुट (डिस्प्ले) प्रदान करता है।\"},{\"n\":36,\"d\":\"\",\"se\":\"An <strong>Operating System (OS)</strong> is a type of:\",\"sh\":\"<strong>ऑपरेटिंग सिस्टम (OS)</strong> किसका एक प्रकार है:\",\"oe\":[\"Application software\",\"Utility software\",\"System software\",\"Hardware device\"],\"oh\":[\"एप्लिकेशन सॉफ्टवेयर\",\"उपयोगिता सॉफ्टवेयर (Utility software)\",\"सिस्टम सॉफ्टवेयर (System software)\",\"हार्डवेयर डिवाइस\"],\"a\":2,\"ee\":\"It is system software that manages hardware and software resources.\",\"eh\":\"यह सिस्टम सॉफ्टवेयर है जो हार्डवेयर और सॉफ्टवेयर संसाधनों का प्रबंधन करता है।\"},{\"n\":37,\"d\":\"\",\"se\":\"Which of the following is <strong>not</strong> an Operating System?\",\"sh\":\"निम्नलिखित में से कौन सा <strong>ऑपरेटिंग सिस्टम नहीं</strong> है?\",\"oe\":[\"Linux\",\"Windows\",\"macOS\",\"MS Excel\"],\"oh\":[\"Linux\",\"Windows\",\"macOS\",\"MS Excel\"],\"a\":3,\"ee\":\"MS Excel is an application software.\",\"eh\":\"MS Excel एक एप्लिकेशन सॉफ्टवेयर है।\"},{\"n\":38,\"d\":\"\",\"se\":\"<strong>Windows 11</strong> is an operating system developed by:\",\"sh\":\"<strong>Windows 11</strong> किसके द्वारा विकसित एक ऑपरेटिंग सिस्टम है:\",\"oe\":[\"Microsoft\",\"Linux Foundation\",\"Google\",\"Apple\"],\"oh\":[\"Microsoft\",\"Linux Foundation\",\"Google\",\"Apple\"],\"a\":0,\"ee\":\"Microsoft.\",\"eh\":\"Microsoft।\"},{\"n\":39,\"d\":\"\",\"se\":\"<strong>Linux</strong> is a prime example of an:\",\"sh\":\"<strong>Linux</strong> किसका एक प्रमुख उदाहरण है:\",\"oe\":[\"Proprietary operating system\",\"Open-source operating system\",\"Closed-source operating system\",\"Hybrid operating system\"],\"oh\":[\"मालिकाना (Proprietary) ऑपरेटिंग सिस्टम\",\"ओपन-सोर्स ऑपरेटिंग सिस्टम\",\"क्लोज्ड-सोर्स ऑपरेटिंग सिस्टम\",\"हाइब्रिड ऑपरेटिंग सिस्टम\"],\"a\":1,\"ee\":\"Its source code is freely available to the public.\",\"eh\":\"इसका सोर्स कोड जनता के लिए स्वतंत्र रूप से उपलब्ध है।\"},{\"n\":40,\"d\":\"\",\"se\":\"The <strong>kernel</strong> of an operating system is:\",\"sh\":\"ऑपरेटिंग सिस्टम का <strong>कर्नेल (Kernel)</strong> क्या है:\",\"oe\":[\"A type of application\",\"A hardware component\",\"The core component that manages system resources\",\"The graphical outer layer of the OS\"],\"oh\":[\"एक प्रकार का एप्लिकेशन\",\"एक हार्डवेयर घटक\",\"मूल घटक (core) जो सिस्टम संसाधनों का प्रबंधन करता है\",\"OS की ग्राफिकल बाहरी परत\"],\"a\":2,\"ee\":\"The kernel acts as a bridge between applications and hardware.\",\"eh\":\"कर्नेल अनुप्रयोगों (applications) और हार्डवेयर के बीच एक पुल के रूप में कार्य करता है।\"},{\"n\":41,\"d\":\"\",\"se\":\"<strong>GUI</strong> stands for:\",\"sh\":\"<strong>GUI</strong> का पूर्ण रूप है:\",\"oe\":[\"General Unit Interface\",\"General User Interface\",\"Graphical Unit Interface\",\"Graphical User Interface\"],\"oh\":[\"जनरल यूनिट इंटरफेस\",\"जनरल यूजर इंटरफेस\",\"ग्राफिकल यूनिट इंटरफेस\",\"ग्राफिकल यूजर इंटरफेस (Graphical User Interface)\"],\"a\":3,\"ee\":\"Graphical User Interface (using icons and windows).\",\"eh\":\"ग्राफिकल यूजर इंटरफेस (आइकन और विंडो का उपयोग करके)।\"},{\"n\":42,\"d\":\"\",\"se\":\"<strong>CLI</strong> stands for:\",\"sh\":\"<strong>CLI</strong> का पूर्ण रूप है:\",\"oe\":[\"Command Line Interface\",\"Common Line Interface\",\"Central Line Interface\",\"Command Level Interface\"],\"oh\":[\"कमांड लाइन इंटरफेस (Command Line Interface)\",\"कॉमन लाइन इंटरफेस\",\"सेंट्रल लाइन इंटरफेस\",\"कमांड लेवल इंटरफेस\"],\"a\":0,\"ee\":\"Command Line Interface (interacting via text commands).\",\"eh\":\"कमांड लाइन इंटरफेस (टेक्स्ट कमांड के माध्यम से बातचीत)।\"},{\"n\":43,\"d\":\"\",\"se\":\"<strong>BIOS</strong> stands for:\",\"sh\":\"<strong>BIOS</strong> का पूर्ण रूप है:\",\"oe\":[\"Basic Input Output Software\",\"Basic Input Output System\",\"Basic Input Output Service\",\"Basic Internet Output System\"],\"oh\":[\"बेसिक इनपुट आउटपुट सॉफ्टवेयर\",\"बेसिक इनपुट आउटपुट सिस्टम (Basic Input Output System)\",\"बेसिक इनपुट आउटपुट सर्विस\",\"बेसिक इंटरनेट आउटपुट सिस्टम\"],\"a\":1,\"ee\":\"Basic Input Output System.\",\"eh\":\"बेसिक इनपुट आउटपुट सिस्टम।\"},{\"n\":44,\"d\":\"\",\"se\":\"The primary <strong>function of BIOS</strong> is to:\",\"sh\":\"BIOS का प्राथमिक <strong>कार्य (function)</strong> क्या है:\",\"oe\":[\"Manage user files\",\"Run high-level applications\",\"Boot the computer and initialize hardware\",\"Connect to the internet\"],\"oh\":[\"उपयोगकर्ता फ़ाइलों का प्रबंधन करना\",\"उच्च-स्तरीय एप्लिकेशन चलाना\",\"कंप्यूटर को बूट करना और हार्डवेयर को इनिशियलाइज़ करना\",\"इंटरनेट से जुड़ना\"],\"a\":2,\"ee\":\"It performs the POST (Power-On Self Test) and boots the OS.\",\"eh\":\"यह POST (Power-On Self Test) करता है और OS को बूट करता है।\"},{\"n\":45,\"d\":\"\",\"se\":\"<strong>Multitasking</strong> in an operating system means:\",\"sh\":\"ऑपरेटिंग सिस्टम में <strong>मल्टीटास्किंग (Multitasking)</strong> का अर्थ है:\",\"oe\":[\"Sharing files between programs\",\"Running a single program multiple times\",\"Running only one program\",\"Running multiple programs simultaneously\"],\"oh\":[\"प्रोग्राम के बीच फ़ाइलें साझा करना\",\"एक ही प्रोग्राम को कई बार चलाना\",\"केवल एक प्रोग्राम चलाना\",\"एक साथ कई प्रोग्राम चलाना\"],\"a\":3,\"ee\":\"The ability of an OS to execute multiple tasks/programs at the same time.\",\"eh\":\"एक ही समय में कई कार्यों/प्रोग्रामों को निष्पादित करने की OS की क्षमता।\"},{\"n\":46,\"d\":\"\",\"se\":\"The default <strong>file extension</strong> for a modern Microsoft Word document is:\",\"sh\":\"आधुनिक Microsoft Word दस्तावेज़ के लिए डिफ़ॉल्ट <strong>फ़ाइल एक्सटेंशन</strong> क्या है:\",\"oe\":[\"docx\",\"txt\",\"pptx\",\"xlsx\"],\"oh\":[\"docx\",\"txt\",\"pptx\",\"xlsx\"],\"a\":0,\"ee\":\".docx.\",\"eh\":\".docx।\"},{\"n\":47,\"d\":\"\",\"se\":\"The <strong>shortcut key</strong> to create a new blank document in MS Word is:\",\"sh\":\"MS Word में एक नया खाली दस्तावेज़ (new document) बनाने के लिए <strong>शॉर्टकट की (shortcut key)</strong> है:\",\"oe\":[\"Ctrl + O\",\"Ctrl + N\",\"Ctrl + S\",\"Ctrl + P\"],\"oh\":[\"Ctrl + O\",\"Ctrl + N\",\"Ctrl + S\",\"Ctrl + P\"],\"a\":1,\"ee\":\"Ctrl + N.\",\"eh\":\"Ctrl + N।\"},{\"n\":48,\"d\":\"\",\"se\":\"The <strong>shortcut key</strong> to open an existing document is:\",\"sh\":\"पहले से मौजूद दस्तावेज़ को खोलने (open) के लिए <strong>शॉर्टकट की</strong> है:\",\"oe\":[\"Ctrl + S\",\"Ctrl + N\",\"Ctrl + O\",\"Ctrl + P\"],\"oh\":[\"Ctrl + S\",\"Ctrl + N\",\"Ctrl + O\",\"Ctrl + P\"],\"a\":2,\"ee\":\"Ctrl + O.\",\"eh\":\"Ctrl + O।\"},{\"n\":49,\"d\":\"\",\"se\":\"The <strong>shortcut key</strong> to save a document is:\",\"sh\":\"दस्तावेज़ को सहेजने (save) के लिए <strong>शॉर्टकट की</strong> है:\",\"oe\":[\"Ctrl + O\",\"Ctrl + N\",\"Ctrl + P\",\"Ctrl + S\"],\"oh\":[\"Ctrl + O\",\"Ctrl + N\",\"Ctrl + P\",\"Ctrl + S\"],\"a\":3,\"ee\":\"Ctrl + S.\",\"eh\":\"Ctrl + S।\"},{\"n\":50,\"d\":\"\",\"se\":\"The <strong>shortcut key</strong> to open the print dialog box is:\",\"sh\":\"प्रिंट डायलॉग बॉक्स खोलने के लिए <strong>शॉर्टकट की</strong> है:\",\"oe\":[\"Ctrl + P\",\"Ctrl + N\",\"Ctrl + S\",\"Ctrl + O\"],\"oh\":[\"Ctrl + P\",\"Ctrl + N\",\"Ctrl + S\",\"Ctrl + O\"],\"a\":0,\"ee\":\"Ctrl + P.\",\"eh\":\"Ctrl + P।\"},{\"n\":51,\"d\":\"\",\"se\":\"The <strong>shortcut key</strong> to copy selected text is:\",\"sh\":\"चयनित टेक्स्ट को कॉपी (Copy) करने के लिए <strong>शॉर्टकट की</strong> है:\",\"oe\":[\"Ctrl + V\",\"Ctrl + C\",\"Ctrl + X\",\"Ctrl + Z\"],\"oh\":[\"Ctrl + V\",\"Ctrl + C\",\"Ctrl + X\",\"Ctrl + Z\"],\"a\":1,\"ee\":\"Ctrl + C.\",\"eh\":\"Ctrl + C।\"},{\"n\":52,\"d\":\"\",\"se\":\"The <strong>shortcut key</strong> to paste text is:\",\"sh\":\"टेक्स्ट को पेस्ट (Paste) करने के लिए <strong>शॉर्टकट की</strong> है:\",\"oe\":[\"Ctrl + C\",\"Ctrl + Z\",\"Ctrl + V\",\"Ctrl + X\"],\"oh\":[\"Ctrl + C\",\"Ctrl + Z\",\"Ctrl + V\",\"Ctrl + X\"],\"a\":2,\"ee\":\"Ctrl + V.\",\"eh\":\"Ctrl + V।\"},{\"n\":53,\"d\":\"\",\"se\":\"The <strong>shortcut key</strong> to cut selected text is:\",\"sh\":\"चयनित टेक्स्ट को कट (Cut) करने के लिए <strong>शॉर्टकट की</strong> है:\",\"oe\":[\"Ctrl + C\",\"Ctrl + V\",\"Ctrl + Z\",\"Ctrl + X\"],\"oh\":[\"Ctrl + C\",\"Ctrl + V\",\"Ctrl + Z\",\"Ctrl + X\"],\"a\":3,\"ee\":\"Ctrl + X.\",\"eh\":\"Ctrl + X।\"},{\"n\":54,\"d\":\"\",\"se\":\"The <strong>shortcut key</strong> to undo the last action is:\",\"sh\":\"अंतिम क्रिया को पूर्ववत (Undo) करने के लिए <strong>शॉर्टकट की</strong> है:\",\"oe\":[\"Ctrl + Z\",\"Ctrl + X\",\"Ctrl + V\",\"Ctrl + C\"],\"oh\":[\"Ctrl + Z\",\"Ctrl + X\",\"Ctrl + V\",\"Ctrl + C\"],\"a\":0,\"ee\":\"Ctrl + Z.\",\"eh\":\"Ctrl + Z।\"},{\"n\":55,\"d\":\"\",\"se\":\"<strong>MS Word</strong> is fundamentally a:\",\"sh\":\"<strong>MS Word</strong> मौलिक रूप से एक:\",\"oe\":[\"Database application\",\"Word processing application\",\"Spreadsheet application\",\"Presentation application\"],\"oh\":[\"डेटाबेस एप्लिकेशन है\",\"वर्ड प्रोसेसिंग एप्लिकेशन है\",\"स्प्रेडशीट एप्लिकेशन है\",\"प्रेजेंटेशन एप्लिकेशन है\"],\"a\":1,\"ee\":\"Word processing application.\",\"eh\":\"वर्ड प्रोसेसिंग एप्लिकेशन।\"},{\"n\":56,\"d\":\"\",\"se\":\"The default <strong>file extension</strong> for a modern Microsoft Excel workbook is:\",\"sh\":\"आधुनिक Microsoft Excel वर्कबुक के लिए डिफ़ॉल्ट <strong>फ़ाइल एक्सटेंशन</strong> क्या है:\",\"oe\":[\"pptx\",\"docx\",\"xlsx\",\"txt\"],\"oh\":[\"pptx\",\"docx\",\"xlsx\",\"txt\"],\"a\":2,\"ee\":\".xlsx.\",\"eh\":\".xlsx।\"},{\"n\":57,\"d\":\"\",\"se\":\"The <strong>intersection of a row and a column</strong> in an Excel worksheet is called a:\",\"sh\":\"एक्सेल वर्कशीट में <strong>एक पंक्ति (row) और एक स्तंभ (column) के प्रतिच्छेदन (intersection)</strong> को क्या कहा जाता है:\",\"oe\":[\"Range\",\"Workbook\",\"Worksheet\",\"Cell\"],\"oh\":[\"रेंज\",\"वर्कबुक\",\"वर्कशीट\",\"सेल (Cell)\"],\"a\":3,\"ee\":\"A Cell.\",\"eh\":\"सेल।\"},{\"n\":58,\"d\":\"\",\"se\":\"In an Excel worksheet, the <strong>columns</strong> are labeled vertically with:\",\"sh\":\"एक्सेल वर्कशीट में, <strong>कॉलम (columns)</strong> को लंबवत रूप से किसके द्वारा लेबल किया जाता है:\",\"oe\":[\"Numbers\",\"Letters\",\"Both\",\"Symbols\"],\"oh\":[\"संख्याएँ (Numbers)\",\"अक्षर (Letters)\",\"दोनों\",\"प्रतीक\"],\"a\":1,\"ee\":\"Letters (A, B, C...).\",\"eh\":\"अक्षर (A, B, C...)।\"},{\"n\":59,\"d\":\"\",\"se\":\"In an Excel worksheet, the <strong>rows</strong> are labeled horizontally with:\",\"sh\":\"एक्सेल वर्कशीट में, <strong>पंक्तियों (rows)</strong> को क्षैतिज रूप से किसके द्वारा लेबल किया जाता है:\",\"oe\":[\"Numbers\",\"Letters\",\"Both\",\"Symbols\"],\"oh\":[\"संख्याएँ (Numbers)\",\"अक्षर (Letters)\",\"दोनों\",\"प्रतीक\"],\"a\":0,\"ee\":\"Numbers (1, 2, 3...).\",\"eh\":\"संख्याएँ (1, 2, 3...)।\"},{\"n\":60,\"d\":\"\",\"se\":\"The <strong>function</strong> used to add up a range of cells in Excel is:\",\"sh\":\"एक्सेल में सेलों की एक सीमा (range) को जोड़ने के लिए उपयोग किया जाने वाला <strong>फ़ंक्शन</strong> है:\",\"oe\":[\"SUM\",\"COUNT\",\"MAX\",\"AVERAGE\"],\"oh\":[\"SUM\",\"COUNT\",\"MAX\",\"AVERAGE\"],\"a\":0,\"ee\":\"=SUM().\",\"eh\":\"=SUM()।\"},{\"n\":61,\"d\":\"\",\"se\":\"The <strong>function</strong> used to find the arithmetic mean of a range is:\",\"sh\":\"किसी रेंज का अंकगणितीय माध्य (औसत) ज्ञात करने के लिए उपयोग किया जाने वाला <strong>फ़ंक्शन</strong> है:\",\"oe\":[\"MAX\",\"AVERAGE\",\"COUNT\",\"SUM\"],\"oh\":[\"MAX\",\"AVERAGE\",\"COUNT\",\"SUM\"],\"a\":1,\"ee\":\"=AVERAGE().\",\"eh\":\"=AVERAGE()।\"},{\"n\":62,\"d\":\"\",\"se\":\"The <strong>function</strong> used to count the number of cells that contain numeric values is:\",\"sh\":\"संख्यात्मक मान (numeric values) वाले सेलों की संख्या गिनने के लिए उपयोग किया जाने वाला <strong>फ़ंक्शन</strong> है:\",\"oe\":[\"AVERAGE\",\"MAX\",\"COUNT\",\"SUM\"],\"oh\":[\"AVERAGE\",\"MAX\",\"COUNT\",\"SUM\"],\"a\":2,\"ee\":\"=COUNT(). (COUNTA counts all non-blank cells).\",\"eh\":\"=COUNT()। (COUNTA सभी गैर-रिक्त सेलों को गिनता है)।\"},{\"n\":63,\"d\":\"\",\"se\":\"The <strong>function</strong> used to find the highest value in a given range is:\",\"sh\":\"दी गई रेंज में उच्चतम (highest) मान ज्ञात करने के लिए उपयोग किया जाने वाला <strong>फ़ंक्शन</strong> है:\",\"oe\":[\"MIN\",\"AVERAGE\",\"SUM\",\"MAX\"],\"oh\":[\"MIN\",\"AVERAGE\",\"SUM\",\"MAX\"],\"a\":3,\"ee\":\"=MAX().\",\"eh\":\"=MAX()।\"},{\"n\":64,\"d\":\"\",\"se\":\"The <strong>function</strong> used to find the lowest value in a given range is:\",\"sh\":\"दी गई रेंज में न्यूनतम (lowest) मान ज्ञात करने के लिए उपयोग किया जाने वाला <strong>फ़ंक्शन</strong> है:\",\"oe\":[\"MIN\",\"AVERAGE\",\"MAX\",\"SUM\"],\"oh\":[\"MIN\",\"AVERAGE\",\"MAX\",\"SUM\"],\"a\":0,\"ee\":\"=MIN().\",\"eh\":\"=MIN()।\"},{\"n\":65,\"d\":\"\",\"se\":\"<strong>MS Excel</strong> is fundamentally a:\",\"sh\":\"<strong>MS Excel</strong> मौलिक रूप से एक:\",\"oe\":[\"Word processing application\",\"Spreadsheet application\",\"Presentation application\",\"Database application\"],\"oh\":[\"वर्ड प्रोसेसिंग एप्लिकेशन है\",\"स्प्रेडशीट एप्लिकेशन है\",\"प्रेजेंटेशन एप्लिकेशन है\",\"डेटाबेस एप्लिकेशन है\"],\"a\":1,\"ee\":\"Spreadsheet application.\",\"eh\":\"स्प्रेडशीट एप्लिकेशन।\"},{\"n\":66,\"d\":\"\",\"se\":\"The default <strong>file extension</strong> for a modern Microsoft PowerPoint presentation is:\",\"sh\":\"आधुनिक Microsoft PowerPoint प्रेजेंटेशन के लिए डिफ़ॉल्ट <strong>फ़ाइल एक्सटेंशन</strong> क्या है:\",\"oe\":[\"txt\",\"xlsx\",\"pptx\",\"docx\"],\"oh\":[\"txt\",\"xlsx\",\"pptx\",\"docx\"],\"a\":2,\"ee\":\".pptx.\",\"eh\":\".pptx।\"},{\"n\":67,\"d\":\"\",\"se\":\"The <strong>shortcut key</strong> to start a slideshow from the very beginning is:\",\"sh\":\"बिल्कुल शुरुआत से स्लाइड शो (slideshow) शुरू करने के लिए <strong>शॉर्टकट की</strong> क्या है:\",\"oe\":[\"F9\",\"F7\",\"F3\",\"F5\"],\"oh\":[\"F9\",\"F7\",\"F3\",\"F5\"],\"a\":3,\"ee\":\"F5.\",\"eh\":\"F5।\"},{\"n\":68,\"d\":\"\",\"se\":\"The <strong>shortcut key</strong> to start a slideshow from the current active slide is:\",\"sh\":\"वर्तमान सक्रिय स्लाइड (current slide) से स्लाइड शो शुरू करने के लिए <strong>शॉर्टकट की</strong> है:\",\"oe\":[\"Shift + F5\",\"Alt + F5\",\"F5\",\"Ctrl + F5\"],\"oh\":[\"Shift + F5\",\"Alt + F5\",\"F5\",\"Ctrl + F5\"],\"a\":0,\"ee\":\"Shift + F5.\",\"eh\":\"Shift + F5।\"},{\"n\":69,\"d\":\"\",\"se\":\"A <strong>slide</strong> in PowerPoint represents:\",\"sh\":\"PowerPoint में एक <strong>स्लाइड (slide)</strong> किसका प्रतिनिधित्व करती है:\",\"oe\":[\"A relational database\",\"A single page or screen of a presentation\",\"An entire workbook\",\"A text document\"],\"oh\":[\"एक रिलेशनल डेटाबेस\",\"प्रेजेंटेशन का एक सिंगल पेज या स्क्रीन\",\"एक पूरी वर्कबुक\",\"एक टेक्स्ट दस्तावेज़\"],\"a\":1,\"ee\":\"A single page of a presentation.\",\"eh\":\"प्रेजेंटेशन का एक सिंगल पेज।\"},{\"n\":70,\"d\":\"\",\"se\":\"<strong>MS PowerPoint</strong> is fundamentally a:\",\"sh\":\"<strong>MS PowerPoint</strong> मौलिक रूप से एक:\",\"oe\":[\"Database application\",\"Word processing application\",\"Presentation application\",\"Spreadsheet application\"],\"oh\":[\"डेटाबेस एप्लिकेशन है\",\"वर्ड प्रोसेसिंग एप्लिकेशन है\",\"प्रेजेंटेशन एप्लिकेशन है\",\"स्प्रेडशीट एप्लिकेशन है\"],\"a\":2,\"ee\":\"Presentation application.\",\"eh\":\"प्रेजेंटेशन एप्लिकेशन।\"},{\"n\":71,\"d\":\"\",\"se\":\"In PowerPoint, a <strong>transition</strong> refers to:\",\"sh\":\"पॉवरपॉइंट में, <strong>ट्रांज़िशन (transition)</strong> का तात्पर्य है:\",\"oe\":[\"The formatting of fonts\",\"The animation of objects within a slide\",\"The animation of individual text blocks\",\"The visual effect applied when moving from one slide to the next\"],\"oh\":[\"फ़ॉन्ट की फ़ॉर्मेटिंग\",\"स्लाइड के भीतर वस्तुओं का एनिमेशन\",\"व्यक्तिगत टेक्स्ट ब्लॉक का एनिमेशन\",\"एक स्लाइड से दूसरी स्लाइड पर जाने पर लागू दृश्य प्रभाव (visual effect)\"],\"a\":3,\"ee\":\"Effect between slides.\",\"eh\":\"स्लाइड के बीच प्रभाव।\"},{\"n\":72,\"d\":\"\",\"se\":\"In PowerPoint, <strong>animation</strong> refers to:\",\"sh\":\"पॉवरपॉइंट में, <strong>एनिमेशन (animation)</strong> का तात्पर्य है:\",\"oe\":[\"The visual effect applied to individual text/objects within a single slide\",\"The effect applied when moving between slides\",\"The slide master template\",\"The background design\"],\"oh\":[\"एक ही स्लाइड के भीतर व्यक्तिगत टेक्स्ट/वस्तुओं पर लागू दृश्य प्रभाव\",\"स्लाइड के बीच लागू प्रभाव\",\"स्लाइड मास्टर टेम्पलेट\",\"पृष्ठभूमि डिजाइन\"],\"a\":0,\"ee\":\"Effect on elements within a slide.\",\"eh\":\"एक स्लाइड के भीतर तत्वों पर प्रभाव।\"},{\"n\":73,\"d\":\"\",\"se\":\"A <strong>theme</strong> in PowerPoint is:\",\"sh\":\"पॉवरपॉइंट में एक <strong>थीम (theme)</strong> क्या है:\",\"oe\":[\"A type of slide layout\",\"A predefined set of colors, fonts, and visual effects\",\"A specific type of animation\",\"A specific type of transition\"],\"oh\":[\"एक प्रकार का स्लाइड लेआउट\",\"रंग, फ़ॉन्ट और दृश्य प्रभावों का पूर्व-निर्धारित सेट\",\"एक विशिष्ट प्रकार का एनिमेशन\",\"एक विशिष्ट प्रकार का ट्रांज़िशन\"],\"a\":1,\"ee\":\"A predefined visual design package.\",\"eh\":\"एक पूर्व-निर्धारित दृश्य डिज़ाइन पैकेज।\"},{\"n\":74,\"d\":\"\",\"se\":\"<strong>MS Access</strong> is fundamentally a:\",\"sh\":\"<strong>MS Access</strong> मौलिक रूप से एक:\",\"oe\":[\"Spreadsheet application\",\"Presentation application\",\"Relational Database Management System (RDBMS) application\",\"Word processing application\"],\"oh\":[\"स्प्रेडशीट एप्लिकेशन है\",\"प्रेजेंटेशन एप्लिकेशन है\",\"रिलेशनल डेटाबेस मैनेजमेंट सिस्टम (RDBMS) एप्लिकेशन है\",\"वर्ड प्रोसेसिंग एप्लिकेशन है\"],\"a\":2,\"ee\":\"Database application.\",\"eh\":\"डेटाबेस एप्लिकेशन।\"},{\"n\":75,\"d\":\"\",\"se\":\"A <strong>table</strong> in MS Access is defined as:\",\"sh\":\"MS Access में <strong>टेबल (table)</strong> को किस रूप में परिभाषित किया गया है:\",\"oe\":[\"A graphical user interface\",\"A command to extract data\",\"A printable report\",\"A collection of related data organized logically in rows and columns\"],\"oh\":[\"एक ग्राफिकल यूजर इंटरफेस\",\"डेटा निकालने का एक कमांड\",\"एक प्रिंट करने योग्य रिपोर्ट\",\"पंक्तियों (rows) और स्तंभों (columns) में तार्किक रूप से व्यवस्थित संबंधित डेटा का एक संग्रह\"],\"a\":3,\"ee\":\"A core database object storing data in rows and columns.\",\"eh\":\"एक मुख्य डेटाबेस ऑब्जेक्ट जो पंक्तियों और स्तंभों में डेटा संग्रहीत करता है।\"},{\"n\":76,\"d\":\"\",\"se\":\"A <strong>query</strong> in MS Access is used to:\",\"sh\":\"MS Access में एक <strong>क्वेरी (query)</strong> का उपयोग किया जाता है:\",\"oe\":[\"Retrieve, filter, and display specific data based on conditions/criteria\",\"Input data into a table\",\"Change the background color\",\"Print data to paper\"],\"oh\":[\"शर्तों/मानदंडों के आधार पर विशिष्ट डेटा को पुनः प्राप्त करने, फ़िल्टर करने और प्रदर्शित करने के लिए\",\"एक तालिका में डेटा इनपुट करने के लिए\",\"पृष्ठभूमि का रंग बदलने के लिए\",\"कागज पर डेटा प्रिंट करने के लिए\"],\"a\":0,\"ee\":\"To extract specific data from tables.\",\"eh\":\"तालिकाओं से विशिष्ट डेटा निकालने के लिए।\"},{\"n\":77,\"d\":\"\",\"se\":\"A <strong>form</strong> in MS Access is primarily used to:\",\"sh\":\"MS Access में एक <strong>फॉर्म (form)</strong> का मुख्य रूप से उपयोग किया जाता है:\",\"oe\":[\"Perform complex calculations\",\"Enter, modify, and view records in a user-friendly layout\",\"Create new databases\",\"Print structured documents\"],\"oh\":[\"जटिल गणना करने के लिए\",\"उपयोगकर्ता के अनुकूल लेआउट में रिकॉर्ड दर्ज करने, संशोधित करने और देखने के लिए\",\"नए डेटाबेस बनाने के लिए\",\"संरचित दस्तावेज़ प्रिंट करने के लिए\"],\"a\":1,\"ee\":\"A graphical interface for data entry.\",\"eh\":\"डेटा प्रविष्टि के लिए एक ग्राफिकल इंटरफ़ेस।\"},{\"n\":78,\"d\":\"\",\"se\":\"A <strong>report</strong> in MS Access is primarily used to:\",\"sh\":\"MS Access में एक <strong>रिपोर्ट (report)</strong> का मुख्य रूप से उपयोग किया जाता है:\",\"oe\":[\"Analyze database security\",\"Enter new data\",\"Format, summarize, and print data in an organized way\",\"Retrieve raw data arrays\"],\"oh\":[\"डेटाबेस सुरक्षा का विश्लेषण करने के लिए\",\"नया डेटा दर्ज करने के लिए\",\"डेटा को व्यवस्थित तरीके से स्वरूपित, सारांशित और प्रिंट करने के लिए\",\"कच्चे डेटा सरणियों को पुनः प्राप्त करने के लिए\"],\"a\":2,\"ee\":\"For creating printable outputs of database information.\",\"eh\":\"डेटाबेस जानकारी के मुद्रण योग्य आउटपुट (printable outputs) बनाने के लिए।\"},{\"n\":79,\"d\":\"\",\"se\":\"The full form of <strong>IP</strong> is:\",\"sh\":\"<strong>IP</strong> का पूर्ण रूप है:\",\"oe\":[\"Internal Protocol\",\"Internal Program\",\"Internet Program\",\"Internet Protocol\"],\"oh\":[\"इंटरनल प्रोटोकॉल\",\"इंटरनल प्रोग्राम\",\"इंटरनेट प्रोग्राम\",\"इंटरनेट प्रोटोकॉल (Internet Protocol)\"],\"a\":3,\"ee\":\"Internet Protocol.\",\"eh\":\"इंटरनेट प्रोटोकॉल।\"},{\"n\":80,\"d\":\"\",\"se\":\"The full form of <strong>TCP</strong> is:\",\"sh\":\"<strong>TCP</strong> का पूर्ण रूप है:\",\"oe\":[\"Transmission Control Protocol\",\"Transfer Control Protocol\",\"Transmission Communication Protocol\",\"Transfer Communication Protocol\"],\"oh\":[\"ट्रांसमिशन कंट्रोल प्रोटोकॉल (Transmission Control Protocol)\",\"ट्रांसफर कंट्रोल प्रोटोकॉल\",\"ट्रांसमिशन कम्युनिकेशन प्रोटोकॉल\",\"ट्रांसफर कम्युनिकेशन प्रोटोकॉल\"],\"a\":0,\"ee\":\"Transmission Control Protocol.\",\"eh\":\"ट्रांसमिशन कंट्रोल प्रोटोकॉल।\"},{\"n\":81,\"d\":\"\",\"se\":\"The full form of <strong>HTTP</strong> is:\",\"sh\":\"<strong>HTTP</strong> का पूर्ण रूप है:\",\"oe\":[\"HyperText Transfer Program\",\"HyperText Transfer Protocol\",\"HyperText Transport Protocol\",\"HyperText Transport Program\"],\"oh\":[\"हाइपरटेक्स्ट ट्रांसफर प्रोग्राम\",\"हाइपरटेक्स्ट ट्रांसफर प्रोटोकॉल (HyperText Transfer Protocol)\",\"हाइपरटेक्स्ट ट्रांसपोर्ट प्रोटोकॉल\",\"हाइपरटेक्स्ट ट्रांसपोर्ट प्रोग्राम\"],\"a\":1,\"ee\":\"HyperText Transfer Protocol.\",\"eh\":\"हाइपरटेक्स्ट ट्रांसफर प्रोटोकॉल।\"},{\"n\":82,\"d\":\"\",\"se\":\"The full form of <strong>HTTPS</strong> is:\",\"sh\":\"<strong>HTTPS</strong> का पूर्ण रूप है:\",\"oe\":[\"HyperText Transfer Protocol Software\",\"HyperText Transfer Protocol System\",\"HyperText Transfer Protocol Secure\",\"HyperText Transfer Protocol Service\"],\"oh\":[\"हाइपरटेक्स्ट ट्रांसफर प्रोटोकॉल सॉफ्टवेयर\",\"हाइपरटेक्स्ट ट्रांसफर प्रोटोकॉल सिस्टम\",\"हाइपरटेक्स्ट ट्रांसफर प्रोटोकॉल सिक्योर (Secure)\",\"हाइपरटेक्स्ट ट्रांसफर प्रोटोकॉल सर्विस\"],\"a\":2,\"ee\":\"HyperText Transfer Protocol Secure.\",\"eh\":\"हाइपरटेक्स्ट ट्रांसफर प्रोटोकॉल सिक्योर।\"},{\"n\":83,\"d\":\"\",\"se\":\"The full form of <strong>FTP</strong> is:\",\"sh\":\"<strong>FTP</strong> का पूर्ण रूप है:\",\"oe\":[\"File Transport Protocol\",\"File Transmission Protocol\",\"File Transfer Program\",\"File Transfer Protocol\"],\"oh\":[\"फाइल ट्रांसपोर्ट प्रोटोकॉल\",\"फाइल ट्रांसमिशन प्रोटोकॉल\",\"फाइल ट्रांसफर प्रोग्राम\",\"फाइल ट्रांसफर प्रोटोकॉल (File Transfer Protocol)\"],\"a\":3,\"ee\":\"File Transfer Protocol.\",\"eh\":\"फाइल ट्रांसफर प्रोटोकॉल।\"},{\"n\":84,\"d\":\"\",\"se\":\"The full form of <strong>SMTP</strong> (used in emails) is:\",\"sh\":\"ईमेल में प्रयुक्त होने वाले <strong>SMTP</strong> का पूर्ण रूप है:\",\"oe\":[\"Simple Mail Transfer Protocol\",\"Simple Mail Transfer Program\",\"Simple Mail Transport Protocol\",\"Simple Mail Transmission Protocol\"],\"oh\":[\"सिंपल मेल ट्रांसफर प्रोटोकॉल (Simple Mail Transfer Protocol)\",\"सिंपल मेल ट्रांसफर प्रोग्राम\",\"सिंपल मेल ट्रांसपोर्ट प्रोटोकॉल\",\"सिंपल मेल ट्रांसमिशन प्रोटोकॉल\"],\"a\":0,\"ee\":\"Simple Mail Transfer Protocol.\",\"eh\":\"सिंपल मेल ट्रांसफर प्रोटोकॉल।\"},{\"n\":85,\"d\":\"\",\"se\":\"In networking, <strong>LAN</strong> stands for:\",\"sh\":\"नेटवर्किंग में, <strong>LAN</strong> का अर्थ है:\",\"oe\":[\"Long Area Network\",\"Local Area Network\",\"Large Area Network\",\"Logical Area Network\"],\"oh\":[\"लॉन्ग एरिया नेटवर्क\",\"लोकल एरिया नेटवर्क (Local Area Network)\",\"लार्ज एरिया नेटवर्क\",\"लॉजिकल एरिया नेटवर्क\"],\"a\":1,\"ee\":\"Local Area Network.\",\"eh\":\"लोकल एरिया नेटवर्क।\"},{\"n\":86,\"d\":\"\",\"se\":\"<strong>WAN</strong> stands for:\",\"sh\":\"<strong>WAN</strong> का अर्थ है:\",\"oe\":[\"World Area Network\",\"Web Area Network\",\"Wide Area Network\",\"Wireless Area Network\"],\"oh\":[\"वर्ल्ड एरिया नेटवर्क\",\"वेब एरिया नेटवर्क\",\"वाइड एरिया नेटवर्क (Wide Area Network)\",\"वायरलेस एरिया नेटवर्क\"],\"a\":2,\"ee\":\"Wide Area Network.\",\"eh\":\"वाइड एरिया नेटवर्क।\"},{\"n\":87,\"d\":\"\",\"se\":\"<strong>MAN</strong> stands for:\",\"sh\":\"<strong>MAN</strong> का अर्थ है:\",\"oe\":[\"Major Area Network\",\"Main Area Network\",\"Medium Area Network\",\"Metropolitan Area Network\"],\"oh\":[\"मेजर एरिया नेटवर्क\",\"मेन एरिया नेटवर्क\",\"मीडियम एरिया नेटवर्क\",\"मेट्रोपॉलिटन एरिया नेटवर्क (Metropolitan Area Network)\"],\"a\":3,\"ee\":\"Metropolitan Area Network.\",\"eh\":\"मेट्रोपॉलिटन एरिया नेटवर्क।\"},{\"n\":88,\"d\":\"\",\"se\":\"A <strong>Modem</strong> is primarily used to:\",\"sh\":\"एक <strong>मोडेम (Modem)</strong> का मुख्य रूप से उपयोग किया जाता है:\",\"oe\":[\"Convert digital signals to analog signals over phone lines and vice versa (Modulate/Demodulate)\",\"Act as a server\",\"Store internet data permanently\",\"Run antivirus scans\"],\"oh\":[\"फोन लाइनों पर डिजिटल संकेतों को एनालॉग संकेतों में बदलने और इसके विपरीत (Modulate/Demodulate) के लिए\",\"सर्वर के रूप में कार्य करने के लिए\",\"इंटरनेट डेटा को स्थायी रूप से संग्रहीत करने के लिए\",\"एंटीवायरस स्कैन चलाने के लिए\"],\"a\":0,\"ee\":\"Convert digital/analog signals.\",\"eh\":\"डिजिटल/एनालॉग संकेतों को परिवर्तित करने के लिए।\"},{\"n\":89,\"d\":\"\",\"se\":\"A <strong>Router</strong> is primarily used to:\",\"sh\":\"एक <strong>राउटर (Router)</strong> का मुख्य रूप से उपयोग किया जाता है:\",\"oe\":[\"Store local data\",\"Connect different networks together and route data packets between them\",\"Convert analog signals\",\"Power up the computer\"],\"oh\":[\"स्थानीय डेटा संग्रहीत करने के लिए\",\"विभिन्न नेटवर्क को एक साथ जोड़ने और उनके बीच डेटा पैकेट रूट करने के लिए\",\"एनालॉग सिग्नल बदलने के लिए\",\"कंप्यूटर को चालू करने के लिए\"],\"a\":1,\"ee\":\"Connect networks and route data.\",\"eh\":\"नेटवर्क कनेक्ट करने और डेटा को रूट करने के लिए।\"},{\"n\":90,\"d\":\"\",\"se\":\"The <strong>World Wide Web (WWW)</strong> was invented by:\",\"sh\":\"<strong>वर्ल्ड वाइड वेब (WWW)</strong> का आविष्कार किसके द्वारा किया गया था:\",\"oe\":[\"Mark Zuckerberg\",\"Steve Jobs\",\"Tim Berners-Lee\",\"Bill Gates\"],\"oh\":[\"मार्क जुकरबर्ग\",\"स्टीव जॉब्स\",\"टिम बर्नर्स-ली (Tim Berners-Lee)\",\"बिल गेट्स\"],\"a\":2,\"ee\":\"Tim Berners-Lee in 1989.\",\"eh\":\"1989 में टिम बर्नर्स-ली द्वारा।\"},{\"n\":91,\"d\":\"\",\"se\":\"A <strong>Computer Virus</strong> is fundamentally a:\",\"sh\":\"एक <strong>कंप्यूटर वायरस</strong> मौलिक रूप से क्या है:\",\"oe\":[\"Hardware component failure\",\"Type of protective firmware\",\"Network error\",\"Malicious software program designed to alter computer operations\"],\"oh\":[\"हार्डवेयर घटक विफलता\",\"एक प्रकार का सुरक्षात्मक फर्मवेयर\",\"नेटवर्क त्रुटि\",\"दुर्भावनापूर्ण सॉफ़्टवेयर प्रोग्राम जो कंप्यूटर संचालन को बदलने के लिए डिज़ाइन किया गया है (Malicious software)\"],\"a\":3,\"ee\":\"Malicious software.\",\"eh\":\"दुर्भावनापूर्ण सॉफ़्टवेयर (Malicious software)।\"},{\"n\":92,\"d\":\"\",\"se\":\"<strong>Antivirus software</strong> is utility software primarily used to:\",\"sh\":\"<strong>एंटीवायरस सॉफ़्टवेयर</strong> एक उपयोगिता सॉफ़्टवेयर है जिसका मुख्य रूप से उपयोग किया जाता है:\",\"oe\":[\"Detect, prevent, and remove malware/viruses\",\"Establish internet connections\",\"Enhance CPU clock speed\",\"Format hard drives\"],\"oh\":[\"मैलवेयर/वायरस का पता लगाने, रोकने और हटाने के लिए\",\"इंटरनेट कनेक्शन स्थापित करने के लिए\",\"CPU घड़ी की गति बढ़ाने के लिए\",\"हार्ड ड्राइव को फॉर्मेट करने के लिए\"],\"a\":0,\"ee\":\"Detect and remove viruses.\",\"eh\":\"वायरस का पता लगाने और उसे हटाने के लिए।\"},{\"n\":93,\"d\":\"\",\"se\":\"<strong>Phishing</strong> is a type of:\",\"sh\":\"<strong>फ़िशिंग (Phishing)</strong> किसका एक प्रकार है:\",\"oe\":[\"Legitimate software update\",\"Cyber attack involving fraudulent communications to steal sensitive personal information\",\"Network speed throttling technique\",\"Hardware physical attack\"],\"oh\":[\"वैध सॉफ्टवेयर अद्यतन\",\"साइबर हमला जिसमें संवेदनशील व्यक्तिगत जानकारी चुराने के लिए धोखाधड़ी संचार शामिल है\",\"नेटवर्क गति थ्रॉटलिंग तकनीक\",\"हार्डवेयर भौतिक हमला\"],\"a\":1,\"ee\":\"Cyber attack to steal data like passwords and credit card numbers.\",\"eh\":\"पासवर्ड और क्रेडिट कार्ड नंबर जैसे डेटा चुराने के लिए साइबर हमला।\"},{\"n\":94,\"d\":\"\",\"se\":\"<strong>Spyware</strong> is a type of malicious software that:\",\"sh\":\"<strong>स्पाईवेयर (Spyware)</strong> एक प्रकार का दुर्भावनापूर्ण सॉफ़्टवेयर है जो:\",\"oe\":[\"Protects the system from viruses\",\"Encrypts files for security\",\"Secretly monitors and gathers information about a user's activity without their consent\",\"Improves overall RAM performance\"],\"oh\":[\"सिस्टम को वायरस से बचाता है\",\"सुरक्षा के लिए फ़ाइलों को एन्क्रिप्ट करता है\",\"उपयोगकर्ता की सहमति के बिना उसकी गतिविधि की गुप्त रूप से निगरानी करता है और जानकारी एकत्र करता है\",\"समग्र RAM प्रदर्शन में सुधार करता है\"],\"a\":2,\"ee\":\"Monitors user activity secretly.\",\"eh\":\"गुप्त रूप से उपयोगकर्ता की गतिविधि पर नज़र रखता है।\"},{\"n\":95,\"d\":\"\",\"se\":\"The term <strong>Malware</strong> is a portmanteau that stands for:\",\"sh\":\"<strong>मैलवेयर (Malware)</strong> शब्द किसका संक्षिप्त रूप है:\",\"oe\":[\"Managed Software\",\"Manual Software\",\"Malformed Software\",\"Malicious Software\"],\"oh\":[\"प्रबंधित सॉफ़्टवेयर\",\"मैन्युअल सॉफ़्टवेयर\",\"विकृत सॉफ़्टवेयर\",\"दुर्भावनापूर्ण सॉफ़्टवेयर (Malicious Software)\"],\"a\":3,\"ee\":\"Malicious Software.\",\"eh\":\"मैलिशियस सॉफ्टवेयर (Malicious Software)।\"},{\"n\":96,\"d\":\"\",\"se\":\"A <strong>Firewall</strong> in computer networking is used to:\",\"sh\":\"कंप्यूटर नेटवर्किंग में <strong>फ़ायरवॉल (Firewall)</strong> का उपयोग किसके लिए किया जाता है:\",\"oe\":[\"Monitor and filter incoming and outgoing network traffic to protect from unauthorized access\",\"Recover permanently deleted files\",\"Physically cool down the server room\",\"Increase internet download speeds\"],\"oh\":[\"अनधिकृत पहुँच (unauthorized access) से बचाने के लिए आने वाले और जाने वाले नेटवर्क ट्रैफ़िक की निगरानी और फ़िल्टर करने के लिए\",\"स्थायी रूप से हटाए गए फ़ाइलों को पुनर्प्राप्त करने के लिए\",\"सर्वर कक्ष को भौतिक रूप से ठंडा करने के लिए\",\"इंटरनेट डाउनलोड गति बढ़ाने के लिए\"],\"a\":0,\"ee\":\"Protect the network from unauthorized access.\",\"eh\":\"नेटवर्क को अनधिकृत पहुँच से बचाने के लिए।\"},{\"n\":97,\"d\":\"\",\"se\":\"<strong>Ransomware</strong> is a specific type of malware that:\",\"sh\":\"<strong>रैंसमवेयर (Ransomware)</strong> एक विशिष्ट प्रकार का मैलवेयर है जो:\",\"oe\":[\"Speeds up the computer to overheat it\",\"Encrypts/locks a victim's files and demands a financial payment to restore access\",\"Permanently physically destroys the hard drive\",\"Only displays unwanted pop-up ads\"],\"oh\":[\"कंप्यूटर को ज़्यादा गरम करने के लिए गति देता है\",\"पीड़ित की फ़ाइलों को एन्क्रिप्ट/लॉक करता है और पहुंच बहाल करने के लिए वित्तीय भुगतान (फिरौती) की मांग करता है\",\"हार्ड ड्राइव को स्थायी रूप से भौतिक रूप से नष्ट कर देता है\",\"केवल अवांछित पॉप-अप विज्ञापन प्रदर्शित करता है\"],\"a\":1,\"ee\":\"Locks files and demands ransom.\",\"eh\":\"फ़ाइलों को लॉक करता है और फिरौती मांगता है।\"},{\"n\":98,\"d\":\"\",\"se\":\"In a Windows operating system, the <strong>shortcut key</strong> combination to quickly lock the computer profile is:\",\"sh\":\"Windows ऑपरेटिंग सिस्टम में, कंप्यूटर प्रोफ़ाइल को तुरंत लॉक (lock) करने के लिए <strong>शॉर्टकट की</strong> संयोजन है:\",\"oe\":[\"Windows Key + D\",\"Windows Key + I\",\"Windows Key + L\",\"Windows Key + E\"],\"oh\":[\"Windows Key + D\",\"Windows Key + I\",\"Windows Key + L\",\"Windows Key + E\"],\"a\":2,\"ee\":\"Windows + L (Lock).\",\"eh\":\"Windows + L (Lock)।\"},{\"n\":99,\"d\":\"\",\"se\":\"The direct <strong>shortcut key</strong> combination to open the Windows Task Manager is:\",\"sh\":\"Windows Task Manager (टास्क मैनेजर) खोलने के लिए प्रत्यक्ष <strong>शॉर्टकट की</strong> संयोजन है:\",\"oe\":[\"Windows Key + X\",\"Ctrl + Esc\",\"Ctrl + Alt + Del\",\"Ctrl + Shift + Esc\"],\"oh\":[\"Windows Key + X\",\"Ctrl + Esc\",\"Ctrl + Alt + Del\",\"Ctrl + Shift + Esc\"],\"a\":3,\"ee\":\"Ctrl + Shift + Esc opens it directly (Ctrl + Alt + Del opens a security screen first).\",\"eh\":\"Ctrl + Shift + Esc सीधे टास्क मैनेजर खोलता है।\"},{\"n\":100,\"d\":\"\",\"se\":\"The <strong>shortcut key</strong> to quickly launch File Explorer in Windows is:\",\"sh\":\"Windows में फ़ाइल एक्सप्लोरर (File Explorer) को तुरंत लॉन्च करने के लिए <strong>शॉर्टकट की</strong> है:\",\"oe\":[\"Windows Key + E\",\"Windows Key + D\",\"Windows Key + L\",\"Windows Key + I\"],\"oh\":[\"Windows Key + E\",\"Windows Key + D\",\"Windows Key + L\",\"Windows Key + I\"],\"a\":0,\"ee\":\"Windows Key + E (Explorer).\",\"eh\":\"Windows Key + E (Explorer)।\"}]}]");
const HP_BUILTIN=JSON.parse("[{\"id\":\"ahp1\",\"num\":1,\"name\":\"High Probability Paper 1\",\"sub\":\"100 questions · 100 bilingual\",\"q\":[{\"n\":1,\"d\":\"\",\"se\":\"Which of the following is a <strong>real account</strong>?\",\"sh\":\"निम्नलिखित में से कौन सा एक <strong>वास्तविक खाता (Real Account)</strong> है?\",\"oe\":[\"Machinery A/c\",\"Debtors A/c\",\"Capital A/c\",\"Rent A/c\"],\"oh\":[\"मशीनरी खाता (Machinery A/c)\",\"देनदार खाता (Debtors A/c)\",\"पूंजी खाता (Capital A/c)\",\"किराया खाता (Rent A/c)\"],\"a\":0,\"ee\":\"Real accounts represent tangible and intangible assets (e.g., Machinery).\",\"eh\":\"वास्तविक खाते मूर्त और अमूर्त संपत्तियों (जैसे मशीनरी) का प्रतिनिधित्व करते हैं।\"},{\"n\":2,\"d\":\"\",\"se\":\"In the accounting equation, if assets increase by ₹10,000 and liabilities decrease by ₹5,000, owner&rsquo;s equity will:\",\"sh\":\"लेखांकन समीकरण में, यदि संपत्तियों में ₹10,000 की वृद्धि होती है और देयताओं में ₹5,000 की कमी होती है, तो मालिक की इक्विटी (Owner's Equity) में क्या होगा:\",\"oe\":[\"Increase by ₹5,000\",\"Increase by ₹15,000\",\"Decrease by ₹15,000\",\"Decrease by ₹5,000\"],\"oh\":[\"₹5,000 की वृद्धि\",\"₹15,000 की वृद्धि\",\"₹15,000 की कमी\",\"₹5,000 की कमी\"],\"a\":1,\"ee\":\"Assets = Liabilities + Equity → +10,000 = –5,000 + ΔEquity → ΔEquity = +15,000.\",\"eh\":\"संपत्तियाँ = देयताएं + इक्विटी → +10,000 = -5,000 + Δइक्विटी → Δइक्विटी = +15,000।\"},{\"n\":3,\"d\":\"\",\"se\":\"A purchase return of goods to a supplier will be recorded in the:\",\"sh\":\"आपूर्तिकर्ता को माल की वापसी (Purchase Return) किसमें दर्ज की जाएगी:\",\"oe\":[\"Purchase Book\",\"Journal Proper\",\"Purchase Returns Book\",\"Cash Book\"],\"oh\":[\"क्रय बही (Purchase Book)\",\"मुख्य रोजनामचा (Journal Proper)\",\"क्रय वापसी बही (Purchase Returns Book)\",\"रोकड़ बही (Cash Book)\"],\"a\":2,\"ee\":\"All returns outward (to suppliers) are recorded in the Purchase Returns Book.\",\"eh\":\"बाहर की ओर वापसी (क्रय वापसी) हमेशा क्रय वापसी बही में दर्ज होती है।\"},{\"n\":4,\"d\":\"\",\"se\":\"The discount allowed to customers for prompt or early payment is called:\",\"sh\":\"त्वरित या शीघ्र भुगतान के लिए ग्राहकों को दी जाने वाली छूट क्या कहलाती है?\",\"oe\":[\"Quantity discount\",\"Trade discount\",\"Seasonal discount\",\"Cash discount\"],\"oh\":[\"मात्रा छूट (Quantity discount)\",\"व्यापारिक छूट (Trade discount)\",\"मौसमी छूट (Seasonal discount)\",\"नकद छूट (Cash discount)\"],\"a\":3,\"ee\":\"Cash discount is offered specifically to encourage early settlement of dues.\",\"eh\":\"नकद छूट मुख्य रूप से शीघ्र भुगतान प्राप्त करने के लिए दी जाती है।\"},{\"n\":5,\"d\":\"\",\"se\":\"Which of the following errors is <strong>not</strong> disclosed by a trial balance?\",\"sh\":\"तलपट (Trial Balance) द्वारा निम्नलिखित में से कौन सी अशुद्धि प्रकट <strong>नहीं</strong> होती है?\",\"oe\":[\"Complete omission of a transaction from the books\",\"Posting a wrong amount in a ledger\",\"Wrong totalling of a ledger account\",\"Posting an amount to the wrong side\"],\"oh\":[\"पुस्तकों से किसी लेन-देन के छूट जाने की पूर्ण भूल (Complete Omission)\",\"खाता बही में गलत राशि दर्ज करना\",\"खाता बही के योग में गलती\",\"गलत पक्ष में खतौनी (Posting) करना\"],\"a\":0,\"ee\":\"An error of complete omission leaves debits and credits equal, so the trial balance still agrees.\",\"eh\":\"लेन-देन पूर्णतः छूट जाने पर डेबिट और क्रेडिट दोनों पक्ष प्रभावित नहीं होते, अतः तलपट मिल जाता है।\"},{\"n\":6,\"d\":\"\",\"se\":\"The balance on the debit side of a cash book indicates:\",\"sh\":\"रोकड़ बही (Cash Book) के डेबिट पक्ष का शेष क्या दर्शाता है?\",\"oe\":[\"Bank overdraft\",\"Cash in hand\",\"Sundry Creditors\",\"Net profit\"],\"oh\":[\"बैंक ओवरड्राफ्ट\",\"हाथ में रोकड़ (Cash in hand)\",\"विविध लेनदार\",\"शुद्ध लाभ\"],\"a\":1,\"ee\":\"A debit balance in the cash book represents positive cash in hand.\",\"eh\":\"रोकड़ बही का डेबिट शेष सकारात्मक नकद राशि (हाथ में रोकड़) को दर्शाता है।\"},{\"n\":7,\"d\":\"\",\"se\":\"Outstanding expenses are shown in the balance sheet as a:\",\"sh\":\"अदत्त व्यय (Outstanding expenses) को बैलेंस शीट में किस रूप में दिखाया जाता है:\",\"oe\":[\"Current Asset\",\"Fixed Asset\",\"Current Liability\",\"Deferred Revenue Expenditure\"],\"oh\":[\"चालू संपत्ति (Current Asset)\",\"स्थायी संपत्ति (Fixed Asset)\",\"चालू दायित्व (Current Liability)\",\"आस्थगित राजस्व व्यय\"],\"a\":2,\"ee\":\"Outstanding expenses are dues payable in the short term, hence current liabilities.\",\"eh\":\"अदत्त व्यय अल्पकाल में चुकाए जाने वाले दायित्व हैं, इसलिए ये चालू दायित्व हैं।\"},{\"n\":8,\"d\":\"\",\"se\":\"Depreciation is primarily a process of:\",\"sh\":\"मूल्यह्रास (Depreciation) मुख्य रूप से किसकी प्रक्रिया है?\",\"oe\":[\"Appreciation\",\"Valuation\",\"Depletion\",\"Allocation\"],\"oh\":[\"मूल्यवृद्धि (Appreciation)\",\"मूल्यांकन (Valuation)\",\"रिक्तिकरण (Depletion)\",\"आवंटन (Allocation)\"],\"a\":3,\"ee\":\"Depreciation is the allocation of the cost of an asset over its estimated useful life.\",\"eh\":\"मूल्यह्रास किसी संपत्ति के अनुमानित उपयोगी जीवन पर उसकी लागत के आवंटन की प्रक्रिया है।\"},{\"n\":9,\"d\":\"\",\"se\":\"If gross profit is ₹80,000, operating expenses ₹25,000, and non‑operating income ₹5,000, the net profit is:\",\"sh\":\"यदि सकल लाभ (Gross profit) ₹80,000 है, परिचालन व्यय ₹25,000 है, और गैर-परिचालन आय ₹5,000 है, तो शुद्ध लाभ (Net profit) है:\",\"oe\":[\"₹60,000\",\"₹65,000\",\"₹55,000\",\"₹50,000\"],\"oh\":[\"₹60,000\",\"₹65,000\",\"₹55,000\",\"₹50,000\"],\"a\":0,\"ee\":\"Net Profit = Gross Profit – Operating Expenses + Non‑operating Income = 80,000 – 25,000 + 5,000 = ₹60,000.\",\"eh\":\"शुद्ध लाभ = सकल लाभ - परिचालन व्यय + गैर-परिचालन आय = 80,000 - 25,000 + 5,000 = ₹60,000।\"},{\"n\":10,\"d\":\"\",\"se\":\"Which of the following is considered a <strong>liability</strong>?\",\"sh\":\"निम्नलिखित में से किसे <strong>दायित्व (Liability)</strong> माना जाता है?\",\"oe\":[\"Prepaid expenses\",\"Sundry Creditors\",\"Bank balance\",\"Bills receivable\"],\"oh\":[\"पूर्वदत्त व्यय (Prepaid expenses)\",\"विविध लेनदार (Sundry Creditors)\",\"बैंक बैलेंस\",\"प्राप्य बिल (Bills receivable)\"],\"a\":1,\"ee\":\"Creditors (trade payables) are obligations/liabilities.\",\"eh\":\"लेनदार (जिन्हें भुगतान करना है) व्यापार के दायित्व होते हैं।\"},{\"n\":11,\"d\":\"\",\"se\":\"The process of transferring journal entries to ledger accounts is called:\",\"sh\":\"जर्नल प्रविष्टियों को खाता बही (Ledger) खातों में स्थानांतरित करने की प्रक्रिया क्या कहलाती है?\",\"oe\":[\"Summarising\",\"Journalising\",\"Posting\",\"Balancing\"],\"oh\":[\"संक्षिप्तीकरण (Summarising)\",\"जर्नलाइजिंग\",\"खतौनी (Posting)\",\"संतुलन (Balancing)\"],\"a\":2,\"ee\":\"Posting.\",\"eh\":\"खतौनी (Posting)।\"},{\"n\":12,\"d\":\"\",\"se\":\"A machine purchased for ₹50,000 has an estimated life of 5 years and a scrap value of ₹5,000. Annual depreciation under the straight‑line method is:\",\"sh\":\"₹50,000 में खरीदी गई मशीन का अनुमानित जीवन 5 वर्ष है और कबाड़ मूल्य (Scrap Value) ₹5,000 है। सीधी रेखा विधि (Straight-line method) के तहत वार्षिक मूल्यह्रास क्या होगा?\",\"oe\":[\"₹11,000\",\"₹8,000\",\"₹10,000\",\"₹9,000\"],\"oh\":[\"₹11,000\",\"₹8,000\",\"₹10,000\",\"₹9,000\"],\"a\":3,\"ee\":\"(Cost - Scrap Value) / Life = (50,000 – 5,000) / 5 = ₹9,000.\",\"eh\":\"(लागत - कबाड़ मूल्य) / जीवन = (50,000 - 5,000) / 5 = ₹9,000।\"},{\"n\":13,\"d\":\"\",\"se\":\"Which accounting concept dictates that revenue is recognised when it is earned, regardless of when cash is received?\",\"sh\":\"कौन सी लेखांकन अवधारणा यह बताती है कि राजस्व (Revenue) को तब मान्यता दी जानी चाहिए जब वह अर्जित किया जाता है, न कि तब जब नकद प्राप्त होता है?\",\"oe\":[\"Accrual concept\",\"Matching concept\",\"Consistency concept\",\"Conservatism concept\"],\"oh\":[\"उपार्जन अवधारणा (Accrual concept)\",\"मिलान अवधारणा (Matching concept)\",\"निरंतरता अवधारणा (Consistency concept)\",\"रूढ़िवादिता अवधारणा (Conservatism concept)\"],\"a\":0,\"ee\":\"The accrual concept records revenues and expenses when they are incurred.\",\"eh\":\"उपार्जन अवधारणा के तहत लेनदेन को उसी समय दर्ज किया जाता है जब वे उत्पन्न होते हैं।\"},{\"n\":14,\"d\":\"\",\"se\":\"A bank overdraft is shown in the balance sheet under:\",\"sh\":\"बैंक ओवरड्राफ्ट को बैलेंस शीट में किसके अंतर्गत दिखाया जाता है:\",\"oe\":[\"Non-current Liabilities\",\"Current Liabilities\",\"Current Assets\",\"Shareholders&rsquo; funds\"],\"oh\":[\"गैर-चालू दायित्व\",\"चालू दायित्व (Current Liabilities)\",\"चालू संपत्तियां (Current Assets)\",\"शेयरधारक निधि\"],\"a\":1,\"ee\":\"Bank overdraft is a short‑term payable (Current Liability).\",\"eh\":\"बैंक ओवरड्राफ्ट एक अल्पकालिक देयता (चालू दायित्व) है।\"},{\"n\":15,\"d\":\"\",\"se\":\"If the trial balance has a total debit of ₹2,00,000 and credit of ₹1,80,000, the difference is temporarily placed on the:\",\"sh\":\"यदि तलपट (Trial balance) का कुल डेबिट ₹2,00,000 और क्रेडिट ₹1,80,000 है, तो अंतर को अस्थायी रूप से किसमें रखा जाता है:\",\"oe\":[\"Debit side of the P&amp;L Account\",\"Credit side of the Balance Sheet\",\"Credit side of a Suspense Account\",\"Credit side of the Trading Account\"],\"oh\":[\"P&amp;L खाते के डेबिट पक्ष में\",\"बैलेंस शीट के क्रेडिट पक्ष में\",\"उचंती खाते (Suspense A/c) के क्रेडिट पक्ष में\",\"व्यापार खाते के क्रेडिट पक्ष में\"],\"a\":2,\"ee\":\"A suspense account balances the difference until errors are found.\",\"eh\":\"जब तक गलतियों का पता नहीं चलता, अंतर को संतुलित करने के लिए उचंती खाता खोला जाता है।\"},{\"n\":16,\"d\":\"\",\"se\":\"Goods worth ₹10,000 were destroyed by fire, and the insurance company admitted a claim for ₹8,000. The net loss to be charged to the Profit &amp; Loss Account is:\",\"sh\":\"आग से ₹10,000 का माल नष्ट हो गया, और बीमा कंपनी ने ₹8,000 का दावा स्वीकार किया। लाभ और हानि खाते (P&amp;L A/c) में कितना शुद्ध नुकसान चार्ज किया जाएगा?\",\"oe\":[\"₹10,000\",\"₹8,000\",\"Nil\",\"₹2,000\"],\"oh\":[\"₹10,000\",\"₹8,000\",\"शून्य (Nil)\",\"₹2,000\"],\"a\":3,\"ee\":\"Net loss = Total loss (10,000) – Insurance claim (8,000) = ₹2,000.\",\"eh\":\"शुद्ध नुकसान = कुल नुकसान (10,000) - बीमा दावा (8,000) = ₹2,000।\"},{\"n\":17,\"d\":\"\",\"se\":\"In a partnership, interest charged on a partner's drawings is:\",\"sh\":\"साझेदारी में, साझेदार के आहरण (Drawings) पर लगाया गया ब्याज:\",\"oe\":[\"Debited to the partner's capital/current account\",\"Credited to the partner's capital account\",\"Credited to the cash account\",\"Debited to the P&amp;L Appropriation account\"],\"oh\":[\"साझेदार के पूंजी खाते में डेबिट किया जाता है\",\"साझेदार के पूंजी खाते में क्रेडिट किया जाता है\",\"नकद खाते में क्रेडिट किया जाता है\",\"P&amp;L विनियोग खाते में डेबिट किया जाता है\"],\"a\":0,\"ee\":\"It reduces the partner&rsquo;s capital, hence debited to their capital/current account.\",\"eh\":\"यह साझेदार की पूंजी को कम करता है, इसलिए इसे उनके पूंजी/चालू खाते में डेबिट किया जाता है।\"},{\"n\":18,\"d\":\"\",\"se\":\"A bill of exchange is defined as a:\",\"sh\":\"विनिमय विपत्र (Bill of exchange) को किस रूप में परिभाषित किया गया है:\",\"oe\":[\"Promissory note\",\"Negotiable instrument\",\"Cash receipt\",\"Cheque\"],\"oh\":[\"प्रतिज्ञा पत्र (Promissory note)\",\"परक्राम्य लिखत (Negotiable instrument)\",\"नकद रसीद\",\"चेक\"],\"a\":1,\"ee\":\"Defined under the Negotiable Instruments Act.\",\"eh\":\"यह नेगोशिएबल इंस्ट्रूमेंट एक्ट के तहत एक परक्राम्य लिखत है।\"},{\"n\":19,\"d\":\"\",\"se\":\"Valuing closing stock at cost or net realizable value (market price), whichever is lower, is based on the:\",\"sh\":\"अंतिम स्टॉक (Closing stock) का मूल्यांकन लागत या शुद्ध वसूली योग्य मूल्य (बाजार मूल्य), जो भी कम हो, पर करना किस अवधारणा पर आधारित है:\",\"oe\":[\"Going concern concept\",\"Consistency concept\",\"Prudence (Conservatism) concept\",\"Materiality concept\"],\"oh\":[\"चालू व्यापार अवधारणा\",\"निरंतरता अवधारणा\",\"रूढ़िवादिता / विवेक अवधारणा (Prudence concept)\",\"सारता अवधारणा (Materiality concept)\"],\"a\":2,\"ee\":\"Prudence anticipates no profits but provides for all possible losses.\",\"eh\":\"रूढ़िवादिता अवधारणा किसी भी लाभ की उम्मीद नहीं करती लेकिन सभी संभावित नुकसानों का प्रावधान करती है।\"},{\"n\":20,\"d\":\"\",\"se\":\"The ratio that measures a firm&rsquo;s ability to meet its short‑term obligations without relying on the sale of inventory is the:\",\"sh\":\"वह अनुपात जो इन्वेंट्री (स्टॉक) को बेचे बिना अपनी अल्पकालिक देनदारियों को पूरा करने की फर्म की क्षमता को मापता है:\",\"oe\":[\"Inventory turnover ratio\",\"Current ratio\",\"Gross profit ratio\",\"Quick (Acid-Test) ratio\"],\"oh\":[\"इन्वेंट्री टर्नओवर अनुपात\",\"चालू अनुपात (Current ratio)\",\"सकल लाभ अनुपात\",\"त्वरित अनुपात (Quick / Acid-Test ratio)\"],\"a\":3,\"ee\":\"Quick ratio = (Current Assets – Inventory) / Current Liabilities.\",\"eh\":\"त्वरित अनुपात = (चालू संपत्ति - इन्वेंट्री) / चालू दायित्व।\"},{\"n\":21,\"d\":\"\",\"se\":\"The metric that calculates how many times a company pays its trade payables in a year is the:\",\"sh\":\"वह मीट्रिक जो यह मापता है कि कंपनी एक वर्ष में कितनी बार अपने व्यापारिक लेनदारों (Trade payables) को भुगतान करती है:\",\"oe\":[\"Creditors turnover ratio\",\"Debtors turnover ratio\",\"Stock turnover ratio\",\"Current ratio\"],\"oh\":[\"लेनदार टर्नओवर अनुपात (Creditors turnover ratio)\",\"देनदार टर्नओवर अनुपात\",\"स्टॉक टर्नओवर अनुपात\",\"चालू अनुपात\"],\"a\":0,\"ee\":\"Creditors (Payables) turnover ratio.\",\"eh\":\"लेनदार टर्नओवर अनुपात।\"},{\"n\":22,\"d\":\"\",\"se\":\"What is the correct journal entry for writing off bad debts?\",\"sh\":\"डूबत ऋण (Bad debts) को अपलिखित (Write off) करने के लिए सही जर्नल प्रविष्टि क्या है?\",\"oe\":[\"Bad Debts A/c Dr. To Cash A/c\",\"Bad Debts A/c Dr. To Debtors A/c\",\"Cash A/c Dr. To Bad Debts A/c\",\"Debtors A/c Dr. To Bad Debts A/c\"],\"oh\":[\"Bad Debts A/c Dr. To Cash A/c\",\"Bad Debts A/c Dr. To Debtors A/c\",\"Cash A/c Dr. To Bad Debts A/c\",\"Debtors A/c Dr. To Bad Debts A/c\"],\"a\":1,\"ee\":\"Bad debt is an expense (debit), and it reduces the asset value of Debtors (credit).\",\"eh\":\"डूबत ऋण एक व्यय (डेबिट) है, और यह देनदारों (क्रेडिट) की संपत्ति के मूल्य को कम करता है।\"},{\"n\":23,\"d\":\"\",\"se\":\"A company issues 10,000 equity shares of ₹10 each at a premium of ₹2 per share. The total amount received is:\",\"sh\":\"एक कंपनी ₹10 प्रति शेयर वाले 10,000 इक्विटी शेयर ₹2 प्रति शेयर के प्रीमियम पर जारी करती है। प्राप्त कुल राशि होगी:\",\"oe\":[\"₹1,00,000\",\"₹80,000\",\"₹1,20,000\",\"₹1,02,000\"],\"oh\":[\"₹1,00,000\",\"₹80,000\",\"₹1,20,000\",\"₹1,02,000\"],\"a\":2,\"ee\":\"Issue price = ₹12 per share; total = 10,000 × 12 = ₹1,20,000.\",\"eh\":\"जारी मूल्य = ₹12; कुल राशि = 10,000 × 12 = ₹1,20,000।\"},{\"n\":24,\"d\":\"\",\"se\":\"Which of the following is considered a <strong>fixed asset</strong>?\",\"sh\":\"निम्नलिखित में से किसे <strong>स्थायी संपत्ति (Fixed asset)</strong> माना जाता है?\",\"oe\":[\"Stock\",\"Debtors\",\"Bills receivable\",\"Goodwill\"],\"oh\":[\"स्टॉक\",\"देनदार\",\"प्राप्य बिल\",\"ख्याति (Goodwill)\"],\"a\":3,\"ee\":\"Goodwill is an intangible fixed asset.\",\"eh\":\"ख्याति एक अमूर्त स्थायी संपत्ति है।\"},{\"n\":25,\"d\":\"\",\"se\":\"The primary objective of preparing a trial balance is to:\",\"sh\":\"तलपट (Trial balance) तैयार करने का मुख्य उद्देश्य क्या है?\",\"oe\":[\"Check the arithmetical accuracy of ledgers\",\"Ascertain profit or loss\",\"Determine the financial position\",\"Prepare tax filings\"],\"oh\":[\"खाता बही की अंकगणितीय सटीकता की जांच करना\",\"लाभ या हानि सुनिश्चित करना\",\"वित्तीय स्थिति का निर्धारण करना\",\"कर रिटर्न तैयार करना\"],\"a\":0,\"ee\":\"It ensures total debits equal total credits.\",\"eh\":\"यह सुनिश्चित करता है कि डेबिट का कुल योग क्रेडिट के कुल योग के बराबर है।\"},{\"n\":26,\"d\":\"\",\"se\":\"A discount of 10% on the invoice price is allowed strictly if payment is made within 15 days. This is an example of a:\",\"sh\":\"चालान मूल्य पर 10% की छूट तब दी जाती है जब भुगतान 15 दिनों के भीतर किया जाता है। यह किसका उदाहरण है:\",\"oe\":[\"Trade discount\",\"Cash discount\",\"Bulk discount\",\"Rebate\"],\"oh\":[\"व्यापारिक छूट (Trade discount)\",\"नकद छूट (Cash discount)\",\"थोक छूट\",\"रिबेट\"],\"a\":1,\"ee\":\"Cash discounts are contingent on quick payment.\",\"eh\":\"नकद छूट त्वरित भुगतान को प्रोत्साहित करने के लिए दी जाती है।\"},{\"n\":27,\"d\":\"\",\"se\":\"In the absence of a partnership deed, interest on capital is:\",\"sh\":\"साझेदारी विलेख (Partnership deed) के अभाव में, पूंजी पर ब्याज:\",\"oe\":[\"Allowed at 6% p.a\",\"Allowed as per mutual consent at year-end\",\"Not allowed\",\"Allowed at 12% p.a\"],\"oh\":[\"6% प्रति वर्ष की दर से दिया जाता है\",\"आपसी सहमति के अनुसार दिया जाता है\",\"नहीं दिया जाता है (Not allowed)\",\"12% प्रति वर्ष की दर से दिया जाता है\"],\"a\":2,\"ee\":\"Under the Indian Partnership Act, no interest on capital is allowed if there is no deed.\",\"eh\":\"भारतीय साझेदारी अधिनियम के तहत, विलेख न होने पर पूंजी पर कोई ब्याज देय नहीं है।\"},{\"n\":28,\"d\":\"\",\"se\":\"Which of the following is <strong>not</strong> a type of reserve?\",\"sh\":\"निम्नलिखित में से कौन सा संचय (Reserve) का प्रकार <strong>नहीं</strong> है?\",\"oe\":[\"General Reserve\",\"Secret Reserve\",\"Capital Reserve\",\"Provision for Bad Debts\"],\"oh\":[\"सामान्य संचय (General Reserve)\",\"गुप्त संचय (Secret Reserve)\",\"पूंजीगत संचय (Capital Reserve)\",\"डूबत ऋण के लिए प्रावधान (Provision for Bad Debts)\"],\"a\":3,\"ee\":\"A provision is a charge against profit for a known liability, whereas a reserve is an appropriation of profit.\",\"eh\":\"प्रावधान (Provision) ज्ञात दायित्वों के लिए लाभ के विरुद्ध एक प्रभार है, जबकि संचय लाभ का विनियोजन है।\"},{\"n\":29,\"d\":\"\",\"se\":\"The difference between Net Sales and Cost of Goods Sold (COGS) is known as:\",\"sh\":\"शुद्ध बिक्री (Net Sales) और बेचे गए माल की लागत (COGS) के बीच के अंतर को कहा जाता है:\",\"oe\":[\"Gross Profit\",\"Net Profit\",\"Operating Profit\",\"Retained Earnings\"],\"oh\":[\"सकल लाभ (Gross Profit)\",\"शुद्ध लाभ (Net Profit)\",\"परिचालन लाभ (Operating Profit)\",\"प्रतिधारित आय (Retained Earnings)\"],\"a\":0,\"ee\":\"Net Sales – COGS = Gross Profit.\",\"eh\":\"शुद्ध बिक्री - COGS = सकल लाभ।\"},{\"n\":30,\"d\":\"\",\"se\":\"
