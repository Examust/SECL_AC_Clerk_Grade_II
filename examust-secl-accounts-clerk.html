bility that it is red is:\",\"sh\":\"एक थैले में 4 सफेद, 5 लाल और 6 नीली गेंदें हैं। यदि एक गेंद यादृच्छिक रूप से (at random) निकाली जाती है, तो उसके लाल होने की प्रायिकता (probability) क्या है:\",\"oe\":[\"2/3\",\"4/15\",\"1/3\",\"1/5\"],\"oh\":[\"2/3\",\"4/15\",\"1/3\",\"1/5\"],\"a\":2,\"ee\":\"Total balls = 4 + 5 + 6 = 15. Red balls = 5. Probability = 5/15 = 1/3.\",\"eh\":\"कुल गेंदें = 4 + 5 + 6 = 15। लाल गेंदें = 5। प्रायिकता = 5/15 = 1/3।\"},{\"n\":35,\"d\":\"\",\"se\":\"The arithmetic mean (average) of the numbers 5, 7, 9, 11, and 13 is:\",\"sh\":\"5, 7, 9, 11, और 13 संख्याओं का अंकगणितीय माध्य (औसत) है:\",\"oe\":[\"10\",\"8\",\"11\",\"9\"],\"oh\":[\"10\",\"8\",\"11\",\"9\"],\"a\":3,\"ee\":\"Sum = 45. Total numbers = 5. Average = 45 / 5 = 9.\",\"eh\":\"योग = 45। कुल संख्याएं = 5। औसत = 45 / 5 = 9।\"},{\"n\":36,\"d\":\"\",\"se\":\"A car covers a distance of 240 km in 4 hours. Its speed in meters per second (m/s) is:\",\"sh\":\"एक कार 240 किमी की दूरी 4 घंटे में तय करती है। मीटर प्रति सेकंड (m/s) में इसकी गति क्या है:\",\"oe\":[\"16.67 m/s\",\"25 m/s\",\"30 m/s\",\"20 m/s\"],\"oh\":[\"16.67 m/s\",\"25 m/s\",\"30 m/s\",\"20 m/s\"],\"a\":0,\"ee\":\"Speed in km/h = 240/4 = 60 km/h. To convert to m/s: 60 × (5/18) = 300/18 = 16.66... m/s.\",\"eh\":\"गति (किमी/घंटा) = 240/4 = 60 किमी/घंटा। m/s में बदलने के लिए: 60 × (5/18) = 300/18 = 16.66... m/s।\"},{\"n\":37,\"d\":\"\",\"se\":\"If a : b = 2 : 3 and b : c = 4 : 5, then the ratio a : b : c is:\",\"sh\":\"यदि a : b = 2 : 3 और b : c = 4 : 5 है, तो अनुपात a : b : c क्या होगा:\",\"oe\":[\"4 : 6 : 5\",\"8 : 12 : 15\",\"2 : 3 : 5\",\"2 : 4 : 5\"],\"oh\":[\"4 : 6 : 5\",\"8 : 12 : 15\",\"2 : 3 : 5\",\"2 : 4 : 5\"],\"a\":1,\"ee\":\"Multiply the first ratio by 4 (8:12) and the second by 3 (12:15). The combined ratio is 8:12:15.\",\"eh\":\"पहले अनुपात को 4 से (8:12) और दूसरे को 3 से (12:15) गुणा करें। संयुक्त अनुपात 8:12:15 होगा।\"},{\"n\":38,\"d\":\"\",\"se\":\"The square root of 1444 is:\",\"sh\":\"1444 का वर्गमूल (Square root) है:\",\"oe\":[\"44\",\"42\",\"38\",\"36\"],\"oh\":[\"44\",\"42\",\"38\",\"36\"],\"a\":2,\"ee\":\"38 × 38 = 1444.\",\"eh\":\"38 × 38 = 1444।\"},{\"n\":39,\"d\":\"\",\"se\":\"A shopkeeper buys an article for ₹400 and sells it at a profit of 20%. The selling price is:\",\"sh\":\"एक दुकानदार एक वस्तु ₹400 में खरीदता है और उसे 20% लाभ पर बेचता है। विक्रय मूल्य (Selling price) है:\",\"oe\":[\"₹500\",\"₹440\",\"₹420\",\"₹480\"],\"oh\":[\"₹500\",\"₹440\",\"₹420\",\"₹480\"],\"a\":3,\"ee\":\"Profit = 20% of 400 = ₹80. Selling Price = 400 + 80 = ₹480.\",\"eh\":\"लाभ = 400 का 20% = ₹80। विक्रय मूल्य = 400 + 80 = ₹480।\"},{\"n\":40,\"d\":\"\",\"se\":\"If 2x – 3 = 7, then the value of x is:\",\"sh\":\"यदि 2x - 3 = 7 है, तो x का मान है:\",\"oe\":[\"5\",\"4\",\"6\",\"3\"],\"oh\":[\"5\",\"4\",\"6\",\"3\"],\"a\":0,\"ee\":\"2x = 7 + 3 = 10. Therefore, x = 5.\",\"eh\":\"2x = 7 + 3 = 10। इसलिए, x = 5।\"},{\"n\":41,\"d\":\"\",\"se\":\"The compound interest on ₹6,000 at 10% p.a. for 2 years, compounded annually, is:\",\"sh\":\"₹6,000 पर 10% प्रति वर्ष की दर से 2 वर्ष का चक्रवृद्धि ब्याज (वार्षिक रूप से संयोजित) कितना होगा:\",\"oe\":[\"₹1,200\",\"₹1,260\",\"₹1,500\",\"₹1,320\"],\"oh\":[\"₹1,200\",\"₹1,260\",\"₹1,500\",\"₹1,320\"],\"a\":1,\"ee\":\"Amount = 6000 × (1.10)² = 6000 × 1.21 = ₹7,260. CI = 7260 - 6000 = ₹1,260.\",\"eh\":\"मिश्रधन = 6000 × (1.10)² = 6000 × 1.21 = ₹7,260। चक्रवृद्धि ब्याज = 7260 - 6000 = ₹1,260।\"},{\"n\":42,\"d\":\"\",\"se\":\"A man bought 5 dozen eggs for ₹120. He sold them all at ₹3 per egg. His profit or loss percentage is:\",\"sh\":\"एक आदमी ने ₹120 में 5 दर्जन अंडे खरीदे। उसने सभी अंडों को ₹3 प्रति अंडे के हिसाब से बेच दिया। उसका लाभ या हानि प्रतिशत है:\",\"oe\":[\"Profit 25%\",\"No profit, no loss\",\"Profit 50%\",\"Loss 50%\"],\"oh\":[\"25% लाभ\",\"न लाभ, न हानि\",\"50% लाभ\",\"50% हानि\"],\"a\":2,\"ee\":\"5 dozen = 60 eggs. CP of 1 egg = 120/60 = ₹2. SP = ₹3. Profit per egg = ₹1. Profit % = (1/2) × 100 = 50%.\",\"eh\":\"5 दर्जन = 60 अंडे। 1 अंडे का CP = 120/60 = ₹2। SP = ₹3। प्रति अंडे लाभ = ₹1। लाभ % = (1/2) × 100 = 50%।\"},{\"n\":43,\"d\":\"\",\"se\":\"The Highest Common Factor (HCF) of 18, 24, and 30 is:\",\"sh\":\"18, 24, और 30 का महत्तम समापवर्तक (HCF) है:\",\"oe\":[\"2\",\"3\",\"12\",\"6\"],\"oh\":[\"2\",\"3\",\"12\",\"6\"],\"a\":3,\"ee\":\"6 is the largest number that perfectly divides 18, 24, and 30.\",\"eh\":\"6 सबसे बड़ी संख्या है जो 18, 24 और 30 को पूरी तरह विभाजित करती है।\"},{\"n\":44,\"d\":\"\",\"se\":\"A train 300 meters long crosses a pole in 15 seconds. Its speed in km/hr is:\",\"sh\":\"300 मीटर लंबी एक ट्रेन एक खंभे को 15 सेकंड में पार करती है। किमी/घंटा में इसकी गति है:\",\"oe\":[\"72 km/hr\",\"80 km/hr\",\"54 km/hr\",\"60 km/hr\"],\"oh\":[\"72 किमी/घंटा\",\"80 किमी/घंटा\",\"54 किमी/घंटा\",\"60 किमी/घंटा\"],\"a\":0,\"ee\":\"Speed = Distance/Time = 300/15 = 20 m/s. In km/hr: 20 × (18/5) = 72 km/hr.\",\"eh\":\"गति = दूरी/समय = 300/15 = 20 मीटर/सेकंड। किमी/घंटा में: 20 × (18/5) = 72 किमी/घंटा।\"},{\"n\":45,\"d\":\"\",\"se\":\"The average of 6 numbers is 40. If one number (which is 60) is removed, the average of the remaining 5 numbers is:\",\"sh\":\"6 संख्याओं का औसत 40 है। यदि एक संख्या (जो 60 है) को हटा दिया जाए, तो शेष 5 संख्याओं का औसत क्या होगा:\",\"oe\":[\"38\",\"36\",\"42\",\"34\"],\"oh\":[\"38\",\"36\",\"42\",\"34\"],\"a\":1,\"ee\":\"Total sum of 6 numbers = 6 × 40 = 240. New sum = 240 - 60 = 180. New average = 180 / 5 = 36.\",\"eh\":\"6 संख्याओं का कुल योग = 6 × 40 = 240। नया योग = 240 - 60 = 180। नया औसत = 180 / 5 = 36।\"},{\"n\":46,\"d\":\"\",\"se\":\"Find the missing term in the sequence: 4, 9, 16, 25, 36, ?\",\"sh\":\"अनुक्रम में लुप्त पद ज्ञात कीजिए: 4, 9, 16, 25, 36, ?\",\"oe\":[\"40\",\"45\",\"49\",\"64\"],\"oh\":[\"40\",\"45\",\"49\",\"64\"],\"a\":2,\"ee\":\"The sequence consists of squares of consecutive numbers: 2², 3², 4², 5², 6². The next is 7² = 49.\",\"eh\":\"अनुक्रम में लगातार संख्याओं के वर्ग हैं: 2², 3², 4², 5², 6²। अगला 7² = 49 है।\"},{\"n\":47,\"d\":\"\",\"se\":\"In a certain code language, &ldquo;NUMBER&rdquo; is written as &ldquo;OVNCFS&rdquo;. How will &ldquo;LETTER&rdquo; be coded?\",\"sh\":\"एक निश्चित कूट भाषा में, &quot;NUMBER&quot; को &quot;OVNCFS&quot; लिखा जाता है। &quot;LETTER&quot; को कैसे कोडित किया जाएगा?\",\"oe\":[\"MEUUFS\",\"MFUVFS\",\"MFTUFS\",\"MFUUFS\"],\"oh\":[\"MEUUFS\",\"MFUVFS\",\"MFTUFS\",\"MFUUFS\"],\"a\":3,\"ee\":\"Each letter is shifted exactly +1 position. (L→M, E→F, T→U, T→U, E→F, R→S).\",\"eh\":\"प्रत्येक अक्षर को ठीक +1 स्थान आगे बढ़ाया गया है। (L→M, E→F, T→U, T→U, E→F, R→S)।\"},{\"n\":48,\"d\":\"\",\"se\":\"Pointing to a lady in a photograph, a man said, &ldquo;She is the daughter of my father&rsquo;s only son.&rdquo; How is the lady related to the man speaking?\",\"sh\":\"एक तस्वीर में एक महिला की ओर इशारा करते हुए, एक आदमी ने कहा, &quot;वह मेरे पिता के इकलौते बेटे की बेटी है।&quot; बोलने वाले आदमी से महिला का क्या संबंध है?\",\"oe\":[\"Daughter\",\"Sister\",\"Mother\",\"Niece\"],\"oh\":[\"बेटी (Daughter)\",\"बहन\",\"माँ\",\"भतीजी/भांजी\"],\"a\":0,\"ee\":\"The &quot;father's only son&quot; is the man speaking. Therefore, the lady is the man's own daughter.\",\"eh\":\"&quot;पिता का इकलौता बेटा&quot; वह आदमी स्वयं है। अतः वह महिला उस आदमी की अपनी बेटी है।\"},{\"n\":49,\"d\":\"\",\"se\":\"In a row of 40 students, Ravi is 15th from the left end and Suresh is 20th from the right end. How many students are sitting exactly between them?\",\"sh\":\"40 छात्रों की एक पंक्ति में, रवि बाएं छोर से 15वें स्थान पर है और सुरेश दाएं छोर से 20वें स्थान पर है। उनके ठीक बीच में कितने छात्र बैठे हैं?\",\"oe\":[\"6\",\"5\",\"8\",\"7\"],\"oh\":[\"6\",\"5\",\"8\",\"7\"],\"a\":1,\"ee\":\"Suresh&rsquo;s position from the left = 40 - 20 + 1 = 21st. The students sitting between the 15th and 21st positions are those at 16, 17, 18, 19, and 20. Total = 5 students.\",\"eh\":\"बाएं से सुरेश का स्थान = 40 - 20 + 1 = 21वां। 15वें और 21वें स्थान के बीच बैठने वाले छात्र 16, 17, 18, 19 और 20वें स्थान पर हैं। कुल = 5 छात्र।\"},{\"n\":50,\"d\":\"\",\"se\":\"Six friends A, B, C, D, E, and F are sitting in a circle facing the center. C is sitting immediately to the right of F. B is sitting second to the left of C. A is sitting between D and E. Who is sitting exactly opposite to A?\",\"sh\":\"छह मित्र A, B, C, D, E और F केंद्र की ओर मुख करके एक घेरे में बैठे हैं। C, F के ठीक दाईं ओर बैठा है। B, C के बाईं ओर दूसरे स्थान पर बैठा है। A, D और E के बीच बैठा है। A के ठीक विपरीत (opposite) कौन बैठा है?\",\"oe\":[\"C\",\"D\",\"F\",\"B\"],\"oh\":[\"C\",\"D\",\"F\",\"B\"],\"a\":2,\"ee\":\"Let's arrange them based on the rules. Placing C at position 1. Left is clockwise. Second to the left is position 3, so B is at 3. F is sitting immediately to C's left (since C is to F's right), so F is at position 2. Sequence so far: C(1), F(2), B(3). The remaining seats are 4, 5, 6. A sits between D and E, meaning A must be at position 5 (with D and E at 4 and 6). Directly opposite A (position 5) is position 2, where F is sitting.\",\"eh\":\"मान लें C स्थिति 1 पर है। बायां भाग दक्षिणावर्त (clockwise) है। बाईं ओर दूसरा स्थान 3 है, अतः B, 3 पर है। F, C के ठीक बाईं ओर है (चूंकि C, F के दाईं ओर है), अतः F स्थिति 2 पर है। अभी तक क्रम: C(1), F(2), B(3)। शेष सीटें 4, 5, 6 हैं। A, D और E के बीच में बैठता है, जिसका अर्थ है कि A स्थिति 5 पर होना चाहिए (D और E 4 और 6 पर)। A (स्थिति 5) के ठीक विपरीत स्थिति 2 है, जहां F बैठा है।\"},{\"n\":51,\"d\":\"\",\"se\":\"Find the next term in the series: 1, 1, 2, 3, 5, 8, 13, ?\",\"sh\":\"श्रृंखला में अगला पद ज्ञात कीजिए: 1, 1, 2, 3, 5, 8, 13, ?\",\"oe\":[\"18\",\"15\",\"20\",\"21\"],\"oh\":[\"18\",\"15\",\"20\",\"21\"],\"a\":3,\"ee\":\"This is the Fibonacci sequence. Each term is the sum of the previous two (8 + 13 = 21).\",\"eh\":\"यह फाइबोनैचि (Fibonacci) अनुक्रम है। प्रत्येक पद पिछले दो पदों का योग है (8 + 13 = 21)।\"},{\"n\":52,\"d\":\"\",\"se\":\"In a certain code, &ldquo;ORANGE&rdquo; is coded as &ldquo;PSBOHF&rdquo;. How is &ldquo;APPLE&rdquo; coded in that same language?\",\"sh\":\"एक निश्चित कूट में, &quot;ORANGE&quot; को &quot;PSBOHF&quot; के रूप में कोडित किया गया है। उसी भाषा में &quot;APPLE&quot; को कैसे कोडित किया गया है?\",\"oe\":[\"BQQMF\",\"BQQLF\",\"CPPME\",\"BQQME\"],\"oh\":[\"BQQMF\",\"BQQLF\",\"CPPME\",\"BQQME\"],\"a\":0,\"ee\":\"Every letter shifts forward by +1. (A→B, P→Q, P→Q, L→M, E→F).\",\"eh\":\"प्रत्येक अक्षर +1 से आगे बढ़ता है। (A→B, P→Q, P→Q, L→M, E→F)।\"},{\"n\":53,\"d\":\"\",\"se\":\"Read the statements and deduce the logical conclusion: <em>Statements:</em> All mangoes are fruits. Some fruits are sweet. <em>Conclusions:</em> I. Some mangoes are sweet. II. All fruits are mangoes.\",\"sh\":\"कथनों को पढ़ें और तार्किक निष्कर्ष निकालें: <em>कथन:</em> सभी आम फल हैं। कुछ फल मीठे हैं। <em>निष्कर्ष:</em> I. कुछ आम मीठे हैं। II. सभी फल आम हैं।\",\"oe\":[\"Only I follows\",\"Only II follows\",\"Both I and II follow\",\"Neither follows\"],\"oh\":[\"केवल I अनुसरण करता है\",\"केवल II अनुसरण करता है\",\"I और II दोनों अनुसरण करते हैं\",\"न तो I और न ही II अनुसरण करता है\"],\"a\":3,\"ee\":\"Conclusion I is invalid because the &quot;sweet&quot; portion of fruits may not overlap with mangoes. Conclusion II is illogical.\",\"eh\":\"निष्कर्ष I अमान्य है क्योंकि फलों का &quot;मीठा&quot; हिस्सा आमों के साथ ओवरलैप हो भी सकता है और नहीं भी। निष्कर्ष II अतार्किक है।\"},{\"n\":54,\"d\":\"\",\"se\":\"A man walks 10 km East, then turns right and walks 5 km, then turns right again and walks 10 km. How far is he from his starting point?\",\"sh\":\"एक आदमी 10 किमी पूर्व (East) की ओर चलता है, फिर दाएँ मुड़ता है और 5 किमी चलता है, फिर से दाएँ मुड़ता है और 10 किमी चलता है। वह अपने प्रारंभिक बिंदु से कितनी दूर है?\",\"oe\":[\"0 km\",\"5 km\",\"15 km\",\"10 km\"],\"oh\":[\"0 किमी\",\"5 किमी\",\"15 किमी\",\"10 किमी\"],\"a\":1,\"ee\":\"He walked 10 km East, 5 km South (right), and 10 km West (right). He is exactly 5 km South of his start point.\",\"eh\":\"वह 10 किमी पूर्व, 5 किमी दक्षिण (दाएं) और 10 किमी पश्चिम (दाएं) चला। वह अपने प्रारंभिक बिंदु से ठीक 5 किमी दक्षिण में है।\"},{\"n\":55,\"d\":\"\",\"se\":\"Which number will replace the question mark? 5, 11, 23, 47, 95, ?\",\"sh\":\"प्रश्न चिह्न के स्थान पर कौन सी संख्या आएगी? 5, 11, 23, 47, 95, ?\",\"oe\":[\"189\",\"190\",\"191\",\"187\"],\"oh\":[\"189\",\"190\",\"191\",\"187\"],\"a\":2,\"ee\":\"The pattern is (n × 2) + 1. (95 × 2) + 1 = 190 + 1 = 191.\",\"eh\":\"पैटर्न (n × 2) + 1 है। (95 × 2) + 1 = 190 + 1 = 191।\"},{\"n\":56,\"d\":\"\",\"se\":\"In a family, A is the brother of B. C is the mother of A. D is the father of C. How is D related to B?\",\"sh\":\"एक परिवार में, A, B का भाई है। C, A की माँ है। D, C का पिता है। D, B से किस प्रकार संबंधित है?\",\"oe\":[\"Brother\",\"Father\",\"Uncle\",\"Grandfather\"],\"oh\":[\"भाई\",\"पिता\",\"चाचा\",\"नाना (Maternal Grandfather)\"],\"a\":3,\"ee\":\"A and B are siblings. C is their mother. D is their mother's father. Thus, D is the maternal grandfather of B.\",\"eh\":\"A और B भाई-बहन हैं। C उनकी माँ है। D उनकी माँ के पिता हैं। इस प्रकार, D, B का नाना है।\"},{\"n\":57,\"d\":\"\",\"se\":\"Find the next term in the sequence: 3, 8, 15, 24, 35, ?\",\"sh\":\"अनुक्रम में अगला पद ज्ञात कीजिए: 3, 8, 15, 24, 35, ?\",\"oe\":[\"48\",\"50\",\"49\",\"47\"],\"oh\":[\"48\",\"50\",\"49\",\"47\"],\"a\":0,\"ee\":\"The sequence follows the pattern n² - 1 (2²-1=3, 3²-1=8, 4²-1=15... 7²-1=48). Alternatively, the differences between terms are consecutive odd numbers (5, 7, 9, 11, 13). 35 + 13 = 48.\",\"eh\":\"अनुक्रम n² - 1 पैटर्न का पालन करता है (2²-1=3, 3²-1=8... 7²-1=48)। वैकल्पिक रूप से, पदों के बीच का अंतर लगातार विषम संख्याएं (5, 7, 9, 11, 13) हैं। 35 + 13 = 48।\"},{\"n\":58,\"d\":\"\",\"se\":\"If the day after tomorrow is Sunday, what day was yesterday?\",\"sh\":\"यदि आने वाले कल के बाद का दिन (day after tomorrow) रविवार है, तो बीता हुआ कल (yesterday) कौन सा दिन था?\",\"oe\":[\"Saturday\",\"Thursday\",\"Friday\",\"Wednesday\"],\"oh\":[\"शनिवार\",\"गुरुवार (Thursday)\",\"शुक्रवार\",\"बुधवार\"],\"a\":1,\"ee\":\"If the day after tomorrow is Sunday, today is Friday. Therefore, yesterday was Thursday.\",\"eh\":\"यदि परसों रविवार है, तो आज शुक्रवार है। इसलिए, बीता हुआ कल गुरुवार था।\"},{\"n\":59,\"d\":\"\",\"se\":\"If the word &ldquo;MILK&rdquo; is coded as &ldquo;NJML&rdquo;, how is the word &ldquo;JUICE&rdquo; coded?\",\"sh\":\"यदि शब्द &quot;MILK&quot; को &quot;NJML&quot; के रूप में कोडित किया गया है, तो &quot;JUICE&quot; शब्द को कैसे कोडित किया जाएगा?\",\"oe\":[\"KVJDE\",\"KVJEF\",\"KVJDF\",\"KVIDF\"],\"oh\":[\"KVJDE\",\"KVJEF\",\"KVJDF\",\"KVIDF\"],\"a\":2,\"ee\":\"Each letter is shifted by +1 (J→K, U→V, I→J, C→D, E→F).\",\"eh\":\"प्रत्येक अक्षर को +1 से स्थानांतरित किया गया है (J→K, U→V, I→J, C→D, E→F)।\"},{\"n\":60,\"d\":\"\",\"se\":\"Read the following and deduce the correct conclusion: <em>Statements:</em> All birds have feathers. Some birds can fly. <em>Conclusions:</em> I. All flying things are birds. II. Some feathered things can fly.\",\"sh\":\"निम्नलिखित को पढ़ें और सही निष्कर्ष निकालें: <em>कथन:</em> सभी पक्षियों के पंख होते हैं। कुछ पक्षी उड़ सकते हैं। <em>निष्कर्ष:</em> I. उड़ने वाली सभी चीजें पक्षी हैं। II. पंख वाली कुछ चीजें उड़ सकती हैं।\",\"oe\":[\"Only I follows\",\"Only II follows\",\"Both follow\",\"Neither follows\"],\"oh\":[\"केवल I अनुसरण करता है\",\"केवल II अनुसरण करता है\",\"दोनों अनुसरण करते हैं\",\"कोई भी अनुसरण नहीं करता है\"],\"a\":1,\"ee\":\"Since flying birds have feathers, it logically follows that some feathered things can fly. Conclusion I makes a false generalization.\",\"eh\":\"चूंकि उड़ने वाले पक्षियों के पंख होते हैं, इसलिए यह तार्किक रूप से अनुसरण करता है कि पंख वाली कुछ चीजें उड़ सकती हैं। निष्कर्ष I एक गलत सामान्यीकरण है।\"},{\"n\":61,\"d\":\"\",\"se\":\"Find the next term in the series: 2, 6, 14, 30, 62, ?\",\"sh\":\"श्रृंखला में अगला पद ज्ञात कीजिए: 2, 6, 14, 30, 62, ?\",\"oe\":[\"120\",\"124\",\"128\",\"126\"],\"oh\":[\"120\",\"124\",\"128\",\"126\"],\"a\":3,\"ee\":\"The pattern is (n × 2) + 2. (62 × 2) + 2 = 124 + 2 = 126.\",\"eh\":\"पैटर्न (n × 2) + 2 है। (62 × 2) + 2 = 124 + 2 = 126।\"},{\"n\":62,\"d\":\"\",\"se\":\"In a row of 50 students, Priya is 12th from the left and Rohan is 18th from the right. How many students are sitting between them?\",\"sh\":\"50 छात्रों की एक पंक्ति में, प्रिया बाएँ से 12वें स्थान पर है और रोहन दाएँ से 18वें स्थान पर है। उनके बीच कितने छात्र बैठे हैं?\",\"oe\":[\"20\",\"21\",\"19\",\"22\"],\"oh\":[\"20\",\"21\",\"19\",\"22\"],\"a\":0,\"ee\":\"Rohan&rsquo;s position from the left = 50 - 18 + 1 = 33. The number of students between the 12th position and the 33rd position is (33 - 12 - 1) = 20.\",\"eh\":\"बाएं से रोहन का स्थान = 50 - 18 + 1 = 33। 12वें और 33वें स्थान के बीच छात्रों की संख्या (33 - 12 - 1) = 20 है।\"},{\"n\":63,\"d\":\"\",\"se\":\"If ‘P&rsquo; means ‘+&rsquo;, ‘Q&rsquo; means ‘–&rsquo;, ‘R&rsquo; means ‘×&rsquo;, and ‘S&rsquo; means ‘÷&rsquo;, then solve: 8 S 4 R 3 P 5 Q 2.\",\"sh\":\"यदि 'P' का अर्थ '+', 'Q' का अर्थ '-', 'R' का अर्थ '×', और 'S' का अर्थ '÷' है, तो हल करें: 8 S 4 R 3 P 5 Q 2।\",\"oe\":[\"8\",\"9\",\"11\",\"10\"],\"oh\":[\"8\",\"9\",\"11\",\"10\"],\"a\":1,\"ee\":\"Translating the symbols: 8 ÷ 4 × 3 + 5 - 2. Using BODMAS: 2 × 3 + 5 - 2 = 6 + 5 - 2 = 9.\",\"eh\":\"प्रतीकों का अनुवाद: 8 ÷ 4 × 3 + 5 - 2। BODMAS का उपयोग करने पर: 2 × 3 + 5 - 2 = 6 + 5 - 2 = 9।\"},{\"n\":64,\"d\":\"\",\"se\":\"In a certain code, &ldquo;TREE&rdquo; is written as &ldquo;USFF&rdquo;. How is &ldquo;LEAF&rdquo; coded?\",\"sh\":\"एक निश्चित कूट में, &quot;TREE&quot; को &quot;USFF&quot; लिखा जाता है। &quot;LEAF&quot; को कैसे कोडित किया जाएगा?\",\"oe\":[\"NFCH\",\"MDBG\",\"MFBG\",\"MEBG\"],\"oh\":[\"NFCH\",\"MDBG\",\"MFBG\",\"MEBG\"],\"a\":2,\"ee\":\"Each letter shifts +1. (L→M, E→F, A→B, F→G).\",\"eh\":\"प्रत्येक अक्षर +1 से शिफ्ट होता है। (L→M, E→F, A→B, F→G)।\"},{\"n\":65,\"d\":\"\",\"se\":\"Five people (A, B, C, D, E) are sitting in a straight row facing north. D is at the extreme left end and E is at the extreme right end. A is sitting exactly in the middle of B and C. B is sitting to the immediate right of D. Who is sitting exactly in the middle of the row?\",\"sh\":\"पाँच व्यक्ति (A, B, C, D, E) उत्तर की ओर मुख करके एक सीधी पंक्ति में बैठे हैं। D चरम बाएँ छोर पर है और E चरम दाएँ छोर पर है। A, B और C के ठीक बीच में बैठा है। B, D के ठीक दाईं ओर बैठा है। पंक्ति के ठीक बीच में कौन बैठा है?\",\"oe\":[\"E\",\"C\",\"B\",\"A\"],\"oh\":[\"E\",\"C\",\"B\",\"A\"],\"a\":3,\"ee\":\"Based on the rules, the arrangement from left to right is: D, B, A, C, E. The person in the exact middle (3rd position) is A.\",\"eh\":\"नियमों के आधार पर, बाएँ से दाएँ क्रम इस प्रकार है: D, B, A, C, E। ठीक बीच में (तीसरे स्थान पर) बैठा व्यक्ति A है।\"},{\"n\":66,\"d\":\"\",\"se\":\"Choose the correct synonym for the word &ldquo;Ponder&rdquo;:\",\"sh\":\"Choose the correct synonym for the word &ldquo;Ponder&rdquo;:\",\"oe\":[\"Think\",\"Abandon\",\"Forget\",\"Ignore\"],\"oh\":[\"Think\",\"Abandon\",\"Forget\",\"Ignore\"],\"a\":0,\"ee\":\"To ponder means to think about something carefully.\",\"eh\":\"To ponder means to think about something carefully.\"},{\"n\":67,\"d\":\"\",\"se\":\"Choose the correct antonym for the word &ldquo;Artificial&rdquo;:\",\"sh\":\"Choose the correct antonym for the word &ldquo;Artificial&rdquo;:\",\"oe\":[\"Fake\",\"Natural\",\"Imitation\",\"Synthetic\"],\"oh\":[\"Fake\",\"Natural\",\"Imitation\",\"Synthetic\"],\"a\":1,\"ee\":\"Natural is the exact opposite of artificial.\",\"eh\":\"Natural is the exact opposite of artificial.\"},{\"n\":68,\"d\":\"\",\"se\":\"Identify the grammatical error in the following sentence: &ldquo;Each of the students are responsible for their work.&rdquo;\",\"sh\":\"Identify the grammatical error in the following sentence: &ldquo;Each of the students are responsible for their work.&rdquo;\",\"oe\":[\"their\",\"of the students\",\"are\",\"Each\"],\"oh\":[\"their\",\"of the students\",\"are\",\"Each\"],\"a\":2,\"ee\":\"The pronoun &quot;Each&quot; is singular and requires a singular verb. &quot;Are&quot; should be replaced with &quot;is&quot;.\",\"eh\":\"The pronoun &quot;Each&quot; is singular and requires a singular verb. &quot;Are&quot; should be replaced with &quot;is&quot;.\"},{\"n\":69,\"d\":\"\",\"se\":\"Fill in the blank with the correctly spelled word: &ldquo;He is ____ to learn new things.&rdquo;\",\"sh\":\"Fill in the blank with the correctly spelled word: &ldquo;He is ____ to learn new things.&rdquo;\",\"oe\":[\"eagar\",\"egre\",\"eger\",\"eager\"],\"oh\":[\"eagar\",\"egre\",\"eger\",\"eager\"],\"a\":3,\"ee\":\"Eager.\",\"eh\":\"Eager.\"},{\"n\":70,\"d\":\"\",\"se\":\"Choose the correct one‑word substitution for: &ldquo;A person who studies the origin and history of words.&rdquo;\",\"sh\":\"Choose the correct one‑word substitution for: &ldquo;A person who studies the origin and history of words.&rdquo;\",\"oe\":[\"Etymologist\",\"Grammarian\",\"Linguist\",\"Philologist\"],\"oh\":[\"Etymologist\",\"Grammarian\",\"Linguist\",\"Philologist\"],\"a\":0,\"ee\":\"Etymologist.\",\"eh\":\"Etymologist.\"},{\"n\":71,\"d\":\"\",\"se\":\"Change the voice of the sentence: &ldquo;The teacher praised the student.&rdquo;\",\"sh\":\"Change the voice of the sentence: &ldquo;The teacher praised the student.&rdquo;\",\"oe\":[\"The student is praised by the teacher\",\"The student was praised by the teacher\",\"The student has been praised by the teacher\",\"The student was being praised by the teacher\"],\"oh\":[\"The student is praised by the teacher\",\"The student was praised by the teacher\",\"The student has been praised by the teacher\",\"The student was being praised by the teacher\"],\"a\":1,\"ee\":\"The simple past active sentence correctly changes to simple past passive.\",\"eh\":\"The simple past active sentence correctly changes to simple past passive.\"},{\"n\":72,\"d\":\"\",\"se\":\"Choose the correct article to fill in the blank: &ldquo;She is ____ European.&rdquo;\",\"sh\":\"Choose the correct article to fill in the blank: &ldquo;She is ____ European.&rdquo;\",\"oe\":[\"no article\",\"an\",\"a\",\"the\"],\"oh\":[\"no article\",\"an\",\"a\",\"the\"],\"a\":2,\"ee\":\"The word &quot;European&quot; starts with a consonant sound ('Yoo'), so it takes &quot;a&quot;.\",\"eh\":\"The word &quot;European&quot; starts with a consonant sound ('Yoo'), so it takes &quot;a&quot;.\"},{\"n\":73,\"d\":\"\",\"se\":\"The English idiom &ldquo;To beat around the bush&rdquo; means:\",\"sh\":\"The English idiom &ldquo;To beat around the bush&rdquo; means:\",\"oe\":[\"To fight bravely\",\"To run away from danger\",\"To search thoroughly in the wild\",\"To avoid getting to the main point or topic\"],\"oh\":[\"To fight bravely\",\"To run away from danger\",\"To search thoroughly in the wild\",\"To avoid getting to the main point or topic\"],\"a\":3,\"ee\":\"To speak vaguely and avoid the main issue.\",\"eh\":\"To speak vaguely and avoid the main issue.\"},{\"n\":74,\"d\":\"\",\"se\":\"Choose the word with the correct spelling:\",\"sh\":\"Choose the word with the correct spelling:\",\"oe\":[\"Separate\",\"Seperete\",\"Seperate\",\"Seprate\"],\"oh\":[\"Separate\",\"Seperete\",\"Seperate\",\"Seprate\"],\"a\":0,\"ee\":\"Separate.\",\"eh\":\"Separate.\"},{\"n\":75,\"d\":\"\",\"se\":\"Identify the part of speech of the word &quot;quickly&quot; in the sentence: &ldquo;He ran quickly.&rdquo;\",\"sh\":\"Identify the part of speech of the word &quot;quickly&quot; in the sentence: &ldquo;He ran quickly.&rdquo;\",\"oe\":[\"Verb\",\"Adverb\",\"Adjective\",\"Noun\"],\"oh\":[\"Verb\",\"Adverb\",\"Adjective\",\"Noun\"],\"a\":1,\"ee\":\"Adverb (it modifies the verb &quot;ran&quot;).\",\"eh\":\"Adverb (it modifies the verb &quot;ran&quot;).\"},{\"n\":76,\"d\":\"\",\"se\":\"‘अनुकूल&rsquo; शब्द का सही विलोम क्या है?\",\"sh\":\"‘अनुकूल&rsquo; शब्द का सही विलोम क्या है?\",\"oe\":[\"समकूल\",\"शुभ\",\"प्रतिकूल\",\"सुखद\"],\"oh\":[\"समकूल\",\"शुभ\",\"प्रतिकूल\",\"सुखद\"],\"a\":2,\"ee\":\"'प्रतिकूल' (Opposite of favorable).\",\"eh\":\"'प्रतिकूल'।\"},{\"n\":77,\"d\":\"\",\"se\":\"वाक्यांश के लिए एक शब्द चुनें: &ldquo;जो कभी नहीं मरता&rdquo; –\",\"sh\":\"वाक्यांश के लिए एक शब्द चुनें: &ldquo;जो कभी नहीं मरता&rdquo; –\",\"oe\":[\"मर्त्य\",\"अनश्वर\",\"नश्वर\",\"अमर\"],\"oh\":[\"मर्त्य\",\"अनश्वर\",\"नश्वर\",\"अमर\"],\"a\":3,\"ee\":\"अमर (Immortal).\",\"eh\":\"अमर।\"},{\"n\":78,\"d\":\"\",\"se\":\"निम्नलिखित में से शुद्ध वर्तनी (Correct spelling) वाला शब्द कौन सा है?\",\"sh\":\"निम्नलिखित में से शुद्ध वर्तनी (Correct spelling) वाला शब्द कौन सा है?\",\"oe\":[\"अध्ययन\",\"अध्यान\",\"अध्ययन्न\",\"अध्यन\"],\"oh\":[\"अध्ययन\",\"अध्यान\",\"अध्ययन्न\",\"अध्यन\"],\"a\":0,\"ee\":\"अध्ययन.\",\"eh\":\"अध्ययन।\"},{\"n\":79,\"d\":\"\",\"se\":\"उचित कारक चिह्न से रिक्त स्थान भरें: &ldquo;राम ____ स्कूल जाता है।&rdquo;\",\"sh\":\"उचित कारक चिह्न से रिक्त स्थान भरें: &ldquo;राम ____ स्कूल जाता है।&rdquo;\",\"oe\":[\"के\",\"को\",\"से\",\"पर\"],\"oh\":[\"के\",\"को\",\"से\",\"पर\"],\"a\":1,\"ee\":\"राम (को) स्कूल जाता है (गंतव्य को दर्शाने के लिए)। यद्यपि बोलचाल में &quot;राम स्कूल जाता है&quot; बिना 'को' के भी सही है, किन्तु व्याकरणिक विकल्पों में गंतव्य के लिए 'को' सर्वाधिक उपयुक्त है।\",\"eh\":\"राम (को) स्कूल जाता है (गंतव्य को दर्शाने के लिए)। यद्यपि बोलचाल में &quot;राम स्कूल जाता है&quot; बिना 'को' के भी सही है, किन्तु व्याकरणिक विकल्पों में गंतव्य के लिए 'को' सर्वाधिक उपयुक्त है।\"},{\"n\":80,\"d\":\"\",\"se\":\"‘सिंह&rsquo; शब्द का सही स्त्रीलिंग रूप क्या है?\",\"sh\":\"‘सिंह&rsquo; शब्द का सही स्त्रीलिंग रूप क्या है?\",\"oe\":[\"सिंहिनी\",\"सिंहा\",\"सिंहनी\",\"सिंहिका\"],\"oh\":[\"सिंहिनी\",\"सिंहा\",\"सिंहनी\",\"सिंहिका\"],\"a\":2,\"ee\":\"सिंहनी.\",\"eh\":\"सिंहनी।\"},{\"n\":81,\"d\":\"\",\"se\":\"The first commercial coal mine in India was started in the year:\",\"sh\":\"भारत में पहली वाणिज्यिक कोयला खदान किस वर्ष शुरू की गई थी:\",\"oe\":[\"1900\",\"1950\",\"1850\",\"1774\"],\"oh\":[\"1900\",\"1950\",\"1850\",\"1774\"],\"a\":3,\"ee\":\"Started in Raniganj in 1774 by John Sumner and Suetonius Grant Heatly.\",\"eh\":\"1774 में जॉन समनर और सुएटोनियस ग्रांट हीटली द्वारा रानीगंज में शुरू की गई थी।\"},{\"n\":82,\"d\":\"\",\"se\":\"Which state is the primary operational base and one of the highest historical coal-producing regions housing SECL?\",\"sh\":\"वह राज्य कौन सा है जो SECL का प्राथमिक परिचालन आधार है और ऐतिहासिक रूप से सबसे अधिक कोयला उत्पादक क्षेत्रों में से एक है?\",\"oe\":[\"Chhattisgarh\",\"West Bengal\",\"Odisha\",\"Jharkhand\"],\"oh\":[\"छत्तीसगढ़\",\"पश्चिम बंगाल\",\"ओडिशा\",\"झारखंड\"],\"a\":0,\"ee\":\"Chhattisgarh is the operational heartland of South Eastern Coalfields Limited (SECL).\",\"eh\":\"छत्तीसगढ़ साउथ ईस्टर्न कोलफील्ड्स लिमिटेड (SECL) का परिचालन हृदयस्थल है।\"},{\"n\":83,\"d\":\"\",\"se\":\"The headquarters of the Coal Controller&rsquo;s Organisation (CCO) is situated in:\",\"sh\":\"कोयला नियंत्रक संगठन (Coal Controller&rsquo;s Organisation) का मुख्यालय कहाँ स्थित है:\",\"oe\":[\"Ranchi\",\"Kolkata\",\"Delhi\",\"Mumbai\"],\"oh\":[\"रांची\",\"कोलकाता\",\"दिल्ली\",\"मुंबई\"],\"a\":1,\"ee\":\"Kolkata.\",\"eh\":\"कोलकाता।\"},{\"n\":84,\"d\":\"\",\"se\":\"The 2026 Commonwealth Games are scheduled to be held in:\",\"sh\":\"2026 राष्ट्रमंडल खेल (Commonwealth Games) कहाँ आयोजित होने वाले हैं:\",\"oe\":[\"Birmingham\",\"Melbourne\",\"Glasgow\",\"London\"],\"oh\":[\"बर्मिंघम\",\"मेलबर्न\",\"ग्लासगो (Glasgow)\",\"लंदन\"],\"a\":2,\"ee\":\"Glasgow, Scotland secured the rights for a scaled-down version of the 2026 games.\",\"eh\":\"ग्लासगो, स्कॉटलैंड ने 2026 के खेलों के छोटे संस्करण के अधिकार हासिल किए।\"},{\"n\":85,\"d\":\"\",\"se\":\"Who is the current Prime Minister of India?\",\"sh\":\"भारत के वर्तमान प्रधानमंत्री कौन हैं?\",\"oe\":[\"Rahul Gandhi\",\"Amit Shah\",\"Manmohan Singh\",\"Narendra Modi\"],\"oh\":[\"राहुल गांधी\",\"अमित शाह\",\"मनमोहन सिंह\",\"नरेंद्र मोदी\"],\"a\":3,\"ee\":\"Narendra Modi.\",\"eh\":\"नरेंद्र मोदी।\"},{\"n\":86,\"d\":\"\",\"se\":\"The total number of schedules present in the Indian Constitution is:\",\"sh\":\"भारतीय संविधान में मौजूद अनुसूचियों (schedules) की कुल संख्या है:\",\"oe\":[\"12\",\"10\",\"22\",\"15\"],\"oh\":[\"12\",\"10\",\"22\",\"15\"],\"a\":0,\"ee\":\"The Constitution has 12 schedules.\",\"eh\":\"संविधान में 12 अनुसूचियां हैं।\"},{\"n\":87,\"d\":\"\",\"se\":\"The longest river in India (by length within the country's borders) is the:\",\"sh\":\"भारत की सबसे लंबी नदी (देश की सीमाओं के भीतर लंबाई के अनुसार) है:\",\"oe\":[\"Brahmaputra\",\"Ganga\",\"Godavari\",\"Yamuna\"],\"oh\":[\"ब्रह्मपुत्र\",\"गंगा\",\"गोदावरी\",\"यमुना\"],\"a\":1,\"ee\":\"The Ganga River.\",\"eh\":\"गंगा नदी।\"},{\"n\":88,\"d\":\"\",\"se\":\"Who was the first Indian citizen to be awarded a Nobel Prize?\",\"sh\":\"नोबेल पुरस्कार से सम्मानित होने वाले पहले भारतीय नागरिक कौन थे?\",\"oe\":[\"C.V. Raman\",\"Amartya Sen\",\"Rabindranath Tagore\",\"Mother Teresa\"],\"oh\":[\"सी.वी. रमन\",\"अमर्त्य सेन\",\"रवींद्रनाथ टैगोर\",\"मदर टेरेसा\"],\"a\":2,\"ee\":\"Rabindranath Tagore won the Nobel Prize in Literature in 1913.\",\"eh\":\"रवींद्रनाथ टैगोर ने 1913 में साहित्य का नोबेल पुरस्कार जीता था।\"},{\"n\":89,\"d\":\"\",\"se\":\"The capital city of Chhattisgarh is:\",\"sh\":\"छत्तीसगढ़ की राजधानी है:\",\"oe\":[\"Bilaspur\",\"Bhopal\",\"Ranchi\",\"Raipur\"],\"oh\":[\"बिलासपुर\",\"भोपाल\",\"रांची\",\"रायपुर\"],\"a\":3,\"ee\":\"Raipur.\",\"eh\":\"रायपुर।\"},{\"n\":90,\"d\":\"\",\"se\":\"In the context of India's power sector, what does NTPC stand for?\",\"sh\":\"भारत के बिजली क्षेत्र के संदर्भ में, NTPC का पूर्ण रूप क्या है?\",\"oe\":[\"National Thermal Power Corporation\",\"National Transmission Power Company\",\"National Trade Promotion Corporation\",\"Nuclear Thermal Power Corporation\"],\"oh\":[\"नेशनल थर्मल पावर कॉर्पोरेशन (National Thermal Power Corporation)\",\"नेशनल ट्रांसमिशन पावर कंपनी\",\"नेशनल ट्रेड प्रमोशन कॉर्पोरेशन\",\"न्यूक्लियर थर्मल पावर कॉर्पोरेशन\"],\"a\":0,\"ee\":\"National Thermal Power Corporation.\",\"eh\":\"नेशनल थर्मल पावर कॉर्पोरेशन।\"},{\"n\":91,\"d\":\"\",\"se\":\"South Eastern Coalfields Limited (SECL) was established as a subsidiary of Coal India Limited (CIL) in the year:\",\"sh\":\"साउथ ईस्टर्न कोलफील्ड्स लिमिटेड (SECL) की स्थापना कोल इंडिया लिमिटेड (CIL) की सहायक कंपनी के रूप में किस वर्ष की गई थी:\",\"oe\":[\"1990\",\"1985\",\"2000\",\"1975\"],\"oh\":[\"1990\",\"1985\",\"2000\",\"1975\"],\"a\":1,\"ee\":\"SECL was founded in 1985.\",\"eh\":\"SECL की स्थापना 1985 में हुई थी।\"},{\"n\":92,\"d\":\"\",\"se\":\"The latest active National Coal Wage Agreement regulating salaries for non-executive coal workers is:\",\"sh\":\"गैर-कार्यकारी कोयला श्रमिकों के वेतन को विनियमित करने वाला नवीनतम सक्रिय राष्ट्रीय कोयला वेतन समझौता (National Coal Wage Agreement) है:\",\"oe\":[\"NCWA‑X\",\"NCWA‑IX\",\"NCWA‑XI\",\"NCWA‑XII\"],\"oh\":[\"NCWA-X\",\"NCWA-IX\",\"NCWA-XI\",\"NCWA-XII\"],\"a\":2,\"ee\":\"NCWA‑XI (effective till June 2026).\",\"eh\":\"NCWA-XI (जून 2026 तक प्रभावी)।\"},{\"n\":93,\"d\":\"\",\"se\":\"In the context of coal employees' benefits, the full form of CMPF is:\",\"sh\":\"कोयला कर्मचारियों के लाभ के संदर्भ में, CMPF का पूर्ण रूप है:\",\"oe\":[\"Coal and Mines Provident Fund\",\"Central Mines Provident Fund\",\"Coal Mining Provident Fund\",\"Coal Mines Provident Fund\"],\"oh\":[\"कोल एंड माइंस प्रोविडेंट फंड\",\"सेंट्रल माइंस प्रोविडेंट फंड\",\"कोल माइनिंग प्रोविडेंट फंड\",\"कोल माइंस प्रोविडेंट फंड (Coal Mines Provident Fund)\"],\"a\":3,\"ee\":\"Coal Mines Provident Fund.\",\"eh\":\"कोल माइंस प्रोविडेंट फंड।\"},{\"n\":94,\"d\":\"\",\"se\":\"Similarly, the full form of CMPS is:\",\"sh\":\"इसी तरह, CMPS का पूर्ण रूप है:\",\"oe\":[\"Coal Mines Pension Scheme\",\"Central Mines Pension Scheme\",\"Coal Mines Provident Scheme\",\"Coal Mining Pension Scheme\"],\"oh\":[\"कोल माइंस पेंशन स्कीम (Coal Mines Pension Scheme)\",\"सेंट्रल माइंस पेंशन स्कीम\",\"कोल माइंस प्रोविडेंट स्कीम\",\"कोल माइनिंग पेंशन स्कीम\"],\"a\":0,\"ee\":\"Coal Mines Pension Scheme (implemented under the 1998 act).\",\"eh\":\"कोल माइंस पेंशन स्कीम (1998 अधिनियम के तहत लागू)।\"},{\"n\":95,\"d\":\"\",\"se\":\"Including CMPDIL (the planning and design subsidiary), the total number of fully owned subsidiaries of CIL is:\",\"sh\":\"CMPDIL (योजना और डिजाइन सहायक कंपनी) सहित, CIL की पूर्ण स्वामित्व वाली सहायक कंपनियों की कुल संख्या है:\",\"oe\":[\"9\",\"8\",\"10\",\"7\"],\"oh\":[\"9\",\"8\",\"10\",\"7\"],\"a\":1,\"ee\":\"8 subsidiaries.\",\"eh\":\"8 सहायक कंपनियां।\"},{\"n\":96,\"d\":\"\",\"se\":\"A core part of the vision of Coal India Limited is to:\",\"sh\":\"कोल इंडिया लिमिटेड के दृष्टिकोण (Vision) का एक मुख्य हिस्सा है:\",\"oe\":[\"Emerge as a profit‑maximizing private monopoly\",\"Focus exclusively on exporting coal to Europe\",\"Emerge as a global player in the primary energy sector committed to provide energy security\",\"Transition entirely away from coal within a decade\"],\"oh\":[\"लाभ-अधिकतम करने वाले निजी एकाधिकार के रूप में उभरना\",\"केवल यूरोप को कोयला निर्यात करने पर ध्यान केंद्रित करना\",\"ऊर्जा सुरक्षा प्रदान करने के लिए प्राथमिक ऊर्जा क्षेत्र में एक वैश्विक खिलाड़ी के रूप में उभरना\",\"एक दशक के भीतर पूरी तरह से कोयले से दूर जाना\"],\"a\":2,\"ee\":\"The vision stresses energy security and global standards.\",\"eh\":\"यह दृष्टिकोण ऊर्जा सुरक्षा और वैश्विक मानकों पर जोर देता है।\"},{\"n\":97,\"d\":\"\",\"se\":\"The coal mining methods currently utilized in SECL operations are:\",\"sh\":\"SECL के संचालन में वर्तमान में उपयोग की जाने वाली कोयला खनन विधियाँ हैं:\",\"oe\":[\"Only Opencast Mining\",\"Only Underground Mining\",\"Both Opencast and Underground Mining\",\"Offshore Drilling\"],\"oh\":[\"केवल ओपनकास्ट खनन\",\"केवल भूमिगत खनन\",\"ओपनकास्ट और भूमिगत खनन दोनों\",\"अपतटीय (Offshore) ड्रिलिंग\"],\"a\":2,\"ee\":\"SECL manages a mix of large opencast and underground mines.\",\"eh\":\"SECL बड़ी ओपनकास्ट और भूमिगत (underground) दोनों खदानों का मिश्रण प्रबंधित करती है।\"},{\"n\":98,\"d\":\"\",\"se\":\"The standing orders dictating service conditions for SECL workmen are legally certified under the:\",\"sh\":\"SECL के कर्मचारियों के लिए सेवा शर्तों को निर्देशित करने वाले स्थायी आदेश (Standing orders) कानूनी रूप से किसके तहत प्रमाणित हैं:\",\"oe\":[\"Factories Act, 1948\",\"Companies Act, 2013\",\"Mines Act, 1952\",\"Industrial Employment (Standing Orders) Act, 1946\"],\"oh\":[\"कारखाना अधिनियम, 1948\",\"कंपनी अधिनियम, 2013\",\"खान अधिनियम, 1952\",\"औद्योगिक रोजगार (स्थायी आदेश) अधिनियम, 1946\"],\"a\":3,\"ee\":\"The Industrial Employment (Standing Orders) Act, 1946.\",\"eh\":\"औद्योगिक रोजगार (स्थायी आदेश) अधिनियम, 1946।\"},{\"n\":99,\"d\":\"\",\"se\":\"The total sanctioned and active manpower of Coal India Limited is approximately:\",\"sh\":\"कोल इंडिया लिमिटेड की कुल स्वीकृत और सक्रिय जनशक्ति (Manpower) लगभग है:\",\"oe\":[\"2.3 to 2.5 lakh\",\"3.5 lakh\",\"4 lakh\",\"1.5 lakh\"],\"oh\":[\"2.3 से 2.5 लाख\",\"3.5 लाख\",\"4 लाख\",\"1.5 लाख\"],\"a\":0,\"ee\":\"The workforce is roughly around 2.4 lakh employees.\",\"eh\":\"CIL का कार्यबल लगभग 2.4 लाख कर्मचारियों के आसपास है।\"},{\"n\":100,\"d\":\"\",\"se\":\"The Rajbhasha Adhiniyam, dictating the official use of Hindi in CIL documentation, is legally known as the:\",\"sh\":\"राजभाषा अधिनियम, जो CIL दस्तावेज़ीकरण में हिंदी के आधिकारिक उपयोग को निर्देशित करता है, कानूनी रूप से किस नाम से जाना जाता है:\",\"oe\":[\"Mines Act, 1952\",\"Official Languages Act, 1963\",\"Companies Act, 2013\",\"Constitution of India (Article 370)\"],\"oh\":[\"खान अधिनियम, 1952\",\"राजभाषा अधिनियम, 1963 (Official Languages Act, 1963)\",\"कंपनी अधिनियम, 2013\",\"भारत का संविधान (अनुच्छेद 370)\"],\"a\":1,\"ee\":\"The Official Languages Act, 1963.\",\"eh\":\"राजभाषा अधिनियम, 1963।\"}]},{\"id\":\"ahp5\",\"num\":5,\"name\":\"High Probability Paper 5\",\"sub\":\"99 questions · 99 bilingual\",\"q\":[{\"n\":1,\"d\":\"\",\"se\":\"At the time of dissolution of a partnership firm, the profit on the realisation of assets is transferred to the:\",\"sh\":\"साझेदारी फर्म के विघटन (Dissolution) के समय, संपत्तियों की वसूली (realisation) पर होने वाले लाभ को कहाँ स्थानांतरित किया जाता है:\",\"oe\":[\"Realisation account (credited)\",\"Partners&rsquo; loan accounts\",\"Partners&rsquo; capital accounts in their profit‑sharing ratio\",\"Profit &amp; Loss account\"],\"oh\":[\"वसूली खाते (Realisation A/c) में क्रेडिट\",\"साझेदारों के ऋण खातों में\",\"साझेदारों के पूंजी खातों में उनके लाभ-विभाजन अनुपात में\",\"लाभ और हानि खाते में\"],\"a\":2,\"ee\":\"Profit or loss on realisation belongs to the partners and is distributed in their agreed profit‑sharing ratio.\",\"eh\":\"वसूली पर लाभ या हानि साझेदारों की होती है और इसे उनके सहमत लाभ-विभाजन अनुपात में वितरित किया जाता है।\"},{\"n\":2,\"d\":\"\",\"se\":\"A bill of exchange is drawn for ₹10,000 on 1st January 2024, payable 3 months after date. The bill is discounted at the bank immediately at 12% p.a. The amount of discount charged by the bank is:\",\"sh\":\"1 जनवरी 2024 को ₹10,000 का एक विनिमय विपत्र (Bill of exchange) लिखा गया, जो 3 महीने बाद देय है। बिल को तुरंत बैंक में 12% प्रति वर्ष की दर से भुनाया (Discount) जाता है। बैंक द्वारा काटी गई छूट की राशि क्या है:\",\"oe\":[\"₹400\",\"₹360\",\"₹500\",\"₹300\"],\"oh\":[\"₹400\",\"₹360\",\"₹500\",\"₹300\"],\"a\":3,\"ee\":\"Discount = ₹10,000 × (12/100) × (3/12) = ₹300.\",\"eh\":\"छूट (Discount) = ₹10,000 × (12/100) × (3/12) = ₹300।\"},{\"n\":3,\"d\":\"\",\"se\":\"Goods costing ₹50,000 are sent on consignment. The consignor pays ₹2,000 for packing and freight. The consignee successfully sells 80% of the goods for ₹60,000. What is the value of the closing stock on consignment?\",\"sh\":\"₹50,000 की लागत का माल कंसाइनमेंट (Consignment) पर भेजा जाता है। प्रेषक (consignor) पैकिंग और माल ढुलाई के लिए ₹2,000 का भुगतान करता है। प्राप्तकर्ता (consignee) 80% माल को ₹60,000 में सफलतापूर्वक बेच देता है। कंसाइनमेंट पर अंतिम स्टॉक (closing stock) का मूल्य क्या है?\",\"oe\":[\"₹10,400\",\"₹10,000\",\"₹12,000\",\"₹8,000\"],\"oh\":[\"₹10,400\",\"₹10,000\",\"₹12,000\",\"₹8,000\"],\"a\":0,\"ee\":\"Total cost incurred = 50,000 + 2,000 = ₹52,000. Unsold stock = 20%. Value = 20% of 52,000 = ₹10,400.\",\"eh\":\"कुल लागत = 50,000 + 2,000 = ₹52,000। बिना बिका स्टॉक = 20%। मूल्य = 52,000 का 20% = ₹10,400।\"},{\"n\":4,\"d\":\"\",\"se\":\"In the final accounts, outstanding salaries are presented:\",\"sh\":\"अंतिम खातों (Final accounts) में, अदत्त वेतन (outstanding salaries) प्रस्तुत किया जाता है:\",\"oe\":[\"On the assets side of the balance sheet\",\"On the liabilities side of the balance sheet\",\"In the trading account\",\"In the profit &amp; loss appropriation account\"],\"oh\":[\"बैलेंस शीट के संपत्ति (assets) पक्ष में\",\"बैलेंस शीट के दायित्व (liabilities) पक्ष में\",\"व्यापार खाते (Trading A/c) में\",\"लाभ और हानि विनियोग खाते में\"],\"a\":1,\"ee\":\"Outstanding expenses represent unpaid obligations, hence they are current liabilities.\",\"eh\":\"अदत्त व्यय अवैतनिक दायित्वों का प्रतिनिधित्व करते हैं, इसलिए वे चालू दायित्व (current liabilities) हैं।\"},{\"n\":5,\"d\":\"\",\"se\":\"A company has issued debentures of ₹10,00,000 at a discount of 10%. The &quot;discount on issue of debentures&quot; is classified as a:\",\"sh\":\"एक कंपनी ने 10% की छूट पर ₹10,00,000 के डिबेंचर जारी किए हैं। &quot;डिबेंचर जारी करने पर छूट&quot; को किस रूप में वर्गीकृत किया जाता है:\",\"oe\":[\"Revenue loss\",\"Current Asset\",\"Fictitious asset / Unamortized expenditure\",\"Capital loss\"],\"oh\":[\"राजस्व हानि\",\"चालू संपत्ति\",\"कृत्रिम संपत्ति (Fictitious asset) / असमायोजित व्यय\",\"पूंजीगत हानि\"],\"a\":2,\"ee\":\"It is shown on the asset side as an unamortized expense (fictitious asset) until it is written off.\",\"eh\":\"इसे अपलिखित (written off) होने तक परिसंपत्ति पक्ष में असमायोजित व्यय (कृत्रिम संपत्ति) के रूप में दिखाया जाता है।\"},{\"n\":6,\"d\":\"\",\"se\":\"Examine the following balances of a company: Equity share capital ₹5,00,000; Reserves ₹1,00,000; 10% Debentures ₹2,00,000; Current liabilities ₹1,50,000; Fixed assets ₹6,00,000; Current assets ₹3,50,000. What is the debt‑equity ratio?\",\"sh\":\"एक कंपनी के निम्नलिखित शेषों की जांच करें: इक्विटी शेयर पूंजी ₹5,00,000; संचय ₹1,00,000; 10% डिबेंचर ₹2,00,000; चालू दायित्व ₹1,50,000; स्थायी संपत्तियां ₹6,00,000; चालू संपत्तियां ₹3,50,000। ऋण-इक्विटी (Debt-equity) अनुपात क्या है?\",\"oe\":[\"1.00\",\"0.50\",\"0.67\",\"0.33\"],\"oh\":[\"1.00\",\"0.50\",\"0.67\",\"0.33\"],\"a\":3,\"ee\":\"Debt (Long-term) = ₹2,00,000. Equity (Share Capital + Reserves) = ₹6,00,000. Ratio = 2,00,000 / 6,00,000 = 1/3 = 0.33.\",\"eh\":\"ऋण (दीर्घकालिक) = ₹2,00,000। इक्विटी (शेयर पूंजी + संचय) = ₹6,00,000। अनुपात = 2,00,000 / 6,00,000 = 1/3 = 0.33।\"},{\"n\":7,\"d\":\"\",\"se\":\"When a new partner is admitted, the premium for goodwill brought in cash is shared by the old partners in their:\",\"sh\":\"जब एक नया साझेदार प्रवेश करता है, तो नकद में लाई गई ख्याति (goodwill) के प्रीमियम को पुराने साझेदारों द्वारा साझा किया जाता है:\",\"oe\":[\"Sacrificing ratio\",\"New ratio\",\"Gaining ratio\",\"Old profit‑sharing ratio\"],\"oh\":[\"त्याग अनुपात (Sacrificing ratio) में\",\"नए अनुपात में\",\"लाभ-प्राप्ति अनुपात (Gaining ratio) में\",\"पुराने लाभ-विभाजन अनुपात में\"],\"a\":0,\"ee\":\"It compensates the old partners for the exact share of profit they sacrificed for the new partner.\",\"eh\":\"यह पुराने साझेदारों को नए साझेदार के लिए उनके द्वारा त्यागे गए लाभ के हिस्से की भरपाई करता है।\"},{\"n\":8,\"d\":\"\",\"se\":\"The profit on the revaluation of assets at the time of retirement of a partner is credited to:\",\"sh\":\"किसी साझेदार की सेवानिवृत्ति के समय संपत्तियों के पुनर्मूल्यांकन पर लाभ को क्रेडिट किया जाता है:\",\"oe\":[\"Revaluation account\",\"All partners&rsquo; capital accounts in the old ratio\",\"Only the retiring partner's account\",\"Continuing partners only in the new ratio\"],\"oh\":[\"पुनर्मूल्यांकन खाते में\",\"पुराने अनुपात में सभी साझेदारों के पूंजी खातों में\",\"केवल सेवानिवृत्त होने वाले साझेदार के खाते में\",\"केवल नए अनुपात में चालू (continuing) साझेदारों को\"],\"a\":1,\"ee\":\"The revaluation profit belongs to all partners (including the retiring one) in their old ratio.\",\"eh\":\"पुनर्मूल्यांकन लाभ पुराने अनुपात में सभी साझेदारों (सेवानिवृत्त होने वाले सहित) का होता है।\"},{\"n\":9,\"d\":\"\",\"se\":\"A company forfeited 200 shares of ₹10 each (₹8 called‑up) on which only ₹6 per share has been paid. The Share Forfeiture account will be credited with:\",\"sh\":\"एक कंपनी ने ₹10 के 200 शेयर जब्त किए (₹8 मांगे गए/called-up) जिन पर केवल ₹6 प्रति शेयर का भुगतान किया गया है। शेयर जब्ती खाते (Share Forfeiture A/c) को कितनी राशि से क्रेडिट किया जाएगा:\",\"oe\":[\"₹2,000\",\"₹800\",\"₹1,200\",\"₹1,600\"],\"oh\":[\"₹2,000\",\"₹800\",\"₹1,200\",\"₹1,600\"],\"a\":2,\"ee\":\"The forfeiture account only reflects the amount actually received so far. 200 × ₹6 = ₹1,200.\",\"eh\":\"जब्ती खाता केवल अब तक वास्तव में प्राप्त राशि को दर्शाता है। 200 × ₹6 = ₹1,200।\"},{\"n\":10,\"d\":\"\",\"se\":\"The Balance Sheet is fundamentally prepared on the assumption of the:\",\"sh\":\"बैलेंस शीट मौलिक रूप से किस धारणा पर तैयार की जाती है:\",\"oe\":[\"Realization concept\",\"Accrual concept\",\"Matching concept\",\"Going concern concept\"],\"oh\":[\"वसूली अवधारणा\",\"उपार्जन अवधारणा\",\"मिलान अवधारणा\",\"चालू व्यापार अवधारणा (Going concern concept)\"],\"a\":3,\"ee\":\"Assets and liabilities are recorded assuming the business will continue its operations indefinitely.\",\"eh\":\"यह मानकर संपत्तियां और दायित्व दर्ज किए जाते हैं कि व्यवसाय अपना संचालन अनिश्चित काल तक जारी रखेगा।\"},{\"n\":11,\"d\":\"\",\"se\":\"In the absence of a partnership deed, what is the statutory rate of interest on a partner&rsquo;s loan to the firm?\",\"sh\":\"साझेदारी विलेख के अभाव में, फर्म को दिए गए किसी साझेदार के ऋण पर वैधानिक ब्याज दर क्या है?\",\"oe\":[\"6% p.a\",\"8% p.a\",\"12% p.a\",\"10% p.a\"],\"oh\":[\"6% प्रति वर्ष\",\"8% प्रति वर्ष\",\"12% प्रति वर्ष\",\"10% प्रति वर्ष\"],\"a\":0,\"ee\":\"6% per annum as per the Indian Partnership Act, 1932.\",\"eh\":\"भारतीय साझेदारी अधिनियम, 1932 के अनुसार 6% प्रति वर्ष।\"},{\"n\":12,\"d\":\"\",\"se\":\"The amount of goodwill on the admission of a partner is adjusted through the partners&rsquo; capital accounts strictly in their:\",\"sh\":\"एक साझेदार के प्रवेश पर ख्याति की राशि को साझेदारों के पूंजी खातों के माध्यम से कड़ाई से किस अनुपात में समायोजित किया जाता है:\",\"oe\":[\"Capital ratio\",\"Sacrificing ratio\",\"Gaining ratio\",\"Profit‑sharing ratio\"],\"oh\":[\"पूंजी अनुपात\",\"त्याग अनुपात (Sacrificing ratio)\",\"लाभ-प्राप्ति अनुपात\",\"लाभ-विभाजन अनुपात\"],\"a\":1,\"ee\":\"Sacrificing ratio.\",\"eh\":\"त्याग अनुपात (Sacrificing ratio)।\"},{\"n\":13,\"d\":\"\",\"se\":\"The provision for doubtful debts is created by debiting the:\",\"sh\":\"संदिग्ध ऋणों के लिए प्रावधान (Provision for doubtful debts) किसे डेबिट करके बनाया जाता है:\",\"oe\":[\"Bad Debts Account\",\"Debtors Account\",\"Profit &amp; Loss Account\",\"Provision Account\"],\"oh\":[\"डूबत ऋण खाता\",\"देनदार खाता\",\"लाभ और हानि खाता (P&amp;L A/c)\",\"प्रावधान खाता\"],\"a\":2,\"ee\":\"It is an anticipated expense/loss charged to the P&amp;L Account.\",\"eh\":\"यह एक प्रत्याशित व्यय/हानि है जो P&amp;L खाते से प्रभारित (charged) होती है।\"},{\"n\":14,\"d\":\"\",\"se\":\"A company purchased machinery for ₹4,00,000 and spent ₹40,000 on its erection. Depreciation is charged at 10% p.a. on the Written Down Value (WDV). The depreciation for the second year is:\",\"sh\":\"एक कंपनी ने ₹4,00,000 में मशीनरी खरीदी और उसे लगाने पर ₹40,000 खर्च किए। मूल्यह्रास लिखित मूल्य (WDV) पर 10% प्रति वर्ष की दर से लिया जाता है। दूसरे वर्ष के लिए मूल्यह्रास है:\",\"oe\":[\"₹40,000\",\"₹48,400\",\"₹44,000\",\"₹39,600\"],\"oh\":[\"₹40,000\",\"₹48,400\",\"₹44,000\",\"₹39,600\"],\"a\":3,\"ee\":\"Total initial cost = 4,40,000. Year 1 depreciation = 44,000. WDV at start of Year 2 = 3,96,000. Year 2 depreciation = 10% of 3,96,000 = ₹39,600.\",\"eh\":\"कुल प्रारंभिक लागत = 4,40,000। वर्ष 1 मूल्यह्रास = 44,000। दूसरे वर्ष की शुरुआत में WDV = 3,96,000। वर्ष 2 का मूल्यह्रास = 3,96,000 का 10% = ₹39,600।\"},{\"n\":15,\"d\":\"\",\"se\":\"The remaining balance in the Share Forfeiture account, after the re‑issue of all those forfeited shares, is transferred to the:\",\"sh\":\"जब्त किए गए सभी शेयरों को फिर से जारी (re-issue) करने के बाद शेयर जब्ती खाते में शेष बची राशि को स्थानांतरित किया जाता है:\",\"oe\":[\"Capital Reserve\",\"Profit &amp; Loss account\",\"General Reserve\",\"Securities Premium\"],\"oh\":[\"पूंजीगत संचय (Capital Reserve) में\",\"लाभ और हानि खाते में\",\"सामान्य संचय में\",\"प्रतिभूति प्रीमियम में\"],\"a\":0,\"ee\":\"It is treated as a capital profit.\",\"eh\":\"इसे पूंजीगत लाभ (Capital profit) माना जाता है।\"},{\"n\":16,\"d\":\"\",\"se\":\"Under the advance tax payment schedule for individuals (old tax regime) for the financial year 2025‑26, the first instalment (15% of the total estimated tax) is due on or before:\",\"sh\":\"वित्तीय वर्ष 2025-26 के लिए व्यक्तियों (पुरानी कर व्यवस्था) के लिए अग्रिम कर (Advance tax) भुगतान अनुसूची के तहत, पहली किस्त (कुल अनुमानित कर का 15%) कब तक देय है:\",\"oe\":[\"15th September\",\"15th June\",\"15th March\",\"15th December\"],\"oh\":[\"15 सितंबर\",\"15 जून\",\"15 मार्च\",\"15 दिसंबर\"],\"a\":1,\"ee\":\"15th June.\",\"eh\":\"15 जून।\"},{\"n\":17,\"d\":\"\",\"se\":\"Under GST, the threshold for mandatory registration for an exclusive supplier of goods (in normal category states) is an aggregate turnover exceeding:\",\"sh\":\"जीएसटी (GST) के तहत, विशेष राज्यों को छोड़कर सामान्य श्रेणी के राज्यों में वस्तुओं के विशेष आपूर्तिकर्ता के लिए अनिवार्य पंजीकरण की सीमा (कुल टर्नओवर) है:\",\"oe\":[\"₹5 crore\",\"₹20 lakh\",\"₹40 lakh\",\"₹1 crore\"],\"oh\":[\"₹5 करोड़\",\"₹20 लाख\",\"₹40 लाख\",\"₹1 करोड़\"],\"a\":2,\"ee\":\"₹40 lakh.\",\"eh\":\"₹40 लाख।\"},{\"n\":19,\"d\":\"\",\"se\":\"The GST Compensation Cess is explicitly levied to compensate states for revenue loss and is applied on:\",\"sh\":\"जीएसटी मुआवजा उपकर (GST Compensation Cess) विशेष रूप से राजस्व हानि के लिए राज्यों को क्षतिपूर्ति करने के लिए लगाया जाता है और यह लागू होता है:\",\"oe\":[\"All goods and services uniformly\",\"Zero-rated exports\",\"Essential imported goods\",\"Luxury and demerit (sin) goods\"],\"oh\":[\"सभी वस्तुओं और सेवाओं पर समान रूप से\",\"शून्य-रेटेड निर्यात पर\",\"केवल आवश्यक आयातित वस्तुओं पर\",\"विलासिता (Luxury) और अवगुण (Demerit) वस्तुओं पर\"],\"a\":3,\"ee\":\"Applied on aerated water, tobacco, automobiles, etc.\",\"eh\":\"वातित जल, तंबाकू, ऑटोमोबाइल आदि पर लागू होता है।\"},{\"n\":20,\"d\":\"\",\"se\":\"What is the maximum aggregate amount of deduction permitted under Section 80C of the Income Tax Act (Old Tax Regime)?\",\"sh\":\"आयकर अधिनियम (पुरानी कर व्यवस्था) की धारा 80C के तहत अनुमत कटौती की अधिकतम कुल राशि क्या है?\",\"oe\":[\"₹1,50,000\",\"₹1,00,000\",\"₹2,00,000\",\"₹2,50,000\"],\"oh\":[\"₹1,50,000\",\"₹1,00,000\",\"₹2,00,000\",\"₹2,50,000\"],\"a\":0,\"ee\":\"₹1.5 Lakhs.\",\"eh\":\"₹1.5 लाख।\"},{\"n\":21,\"d\":\"\",\"se\":\"The time limit for filing a revised return (under Section 139(5)) under the Income Tax Act is:\",\"sh\":\"आयकर अधिनियम के तहत (धारा 139(5)) संशोधित रिटर्न (Revised return) दाखिल करने की समय सीमा क्या है:\",\"oe\":[\"Never; revisions are not allowed\",\"Before the end of the relevant assessment year or completion of assessment, whichever is earlier\",\"Within 2 years of the assessment year\",\"Exactly 6 months after the due date\"],\"oh\":[\"कभी नहीं; संशोधन की अनुमति नहीं है\",\"संबंधित आकलन वर्ष (Assessment year) की समाप्ति से पहले या आकलन पूरा होने से पहले, जो भी पहले हो\",\"आकलन वर्ष के 2 साल के भीतर\",\"नियत तिथि के ठीक 6 महीने बाद\"],\"a\":1,\"ee\":\"On or before the end of the relevant Assessment Year or before the completion of the assessment, whichever is earlier.\",\"eh\":\"आकलन वर्ष की समाप्ति से पहले या आकलन पूरा होने से पहले, जो भी पहले हो।\"},{\"n\":22,\"d\":\"\",\"se\":\"Under GST regulations, what is the 'place of supply' for services directly related to immovable property (like architecture or construction)?\",\"sh\":\"जीएसटी नियमों के तहत, अचल संपत्ति (जैसे वास्तुकला या निर्माण) से सीधे संबंधित सेवाओं के लिए 'आपूर्ति का स्थान' (place of supply) क्या है?\",\"oe\":[\"Location of the service provider\",\"Location of the recipient's registered office\",\"Location of the immovable property\",\"Location of the billing address\"],\"oh\":[\"सेवा प्रदाता का स्थान\",\"प्राप्तकर्ता के पंजीकृत कार्यालय का स्थान\",\"अचल संपत्ति का स्थान (Location of the immovable property)\",\"बिलिंग पते का स्थान\"],\"a\":2,\"ee\":\"Where the property is located.\",\"eh\":\"अचल संपत्ति जहाँ स्थित है।\"},{\"n\":23,\"d\":\"\",\"se\":\"What is the statutory rate of interest charged on the delayed payment of GST output tax?\",\"sh\":\"जीएसटी आउटपुट टैक्स के विलंबित भुगतान पर लगाया जाने वाला वैधानिक ब्याज दर क्या है?\",\"oe\":[\"10% p.a\",\"12% p.a\",\"24% p.a\",\"18% p.a\"],\"oh\":[\"10% प्रति वर्ष\",\"12% प्रति वर्ष\",\"24% प्रति वर्ष\",\"18% प्रति वर्ष\"],\"a\":3,\"ee\":\"18% per annum.\",\"eh\":\"18% प्रति वर्ष।\"},{\"n\":24,\"d\":\"\",\"se\":\"In MS PowerPoint, the shortcut key to start a slideshow from the very beginning is:\",\"sh\":\"MS PowerPoint में, शुरू से ही स्लाइड शो प्रारंभ करने के लिए शॉर्टकट कुंजी क्या है:\",\"oe\":[\"F5\",\"F9\",\"Shift + F5\",\"F7\"],\"oh\":[\"F5\",\"F9\",\"Shift + F5\",\"F7\"],\"a\":0,\"ee\":\"F5 (Shift + F5 starts from the current slide).\",\"eh\":\"F5 (Shift + F5 वर्तमान स्लाइड से प्रारंभ करता है)।\"},{\"n\":25,\"d\":\"\",\"se\":\"Which of the following is classified as &quot;System Software&quot;?\",\"sh\":\"निम्नलिखित में से किसे &quot;सिस्टम सॉफ्टवेयर&quot; (System Software) के रूप में वर्गीकृत किया गया है?\",\"oe\":[\"MS Excel\",\"Windows 11\",\"Adobe Photoshop\",\"MS Word\"],\"oh\":[\"MS Excel\",\"Windows 11\",\"Adobe Photoshop\",\"MS Word\"],\"a\":1,\"ee\":\"Operating systems like Windows are system software.\",\"eh\":\"Windows जैसे ऑपरेटिंग सिस्टम सिस्टम सॉफ्टवेयर हैं।\"},{\"n\":26,\"d\":\"\",\"se\":\"The full form of URL in internet terminology is:\",\"sh\":\"इंटरनेट शब्दावली में URL का पूर्ण रूप है:\",\"oe\":[\"Universal Resource Link\",\"Uniform Resource Link\",\"Uniform Resource Locator\",\"Universal Resource Locator\"],\"oh\":[\"यूनिवर्सल रिसोर्स लिंक\",\"यूनिफ़ॉर्म रिसोर्स लिंक\",\"यूनिफ़ॉर्म रिसोर्स लोकेटर (Uniform Resource Locator)\",\"यूनिवर्सल रिसोर्स लोकेटर\"],\"a\":2,\"ee\":\"Uniform Resource Locator.\",\"eh\":\"यूनिफ़ॉर्म रिसोर्स लोकेटर।\"},{\"n\":27,\"d\":\"\",\"se\":\"In MS Excel, which function is used to count the number of cells in a range that are not empty?\",\"sh\":\"MS Excel में, उन सेलों की संख्या गिनने के लिए किस फ़ंक्शन का उपयोग किया जाता है जो खाली (blank) नहीं हैं?\",\"oe\":[\"COUNTIF\",\"COUNT\",\"COUNTBLANK\",\"COUNTA\"],\"oh\":[\"COUNTIF\",\"COUNT\",\"COUNTBLANK\",\"COUNTA\"],\"a\":3,\"ee\":\"COUNTA (COUNT only counts cells containing numbers).\",\"eh\":\"COUNTA (केवल COUNT उन सेलों को गिनता है जिनमें संख्याएँ होती हैं)।\"},{\"n\":28,\"d\":\"\",\"se\":\"The non-volatile memory used to store essential startup instructions (firmware) permanently is:\",\"sh\":\"आवश्यक स्टार्टअप निर्देशों (फ़र्मवेयर) को स्थायी रूप से संग्रहीत करने के लिए उपयोग की जाने वाली गैर-वाष्पशील (Non-volatile) मेमोरी है:\",\"oe\":[\"ROM\",\"Cache\",\"RAM\",\"Register\"],\"oh\":[\"ROM\",\"Cache\",\"RAM\",\"Register\"],\"a\":0,\"ee\":\"ROM (Read-Only Memory).\",\"eh\":\"ROM (रीड-ओनली मेमोरी)।\"},{\"n\":29,\"d\":\"\",\"se\":\"Which of the following is a &quot;Search Engine&quot;?\",\"sh\":\"निम्नलिखित में से कौन सा &quot;सर्च इंजन&quot; (Search Engine) है?\",\"oe\":[\"Mozilla Firefox\",\"Google\",\"Chrome\",\"Internet Explorer\"],\"oh\":[\"Mozilla Firefox\",\"Google\",\"Chrome\",\"Internet Explorer\"],\"a\":1,\"ee\":\"Google. (The others are web browsers).\",\"eh\":\"Google। (अन्य वेब ब्राउज़र हैं)।\"},{\"n\":30,\"d\":\"\",\"se\":\"The default file extension for a Word document in MS Office 2019/365 is:\",\"sh\":\"MS Office 2019/365 में Word दस्तावेज़ के लिए डिफ़ॉल्ट फ़ाइल एक्सटेंशन है:\",\"oe\":[\"pdf\",\"doc\",\"docx\",\"txt\"],\"oh\":[\"pdf\",\"doc\",\"docx\",\"txt\"],\"a\":2,\"ee\":\".docx.\",\"eh\":\".docx।\"},{\"n\":31,\"d\":\"\",\"se\":\"The device responsible for converting digital computer signals to analog audio signals (and vice versa) over telephone lines is a:\",\"sh\":\"टेलीफोन लाइनों पर डिजिटल कंप्यूटर संकेतों को एनालॉग ऑडियो संकेतों (और इसके विपरीत) में परिवर्तित करने के लिए जिम्मेदार उपकरण है:\",\"oe\":[\"Hub\",\"Router\",\"Switch\",\"Modem\"],\"oh\":[\"हब\",\"राउटर\",\"स्विच\",\"मोडेम (Modem)\"],\"a\":3,\"ee\":\"Modem (Modulator-Demodulator).\",\"eh\":\"मोडेम (मॉड्यूलेटर-डीमॉड्यूलेटर)।\"},{\"n\":32,\"d\":\"\",\"se\":\"In computing, the smallest fundamental unit of data is a:\",\"sh\":\"कंप्यूटिंग में, डेटा की सबसे छोटी मौलिक इकाई है:\",\"oe\":[\"Bit\",\"Word\",\"Nibble\",\"Byte\"],\"oh\":[\"बिट (Bit)\",\"वर्ड (Word)\",\"निबल (Nibble)\",\"बाइट (Byte)\"],\"a\":0,\"ee\":\"Bit (Binary Digit: 0 or 1).\",\"eh\":\"बिट (बाइनरी अंक: 0 या 1)।\"},{\"n\":33,\"d\":\"\",\"se\":\"The universal shortcut key to &quot;Undo&quot; an action in Windows OS is:\",\"sh\":\"Windows OS में किसी क्रिया को &quot;Undo&quot; (पूर्ववत) करने के लिए सार्वभौमिक शॉर्टकट कुंजी है:\",\"oe\":[\"Ctrl + X\",\"Ctrl + Z\",\"Ctrl + C\",\"Ctrl + Y\"],\"oh\":[\"Ctrl + X\",\"Ctrl + Z\",\"Ctrl + C\",\"Ctrl + Y\"],\"a\":1,\"ee\":\"Ctrl + Z.\",\"eh\":\"Ctrl + Z।\"},{\"n\":34,\"d\":\"\",\"se\":\"What is the average sales volume of Product A over the five years?\",\"sh\":\"पांच वर्षों में उत्पाद A (Product A) की औसत बिक्री मात्रा क्या है?\",\"oe\":[\"66\",\"65\",\"63\",\"64\"],\"oh\":[\"66\",\"65\",\"63\",\"64\"],\"a\":2,\"ee\":\"Sum of A = 50+55+60+70+80 = 315. Average = 315 / 5 = 63.\",\"eh\":\"A का योग = 50+55+60+70+80 = 315। औसत = 315 / 5 = 63।\"},{\"n\":35,\"d\":\"\",\"se\":\"The exact percentage increase in total sales of all products from 2020 to 2024 is:\",\"sh\":\"2020 से 2024 तक सभी उत्पादों की कुल बिक्री में सटीक प्रतिशत वृद्धि कितनी है:\",\"oe\":[\"60%\",\"40%\",\"70%\",\"50%\"],\"oh\":[\"60%\",\"40%\",\"70%\",\"50%\"],\"a\":3,\"ee\":\"Total 2020 = 160. Total 2024 = 240. Increase = 80. Percentage = (80 / 160) × 100 = 50%.\",\"eh\":\"2020 का कुल = 160। 2024 का कुल = 240। वृद्धि = 80। प्रतिशत = (80 / 160) × 100 = 50%।\"},{\"n\":36,\"d\":\"\",\"se\":\"The ratio of the sales of Product B to Product C in the year 2023 is:\",\"sh\":\"वर्ष 2023 में उत्पाद B की बिक्री का उत्पाद C की बिक्री से अनुपात क्या है:\",\"oe\":[\"16:11\",\"11:16\",\"5:8\",\"8:5\"],\"oh\":[\"16:11\",\"11:16\",\"5:8\",\"8:5\"],\"a\":0,\"ee\":\"80 : 55 simplifies to 16 : 11 (divide by 5).\",\"eh\":\"80 : 55 (5 से विभाजित करने पर 16 : 11 प्राप्त होता है)।\"},{\"n\":37,\"d\":\"\",\"se\":\"In which year was the total aggregate sales the highest?\",\"sh\":\"किस वर्ष कुल बिक्री (Aggregate sales) सर्वाधिक थी?\",\"oe\":[\"2022\",\"2024\",\"2021\",\"2020\"],\"oh\":[\"2022\",\"2024\",\"2021\",\"2020\"],\"a\":1,\"ee\":\"2024 (Total = 240).\",\"eh\":\"2024 (कुल = 240)।\"},{\"n\":38,\"d\":\"\",\"se\":\"If the sales of Product A in 2025 are expected to increase by 20% over 2024, what will be the projected sales for Product A?\",\"sh\":\"यदि 2025 में उत्पाद A की बिक्री 2024 के स्तर से 20% बढ़ने की उम्मीद है, तो उत्पाद A की अनुमानित बिक्री क्या होगी?\",\"oe\":[\"88\",\"100\",\"96\",\"90\"],\"oh\":[\"88\",\"100\",\"96\",\"90\"],\"a\":2,\"ee\":\"80 × 1.20 = 96.\",\"eh\":\"80 × 1.20 = 96।\"},{\"n\":39,\"d\":\"\",\"se\":\"A sum of ₹2,500 amounts to ₹3,250 in 3 years at simple interest. The rate of interest is:\",\"sh\":\"₹2,500 की राशि साधारण ब्याज पर 3 वर्षों में ₹3,250 हो जाती है। ब्याज की दर क्या है:\",\"oe\":[\"12% p.a\",\"8% p.a\",\"15% p.a\",\"10% p.a\"],\"oh\":[\"12% प्रति वर्ष\",\"8% प्रति वर्ष\",\"15% प्रति वर्ष\",\"10% प्रति वर्ष\"],\"a\":3,\"ee\":\"Interest = 3250 - 2500 = ₹750. Rate = (750 × 100) / (2500 × 3) = 10%.\",\"eh\":\"ब्याज = 3250 - 2500 = ₹750। दर = (750 × 100) / (2500 × 3) = 10%।\"},{\"n\":40,\"d\":\"\",\"se\":\"The cost price of an article is ₹500. If it is sold at a profit of 12%, the selling price is:\",\"sh\":\"एक वस्तु का क्रय मूल्य ₹500 है। यदि इसे 12% के लाभ पर बेचा जाता है, तो विक्रय मूल्य है:\",\"oe\":[\"₹560\",\"₹520\",\"₹540\",\"₹550\"],\"oh\":[\"₹560\",\"₹520\",\"₹540\",\"₹550\"],\"a\":0,\"ee\":\"500 × 1.12 = ₹560.\",\"eh\":\"500 × 1.12 = ₹560।\"},{\"n\":41,\"d\":\"\",\"se\":\"The average of 10 numbers is 25. If every single number is multiplied by 2, the new average will be:\",\"sh\":\"10 संख्याओं का औसत 25 है। यदि प्रत्येक संख्या को 2 से गुणा किया जाए, तो नया औसत होगा:\",\"oe\":[\"20\",\"50\",\"12.5\",\"25\"],\"oh\":[\"20\",\"50\",\"12.5\",\"25\"],\"a\":1,\"ee\":\"When each observation is multiplied by a constant, the mean is multiplied by the same constant (25 × 2 = 50).\",\"eh\":\"जब प्रत्येक पद को एक स्थिरांक से गुणा किया जाता है, तो औसत को भी उसी स्थिरांक (25 × 2 = 50) से गुणा किया जाता है।\"},{\"n\":42,\"d\":\"\",\"se\":\"A train covers a distance of 180 km in 3 hours. Its speed in meters per second (m/s) is:\",\"sh\":\"एक ट्रेन 3 घंटे में 180 किमी की दूरी तय करती है। मीटर प्रति सेकंड (m/s) में इसकी गति है:\",\"oe\":[\"15 m/s\",\"20 m/s\",\"16.67 m/s\",\"25 m/s\"],\"oh\":[\"15 m/s\",\"20 m/s\",\"16.67 m/s\",\"25 m/s\"],\"a\":2,\"ee\":\"Speed = 180/3 = 60 km/hr. In m/s = 60 × (5/18) = 16.67 m/s.\",\"eh\":\"गति = 180/3 = 60 किमी/घंटा। m/s में = 60 × (5/18) = 16.67 m/s।\"},{\"n\":43,\"d\":\"\",\"se\":\"The compound interest on ₹5,000 for 2 years at 8% p.a. compounded annually is:\",\"sh\":\"₹5,000 पर 2 वर्ष के लिए 8% प्रति वर्ष की दर से वार्षिक रूप से संयोजित चक्रवृद्धि ब्याज है:\",\"oe\":[\"₹900\",\"₹800\",\"₹850\",\"₹832\"],\"oh\":[\"₹900\",\"₹800\",\"₹850\",\"₹832\"],\"a\":3,\"ee\":\"Amount = 5000 × (1.08)² = 5000 × 1.1664 = ₹5,832. CI = 5832 - 5000 = ₹832.\",\"eh\":\"मिश्रधन = 5000 × (1.08)² = 5000 × 1.1664 = ₹5,832। CI = 5832 - 5000 = ₹832।\"},{\"n\":44,\"d\":\"\",\"se\":\"If 15% of a number 'x' is 75, then x equals:\",\"sh\":\"यदि किसी संख्या 'x' का 15%, 75 के बराबर है, तो x है:\",\"oe\":[\"500\",\"300\",\"600\",\"400\"],\"oh\":[\"500\",\"300\",\"600\",\"400\"],\"a\":0,\"ee\":\"0.15x = 75 → x = 75 / 0.15 = 500.\",\"eh\":\"0.15x = 75 → x = 75 / 0.15 = 500।\"},{\"n\":45,\"d\":\"\",\"se\":\"The Lowest Common Multiple (LCM) of 6, 10, and 15 is:\",\"sh\":\"6, 10, और 15 का लघुत्तम समापवर्त्य (LCM) है:\",\"oe\":[\"120\",\"30\",\"60\",\"90\"],\"oh\":[\"120\",\"30\",\"60\",\"90\"],\"a\":1,\"ee\":\"30 is the smallest number divisible by 6, 10, and 15.\",\"eh\":\"30 सबसे छोटी संख्या है जो 6, 10 और 15 से विभाज्य है।\"},{\"n\":46,\"d\":\"\",\"se\":\"A shopkeeper offers a 10% discount on a marked price of ₹400 and still manages to gain 20% profit. The cost price is:\",\"sh\":\"एक दुकानदार ₹400 के अंकित मूल्य पर 10% की छूट देता है और फिर भी 20% का लाभ प्राप्त करता है। वस्तु का क्रय मूल्य (Cost price) क्या है:\",\"oe\":[\"₹360\",\"₹320\",\"₹300\",\"₹280\"],\"oh\":[\"₹360\",\"₹320\",\"₹300\",\"₹280\"],\"a\":2,\"ee\":\"Selling Price = 400 × 0.90 = ₹360. Cost Price = 360 / 1.20 = ₹300.\",\"eh\":\"विक्रय मूल्य = 400 × 0.90 = ₹360। क्रय मूल्य = 360 / 1.20 = ₹300।\"},{\"n\":47,\"d\":\"\",\"se\":\"The ratio of two numbers is 3:5. If their sum is 64, the smaller number is:\",\"sh\":\"दो संख्याओं का अनुपात 3:5 है। यदि उनका योग 64 है, तो छोटी संख्या है:\",\"oe\":[\"30\",\"28\",\"32\",\"24\"],\"oh\":[\"30\",\"28\",\"32\",\"24\"],\"a\":3,\"ee\":\"Let numbers be 3x and 5x. 8x = 64 → x = 8. Smaller number = 3 × 8 = 24.\",\"eh\":\"मान लें संख्याएं 3x और 5x हैं। 8x = 64 → x = 8। छोटी संख्या = 3 × 8 = 24।\"},{\"n\":48,\"d\":\"\",\"se\":\"A man rows upstream at 6 km/hr and downstream at 10 km/hr. The speed of the water stream is:\",\"sh\":\"एक आदमी धारा के प्रतिकूल (upstream) 6 किमी/घंटा और धारा के अनुकूल (downstream) 10 किमी/घंटा की गति से नाव चलाता है। धारा (stream) की गति है:\",\"oe\":[\"2 km/hr\",\"3 km/hr\",\"4 km/hr\",\"5 km/hr\"],\"oh\":[\"2 किमी/घंटा\",\"3 किमी/घंटा\",\"4 किमी/घंटा\",\"5 किमी/घंटा\"],\"a\":0,\"ee\":\"Stream speed = (Downstream speed - Upstream speed) / 2 = (10 - 6) / 2 = 2 km/hr.\",\"eh\":\"धारा की गति = (अनुकूल गति - प्रतिकूल गति) / 2 = (10 - 6) / 2 = 2 किमी/घंटा।\"},{\"n\":49,\"d\":\"\",\"se\":\"The square root of 1764 is:\",\"sh\":\"1764 का वर्गमूल (Square root) है:\",\"oe\":[\"46\",\"42\",\"44\",\"40\"],\"oh\":[\"46\",\"42\",\"44\",\"40\"],\"a\":1,\"ee\":\"42 × 42 = 1764.\",\"eh\":\"42 × 42 = 1764।\"},{\"n\":50,\"d\":\"\",\"se\":\"The simple interest on ₹4,000 for 5 years at 6% p.a. is:\",\"sh\":\"₹4,000 पर 5 वर्ष के लिए 6% प्रति वर्ष की दर से साधारण ब्याज है:\",\"oe\":[\"₹1,400\",\"₹1,600\",\"₹1,200\",\"₹1,000\"],\"oh\":[\"₹1,400\",\"₹1,600\",\"₹1,200\",\"₹1,000\"],\"a\":2,\"ee\":\"SI = (4000 × 6 × 5) / 100 = ₹1,200.\",\"eh\":\"SI = (4000 × 6 × 5) / 100 = ₹1,200।\"},{\"n\":51,\"d\":\"\",\"se\":\"If (a + b) = 10 and (a - b) = 4, then the value of ab is:\",\"sh\":\"यदि (a + b) = 10 और (a - b) = 4 है, तो ab का मान है:\",\"oe\":[\"24\",\"20\",\"18\",\"21\"],\"oh\":[\"24\",\"20\",\"18\",\"21\"],\"a\":3,\"ee\":\"Solving the equations gives a = 7, b = 3. Product ab = 21.\",\"eh\":\"समीकरणों को हल करने पर a = 7, b = 3 प्राप्त होता है। गुणनफल ab = 21।\"},{\"n\":52,\"d\":\"\",\"se\":\"The area of a circle with a radius of 7 cm (using π = 22/7) is:\",\"sh\":\"7 सेमी त्रिज्या वाले वृत्त (circle) का क्षेत्रफल (π = 22/7 मानकर) है:\",\"oe\":[\"154 cm²\",\"44 cm²\",\"144 cm²\",\"88 cm²\"],\"oh\":[\"154 वर्ग सेमी\",\"44 वर्ग सेमी\",\"144 वर्ग सेमी\",\"88 वर्ग सेमी\"],\"a\":0,\"ee\":\"Area = πr² = (22/7) × 49 = 154 cm².\",\"eh\":\"क्षेत्रफल = πr² = (22/7) × 49 = 154 वर्ग सेमी।\"},{\"n\":53,\"d\":\"\",\"se\":\"The total surface area of a cube having a side length of 5 cm is:\",\"sh\":\"5 सेमी भुजा वाले घन (cube) का कुल पृष्ठीय क्षेत्रफल है:\",\"oe\":[\"100 cm²\",\"150 cm²\",\"200 cm²\",\"125 cm²\"],\"oh\":[\"100 वर्ग सेमी\",\"150 वर्ग सेमी\",\"200 वर्ग सेमी\",\"125 वर्ग सेमी\"],\"a\":1,\"ee\":\"Area = 6a² = 6 × (5)² = 6 × 25 = 150 cm².\",\"eh\":\"क्षेत्रफल = 6a² = 6 × (5)² = 6 × 25 = 150 वर्ग सेमी।\"},{\"n\":54,\"d\":\"\",\"se\":\"Find the missing term in the sequence: 2, 5, 11, 23, 47, ?\",\"sh\":\"अनुक्रम में लुप्त पद ज्ञात कीजिए: 2, 5, 11, 23, 47, ?\",\"oe\":[\"91\",\"93\",\"95\",\"97\"],\"oh\":[\"91\",\"93\",\"95\",\"97\"],\"a\":2,\"ee\":\"Pattern: Multiply by 2 and add 1. (47 × 2) + 1 = 95.\",\"eh\":\"पैटर्न: 2 से गुणा करें और 1 जोड़ें। (47 × 2) + 1 = 95।\"},{\"n\":55,\"d\":\"\",\"se\":\"In a certain code, &ldquo;LION&rdquo; is written as &ldquo;MJPK&rdquo;. How is &ldquo;TIGER&rdquo; coded?\",\"sh\":\"एक निश्चित कूट भाषा में, &quot;LION&quot; को &quot;MJPK&quot; लिखा जाता है। &quot;TIGER&quot; को कैसे कोडित किया जाएगा?\",\"oe\":[\"UIGES\",\"VJHFS\",\"UJIFS\",\"UJHFS\"],\"oh\":[\"UIGES\",\"VJHFS\",\"UJIFS\",\"UJHFS\"],\"a\":3,\"ee\":\"Each letter is shifted by +1 (T→U, I→J, G→H, E→F, R→S).\",\"eh\":\"प्रत्येक अक्षर +1 से शिफ्ट होता है (T→U, I→J, G→H, E→F, R→S)।\"},{\"n\":56,\"d\":\"\",\"se\":\"Pointing to a boy, a woman said, &ldquo;He is the son of my mother&rsquo;s only daughter.&rdquo; How is the boy related to the woman speaking?\",\"sh\":\"एक लड़के की ओर इशारा करते हुए एक महिला ने कहा, &quot;वह मेरी माँ की इकलौती बेटी का बेटा है।&quot; लड़का बोलने वाली महिला से कैसे संबंधित है?\",\"oe\":[\"Son\",\"Brother\",\"Grandson\",\"Nephew\"],\"oh\":[\"बेटा (Son)\",\"भाई\",\"पोता\",\"भतीजा/भांजा\"],\"a\":0,\"ee\":\"&quot;My mother's only daughter&quot; is the woman herself. Therefore, the boy is her son.\",\"eh\":\"&quot;मेरी माँ की इकलौती बेटी&quot; वह महिला स्वयं है। इसलिए, लड़का उसका बेटा है।\"},{\"n\":57,\"d\":\"\",\"se\":\"Find the odd one out in the following series of numbers: 11, 13, 15, 17, 19\",\"sh\":\"निम्नलिखित संख्या श्रृंखला में बेजोड़ (Odd one out) ज्ञात कीजिए: 11, 13, 15, 17, 19\",\"oe\":[\"13\",\"15\",\"17\",\"11\"],\"oh\":[\"13\",\"15\",\"17\",\"11\"],\"a\":1,\"ee\":\"15 is a composite number (divisible by 3 and 5), while all others are prime numbers.\",\"eh\":\"15 एक भाज्य (composite) संख्या है (3 और 5 से विभाज्य है), जबकि अन्य सभी अभाज्य (prime) संख्याएँ हैं।\"},{\"n\":58,\"d\":\"\",\"se\":\"In a row of 35 students, Ravi is 12th from the left and Sunil is 15th from the right. How many students are sitting between them?\",\"sh\":\"35 छात्रों की एक पंक्ति में, रवि बाएँ से 12वें और सुनील दाएँ से 15वें स्थान पर है। उनके बीच कितने छात्र बैठे हैं?\",\"oe\":[\"7\",\"9\",\"8\",\"10\"],\"oh\":[\"7\",\"9\",\"8\",\"10\"],\"a\":2,\"ee\":\"Sunil&rsquo;s position from the left = 35 - 15 + 1 = 21st. Students between 12th and 21st = (21 - 12 - 1) = 8.\",\"eh\":\"बाएँ से सुनील का स्थान = 35 - 15 + 1 = 21वां। 12वें और 21वें स्थान के बीच के छात्र = (21 - 12 - 1) = 8।\"},{\"n\":59,\"d\":\"\",\"se\":\"Which number will replace the question mark? 3, 7, 16, 35, 74, ?\",\"sh\":\"प्रश्न चिह्न के स्थान पर कौन सी संख्या आएगी? 3, 7, 16, 35, 74, ?\",\"oe\":[\"150\",\"140\",\"148\",\"153\"],\"oh\":[\"150\",\"140\",\"148\",\"153\"],\"a\":3,\"ee\":\"Pattern: (n × 2) + consecutive integers. (3×2+1=7, 7×2+2=16, 16×2+3=35, 35×2+4=74). Next: 74×2+5 = 148+5 = 153.\",\"eh\":\"पैटर्न: (n × 2) + क्रमिक पूर्णांक। (3×2+1=7, 7×2+2=16, 16×2+3=35, 35×2+4=74)। अगला: 74×2+5 = 148+5 = 153।\"},{\"n\":60,\"d\":\"\",\"se\":\"Six friends A, B, C, D, E, F are sitting in a straight row facing north. A is exactly between B and C. D is at the extreme left end. E is adjacent to D, and F is at the extreme right end. Who is sitting exactly in the middle of the row?\",\"sh\":\"छह मित्र A, B, C, D, E, F उत्तर की ओर मुख करके एक सीधी पंक्ति में बैठे हैं। A, B और C के ठीक बीच में है। D बाएँ छोर पर है। E, D के आसन्न (adjacent) है, और F दाएँ छोर पर है। पंक्ति के ठीक बीच में कौन बैठा है?\",\"oe\":[\"A\",\"C\",\"D\",\"B\"],\"oh\":[\"A\",\"C\",\"D\",\"B\"],\"a\":0,\"ee\":\"The spatial arrangement is D, E, B/C, A, C/B, F. Therefore, A is at the exact center.\",\"eh\":\"स्थानिक व्यवस्था D, E, B/C, A, C/B, F है। इसलिए, A बिल्कुल बीच में है।\"},{\"n\":61,\"d\":\"\",\"se\":\"Read the statements and identify the logically valid conclusion: <em>Statements:</em> All pens are stationery. Some stationery are costly. <em>Conclusions:</em> I. Some pens are costly. II. All stationery are pens.\",\"sh\":\"कथनों को पढ़ें और तार्किक रूप से मान्य निष्कर्ष की पहचान करें: <em>कथन:</em> सभी पेन स्टेशनरी हैं। कुछ स्टेशनरी महंगी हैं। <em>निष्कर्ष:</em> I. कुछ पेन महंगे हैं। II. सभी स्टेशनरी पेन हैं।\",\"oe\":[\"Only I follows\",\"Only II follows\",\"Both follow\",\"Neither follows\"],\"oh\":[\"केवल I अनुसरण करता है\",\"केवल II अनुसरण करता है\",\"दोनों अनुसरण करते हैं\",\"कोई भी अनुसरण नहीं करता है\"],\"a\":3,\"ee\":\"Neither conclusion strictly follows because the subset of &quot;costly&quot; stationery may not intersect with &quot;pens,&quot; and obviously not all stationery are pens.\",\"eh\":\"कोई भी निष्कर्ष पूरी तरह से अनुसरण नहीं करता है क्योंकि &quot;महंगी&quot; स्टेशनरी का उपसमूह &quot;पेन&quot; के साथ प्रतिच्छेद (intersect) नहीं भी कर सकता है।\"},{\"n\":62,\"d\":\"\",\"se\":\"A man walks 5 km South, turns right and walks 3 km, turns right again and walks 5 km. How far is he from his starting point?\",\"sh\":\"एक आदमी 5 किमी दक्षिण (South) की ओर चलता है, दाएँ मुड़ता है और 3 किमी चलता है, फिर से दाएँ मुड़ता है और 5 किमी चलता है। वह अपने प्रारंभिक बिंदु से कितनी दूर है?\",\"oe\":[\"8 km\",\"3 km\",\"5 km\",\"0 km\"],\"oh\":[\"8 किमी\",\"3 किमी\",\"5 किमी\",\"0 किमी\"],\"a\":1,\"ee\":\"He walks South, then West, then North. He ends up exactly 3 km West of his starting point.\",\"eh\":\"वह दक्षिण की ओर, फिर पश्चिम की ओर, फिर उत्तर की ओर चलता है। वह अपने प्रारंभिक बिंदु से ठीक 3 किमी पश्चिम में है।\"},{\"n\":63,\"d\":\"\",\"se\":\"If ‘A&rsquo; means ‘+&rsquo;, ‘B&rsquo; means ‘–&rsquo;, ‘C&rsquo; means ‘×&rsquo;, and ‘D&rsquo; means ‘÷&rsquo;, solve the following: 8 D 4 C 2 A 3 B 1\",\"sh\":\"यदि ‘A&rsquo; का अर्थ ‘+&rsquo;, ‘B&rsquo; का अर्थ ‘–&rsquo;, ‘C&rsquo; का अर्थ ‘×&rsquo;, और ‘D&rsquo; का अर्थ ‘÷&rsquo; है, तो इसे हल करें: 8 D 4 C 2 A 3 B 1\",\"oe\":[\"9\",\"7\",\"6\",\"8\"],\"oh\":[\"9\",\"7\",\"6\",\"8\"],\"a\":2,\"ee\":\"Expression: 8 ÷ 4 × 2 + 3 - 1. Applying BODMAS: 2 × 2 + 3 - 1 = 4 + 3 - 1 = 6.\",\"eh\":\"व्यंजक: 8 ÷ 4 × 2 + 3 - 1। BODMAS लागू करने पर: 2 × 2 + 3 - 1 = 4 + 3 - 1 = 6।\"},{\"n\":64,\"d\":\"\",\"se\":\"In a certain code, &ldquo;WATER&rdquo; is written as &ldquo;XBUFS&rdquo;. How is &ldquo;MILK&rdquo; coded?\",\"sh\":\"एक निश्चित कूट में, &ldquo;WATER&rdquo; को &ldquo;XBUFS&rdquo; लिखा जाता है। &ldquo;MILK&rdquo; को कैसे कोडित किया जाएगा?\",\"oe\":[\"NJLK\",\"NMJL\",\"NJKL\",\"NJML\"],\"oh\":[\"NJLK\",\"NMJL\",\"NJKL\",\"NJML\"],\"a\":3,\"ee\":\"Each letter is shifted by +1 (M→N, I→J, L→M, K→L).\",\"eh\":\"प्रत्येक अक्षर को +1 से स्थानांतरित किया गया है (M→N, I→J, L→M, K→L)।\"},{\"n\":65,\"d\":\"\",\"se\":\"If the day before yesterday was Saturday, what day will it be the day after tomorrow?\",\"sh\":\"यदि बीते हुए कल से एक दिन पहले (day before yesterday) शनिवार था, तो आने वाले कल के बाद (day after tomorrow) कौन सा दिन होगा?\",\"oe\":[\"Wednesday\",\"Tuesday\",\"Thursday\",\"Friday\"],\"oh\":[\"बुधवार (Wednesday)\",\"मंगलवार\",\"गुरुवार\",\"शुक्रवार\"],\"a\":0,\"ee\":\"If the day before yesterday was Saturday, today is Monday. Tomorrow is Tuesday, and the day after tomorrow is Wednesday.\",\"eh\":\"यदि परसों शनिवार था, तो आज सोमवार है। कल मंगलवार है, और परसों बुधवार होगा।\"},{\"n\":66,\"d\":\"\",\"se\":\"Find the next term in the sequence: 1, 4, 27, 256, ?\",\"sh\":\"अनुक्रम में अगला पद ज्ञात कीजिए: 1, 4, 27, 256, ?\",\"oe\":[\"1024\",\"3125\",\"625\",\"216\"],\"oh\":[\"1024\",\"3125\",\"625\",\"216\"],\"a\":1,\"ee\":\"The pattern is n^n (1¹, 2², 3³, 4⁴). The next is 5⁵ = 3125.\",\"eh\":\"पैटर्न n^n (1¹, 2², 3³, 4⁴) है। अगला 5⁵ = 3125 है।\"},{\"n\":67,\"d\":\"\",\"se\":\"In a family, A is the mother of B, C is the father of D, and D is the brother of B. How is A related to C?\",\"sh\":\"एक परिवार में, A, B की माँ है, C, D का पिता है, और D, B का भाई है। A, C से कैसे संबंधित है?\",\"oe\":[\"Brother\",\"Sister\",\"Wife\",\"Husband\"],\"oh\":[\"भाई\",\"बहन\",\"पत्नी (Wife)\",\"पति\"],\"a\":2,\"ee\":\"B and D are siblings. Their mother is A, and their father is C. Therefore, A is the wife of C.\",\"eh\":\"B और D भाई-बहन हैं। उनकी माँ A है, और उनके पिता C हैं। इसलिए, A, C की पत्नी है।\"},{\"n\":68,\"d\":\"\",\"se\":\"Which of the following is considered a strong argument? <em>Statement:</em> Should smartphones be banned for children under 10 years of age? <em>Argument I:</em> Yes, excessive screen time affects their eyesight and mental development. <em>Argument II:</em> No, it is the only convenient way to keep them entertained.\",\"sh\":\"निम्नलिखित में से किसे एक मजबूत/ठोस (strong) तर्क माना जाता है? <em>कथन:</em> क्या 10 वर्ष से कम उम्र के बच्चों के लिए स्मार्टफोन पर प्रतिबंध लगा दिया जाना चाहिए? <em>तर्क I:</em> हाँ, स्क्रीन पर अत्यधिक समय बिताने से उनकी आंखों की रोशनी और मानसिक विकास प्रभावित होता है। <em>तर्क II:</em> नहीं, उन्हें मनोरंजन करने का यही एकमात्र सुविधाजनक तरीका है।\",\"oe\":[\"Only I is strong\",\"Only II is strong\",\"Both are strong\",\"Neither is strong\"],\"oh\":[\"केवल I मजबूत है\",\"केवल II मजबूत है\",\"दोनों मजबूत हैं\",\"कोई भी मजबूत नहीं है\"],\"a\":0,\"ee\":\"Argument I outlines a critical developmental concern. Argument II is a weak justification prioritizing convenience over health.\",\"eh\":\"तर्क I एक महत्वपूर्ण विकासात्मक चिंता को रेखांकित करता है। तर्क II एक कमजोर औचित्य है जो स्वास्थ्य पर सुविधा को प्राथमिकता देता है।\"},{\"n\":69,\"d\":\"\",\"se\":\"Choose the correct synonym of &ldquo;Felicitate&rdquo;:\",\"sh\":\"Choose the correct synonym of &ldquo;Felicitate&rdquo;:\",\"oe\":[\"Condemn\",\"Blame\",\"Criticise\",\"Congratulate\"],\"oh\":[\"Condemn\",\"Blame\",\"Criticise\",\"Congratulate\"],\"a\":3,\"ee\":\"To felicitate means to congratulate or honor someone.\",\"eh\":\"To felicitate means to congratulate or honor someone.\"},{\"n\":70,\"d\":\"\",\"se\":\"Choose the antonym of &ldquo;Benevolent&rdquo;:\",\"sh\":\"Choose the antonym of &ldquo;Benevolent&rdquo;:\",\"oe\":[\"Cruel\",\"Generous\",\"Kind\",\"Charitable\"],\"oh\":[\"Cruel\",\"Generous\",\"Kind\",\"Charitable\"],\"a\":0,\"ee\":\"Benevolent means well-meaning and kindly; the opposite is cruel.\",\"eh\":\"Benevolent means well-meaning and kindly; the opposite is cruel.\"},{\"n\":71,\"d\":\"\",\"se\":\"Identify the grammatical error in the following sentence: &ldquo;The scenery of Kashmir are very beautiful.&rdquo;\",\"sh\":\"Identify the grammatical error in the following sentence: &ldquo;The scenery of Kashmir are very beautiful.&rdquo;\",\"oe\":[\"very beautiful\",\"are\",\"The scenery\",\"of Kashmir\"],\"oh\":[\"very beautiful\",\"are\",\"The scenery\",\"of Kashmir\"],\"a\":1,\"ee\":\"The word &quot;scenery&quot; is an uncountable noun and always takes a singular verb (&quot;is&quot;).\",\"eh\":\"The word &quot;scenery&quot; is an uncountable noun and always takes a singular verb (&quot;is&quot;).\"},{\"n\":72,\"d\":\"\",\"se\":\"Fill in the blank with the appropriate article: &ldquo;The teacher gave ____ assignment to the students.&rdquo;\",\"sh\":\"Fill in the blank with the appropriate article: &ldquo;The teacher gave ____ assignment to the students.&rdquo;\",\"oe\":[\"a\",\"no article\",\"an\",\"the\"],\"oh\":[\"a\",\"no article\",\"an\",\"the\"],\"a\":2,\"ee\":\"&quot;Assignment&quot; starts with a vowel sound, requiring &quot;an&quot;.\",\"eh\":\"&quot;Assignment&quot; starts with a vowel sound, requiring &quot;an&quot;.\"},{\"n\":73,\"d\":\"\",\"se\":\"Choose the correct one‑word substitution: &ldquo;A person who is excessively fond of oneself&rdquo;\",\"sh\":\"Choose the correct one‑word substitution: &ldquo;A person who is excessively fond of oneself&rdquo;\",\"oe\":[\"Egoist\",\"Introvert\",\"Altruist\",\"Narcissist\"],\"oh\":[\"Egoist\",\"Introvert\",\"Altruist\",\"Narcissist\"],\"a\":3,\"ee\":\"Narcissist.\",\"eh\":\"Narcissist.\"},{\"n\":74,\"d\":\"\",\"se\":\"Change the voice of the sentence: &ldquo;They will have completed the project by tomorrow.&rdquo;\",\"sh\":\"Change the voice of the sentence: &ldquo;They will have completed the project by tomorrow.&rdquo;\",\"oe\":[\"The project will have been completed by them by tomorrow\",\"The project is completed by tomorrow\",\"The project was completed by tomorrow\",\"The project will be completed by them by tomorrow\"],\"oh\"       "</b><small>"+(st.a?st.r+"/"+st.a+" "+T("correct")+" \u00b7 "+st.l+"/"+st.w+" "+T("labelled")
        :st.n+" "+T("questions"))+'</small><span class="bar"><i style="width:'+st.pct+'%"></i></span></span>';
