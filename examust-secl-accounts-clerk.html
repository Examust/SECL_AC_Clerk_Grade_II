:3,\"ee\":\"Group A contains only odd numbers, while all other groups contain even numbers/multiples.\",\"eh\":\"समूह ए में केवल विषम संख्याएँ हैं, जबकि अन्य सभी समूहों में सम संख्याएँ/गुणज हैं।\"},{\"n\":92,\"d\":\"\",\"se\":\"If the first day of a month is Sunday, how many Sundays will there be in that month if it has 31 days?\",\"sh\":\"यदि किसी महीने का पहला दिन रविवार है, तो 31 दिन वाले उस महीने में कितने रविवार होंगे?\",\"oe\":[\"5\",\"3\",\"4\",\"6\"],\"oh\":[\"5\",\"3\",\"4\",\"6\"],\"a\":0,\"ee\":\"31 days equal 4 full weeks + 3 days. The 1st, 8th, 15th, 22nd, and 29th will all be Sundays (Total = 5).\",\"eh\":\"31 दिन 4 पूरे सप्ताह + 3 दिनों के बराबर होते हैं। 1, 8, 15, 22 और 29 तारीख सभी रविवार होंगे (कुल = 5)।\"},{\"n\":93,\"d\":\"\",\"se\":\"A man is 5 km East of his office. He walks 3 km North, then 5 km West. How far is he from his office now?\",\"sh\":\"एक आदमी अपने कार्यालय से 5 किमी पूर्व में है। वह 3 किमी उत्तर की ओर चलता है, फिर 5 किमी पश्चिम की ओर चलता है। वह अब अपने कार्यालय से कितनी दूर है?\",\"oe\":[\"0 km\",\"3 km\",\"5 km\",\"4 km\"],\"oh\":[\"0 किमी\",\"3 किमी\",\"5 किमी\",\"4 किमी\"],\"a\":1,\"ee\":\"The 5 km West cancels out his starting position (5 km East). He is exactly 3 km straight North of the office.\",\"eh\":\"5 किमी पश्चिम की यात्रा उसकी प्रारंभिक स्थिति (5 किमी पूर्व) को रद्द कर देती है। वह कार्यालय के ठीक 3 किमी सीधे उत्तर में है।\"},{\"n\":94,\"d\":\"\",\"se\":\"In a simple numerical substitution code, if 1 represents A, 2 represents B, 3 represents C, and so on, what is the code for the word &quot;ACE&quot;?\",\"sh\":\"एक साधारण संख्यात्मक प्रतिस्थापन कूट में, यदि 1, A का प्रतिनिधित्व करता है, 2, B का प्रतिनिधित्व करता है, 3, C का प्रतिनिधित्व करता है, और इसी तरह, तो &quot;ACE&quot; शब्द के लिए कूट क्या है?\",\"oe\":[\"1 2 5\",\"1 4 5\",\"1 3 5\",\"2 3 5\"],\"oh\":[\"1 2 5\",\"1 4 5\",\"1 3 5\",\"2 3 5\"],\"a\":2,\"ee\":\"A = 1, C = 3, E = 5.\",\"eh\":\"A = 1, C = 3, E = 5।\"},{\"n\":95,\"d\":\"\",\"se\":\"If the letters of the word &quot;MOTHER&quot; are arranged in alphabetical order from left to right, which letter will be in the third position from the left?\",\"sh\":\"यदि &quot;MOTHER&quot; शब्द के अक्षरों को बाएँ से दाएँ वर्णानुक्रम (alphabetical order) में व्यवस्थित किया जाता है, तो बाएँ से तीसरे स्थान पर कौन सा अक्षर होगा?\",\"oe\":[\"O\",\"R\",\"T\",\"M\"],\"oh\":[\"O\",\"R\",\"T\",\"M\"],\"a\":3,\"ee\":\"Alphabetical arrangement: E, H, M, O, R, T. The third letter is M.\",\"eh\":\"वर्णानुक्रमिक व्यवस्था: E, H, M, O, R, T। तीसरा अक्षर M है।\"},{\"n\":96,\"d\":\"\",\"se\":\"A wall clock shows the time as 6:30. What is the angle between the hour and minute hands?\",\"sh\":\"एक दीवार घड़ी 6:30 का समय दिखाती है। घंटे और मिनट की सुइयों के बीच का कोण क्या है?\",\"oe\":[\"15°\",\"45°\",\"0°\",\"30°\"],\"oh\":[\"15°\",\"45°\",\"0°\",\"30°\"],\"a\":0,\"ee\":\"Hour hand position = (6 × 30°) + 15° = 195°. Minute hand = 30 × 6° = 180°. Difference = 195 - 180 = 15°.\",\"eh\":\"घंटे की सुई की स्थिति = (6 × 30°) + 15° = 195°। मिनट की सुई = 30 × 6° = 180°। अंतर = 195 - 180 = 15°।\"},{\"n\":97,\"d\":\"\",\"se\":\"Find the next number in the following sequence: 10, 100, 200, 310, ?\",\"sh\":\"निम्नलिखित अनुक्रम में अगली संख्या ज्ञात कीजिए: 10, 100, 200, 310, ?\",\"oe\":[\"420\",\"430\",\"410\",\"400\"],\"oh\":[\"420\",\"430\",\"410\",\"400\"],\"a\":1,\"ee\":\"The differences are 90, 100, 110. The next difference is 120. 310 + 120 = 430.\",\"eh\":\"अंतर 90, 100, 110 हैं। अगला अंतर 120 है। 310 + 120 = 430।\"},{\"n\":98,\"d\":\"\",\"se\":\"Find the next number in the factorial series: 1, 2, 6, 24, 120, ?\",\"sh\":\"फैक्टोरियल श्रृंखला में अगली संख्या ज्ञात कीजिए: 1, 2, 6, 24, 120, ?\",\"oe\":[\"360\",\"5040\",\"720\",\"600\"],\"oh\":[\"360\",\"5040\",\"720\",\"600\"],\"a\":2,\"ee\":\"The series represents factorials (1!, 2!, 3!, 4!, 5!). The next is 6! = 720.\",\"eh\":\"यह श्रृंखला फैक्टोरियल (1!, 2!, 3!, 4!, 5!) का प्रतिनिधित्व करती है। अगली संख्या 6! = 720 है।\"},{\"n\":99,\"d\":\"\",\"se\":\"Find the missing term in the sequence: 81, 64, 49, 36, ?\",\"sh\":\"अनुक्रम में लुप्त पद ज्ञात कीजिए: 81, 64, 49, 36, ?\",\"oe\":[\"20\",\"30\",\"16\",\"25\"],\"oh\":[\"20\",\"30\",\"16\",\"25\"],\"a\":3,\"ee\":\"Decreasing squares: 9², 8², 7², 6², 5² (which is 25).\",\"eh\":\"घटते हुए वर्ग: 9², 8², 7², 6², 5² (जो कि 25 है)।\"},{\"n\":100,\"d\":\"\",\"se\":\"If a person stands facing North and turns exactly 270° clockwise, which direction will he end up facing?\",\"sh\":\"यदि कोई व्यक्ति उत्तर (North) की ओर मुख करके खड़ा है और ठीक 270° दक्षिणावर्त (clockwise) घूमता है, तो अंत में उसका मुख किस दिशा में होगा?\",\"oe\":[\"West\",\"South\",\"North\",\"East\"],\"oh\":[\"पश्चिम (West)\",\"दक्षिण\",\"उत्तर\",\"पूर्व\"],\"a\":0,\"ee\":\"North is 0°. A 270° clockwise rotation stops at West (270°).\",\"eh\":\"उत्तर 0° है। 270° दक्षिणावर्त घुमाव पश्चिम (270°) पर रुकता है।\"}]},{\"id\":\"as5\",\"num\":5,\"name\":\"Company Knowledge — CIL & SECL\",\"q\":[{\"n\":1,\"d\":\"\",\"se\":\"South Eastern Coalfields Limited (SECL) was officially incorporated on:\",\"sh\":\"साउथ ईस्टर्न कोलफील्ड्स लिमिटेड (SECL) को आधिकारिक तौर पर कब निगमित (incorporated) किया गया था:\",\"oe\":[\"1st April 1975\",\"28th November 1985\",\"1st April 1986\",\"1st November 1975\"],\"oh\":[\"1 अप्रैल 1975\",\"28 नवंबर 1985\",\"1 अप्रैल 1986\",\"1 नवंबर 1975\"],\"a\":1,\"ee\":\"SECL was formed and registered on 28th November 1985.\",\"eh\":\"SECL का गठन और पंजीकरण 28 नवंबर 1985 को हुआ था।\"},{\"n\":2,\"d\":\"\",\"se\":\"SECL was originally formed by bifurcating a portion of the coal mines held by:\",\"sh\":\"मूल रूप से SECL का गठन किस कंपनी की कोयला खदानों के एक हिस्से को अलग (bifurcate) करके किया गया था:\",\"oe\":[\"Eastern Coalfields Limited\",\"Bharat Coking Coal Limited\",\"Western Coalfields Limited (WCL)\",\"Central Coalfields Limited\"],\"oh\":[\"ईस्टर्न कोलफील्ड्स लिमिटेड\",\"भारत कोकिंग कोल लिमिटेड\",\"वेस्टर्न कोलफील्ड्स लिमिटेड (WCL)\",\"सेंट्रल कोलफील्ड्स लिमिटेड\"],\"a\":2,\"ee\":\"It was carved out of WCL to manage mines in MP and Chhattisgarh more efficiently.\",\"eh\":\"मध्य प्रदेश और छत्तीसगढ़ में खदानों को अधिक कुशलता से प्रबंधित करने के लिए इसे WCL से अलग किया गया था।\"},{\"n\":3,\"d\":\"\",\"se\":\"The parent holding company, Coal India Limited (CIL), was established in the year:\",\"sh\":\"मूल होल्डिंग कंपनी, कोल इंडिया लिमिटेड (CIL), किस वर्ष स्थापित की गई थी:\",\"oe\":[\"1974\",\"1973\",\"1985\",\"1975\"],\"oh\":[\"1974\",\"1973\",\"1985\",\"1975\"],\"a\":3,\"ee\":\"CIL was established on 1st November 1975.\",\"eh\":\"CIL की स्थापना 1 नवंबर 1975 को हुई थी।\"},{\"n\":4,\"d\":\"\",\"se\":\"Though incorporated in late 1985, SECL started functioning independently for operational and accounting purposes from:\",\"sh\":\"हालांकि 1985 के अंत में निगमित हुई, SECL ने परिचालन और लेखांकन उद्देश्यों के लिए स्वतंत्र रूप से काम करना कब शुरू किया:\",\"oe\":[\"1st April 1986\",\"28th November 1985\",\"1st January 1986\",\"1st April 1985\"],\"oh\":[\"1 अप्रैल 1986\",\"28 नवंबर 1985\",\"1 जनवरी 1986\",\"1 अप्रैल 1985\"],\"a\":0,\"ee\":\"1st April 1986 (Start of the new financial year).\",\"eh\":\"1 अप्रैल 1986 (नए वित्तीय वर्ष की शुरुआत)।\"},{\"n\":5,\"d\":\"\",\"se\":\"The <strong>Coal Mines (Nationalisation) Act</strong>, the legislative backbone for the formation of CIL, was enacted in:\",\"sh\":\"<strong>कोयला खान (राष्ट्रीयकरण) अधिनियम [Coal Mines (Nationalisation) Act]</strong>, जो CIL के गठन के लिए विधायी रीढ़ था, कब अधिनियमित किया गया था:\",\"oe\":[\"1975\",\"1973\",\"1971\",\"1985\"],\"oh\":[\"1975\",\"1973\",\"1971\",\"1985\"],\"a\":1,\"ee\":\"The Act was passed in 1973.\",\"eh\":\"यह अधिनियम 1973 में पारित किया गया था।\"},{\"n\":6,\"d\":\"\",\"se\":\"Which CIL subsidiary was carved out of SECL to manage operations in Odisha in the year 1992?\",\"sh\":\"ओडिशा में संचालन के प्रबंधन के लिए 1992 में SECL से कौन सी CIL सहायक कंपनी अलग की गई थी?\",\"oe\":[\"Western Coalfields Limited\",\"Central Coalfields Limited\",\"Mahanadi Coalfields Limited (MCL)\",\"Northern Coalfields Limited\"],\"oh\":[\"वेस्टर्न कोलफील्ड्स लिमिटेड\",\"सेंट्रल कोलफील्ड्स लिमिटेड\",\"महानदी कोलफील्ड्स लिमिटेड (MCL)\",\"नॉर्दर्न कोलफील्ड्स लिमिटेड\"],\"a\":2,\"ee\":\"MCL was carved out of SECL in 1992.\",\"eh\":\"MCL को 1992 में SECL से अलग किया गया था।\"},{\"n\":7,\"d\":\"\",\"se\":\"SECL is a wholly-owned subsidiary of Coal India Limited and operates primarily under the purview of the:\",\"sh\":\"SECL, कोल इंडिया लिमिटेड की पूर्ण स्वामित्व वाली सहायक कंपनी है और मुख्य रूप से किसके दायरे में काम करती है:\",\"oe\":[\"Companies Act, 1956/2013\",\"SEBI Act\",\"Mines Act, 1952\",\"Coal Mines (Nationalisation) Act, 1973\"],\"oh\":[\"कंपनी अधिनियम, 1956/2013\",\"SEBI अधिनियम\",\"खान अधिनियम, 1952\",\"कोयला खान (राष्ट्रीयकरण) अधिनियम, 1973\"],\"a\":3,\"ee\":\"CIL and its subsidiaries function under the framework of the Nationalisation Act of 1973.\",\"eh\":\"CIL और उसकी सहायक कंपनियां 1973 के राष्ट्रीयकरण अधिनियम के ढांचे के तहत काम करती हैं।\"},{\"n\":8,\"d\":\"\",\"se\":\"The historic emergency ordinance for the initial nationalization of coking coal mines was promulgated on:\",\"sh\":\"कोकिंग कोल खदानों के प्रारंभिक राष्ट्रीयकरण के लिए ऐतिहासिक आपातकालीन अध्यादेश कब प्रख्यापित (promulgated) किया गया था:\",\"oe\":[\"16th October 1971\",\"28th November 1985\",\"1st November 1975\",\"1st April 1973\"],\"oh\":[\"16 अक्टूबर 1971\",\"28 नवंबर 1985\",\"1 नवंबर 1975\",\"1 अप्रैल 1973\"],\"a\":0,\"ee\":\"16th October 1971 marked the beginning of coal nationalization in India.\",\"eh\":\"16 अक्टूबर 1971 ने भारत में कोयला राष्ट्रीयकरण की शुरुआत की।\"},{\"n\":9,\"d\":\"\",\"se\":\"Among the categories of Central Public Sector Enterprises (CPSEs), SECL holds the status of a:\",\"sh\":\"केंद्रीय सार्वजनिक क्षेत्र के उद्यमों (CPSEs) की श्रेणियों में, SECL को कौन सा दर्जा प्राप्त है:\",\"oe\":[\"Maharatna Company\",\"Miniratna Category-I Company\",\"Schedule B Company\",\"Navratna Company\"],\"oh\":[\"महारत्न कंपनी\",\"मिनीरत्न श्रेणी-I कंपनी\",\"अनुसूची B कंपनी\",\"नवरत्न कंपनी\"],\"a\":1,\"ee\":\"SECL is a Miniratna Category-I CPSE.\",\"eh\":\"SECL एक मिनीरत्न श्रेणी-I CPSE है।\"},{\"n\":10,\"d\":\"\",\"se\":\"Which other major subsidiary of CIL was formed on the exact same date as SECL (28.11.1985)?\",\"sh\":\"CIL की कौन सी अन्य प्रमुख सहायक कंपनी ठीक उसी तारीख (28.11.1985) को बनाई गई थी जिस दिन SECL बनी थी?\",\"oe\":[\"Mahanadi Coalfields Limited\",\"Eastern Coalfields Limited\",\"Northern Coalfields Limited (NCL)\",\"Bharat Coking Coal Limited\"],\"oh\":[\"महानदी कोलफील्ड्स लिमिटेड\",\"ईस्टर्न कोलफील्ड्स लिमिटेड\",\"नॉर्दर्न कोलफील्ड्स लिमिटेड (NCL)\",\"भारत कोकिंग कोल लिमिटेड\"],\"a\":2,\"ee\":\"NCL and SECL were both formed on 28th November 1985.\",\"eh\":\"NCL और SECL दोनों का गठन 28 नवंबर 1985 को हुआ था।\"},{\"n\":11,\"d\":\"\",\"se\":\"The corporate headquarters of SECL is located at:\",\"sh\":\"SECL का कॉर्पोरेट मुख्यालय कहाँ स्थित है:\",\"oe\":[\"Ranchi, Jharkhand\",\"Raipur, Chhattisgarh\",\"Kolkata, West Bengal\",\"Bilaspur, Chhattisgarh\"],\"oh\":[\"रांची, झारखंड\",\"रायपुर, छत्तीसगढ़\",\"कोलकाता, पश्चिम बंगाल\",\"बिलासपुर, छत्तीसगढ़\"],\"a\":3,\"ee\":\"Bilaspur.\",\"eh\":\"बिलासपुर।\"},{\"n\":12,\"d\":\"\",\"se\":\"The corporate headquarters of Coal India Limited (CIL) is located at:\",\"sh\":\"कोल इंडिया लिमिटेड (CIL) का कॉर्पोरेट मुख्यालय कहाँ स्थित है:\",\"oe\":[\"Kolkata\",\"Ranchi\",\"New Delhi\",\"Bilaspur\"],\"oh\":[\"कोलकाता\",\"रांची\",\"नई दिल्ली\",\"बिलासपुर\"],\"a\":0,\"ee\":\"Kolkata, West Bengal (Coal Bhawan).\",\"eh\":\"कोलकाता, पश्चिम बंगाल (कोल भवन)।\"},{\"n\":13,\"d\":\"\",\"se\":\"SECL currently operates coal mines primarily spread across which two states?\",\"sh\":\"SECL वर्तमान में मुख्य रूप से किन दो राज्यों में कोयला खदानों का संचालन करती है?\",\"oe\":[\"Madhya Pradesh and Jharkhand\",\"Chhattisgarh and Madhya Pradesh\",\"Jharkhand and West Bengal\",\"Odisha and Chhattisgarh\"],\"oh\":[\"मध्य प्रदेश और झारखंड\",\"छत्तीसगढ़ और मध्य प्रदेश\",\"झारखंड और पश्चिम बंगाल\",\"ओडिशा और छत्तीसगढ़\"],\"a\":1,\"ee\":\"Chhattisgarh and Madhya Pradesh.\",\"eh\":\"छत्तीसगढ़ और मध्य प्रदेश।\"},{\"n\":14,\"d\":\"\",\"se\":\"The total number of active coal mines operated by SECL is approximately:\",\"sh\":\"SECL द्वारा संचालित सक्रिय कोयला खदानों की कुल संख्या लगभग कितनी है:\",\"oe\":[\"55\",\"45\",\"67\",\"80\"],\"oh\":[\"55\",\"45\",\"67\",\"80\"],\"a\":2,\"ee\":\"SECL operates approximately 67 coal mines.\",\"eh\":\"SECL लगभग 67 कोयला खदानों का संचालन करती है।\"},{\"n\":15,\"d\":\"\",\"se\":\"Out of SECL's operational mines, how many are located in the state of Chhattisgarh?\",\"sh\":\"SECL की परिचालन खदानों में से कितनी खदानें छत्तीसगढ़ राज्य में स्थित हैं?\",\"oe\":[\"26\",\"31\",\"39\",\"41\"],\"oh\":[\"26\",\"31\",\"39\",\"41\"],\"a\":3,\"ee\":\"SECL has 41 coal mines in Chhattisgarh and 26 in Madhya Pradesh.\",\"eh\":\"SECL की छत्तीसगढ़ में 41 और मध्य प्रदेश में 26 कोयला खदानें हैं।\"},{\"n\":16,\"d\":\"\",\"se\":\"The corporate headquarters of Northern Coalfields Limited (NCL) is located at:\",\"sh\":\"नॉर्दर्न कोलफील्ड्स लिमिटेड (NCL) का कॉर्पोरेट मुख्यालय कहाँ स्थित है:\",\"oe\":[\"Singrauli\",\"Bilaspur\",\"Dhanbad\",\"Ranchi\"],\"oh\":[\"सिंगरौली\",\"बिलासपुर\",\"धनबाद\",\"रांची\"],\"a\":0,\"ee\":\"Singrauli, Madhya Pradesh.\",\"eh\":\"सिंगरौली, मध्य प्रदेश।\"},{\"n\":17,\"d\":\"\",\"se\":\"The headquarters of Mahanadi Coalfields Limited (MCL) is located at:\",\"sh\":\"महानदी कोलफील्ड्स लिमिटेड (MCL) का मुख्यालय कहाँ स्थित है:\",\"oe\":[\"Bilaspur\",\"Sambalpur\",\"Bhubaneswar\",\"Ranchi\"],\"oh\":[\"बिलासपुर\",\"संबलपुर\",\"भुवनेश्वर\",\"रांची\"],\"a\":1,\"ee\":\"Sambalpur, Odisha.\",\"eh\":\"संबलपुर, ओडिशा।\"},{\"n\":18,\"d\":\"\",\"se\":\"The headquarters of Central Coalfields Limited (CCL) is located at:\",\"sh\":\"सेंट्रल कोलफील्ड्स लिमिटेड (CCL) का मुख्यालय कहाँ स्थित है:\",\"oe\":[\"Bilaspur\",\"Kolkata\",\"Ranchi\",\"Dhanbad\"],\"oh\":[\"बिलासपुर\",\"कोलकाता\",\"रांची\",\"धनबाद\"],\"a\":2,\"ee\":\"Ranchi, Jharkhand.\",\"eh\":\"रांची, झारखंड।\"},{\"n\":19,\"d\":\"\",\"se\":\"SECL's corporate office building is specifically located on:\",\"sh\":\"SECL का कॉर्पोरेट कार्यालय भवन विशेष रूप से कहाँ स्थित है:\",\"oe\":[\"VIP Road, Raipur\",\"Ring Road, Ranchi\",\"Coal Estate, Kolkata\",\"Seepat Road, Bilaspur\"],\"oh\":[\"वीआईपी रोड, रायपुर\",\"रिंग रोड, रांची\",\"कोल एस्टेट, कोलकाता\",\"सीपत रोड, बिलासपुर\"],\"a\":3,\"ee\":\"Seepat Road, Bilaspur.\",\"eh\":\"सीपत रोड, बिलासपुर।\"},{\"n\":20,\"d\":\"\",\"se\":\"The coal mines of SECL located in Madhya Pradesh are predominantly spread across which districts?\",\"sh\":\"मध्य प्रदेश में स्थित SECL की कोयला खदानें मुख्य रूप से किन जिलों में फैली हुई हैं?\",\"oe\":[\"Shahdol and Anuppur\",\"Indore and Bhopal\",\"Gwalior and Morena\",\"Jabalpur and Ujjain\"],\"oh\":[\"शहडोल और अनूपपुर\",\"इंदौर और भोपाल\",\"ग्वालियर और मुरैना\",\"जबलपुर और उज्जैन\"],\"a\":0,\"ee\":\"The Sohagpur, Johilla, and Jamuna-Kotma coalfields are in Shahdol and Anuppur districts.\",\"eh\":\"सुहागपुर, जोहिला, और जमुना-कोतमा कोयला क्षेत्र मध्य प्रदेश के शहडोल और अनूपपुर जिलों में हैं।\"},{\"n\":21,\"d\":\"\",\"se\":\"Coal India Limited currently operates through how many fully owned subsidiaries (including the planning institute)?\",\"sh\":\"कोल इंडिया लिमिटेड वर्तमान में कितनी पूर्ण स्वामित्व वाली सहायक कंपनियों (योजना संस्थान सहित) के माध्यम से काम करती है?\",\"oe\":[\"9\",\"8\",\"7\",\"6\"],\"oh\":[\"9\",\"8\",\"7\",\"6\"],\"a\":1,\"ee\":\"8 subsidiaries (7 producing, 1 planning).\",\"eh\":\"8 सहायक कंपनियां (7 उत्पादन करने वाली, 1 योजना बनाने वाली)।\"},{\"n\":22,\"d\":\"\",\"se\":\"Which of the following is <strong>NOT</strong> a subsidiary of Coal India Limited?\",\"sh\":\"निम्नलिखित में से कौन कोल इंडिया लिमिटेड की सहायक कंपनी <strong>नहीं</strong> है?\",\"oe\":[\"Eastern Coalfields Limited (ECL)\",\"Central Mine Planning &amp; Design Institute (CMPDI)\",\"Singareni Collieries Company Limited (SCCL)\",\"Mahanadi Coalfields Limited (MCL)\"],\"oh\":[\"ईस्टर्न कोलफील्ड्स लिमिटेड (ECL)\",\"सेंट्रल माइन प्लानिंग एंड डिजाइन इंस्टीट्यूट (CMPDI)\",\"सिंगरेनी कोलियरीज कंपनी लिमिटेड (SCCL)\",\"महानदी कोलफील्ड्स लिमिटेड (MCL)\"],\"a\":2,\"ee\":\"SCCL is a joint venture between the Govt. of Telangana and the Govt. of India, not a CIL subsidiary.\",\"eh\":\"SCCL तेलंगाना सरकार और भारत सरकार का संयुक्त उद्यम है, यह CIL की सहायक कंपनी नहीं है।\"},{\"n\":23,\"d\":\"\",\"se\":\"The full form of CMPDIL is:\",\"sh\":\"CMPDIL का पूर्ण रूप क्या है:\",\"oe\":[\"Coal Mining &amp; Planning Department\",\"Coal Mine Planning &amp; Development Institute\",\"Central Mining Project &amp; Design Institute\",\"Central Mine Planning &amp; Design Institute Limited\"],\"oh\":[\"कोल माइनिंग एंड प्लानिंग डिपार्टमेंट\",\"कोल माइन प्लानिंग एंड डेवलपमेंट इंस्टीट्यूट\",\"सेंट्रल माइनिंग प्रोजेक्ट एंड डिजाइन इंस्टीट्यूट\",\"सेंट्रल माइन प्लानिंग एंड डिजाइन इंस्टीट्यूट लिमिटेड (Central Mine Planning &amp; Design Institute Limited)\"],\"a\":3,\"ee\":\"Central Mine Planning &amp; Design Institute Limited.\",\"eh\":\"सेंट्रल माइन प्लानिंग एंड डिजाइन इंस्टीट्यूट लिमिटेड।\"},{\"n\":24,\"d\":\"\",\"se\":\"Which CIL subsidiary is headquartered in Asansol (Sanctoria), West Bengal?\",\"sh\":\"कौन सी CIL सहायक कंपनी का मुख्यालय आसनसोल (सांक्टोरिया), पश्चिम बंगाल में है?\",\"oe\":[\"ECL\",\"SECL\",\"NCL\",\"CCL\"],\"oh\":[\"ECL\",\"SECL\",\"NCL\",\"CCL\"],\"a\":0,\"ee\":\"Eastern Coalfields Limited (ECL).\",\"eh\":\"ईस्टर्न कोलफील्ड्स लिमिटेड (ECL)।\"},{\"n\":25,\"d\":\"\",\"se\":\"The CIL subsidiary BCCL, which operates many highly gaseous mines, stands for:\",\"sh\":\"CIL की सहायक कंपनी BCCL, जो कई अत्यधिक गैसीय खदानों का संचालन करती है, का अर्थ है:\",\"oe\":[\"Bharat Coal Corporation Limited\",\"Bharat Coking Coal Limited\",\"Bihar Coal Company Limited\",\"Bengal Coal Corporation Limited\"],\"oh\":[\"भारत कोल कॉर्पोरेशन लिमिटेड\",\"भारत कोकिंग कोल लिमिटेड (Bharat Coking Coal Limited)\",\"बिहार कोल कंपनी लिमिटेड\",\"बंगाल कोल कॉर्पोरेशन लिमिटेड\"],\"a\":1,\"ee\":\"Bharat Coking Coal Limited (HQ in Dhanbad).\",\"eh\":\"भारत कोकिंग कोल लिमिटेड (धनबाद में मुख्यालय)।\"},{\"n\":26,\"d\":\"\",\"se\":\"Which CIL subsidiary is headquartered in Nagpur, Maharashtra?\",\"sh\":\"किस CIL सहायक कंपनी का मुख्यालय नागपुर, महाराष्ट्र में है?\",\"oe\":[\"SECL\",\"CCL\",\"WCL\",\"ECL\"],\"oh\":[\"SECL\",\"CCL\",\"WCL\",\"ECL\"],\"a\":2,\"ee\":\"Western Coalfields Limited (WCL).\",\"eh\":\"वेस्टर्न कोलफील्ड्स लिमिटेड (WCL)।\"},{\"n\":27,\"d\":\"\",\"se\":\"Which of the following subsidiaries is NOT primarily a coal-producing entity?\",\"sh\":\"निम्नलिखित में से कौन सी सहायक कंपनी मुख्य रूप से कोयला उत्पादक इकाई नहीं है?\",\"oe\":[\"SECL\",\"NCL\",\"MCL\",\"CMPDIL\"],\"oh\":[\"SECL\",\"NCL\",\"MCL\",\"CMPDIL\"],\"a\":3,\"ee\":\"CMPDIL provides research, design, and exploration services.\",\"eh\":\"CMPDIL खदानों के लिए अनुसंधान, डिजाइन और अन्वेषण सेवाएं प्रदान करता है।\"},{\"n\":28,\"d\":\"\",\"se\":\"CIL also has a foreign subsidiary created for exploring coal opportunities abroad, named:\",\"sh\":\"CIL की विदेश में कोयले के अवसरों की खोज के लिए बनाई गई एक विदेशी सहायक कंपनी भी है, जिसका नाम है:\",\"oe\":[\"Coal India Africana Limitada (CIAL)\",\"Coal India Australia Pty Ltd\",\"CIL Overseas\",\"Coal India Global\"],\"oh\":[\"कोल इंडिया अफ्रीकाना लिमिटाडा (CIAL)\",\"कोल इंडिया ऑस्ट्रेलिया पीटीवाई लिमिटेड\",\"CIL ओवरसीज\",\"कोल इंडिया ग्लोबल\"],\"a\":0,\"ee\":\"Coal India Africana Limitada (Mozambique).\",\"eh\":\"कोल इंडिया अफ्रीकाना लिमिटाडा (मोजाम्बिक)।\"},{\"n\":29,\"d\":\"\",\"se\":\"The latest National Coal Wage Agreement (NCWA-XI) is effective for the period from:\",\"sh\":\"नवीनतम राष्ट्रीय कोयला वेतन समझौता (NCWA-XI) किस अवधि के लिए प्रभावी है:\",\"oe\":[\"1st April 2021 to 31st March 2026\",\"1st July 2021 to 30th June 2026\",\"1st July 2020 to 30th June 2025\",\"1st January 2022 to 31st December 2026\"],\"oh\":[\"1 अप्रैल 2021 से 31 मार्च 2026\",\"1 जुलाई 2021 से 30 जून 2026\",\"1 जुलाई 2020 से 30 जून 2025\",\"1 जनवरी 2022 से 31 दिसंबर 2026\"],\"a\":1,\"ee\":\"1st July 2021 to 30th June 2026.\",\"eh\":\"1 जुलाई 2021 से 30 जून 2026 तक।\"},{\"n\":30,\"d\":\"\",\"se\":\"The standard validity period for a National Coal Wage Agreement (like NCWA-XI) is:\",\"sh\":\"राष्ट्रीय कोयला वेतन समझौते (जैसे NCWA-XI) की मानक वैधता अवधि है:\",\"oe\":[\"10 years\",\"3 years\",\"5 years\",\"4 years\"],\"oh\":[\"10 वर्ष\",\"3 वर्ष\",\"5 वर्ष\",\"4 वर्ष\"],\"a\":2,\"ee\":\"5 years.\",\"eh\":\"5 वर्ष।\"},{\"n\":31,\"d\":\"\",\"se\":\"NCWA-XI determines the wages and benefits for the non-executive employees of:\",\"sh\":\"NCWA-XI किन गैर-कार्यकारी (non-executive) कर्मचारियों के लिए मजदूरी और भत्ते निर्धारित करता है:\",\"oe\":[\"All private coal mining companies in India\",\"Coal India Limited only\",\"Only underground miners\",\"CIL and its subsidiaries as well as SCCL\"],\"oh\":[\"भारत की सभी निजी कोयला खनन कंपनियों के\",\"केवल कोल इंडिया लिमिटेड के\",\"केवल भूमिगत खनिकों के\",\"CIL और उसकी सहायक कंपनियों के साथ-साथ SCCL के\"],\"a\":3,\"ee\":\"Covers workers of CIL, its subsidiaries, and SCCL.\",\"eh\":\"यह CIL, उसकी सहायक कंपनियों और SCCL के श्रमिकों को कवर करता है।\"},{\"n\":32,\"d\":\"\",\"se\":\"The Memorandum of Agreement for NCWA-XI was officially signed by the JBCCI on:\",\"sh\":\"NCWA-XI के समझौता ज्ञापन पर JBCCI द्वारा आधिकारिक तौर पर कब हस्ताक्षर किए गए थे:\",\"oe\":[\"20th May 2023\",\"1st July 2021\",\"3rd January 2023\",\"30th June 2026\"],\"oh\":[\"20 मई 2023\",\"1 जुलाई 2021\",\"3 जनवरी 2023\",\"30 जून 2026\"],\"a\":0,\"ee\":\"Signed on 20th May 2023 after extensive negotiations.\",\"eh\":\"व्यापक बातचीत के बाद 20 मई 2023 को हस्ताक्षर किए गए।\"},{\"n\":33,\"d\":\"\",\"se\":\"The Minimum Guaranteed Benefit (MGB) agreed upon under NCWA-XI is:\",\"sh\":\"NCWA-XI के तहत न्यूनतम गारंटीकृत लाभ (Minimum Guaranteed Benefit - MGB) कितना तय किया गया है:\",\"oe\":[\"15%\",\"19%\",\"30%\",\"25%\"],\"oh\":[\"15%\",\"19%\",\"30%\",\"25%\"],\"a\":1,\"ee\":\"A 19% MGB on basic pay, VDA, SDA, and attendance bonus.\",\"eh\":\"बेसिक पे, VDA, SDA और अटेंडेंस बोनस पर 19% MGB।\"},{\"n\":34,\"d\":\"\",\"se\":\"Approximately how many non-executive employees are beneficiaries of the NCWA-XI wage pact?\",\"sh\":\"NCWA-XI वेतन समझौते के लाभार्थी (beneficiaries) लगभग कितने गैर-कार्यकारी कर्मचारी हैं?\",\"oe\":[\"2.38 lakh\",\"3.50 lakh\",\"2.81 lakh\",\"1.50 lakh\"],\"oh\":[\"2.38 लाख\",\"3.50 लाख\",\"2.81 लाख\",\"1.50 लाख\"],\"a\":2,\"ee\":\"Around 2.81 lakh employees across CIL and SCCL.\",\"eh\":\"CIL और SCCL के लगभग 2.81 लाख कर्मचारी।\"},{\"n\":35,\"d\":\"\",\"se\":\"The bipartite committee responsible for negotiating the NCWA is known as JBCCI, which stands for:\",\"sh\":\"NCWA पर बातचीत के लिए जिम्मेदार द्विपक्षीय समिति को JBCCI के रूप में जाना जाता है, जिसका अर्थ है:\",\"oe\":[\"Junior Board of Coal Companies\",\"Joint Bureau of Coal &amp; Coke Industries\",\"Joint Board of Coal Companies in India\",\"Joint Bipartite Committee for the Coal Industry\"],\"oh\":[\"जूनियर बोर्ड ऑफ कोल कंपनीज\",\"जॉइंट ब्यूरो ऑफ कोल एंड कोक इंडस्ट्रीज\",\"जॉइंट बोर्ड ऑफ कोल कंपनीज इन इंडिया\",\"जॉइंट बाइपार्टाइट कमेटी फॉर द कोल इंडस्ट्री (Joint Bipartite Committee for the Coal Industry)\"],\"a\":3,\"ee\":\"Joint Bipartite Committee for the Coal Industry.\",\"eh\":\"जॉइंट बाइपार्टाइट कमेटी फॉर द कोल इंडस्ट्री।\"},{\"n\":36,\"d\":\"\",\"se\":\"The wage agreement that immediately preceded NCWA-XI was:\",\"sh\":\"वह वेतन समझौता जो NCWA-XI के ठीक पहले था:\",\"oe\":[\"NCWA-X\",\"NCWA-IX\",\"NCWA-VIII\",\"NCWA-XII\"],\"oh\":[\"NCWA-X\",\"NCWA-IX\",\"NCWA-VIII\",\"NCWA-XII\"],\"a\":0,\"ee\":\"NCWA-X (which expired on 30th June 2021).\",\"eh\":\"NCWA-X (जो 30 जून 2021 को समाप्त हुआ)।\"},{\"n\":37,\"d\":\"\",\"se\":\"Under NCWA-XI, the Minimum Guaranteed Benefit (MGB) is calculated on the:\",\"sh\":\"NCWA-XI के तहत, न्यूनतम गारंटीकृत लाभ (MGB) की गणना किस पर की जाती है:\",\"oe\":[\"Underground allowance only\",\"Emoluments (Basic Pay + Dearness Allowance + SDA + Attendance Bonus)\",\"Gross salary including overtime\",\"Basic pay only\"],\"oh\":[\"केवल भूमिगत भत्ते पर\",\"परिलब्धियां (Emoluments: मूल वेतन + महंगाई भत्ता + SDA + उपस्थिति बोनस) पर\",\"ओवरटाइम सहित सकल वेतन पर\",\"केवल मूल वेतन (Basic pay) पर\"],\"a\":1,\"ee\":\"Calculated on total emoluments.\",\"eh\":\"कुल परिलब्धियों (total emoluments) पर गणना की जाती है।\"},{\"n\":38,\"d\":\"\",\"se\":\"Upon the expiration of NCWA-XI, the next wage revision is slated to be due on:\",\"sh\":\"NCWA-XI की समाप्ति पर, अगला वेतन संशोधन (wage revision) कब देय होने वाला है:\",\"oe\":[\"31st March 2026\",\"1st January 2027\",\"1st July 2026\",\"31st December 2026\"],\"oh\":[\"31 मार्च 2026\",\"1 जनवरी 2027\",\"1 जुलाई 2026\",\"31 दिसंबर 2026\"],\"a\":2,\"ee\":\"Effective 1st July 2026.\",\"eh\":\"1 जुलाई 2026 से प्रभावी।\"},{\"n\":39,\"d\":\"\",\"se\":\"The Coal Mines Provident Fund Organisation (CMPFO) was established in the year:\",\"sh\":\"कोयला खान भविष्य निधि संगठन (CMPFO) की स्थापना किस वर्ष की गई थी:\",\"oe\":[\"1950\",\"1975\",\"1947\",\"1948\"],\"oh\":[\"1950\",\"1975\",\"1947\",\"1948\"],\"a\":3,\"ee\":\"Established in 1948.\",\"eh\":\"1948 में स्थापित।\"},{\"n\":40,\"d\":\"\",\"se\":\"The statutory framework governing the provident fund of coal workers is the:\",\"sh\":\"कोयला श्रमिकों के भविष्य निधि (provident fund) को नियंत्रित करने वाला वैधानिक ढांचा है:\",\"oe\":[\"Coal Mines Provident Fund and Miscellaneous Provisions Act, 1948\",\"Payment of Wages Act, 1936\",\"Employees' Provident Fund Act, 1952\",\"Mines Act, 1952\"],\"oh\":[\"कोयला खान भविष्य निधि और विविध प्रावधान अधिनियम, 1948\",\"वेतन भुगतान अधिनियम, 1936\",\"कर्मचारी भविष्य निधि अधिनियम, 1952 (EPF Act)\",\"खान अधिनियम, 1952\"],\"a\":0,\"ee\":\"Coal workers fall outside standard EPF, having their own CMPF Act, 1948.\",\"eh\":\"कोयला श्रमिक मानक EPF के बाहर आते हैं, उनका अपना CMPF अधिनियम, 1948 है।\"},{\"n\":41,\"d\":\"\",\"se\":\"The full form of CMPFO is:\",\"sh\":\"CMPFO का पूर्ण रूप क्या है:\",\"oe\":[\"Central Mines Provident Fund Office\",\"Coal Mines Provident Fund Organisation\",\"Central Mining Provident Fund Office\",\"Coal Mining Provident Fund Organisation\"],\"oh\":[\"सेंट्रल माइंस प्रोविडेंट फंड ऑफिस\",\"कोल माइंस प्रोविडेंट फंड ऑर्गनाइजेशन (Coal Mines Provident Fund Organisation)\",\"सेंट्रल माइनिंग प्रोविडेंट फंड ऑफिस\",\"कोल माइनिंग प्रोविडेंट फंड ऑर्गनाइजेशन\"],\"a\":1,\"ee\":\"Coal Mines Provident Fund Organisation.\",\"eh\":\"कोल माइंस प्रोविडेंट फंड ऑर्गनाइजेशन।\"},{\"n\":42,\"d\":\"\",\"se\":\"What is the mandatory employee contribution rate under the CMPF scheme?\",\"sh\":\"CMPF योजना के तहत अनिवार्य कर्मचारी योगदान दर क्या है?\",\"oe\":[\"10% of total emoluments\",\"15% of total emoluments\",\"12% of total emoluments\",\"8% of total emoluments\"],\"oh\":[\"कुल परिलब्धियों का 10%\",\"कुल परिलब्धियों का 15%\",\"कुल परिलब्धियों का 12%\",\"कुल परिलब्धियों का 8%\"],\"a\":2,\"ee\":\"12% of total emoluments (matched by the employer).\",\"eh\":\"कुल परिलब्धियों का 12% (जिसका मिलान नियोक्ता / employer द्वारा किया जाता है)।\"},{\"n\":43,\"d\":\"\",\"se\":\"The CMPFO functions as an autonomous organisation directly under the aegis of the:\",\"sh\":\"CMPFO किसके तत्वावधान में सीधे एक स्वायत्त संगठन के रूप में कार्य करता है:\",\"oe\":[\"Ministry of Finance\",\"Ministry of Labour &amp; Employment\",\"Ministry of Mines\",\"Ministry of Coal\"],\"oh\":[\"वित्त मंत्रालय\",\"श्रम और रोजगार मंत्रालय\",\"खान मंत्रालय\",\"कोयला मंत्रालय (Ministry of Coal)\"],\"a\":3,\"ee\":\"Ministry of Coal.\",\"eh\":\"कोयला मंत्रालय।\"},{\"n\":44,\"d\":\"\",\"se\":\"The full form of CMPS, which provides pensionary benefits to coal workers, is:\",\"sh\":\"CMPS, जो कोयला श्रमिकों को पेंशन लाभ प्रदान करता है, का पूर्ण रूप है:\",\"oe\":[\"Coal Mines Pension Scheme\",\"Central Mines Pension Scheme\",\"Coal Mining Provident Scheme\",\"Coal Mines Protection Scheme\"],\"oh\":[\"कोल माइंस पेंशन स्कीम (Coal Mines Pension Scheme)\",\"सेंट्रल माइंस पेंशन स्कीम\",\"कोल माइनिंग प्रोविडेंट स्कीम\",\"कोल माइंस प्रोटेक्शन स्कीम\"],\"a\":0,\"ee\":\"Coal Mines Pension Scheme (introduced in 1998).\",\"eh\":\"कोल माइंस पेंशन स्कीम (1998 में शुरू की गई)।\"},{\"n\":45,\"d\":\"\",\"se\":\"Prior to the CMPS 1998, pension benefits were governed by the Coal Mines Family Pension Scheme introduced in:\",\"sh\":\"CMPS 1998 से पहले, पेंशन लाभ किस वर्ष शुरू की गई कोयला खान परिवार पेंशन योजना द्वारा शासित होते थे:\",\"oe\":[\"1985\",\"1971\",\"1952\",\"1990\"],\"oh\":[\"1985\",\"1971\",\"1952\",\"1990\"],\"a\":1,\"ee\":\"CMPFS-1971.\",\"eh\":\"CMPFS-1971।\"},{\"n\":46,\"d\":\"\",\"se\":\"To digitalize and expedite the settlement of PF and pension claims, CMPFO launched the web portal named:\",\"sh\":\"पीएफ और पेंशन दावों के निपटान को डिजिटल और तेज करने के लिए, CMPFO ने किस नाम से वेब पोर्टल लॉन्च किया:\",\"oe\":[\"COAL-PORTAL\",\"PENSION-CARE\",\"C-CARES\",\"C-MINES\"],\"oh\":[\"COAL-PORTAL\",\"PENSION-CARE\",\"C-CARES\",\"C-MINES\"],\"a\":2,\"ee\":\"C-CARES (Developed in collaboration with C-DAC).\",\"eh\":\"C-CARES (C-DAC के सहयोग से विकसित)।\"},{\"n\":47,\"d\":\"\",\"se\":\"SECL's highest-ever historic coal production achieved in FY 2023-24 was approximately:\",\"sh\":\"वित्तीय वर्ष 2023-24 में SECL द्वारा हासिल किया गया अब तक का सबसे अधिक ऐतिहासिक कोयला उत्पादन लगभग कितना था:\",\"oe\":[\"167 MT\",\"206 MT\",\"150 MT\",\"184 MT\"],\"oh\":[\"167 MT\",\"206 MT\",\"150 MT\",\"184 MT\"],\"a\":3,\"ee\":\"SECL produced a record 183.94 MT (approx 184 MT) in FY 2023-24.\",\"eh\":\"SECL ने FY 2023-24 में रिकॉर्ड 183.94 MT (लगभग 184 MT) का उत्पादन किया।\"},{\"n\":48,\"d\":\"\",\"se\":\"The ambitious production target assigned to SECL by the Ministry for FY 2024-25 is:\",\"sh\":\"मंत्रालय द्वारा वित्तीय वर्ष 2024-25 के लिए SECL को सौंपा गया महत्वाकांक्षी उत्पादन लक्ष्य क्या है:\",\"oe\":[\"206 MT\",\"167 MT\",\"195 MT\",\"180 MT\"],\"oh\":[\"206 MT\",\"167 MT\",\"195 MT\",\"180 MT\"],\"a\":0,\"ee\":\"SECL&rsquo;s target for FY 24-25 was set at 206 MT.\",\"eh\":\"FY 24-25 के लिए SECL का लक्ष्य 206 MT निर्धारित किया गया था।\"},{\"n\":49,\"d\":\"\",\"se\":\"CIL's flagship mission of achieving <strong>1 Billion Tonnes (1000 MT)</strong> of annual coal production is targeted for which financial year?\",\"sh\":\"कोल इंडिया लिमिटेड (CIL) का 1 बिलियन टन (1000 MT) वार्षिक कोयला उत्पादन प्राप्त करने का प्रमुख लक्ष्य किस वित्तीय वर्ष के लिए रखा गया है?\",\"oe\":[\"FY 2023-24\",\"FY 2025-26\",\"FY 2024-25\",\"FY 2029-30\"],\"oh\":[\"FY 2023-24\",\"FY 2025-26\",\"FY 2024-25\",\"FY 2029-30\"],\"a\":1,\"ee\":\"FY 2025-26.\",\"eh\":\"वित्तीय वर्ष 2025-26।\"},{\"n\":50,\"d\":\"\",\"se\":\"SECL is widely regarded within the CIL family as the:\",\"sh\":\"SECL को CIL परिवार के भीतर व्यापक रूप से क्या माना जाता है:\",\"oe\":[\"Smallest subsidiary by area\",\"Subsidiary operating entirely underground\",\"Flagship and highly productive company of CIL\",\"Subsidiary exclusively dealing in coking coal\"],\"oh\":[\"क्षेत्र के हिसाब से सबसे छोटी सहायक कंपनी\",\"पूरी तरह से भूमिगत काम करने वाली सहायक कंपनी\",\"CIL की प्रमुख (Flagship) और अत्यधिक उत्पादक कंपनी\",\"विशेष रूप से कोकिंग कोल में काम करने वाली सहायक कंपनी\"],\"a\":2,\"ee\":\"It is the flagship and one of the most profitable subsidiaries.\",\"eh\":\"यह CIL की प्रमुख (flagship) और सबसे अधिक लाभदायक सहायक कंपनियों में से एक है।\"},{\"n\":51,\"d\":\"\",\"se\":\"Historically, SECL&rsquo;s contribution to CIL's total aggregate coal production is roughly around:\",\"sh\":\"ऐतिहासिक रूप से, CIL के कुल समग्र कोयला उत्पादन में SECL का योगदान लगभग कितना है:\",\"oe\":[\"15%\",\"45%\",\"10%\",\"25%\"],\"oh\":[\"15%\",\"45%\",\"10%\",\"25%\"],\"a\":3,\"ee\":\"SECL accounts for roughly one-fourth (~25%) of CIL&rsquo;s total production.\",\"eh\":\"SECL, CIL के कुल उत्पादन का लगभग एक-चौथाई (~25%) हिस्सा है।\"},{\"n\":52,\"d\":\"\",\"se\":\"In FY 2023-24, SECL's total production grew by over _____ compared to the previous year (167 MT):\",\"sh\":\"वित्तीय वर्ष 2023-24 में, पिछले वर्ष (167 MT) की तुलना में SECL के कुल उत्पादन में _____ से अधिक की वृद्धि हुई:\",\"oe\":[\"10%\",\"5%\",\"20%\",\"15%\"],\"oh\":[\"10%\",\"5%\",\"20%\",\"15%\"],\"a\":0,\"ee\":\"Growth from 167 MT to 184 MT represents a growth rate of roughly 10%.\",\"eh\":\"167 MT से 184 MT तक की वृद्धि लगभग 10% की विकास दर दर्शाती है।\"},{\"n\":53,\"d\":\"\",\"se\":\"SECL&rsquo;s <strong>Gevra Open Cast Project (OCP)</strong> is currently seeking environmental clearance to expand its annual production capacity to become the largest mine in Asia at:\",\"sh\":\"SECL का <strong>गेवरा ओपन कास्ट प्रोजेक्ट (Gevra OCP)</strong> वर्तमान में एशिया की सबसे बड़ी खदान बनने के लिए अपनी वार्षिक उत्पादन क्षमता को कितना बढ़ाने हेतु पर्यावरण मंजूरी (EC) मांग रहा है:\",\"oe\":[\"50 MTPA\",\"70 MTPA\",\"150 MTPA\",\"100 MTPA\"],\"oh\":[\"50 MTPA\",\"70 MTPA\",\"150 MTPA\",\"100 MTPA\"],\"a\":1,\"ee\":\"70 Million Tonnes Per Annum (MTPA).\",\"eh\":\"70 मिलियन टन प्रति वर्ष (MTPA)।\"},{\"n\":54,\"d\":\"\",\"se\":\"SECL's actual finalized production in the financial year 2022-23 was:\",\"sh\":\"वित्तीय वर्ष 2022-23 में SECL का वास्तविक अंतिम उत्पादन कितना था:\",\"oe\":[\"150 MT\",\"184 MT\",\"167 MT\",\"157 MT\"],\"oh\":[\"150 MT\",\"184 MT\",\"167 MT\",\"157 MT\"],\"a\":2,\"ee\":\"167 MT.\",\"eh\":\"167 MT।\"},{\"n\":55,\"d\":\"\",\"se\":\"The &quot;Big Three&quot; mega open-cast mines of SECL that drive the majority of its production are:\",\"sh\":\"SECL की &quot;बिग थ्री&quot; (Big Three) मेगा ओपन-कास्ट खदानें जो इसके अधिकांश उत्पादन को संचालित करती हैं, वे हैं:\",\"oe\":[\"Rajrappa, Piparwar, and Ashoka\",\"Chirimiri, Sohagpur, and Jamuna\",\"Jharia, Raniganj, and Talcher\",\"Gevra, Dipka, and Kusmunda\"],\"oh\":[\"रजरप्पा, पिपरवार, और अशोक\",\"चिरमिरी, सुहागपुर, और जमुना\",\"झरिया, रानीगंज, और तालचेर\",\"गेवरा, दीपका, और कुसमुंडा (Gevra, Dipka, and Kusmunda)\"],\"a\":3,\"ee\":\"Gevra, Dipka, and Kusmunda (all located in Korba, Chhattisgarh).\",\"eh\":\"गेवरा, दीपका और कुसमुंडा (सभी कोरबा, छत्तीसगढ़ में स्थित हैं)।\"},{\"n\":56,\"d\":\"\",\"se\":\"In mining terminology, OBR stands for Overburden Removal. SECL's historic OBR achievement recently crossed:\",\"sh\":\"खनन शब्दावली में, OBR का अर्थ ओवरबर्डन रिमूवल (Overburden Removal) है। SECL की ऐतिहासिक OBR उपलब्धि ने हाल ही में किसे पार किया:\",\"oe\":[\"281 million cubic metres\",\"500 million cubic metres\",\"200 million cubic metres\",\"100 million cubic metres\"],\"oh\":[\"281 मिलियन क्यूबिक मीटर\",\"500 मिलियन क्यूबिक मीटर\",\"200 मिलियन क्यूबिक मीटर\",\"100 मिलियन क्यूबिक मीटर\"],\"a\":0,\"ee\":\"Crossed 281 million cubic metres, enabling easier future coal extraction.\",\"eh\":\"281 मिलियन क्यूबिक मीटर को पार कर लिया, जिससे भविष्य में कोयला निकालना आसान हो जाएगा।\"},{\"n\":57,\"d\":\"\",\"se\":\"The <strong>Standing Orders</strong> of SECL strictly govern the service conditions and conduct of:\",\"sh\":\"SECL के <strong>स्थायी आदेश (Standing Orders)</strong> कड़ाई से किनकी सेवा शर्तों और आचरण को नियंत्रित करते हैं:\",\"oe\":[\"Executive employees only\",\"Non-executive employees (Workmen/Wage Board Employees)\",\"Both executives and non-executives\",\"Contractual daily wagers only\"],\"oh\":[\"केवल कार्यकारी (Executive) कर्मचारी\",\"गैर-कार्यकारी कर्मचारी (कामगार / Wage Board Employees)\",\"कार्यकारी और गैर-कार्यकारी दोनों\",\"केवल संविदात्मक दिहाड़ी मजदूर\"],\"a\":1,\"ee\":\"Standing Orders apply strictly to non-executives.\",\"eh\":\"स्थायी आदेश कड़ाई से गैर-अधिकारियों (non-executives) पर लागू होते हैं।\"},{\"n\":58,\"d\":\"\",\"se\":\"The Standing Orders of SECL are legally drafted and certified under the provisions of the:\",\"sh\":\"SECL के स्थायी आदेश कानूनी रूप से किस अधिनियम के प्रावधानों के तहत तैयार और प्रमाणित किए गए हैं:\",\"oe\":[\"Companies Act, 2013\",\"Industrial Employment (Standing Orders) Act, 1946\",\"Factories Act, 1948\",\"Mines Act, 1952\"],\"oh\":[\"कंपनी अधिनियम, 2013\",\"औद्योगिक रोजगार (स्थायी आदेश) अधिनियम, 1946\",\"कारखाना अधिनियम, 1948\",\"खान अधिनियम, 1952\"],\"a\":1,\"ee\":\"Industrial Employment (Standing Orders) Act, 1946.\",\"eh\":\"औद्योगिक रोजगार (स्थायी आदेश) अधिनियम, 1946।\"},{\"n\":59,\"d\":\"\",\"se\":\"The <strong>Conduct, Discipline &amp; Appeal (CDA) Rules</strong> of CIL are applicable to:\",\"sh\":\"CIL के <strong>आचरण, अनुशासन और अपील (CDA) नियम</strong> किन पर लागू होते हैं:\",\"oe\":[\"Only SECL executives\",\"Only CIL headquarters employees\",\"All executive (officer) employees of CIL and its subsidiaries\",\"All non-executive employees\"],\"oh\":[\"केवल SECL के अधिकारी\",\"केवल CIL मुख्यालय के कर्मचारी\",\"CIL और उसकी सहायक कंपनियों के सभी कार्यकारी (अधिकारी) कर्मचारी\",\"सभी गैर-कार्यकारी कर्मचारी\"],\"a\":2,\"ee\":\"Executives across CIL and its subsidiaries are governed by CDA Rules.\",\"eh\":\"CIL और उसकी सहायक कंपनियों में काम करने वाले अधिकारी CDA नियमों द्वारा शासित होते हैं।\"},{\"n\":60,\"d\":\"\",\"se\":\"Issues regarding the suspension, dismissal, or grievance redressal of a machine operator (non-executive) in SECL are handled under the:\",\"sh\":\"SECL में एक मशीन ऑपरेटर (गैर-कार्यकारी) के निलंबन, बर्खास्तगी या शिकायत निवारण से संबंधित मुद्दों को किसके तहत संभाला जाता है:\",\"oe\":[\"Companies Act, 2013\",\"Labor Protection Act\",\"CIL Executives' Conduct Rules\",\"SECL Certified Standing Orders\"],\"oh\":[\"कंपनी अधिनियम, 2013\",\"श्रम संरक्षण अधिनियम\",\"CIL अधिकारियों के आचरण नियम\",\"SECL प्रमाणित स्थायी आदेश (Certified Standing Orders)\"],\"a\":3,\"ee\":\"Certified Standing Orders.\",\"eh\":\"प्रमाणित स्थायी आदेश।\"},{\"n\":61,\"d\":\"\",\"se\":\"The designated <strong>Disciplinary Authority</strong> for Wage Board Employees of a specific SECL mine is determined by the:\",\"sh\":\"किसी विशिष्ट SECL खदान के कामगारों (Wage Board Employees) के लिए नामित <strong>अनुशासनात्मक प्राधिकारी (Disciplinary Authority)</strong> का निर्धारण किसके द्वारा किया जाता है:\",\"oe\":[\"Certified Standing Orders of that establishment\",\"CIL Conduct Rules\",\"Mines Act\",\"Union directives\"],\"oh\":[\"उस प्रतिष्ठान के प्रमाणित स्थायी आदेश (Standing Orders)\",\"CIL आचरण नियम\",\"खान अधिनियम\",\"यूनियन के निर्देश\"],\"a\":0,\"ee\":\"The Standing Orders clearly define the competent authorities.\",\"eh\":\"स्थायी आदेश स्पष्ट रूप से सक्षम अधिकारियों को परिभाषित करते हैं।\"},{\"n\":62,\"d\":\"\",\"se\":\"The Trade Union Act, under which multiple coal workers' unions in SECL operate and are registered, was originally enacted in:\",\"sh\":\"ट्रेड यूनियन अधिनियम, जिसके तहत SECL में कई कोयला श्रमिक संघ (unions) संचालित और पंजीकृत हैं, मूल रूप से किस वर्ष अधिनियमित किया गया था:\",\"oe\":[\"1973\",\"1926\",\"1946\",\"1952\"],\"oh\":[\"1973\",\"1926\",\"1946\",\"1952\"],\"a\":1,\"ee\":\"Trade Unions Act, 1926.\",\"eh\":\"ट्रेड यूनियन अधिनियम, 1926।\"},{\"n\":63,\"d\":\"\",\"se\":\"The overarching Code of Ethics for the management and executive cadres of CIL/SECL is derived from the:\",\"sh\":\"CIL/SECL के प्रबंधन और कार्यकारी संवर्ग (executive cadres) के लिए व्यापक <strong>आचार संहिता (Code of Ethics)</strong> कहाँ से प्राप्त होती है:\",\"oe\":[\"Memorandum of Association\",\"Articles of Association\",\"Conduct, Discipline &amp; Appeal (CDA) Rules\",\"Standing Orders\"],\"oh\":[\"मेमोरेंडम ऑफ एसोसिएशन\",\"आर्टिकल्स ऑफ एसोसिएशन\",\"आचरण, अनुशासन और अपील (CDA) नियम\",\"स्थायी आदेश (Standing Orders)\"],\"a\":2,\"ee\":\"CDA Rules.\",\"eh\":\"CDA नियम।\"},{\"n\":64,\"d\":\"\",\"se\":\"A breach of the Standing Orders by a workman can result in an inquiry initiated by the:\",\"sh\":\"किसी कामगार द्वारा 'स्थायी आदेशों' (Standing Orders) का उल्लंघन करने पर विभागीय जांच किसके द्वारा शुरू की जा सकती है:\",\"oe\":[\"District Magistrate\",\"Union President\",\"Labour Commissioner solely\",\"Project Officer / Mine Manager\"],\"oh\":[\"जिला मजिस्ट्रेट\",\"यूनियन अध्यक्ष\",\"केवल श्रम आयुक्त\",\"प्रोजेक्ट ऑफिसर / माइन मैनेजर (Project Officer / Mine Manager)\"],\"a\":3,\"ee\":\"Management (Project Officer/Manager) initiates the departmental inquiry.\",\"eh\":\"प्रबंधन (प्रोजेक्ट ऑफिसर/मैनेजर) विभागीय जांच शुरू करता है।\"},{\"n\":65,\"d\":\"\",\"se\":\"The Corporate Social Responsibility (CSR) initiatives of SECL fundamentally focus on:\",\"sh\":\"SECL की निगमित सामाजिक उत्तरदायित्व (CSR) पहल मौलिक रूप से किस पर केंद्रित है:\",\"oe\":[\"Inclusive development, healthcare, and welfare of the local population in coalfield regions\",\"Boosting global marketing\",\"Funding election campaigns\",\"Buying shares of competitors\"],\"oh\":[\"कोयला क्षेत्र के क्षेत्रों में स्थानीय आबादी का समावेशी विकास, स्वास्थ्य सेवा और कल्याण\",\"वैश्विक विपणन को बढ़ावा देना\",\"चुनाव अभियानों का वित्तपोषण\",\"प्रतिस्पर्धियों के शेयर खरीदना\"],\"a\":0,\"ee\":\"Welfare and development of mining-affected regions.\",\"eh\":\"खनन प्रभावित क्षेत्रों का कल्याण और विकास।\"},{\"n\":66,\"d\":\"\",\"se\":\"To promote local culture and community engagement, SECL organized the 'Sneh Milan Mela' in which district of Chhattisgarh?\",\"sh\":\"स्थानीय संस्कृति और सामुदायिक जुड़ाव को बढ़ावा देने के लिए, SECL ने छत्तीसगढ़ के किस जिले में 'स्नेह मिलन मेला' का आयोजन किया?\",\"oe\":[\"Korba\",\"Surajpur\",\"Raipur\",\"Bilaspur\"],\"oh\":[\"कोरबा\",\"सूरजपुर\",\"रायपुर\",\"बिलासपुर\"],\"a\":1,\"ee\":\"Surajpur district.\",\"eh\":\"सूरजपुर जिला।\"},{\"n\":67,\"d\":\"\",\"se\":\"The <strong>Vishwakarma Awards</strong> instituted by SECL are given specifically to recognize:\",\"sh\":\"SECL द्वारा स्थापित <strong>विश्वकर्मा पुरस्कार (Vishwakarma Awards)</strong> विशेष रूप से किसे पहचानने के लिए दिए जाते हैं:\",\"oe\":[\"The highest coal transporting railway zone\",\"The most profitable mine of the year\",\"The grit, dedication, and exemplary service of outstanding individual employees\",\"The best environmental NGO\"],\"oh\":[\"सबसे अधिक कोयला परिवहन करने वाला रेलवे क्षेत्र\",\"वर्ष की सबसे लाभदायक खदान\",\"उत्कृष्ट व्यक्तिगत कर्मचारियों का धैर्य, समर्पण और अनुकरणीय सेवा\",\"सर्वश्रेष्ठ पर्यावरण NGO\"],\"a\":2,\"ee\":\"Exemplary service of employees.\",\"eh\":\"कर्मचारियों की अनुकरणीय सेवा।\"},{\"n\":68,\"d\":\"\",\"se\":\"SECL's core <strong>Safety Policy</strong> and operational hazard mitigations are legally governed by the:\",\"sh\":\"SECL की मुख्य <strong>सुरक्षा नीति (Safety Policy)</strong> और परिचालन संबंधी खतरे कम करने के उपाय कानूनी रूप से किसके द्वारा शासित होते हैं:\",\"oe\":[\"Factories Act, 1948\",\"Environmental Protection Act, 1986\",\"Companies Act, 2013\",\"Mines Act, 1952 and Coal Mines Regulations (CMR), 2017\"],\"oh\":[\"कारखाना अधिनियम, 1948\",\"पर्यावरण संरक्षण अधिनियम, 1986\",\"कंपनी अधिनियम, 2013\",\"खान अधिनियम, 1952 और कोयला खान विनियम (CMR), 2017\"],\"a\":3,\"ee\":\"Mines Act and CMR 2017.\",\"eh\":\"खान अधिनियम और CMR 2017।\"},{\"n\":69,\"d\":\"\",\"se\":\"In terms of environmental sustainability, SECL has aggressively adopted the <strong>'Miyawaki'</strong> method, which refers to:\",\"sh\":\"पर्यावरणीय स्थिरता के संदर्भ में, SECL ने आक्रामक रूप से <strong>'मियावाकी' (Miyawaki)</strong> पद्धति को अपनाया है, जो किसको संदर्भित करता है:\",\"oe\":[\"A rapid afforestation and dense plantation technique\",\"A water purification system\",\"A Japanese method of underground blasting\",\"A coal washing technology\"],\"oh\":[\"तेजी से वनीकरण (afforestation) और सघन वृक्षारोपण तकनीक\",\"जल शोधन प्रणाली\",\"भूमिगत ब्लास्टिंग की एक जापानी विधि\",\"कोयला धोने (coal washing) की तकनीक\"],\"a\":0,\"ee\":\"A method for creating dense, fast-growing urban forests.\",\"eh\":\"घने, तेजी से बढ़ने वाले शहरी वन बनाने की एक विधि।\"},{\"n\":70,\"d\":\"\",\"se\":\"Mandatory <strong>Environmental Clearances (EC)</strong> required for expanding or opening new coal mining projects in SECL are granted by the:\",\"sh\":\"SECL में नई कोयला खनन परियोजनाओं का विस्तार करने या खोलने के लिए आवश्यक अनिवार्य <strong>पर्यावरण मंजूरी (Environmental Clearances - EC)</strong> किसके द्वारा दी जाती है:\",\"oe\":[\"Ministry of Coal\",\"Ministry of Environment, Forest and Climate Change (MoEFCC)\",\"State Pollution Control Board exclusively\",\"Coal Controller\"],\"oh\":[\"कोयला मंत्रालय\",\"पर्यावरण, वन और जलवायु परिवर्तन मंत्रालय (MoEFCC)\",\"विशेष रूप से राज्य प्रदूषण नियंत्रण बोर्ड\",\"कोयला नियंत्रक\"],\"a\":1,\"ee\":\"MoEFCC (Central level clearance).\",\"eh\":\"MoEFCC (केंद्रीय स्तर की मंजूरी)।\"},{\"n\":71,\"d\":\"\",\"se\":\"SECL routinely undertakes <strong>&quot;Mine Closure&quot;</strong> activities, which essentially involve:\",\"sh\":\"SECL नियमित रूप से <strong>&quot;माइन क्लोजर&quot; (Mine Closure)</strong> गतिविधियाँ करता है, जिनमें अनिवार्य रूप से क्या शामिल होता है:\",\"oe\":[\"Firing all employees once a mine is depleted\",\"Selling the mine to private players\",\"Environmental sustainability, land reclamation, and ecological restoration of depleted mines\",\"Abandoning the land as it is\"],\"oh\":[\"खदान खाली होने पर सभी कर्मचारियों को निकाल देना\",\"खदान को निजी खिलाड़ियों को बेचना\",\"पर्यावरणीय स्थिरता, भूमि सुधार (land reclamation), और समाप्त हो चुकी खदानों की पारिस्थितिक बहाली\",\"भूमि को वैसे ही छोड़ देना\"],\"a\":2,\"ee\":\"Systematic ecological restoration.\",\"eh\":\"व्यवस्थित पारिस्थितिक बहाली (ecological restoration)।\"},{\"n\":72,\"d\":\"\",\"se\":\"The regulatory body that enforces pollution norms and monitors air/water quality around SECL mines is the:\",\"sh\":\"वह नियामक निकाय (regulatory body) जो प्रदूषण मानदंडों को लागू करता है और SECL खदानों के आसपास हवा/पानी की गुणवत्ता की निगरानी करता है:\",\"oe\":[\"CMPDIL\",\"Directorate General of Mines Safety (DGMS)\",\"NITI Aayog\",\"Central and State Pollution Control Boards (CPCB/SPCB)\"],\"oh\":[\"CMPDIL\",\"खान सुरक्षा महानिदेशालय (DGMS)\",\"NITI आयोग\",\"केंद्रीय और राज्य प्रदूषण नियंत्रण बोर्ड (CPCB/SPCB)\"],\"a\":3,\"ee\":\"Pollution Control Boards.\",\"eh\":\"प्रदूषण नियंत्रण बोर्ड।\"},{\"n\":73,\"d\":\"\",\"se\":\"SECL is increasingly participating in <strong>Coal Gasification</strong> projects primarily to promote:\",\"sh\":\"SECL मुख्य रूप से किस चीज़ को बढ़ावा देने के लिए <strong>कोल गैसीकरण (Coal Gasification)</strong> परियोजनाओं में तेजी से भाग ले रहा है:\",\"oe\":[\"Clean coal technology and value addition (converting coal to syngas)\",\"Exporting raw coal faster\",\"The immediate privatization of mines\",\"Mass reduction of manpower\"],\"oh\":[\"स्वच्छ कोयला प्रौद्योगिकी और मूल्य संवर्धन (कोयले को सिनगैस - syngas में बदलना)\",\"कच्चा कोयला तेजी से निर्यात करना\",\"खदानों का तत्काल निजीकरण\",\"जनशक्ति (manpower) में भारी कमी\"],\"a\":0,\"ee\":\"Converting coal into syngas/chemicals reduces carbon emissions compared to direct burning.\",\"eh\":\"कोयले को सिनगैस/रसायनों में बदलने से सीधे जलने की तुलना में कार्बन उत्सर्जन कम होता है।\"},{\"n\":74,\"d\":\"\",\"se\":\"As part of its <strong>Digitization Initiatives</strong>, SECL has implemented:\",\"sh\":\"अपनी <strong>डिजिटलीकरण पहल (Digitization Initiatives)</strong> के हिस्से के रूप में, SECL ने लागू किया है:\",\"oe\":[\"Virtual reality gaming for miners\",\"E-Office, ERP (Enterprise Resource Planning), and digital portals for real-time operations monitoring\",\"Cryptocurrency mining\",\"Direct retail e-commerce selling of coal by the kg\"],\"oh\":[\"खनिकों के लिए आभासी वास्तविकता (VR) गेमिंग\",\"ई-ऑफिस, ERP (एंटरप्राइज रिसोर्स प्लानिंग), और रियल-टाइम ऑपरेशंस मॉनिटरिंग के लिए डिजिटल पोर्टल\",\"क्रिप्टोकरेंसी माइनिंग\",\"किलो के हिसाब से कोयले की सीधी खुदरा ई-कॉमर्स बिक्री\"],\"a\":1,\"ee\":\"ERP (Project Passion) and real-time monitoring portals.\",\"eh\":\"ERP (Project Passion) और रियल-टाइम मॉनिटरिंग पोर्टल।\"},{\"n\":75,\"d\":\"\",\"se\":\"The first major <strong>Coal Washery</strong> established within SECL to supply clean, ash-reduced coal is located at:\",\"sh\":\"स्वच्छ, राख-कम कोयले की आपूर्ति के लिए SECL के भीतर स्थापित पहला प्रमुख <strong>कोल वॉशरी (Coal Washery)</strong> कहाँ स्थित है:\",\"oe\":[\"Chirimiri\",\"Sohagpur\",\"Korba\",\"Raigarh\"],\"oh\":[\"चिरमिरी\",\"सुहागपुर\",\"कोरबा (Korba)\",\"रायगढ़\"],\"a\":2,\"ee\":\"Korba Coal Washery.\",\"eh\":\"कोरबा कोल वॉशरी।\"},{\"n\":76,\"d\":\"\",\"se\":\"SECL&rsquo;s modernization strategy focuses heavily on the deployment of FMC projects. FMC stands for:\",\"sh\":\"SECL की आधुनिकीकरण रणनीति FMC परियोजनाओं की तैनाती पर बहुत अधिक ध्यान केंद्रित करती है। FMC का अर्थ है:\",\"oe\":[\"Free Mining Costs\",\"Final Mine Closure\",\"Fast Moving Coal\",\"First Mile Connectivity (mechanized coal transport via conveyors/silos)\"],\"oh\":[\"फ्री माइनिंग कॉस्ट (Free Mining Costs)\",\"फाइनल माइन क्लोजर (Final Mine Closure)\",\"फास्ट मूविंग कोल (Fast Moving Coal)\",\"फर्स्ट माइल कनेक्टिविटी (First Mile Connectivity - कन्वेयर/साइलो के माध्यम से यंत्रीकृत कोयला परिवहन)\"],\"a\":3,\"ee\":\"First Mile Connectivity (eliminating road transport to reduce pollution).\",\"eh\":\"फर्स्ट माइल कनेक्टिविटी (प्रदूषण को कम करने के लिए सड़क परिवहन को खत्म करना)।\"},{\"n\":77,\"d\":\"\",\"se\":\"To enhance underground mining safety and production, SECL is replacing manual loading with Continuous Miners and:\",\"sh\":\"भूमिगत (underground) खनन सुरक्षा और उत्पादन को बढ़ाने के लिए, SECL मैनुअल लोडिंग को कंटीन्यूअस माइनर्स (Continuous Miners) और किसके साथ बदल रहा है:\",\"oe\":[\"Load Haul Dump (LHD) and Side Discharge Loader (SDL) machines\",\"Shovels\",\"Draglines\",\"Surface Miners\"],\"oh\":[\"लोड हॉल डंप (LHD) और साइड डिस्चार्ज लोडर (SDL) मशीनें\",\"फावड़े (Shovels)\",\"ड्रैगलाइन (Draglines)\",\"सरफेस माइनर्स (Surface Miners)\"],\"a\":0,\"ee\":\"LHD and SDL machines are staple underground mechanization tools.\",\"eh\":\"LHD और SDL मशीनें भूमिगत यंत्रीकरण के प्रमुख उपकरण हैं।\"},{\"n\":78,\"d\":\"\",\"se\":\"The current Chairman and Managing Director (CMD) of SECL (as of recent appointments) is:\",\"sh\":\"हाल की नियुक्तियों के अनुसार SECL के वर्तमान अध्यक्ष और प्रबंध निदेशक (CMD) कौन हैं:\",\"oe\":[\"A.K. Jain\",\"Dr. Prem Sagar Mishra\",\"S.K. Mishra\",\"P.M. Prasad\"],\"oh\":[\"ए.के. जैन\",\"डॉ. प्रेम सागर मिश्रा (Dr. Prem Sagar Mishra)\",\"एस.के. मिश्रा\",\"पी.एम. प्रसाद\"],\"a\":1,\"ee\":\"Dr. Prem Sagar Mishra took over as CMD of SECL.\",\"eh\":\"डॉ. प्रेम सागर मिश्रा ने SECL के CMD का पदभार संभाला।\"},{\"n\":79,\"d\":\"\",\"se\":\"The current Chairman of the parent company, Coal India Limited (CIL), is:\",\"sh\":\"मूल कंपनी, कोल इंडिया लिमिटेड (CIL) के वर्तमान अध्यक्ष (Chairman) कौन हैं:\",\"oe\":[\"S.K. Mishra\",\"Pramod Agrawal\",\"P.M. Prasad\",\"Amrit Lal Meena\"],\"oh\":[\"एस.के. मिश्रा\",\"प्रमोद अग्रवाल\",\"पी.एम. प्रसाद (P.M. Prasad)\",\"अमृत लाल मीणा\"],\"a\":2,\"ee\":\"P.M. Prasad assumed the role of Chairman of CIL in July 2023.\",\"eh\":\"पी.एम. प्रसाद ने जुलाई 2023 में CIL के अध्यक्ष की भूमिका निभाई।\"},{\"n\":80,\"d\":\"\",\"se\":\"The administrative control and policy direction of CIL and SECL fall directly under the:\",\"sh\":\"CIL और SECL का प्रशासनिक नियंत्रण और नीतिगत निर्देश सीधे किसके अधीन आते हैं:\",\"oe\":[\"Ministry of Power\",\"Ministry of Heavy Industries\",\"Ministry of Mines\",\"Ministry of Coal\"],\"oh\":[\"विद्युत मंत्रालय\",\"भारी उद्योग मंत्रालय\",\"खान मंत्रालय\",\"कोयला मंत्रालय (Ministry of Coal)\"],\"a\":3,\"ee\":\"Ministry of Coal.\",\"eh\":\"कोयला मंत्रालय।\"},{\"n\":81,\"d\":\"\",\"se\":\"The current Union Cabinet Minister of Coal (as of the 2024 government formation) is:\",\"sh\":\"2024 के सरकारी गठन के अनुसार वर्तमान केंद्रीय कैबिनेट कोयला मंत्री कौन हैं:\",\"oe\":[\"G. Kishan Reddy\",\"Pralhad Joshi\",\"Piyush Goyal\",\"Amit Shah\"],\"oh\":[\"जी. किशन रेड्डी (G. Kishan Reddy)\",\"प्रल्हाद जोशी\",\"पीयूष गोयल\",\"अमित शाह\"],\"a\":0,\"ee\":\"G. Kishan Reddy. (Satish Chandra Dubey is the Minister of State).\",\"eh\":\"जी. किशन रेड्डी। (सतीश चंद्र दुबे राज्य मंत्री हैं)।\"},{\"n\":82,\"d\":\"\",\"se\":\"In 2011, recognizing its massive operational scale and profitability, the Government of India granted Coal India Limited (CIL) the status of a:\",\"sh\":\"2011 में, इसके बड़े पैमाने पर परिचालन और लाभप्रदता को मान्यता देते हुए, भारत सरकार ने कोल इंडिया लिमिटेड (CIL) को किसका दर्जा दिया:\",\"oe\":[\"Navratna\",\"Maharatna\",\"Miniratna Category-I\",\"Unicorn CPSE\"],\"oh\":[\"नवरत्न\",\"महारत्न (Maharatna)\",\"मिनीरत्न श्रेणी-I\",\"मेगा-PSU\"],\"a\":1,\"ee\":\"CIL is a Maharatna CPSE.\",\"eh\":\"CIL एक महारत्न CPSE है।\"},{\"n\":83,\"d\":\"\",\"se\":\"SECL itself was conferred the prestigious 'Miniratna Category-I' status in the year:\",\"sh\":\"SECL को स्वयं प्रतिष्ठित 'मिनीरत्न श्रेणी-I' का दर्जा किस वर्ष प्रदान किया गया था:\",\"oe\":[\"2015\",\"2011\",\"2007\",\"1998\"],\"oh\":[\"2015\",\"2011\",\"2007\",\"1998\"],\"a\":2,\"ee\":\"Granted in 2007 due to its consistent profitability.\",\"eh\":\"इसकी निरंतर लाभप्रदता के कारण 2007 में यह दर्जा दिया गया था।\"},{\"n\":84,\"d\":\"\",\"se\":\"As of recent financial filings (2024), the Government of India's shareholding stake in Coal India Limited is approximately:\",\"sh\":\"हालिया वित्तीय फाइलिंग (2024) के अनुसार, कोल इंडिया लिमिटेड में भारत सरकार की शेयरधारिता (shareholding) हिस्सेदारी लगभग कितनी है:\",\"oe\":[\"51%\",\"100%\",\"75%\",\"63%\"],\"oh\":[\"51%\",\"100%\",\"75%\",\"63%\"],\"a\":3,\"ee\":\"Roughly 63.13% (the rest is public/institutional holding).\",\"eh\":\"लगभग 63.13% (बाकी सार्वजनिक/संस्थागत होल्डिंग है)।\"},{\"n\":85,\"d\":\"\",\"se\":\"The primary function of CIL's non-producing subsidiary, <strong>CMPDIL</strong>, is:\",\"sh\":\"CIL की गैर-उत्पादक सहायक कंपनी, <strong>CMPDIL</strong> का प्राथमिक कार्य क्या है:\",\"oe\":[\"Mine planning, design, and geological exploration\",\"Coal extraction and export\",\"Heavy machinery manufacturing\",\"Power generation\"],\"oh\":[\"खदान योजना, डिजाइन और भूवैज्ञानिक अन्वेषण (Mine planning, design, and geological exploration)\",\"कोयला निष्कर्षण और निर्यात\",\"भारी मशीनरी निर्माण\",\"विद्युत उत्पादन\"],\"a\":0,\"ee\":\"It is the in-house planning and design institute for CIL.\",\"eh\":\"यह CIL के लिए इन-हाउस प्लानिंग और डिजाइन संस्थान है।\"},{\"n\":86,\"d\":\"\",\"se\":\"The official vision of Coal India Limited is to:\",\"sh\":\"कोल इंडिया लिमिटेड का आधिकारिक विजन (Vision) क्या है:\",\"oe\":[\"Maximize short-term profits through rapid excavation\",\"Emerge as a global player in the primary energy sector committed to provide energy security with sustainable mining\",\"Privatize all coal assets by 2030\",\"Import high-grade coal exclusively\"],\"oh\":[\"तीव्र उत्खनन के माध्यम से अल्पकालिक लाभ को अधिकतम करना\",\"स्थायी खनन के साथ ऊर्जा सुरक्षा प्रदान करने के लिए प्रतिबद्ध प्राथमिक ऊर्जा क्षेत्र में एक वैश्विक खिलाड़ी के रूप में उभरना\",\"2030 तक सभी कोयला संपत्तियों का निजीकरण करना\",\"विशेष रूप से उच्च श्रेणी के कोयले का आयात करना\"],\"a\":1,\"ee\":\"Energy security through sustainable mining.\",\"eh\":\"स्थायी खनन के माध्यम से ऊर्जा सुरक्षा।\"},{\"n\":87,\"d\":\"\",\"se\":\"SECL&rsquo;s primary business objective perfectly aligns with CIL&rsquo;s mission to:\",\"sh\":\"SECL का प्राथमिक व्यावसायिक उद्देश्य CIL के किस मिशन के साथ पूरी तरह से मेल खाता है:\",\"oe\":[\"Exclusively serve private steel plants\",\"Reduce total thermal power reliance\",\"Maximize coal production to ensure India's energy security while preserving the environment\",\"Eliminate all underground mines\"],\"oh\":[\"विशेष रूप से निजी इस्पात संयंत्रों की सेवा करना\",\"कुल थर्मल पावर निर्भरता को कम करना\",\"पर्यावरण को संरक्षित करते हुए भारत की ऊर्जा सुरक्षा सुनिश्चित करने के लिए कोयला उत्पादन को अधिकतम करना\",\"सभी भूमिगत खदानों को खत्म करना\"],\"a\":2,\"ee\":\"National energy security.\",\"eh\":\"राष्ट्रीय ऊर्जा सुरक्षा।\"},{\"n\":88,\"d\":\"\",\"se\":\"The vast majority of SECL&rsquo;s (and CIL's) total coal production comes from which mining method?\",\"sh\":\"SECL के (और CIL के) कुल कोयला उत्पादन का विशाल बहुमत किस खनन पद्धति से आता है?\",\"oe\":[\"Hydraulic mining\",\"Deep Underground mining\",\"Borehole mining\",\"Open-cast (surface) mining\"],\"oh\":[\"हाइड्रोलिक खनन\",\"गहरी भूमिगत (Underground) खनन\",\"बोरहोल खनन\",\"ओपन-कास्ट (Open-cast / surface) खनन\"],\"a\":3,\"ee\":\"Over 90% of production comes from Open-cast mines (like Gevra, Dipka).\",\"eh\":\"90% से अधिक उत्पादन ओपन-कास्ट खदानों (जैसे गेवरा, दीपका) से आता है।\"},{\"n\":89,\"d\":\"\",\"se\":\"The total active manpower (workforce) of SECL currently stands at approximately:\",\"sh\":\"वर्तमान में SECL की कुल सक्रिय जनशक्ति (कार्यबल) लगभग कितनी है:\",\"oe\":[\"~42,000 to 45,000\",\"~70,000\",\"~1,00,000\",\"~90,000\"],\"oh\":[\"~42,000 से 45,000\",\"~70,000\",\"~1,00,000\",\"~90,000\"],\"a\":0,\"ee\":\"Due to natural attrition and mechanization, the workforce is currently around 42,000-45,000.\",\"eh\":\"प्राकृतिक सेवानिवृत्ति (attrition) और यंत्रीकरण के कारण, कार्यबल वर्तमान में लगभग 42,000-45,000 है।\"},{\"n\":90,\"d\":\"\",\"se\":\"The standalone active manpower of the entire Coal India Limited (CIL) conglomerate is approximately:\",\"sh\":\"पूरे कोल इंडिया लिमिटेड (CIL) समूह की स्टैंडअलोन सक्रिय जनशक्ति लगभग कितनी है:\",\"oe\":[\"~4.00 Lakh\",\"~2.38 Lakh\",\"~3.50 Lakh\",\"~1.50 Lakh\"],\"oh\":[\"~4.00 लाख\",\"~2.38 लाख\",\"~3.50 लाख\",\"~1.50 लाख\"],\"a\":1,\"ee\":\"Roughly 2.3 to 2.4 Lakh employees.\",\"eh\":\"लगभग 2.3 से 2.4 लाख कर्मचारी।\"},{\"n\":91,\"d\":\"\",\"se\":\"SECL&rsquo;s compliance with the use of Hindi in official corporate documentation is governed by the:\",\"sh\":\"आधिकारिक कॉर्पोरेट दस्तावेज़ीकरण में हिंदी के उपयोग के संबंध में SECL का अनुपालन किसके द्वारा शासित होता है:\",\"oe\":[\"Mines Act, 1952\",\"Companies Act, 2013\",\"Official Languages Act, 1963\",\"Constitution of India (Article 370)\"],\"oh\":[\"खान अधिनियम, 1952\",\"कंपनी अधिनियम, 2013\",\"राजभाषा अधिनियम, 1963 (Official Languages Act, 1963)\",\"भारत का संविधान (अनुच्छेद 370)\"],\"a\":2,\"ee\":\"Official Languages Act, 1963 (Rajbhasha Adhiniyam).\",\"eh\":\"राजभाषा अधिनियम, 1963।\"},{\"n\":92,\"d\":\"\",\"se\":\"The primary authority that inspects SECL mines to ensure strict compliance with worker safety regulations is the:\",\"sh\":\"प्राथमिक प्राधिकरण जो श्रमिक सुरक्षा नियमों का सख्त अनुपालन सुनिश्चित करने के लिए SECL खदानों का निरीक्षण करता है:\",\"oe\":[\"State Police\",\"NITI Aayog\",\"Central Bureau of Investigation (CBI)\",\"Directorate General of Mines Safety (DGMS)\"],\"oh\":[\"राज्य पुलिस\",\"NITI आयोग\",\"केंद्रीय जांच ब्यूरो (CBI)\",\"खान सुरक्षा महानिदेशालय (DGMS)\"],\"a\":3,\"ee\":\"DGMS ensures safety compliance under the Mines Act.\",\"eh\":\"DGMS खान अधिनियम के तहत सुरक्षा अनुपालन सुनिश्चित करता है।\"},{\"n\":93,\"d\":\"\",\"se\":\"One of the oldest historic coalfields currently operating under the jurisdiction of SECL is:\",\"sh\":\"वर्तमान में SECL के अधिकार क्षेत्र में काम करने वाले सबसे पुराने ऐतिहासिक कोयला क्षेत्रों में से एक है:\",\"oe\":[\"Chirimiri\",\"Sohagpur\",\"Korba\",\"Raigarh\"],\"oh\":[\"चिरमिरी (Chirimiri)\",\"सुहागपुर\",\"कोरबा\",\"रायगढ़\"],\"a\":0,\"ee\":\"Chirimiri coalfield has a long history of underground mining.\",\"eh\":\"चिरमिरी कोयला क्षेत्र का भूमिगत खनन का एक लंबा इतिहास रहा है।\"},{\"n\":94,\"d\":\"\",\"se\":\"In FY 2023-24, SECL crossed a historic milestone in coal production, firmly surpassing:\",\"sh\":\"वित्तीय वर्ष 2023-24 में, SECL ने कोयला उत्पादन में एक ऐतिहासिक मील का पत्थर पार किया, जो मजबूती से इससे आगे निकल गया:\",\"oe\":[\"170 MT\",\"183 MT\",\"100 MT\",\"150 MT\"],\"oh\":[\"170 MT\",\"183 MT\",\"100 MT\",\"150 MT\"],\"a\":1,\"ee\":\"SECL produced 183.94 MT, breaking all its previous records.\",\"eh\":\"SECL ने 183.94 MT का उत्पादन किया, और अपने सभी पिछले रिकॉर्ड तोड़ दिए।\"},{\"n\":95,\"d\":\"\",\"se\":\"SECL frequently utilizes FMC projects to reduce dust pollution. The core infrastructure of an FMC (First Mile Connectivity) project involves:\",\"sh\":\"SECL अक्सर धूल प्रदूषण को कम करने के लिए FMC परियोजनाओं का उपयोग करता है। एक FMC (फर्स्ट माइल कनेक्टिविटी) परियोजना के मुख्य बुनियादी ढांचे में शामिल हैं:\",\"oe\":[\"Underground rail lines\",\"Electric trucks\",\"Coal handling plants (CHPs), silos, and mechanized conveyor belts leading to railway sidings\",\"Drone-based transport\"],\"oh\":[\"भूमिगत रेल लाइनें\",\"इलेक्ट्रिक ट्रक\",\"कोल हैंडलिंग प्लांट (CHPs), साइलो (silos), और रेलवे साइडिंग तक जाने वाले यंत्रीकृत कन्वेयर बेल्ट\",\"ड्रोन-आधारित परिवहन\"],\"a\":2,\"ee\":\"Mechanized CHPs and Silos.\",\"eh\":\"यंत्रीकृत CHPs और साइलो।\"},{\"n\":96,\"d\":\"\",\"se\":\"The nodal agency responsible for the collection and collection of the coal cess (used partly for environmental funds) and monitoring coal data is the:\",\"sh\":\"कोयला उपकर (जिसका उपयोग आंशिक रूप से पर्यावरण निधि के लिए किया जाता है) के संग्रह और कोयला डेटा की निगरानी के लिए जिम्मेदार नोडल एजेंसी है:\",\"oe\":[\"NITI Aayog\",\"Ministry of Finance\",\"PMO\",\"Coal Controller's Organisation (CCO)\"],\"oh\":[\"NITI आयोग\",\"वित्त मंत्रालय\",\"PMO\",\"कोयला नियंत्रक संगठन (Coal Controller's Organisation - CCO)\"],\"a\":3,\"ee\":\"Coal Controller's Organisation.\",\"eh\":\"कोयला नियंत्रक संगठन।\"},{\"n\":97,\"d\":\"\",\"se\":\"As a prestigious recognition of its market capitalization, net worth, and profitability, CIL is officially classified as a:\",\"sh\":\"इसके बाजार पूंजीकरण, निवल मूल्य और लाभप्रदता की एक प्रतिष्ठित मान्यता के रूप में, CIL को आधिकारिक तौर पर किस रूप में वर्गीकृत किया गया है:\",\"oe\":[\"Maharatna\",\"Navratna\",\"Mega-PSU\",\"Miniratna\"],\"oh\":[\"महारत्न (Maharatna)\",\"नवरत्न\",\"मेगा-PSU\",\"मिनीरत्न\"],\"a\":0,\"ee\":\"Maharatna.\",\"eh\":\"महारत्न।\"},{\"n\":98,\"d\":\"\",\"se\":\"The CMPFO (Coal Mines Provident Fund Organisation) was uniquely established to provide social security to:\",\"sh\":\"CMPFO (कोल माइंस प्रोविडेंट फंड ऑर्गनाइजेशन) को विशेष रूप से किसे सामाजिक सुरक्षा (social security) प्रदान करने के लिए स्थापित किया गया था:\",\"oe\":[\"Agricultural farmers\",\"Specifically to coal sector workers\",\"All government employees\",\"Private sector IT employees\"],\"oh\":[\"कृषि किसान\",\"विशेष रूप से कोयला क्षेत्र के श्रमिक (Coal sector workers)\",\"सभी सरकारी कर्मचारी\",\"निजी क्षेत्र के आईटी कर्मचारी\"],\"a\":1,\"ee\":\"Exclusive social security body for coal workers.\",\"eh\":\"कोयला श्रमिकों के लिए विशेष सामाजिक सुरक्षा निकाय।\"},{\"n\":99,\"d\":\"\",\"se\":\"Under recent enhancements, the minimum guaranteed monthly pension under the Coal Mines Pension Scheme (CMPS) was increased to:\",\"sh\":\"हाल ही में हुए सुधारों के तहत, कोल माइंस पेंशन स्कीम (CMPS) के तहत न्यूनतम गारंटीकृत मासिक पेंशन को बढ़ाकर कितना कर दिय ,\"तत्पुरुष समास (तिलक का चन्दन)\"],\"oh\":[\"अव्ययीभाव समास (तिलक के साथ चन्दन)\",\"द्वंद्व समास (तिलक और चन्दन)\",\"अपादान समास (तिलक से चन्दन)\",\"तत्पुरुष समास (तिलक का चन्दन)\"],\"a\":1,\"ee\":\"यह द्वंद्व समास है, जहाँ दोनों पद प्रधान होते हैं (तिलक और चन्दन)।\",\"eh\":\"यह द्वंद्व समास है, जहाँ दोनों पद प्रधान होते हैं (तिलक और चन्दन)।\"}]},{\"id\":\"as7\",\"num\":7,\"name\":\"General Awareness\",\"q\":[{\"n\":1,\"d\":\"\",\"se\":\"Coal India Limited crossed the 100 Million Tonne production mark early in FY 2026-27. Which subsidiary emerged as the leading contributor to this milestone?\",\"sh\":\"कोल इंडिया लिमिटेड ने वित्तीय वर्ष 2026-27 की शुरुआत में 100 मिलियन टन उत्पादन का आंकड़ा पार कर लिया। इस उपलब्धि में किस सहायक कंपनी का सबसे बड़ा योगदान रहा?\",\"oe\":[\"Eastern Coalfields Limited\",\"Northern Coalfields Limited\",\"South Eastern Coalfields Limited\",\"Mahanadi Coalfields Limited\"],\"oh\":[\"ईस्टर्न कोलफील्ड्स लिमिटेड\",\"नॉर्दर्न कोलफील्ड्स लिमिटेड\",\"साउथ ईस्टर्न कोलफील्ड्स लिमिटेड (SECL)\",\"महानदी कोलफील्ड्स लिमिटेड\"],\"a\":2,\"ee\":\"SECL emerged as the leading contributor by producing over 26.8 Million Tonnes in that specific period.\",\"eh\":\"उस विशिष्ट अवधि में 26.8 मिलियन टन से अधिक उत्पादन करके SECL प्रमुख योगदानकर्ता बनकर उभरा।\"},{\"n\":2,\"d\":\"\",\"se\":\"SECL registered a production growth of 5.26% in FY 2025-26, reaching a total production of:\",\"sh\":\"वित्तीय वर्ष 2025-26 में SECL ने 5.26% की उत्पादन वृद्धि दर्ज की, जिससे इसका कुल उत्पादन कितना हो गया:\",\"oe\":[\"190.0 MT\",\"167.4 MT\",\"180.5 MT\",\"176.2 MT\"],\"oh\":[\"190.0 MT\",\"167.4 MT\",\"180.5 MT\",\"176.2 MT\"],\"a\":3,\"ee\":\"SECL recorded a total coal production of 176.2 million tonnes (MT) in FY 2025-26.\",\"eh\":\"SECL ने वित्तीय वर्ष 2025-26 में 176.2 मिलियन टन (MT) का कुल कोयला उत्पादन दर्ज किया।\"},{\"n\":3,\"d\":\"\",\"se\":\"SECL signed a strategic MoU with which organization to strengthen coal logistics and its rail transportation network?\",\"sh\":\"SECL ने कोयला रसद (logistics) और अपने रेल परिवहन नेटवर्क को मजबूत करने के लिए किस संगठन के साथ एक रणनीतिक समझौता ज्ञापन (MoU) पर हस्ताक्षर किए हैं?\",\"oe\":[\"Central Warehousing Corporation (CWC)\",\"Container Corporation of India\",\"Indian Railways\",\"National Highways Authority of India\"],\"oh\":[\"केंद्रीय भंडारण निगम (Central Warehousing Corporation - CWC)\",\"कंटेनर कॉर्पोरेशन ऑफ इंडिया\",\"भारतीय रेलवे\",\"भारतीय राष्ट्रीय राजमार्ग प्राधिकरण\"],\"a\":0,\"ee\":\"Central Warehousing Corporation.\",\"eh\":\"केंद्रीय भंडारण निगम (CWC)।\"},{\"n\":4,\"d\":\"\",\"se\":\"How many abandoned and depleted mines did SECL systematically close for ecological restoration in the two financial years 2024-25 and 2025-26 combined?\",\"sh\":\"दो वित्तीय वर्षों 2024-25 और 2025-26 को मिलाकर, SECL ने पारिस्थितिक बहाली (ecological restoration) के लिए कितनी परित्यक्त (abandoned) खदानों को व्यवस्थित रूप से बंद किया?\",\"oe\":[\"54\",\"28\",\"15\",\"25\"],\"oh\":[\"54\",\"28\",\"15\",\"25\"],\"a\":1,\"ee\":\"SECL completed the closure of 3 mines during 2024-25 and 25 mines during 2025-26, totaling 28 mines.\",\"eh\":\"SECL ने 2024-25 के दौरान 3 खदानों और 2025-26 के दौरान 25 खदानों को बंद किया, जो कुल 28 खदानें हैं।\"},{\"n\":5,\"d\":\"\",\"se\":\"Out of Coal India's production milestone of 100 MT in the early phase of FY 2026-27, how many million tonnes were contributed by SECL alone?\",\"sh\":\"वित्तीय वर्ष 2026-27 के प्रारंभिक चरण में कोल इंडिया के 100 MT के उत्पादन लक्ष्य में अकेले SECL ने कितने मिलियन टन का योगदान दिया?\",\"oe\":[\"30.0 MT\",\"25.5 MT\",\"26.86 MT\",\"28.0 MT\"],\"oh\":[\"30.0 MT\",\"25.5 MT\",\"26.86 MT\",\"28.0 MT\"],\"a\":2,\"ee\":\"26.86 MT.\",\"eh\":\"26.86 MT।\"},{\"n\":6,\"d\":\"\",\"se\":\"In late 2025, SECL inaugurated its first fully women-operated Central Store Unit at the Central Workshop located in:\",\"sh\":\"2025 के अंत में, SECL ने अपना पहला पूर्णतः महिलाओं द्वारा संचालित 'केंद्रीय स्टोर यूनिट' (Central Store Unit) किस केंद्रीय कार्यशाला में शुरू ":\"1 जुलाई 2017।\"},{\"n\":19,\"d\":\"\",\"se\":\"The <strong>NITI Aayog</strong> (replacing the Planning Commission) was established in the year:\",\"sh\":\"योजना आयोग के स्थान पर <strong>नीति (NITI) आयोग</strong> की स्थापना किस वर्ष की गई थी:\",\"oe\":[\"2015\",\"2016\",\"2014\",\"2017\"],\"oh\":[\"2015\",\"2016\",\"2014\",\"2017\"],\"a\":0,\"ee\":\"1st January 2015.\",\"eh\":\"1 जनवरी 2015।\"},{\"n\":20,\"d\":\"\",\"se\":\"The full form of <strong>NITI</strong> in NITI Aayog is:\",\"sh\":\"नीति आयोग में <strong>NITI</strong> का पूर्ण रूप क्या है:\",\"oe\":[\"National Integration and Technology Agency\",\"National Institution for Transforming India\",\"New India Transformation Initiative\",\"National Institute for Technology India\"],\"oh\":[\"नेशनल इंटीग्रेशन एंड टेक्नोलॉजी एजेंसी\",\"नेशनल इंस्टीट्यूशन फॉर ट्रांसफॉर्मिंग इंडिया (National Institution for Transforming India)\",\"न्यू इंडिया ट्रांसफॉर्मेशन इनिशिएटिव\",\"नेशनल इंस्टीट्यूट फॉर टेक्नोलॉजी इंडिया\"],\"a\":1,\"ee\":\"National Institution for Transforming India.\",\"eh\":\"नेशनल इंस्टीट्यूशन फॉर ट्रांसफॉर्मिंग इंडिया।\"},{\"n\":21,\"d\":\"\",\"se\":\"The ex-officio <strong>Chairman of the NITI Aayog</strong> is the:\",\"sh\":\"नीति आयोग के पदेन (ex-officio) <strong>अध्यक्ष (Chairman)</strong> कौन होते हैं:\",\"oe\":[\"President of India\",\"Vice President\",\"Prime Minister of India\",\"Finance Minister\"],\"oh\":[\"भारत के राष्ट्रपति\",\"उपराष्ट्रपति\",\"भारत के प्रधानमंत्री\",\"वित्त मंत्री\"],\"a\":2,\"ee\":\"The Prime Minister of India.\",\"eh\":\"भारत के प्रधानमंत्री।\"},{\"n\":22,\"d\":\"\",\"se\":\"The headquarters of the <strong>World Bank</strong> is located in:\",\"sh\":\"<strong>विश्व बैंक (World Bank)</strong> का मुख्यालय कहाँ स्थित है:\",\"oe\":[\"London\",\"New York\",\"Geneva\",\"Washington D.C\"],\"oh\":[\"लंदन\",\"न्यूयॉर्क\",\"जिनेवा\",\"वाशिंगटन डी.सी. (Washington D.C.)\"],\"a\":3,\"ee\":\"Washington D.C., USA.\",\"eh\":\"वाशिंगटन डी.सी., अमेरिका।\"},{\"n\":23,\"d\":\"\",\"se\":\"The \":\"Allan Octavian Hume.\",\"eh\":\"एलन ऑक्टेवियन ह्यूम।\"},{\"n\":28,\"d\":\"\",\"se\":\"The tragic <strong>Jallianwala Bagh massacre</strong> took place in the year:\",\"sh\":\"दुखद <strong>जलियांवाला बाग हत्याकांड</strong> किस वर्ष हुआ था:\",\"oe\":[\"1918\",\"1919\",\"1920\",\"1921\"],\"oh\":[\"1918\",\"1919\",\"1920\",\"1921\"],\"a\":1,\"ee\":\"13th April 1919 in Amritsar.\",\"eh\":\"13 अप्रैल 1919 को अमृतसर में।\"},{\"n\":29,\"d\":\"\",\"se\":\"<strong>Mahatma Gandhi's first major Satyagraha</strong> movement in India was the:\",\"sh\":\"भारत में <strong>महात्मा गांधी का पहला प्रमुख सत्याग्रह</strong> आंदोलन कौन सा था:\",\"oe\":[\"Civil Disobedience Movement\",\"Non-Cooperation Movement\",\"Champaran Satyagraha\",\"Quit India Movement\"],\"oh\":[\"सविनय अवज्ञा आंदोलन\",\"असहयोग आंदोलन\",\"चंपारण सत्याग्रह\",\"भारत छोड़ो आंदोलन\"],\"a\":2,\"ee\":\"Champaran Satyagraha (1917) for indigo farmers.\",\"eh\":\"नील किसानों के लिए चंपारण सत्याग्रह (1917)।\"},{\"n\":30,\"d\":\"\",\"se\":\"The historic <strong>Quit India Movement</strong> was launched in:\",\"sh\":\"ऐतिहासिक <strong>भारत छोड़ो आंदोलन (Quit India Movement)</strong> कब शुरू किया गया था:\",\"oe\":[\"1943\",\"1941\",\"1940\",\"1942\"],\"oh\":[\"1943\",\"1941\",\"1940\",\"1942\"],\"a\":3,\"ee\":\"Launched on 8th August 1942.\",\"eh\":\"8 अगस्त 1942 को शुरू हुआ।\"},{\"n\":31,\"d\":\"\",\"se\":\"India's <strong>first Prime Minister</strong> was:\",\"sh\":\"भारत के <strong>प्रथम प्रधानमंत्री</strong> कौन थे:\",\"oe\":[\"Jawaharlal Nehru\",\"Mahatma Gandhi\",\"Sardar Vallabhbhai Patel\",\"Dr. B.R. Ambedkar\"],\"oh\":[\"जवाहरलाल नेहरू\",\"महात्मा गांधी\",\"सरदार वल्लभभाई पटेल\",\"डॉ. बी.आर. अंबेडकर\"],\"a\":0,\"ee\":\"Jawaharlal Nehru.\",\"eh\":\"जवाहरलाल नेहरू।\"},{\"n\":32,\"d\":\"\",\"se\":\"Who composed India's <strong>National Anthem</strong>?\",\"sh\":\"भारत के <strong>राष्ट्रगान (National Anthem)</strong> &quot;जन गण मन&quot; के रचयिता कौन हैं?\",\"oe\":[\"Mother Teresa\",\"Rabindranath Tagore\",\"Bankim Chandra Chatterjee\",\"Sarojini Naidu\"],\"oh\":[\"मदर टेरेसा\",\"रवींद्रनाथ टैगोर\",\"बंकिम चंद्र चटर्जी\",\"सरोजिनी नायडू\"],\"a\":1,\"ee\":\"Rabindranath Tagore.\",\"eh\":\"रवींद्रनाथ टैगोर।\"},{\"n\":33,\"d\":\"\",\"se\":\"The <strong>first Indian citizen to win the Booker Prize</strong> for Fiction was:\",\"sh\":\"फिक्शन के लिए <strong>बुकर पुरस्कार (Booker Prize)</strong> जीतने वाले पहले भारतीय नागरिक कौन थे:\",\"oe\":[\"V.S. Naipaul\",\"Salman Rushdie\",\"Arundhati Roy\",\"Kiran Desai\"],\"oh\":[\"वी.एस. नायपॉल\",\"सलमान रुश्दी\",\"अरुंधति रॉय\",\"किरण देसाई\"],\"a\":2,\"ee\":\"Arundhati Roy for &quot;The God of Small Things&quot; (1997).\",\"eh\":\"अरुंधति रॉय &quot;द गॉड ऑफ स्मॉल थिंग्स&quot; (1997) के लिए।\"},{\"n\":34,\"d\":\"\",\"se\":\"The <strong>first woman Chief Minister</strong> of an Indian state was:\",\"sh\":\"किसी भारतीय राज्य की <strong>पहली महिला मुख्यमंत्री</strong> कौन थीं:\",\"oe\":[\"Indira Gandhi\",\"Mayawati\",\"Jayalalithaa\",\"Sucheta Kripalani\"],\"oh\":[\"इंदिरा गांधी\",\"मायावती\",\"जयललिता\",\"सुचेता कृपलानी\"],\"a\":3,\"ee\":\"Sucheta Kripalani (Uttar Pradesh, 1963).\",\"eh\":\"सुचेता कृपलानी (उत्तर प्रदेश, 1963)।\"},{\"n\":35,\"d\":\"\",\"se\":\"The <strong>first Indian woman to climb Mount Everest</strong> was:\",\"sh\":\"माउंट एवरेस्ट पर चढ़ने वाली <strong>पहली भारतीय महिला</strong> कौन थीं:\",\"oe\":[\"Bachendri Pal\",\"Arunima Sinha\",\"Junko Tabei\",\"Santosh Yadav\"],\"oh\":[\"बछेंद्री पाल\",\"अरुणिमा सिन्हा\",\"जुन्को ताबेई\",\"संतोष यादव\"],\"a\":0,\"ee\":\"Bachendri Pal (1984).\",\"eh\":\"बछेंद्री पाल (1984)।\"},{\"n\":36,\"d\":\"\",\"se\":\"The <strong>Constitution of India</strong> was officially adopted by the Constituent Assembly on:\",\"sh\":\"संविधान सभा द्वारा आधिकारिक तौर पर <strong>भारत का संविधान</strong> कब अपनाया गया था:\",\"oe\":[\"26th January 1950\",\"26th November 1949\",\"26th January 1949\",\"15th August 1947\"],\"oh\":[\"26 जनवरी 1950\",\"26 नवंबर 1949\",\"26 जनवरी 1949\",\"15 अगस्त 1947\"],\"a\":1,\"ee\":\"Adopted on 26th November 1949 (came into effect on 26th Jan 1950).\",\"eh\":\"26 नवंबर 1949 को अपनाया गया (26 जनवरी 1950 को लागू हुआ)।\"},{\"n\":37,\"d\":\"\",\"se\":\"The <strong>Preamble of the Indian Constitution</strong> declares India to be a:\",\"sh\":\"भारतीय संविधान की <strong>प्रस्तावना (Preamble)</strong> भारत को क्या घोषित करती है:\",\"oe\":[\"Federal, Democratic, Republic\",\"Socialist, Secular, Democratic\",\"Sovereign, Socialist, Secular, Democratic Republic\",\"Sovereign, Democratic, Republic\"],\"oh\":[\"संघीय, लोकतांत्रिक, गणराज्य\",\"समाजवादी, धर्मनिरपेक्ष, लोकतांत्रिक\",\"संप्रभु, समाजवादी, धर्मनिरपेक्ष, लोकतांत्रिक गणराज्य (Sovereign, Socialist, Secular, Democratic Republic)\",\"संप्रभु, लोकतांत्रिक, गणराज्य\"],\"a\":2,\"ee\":\"Sovereign, Socialist, Secular, Democratic Republic.\",\"eh\":\"संपूर्ण प्रभुत्व-संपन्न, समाजवादी, पंथनिरपेक्ष, लोकतंत्रात्मक गणराज्य।\"},{\"n\":38,\"d\":\"\",\"se\":\"The total <strong>number of schedules</strong> currently in the Indian Constitution is:\",\"sh\":\"वर्तमान में भारतीय संविधान में <strong>अनुसूचियों (Schedules)</strong> की कुल संख्या है:\",\"oe\":[\"10\",\"11\",\"15\",\"12\"],\"oh\":[\"10\",\"11\",\"15\",\"12\"],\"a\":3,\"ee\":\"12 Schedules.\",\"eh\":\"12 अनुसूचियाँ।\"},{\"n\":39,\"d\":\"\",\"se\":\"According to the Constitution, the <strong>President of India</strong> is the:\",\"sh\":\"संविधान के अनुसार, <strong>भारत के राष्ट्रपति</strong> होते हैं:\",\"oe\":[\"Head of the State\",\"Head of the Government\",\"Both A and B\",\"Head of the Parliament\"],\"oh\":[\"राज्य के प्रमुख (Head of the State)\",\"सरकार के प्रमुख\",\"A और B दोनों\",\"संसद के प्रमुख\"],\"a\":0,\"ee\":\"The President is the constitutional head of the State.\",\"eh\":\"राष्ट्रपति राज्य का संवैधानिक प्रमुख होता है।\"},{\"n\":40,\"d\":\"\",\"se\":\"The <strong>Prime Minister of India</strong> functions as the:\",\"sh\":\"<strong>भारत के प्रधानमंत्री</strong> के रूप में कार्य करते हैं:\",\"oe\":[\"Head of the State\",\"Head of the Government\",\"Both A and B\",\"Head of the Judiciary\"],\"oh\":[\"राज्य के प्रमुख\",\"सरकार के प्रमुख (Head of the Government)\",\"A और B दोनों\",\"न्यायपालिका के प्रमुख\"],\"a\":1,\"ee\":\"Head of the Government.\",\"eh\":\"सरकार के प्रमुख।\"},{\"n\":41,\"d\":\"\",\"se\":\"The ex-officio <strong>Chairman of the Rajya Sabha</strong> is the:\",\"sh\":\"<strong>राज्यसभा</strong> के पदेन (ex-officio) अध्यक्ष (Chairman) कौन होते हैं:\",\"oe\":[\"Vice President of India\",\"Speaker of Lok Sabha\",\"Prime Minister\",\"President of India\"],\"oh\":[\"भारत के उपराष्ट्रपति\",\"लोकसभा अध्यक्ष\",\"प्रधानमंत्री\",\"भारत के राष्ट्रपति\"],\"a\":0,\"ee\":\"The Vice President.\",\"eh\":\"उपराष्ट्रपति।\"},{\"n\":42,\"d\":\"\",\"se\":\"The <strong>Speaker of the Lok Sabha</strong> is elected by the:\",\"sh\":\"<strong>लोकसभा के अध्यक्ष (Speaker)</strong> का चुनाव किसके द्वारा किया जाता है:\",\"oe\":[\"Prime Minister\",\"Members of the Lok Sabha\",\"Members of the Rajya Sabha\",\"President\"],\"oh\":[\"प्रधानमंत्री\",\"लोकसभा के सदस्य (Members of the Lok Sabha)\",\"राज्यसभा के सदस्य\",\"राष्ट्रपति\"],\"a\":1,\"ee\":\"Members of the Lok Sabha from among themselves.\",\"eh\":\"लोकसभा के सदस्य अपने में से ही अध्यक्ष चुनते हैं।\"},{\"n\":43,\"d\":\"\",\"se\":\"After the 104th Constitutional Amendment removed the Anglo-Indian nominated seats, the maximum sanctioned strength of the <strong>Lok Sabha</strong> is now:\",\"sh\":\"104वें संविधान संशोधन द्वारा एंग्लो-इंडियन मनोनीत सीटों को हटाने के बाद, अब <strong>लोकसभा</strong> की अधिकतम स्वीकृत संख्या क्या है:\",\"oe\":[\"545\",\"543\",\"550\",\"552\"],\"oh\":[\"545\",\"543\",\"550\",\"552\"],\"a\":2,\"ee\":\"The maximum limit is 550 (530 from States, 20 from UTs).\",\"eh\":\"अधिकतम सीमा 550 है (राज्यों से 530, केंद्र शासित प्रदेशों से 20)।\"},{\"n\":44,\"d\":\"\",\"se\":\"The <strong>first President of independent India</strong> was:\",\"sh\":\"स्वतंत्र भारत के <strong>प्रथम राष्ट्रपति</strong> कौन थे:\",\"oe\":[\"Jawaharlal Nehru\",\"Dr. B.R. h Africa\",\"England\",\"India\"],\"oh\":[\"ऑस्ट्रेलिया\",\"दक्षिण अफ्रीका\",\"इंग्लैंड\",\"भारत\"],\"a\":3,\"ee\":\"India won the final against South Africa.\",\"eh\":\"भारत ने दक्षिण अफ्रीका के खिलाफ फाइनल जीता।\"},{\"n\":65,\"d\":\"\",\"se\":\"The <strong>de-facto national sport of India</strong> (widely recognized in competitive exams, though not officially codified) is:\",\"sh\":\"भारत का <strong>अघोषित (de-facto) राष्ट्रीय खेल</strong> (प्रतियोगी परीक्षाओं में व्यापक रूप से मान्यता प्राप्त) कौन सा है:\",\"oe\":[\"Field Hockey\",\"Football\",\"Kabaddi\",\"Cricket\"],\"oh\":[\"फील्ड हॉकी\",\"फुटबॉल\",\"कबड्डी\",\"क्रिकेट\"],\"a\":0,\"ee\":\"Field Hockey.\",\"eh\":\"फील्ड हॉकी।\"},{\"n\":66,\"d\":\"\",\"se\":\"The <strong>first Indian to win an individual Olympic gold medal</strong> was:\",\"sh\":\"<strong>व्यक्तिगत ओलंपिक स्वर्ण पदक</strong> जीतने वाले पहले भारतीय कौन थे:\",\"oe\":[\"Rajyavardhan Singh Rathore\",\"Abhinav Bindra\",\"Neeraj Chopra\",\"Leander Paes\"],\"oh\":[\"राज्यवर्धन सिंह राठौर\",\"अभिनव बिंद्रा\",\"नीरज चोपड़ा\",\"लिएंडर पेस\"],\"a\":1,\"ee\":\"Abhinav Bindra (Shooting, 2008 Beijing).\",\"eh\":\"अभिनव बिंद्रा (निशानेबाजी, 2008 बीजिंग)।\"},{\"n\":67,\"d\":\"\",\"se\":\"The <strong>first Indian woman to win an Olympic medal</strong> was:\",\"sh\":\"<strong>ओलंपिक पदक जीतने वाली पहली भारतीय महिला</strong> कौन थी:\",\"oe\":[\"Mary Kom\",\"Saina Nehwal\",\"Karnam Malleswari\",\"P.V. Sindhu\"],\"oh\":[\"मैरी कॉम\",\"साइना नेहवाल\",\"कर्णम मल्लेश्वरी\",\"पी.वी. सिंधु\"],\"a\":2,\"ee\":\"Karnam Malleswari (Weightlifting, 2000 Sydney).\",\"eh\":\"कर्णम मल्लेश्वरी (भारोत्तोलन, 2000 सिडनी)।\"},{\"n\":68,\"d\":\"\",\"se\":\"The headquarters of the <strong>International Olympic Committee (IOC)</strong> is located in:\",\"sh\":\"<strong>अंतर्राष्ट्रीय ओलंपिक समिति (IOC)</strong> का मुख्यालय कहाँ स्थित है:\",\"oe\":[\"Paris, France\",\"Geneva, Switzerland\",\"New York, USA\",\"Lausanne, Switzerland\"],\"oh\":[\"पेरिस, फ्रांस\",\"जिनेवा, स्विट्जरलैंड\",\"न्यूयॉर्क, अमेरिका\",\"लुसाने, स्विट्जरलैंड (Lausanne)\"],\"a\":3,\"ee\":\"Lausanne.\",\"eh\":\"लुसाने।\"},{\"n\":69,\"d\":\"\",\"se\":\"The author of the Booker Prize-winning novel <strong>&quot;The God of Small Things&quot;</strong> is:\",\"sh\":\"बुकर पुरस्कार विजेता उपन्यास <strong>&quot;द गॉड ऑफ स्मॉल थिंग्स&quot;</strong> के लेखक कौन हैं:\",\"oe\":[\"Arundhati Roy\",\"Salman Rushdie\",\"Kiran Desai\",\"Vikram Seth\"],\"oh\":[\"अरुंधति रॉय\",\"सलमान रुश्दी\",\"किरण देसाई\",\"विक्रम सेठ\"],\"a\":0,\"ee\":\"Arundhati Roy.\",\"eh\":\"अरुंधति रॉय।\"},{\"n\":70,\"d\":\"\",\"se\":\"The author of the monumental Indian novel <strong>&quot;A Suitable Boy&quot;</strong> is:\",\"sh\":\"स्मारकीय भारतीय उपन्यास <strong>&quot;ए सूटेबल बॉय&quot; (A Suitable Boy)</strong> के लेखक कौन हैं:\",\"oe\":[\"Kiran Desai\",\"Vikram Seth\",\"Arundhati Roy\",\"Salman Rushdie\"],\"oh\":[\"किरण देसाई\",\"विक्रम सेठ\",\"अरुंधति रॉय\",\"सलमान रुश्दी\"],\"a\":1,\"ee\":\"Vikram Seth.\",\"eh\":\"विक्रम सेठ।\"},{\"n\":71,\"d\":\"\",\"se\":\"The author of the highly acclaimed novel <strong>&quot;Midnight's Children&quot;</strong> is:\",\"sh\":\"अत्यधिक प्रशंसित उपन्यास <strong>&quot;मिडनाइट्स चिल्ड्रन&quot; (Midnight's Children)</strong> के लेखक कौन हैं:\",\"oe\":[\"Arundhati Roy\",\"Kiran Desai\",\"Salman Rushdie\",\"Vikram Seth\"],\"oh\":[\"अरुंधति रॉय\",\"किरण देसाई\",\"सलमान रुश्दी\",\"विक्रम सेठ\"],\"a\":2,\"ee\":\"Salman Rushdie.\",\"eh\":\"सलमान रुश्दी।\"},{\"n\":72,\"d\":\"\",\"se\":\"The author of the Man Booker Prize-winning novel <strong>&quot;The White Tiger&quot;</strong> is:\",\"sh\":\"मैन बुकर पुरस्कार विजेता उपन्यास <strong>&quot;द व्हाइट टाइगर&quot; (The White Tiger)</strong> के लेखक कौन हैं:\",\"oe\":[\"Vikram Seth\",\"Salman Rushdie\",\"Arundhati Roy\",\"Aravind Adiga\"],\"oh\":[\"विक्रम सेठ\",\"सलमान रुश्दी\",\"अरुंधति रॉय\",\"अरविंद अडिगा\"],\"a\":3,\"ee\":\"Aravind Adiga.\",\"eh\":\"अरविंद अडिगा।\"},{\"n\":73,\"d\":\"\",\"se\":\"The <strong>author of the Indian National Anthem
