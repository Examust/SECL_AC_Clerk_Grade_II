a\":1,\"ee\":\"Ancient refers to the distant past. Its opposite is modern.\",\"eh\":\"Ancient refers to the distant past. Its opposite is modern.\"},{\"n\":76,\"d\":\"\",\"se\":\"Identify the grammatical error in the sentence: &ldquo;The teacher along with the students are going to the museum.&rdquo;\",\"sh\":\"Identify the grammatical error in the sentence: &ldquo;The teacher along with the students are going to the museum.&rdquo;\",\"oe\":[\"to the museum\",\"along with\",\"are\",\"The teacher\"],\"oh\":[\"to the museum\",\"along with\",\"are\",\"The teacher\"],\"a\":2,\"ee\":\"When &quot;along with&quot; connects two subjects, the verb agrees with the first subject (&quot;The teacher&quot; - singular). &quot;Are&quot; should be &quot;is&quot;.\",\"eh\":\"When &quot;along with&quot; connects two subjects, the verb agrees with the first subject (&quot;The teacher&quot; - singular). &quot;Are&quot; should be &quot;is&quot;.\"},{\"n\":77,\"d\":\"\",\"se\":\"Fill in the blank: &ldquo;He is very good ____ mathematics.&rdquo;\",\"sh\":\"Fill in the blank: &ldquo;He is very good ____ mathematics.&rdquo;\",\"oe\":[\"for\",\"on\",\"in\",\"at\"],\"oh\":[\"for\",\"on\",\"in\",\"at\"],\"a\":3,\"ee\":\"The correct preposition for expressing skill in a subject is &quot;good at&quot;.\",\"eh\":\"The correct preposition for expressing skill in a subject is &quot;good at&quot;.\"},{\"n\":78,\"d\":\"\",\"se\":\"One‑word substitution for &ldquo;A person who loves mankind&rdquo;:\",\"sh\":\"One‑word substitution for &ldquo;A person who loves mankind&rdquo;:\",\"oe\":[\"Philanthropist\",\"Patriot\",\"Misanthrope\",\"Altruist\"],\"oh\":[\"Philanthropist\",\"Patriot\",\"Misanthrope\",\"Altruist\"],\"a\":0,\"ee\":\"Philanthropist. (A misanthrope hates mankind).\",\"eh\":\"Philanthropist. (A misanthrope hates mankind).\"},{\"n\":79,\"d\":\"\",\"se\":\"What is the correct plural form of &ldquo;deer&rdquo;?\",\"sh\":\"What is the correct plural form of &ldquo;deer&rdquo;?\",\"oe\":[\"Deeres\",\"Deer\",\"Dear\",\"Deers\"],\"oh\":[\"Deeres\",\"Deer\",\"Dear\",\"Deers\"],\"a\":1,\"ee\":\"&quot;Deer&quot; remains the same in both singular and plural forms.\",\"eh\":\"&quot;Deer&quot; remains the same in both singular and plural forms.\"},{\"n\":80,\"d\":\"\",\"se\":\"Choose the correctly spelt word:\",\"sh\":\"Choose the correctly spelt word:\",\"oe\":[\"Ocasion\",\"Occassion\",\"Occasion\",\"Ocassion\"],\"oh\":[\"Ocasion\",\"Occassion\",\"Occasion\",\"Ocassion\"],\"a\":2,\"ee\":\"Occasion (two c's, one s).\",\"eh\":\"Occasion (two c's, one s).\"},{\"n\":81,\"d\":\"\",\"se\":\"Change the voice: &ldquo;They have completed the project.&rdquo;\",\"sh\":\"Change the voice: &ldquo;They have completed the project.&rdquo;\",\"oe\":[\"The project is completed by them\",\"They have been completing the project\",\"The project was completed by them\",\"The project has been completed by them\"],\"oh\":[\"The project is completed by them\",\"They have been completing the project\",\"The project was completed by them\",\"The project has been completed by them\"],\"a\":3,\"ee\":\"Present perfect active changes to present perfect passive (&quot;has been completed&quot;).\",\"eh\":\"Present perfect active changes to present perfect passive (&quot;has been completed&quot;).\"},{\"n\":82,\"d\":\"\",\"se\":\"Choose the correct article: &ldquo;She is ____ untidy girl.&rdquo;\",\"sh\":\"Choose the correct article: &ldquo;She is ____ untidy girl.&rdquo;\",\"oe\":[\"an\",\"the\",\"no article\",\"a\"],\"oh\":[\"an\",\"the\",\"no article\",\"a\"],\"a\":0,\"ee\":\"&quot;Untidy&quot; begins with a vowel sound (uh), requiring &quot;an&quot;.\",\"eh\":\"&quot;Untidy&quot; begins with a vowel sound (uh), requiring &quot;an&quot;.\"},{\"n\":83,\"d\":\"\",\"se\":\"The idiom &ldquo;To pull someone's leg&rdquo; means:\",\"sh\":\"The idiom &ldquo;To pull someone's leg&rdquo; means:\",\"oe\":[\"To hurt someone intentionally\",\"To tease or joke with someone\",\"To deceive a friend\",\"To help someone secretly\"],\"oh\":[\"To hurt someone intentionally\",\"To tease or joke with someone\",\"To deceive a friend\",\"To help someone secretly\"],\"a\":1,\"ee\":\"To joke or trick someone in a harmless way.\",\"eh\":\"To joke or trick someone in a harmless way.\"},{\"n\":84,\"d\":\"\",\"se\":\"Choose the correct verb form: &ldquo;I wish I ____ a millionaire.&rdquo;\",\"sh\":\"Choose the correct verb form: &ldquo;I wish I ____ a millionaire.&rdquo;\",\"oe\":[\"had been\",\"am\",\"were\",\"was\"],\"oh\":[\"had been\",\"am\",\"were\",\"was\"],\"a\":2,\"ee\":\"In subjunctive mood (expressing an impossible wish), &quot;were&quot; is used with all subjects.\",\"eh\":\"In subjunctive mood (expressing an impossible wish), &quot;were&quot; is used with all subjects.\"},{\"n\":85,\"d\":\"\",\"se\":\"Identify the part of speech of the word &quot;beautiful&quot; in the sentence: &ldquo;She is beautiful.&rdquo;\",\"sh\":\"Identify the part of speech of the word &quot;beautiful&quot; in the sentence: &ldquo;She is beautiful.&rdquo;\",\"oe\":[\"Noun\",\"Verb\",\"Adverb\",\"Adjective\"],\"oh\":[\"Noun\",\"Verb\",\"Adverb\",\"Adjective\"],\"a\":3,\"ee\":\"Adjective (it describes the pronoun &quot;She&quot;).\",\"eh\":\"Adjective (it describes the pronoun &quot;She&quot;).\"},{\"n\":86,\"d\":\"\",\"se\":\"The first commercial coal mine in India was established in 1774 at:\",\"sh\":\"भारत में पहली व्यावसायिक कोयला खदान 1774 में कहाँ स्थापित की गई थी:\",\"oe\":[\"Raniganj\",\"Singrauli\",\"Jharia\",\"Korba\"],\"oh\":[\"रानीगंज (Raniganj)\",\"सिंगरौली\",\"झरिया\",\"कोरबा\"],\"a\":0,\"ee\":\"Coal mining in India began in the Raniganj coalfield in West Bengal.\",\"eh\":\"भारत में कोयला खनन की शुरुआत पश्चिम बंगाल के रानीगंज कोयला क्षेत्र से हुई थी।\"},{\"n\":87,\"d\":\"\",\"se\":\"The longest tributary of the river Ganga is the:\",\"sh\":\"गंगा नदी की सबसे लंबी सहायक नदी कौन सी है:\",\"oe\":[\"Mahanadi\",\"Yamuna\",\"Brahmaputra\",\"Godavari\"],\"oh\":[\"महानदी\",\"यमुना\",\"ब्रह्मपु "sh\":\"साउथ ईस्टर्न कोलफील्ड्स लिमिटेड (SECL) मुख्य रूप से किन कोयला क्षेत्रों में काम करती है:\",\"oe\":[\"Talcher, Singrauli\",\"Korba, Chirimiri, Jharia\",\"Korba, Raigarh, Sohagpur\",\"Raniganj, Bokaro, Talcher\"],\"oh\":[\"तालचेर, सिंगरौली\",\"कोरबा, चिरमिरी, झरिया\",\"कोरबा, रायगढ़, सुहागपुर\",\"रानीगंज, बोकारो, तालचेर\"],\"a\":2,\"ee\":\"SECL operates primarily across Chhattisgarh (Korba, Raigarh) and Madhya Pradesh (Sohagpur, Johilla).\",\"eh\":\"SECL मुख्य रूप से छत्तीसगढ़ (कोरबा, रायगढ़) और मध्य प्रदेश (सुहागपुर, जोहिला) में काम करती है।\"},{\"n\":97,\"d\":\"\",\"se\":\"The nationalization of coal mines in India, leading to the formation of CIL, was enacted under the:\",\"sh\":\"भारत में कोयला खदानों का राष्ट्रीयकरण, जिसके कारण CIL का गठन हुआ, किस अधिनियम के तहत किया गया था:\",\"oe\":[\"Coal India Act, 1975\",\"Mines Act, 1952\",\"Companies Act, 1956\",\"Coal Mines (Nationalisation) Act, 1973\"],\"oh\":[\"कोल इंडिया अधिनियम, 1975\",\"खान अधिनियम, 1952\",\"कंपनी अधिनियम, 1956\",\"कोयला खान (राष्ट्रीयकरण) अधिनियम, 1973 (Coal Mines Nationalisation Act, 1973)\"],\"a\":3,\"ee\":\"The Coal Mines (Nationalisation) Act, 1973 was the defining legislation.\",\"eh\":\"कोयला खान (राष्ट्रीयकरण) अधिनियम, 1973 इसके लिए परिभाषित कानून था।\"},{\"n\":98,\"d\":\"\",\"se\":\"How many fully owned subsidiary companies does Coal India Limited (CIL) have?\",\"sh\":\"कोल इंडिया लिमिटेड (CIL) की कितनी पूर्ण स्वामित्व वाली सहायक कंपनियां हैं?\",\"oe\":[\"8\",\"10\",\"7\",\"9\"],\"oh\":[\"8\",\"10\",\"7\",\"9\"],\"a\":0,\"ee\":\"CIL has 8 subsidiaries (7 producing subsidiaries like SECL, MCL, WCL, etc., and 1 planning subsidiary, CMPDIL).\",\"eh\":\"CIL की 8 सहायक कंपनियां हैं (SECL, MCL, WCL आदि जैसी 7 उत्पादक सहायक कंपनियां, और 1 योजना सहायक कंपनी, CMPDIL)।\"},{\"n\":99,\"d\":\"\",\"se\":\"The core corporate vision of SECL revolves around:\",\"sh\":\"SECL का मुख्य कॉर्पोरेट विजन (Vision) क्या है:\",\"oe\":[\"Shifting entirely to renewable solar energy\",\"Ensuring national energy security with sustainable mining practices\",\"Completely privatizing coal blocks\",\"Becoming the largest exporter of coal globally\"],\"oh\":[\"पूरी तरह से नवीकरणीय सौर ऊर्जा की ओर शिफ्ट होना\",\"स्थायी (Sustainable) खनन प्रथाओं के साथ राष्ट्रीय ऊर्जा सुरक्षा सुनिश्चित करना\",\"कोयला ब्लॉकों का पूरी तरह से निजीकरण करना\",\"वैश्विक स्तर पर कोयले का सबसे बड़ा निर्यातक बनना\"],\"a\":1,\"ee\":\"CIL and SECL prioritize national energy security alongside sustainable and eco-friendly mining.\",\"eh\":\"CIL और SECL स्थायी और पर्यावरण के अनुकूल खनन के साथ राष्ट्रीय ऊर्जा सुरक्षा को प्राथमिकता देते हैं।\"},{\"n\":100,\"d\":\"\",\"se\":\"The corporate headquarters of South Eastern Coalfields Limited (SECL) is located in which state?\",\"sh\":\"साउथ ईस्टर्न कोलफील्ड्स लिमिटेड (SECL) का कॉर्पोरेट मुख्यालय किस राज्य में स्थित है?\",\"oe\":[\"Jharkhand\",\"West Bengal\",\"Chhattisgarh\",\"Madhya Pradesh\"],\"oh\":[\"झारखंड\",\"पश्चिम बंगाल\",\"छत्तीसगढ़\",\"मध्य प्रदेश\"],\"a\":2,\"ee\":\"The SECL headquarters is situated in Bilaspur, Chhattisgarh.\",\"eh\":\"SECL का मुख्यालय बिलासपुर, छत्तीसगढ़ में स्थित है।\"}]},{\"id\":\"ahp3\",\"num\":3,\"name\":\"High Probability Paper 3\",\"sub\":\"100 questions · 100 bilingual\",\"q\":[{\"n\":1,\"d\":\"\",\"se\":\"A and B are partners sharing profits in the ratio 3:2. They admit C for a 1/5th share, which he acquires equally from A and B. What is the new profit‑sharing ratio?\",\"sh\":\"A और B एक साझेदारी में 3:2 के अनुपात में लाभ बांटते हैं। वे C को 1/5 हिस्से के लिए प्रवेश देते हैं, जिसे वह A और B से समान रूप से प्राप्त करता है। नया लाभ-विभाजन अनुपात क्या होगा?\",\"oe\":[\"7:5:3\",\"3:2:1\",\"4:3:1\",\"5:3:2\"],\"oh\":[\"7:5:3\",\"3:2:1\",\"4:3:1\",\"5:3:2\"],\"a\":3,\"ee\":\"C gets 1/5 (or 2/10). He takes 1/10 from A and 1/10 from B. A&rsquo;s new share = (3/5 - 1/10) = 5/10. B&rsquo;s new share = (2/5 - 1/10) = 3/10. Ratio = 5:3:2.\",\"eh\":\"C को 1/5 (या 2/10) मिलता है। वह 1/10 A से और 1/10 B से लेता है। A का नया हिस्सा = (3/5 - 1/10) = 5/10। B का नया हिस्सा = (2/5 - 1/10) = 3/10। नया अनुपात = 5:3:2।\"},{\"n\":2,\"d\":\"\",\"se\":\"On the death of a partner, the firm's goodwill is valued and the deceased partner&rsquo;s share is credited to their capital account. This adjustment is borne by the continuing partners in their:\",\"sh\":\"किसी साझेदार की मृत्यु पर, फर्म की ख्याति (Goodwill) का मूल्यांकन किया जाता है और मृतक साझेदार के हिस्से को उसके पूंजी खाते में क्रेडिट किया जाता है। यह समायोजन शेष/चालू साझेदारों द्वारा किस अनुपात में वहन किया जाता है:\",\"oe\":[\"Gaining ratio\",\"New profit-sharing ratio\",\"Sacrificing ratio\",\"Old profit‑sharing ratio\"],\"oh\":[\"लाभ प्राप्ति अनुपात (Gaining ratio)\",\"नया लाभ-विभाजन अनुपात\",\"त्याग अनुपात (Sacrificing ratio)\",\"पुराना लाभ-विभाजन अनुपात\"],\"a\":0,\"ee\":\"The continuing partners compensate the deceased partner's share in their gaining ratio.\",\"eh\":\"बचे हुए साझेदार मृतक साझेदार के हिस्से की भरपाई अपने 'लाभ प्राप्ति अनुपात' में करते हैं।\"},{\"n\":3,\"d\":\"\",\"se\":\"A company forfeited 100 shares of ₹10 each (₹8 called‑up), on which ₹5 per share has been paid. The Share Forfeiture Account will be credited with:\",\"sh\":\"एक कंपनी ने ₹10 वाले (₹8 मांगे गए/called-up) 100 शेयरों को जब्त कर लिया, जिन पर ₹5 प्रति शेयर का भुगतान किया जा चुका है। शेयर जब्ती खाते (Share Forfeiture Account) को कितनी राशि से क्रेडिट किया जाएगा:\",\"oe\":[\"₹300\",\"₹500\",\"₹800\",\"₹1000\"],\"oh\":[\"₹300\",\"₹500\",\"₹800\",\"₹1000\"],\"a\":1,\"ee\":\"The Forfeiture Account is credited only with the amount actually received/paid so far (100 shares × ₹5 = ₹500).\",\"eh\":\"जब्ती खाते में केवल वही राशि क्रेडिट की जाती है जो शेयरधारक द्वारा वास्तव में अब तक चुकाई जा चुकी हो (100 शेयर × ₹5 = ₹500)।\"},{\"n\":4,\"d\":\"\",\"se\":\"The ratio that strictly measures the ability of a company to pay its short‑term obligations from its most liquid assets (excluding inventory) is the:\",\"sh\":\"वह अनुपात जो इन्वेंट्री (स्टॉक) को छोड़कर, अपनी सबसे अधिक तरल संपत्तियों से अल्पकालिक दायित्वों का भुगतान करने की कंपनी की क्षमता को कड़ाई से मापता है:\",\"oe\":[\"Current ratio\",\"Debt‑equity ratio\",\"Quick ratio\",\"Inventory turnover ratio\"],\"oh\":[\"चालू अनुपात (Current ratio)\",\"ऋण-इक्विटी अनुपात\",\"त्वरित अनुपात (Quick ratio)\",\"इन्वेंट्री टर्नओवर अनुपात\"],\"a\":2,\"ee\":\"Quick ratio (or Acid-test ratio).\",\"eh\":\"त्वरित (Quick) या एसिड-टेस्ट अनुपात।\"},{\"n\":5,\"d\":\"\",\"se\":\"While preparing a Cash Flow Statement, which of the following is <strong>not</strong> classified as a cash flow from operating activities?\",\"sh\":\"नकद प्रवाह विवरण (Cash Flow Statement) तैयार करते समय, निम्नलिखित में से किसे 'परिचालन गतिविधियों' (Operating activities) से नकदी प्रवाह के रूप में वर्गीकृत <strong>नहीं</strong> किया जाता है?\",\"oe\":[\"Cash paid to suppliers\",\"Cash receipts from customers\",\"Cash paid for employee salaries\",\"Cash paid for purchasing fixed assets\"],\"oh\":[\"आपूर्तिकर्ताओं को किया गया नकद भुगतान\",\"ग्राहकों से नकद प्राप्तियां\",\"कर्मचारी वेतन के लिए नकद भुगतान\",\"स्थायी संपत्तियां खरीदने के लिए किया गया नकद भुगतान\"],\"a\":3,\"ee\":\"Purchasing fixed assets is an investing activity.\",\"eh\":\"स्थायी संपत्तियां खरीदना एक 'निवेश गतिविधि' (Investing activity) है।\"},{\"n\":6,\"d\":\"\",\"se\":\"An amount set aside out of profits to meet a known liability, the exact amount of which cannot be determined with substantial accuracy, is called a:\",\"sh\":\"किसी ज्ञात दायित्व को पूरा करने के लिए लाभ में से अलग रखी गई राशि, जिसकी सटीक राशि पर्याप्त सटीकता के साथ निर्धारित नहीं की जा सकती, कहलाती है:\",\"oe\":[\"Provision\",\"Capital Fund\",\"Reserve\",\"Contingent Liability\"],\"oh\":[\"प्रावधान (Provision)\",\"पूंजी निधि\",\"संचय (Reserve)\",\"आकस्मिक दायित्व\"],\"a\":0,\"ee\":\"Provision is a charge against profit for a known, but unquantifiable, future liability.\",\"eh\":\"प्रावधान (Provision) ज्ञात लेकिन गैर-मात्रात्मक भविष्य के दायित्व के लिए लाभ के विरुद्ध एक प्रभार है।\"},{\"n\":7,\"d\":\"\",\"se\":\"At the time of admission of a new partner, a Revaluation Account is prepared primarily to:\",\"sh\":\"नए साझेदार के प्रवेश के समय, पुनर्मूल्यांकन खाता (Revaluation Account) मुख्य रूप से क्यों तैयार किया जाता है:\",\"oe\":[\"Distribute the firm's cash balance\",\"Record the profit/loss on revaluation of assets and liabilities\",\"Adjust partners' capital accounts\",\"Record the new partner's goodwill\"],\"oh\":[\"फर्म का नकद बांटने के लिए\",\"संपत्तियों और दायित्वों के पुनर्मूल्यांकन पर लाभ/हानि दर्ज करने के लिए\",\"पूंजी खातों को समायोजित करने के लिए\",\"नए साझेदार की ख्याति दर्ज करने के लिए\"],\"a\":1,\"ee\":\"It ensures old partners benefit/lose from asset value changes that occurred prior to the admission.\",\"eh\":\"यह सुनिश्चित करता है कि प्रवेश से पहले संपत्ति के मूल्य में हुए परिवर्तनों का लाभ/नुकसान पुराने साझेदारों को ही मिले।\"},{\"n\":8,\"d\":\"\",\"se\":\"The maximum number of members allowed in a Private Limited Company (excluding current and former employee-members) as per the Companies Act, 2013 is:\",\"sh\":\"कंपनी अधिनियम, 2013 के अनुसार एक प्राइवेट लिमिटेड कंपनी में (वर्तमान और पूर्व कर्मचारी-सदस्यों को छोड़कर) अनुमत सदस्यों की अधिकतम संख्या है:\",\"oe\":[\"500\",\"50\",\"200\",\"100\"],\"oh\":[\"500\",\"50\",\"200\",\"100\"],\"a\":2,\"ee\":\"200 members.\",\"eh\":\"200 सदस्य।\"},{\"n\":9,\"d\":\"\",\"se\":\"Which of the following is classified as a Current Liability?\",\"sh\":\"निम्नलिखित में से किसे 'चालू दायित्व' (Current Liability) के रूप में वर्गीकृत किया गया है?\",\"oe\":[\"Long-term Debentures\",\"Building\",\"Goodwill\",\"Bank Overdraft\"],\"oh\":[\"दीर्घकालिक डिबेंचर\",\"भवन (Building)\",\"ख्याति (Goodwill)\",\"बैंक ओवरड्राफ्ट (Bank Overdraft)\"],\"a\":3,\"ee\":\"A bank overdraft is a short-term, on-demand borrowing.\",\"eh\":\"बैंक ओवरड्राफ्ट एक अल्पकालिक, मांग पर देय उधार है।\"},{\"n\":10,\"d\":\"\",\"se\":\"The profit on the revaluation of assets at the time of retirement of a partner is transferred to the:\",\"sh\":\"साझेदार की सेवानिवृत्ति (Retirement) के समय संपत्तियों के पुनर्मूल्यांकन पर होने वाले लाभ को हस्तांतरित किया जाता है:\",\"oe\":[\"Capital accounts of all partners in the old ratio\",\"Retiring partner&rsquo;s capital account only\",\"Profit &amp; Loss Appropriation account\",\"Capital accounts of continuing partners in the new ratio\"],\"oh\":[\"पुराने अनुपात में सभी साझेदारों के पूंजी खातों में\",\"केवल सेवानिवृत्त होने वाले साझेदार के पूंजी खाते में\",\"लाभ और हानि विनियोग खाते में\",\"नए अनुपात में केवल शेष/चालू साझेदारों के पूंजी खातों में\"],\"a\":0,\"ee\":\"Revaluation profit belongs to all partners (including the retiring one) in their old ratio.\",\"eh\":\"पुनर्मूल्यांकन लाभ पुराने अनुपात में सभी साझेदारों (सेवानिवृत्त होने वाले सहित) का होता है।\"},{\"n\":11,\"d\":\"\",\"se\":\"Under Accounting Standard 3 (AS‑3), which of the following is <strong>not</strong> a primary classification for cash flows?\",\"sh\":\"लेखांकन मानक 3 (AS-3) के तहत, निम्नलिखित में से कौन सा नकदी प्रवाह के लिए प्राथमिक वर्गीकरण <strong>नहीं</strong> है?\",\"oe\":[\"Financing activities\",\"Extraordinary activities\",\"Investing activities\",\"Operating activities\"],\"oh\":[\"वित्तपोषण गतिविधियां (Financing)\",\"असाधारण गतिविधियां (Extraordinary)\",\"निवेश गतिविधियां (Investing)\",\"परिचालन गतिविधियां (Operating)\"],\"a\":1,\"ee\":\"AS-3 categorizes cash flows strictly into Operating, Investing, and Financing activities.\",\"eh\":\"AS-3 नकदी प्रवाह को केवल परिचालन, निवेश और वित्तपोषण में वर्गीकृत करता है।\"},{\"n\":12,\"d\":\"\",\"se\":\"A company has issued 10,000, 8% debentures of ₹100 each. The annual interest payable by the company is:\",\"sh\":\"एक कंपनी ने ₹100 वाले 10,000, 8% डिबेंचर जारी किए हैं। कंपनी द्वारा देय वार्षिक ब्याज है:\",\"oe\":[\"₹10,000\",\"₹1,00,000\",\"₹80,000\",\"₹8,00,000\"],\"oh\":[\"₹10,000\",\"₹1,00,000\",\"₹80,000\",\"₹8,00,000\"],\"a\":2,\"ee\":\"Total debenture value = ₹10,00,000. 8% of ₹10,00,000 = ₹80,000.\",\"eh\":\"कुल डिबेंचर मूल्य = ₹10,00,000। ₹10,00,000 का 8% = ₹80,000।\"},{\"n\":13,\"d\":\"\",\"se\":\"In final accounts, outstanding wages given outside the trial balance are adjusted by:\",\"sh\":\"अंतिम खातों में, यदि अदत्त मजदूरी (Outstanding wages) तलपट (Trial balance) के बाहर दी गई हो, तो इसे कैसे समायोजित किया जाता है:\",\"oe\":[\"Showing them only on the assets side\",\"Debiting them to the P&amp;L account as a new expense\",\"Showing them only on the liabilities side of the balance sheet\",\"Adding them to wages in the Trading A/c and showing them as a current liability in the Balance Sheet\"],\"oh\":[\"केवल संपत्ति पक्ष में दिखाकर\",\"P&amp;L खाते में नए खर्च के रूप में डेबिट करके\",\"केवल बैलेंस शीट के दायित्व पक्ष में दिखाकर\",\"व्यापार खाते (Trading A/c) में मजदूरी में जोड़कर और बैलेंस शीट में चालू दायित्व के रूप में दिखाकर\"],\"a\":3,\"ee\":\"Every adjustment outside the trial balance requires a dual effect.\",\"eh\":\"तलपट के बाहर दिए गए हर समायोजन के दोहरे प्रभाव होते हैं।\"},{\"n\":14,\"d\":\"\",\"se\":\"When forfeited shares are subsequently re‑issued at a discount, the amount of the discount allowed is debited to the:\",\"sh\":\"जब जब्त किए गए शेयरों को बाद में छूट (Discount) पर फिर से जारी (Re-issue) किया जाता है, तो दी गई छूट की राशि किस खाते में डेबिट की जाती है:\",\"oe\":[\"Share Forfeiture A/c\",\"Capital Reserve A/c\",\"Profit &amp; Loss A/c\",\"Share Capital A/c\"],\"oh\":[\"शेयर जब्ती खाता (Share Forfeiture A/c)\",\"पूंजीगत संचय खाता (Capital Reserve)\",\"लाभ एवं हानि खाता\",\"शेयर पूंजी खाता\"],\"a\":0,\"ee\":\"The discount on reissue is absorbed by the balance already sitting in the Share Forfeiture account.\",\"eh\":\"पुन: निर्गम पर दी गई छूट को शेयर जब्ती खाते में पहले से मौजूद शेष राशि से अवशोषित किया जाता है।\"},{\"n\":15,\"d\":\"\",\"se\":\"A Debt‑Equity ratio of 2:1 indicates that:\",\"sh\":\"2:1 का ऋण-इक्विटी (Debt-Equity) अनुपात दर्शाता है कि:\",\"oe\":[\"Debt and equity are equal\",\"The company has twice as much debt as equity\",\"The company relies purely on equity\",\"The company has twice as much equity as debt\"],\"oh\":[\"ऋण और इक्विटी बराबर हैं\",\"कंपनी के पास इक्विटी की तुलना में दोगुना ऋण है\",\"कंपनी पूरी तरह से इक्विटी पर निर्भर है\",\"कंपनी के पास ऋण की तुलना में दोगुनी इक्विटी है\"],\"a\":1,\"ee\":\"Long-term Debt is double the amount of Shareholders' Equity.\",\"eh\":\"दीर्घकालिक ऋण शेयरधारकों की इक्विटी (पूंजी) की राशि का दोगुना है।\"},{\"n\":16,\"d\":\"\",\"se\":\"A Partnership Deed is legally defined as:\",\"sh\":\"साझेदारी विलेख (Partnership Deed) को कानूनी रूप से परिभाषित किया गया है:\",\"oe\":[\"An audit report\",\"A mandatory government license\",\"A written agreement containing the terms of partnership\",\"A verbal promise between partners\"],\"oh\":[\"एक ऑडिट रिपोर्ट\",\"एक अनिवार्य सरकारी लाइसेंस\",\"साझेदारी की शर्तों वाला एक लिखित समझौता\",\"साझेदारों के बीच एक मौखिक वादा\"],\"a\":2,\"ee\":\"It is a formal, written agreement among partners.\",\"eh\":\"यह साझेदारों के बीच एक औपचारिक, लिखित समझौता है।\"},{\"n\":17,\"d\":\"\",\"se\":\"The premium payable on the redemption of debentures is typically written off against:\",\"sh\":\"डिबेंचर के शोधन (Redemption) पर देय प्रीमियम को आमतौर पर किसके विरुद्ध अपलिखित (written off) किया जाता है:\",\"oe\":[\"General Reserve A/c\",\"Profit &amp; Loss A/c\",\"Capital Reserve A/c\",\"Securities Premium Reserve A/c\"],\"oh\":[\"सामान्य संचय खाता\",\"लाभ और हानि खाता\",\"पूंजीगत संचय खाता\",\"प्रतिभूति प्रीमियम संचय खाता (Securities Premium)\"],\"a\":3,\"ee\":\"Securities Premium is legally permitted to be utilized for writing off premium on redemption of debentures.\",\"eh\":\"कानूनी तौर पर डिबेंचर शोधन प्रीमियम को बट्टे खाते में डालने के लिए प्रतिभूति प्रीमियम का उपयोग किया जा सकता है।\"},{\"n\":18,\"d\":\"\",\"se\":\"The Accounting Standard (AS) specifically dealing with the preparation of Cash Flow Statements is:\",\"sh\":\"नकद प्रवाह विवरण (Cash Flow Statement) तैयार करने से विशेष रूप से संबंधित लेखांकन मानक (AS) है:\",\"oe\":[\"AS‑3\",\"AS‑2\",\"AS‑4\",\"AS‑1\"],\"oh\":[\"AS-3\",\"AS-2\",\"AS-4\",\"AS-1\"],\"a\":0,\"ee\":\"AS‑3.\",\"eh\":\"AS-3।\"},{\"n\":19,\"d\":\"\",\"se\":\"If a partner takes over a specific liability of the firm at the time of their retirement, that liability amount is:\",\"sh\":\"यदि कोई साझेदार अपनी सेवानिवृत्ति (Retirement) के समय फर्म का कोई विशिष्ट दायित्व (Liability) ले लेता है, तो वह दायित्व राशि:\",\"oe\":[\"Debited to the retiring partner&rsquo;s capital account\",\"Credited to the retiring partner&rsquo;s capital account\",\"Ignored in capital accounts\",\"Debited to the continuing partners&rsquo; capital accounts\"],\"oh\":[\"सेवानिवृत्त होने वाले साझेदार के पूंजी खाते में डेबिट की जाती है\",\"सेवानिवृत्त होने वाले साझेदार के पूंजी खाते में क्रेडिट की जाती है\",\"पूंजी खातों में अनदेखी की जाती है\",\"चालू साझेदारों के पूंजी खातों में डेबिट की जाती है\"],\"a\":1,\"ee\":\"The firm now owes the partner for taking over the burden, so their capital account is credited (increased).\",\"eh\":\"चूंकि साझेदार ने फर्म का बोझ उठा लिया है, इसलिए फर्म अब उसकी ऋणी है, अतः उसका पूंजी खाता क्रेडिट (बढ़ाया) किया जाता है।\"},{\"n\":20,\"d\":\"\",\"se\":\"Which of the following is classified as a <strong>fixed (long-term) liability</strong>?\",\"sh\":\"निम्नलिखित में से किसे <strong>स्थायी (दीर्घकालिक) दायित्व</strong> के रूप में वर्गीकृत किया जाता है?\",\"oe\":[\"Bills Payable\",\"Sundry Creditors\",\"10% Debentures\",\"Outstanding Expenses\"],\"oh\":[\"देय बिल\",\"विविध लेनदार\",\"10% डिबेंचर (10% Debentures)\",\"अदत्त व्यय\"],\"a\":2,\"ee\":\"Debentures represent long-term borrowing.\",\"eh\":\"डिबेंचर दीर्घकालिक उधारी का प्रतिनिधित्व करते हैं।\"},{\"n\":21,\"d\":\"\",\"se\":\"After the re‑issue of all forfeited shares, the remaining credit balance in the ‘Share Forfeiture Account&rsquo; is transferred to the:\",\"sh\":\"जब्त किए गए सभी शेयरों को फिर से जारी करने के बाद, 'शेयर जब्ती खाते' (Share Forfeiture A/c) में शेष क्रेडिट बैलेंस को कहाँ स्थानांतरित किया जाता है:\",\"oe\":[\"Share Capital A/c\",\"General Reserve A/c\",\"Profit &amp; Loss A/c\",\"Capital Reserve A/c\"],\"oh\":[\"शेयर पूंजी खाता\",\"सामान्य संचय खाता\",\"लाभ और हानि खाता\",\"पूंजीगत संचय खाता (Capital Reserve)\"],\"a\":3,\"ee\":\"It represents a realized capital profit.\",\"eh\":\"यह एक वसूल किया गया पूंजीगत लाभ (Capital profit) है।\"},{\"n\":22,\"d\":\"\",\"se\":\"A firm's Current Ratio is 2.5:1. If its Current Liabilities are ₹40,000, its Current Assets amount to:\",\"sh\":\"एक फर्म का चालू अनुपात 2.5:1 है। यदि इसकी चालू देनदारियां ₹40,000 हैं, तो इसकी चालू संपत्तियां (Current Assets) कितनी होंगी:\",\"oe\":[\"₹1,00,000\",\"₹80,000\",\"₹50,000\",\"₹16,000\"],\"oh\":[\"₹1,00,000\",\"₹80,000\",\"₹50,000\",\"₹16,000\"],\"a\":0,\"ee\":\"Current Assets = 2.5 × ₹40,000 = ₹1,00,000.\",\"eh\":\"चालू संपत्ति = 2.5 × ₹40,000 = ₹1,00,000।\"},{\"n\":23,\"d\":\"\",\"se\":\"At the time of dissolution of a partnership firm, the first priority for payment out of realized assets goes to:\",\"sh\":\"साझेदारी फर्म के विघटन (Dissolution) के समय, वसूल की गई संपत्तियों में से भुगतान के लिए पहली प्राथमिकता किसे दी जाती है:\",\"oe\":[\"Partners&rsquo; loans\",\"Third-party/Outside liabilities\",\"Profit distribution\",\"Partners&rsquo; capital balances\"],\"oh\":[\"साझेदारों के ऋण\",\"तृतीय-पक्ष/बाहरी दायित्व (Outside liabilities)\",\"लाभ वितरण\",\"साझेदारों के पूंजी शेष\"],\"a\":1,\"ee\":\"Secured and unsecured outside creditors must be settled first.\",\"eh\":\"सुरक्षित और असुरक्षित बाहरी लेनदारों का निपटान सबसे पहले किया जाना चाहिए।\"},{\"n\":24,\"d\":\"\",\"se\":\"Which of the following is an example of a Capital Reserve?\",\"sh\":\"निम्नलिखित में से कौन सा पूंजीगत संचय (Capital Reserve) का उदाहरण है?\",\"oe\":[\"General Reserve\",\"Dividend Equalisation Reserve\",\"Profit on re‑issue of forfeited shares\",\"Workmen Compensation Fund\"],\"oh\":[\"सामान्य संचय\",\"लाभांश समानीकरण संचय\",\"जब्त किए गए शेयरों के पुनर्निर्गम पर लाभ\",\"कर्मचारी मुआवजा कोष\"],\"a\":2,\"ee\":\"It is a profit derived from capital transactions, not ordinary operations.\",\"eh\":\"यह पूंजीगत लेनदेन से प्राप्त लाभ है, न कि सामान्य परिचालन से।\"},{\"n\":25,\"d\":\"\",\"se\":\"The process of exchanging existing debentures for equity shares of the company is called:\",\"sh\":\"कंपनी के मौजूदा डिबेंचर को इक्विटी शेयरों में बदलने की प्रक्रिया क्या कहलाती है:\",\"oe\":[\"Forfeiture\",\"Redemption\",\"Surrender\",\"Conversion\"],\"oh\":[\"जब्ती (Forfeiture)\",\"शोधन (Redemption)\",\"समर्पण (Surrender)\",\"परिवर्तन (Conversion)\"],\"a\":3,\"ee\":\"Conversion of convertible debentures.\",\"eh\":\"परिवर्तनीय डिबेंचर का रूपांतरण।\"},{\"n\":26,\"d\":\"\",\"se\":\"The standard due date for filing the GST Annual Return (Form GSTR‑9) is:\",\"sh\":\"जीएसटी वार्षिक रिटर्न (फॉर्म GSTR-9) दाखिल करने की मानक नियत तिथि (Due Date) क्या है:\",\"oe\":[\"31st December of the following financial year\",\"30th June of the following financial year\",\"30th September of the following financial year\",\"31st March of the financial year\"],\"oh\":[\"अगले वित्तीय वर्ष का 31 दिसंबर\",\"अगले वित्तीय वर्ष का 30 जून\",\"अगले वित्तीय वर्ष का 30 सितंबर\",\"वित्तीय वर्ष का 31 मार्च\"],\"a\":0,\"ee\":\"31st December of the next FY.\",\"eh\":\"अगले वित्तीय वर्ष का 31 दिसंबर।\"},{\"n\":27,\"d\":\"\",\"se\":\"Under the latest Income Tax rules (Budget 2024-25), the tax rate on Long‑Term Capital Gains (LTCG) on the sale of listed equity shares (exceeding the ₹1.25 lakh exemption limit) is:\",\"sh\":\"नवीनतम आयकर नियमों (बजट 2024-25) के तहत, सूचीबद्ध इक्विटी शेयरों की बिक्री पर दीर्घकालिक पूंजीगत लाभ (LTCG) पर कर की दर (₹1.25 लाख की छूट सीमा से अधिक) क्या है:\",\"oe\":[\"10%\",\"12.5%\",\"20%\",\"15%\"],\"oh\":[\"10%\",\"12.5%\",\"20%\",\"15%\"],\"a\":1,\"ee\":\"The rate was revised from 10% to 12.5% in the 2024 Union Budget.\",\"eh\":\"2024 के केंद्रीय बजट में यह दर 10% से बढ़ाकर 12.5% कर दी गई।\"},{\"n\":28,\"d\":\"\",\"se\":\"GST is described as a &quot;destination‑based tax&quot;. This means that:\",\"sh\":\"जीएसटी को &quot;गंतव्य-आधारित कर&quot; (Destination-based tax) कहा जाता है। इसका अर्थ है कि:\",\"oe\":[\"Tax is levied strictly at the port of entry\",\"Tax is shared exclusively with local municipalities\",\"Tax revenue goes to the state where goods are consumed\",\"Tax revenue goes to the state where goods are manufactured\"],\"oh\":[\"कर सख्ती से प्रवेश बंदरगाह पर लगाया जाता है\",\"कर विशेष रूप से स्थानीय नगर पालिकाओं के साथ साझा किया जाता है\",\"कर राजस्व उस राज्य को जाता है जहाँ माल की खपत (consume) होती है\",\"कर राजस्व उस राज्य को जाता है जहाँ माल निर्मित होता है\"],\"a\":2,\"ee\":\"The final tax revenue accrues to the state where the consumer resides.\",\"eh\":\"अंतिम कर राजस्व उस राज्य को मिलता है जहाँ अंतिम उपभोक्ता रहता है।\"},{\"n\":29,\"d\":\"\",\"se\":\"The general threshold limit for a mandatory tax audit under Section 44AB of the Income Tax Act for a business (where cash transactions exceed 5% of total receipts/payments) is:\",\"sh\":\"किसी व्यवसाय के लिए आयकर अधिनियम की धारा 44AB के तहत अनिवार्य कर ऑडिट (Tax audit) की सामान्य सीमा क्या है (जहाँ नकद लेनदेन कुल प्राप्तियों/भुगतानों के 5% से अधिक हो)?\",\"oe\":[\"₹2 crore\",\"₹5 crore\",\"₹10 crore\",\"₹1 crore\"],\"oh\":[\"₹2 करोड़\",\"₹5 करोड़\",\"₹10 करोड़\",\"₹1 करोड़\"],\"a\":3,\"ee\":\"The base threshold is ₹1 crore (it extends to ₹10 crore only if 95% of transactions are digital).\",\"eh\":\"मूल सीमा ₹1 करोड़ है (यह ₹10 करोड़ तक तभी बढ़ती है जब 95% लेनदेन डिजिटल हों)।\"},{\"n\":30,\"d\":\"\",\"se\":\"Input Tax Credit (ITC) under GST can legally be claimed for:\",\"sh\":\"जीएसटी के तहत इनपुट टैक्स क्रेडिट (ITC) कानूनी रूप से किसके लिए क्लेम किया जा सकता है:\",\"oe\":[\"Goods and services used in the course or furtherance of business\",\"Goods used purely for personal consumption\",\"Blocked credits under Section 17(5)\",\"Exempted supplies\"],\"oh\":[\"व्यवसाय के दौरान या उसे आगे बढ़ाने के लिए उपयोग की जाने वाली वस्तुएं और सेवाएं\",\"विशुद्ध रूप से व्यक्तिगत उपभोग के लिए उपयोग किया जाने वाला माल\",\"धारा 17(5) के तहत अवरुद्ध (Blocked) क्रेडिट\",\"छूट प्राप्त आपूर्तियां (Exempted)\"],\"a\":0,\"ee\":\"ITC is strictly for business purposes.\",\"eh\":\"ITC का क्लेम सख्ती से केवल व्यावसायिक उपयोग के लिए है।\"},{\"n\":31,\"d\":\"\",\"se\":\"The period of limitation for issuing an order of assessment under GST (for normal cases, not involving fraud) is:\",\"sh\":\"जीएसटी के तहत (धोखाधड़ी शामिल न होने वाले सामान्य मामलों में) मूल्यांकन (Assessment) का आदेश जारी करने की समय सीमा क्या है:\",\"oe\":[\"5 years from the due date of annual return\",\"3 years from the due date of annual return\",\"2 years from the due date of annual return\",\"1 year from the due date of annual return\"],\"oh\":[\"वार्षिक रिटर्न की नियत तिथि से 5 वर्ष\",\"वार्षिक रिटर्न की नियत तिथि से 3 वर्ष\",\"वार्षिक रिटर्न की नियत तिथि से 2 वर्ष\",\"वार्षिक रिटर्न की नियत तिथि से 1 वर्ष\"],\"a\":1,\"ee\":\"3 years (Section 73 of CGST Act).\",\"eh\":\"3 वर्ष (CGST अधिनियम की धारा 73)।\"},{\"n\":32,\"d\":\"\",\"se\":\"The rate of TDS on the payment of rent for Plant and Machinery (Section 194-I) is:\",\"sh\":\"प्लांट और मशीनरी के किराए (धारा 194-I) के भुगतान पर टीडीएस (TDS) की दर क्या है:\",\"oe\":[\"5%\",\"10%\",\"2%\",\"1%\"],\"oh\":[\"5%\",\"10%\",\"2%\",\"1%\"],\"a\":2,\"ee\":\"2% (Rent for land and building attracts 10%).\",\"eh\":\"2% (भूमि और भवन के किराए पर 10% लगता है)।\"},{\"n\":33,\"d\":\"\",\"se\":\"The base corporate tax rate for existing domestic companies opting for the concessional tax regime (under Section 115BAA) is:\",\"sh\":\"रियायती कर व्यवस्था (धारा 115BAA के तहत) का विकल्प चुनने वाली मौजूदा घरेलू कंपनियों के लिए आधार कॉर्पोरेट कर दर (Base corporate tax rate) क्या है:\",\"oe\":[\"30%\",\"15%\",\"25%\",\"22%\"],\"oh\":[\"30%\",\"15%\",\"25%\",\"22%\"],\"a\":3,\"ee\":\"22% (plus applicable surcharge and cess).\",\"eh\":\"22% (प्लस लागू सरचार्ज और सेस)।\"},{\"n\":34,\"d\":\"\",\"se\":\"What is the average annual production over the five-year period?\",\"sh\":\"पांच साल की अवधि में औसत वार्षिक उत्पादन क्या है?\",\"oe\":[\"150 MT\",\"160 MT\",\"130 MT\",\"140 MT\"],\"oh\":[\"150 MT\",\"160 MT\",\"130 MT\",\"140 MT\"],\"a\":0,\"ee\":\"Total = 750 MT. Average = 750 / 5 = 150 MT.\",\"eh\":\"कुल = 750 MT। औसत = 750 / 5 = 150 MT।\"},{\"n\":35,\"d\":\"\",\"se\":\"The percentage increase in production from 2020 to 2024 is:\",\"sh\":\"2020 से 2024 तक उत्पादन में प्रतिशत वृद्धि कितनी है:\",\"oe\":[\"50%\",\"100%\",\"75%\",\"80%\"],\"oh\":[\"50%\",\"100%\",\"75%\",\"80%\"],\"a\":1,\"ee\":\"Increase = 200 - 100 = 100 MT. (100 / 100) × 100 = 100%.\",\"eh\":\"वृद्धि = 200 - 100 = 100 MT। (100 / 100) × 100 = 100%।\"},{\"n\":36,\"d\":\"\",\"se\":\"In which year was the trade deficit (Import minus Export) the highest?\",\"sh\":\"व्यापार घाटा (Trade deficit: आयात माइनस निर्यात) किस वर्ष सबसे अधिक था?\",\"oe\":[\"2020\",\"2022\",\"2024\",\"2023\"],\"oh\":[\"2020\",\"2022\",\"2024\",\"2023\"],\"a\":2,\"ee\":\"2024 deficit = 60 - 40 = 20 MT (the highest of all years).\",\"eh\":\"2024 का घाटा = 60 - 40 = 20 MT (सभी वर्षों में सबसे अधिक)।\"},{\"n\":37,\"d\":\"\",\"se\":\"The ratio of export to import in the year 2023 is:\",\"sh\":\"वर्ष 2023 में निर्यात (Export) और आयात (Import) का अनुपात क्या है:\",\"oe\":[\"1:1\",\"5:7\",\"3:5\",\"7:10\"],\"oh\":[\"1:1\",\"5:7\",\"3:5\",\"7:10\"],\"a\":3,\"ee\":\"35 : 50 reduces to 7 : 10.\",\"eh\":\"35 : 50 को सरल करने पर 7 : 10 प्राप्त होता है।\"},{\"n\":38,\"d\":\"\",\"se\":\"If production in 2025 is expected to increase by 10% over 2024 levels, the expected production will be:\",\"sh\":\"यदि 2025 में उत्पादन 2024 के स्तर से 10% बढ़ने की उम्मीद है, तो अपेक्षित उत्पादन क्या होगा:\",\"oe\":[\"220 MT\",\"230 MT\",\"240 MT\",\"210 MT\"],\"oh\":[\"220 MT\",\"230 MT\",\"240 MT\",\"210 MT\"],\"a\":0,\"ee\":\"200 × 1.10 = 220 MT.\",\"eh\":\"200 × 1.10 = 220 MT।\"},{\"n\":39,\"d\":\"\",\"se\":\"The sum of three consecutive even numbers is 54. What is the largest of these three numbers?\",\"sh\":\"तीन लगातार सम (even) संख्याओं का योग 54 है। इन तीनों में से सबसे बड़ी संख्या क्या है?\",\"oe\":[\"18\",\"20\",\"16\",\"22\"],\"oh\":[\"18\",\"20\",\"16\",\"22\"],\"a\":1,\"ee\":\"Let the numbers be x, x+2, x+4. 3x + 6 = 54 → 3x = 48 → x = 16. Largest = 16 + 4 = 20.\",\"eh\":\"मान लें संख्याएं x, x+2, x+4 हैं। 3x + 6 = 54 → 3x = 48 → x = 16। सबसे बड़ी = 16 + 4 = 20।\"},{\"n\":40,\"d\":\"\",\"se\":\"A can do a piece of work in 12 days, and B can do it in 15 days. They work together for 4 days, after which A leaves. How many days will B take to finish the remaining work alone?\",\"sh\":\"A एक काम को 12 दिनों में कर सकता है, और B उसे 15 दिनों में कर सकता है। वे 4 दिनों तक एक साथ काम करते हैं, जिसके बाद A काम छोड़ देता है। शेष काम को पूरा करने में B अकेले कितने दिन लेगा?\",\"oe\":[\"7 days\",\"5 days\",\"6 days\",\"4 days\"],\"oh\":[\"7 दिन\",\"5 दिन\",\"6 दिन\",\"4 दिन\"],\"a\":2,\"ee\":\"A+B 1-day work = 1/12 + 1/15 = 9/60. In 4 days = 36/60 = 3/5. Remaining work = 2/5. B&rsquo;s time = (2/5) / (1/15) = 6 days.\",\"eh\":\"A+B का 1 दिन का काम = 1/12 + 1/15 = 9/60। 4 दिनों में = 36/60 = 3/5 काम। शेष काम = 2/5। B का समय = (2/5) / (1/15) = 6 दिन।\"},{\"n\":41,\"d\":\"\",\"se\":\"A mixture of milk and water contains 60% milk. If 10 litres of water are added, the milk percentage drops to 50%. What was the initial total quantity of the mixture?\",\"sh\":\"दूध और पानी के मिश्रण में 60% दूध है। यदि 10 लीटर पानी मिलाया जाए, तो दूध का प्रतिशत गिरकर 50% हो जाता है। मिश्रण की प्रारंभिक कुल मात्रा क्या थी?\",\"oe\":[\"40 L\",\"60 L\",\"30 L\",\"50 L\"],\"oh\":[\"40 L\",\"60 L\",\"30 L\",\"50 L\"],\"a\":3,\"ee\":\"Let initial volume = V. Milk = 0.6V. After adding water, total volume = V+10. (0.6V) / (V+10) = 0.50 → 0.6V = 0.5V + 5 → 0.1V = 5 → V = 50 L.\",\"eh\":\"मान लें प्रारंभिक मात्रा = V। दूध = 0.6V। पानी मिलाने के बाद कुल मात्रा = V+10। (0.6V) / (V+10) = 0.50 → 0.6V = 0.5V + 5 → 0.1V = 5 → V = 50 L।\"},{\"n\":42,\"d\":\"\",\"se\":\"The population of a town increases by 10% in the first year and decreases by 10% in the second year. What is the net change over two years?\",\"sh\":\"एक शहर की जनसंख्या पहले वर्ष में 10% बढ़ती है और दूसरे वर्ष में 10% घट जाती है। दो वर्षों में शुद्ध परिवर्तन क्या है?\",\"oe\":[\"1% decrease\",\"No change\",\"1% increase\",\"0.5% increase\"],\"oh\":[\"1% कमी (Decrease)\",\"कोई परिवर्तन नहीं\",\"1% वृद्धि\",\"0.5% वृद्धि\"],\"a\":0,\"ee\":\"100 × 1.10 × 0.90 = 99. A net drop of 1%.\",\"eh\":\"100 × 1.10 × 0.90 = 99। शुद्ध 1% की गिरावट।\"},{\"n\":43,\"d\":\"\",\"se\":\"A man invests ₹8,000 for 2 years at 10% p.a. compounded half‑yearly. The final maturity amount is approximately:\",\"sh\":\"एक आदमी ₹8,000 का निवेश 2 वर्ष के लिए 10% प्रति वर्ष की दर से अर्ध-वार्षिक (half-yearly) रूप से संयोजित चक्रवृद्धि ब्याज पर करता है। परिपक्वता राशि (Maturity amount) लगभग कितनी होगी:\",\"oe\":[\"₹10,000\",\"₹9,724\",\"₹9,600\",\"₹9,800\"],\"oh\":[\"₹10,000\",\"₹9,724\",\"₹9,600\",\"₹9,800\"],\"a\":1,\"ee\":\"Rate per half-year = 5%. Periods = 4. Amount = 8000 × (1.05)⁴ = 8000 × 1.2155 = ₹9,724.\",\"eh\":\"छमाही दर = 5%। अवधि = 4। राशि = 8000 × (1.05)⁴ = 8000 × 1.2155 = ₹9,724।\"},{\"n\":44,\"d\":\"\",\"se\":\"In a class, the average marks of 30 students is 60. If one student who scored 89 marks leaves the class, the new average becomes:\",\"sh\":\"एक कक्षा में, 30 छात्रों के औसत अंक 60 हैं। यदि 89 अंक प्राप्त करने वाला एक छात्र कक्षा छोड़ देता है, तो नया औसत क्या होगा:\",\"oe\":[\"58\",\"60\",\"59\",\"61\"],\"oh\":[\"58\",\"60\",\"59\",\"61\"],\"a\":2,\"ee\":\"Total marks = 30 × 60 = 1800. New total = 1800 - 89 = 1711. New average = 1711 / 29 = 59.\",\"eh\":\"कुल अंक = 30 × 60 = 1800। नया कुल = 1800 - 89 = 1711। नया औसत = 1711 / 29 = 59।\"},{\"n\":45,\"d\":\"\",\"se\":\"If (x + 1/x) = 3, find the value of (x² + 1/x²).\",\"sh\":\"यदि (x + 1/x) = 3 है, तो (x² + 1/x²) का मान ज्ञात करें।\",\"oe\":[\"11\",\"5\",\"9\",\"7\"],\"oh\":[\"11\",\"5\",\"9\",\"7\"],\"a\":3,\"ee\":\"(x + 1/x)² = x² + 1/x² + 2. So, 3² = x² + 1/x² + 2 → 9 - 2 = 7.\",\"eh\":\"(x + 1/x)² = x² + 1/x² + 2। इसलिए, 3² = x² + 1/x² + 2 → 9 - 2 = 7।\"},{\"n\":46,\"d\":\"\",\"se\":\"A cistern has two pipes. Pipe A fills it in 8 hours, while Pipe B empties it in 12 hours. If both are opened simultaneously, the empty tank will be filled in:\",\"sh\":\"एक टंकी में दो पाइप हैं। पाइप A इसे 8 घंटे में भरता है, जबकि पाइप B इसे 12 घंटे में खाली करता है। यदि दोनों एक साथ खोल दिए जाएं, तो खाली टंकी कितने समय में भर जाएगी:\",\"oe\":[\"24 hours\",\"10 hours\",\"20 hours\",\"15 hours\"],\"oh\":[\"24 घंटे\",\"10 घंटे\",\"20 घंटे\",\"15 घंटे\"],\"a\":0,\"ee\":\"Net hourly fill rate = 1/8 - 1/12 = 3/24 - 2/24 = 1/24. It will take 24 hours.\",\"eh\":\"प्रति घंटे भरने की शुद्ध दर = 1/8 - 1/12 = 3/24 - 2/24 = 1/24। अतः 24 घंटे लगेंगे।\"},{\"n\":47,\"d\":\"\",\"se\":\"The mean proportional between 4 and 16 is:\",\"sh\":\"4 और 16 के बीच मध्यानुपाती (Mean proportional) क्या है:\",\"oe\":[\"10\",\"8\",\"12\",\"6\"],\"oh\":[\"10\",\"8\",\"12\",\"6\"],\"a\":1,\"ee\":\"Mean proportional = √(a × b) = √(4 × 16) = √64 = 8.\",\"eh\":\"मध्यानुपाती = √(a × b) = √(4 × 16) = √64 = 8।\"},{\"n\":48,\"d\":\"\",\"se\":\"A rectangle has a length of 12 cm and a breadth of 5 cm. The length of its diagonal is:\",\"sh\":\"एक आयत (rectangle) की लंबाई 12 सेमी और चौड़ाई 5 सेमी है। इसके विकर्ण (diagonal) की लंबाई है:\",\"oe\":[\"10 cm\",\"15 cm\",\"13 cm\",\"17 cm\"],\"oh\":[\"10 सेमी\",\"15 सेमी\",\"13 सेमी\",\"17 सेमी\"],\"a\":2,\"ee\":\"Diagonal = √(L² + B²) = √(144 + 25) = √169 = 13 cm.\",\"eh\":\"विकर्ण = √(L² + B²) = √(144 + 25) = √169 = 13 सेमी।\"},{\"n\":49,\"d\":\"\",\"se\":\"The cost of 5 pencils and 7 pens is ₹110, while the cost of 7 pencils and 5 pens is ₹106. What is the cost of one pencil?\",\"sh\":\"5 पेंसिल और 7 पेन की कीमत ₹110 है, जबकि 7 पेंसिल और 5 पेन की कीमत ₹106 है। एक पेंसिल की कीमत क्या है?\",\"oe\":[\"₹10\",\"₹6\",\"₹12\",\"₹8\"],\"oh\":[\"₹10\",\"₹6\",\"₹12\",\"₹8\"],\"a\":3,\"ee\":\"Add equations: 12p + 12q = 216 (p+q=18). Subtract equations: -2p + 2q = 4 (-p+q=2). Adding the new equations: 2q = 20 (q=10). Therefore, p = 8.\",\"eh\":\"दोनों समीकरणों को जोड़ने पर: 12p + 12q = 216 (p+q=18)। घटाने पर: -2p + 2q = 4 (-p+q=2)। नए समीकरणों को जोड़ने पर: 2q = 20 (q=10)। इसलिए, p = 8।\"},{\"n\":50,\"d\":\"\",\"se\":\"If 3/4 of a number is 36, find the number.\",\"sh\":\"यदि किसी संख्या का 3/4 भाग 36 है, तो वह संख्या ज्ञात करें।\",\"oe\":[\"48\",\"27\",\"45\",\"40\"],\"oh\":[\"48\",\"27\",\"45\",\"40\"],\"a\":0,\"ee\":\"Number = 36 × (4/3) = 48.\",\"eh\":\"संख्या = 36 × (4/3) = 48।\"},{\"n\":51,\"d\":\"\",\"se\":\"The cube root of 512 is:\",\"sh\":\"512 का घनमूल (Cube root) है:\",\"oe\":[\"16\",\"8\",\"12\",\"6\"],\"oh\":[\"16\",\"8\",\"12\",\"6\"],\"a\":1,\"ee\":\"8 × 8 × 8 = 512.\",\"eh\":\"8 × 8 × 8 = 512।\"},{\"n\":52,\"d\":\"\",\"se\":\"A seller marks an article at 20% above its cost price and then gives a 10% discount on the marked price. His actual profit percentage is:\",\"sh\":\"एक विक्रेता किसी वस्तु का अंकित मूल्य उसके क्रय मूल्य से 20% अधिक रखता है और फिर अंकित मूल्य पर 10% की छूट देता है। उसका वास्तविक लाभ प्रतिशत है:\",\"oe\":[\"12%\",\"10%\",\"8%\",\"5%\"],\"oh\":[\"12%\",\"10%\",\"8%\",\"5%\"],\"a\":2,\"ee\":\"Let CP = 100. Marked Price = 120. Selling Price = 120 × 0.90 = 108. Profit = 8%.\",\"eh\":\"मान लें CP = 100। अंकित मूल्य = 120। विक्रय मूल्य = 120 × 0.90 = 108। लाभ = 8%।\"},{\"n\":53,\"d\":\"\",\"se\":\"The simple interest accrued on ₹2,500 for 3 years at a rate of 6% p.a. is:\",\"sh\":\"₹2,500 पर 3 वर्ष के लिए 6% प्रति वर्ष की दर से साधारण ब्याज है:\",\"oe\":[\"₹600\",\"₹300\",\"₹540\",\"₹450\"],\"oh\":[\"₹600\",\"₹300\",\"₹540\",\"₹450\"],\"a\":3,\"ee\":\"SI = (2500 × 6 × 3) / 100 = ₹450.\",\"eh\":\"SI = (2500 × 6 × 3) / 100 = ₹450।\"},{\"n\":54,\"d\":\"\",\"se\":\"In a certain code, &quot;SUN&quot; is written as &quot;VXQ&quot;. Following the same rule, how will &quot;MOON&quot; be written?\",\"sh\":\"एक निश्चित कूट भाषा में, &quot;SUN&quot; को &quot;VXQ&quot; लिखा जाता है। उसी नियम का पालन करते हुए &quot;MOON&quot; को कैसे लिखा जाएगा?\",\"oe\":[\"PRRQ\",\"PRPS\",\"NQPO\",\"OQQM\"],\"oh\":[\"PRRQ\",\"PRPS\",\"NQPO\",\"OQQM\"],\"a\":0,\"ee\":\"Each letter is shifted forward by +3. (M+3=P, O+3=R, O+3=R, N+3=Q).\",\"eh\":\"प्रत्येक अक्षर +3 आगे बढ़ता है। (M+3=P, O+3=R, O+3=R, N+3=Q)।\"},{\"n\":55,\"d\":\"\",\"se\":\"Pointing to a lady, a man says, &ldquo;She is the daughter of the only brother of my father.&rdquo; How is the lady related to the man?\",\"sh\":\"एक महिला की ओर इशारा करते हुए एक आदमी कहता है, &quot;वह मेरे पिता के इकलौते भाई की बेटी है।&quot; महिला का आदमी से क्या संबंध है?\",\"oe\":[\"Aunt\",\"Cousin\",\"Niece\",\"Sister\"],\"oh\":[\"बुआ\",\"चचेरी बहन (Cousin)\",\"भतीजी\",\"बहन\"],\"a\":1,\"ee\":\"The only brother of the man's father is his paternal uncle. His uncle's daughter is his cousin.\",\"eh\":\"आदमी के पिता का इकलौता भाई उसका चाचा है। चाचा की बेटी उसकी चचेरी बहन (Cousin) है।\"},{\"n\":56,\"d\":\"\",\"se\":\"Find the odd one out in the following number series: 2, 5, 10, 17, 28, 41\",\"sh\":\"निम्नलिखित संख्या श्रृंखला में बेजोड़ (odd one out) ज्ञात कीजिए: 2, 5, 10, 17, 28, 41\",\"oe\":[\"10\",\"17\",\"28\",\"41\"],\"oh\":[\"10\",\"17\",\"28\",\"41\"],\"a\":2,\"ee\":\"The differences between consecutive terms are prime numbers (3, 5, 7, 11, 13). 17 + 11 = 28, and 28 + 13 = 41. (The sequence itself is correct; however, in a typical &quot;odd one out&quot; with these options, 28 is the only composite number difference jump if we look closely, but actually 28 fits the prime difference sequence. Wait, if the sequence is 2, 5, 10, 17, 26, 37... it's n²+1. In that case, 28 is the odd one out because it should be 26. Therefore, 28 is wrong). Correct Answer: (C).\",\"eh\":\"यदि पैटर्न n²+1 है (1²+1=2, 2²+1=5, 3²+1=10, 4²+1=17, 5²+1=26...), तो 28 की जगह 26 होना चाहिए था। अतः 28 गलत/बेजोड़ पद है।\"},{\"n\":57,\"d\":\"\",\"se\":\"In a certain code, &quot;TRAIN&quot; is written as &quot;URBJO&quot;. How is &quot;PLANE&quot; coded?\",\"sh\":\"एक निश्चित कूट में, &quot;TRAIN&quot; को &quot;URBJO&quot; लिखा जाता है। &quot;PLANE&quot; को कैसे कोडित किया जाएगा?\",\"oe\":[\"RNBPE\",\"QMBPE\",\"QKBMD\",\"QMBOF\"],\"oh\":[\"RNBPE\",\"QMBPE\",\"QKBMD\",\"QMBOF\"],\"a\":3,\"ee\":\"Each letter shifts by +1. P→Q, L→M, A→B, N→O, E→F.\",\"eh\":\"प्रत्येक अक्षर +1 से शिफ्ट होता है। P→Q, L→M, A→B, N→O, E→F।\"},{\"n\":58,\"d\":\"\",\"se\":\"Which number will complete the series? 1, 5, 14, 30, 55, ?\",\"sh\":\"कौन सी संख्या श्रृंखला को पूरा करेगी? 1, 5, 14, 30, 55, ?\",\"oe\":[\"91\",\"70\",\"80\",\"85\"],\"oh\":[\"91\",\"70\",\"80\",\"85\"],\"a\":0,\"ee\":\"The differences are perfect squares (4, 9, 16, 25). The next difference is 36. 55 + 36 = 91.\",\"eh\":\"पदों के बीच का अंतर पूर्ण वर्ग (4, 9, 16, 25) है। अगला अंतर 36 है। 55 + 36 = 91।\"},{\"n\":59,\"d\":\"\",\"se\":\"Read the statements and deduce the correct conclusion(s): <em>Statements:</em> All cats are animals. All animals are living beings. <em>Conclusions:</em> I. All cats are living beings. II. Some living beings are cats.\",\"sh\":\"कथनों को पढ़ें और सही निष्कर्ष निकालें: <em>कथन:</em> सभी बिल्लियाँ जानवर हैं। सभी जानवर जीवित प्राणी हैं। <em>निष्कर्ष:</em> I. सभी बिल्लियाँ जीवित प्राणी हैं। II. कुछ जीवित प्राणी बिल्लियाँ हैं।\",\"oe\":[\"Only I follows\",\"Only II follows\",\"Both I and II follow\",\"Neither follows\"],\"oh\":[\"केवल I अनुसरण करता है\",\"केवल II अनुसरण करता है\",\"I और II दोनों अनुसरण करते हैं\",\"न तो I और न ही II अनुसरण करता है\"],\"a\":2,\"ee\":\"Since cats are a subset of animals, and animals are a subset of living beings, both conclusions logically hold true.\",\"eh\":\"चूंकि बिल्लियां जानवरों का एक उपसमूह (subset) हैं, और जानवर जीवित प्राणियों का उपसमूह हैं, इसलिए दोनों निष्कर्ष तार्किक रूप से सत्य हैं।\"},{\"n\":60,\"d\":\"\",\"se\":\"A man starts from point A, walks 5 km East, turns North and walks 3 km, then turns West and walks 2 km. What is the shortest straight-line distance from his current position to the starting point A?\",\"sh\":\"एक आदमी बिंदु A से शुरू करता है, 5 किमी पूर्व की ओर चलता है, उत्तर की ओर मुड़ता है और 3 किमी चलता है, फिर पश्चिम की ओर मुड़ता है और 2 किमी चलता है। अपनी वर्तमान स्थिति से प्रारंभिक बिंदु A तक की सबसे छोटी सीधी दूरी क्या है?\",\"oe\":[\"4 km\",\"√18 km\",\"√20 km\",\"√13 km\"],\"oh\":[\"4 किमी\",\"√18 किमी\",\"√20 किमी\",\"√13 किमी\"],\"a\":1,\"ee\":\"Net horizontal displacement = 5 - 2 = 3 km East. Net vertical = 3 km North. Distance = √(3² + 3²) = √18 km.\",\"eh\":\"शुद्ध क्षैतिज विस्थापन = 5 - 2 = 3 किमी पूर्व। शुद्ध लंबवत = 3 किमी उत्तर। दूरी = √(3² + 3²) = √18 किमी।\"},{\"n\":61,\"d\":\"\",\"se\":\"Find the missing term: 3, 7, 13, 21, 31, ?\",\"sh\":\"लुप्त पद ज्ञात कीजिए: 3, 7, 13, 21, 31, ?\",\"oe\":[\"45\",\"41\",\"43\",\"47\"],\"oh\":[\"45\",\"41\",\"43\",\"47\"],\"a\":2,\"ee\":\"The differences are consecutive even numbers (4, 6, 8, 10). The next difference is 12. 31 + 12 = 43.\",\"eh\":\"अंतर लगातार सम संख्याएँ (4, 6, 8, 10) हैं। अगला अंतर 12 है। 31 + 12 = 43।\"},{\"n\":62,\"d\":\"\",\"se\":\"In a family, A is the father of B. C is the mother of D. D is the sister of B. How is A related to D?\",\"sh\":\"एक परिवार में, A, B का पिता है। C, D की माँ है। D, B की बहन है। A, D से किस प्रकार संबंधित है?\",\"oe\":[\"Uncle\",\"Grandfather\",\"Brother\",\"Father\"],\"oh\":[\"चाचा\",\"दादा\",\"भाई\",\"पिता\"],\"a\":3,\"ee\":\"Since B and D are siblings, the father of B (which is A) is also the father of D.\",\"eh\":\"चूँकि B और D भाई-बहन हैं, इसलिए B का पिता (जो A है) D का भी पिता है।\"},{\"n\":63,\"d\":\"\",\"se\":\"Find the next term in the series: 2, 5, 10, 17, 26, ?\",\"sh\":\"श्रृंखला में अगला पद ज्ञात कीजिए: 2, 5, 10, 17, 26, ?\",\"oe\":[\"37\",\"34\",\"35\",\"36\"],\"oh\":[\"37\",\"34\",\"35\",\"36\"],\"a\":0,\"ee\":\"The differences are consecutive odd numbers (3, 5, 7, 9). The next is 11. 26 + 11 = 37.\",\"eh\":\"अंतर लगातार विषम संख्याएँ (3, 5, 7, 9) हैं। अगला अंतर 11 है। 26 + 11 = 37।\"},{\"n\":64,\"d\":\"\",\"se\":\"Which of the following is considered a strong argument? <em>Statement:</em> Should mobile phones be entirely banned in classrooms? <em>Argument I:</em> Yes, they are a major distraction that severely hampers learning. <em>Argument II:</em> No, they are necessary for emergency communications.\",\"sh\":\"निम्नलिखित में से किसे एक &quot;मजबूत/ठोस&quot; (strong) तर्क माना जाता है? <em>कथन:</em> क्या कक्षाओं में मोबाइल फोन पर पूरी तरह से प्रतिबंध लगा दिया जाना चाहिए? <em>तर्क I:</em> हाँ, वे एक प्रमुख ध्यान भटकाने वाली चीज़ हैं जो सीखने में गंभीर बाधा डालती हैं। <em>तर्क II:</em> नहीं, वे आपातकालीन संचार के लिए आवश्यक हैं।\",\"oe\":[\"Only I is strong\",\"Only II is strong\",\"Both are strong\",\"Neither is strong\"],\"oh\":[\"केवल I मजबूत है\",\"केवल II मजबूत है\",\"दोनों मजबूत हैं\",\"कोई भी मजबूत नहीं है\"],\"a\":2,\"ee\":\"Both present logical, valid real-world points.\",\"eh\":\"दोनों तर्क तार्किक और वैध वास्तविक दुनिया के बिंदु प्रस्तुत करते हैं।\"},{\"n\":65,\"d\":\"\",\"se\":\"If the day before yesterday was Wednesday, what day of the week will it be the day after tomorrow?\",\"sh\":\"यदि परसों (बीता हुआ कल से एक दिन पहले) बुधवार था, तो आने वाले परसों (कल के बाद का दिन) सप्ताह का कौन सा दिन होगा?\",\"oe\":[\"Monday\",\"Sunday\",\"Saturday\",\"Friday\"],\"oh\":[\"सोमवार\",\"रविवार\",\"शनिवार\",\"शुक्रवार\"],\"a\":1,\"ee\":\"If the day before yesterday was Wed, today is Friday. Tomorrow is Saturday, and the day after tomorrow is Sunday.\",\"eh\":\"यदि परसों बुधवार था, तो आज शुक्रवार है। आने वाला कल शनिवार है, और परसों रविवार होगा।\"},{\"n\":66,\"d\":\"\",\"se\":\"In a certain code, &ldquo;HOTEL&rdquo; is coded as &ldquo;IPUEM&rdquo;. How is &ldquo;BANK&rdquo; coded?\",\"sh\":\"एक निश्चित कूट में, &ldquo;HOTEL&rdquo; को &ldquo;IPUEM&rdquo; के रूप में कोडित किया गया है। &ldquo;BANK&rdquo; को कैसे कोडित किया जाएगा?\",\"oe\":[\"CBNL\",\"CAOL\",\"CBOL\",\"CCOM\"],\"oh\":[\"CBNL\",\"CAOL\",\"CBOL\",\"CCOM\"],\"a\":2,\"ee\":\"Each letter shifts +1. B→C, A→B, N→O, K→L.\",\"eh\":\"प्रत्येक अक्षर +1 से शिफ्ट होता है। B→C, A→B, N→O, K→L।\"},{\"n\":67,\"d\":\"\",\"se\":\"A clock shows the time as 3:30. What is the angle between the hour and minute hands?\",\"sh\":\"एक घड़ी में समय 3:30 हो रहा है। घंटे और मिनट की सुइयों के बीच का कोण क्या है?\",\"oe\":[\"100°\",\"105°\",\"90°\",\"75°\"],\"oh\":[\"100°\",\"105°\",\"90°\",\"75°\"],\"a\":3,\"ee\":\"Hour hand = (3 × 30°) + 15° = 105°. Minute hand = 30 × 6° = 180°. Difference = 180 - 105 = 75°.\",\"eh\":\"घंटे की सुई = (3 × 30°) + 15° = 105°। मिनट की सुई = 30 × 6° = 180°। अंतर = 180 - 105 = 75°।\"},{\"n\":68,\"d\":\"\",\"se\":\"If A is the brother of B, B is the daughter of C, and C is the wife of D, then D is the ____ of A.\",\"sh\":\"यदि A, B का भाई है, B, C की बेटी है, और C, D की पत्नी है, तो D, A का ____ है।\",\"oe\":[\"Father\",\"Uncle\",\"Brother\",\"Grandfather\"],\"oh\":[\"पिता\",\"चाचा\",\"भाई\",\"दादा\"],\"a\":0,\"ee\":\"C and D are married parents of B. Since A is B's brother, D is A's father.\",\"eh\":\"C और D विवाहित हैं और B के माता-पिता हैं। चूंकि A, B का भाई है, अतः D, A का पिता है।\"},{\"n\":69,\"d\":\"\",\"se\":\"Choose the synonym of &ldquo;Magnificent&rdquo;:\",\"sh\":\"Choose the synonym of &ldquo;Magnificent&rdquo;:\",\"oe\":[\"Ordinary\",\"Grand\",\"Small\",\"Mediocre\"],\"oh\":[\"Ordinary\",\"Grand\",\"Small\",\"Mediocre\"],\"a\":1,\"ee\":\"Grand.\",\"eh\":\"Grand.\"},{\"n\":70,\"d\":\"\",\"se\":\"Choose the antonym of &ldquo;Frequently&rdquo;:\",\"sh\":\"Choose the antonym of &ldquo;Frequently&rdquo;:\",\"oe\":[\"Often\",\"Regularly\",\"Rarely\",\"Always\"],\"oh\":[\"Often\",\"Regularly\",\"Rarely\",\"Always\"],\"a\":2,\"ee\":\"Rarely.\",\"eh\":\"Rarely.\"},{\"n\":71,\"d\":\"\",\"se\":\"Identify the grammatical error in the sentence: &ldquo;Neither of the options are correct.&rdquo;\",\"sh\":\"Identify the grammatical error in the sentence: &ldquo;Neither of the options are correct.&rdquo;\",\"oe\":[\"of\",\"Neither\",\"correct\",\"are\"],\"oh\":[\"of\",\"Neither\",\"correct\",\"are\"],\"a\":3,\"ee\":\"&quot;Neither&quot; takes a singular verb. &quot;Are&quot; should be &quot;is&quot;.\",\"eh\":\"&quot;Neithe 9 में चालू किया गया था।\"},{\"n\":85,\"d\":\"\",\"se\":\"Which is the longest river flowing entirely within Madhya Pradesh?\",\"sh\":\"पूरी तरह से मध्य प्रदेश के भीतर बहने वाली सबसे लंबी नदी कौन सी है?\",\"oe\":[\"Mahanadi\",\"Narmada\",\"Tapti\",\"Godavari\"],\"oh\":[\"महानदी\",\"नर्मदा\",\"ताप्ती\",\"गोदावरी\"],\"a\":1,\"ee\":\"The Narmada is considered the lifeline of Madhya Pradesh.\",\"eh\":\"नर्मदा को मध्य प्रदेश की जीवन रेखा माना जाता है।\"},{\"n\":86,\"d\":\"\",\"se\":\"The upcoming 2025 BRICS Summit is scheduled to be hosted by:\",\"sh\":\"आगामी 2025 ब्रिक्स (BRICS) शिखर सम्मेलन की मेजबानी किस देश द्वारा निर्धारित है:\",\"oe\":[\"South Africa\",\"India\",\"Brazil\",\"Russia\"],\"oh\":[\"दक्षिण अफ्रीका\",\"भारत\",\"ब्राजील\",\"रूस\"],\"a\":2,\"ee\":\"Brazil (Russia hosted the 2024 summit in Kazan).\",\"eh\":\"ब्राजील (रूस ने 2024 शिखर सम्मेलन की मेजबानी की थी)।\"},{\"n\":87,\"d\":\"\",\"se\":\"Who was the first Governor of the state of Chhattisgarh when it was formed in 2000?\",\"sh\":\"2000 में गठित होने पर छत्तीसगढ़ राज्य के पहले राज्यपाल कौन थे?\",\"oe\":[\"Shekhar Dutt\",\"Krishna Mohan Seth\",\"Vinod Kumar Duggal\",\"D. N. Sahay\"],\"oh\":[\"शेखर दत्त\",\"कृष्ण मोहन सेठ\",\"विनोद कुमार दुग्गल\",\"डी. एन. सहाय\"],\"a\":3,\"ee\":\"Dinesh Nandan Sahay.\",\"eh\":\"दिनेश नंदन सहाय।\"},{\"n\":88,\"d\":\"\",\"se\":\"Who was the first Indian citizen to win the prestigious Booker Prize for Fiction?\",\"sh\":\"प्रतिष्ठित 'बुकर पुरस्कार' (Booker Prize) जीतने वाले पहले भारतीय नागरिक कौन थे?\",\"oe\":[\"Arundhati Roy\",\"Kiran Desai\",\"Jhumpa Lahiri\",\"Anita Desai\"],\"oh\":[\"अरुंधति रॉय\",\"किरण देसाई\",\"झुम्पा लाहिड़ी\",\"अनीता देसाई\"],\"a\":0,\"ee\":\"Arundhati Roy won in 1997 for <em>The God of Small Things</em>.\",\"eh\":\"अरुंधति रॉय ने 1997 में <em>द गॉड ऑफ स्मॉल थिंग्स</em> के लिए यह पुरस्कार जीता था।\"},{\"n\":89,\"d\":\"\",\"se\":\"The 2024 Nobel Memorial Prize in Economic Sciences was awarded to:\",\"sh\":\"2024 का आर्थिक विज्ञान में नोबेल मेमोरियल पुरस्कार किसे प्रदान किया गया:\",\"oe\":[\"Esther Duflo\",\"Daron Acemoglu, Simon Johnson, and James Robinson\",\"Ben Bernanke\",\"Claudia Goldin\"],\"oh\":[\"एस्तेर डुफ्लो\",\"डारोन एसेमोग्लू, साइमन जॉनसन, और जेम्स रॉबिन्सन\",\"बेन बर्नानके\",\"क्लाउडिया गोल्डिन\"],\"a\":1,\"ee\":\"Awarded for their studies on how institutions are formed and affect societal prosperity.\",\"eh\":\"यह पुरस्कार उन्हें इस अध्ययन के लिए दिया गया कि संस्थाएं कैसे बनती हैं और सामाजिक समृद्धि को कैसे प्रभावित करती हैं।\"},{\"n\":90,\"d\":\"\",\"se\":\"The highest mountain peak in Madhya Pradesh is:\",\"sh\":\"मध्य प्रदेश की सबसे ऊँची पर्वत चोटी कौन सी है:\",\"oe\":[\"Vindhya\",\"Maikal\",\"Dhupgarh\",\"Satpura\"],\"oh\":[\"विंध्य\",\"मैकल\",\"धूपगढ़\",\"सतपुड़ा\"],\"a\":2,\"ee\":\"Mount Dhupgarh in the Satpura Range.\",\"eh\":\"सतपुड़ा रेंज में स्थित धूपगढ़ चोटी।\"},{\"n\":91,\"d\":\"\",\"se\":\"The official currency of the United Kingdom is the:\",\"sh\":\"यूनाइटेड किंगडम (UK) की आधिकारिक मुद्रा क्या है:\",\"oe\":[\"Dollar\",\"Yen\",\"Euro\",\"Pound Sterling\"],\"oh\":[\"डॉलर\",\"येन\",\"यूरो\",\"पाउंड स्टर्लिंग (Pound Sterling)\"],\"a\":3,\"ee\":\"Pound Sterling.\",\"eh\":\"पाउंड स्टर्लिंग।\"},{\"n\":92,\"d\":\"\",\"se\":\"The first woman to serve as the Chief Minister of an Indian state was:\",\"sh\":\"किसी भारतीय राज्य की मुख्यमंत्री के रूप में कार्य करने वाली पहली महिला कौन थीं:\",\"oe\":[\"Sucheta Kripalani\",\"Indira Gandhi\",\"Mayawati\",\"Jayalalithaa\"],\"oh\":[\"सुचेता कृपलानी\",\"इंदिरा गांधी\",\"मायावती\",\"जयललिता\"],\"a\":0,\"ee\":\"Sucheta Kripalani served as the CM of Uttar Pradesh in 1963.\",\"eh\":\"सुचेता कृपलानी ने 1963 में उत्तर प्रदेश की मुख्यमंत्री के रूप में कार्य किया।\"},{\"n\":93,\"d\":\"\",\"se\":\"How many Schedules are there in the current Constitution of India?\",\"sh\":\"भारत के वर्तमान संविधान में कितनी अनुसूचियां (Schedules) हैं?\",\"oe\":[\"10\",\"12\",\"22\",\"15\"],\"oh\":[\"10\",\"12\",\"22\",\"15\"],\"a\":1,\"ee\":\"12 Schedules.\",\"eh\":\"12 अनुसूचियां।\"},{\"n\":94,\"d\":\"\",\"se\":\"SECL&rsquo;s official coal production target/achievement range for the fiscal year 2024‑25 is approximately:\",\"sh\":\"वित्तीय वर्ष 2024-25 के लिए SECL का आधिकारिक कोयला उत्पादन लक्ष्य/उपलब्धि सीमा लगभग कितनी है:\",\"oe\":[\"150 MT\",\"100 MT\",\"200 MT\",\"250 MT\"],\"oh\":[\"150 MT\",\"100 MT\",\"200 MT\",\"250 MT\"],\"a\":2,\"ee\":\"SECL operates with a mega-target of producing around 200 Million Tonnes (MT) annually.\",\"eh\":\"SECL सालाना लगभग 200 मिलियन टन (MT) उत्पादन के मेगा-लक्ष्य के साथ काम करती है।\"},{\"n\":95,\"d\":\"\",\"se\":\"Which of the following is recognized as one of the oldest operational coalfields of SECL?\",\"sh\":\"निम्नलिखित में से किसे SECL के सबसे पुराने परिचालन कोयला क्षेत्रों में से एक माना जाता है?\",\"oe\":[\"Sohagpur\",\"Korba\",\"Hasdeo\",\"Chirimiri\"],\"oh\":[\"सुहागपुर\",\"कोरबा\",\"हसदेव\",\"चिरमिरी\"],\"a\":3,\"ee\":\"Chirimiri coalfield.\",\"eh\":\"चिरमिरी कोयला क्षेत्र।\"},{\"n\":96,\"d\":\"\",\"se\":\"The total permanent employee strength (manpower) of Coal India Limited across all subsidiaries is approximately:\",\"sh\":\"सभी सहायक कंपनियों में कोल इंडिया लिमिटेड (CIL) के कुल स्थायी कर्मचारियों की संख्या (manpower) लगभग कितनी है:\",\"oe\":[\"2.3 to 2.5 lakh\",\"5 lakh\",\"1.5 lakh\",\"3.5 lakh\"],\"oh\":[\"2.3 से 2.5 लाख\",\"5 लाख\",\"1.5 लाख\",\"3.5 लाख\"],\"a\":0,\"ee\":\"CIL&rsquo;s massive workforce hovers around 2.3 to 2.5 lakh employees.\",\"eh\":\"CIL के कार्यबल की संख्या लगभग 2.3 से 2.5 लाख कर्मचारियों के आसपास है।\"},{\"n\":97,\"d\":\"\",\"se\":\"The National Coal Wage Agreement (NCWA) is formally negotiated and signed between the CIL management and:\",\"sh\":\"राष्ट्रीय कोयला वेतन समझौता (NCWA) पर CIL प्रबंधन और किसके बीच औपचारिक रूप से बातचीत और हस्ताक्षर किए जाते हैं:\",\"oe\":[\"Government of India\",\"Central Trade Unions representing workers\",\"The Reserve Bank of India\",\"Ministry of Coal directly\"],\"oh\":[\"भारत सरकार\",\"श्रमिकों का प्रतिनिधित्व करने वाले केंद्रीय ट्रेड यूनियन\",\"भारतीय रिजर्व बैंक (RBI)\",\"सीधे कोयला मंत्रालय\"],\"a\":1,\"ee\":\"It is a bilateral wage pact between management and recognized workers' unions.\",\"eh\":\"यह प्रबंधन और मान्यता प्राप्त श्रमिक संघों के बीच एक द्विपक्षीय वेतन समझौता है।\"},{\"n\":98,\"d\":\"\",\"se\":\"SECL has a major operational presence in which district of Madhya Pradesh?\",\"sh\":\"मध्य प्रदेश के किस जिले में SECL की प्रमुख परिचालन उपस्थिति है?\",\"oe\":[\"Ujjain\",\"Jabalpur\",\"Shahdol\",\"Gwalior\"],\"oh\":[\"उज्जैन\",\"जबलपुर\",\"शहडोल\",\"ग्वालियर\"],\"a\":2,\"ee\":\"The Sohagpur coalfield is predominantly located in Shahdol, MP.\",\"eh\":\"सुहागपुर कोयला क्षेत्र मुख्य रूप से मध्य प्रदेश के शहडोल में स्थित है।\"},{\"n\":99,\"d\":\"\",\"se\":\"CIL&rsquo;s ambitious ‘Mission Coal&rsquo; primarily focuses on:\",\"sh\":\"CIL के महत्वाकांक्षी 'मिशन कोल' (Mission Coal) का प्राथमिक फोकस किस पर है:\",\"oe\":[\"Shifting entirely to environmental conservation\",\"Complete digitalization of mines by 2025\",\"Becoming the world's sole exporter of coal\",\"Increasing total domestic production to 1 billion tonnes\"],\"oh\":[\"पूरी तरह से पर्यावरण संरक्षण की ओर शिफ्ट होना\",\"2025 तक खदानों का पूर्ण डिजिटलीकरण\",\"विश्व का एकमात्र कोयला निर्यातक बनना\",\"कुल घरेलू उत्पादन को बढ़ाकर 1 बिलियन टन करना\"],\"a\":3,\"ee\":\"Scaling national production to 1 Billion Tonnes by FY 2025-26.\",\"eh\":\"वित्तीय वर्ष 2025-26 तक राष्ट्रीय उत्पादन को 1 बिलियन टन तक ले जाना।\"},{\"n\":100,\"d\":\"\",\"se\":\"The code of ethics and conduct for CIL/SECL employees is governed by the:\",\"sh\":\"CIL/SECL कर्मचारियों के लिए आचार संहिता (code of ethics) किसके द्वारा शासित होती है:\",\"oe\":[\"Conduct, Discipline and Appeal (CDA) Rules\",\"Coal Mines Regulations\",\"Companies Act, 2013 exclusively\",\"Mines Act, 1952\"],\"oh\":[\"आचरण, अनुशासन और अपील (CDA) नियम\",\"कोयला खान विनियम\",\"विशेष रूप से कंपनी अधिनियम, 2013\",\"खान अधिनियम, 1952\"],\"a\":0,\"ee\":\"The CDA Rules dictate the ethical framework for PSU employees.\",\"eh\":\"CDA (Conduct, Discipline and Appeal) नियम PSU कर्मचारियों के लिए नैतिक ढांचे को निर्देशित करते हैं।\"}]},{\"id\":\"ahp4\",\"num\":4,\"name\":\"High Probability Paper 4\",\"sub\":\"100 questions · 100 bilingual\",\"q\":[{\"n\":1,\"d\":\"\",\"se\":\"Which of the following is <strong>not</strong> legally considered a financial statement as per the Companies Act, 2013?\",\"sh\":\"कंपनी अधिनियम, 2013 के अनुसार कानूनी रूप से निम्नलिखित में से किसे वित्तीय विवरण (Financial statement) <strong>नहीं</strong> माना जाता है?\",\"oe\":[\"Statement of Profit &amp; Loss\",\"Trial Balance\",\"Cash Flow Statement\",\"Balance Sheet\"],\"oh\":[\"लाभ और हानि विवरण (Statement of P&amp;L)\",\"तलपट (Trial Balance)\",\"नकद प्रवाह विवरण (Cash Flow Statement)\",\"बैलेंस शीट\"],\"a\":1,\"ee\":\"A Trial Balance is an internal worksheet used to check arithmetical accuracy, not a statutory financial statement.\",\"eh\":\"तलपट (Trial Balance) अंकगणितीय सटीकता की जांच के लिए उपयोग किया जाने वाला एक आंतरिक वर्किंग पेपर है, न कि वैधानिक वित्तीय विवरण।\"},{\"n\":2,\"d\":\"\",\"se\":\"The provision for income tax is shown in the balance sheet under the major head of:\",\"sh\":\"बैलेंस शीट में आयकर (Income tax) के लिए प्रावधान को किस प्रमुख शीर्षक के तहत दिखाया जाता है:\",\"oe\":[\"Current Assets\",\"Shareholders&rsquo; Funds\",\"Current Liabilities (Short-term Provisions)\",\"Fixed Assets\"],\"oh\":[\"चालू संपत्तियां\",\"शेयरधारक निधि\",\"चालू दायित्व (अल्पकालिक प्रावधान)\",\"स्थायी संपत्तियां\"],\"a\":2,\"ee\":\"It is a short-term liability representing tax payable for the current year.\",\"eh\":\"यह एक अल्पकालिक देनदारी (Current Liability) है जो चालू वर्ष के लिए देय कर का प्रतिनिधित्व करती है।\"},{\"n\":3,\"d\":\"\",\"se\":\"A company purchased machinery for ₹5,00,000 and spent ₹50,000 on its installation. If the depreciation rate is 10% p.a. under the Written Down Value (WDV) method, the depreciation amount for the first year is:\",\"sh\":\"एक कंपनी ने ₹5,00,000 में मशीनरी खरीदी और उसकी स्थापना (installation) पर ₹50,000 खर्च किए। यदि लिखित मूल्य विधि (WDV method) के तहत मूल्यह्रास दर 10% प्रति वर्ष है, तो पहले वर्ष के लिए मूल्यह्रास राशि क्या होगी:\",\"oe\":[\"₹50,000\",\"₹60,000\",\"₹45,000\",\"₹55,000\"],\"oh\":[\"₹50,000\",\"₹60,000\",\"₹45,000\",\"₹55,000\"],\"a\":3,\"ee\":\"Total capitalized cost = 5,00,000 + 50,000 = ₹5,50,000. Depreciation = 10% of ₹5,50,000 = ₹55,000.\",\"eh\":\"कुल पूंजीकृत लागत = 5,00,000 + 50,000 = ₹5,50,000। मूल्यह्रास = ₹5,50,000 का 10% = ₹55,000।\"},{\"n\":4,\"d\":\"\",\"se\":\"The maximum amount of dividend that can be declared and paid by a company is calculated based on its:\",\"sh\":\"किसी कंपनी द्वारा घोषित और भुगतान किए जा सकने वाले लाभांश (Dividend) की अधिकतम राशि की गणना किसके आधार पर की जाती है:\",\"oe\":[\"Paid‑up Capital\",\"Issued Capital\",\"Called‑up Capital\",\"Authorised Capital\"],\"oh\":[\"चुकता पूंजी (Paid-up Capital)\",\"जारी पूंजी\",\"मांगी गई पूंजी\",\"अधिकृत पूंजी\"],\"a\":0,\"ee\":\"Dividends are distributed exclusively on the paid‑up value of shares.\",\"eh\":\"लाभांश विशेष रूप से शेयरों के चुकता मूल्य (Paid-up value) पर वितरित किया जाता है।\"},{\"n\":5,\"d\":\"\",\"se\":\"When goods are sent on consignment, the consignor records the transaction by debiting the:\",\"sh\":\"जब माल को कंसाइनमेंट (Consignment) पर भेजा जाता है, तो प्रेषक (consignor) इस लेनदेन को किसे डेबिट करके दर्ज करता है:\",\"oe\":[\"Journal Proper\",\"Consignment Account\",\"Sales Book\",\"Purchase Book\"],\"oh\":[\"जर्नल प्रॉपर\",\"कंसाइनमेंट खाता (Consignment Account)\",\"बिक्री बही\",\"क्रय बही\"],\"a\":1,\"ee\":\"A separate nominal account called the &quot;Consignment Account&quot; is maintained for this purpose.\",\"eh\":\"इस उद्देश्य के लिए 'कंसाइनमेंट खाता' नामक एक अलग नाममात्र खाता (nominal account) बनाए रखा जाता है।\"},{\"n\":6,\"d\":\"\",\"se\":\"In the absence of a written partnership deed, the interest charged on partners' drawings is:\",\"sh\":\"किसी लिखित साझेदारी विलेख (Partnership deed) के अभाव में, साझेदारों के आहरण (drawings) पर कितना ब्याज लिया जाता है:\",\"oe\":[\"Decided by the managing partner\",\"Charged at 6% p.a\",\"Not charged at all\",\"Charged at 12% p.a\"],\"oh\":[\"प्रबंध साझेदार द्वारा तय किया जाता है\",\"6% प्रति वर्ष\",\"बिल्कुल नहीं लिया जाता (Not charged at all)\",\"12% प्रति वर्ष\"],\"a\":2,\"ee\":\"Under the Indian Partnership Act, 1932, no interest is charged on drawings without an agreement.\",\"eh\":\"भारतीय साझेदारी अधिनियम, 1932 के तहत, समझौते के बिना आहरण पर कोई ब्याज नहीं लिया जाता है।\"},{\"n\":7,\"d\":\"\",\"se\":\"The balance remaining in the Share Forfeiture Account, after the re‑issue of all those forfeited shares, is transferred to the:\",\"sh\":\"उन सभी जब्त किए गए शेयरों को फिर से जारी (re-issue) करने के बाद, शेयर जब्ती खाते (Share Forfeiture A/c) में शेष राशि को कहाँ स्थानांतरित किया जाता है:\",\"oe\":[\"Profit &amp; Loss Account\",\"General Reserve\",\"Securities Premium\",\"Capital Reserve\"],\"oh\":[\"लाभ और हानि खाता\",\"सामान्य संचय\",\"प्रतिभूति प्रीमियम\",\"पूंजीगत संचय (Capital Reserve)\"],\"a\":3,\"ee\":\"It is a realized capital profit, hence transferred to the Capital Reserve.\",\"eh\":\"यह एक वसूल किया गया पूंजीगत लाभ है, इसलिए इसे पूंजीगत संचय में स्थानांतरित किया जाता है।\"},{\"n\":8,\"d\":\"\",\"se\":\"Which of the following is classified as a <strong>direct expense</strong> in final accounts?\",\"sh\":\"अंतिम खातों में निम्नलिखित में से किसे <strong>प्रत्यक्ष व्यय (Direct expense)</strong> के रूप में वर्गीकृत किया जाता है?\",\"oe\":[\"Carriage Inward\",\"Carriage Outward\",\"Office Salary\",\"Office Rent\"],\"oh\":[\"कैरिज इनवर्ड (Carriage Inward - आवक गाड़ी भाड़ा)\",\"कैरिज आउटवर्ड (Carriage Outward)\",\"कार्यालय वेतन\",\"कार्यालय का किराया\"],\"a\":0,\"ee\":\"Carriage inward is incurred on purchasing raw materials/goods, thus it is debited to the Trading Account.\",\"eh\":\"कच्चे माल/सामान की खरीद पर आवक गाड़ी भाड़ा लगता है, इसलिए इसे ट्रेडिंग खाते में डेबिट किया जाता है।\"},{\"n\":9,\"d\":\"\",\"se\":\"The fundamental formula for calculating Gross Profit is:\",\"sh\":\"सकल लाभ (Gross Profit) की गणना करने का मूल सूत्र क्या है:\",\"oe\":[\"Net Sales – Operating Expenses\",\"Net Sales – Cost of Goods Sold (COGS)\",\"Net Profit + Non‑operating Income\",\"Net Sales – Purchases\"],\"oh\":[\"शुद्ध बिक्री - परिचालन व्यय\",\"शुद्ध बिक्री - बेचे गए माल की लागत (COGS)\",\"शुद्ध लाभ + गैर-परिचालन आय\",\"शुद्ध बिक्री - क्रय\"],\"a\":1,\"ee\":\"Gross Profit = Net Sales - COGS.\",\"eh\":\"सकल लाभ = शुद्ध बिक्री - COGS।\"},{\"n\":10,\"d\":\"\",\"se\":\"In the context of a company's share capital, ‘Reserve Capital&rsquo; refers to:\",\"sh\":\"कंपनी की शेयर पूंजी के संदर्भ में, ‘संचित पूंजी&rsquo; (Reserve Capital) का तात्पर्य है:\",\"oe\":[\"Securities Premium reserves\",\"Capital reserves created out of profits\",\"Uncalled capital that can only be called up during the winding up of the company\",\"Capital not yet called up from shareholders\"],\"oh\":[\"प्रतिभूति प्रीमियम संचय\",\"मुनाफे से बनाया गया पूंजीगत संचय\",\"न मांगी गई पूंजी जिसे केवल कंपनी के बंद होने (winding up) के समय ही मांगा जा सकता है\",\"शेयरधारकों से अभी तक नहीं मांगी गई पूंजी\"],\"a\":2,\"ee\":\"It acts as a security blanket for creditors in the event of liquidation.\",\"eh\":\"यह परिसमापन (liquidation) की स्थिति में लेनदारों के लिए एक सुरक्षा कवच के रूप में कार्य करता है।\"},{\"n\":11,\"d\":\"\",\"se\":\"A bill of exchange is drawn on 1st January for a period of 3 months. The legal due date for payment is:\",\"sh\":\"एक विनिमय विपत्र (Bill of exchange) 1 जनवरी को 3 महीने की अवधि के लिए लिखा जाता है। भुगतान की कानूनी देय तिथि (Legal due date) क्या है:\",\"oe\":[\"31st March\",\"5th April\",\"1st April\",\"4th April\"],\"oh\":[\"31 मार्च\",\"5 अप्रैल\",\"1 अप्रैल\",\"4 अप्रैल\"],\"a\":3,\"ee\":\"1st January + 3 months = 1st April. Adding 3 days of grace makes it 4th April.\",\"eh\":\"1 जनवरी + 3 महीने = 1 अप्रैल। इसमें 3 अनुग्रह के दिन (days of grace) जोड़ने पर यह 4 अप्रैल हो जाता है।\"},{\"n\":12,\"d\":\"\",\"se\":\"The Indian Accounting Standard (AS) that deals specifically with the Valuation of Inventories is:\",\"sh\":\"इन्वेंट्री के मूल्यांकन (Valuation of Inventories) से विशेष रूप से संबंधित भारतीय लेखांकन मानक (AS) है:\",\"oe\":[\"AS‑2\",\"AS‑3\",\"AS‑1\",\"AS‑4\"],\"oh\":[\"AS-2\",\"AS-3\",\"AS-1\",\"AS-4\"],\"a\":0,\"ee\":\"AS-2 mandates inventory to be valued at lower of cost or net realizable value.\",\"eh\":\"AS-2 यह अनिवार्य करता है कि इन्वेंट्री का मूल्यांकन लागत या शुद्ध वसूली योग्य मूल्य में से जो भी कम हो, उस पर किया जाए।\"},{\"n\":13,\"d\":\"\",\"se\":\"In financial analysis, the term ‘Capital Employed&rsquo; typically means:\",\"sh\":\"वित्तीय विश्लेषण में, 'नियोजित पूंजी' (Capital Employed) शब्द का अर्थ आमतौर पर होता है:\",\"oe\":[\"Total Liabilities\",\"Total Assets – Current Liabilities\",\"Fixed Assets + Current Assets\",\"Share Capital + Reserves &amp; Surplus only\"],\"oh\":[\"कुल दायित्व\",\"कुल संपत्तियां - चालू दायित्व (Total Assets – Current Liabilities)\",\"स्थायी संपत्तियां + चालू संपत्तियां\",\"केवल शेयर पूंजी + संचय और अधिशेष\"],\"a\":1,\"ee\":\"It represents the total long-term funds invested in the business.\",\"eh\":\"यह व्यवसाय में निवेश किए गए कुल दीर्घकालिक फंड का प्रतिनिधित्व करता है।\"},{\"n\":14,\"d\":\"\",\"se\":\"Under the Companies Act, 2013, the minimum number of directors required for a Public Limited Company is:\",\"sh\":\"कंपनी अधिनियम, 2013 के तहत, एक पब्लिक लिमिटेड कंपनी के लिए आवश्यक निदेशकों (Directors) की न्यूनतम संख्या क्या है:\",\"oe\":[\"5\",\"2\",\"3\",\"1\"],\"oh\":[\"5\",\"2\",\"3\",\"1\"],\"a\":2,\"ee\":\"A public company needs a minimum of 3 directors (a private company needs 2).\",\"eh\":\"सार्वजनिक (Public) कंपनी को न्यूनतम 3 निदेशकों की आवश्यकता होती है (निजी कंपनी को 2 की आवश्यकता होती है)।\"},{\"n\":15,\"d\":\"\",\"se\":\"The systematic process of writing off the cost of intangible assets (like patents or copyrights) over their useful life is known as:\",\"sh\":\"अमूर्त संपत्तियों (Intangible assets - जैसे पेटेंट या कॉपीराइट) की लागत को उनके उपयोगी जीवन में बट्टे खाते में डालने (writing off) की व्यवस्थित प्रक्रिया को क्या कहा जाता है:\",\"oe\":[\"Appreciation\",\"Depletion\",\"Depreciation\",\"Amortisation\"],\"oh\":[\"मूल्यवृद्धि (Appreciation)\",\"रिक्तिकरण (Depletion)\",\"मूल्यह्रास (Depreciation)\",\"परिशोधन (Amortisation)\"],\"a\":3,\"ee\":\"Amortisation applies to intangibles, depreciation to tangibles, and depletion to natural resources.\",\"eh\":\"अमूर्त संपत्तियों पर Amortisation (परिशोधन) लागू होता है।\"},{\"n\":16,\"d\":\"\",\"se\":\"The standard due date for filing an Income Tax Return (ITR) for individual taxpayers (whose accounts are not subject to tax audit) for AY 2025‑26 is:\",\"sh\":\"व्यक्तिगत करदाताओं (जिनके खाते कर ऑडिट के अधीन नहीं हैं) के लिए आकलन वर्ष (AY) 2025-26 हेतु आयकर रिटर्न (ITR) दाखिल करने की मानक नियत तिथि क्या है:\",\"oe\":[\"31st July\",\"31st October\",\"31st March\",\"31st December\"],\"oh\":[\"31 जुलाई\",\"31 अक्टूबर\",\"31 मार्च\",\"31 दिसंबर\"],\"a\":0,\"ee\":\"31st July of the assessment year.\",\"eh\":\"आकलन वर्ष की 31 जुलाई।\"},{\"n\":17,\"d\":\"\",\"se\":\"In GST, if a supply involves the movement of goods, the 'place of supply' is generally considered to be the:\",\"sh\":\"जीएसटी (GST) में, यदि किसी आपूर्ति में माल की आवाजाही शामिल है, तो 'आपूर्ति का स्थान' (Place of supply) आमतौर पर किसे माना जाता है:\",\"oe\":[\"Place of origin of the goods\",\"Place where the movement of goods terminates for delivery to the recipient\",\"Location of the billing address\",\"State where the supplier is registered\"],\"oh\":[\"माल की उत्पत्ति का स्थान\",\"वह स्थान जहाँ प्राप्तकर्ता को वितरण के लिए माल की आवाजाही समाप्त होती है\",\"बिलिंग पते का स्थान\",\"वह राज्य जहाँ आपूर्तिकर्ता पंजीकृत है\"],\"a\":1,\"ee\":\"GST is a destination-based consumption tax.\",\"eh\":\"जीएसटी एक गंतव्य-आधारित उपभोग कर (destination-based consumption tax) है।\"},{\"n\":18,\"d\":\"\",\"se\":\"Tax Deducted at Source (TDS) on the payment of professional fees (under Section 194J) is deducted at the rate of:\",\"sh\":\"व्यावसायिक शुल्क (Professional fees - धारा 194J के तहत) के भुगतान पर स्रोत पर कर कटौती (TDS) किस दर से की जाती है:\",\"oe\":[\"2%\",\"20%\",\"10%\",\"5%\"],\"oh\":[\"2%\",\"20%\",\"10%\",\"5%\"],\"a\":2,\"ee\":\"Professional fees attract a 10% TDS rate (while technical services usually attract 2%).\",\"eh\":\"व्यावसायिक (Professional) शुल्क पर 10% टीडीएस दर लगती है (जबकि तकनीकी सेवाओं पर आमतौर पर 2% लगती है)।\"},{\"n\":19,\"d\":\"\",\"se\":\"The GST Compensation Cess is exclusively levied on:\",\"sh\":\"जीएसटी मुआवजा उपकर (GST Compensation Cess) विशेष रूप से किस पर लगाया जाता है:\",\"oe\":[\"Essential imports only\",\"All goods and services\",\"Exempted exports\",\"Demerit (sin) goods and luxury goods\"],\"oh\":[\"केवल आवश्यक आयातों पर\",\"सभी वस्तुओं और सेवाओं पर\",\"छूट प्राप्त निर्यातों पर\",\"अवगुण (sin) वस्तुओं और विलासिता (luxury) वस्तुओं पर\"],\"a\":3,\"ee\":\"Levied on items like aerated drinks, tobacco, and luxury cars.\",\"eh\":\"वातित पेय, तंबाकू और लक्जरी कारों जैसी वस्तुओं पर लगाया जाता है।\"},{\"n\":20,\"d\":\"\",\"se\":\"Which of the following is <strong>not</strong> considered a taxable event under GST?\",\"sh\":\"निम्नलिखित में से किसे जीएसटी के तहत कर योग्य घटना (Taxable event) <strong>नहीं</strong> माना जाता है?\",\"oe\":[\"Sale of personal second‑hand goods by an unregistered individual\",\"Supply of goods by a registered dealer\",\"Import of goods\",\"Supply of services\"],\"oh\":[\"किसी अपंजीकृत व्यक्ति द्वारा अपने निजी पुराने सामान की बिक्री\",\"पंजीकृत डीलर द्वारा माल की आपूर्ति\",\"माल का आयात\",\"सेवाओं की आपूर्ति\"],\"a\":0,\"ee\":\"Casual sales by unregistered individuals not in the course of business do not attract GST.\",\"eh\":\"व्यवसाय के दौरान न की गई अपंजीकृत व्यक्तियों द्वारा आकस्मिक बिक्री पर जीएसटी नहीं लगता है।\"},{\"n\":21,\"d\":\"\",\"se\":\"What does CPU stand for?\",\"sh\":\"CPU का पूर्ण रूप क्या है?\",\"oe\":[\"Computer Personal Unit\",\"Central Processing Unit\",\"Control Processing Unit\",\"Central Program Unit\"],\"oh\":[\"कंप्यूटर पर्सनल यूनिट\",\"सेंट्रल प्रोसेसिंग यूनिट (Central Processing Unit)\",\"कंट्रोल प्रोसेसिंग यूनिट\",\"सेंट्रल प्रोग्राम यूनिट\"],\"a\":1,\"ee\":\"Central Processing Unit.\",\"eh\":\"सेंट्रल प्रोसेसिंग यूनिट।\"},{\"n\":22,\"d\":\"\",\"se\":\"Which of the following is <strong>not</strong> an input device?\",\"sh\":\"निम्नलिखित में से कौन सा इनपुट डिवाइस <strong>नहीं</strong> है?\",\"oe\":[\"Mouse\",\"Keyboard\",\"Monitor\",\"Scanner\"],\"oh\":[\"माउस (Mouse)\",\"कीबोर्ड (Keyboard)\",\"मॉनिटर (Monitor)\",\"स्कैनर (Scanner)\"],\"a\":2,\"ee\":\"A monitor displays information, making it an output device.\",\"eh\":\"मॉनिटर जानकारी प्रदर्शित करता है, जिससे यह एक आउटपुट डिवाइस बन जाता है।\"},{\"n\":23,\"d\":\"\",\"se\":\"In MS Excel, the built-in function used to find the mean of a selected range of cells is:\",\"sh\":\"MS Excel में, चयनित सेलों (cells) के समूह का औसत (mean) ज्ञात करने के लिए किस अंतर्निहित फ़ंक्शन का उपयोग किया जाता है:\",\"oe\":[\"COUNT\",\"MAX\",\"SUM\",\"AVERAGE\"],\"oh\":[\"COUNT\",\"MAX\",\"SUM\",\"AVERAGE\"],\"a\":3,\"ee\":\"The AVERAGE() function.\",\"eh\":\"AVERAGE() फ़ंक्शन।\"},{\"n\":24,\"d\":\"\",\"se\":\"Which of the following types of memory is volatile (loses data when power is turned off)?\",\"sh\":\"निम्नलिखित में से किस प्रकार की मेमोरी अस्थिर (volatile) है (पावर बंद होने पर डेटा खो देती है)?\",\"oe\":[\"RAM\",\"Hard Disk\",\"ROM\",\"DVD\"],\"oh\":[\"RAM\",\"हार्ड डिस्क\",\"ROM\",\"DVD\"],\"a\":0,\"ee\":\"Random Access Memory (RAM).\",\"eh\":\"रैंडम एक्सेस मेमोरी (RAM)।\"},{\"n\":25,\"d\":\"\",\"se\":\"The standard internet protocol used for sending outgoing emails is:\",\"sh\":\"आउटगोइंग ईमेल भेजने के लिए उपयोग किया जाने वाला मानक इंटरनेट प्रोटोकॉल कौन सा है:\",\"oe\":[\"FTP\",\"SMTP\",\"HTTP\",\"TCP/IP\"],\"oh\":[\"FTP\",\"SMTP\",\"HTTP\",\"TCP/IP\"],\"a\":1,\"ee\":\"Simple Mail Transfer Protocol (SMTP).\",\"eh\":\"सिंपल मेल ट्रांसफर प्रोटोकॉल (SMTP)।\"},{\"n\":26,\"d\":\"\",\"se\":\"In MS Word, the universal shortcut key command to save a document is:\",\"sh\":\"MS Word में, किसी दस्तावेज़ को सहेजने (save) के लिए यूनिवर्सल शॉर्टकट कुंजी कमांड क्या है:\",\"oe\":[\"Ctrl + P\",\"Ctrl + V\",\"Ctrl + S\",\"Ctrl + C\"],\"oh\":[\"Ctrl + P\",\"Ctrl + V\",\"Ctrl + S\",\"Ctrl + C\"],\"a\":2,\"ee\":\"Ctrl + S.\",\"eh\":\"Ctrl + S।\"},{\"n\":27,\"d\":\"\",\"se\":\"In networking terminology, LAN stands for:\",\"sh\":\"नेटवर्किंग शब्दावली में, LAN का अर्थ है:\",\"oe\":[\"Large Area Network\",\"Long Area Network\",\"Logical Area Network\",\"Local Area Network\"],\"oh\":[\"लार्ज एरिया नेटवर्क\",\"लॉन्ग एरिया नेटवर्क\",\"लॉजिकल एरिया नेटवर्क\",\"लोकल एरिया नेटवर्क (Local Area Network)\"],\"a\":3,\"ee\":\"Local Area Network.\",\"eh\":\"लोकल एरिया नेटवर्क।\"},{\"n\":28,\"d\":\"\",\"se\":\"The component often referred to as the &quot;brain&quot; of a computer is the:\",\"sh\":\"उस घटक (component) को क्या कहा जाता है जिसे अक्सर कंप्यूटर का &quot;मस्तिष्क&quot; कहा जाता है:\",\"oe\":[\"CPU\",\"RAM\",\"Motherboard\",\"Hard Disk\"],\"oh\":[\"CPU\",\"RAM\",\"मदरबोर्ड\",\"हार्ड डिस्क\"],\"a\":0,\"ee\":\"The Central Processing Unit.\",\"eh\":\"सेंट्रल प्रोसेसिंग यूनिट (CPU)।\"},{\"n\":29,\"d\":\"\",\"se\":\"Which of the following is <strong>not</strong> an Operating System?\",\"sh\":\"निम्नलिखित में से कौन सा ऑपरेटिंग सिस्टम (OS) <strong>नहीं</strong> है?\",\"oe\":[\"Linux\",\"MS Office\",\"MacOS\",\"Windows 11\"],\"oh\":[\"Linux\",\"MS Office\",\"MacOS\",\"Windows 11\"],\"a\":1,\"ee\":\"MS Office is a suite of application software, not an OS.\",\"eh\":\"MS Office एप्लीकेशन सॉफ्टवेयर का एक सूट है, न कि OS।\"},{\"n\":30,\"d\":\"\",\"se\":\"The maximum number of columns available in a modern MS Excel worksheet is:\",\"sh\":\"आधुनिक MS Excel वर्कशीट में उपलब्ध कॉलम की अधिकतम संख्या है:\",\"oe\":[\"65,536\",\"1024\",\"16,384\",\"256\"],\"oh\":[\"65,536\",\"1024\",\"16,384\",\"256\"],\"a\":2,\"ee\":\"Modern Excel supports 1,048,576 rows and 16,384 columns (column XFD).\",\"eh\":\"आधुनिक एक्सेल 1,048,576 पंक्तियों और 16,384 कॉलम (कॉलम XFD) का समर्थन करता है।\"},{\"n\":31,\"d\":\"\",\"se\":\"A sum of money invested at simple interest amounts to ₹1,200 in 2 years and ₹1,440 in 3 years. The principal sum is:\",\"sh\":\"साधारण ब्याज पर निवेश की गई कोई राशि 2 वर्षों में ₹1,200 और 3 वर्षों में ₹1,440 हो जाती है। मूलधन राशि है:\",\"oe\":[\"₹1,000\",\"₹960\",\"₹800\",\"₹720\"],\"oh\":[\"₹1,000\",\"₹960\",\"₹800\",\"₹720\"],\"a\":3,\"ee\":\"Interest for 1 year (Year 3 - Year 2) = 1440 - 1200 = ₹240. Interest for 2 years = ₹480. Principal = Amount after 2 yrs - Interest for 2 yrs = 1200 - 480 = ₹720.\",\"eh\":\"1 वर्ष (तीसरा वर्ष - दूसरा वर्ष) का ब्याज = 1440 - 1200 = ₹240। 2 वर्ष का ब्याज = ₹480। मूलधन = 2 वर्ष बाद की राशि - 2 वर्ष का ब्याज = 1200 - 480 = ₹720।\"},{\"n\":32,\"d\":\"\",\"se\":\"If the perimeter of a square is 40 cm, its area is:\",\"sh\":\"यदि एक वर्ग (square) का परिमाप 40 सेमी है, तो इसका क्षेत्रफल होगा:\",\"oe\":[\"100 cm²\",\"80 cm²\",\"160 cm²\",\"120 cm²\"],\"oh\":[\"100 वर्ग सेमी\",\"80 वर्ग सेमी\",\"160 वर्ग सेमी\",\"120 वर्ग सेमी\"],\"a\":0,\"ee\":\"Perimeter = 4 × Side. Side = 40/4 = 10 cm. Area = 10 × 10 = 100 cm².\",\"eh\":\"परिमाप = 4 × भुजा। भुजा = 40/4 = 10 सेमी। क्षेत्रफल = 10 × 10 = 100 वर्ग सेमी।\"},{\"n\":33,\"d\":\"\",\"se\":\"The cost price of 15 articles is equal to the selling price of 12 articles. The profit percentage is:\",\"sh\":\"15 वस्तुओं का क्रय मूल्य (CP) 12 वस्तुओं के विक्रय मूल्य (SP) के बराबर है। लाभ प्रतिशत है:\",\"oe\":[\"20%\",\"25%\",\"33.33%\",\"30%\"],\"oh\":[\"20%\",\"25%\",\"33.33%\",\"30%\"],\"a\":1,\"ee\":\"Let CP of 1 article = ₹1. CP of 12 = ₹12. SP of 12 = CP of 15 = ₹15. Profit = 15 - 12 = ₹3. Profit % = (3/12) × 100 = 25%.\",\"eh\":\"मान लें 1 वस्तु का CP = ₹1। 12 का CP = ₹12। 12 का SP = 15 का CP = ₹15। लाभ = 15 - 12 = ₹3। लाभ % = (3/12) × 100 = 25%।\"},{\"n\":34,\"d\":\"\",\"se\":\"A bag contains 4 white, 5 red, and 6 blue balls. If one ball is drawn at random, the proba
