<!DOCTYPE html>
<html lang="en">

<title>Examust · SECL Accounts Clerk Grade-II 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Mobile first. Everything below is the phone layout; the two queries at the
   end are the only widening. */
:root{
  --navy:#2E4768; --navy-l:#41597B; --sage:#556B46;
  --grad:linear-gradient(135deg,var(--navy),var(--sage));
  --bg:#efe8db; --paper:#fbf9f4; --ink:#41474f; --muted:#81878d; --line:#e7dfd1;
  --green:#4F7A5E; --green-bg:#e7f2ea; --green-line:#c4e0d0;
  --red:#cf7b7b; --red-bg:#fbeceb; --red-line:#f0d2d0;
  --amber:#9C7238; --amber-bg:#fbf1e0; --amber-line:#efdcc0;
  --lav:#6E63A0; --lav-bg:#eceaf6;
  --sh:0 8px 22px rgba(116,108,91,.10);
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --dev:"Noto Sans Devanagari","Nirmala UI","Devanagari Sangam MN";
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:linear-gradient(172deg,#f2ece1,#eceadf 44%,#e4eae2);
  color:var(--ink);font-family:var(--f),var(--dev);font-size:15px;line-height:1.55;font-weight:500;
  -webkit-font-smoothing:antialiased;overflow-wrap:break-word}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
.hi{font-family:var(--dev),var(--f);display:block;margin-top:5px;color:var(--muted);font-size:.95em}
.m{font-variant-numeric:tabular-nums;white-space:nowrap}
sub,sup{font-size:.68em;line-height:0}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
.top{position:sticky;top:0;z-index:60;background:var(--grad);box-shadow:var(--sh)}
.top-in{display:flex;align-items:center;gap:9px;height:54px;max-width:760px;margin:0 auto;padding:0 14px}
.bd{color:#fff;font-weight:800;font-size:13.5px;line-height:1.15;min-width:0}
.bd small{display:block;font-weight:600;font-size:10.5px;opacity:.82;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.top .sp{flex:1}
.ic{height:34px;min-width:42px;padding:0 11px;border:0;border-radius:999px;
  background:rgba(255,255,255,.22);color:#fff;font-size:12px;font-weight:700;cursor:pointer}
main{padding:14px 0 96px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;
  margin-bottom:11px;box-shadow:var(--sh)}
h1{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.12;margin:0 0 10px}
h2{font-size:16.5px;font-weight:800;margin:0 0 9px;letter-spacing:-.01em}
.eb{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
p{margin:0 0 10px}.mu{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;
  border:0;border-radius:14px;background:var(--grad);color:#fff;font-weight:700;font-size:15px;
  padding:13px 16px;cursor:pointer;box-shadow:var(--sh)}
.btn.gh{background:var(--paper);border:1.5px solid var(--line);color:var(--ink);box-shadow:none}
.btn[disabled]{opacity:.42;pointer-events:none}
.row{display:flex;flex-direction:column;gap:9px}
.inp{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:13px;
  padding:15px 14px;font-size:16px;min-height:52px}
.inp:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 4px rgba(46,71,104,.10)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.stats>div{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:11px 10px}
.stats .v{font-size:19px;font-weight:800;line-height:1.1}
.stats .l{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.tile{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:8px;cursor:pointer;
  color:var(--ink);box-shadow:var(--sh)}
.tile b{display:block;font-size:14px;font-weight:700;line-height:1.3}
.tile small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}
.ring{width:40px;height:40px;flex:none;border-radius:999px;display:grid;place-items:center;
  font-size:10.5px;font-weight:800;background:var(--bg);color:var(--muted);border:2.5px solid var(--line)}
.ring.part{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
.ring.done{border-color:var(--green-line);color:var(--green);background:var(--green-bg)}
.bar{height:6px;border-radius:999px;background:var(--bg);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:999px}
.qn{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  margin-bottom:9px;display:flex;align-items:center;gap:8px}
.qn .sp{flex:1}
.clk{font-weight:800;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.clk.warn{color:var(--amber)}.clk.crit{color:var(--red)}
.df{border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:9px;background:var(--bg)}
.stem{font-size:16.5px;font-weight:600;line-height:1.45;margin-bottom:14px}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.opts li{border:1.5px solid var(--line);border-radius:13px;background:var(--paper)}
.opts button{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:none;
  border:0;padding:13px;cursor:pointer;border-radius:12px;min-height:52px}
.opts .lt{flex:none;width:26px;height:26px;border-radius:999px;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--muted)}
.opts .tx{flex:1;font-size:15px;line-height:1.45}
.opts li.sel{border-color:var(--navy);background:var(--bg)}
.opts li.sel .lt{background:var(--navy);border-color:var(--navy);color:#fff}
.opts li.ok{border-color:var(--green-line);background:var(--green-bg)}
.opts li.ok .lt{background:var(--green);border-color:var(--green);color:#fff}
.opts li.bad{border-color:var(--red-line);background:var(--red-bg)}
.opts li.bad .lt{background:var(--red);border-color:var(--red);color:#fff}
.vd{margin-top:14px;padding:12px 14px;border-radius:13px;font-weight:700;font-size:14.5px}
.vd.y{background:var(--green-bg);color:var(--green);border:1px solid var(--green-line)}
.vd.n{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line)}
.exp{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.55}
.tri{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.tri button{border:1.5px solid var(--line);background:var(--paper);border-radius:13px;padding:12px;
  cursor:pointer;text-align:left;color:var(--ink);display:flex;align-items:center;gap:10px;min-height:56px}
.tri b{display:block;font-size:13.5px;font-weight:800}
.tri small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.tri .ct{margin-left:auto;flex:none;font-size:11px;font-weight:800;color:var(--muted);
  background:var(--bg);border-radius:999px;padding:3px 9px;min-width:30px;text-align:center}
.tri button[aria-pressed=true]{border-color:var(--tc);background:var(--tcb)}
.tri .t1{--tc:var(--red-line);--tcb:var(--red-bg)}
.tri .t2{--tc:var(--amber-line);--tcb:var(--amber-bg)}
.tri .t3{--tc:var(--lav);--tcb:var(--lav-bg)}
.bn{background:var(--grad);color:#fff;border-radius:18px;padding:19px;margin-bottom:11px;
  position:relative;overflow:hidden;box-shadow:var(--sh)}
.bn::after{content:"";position:absolute;right:-40px;top:-48px;width:150px;height:150px;
  border-radius:50%;background:rgba(255,255,255,.15)}
.bn h2,.bn p,.bn .eb{position:relative;z-index:2}
.bn h2{margin:7px 0 6px;font-size:19px}
.bn p{margin:0;opacity:.93;font-size:13px}
.cdn{display:flex;gap:7px;margin-top:13px;position:relative;z-index:2}
.cdn div{background:rgba(255,255,255,.18);border-radius:11px;padding:8px 0;text-align:center;flex:1}
.cdn b{display:block;font-size:18px;font-weight:800;line-height:1}
.cdn span{font-size:9.5px;opacity:.86;letter-spacing:.06em;text-transform:uppercase}
.warn{background:var(--red-bg);border:1px solid var(--red-line);border-radius:14px;padding:14px;
  font-size:13.5px;color:var(--red);line-height:1.5;margin-bottom:11px}
.warn b{display:block;margin-bottom:4px;font-weight:800}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:12px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(251,249,244,.97);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:9px 14px calc(9px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:760px;margin:0 auto;display:flex;gap:9px;align-items:center}
.dock .pg{font-size:11.5px;font-weight:800;color:var(--muted);flex:none}
.toast{position:fixed;left:14px;right:14px;bottom:84px;z-index:99;background:var(--ink);color:#fff;
  padding:12px 16px;border-radius:14px;font-size:13.5px;text-align:center;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:7px 6px 7px 0;border-bottom:1.5px solid var(--line)}
td{padding:8px 6px 8px 0;border-bottom:1px solid var(--line)}
@media (min-width:620px){
  .stats{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
  .row{flex-direction:row}.row>.btn{flex:1}
  h1{font-size:28px} .card{padding:22px;border-radius:20px}
  .toast{left:50%;right:auto;transform:translateX(-50%);min-width:280px}
}
@media (min-width:900px){ .wrap{padding:0 18px} h1{font-size:30px} }
</style>
</head>

<script>

  }

}

const SUBJECTS=JSON.parse("[{\"id\":\"as1\",\"num\":1,\"name\":\"Accounting & Finance\",\"q\":[{\"n\":1,\"d\":\"\",\"se\":\"Which of the following is classified as a <strong>personal account</strong>?\",\"sh\":\"निम्नलिखित में से किसे <strong>व्यक्तिगत खाता (Personal account)</strong> के रूप में वर्गीकृत किया गया है?\",\"oe\":[\"Capital A/c\",\"Goodwill A/c\",\"Rent A/c\",\"Machinery A/c\"],\"oh\":[\"पूंजी खाता (Capital A/c)\",\"ख्याति खाता\",\"किराया खाता\",\"मशीनरी खाता\"],\"a\":0,\"ee\":\"Capital A/c represents the owner (a natural person), hence it is a personal account.\",\"eh\":\"पूंजी खाता व्यवसाय के मालिक (एक प्राकृतिक व्यक्ति) का प्रतिनिधित्व करता है, इसलिए यह एक व्यक्तिगत खाता है।\"},{\"n\":2,\"d\":\"\",\"se\":\"The golden rule for <strong>real accounts</strong> is:\",\"sh\":\"<strong>वास्तविक खातों (Real accounts)</strong> के लिए सुनहरा नियम क्या है:\",\"oe\":[\"Debit the giver, credit the receiver\",\"Debit what comes in, credit what goes out\",\"Debit all expenses, credit all incomes\",\"Debit the receiver, credit the giver\"],\"oh\":[\"देने वाले को डेबिट करें, प्राप्तकर्ता को क्रेडिट करें\",\"जो आता है उसे डेबिट करें, जो जाता है उसे क्रेडिट करें (Debit what comes in, credit what goes out)\",\"सभी खर्चों को डेबिट करें, सभी आय को क्रेडिट करें\",\"प्राप्तकर्ता को डेबिट करें, देने वाले को क्रेडिट करें\"],\"a\":1,\"ee\":\"Applies to assets.\",\"eh\":\"यह नियम संपत्तियों (Assets) पर लागू होता है।\"},{\"n\":3,\"d\":\"\",\"se\":\"The purchase of office furniture strictly for cash is recorded initially in the:\",\"sh\":\"नकद में कार्यालय फर्नीचर की खरीद को शुरू में किसमें दर्ज किया जाता है:\",\"oe\":[\"Furniture Account\",\"Journal Proper\",\"Cash Book\",\"Purchase Book\"],\"oh\":[\"फर्नीचर खाता\",\"जर्नल प्रॉपर\",\"रोकड़ बही (Cash Book)\",\"क्रय बही (Purchase Book)\"],\"a\":2,\"ee\":\"The Cash Book records all cash receipts and cash payments.\",\"eh\":\"रोकड़ बही सभी नकद प्राप्तियों और नकद भुगतानों को दर्ज करती है।\"},{\"n\":4,\"d\":\"\",\"se\":\"A debit balance in the <strong>Bank column</strong> of the cash book indicates:\",\"sh\":\"रोकड़ बही के <strong>बैंक कॉलम</strong> में डेबिट शेष (Debit balance) क्या दर्शाता है:\",\"oe\":[\"Bank overdraft\",\"Cash in hand\",\"Net loss\",\"Favourable bank balance\"],\"oh\":[\"बैंक ओवरड्राफ्ट\",\"हाथ में रोकड़\",\"शुद्ध हानि\",\"अनुकूल बैंक शेष (Favourable bank balance)\"],\"a\":3,\"ee\":\"A debit balance signifies money deposited in the bank (favourable).\",\"eh\":\"डेबिट शेष का अर्थ है बैंक में जमा पैसा (अनुकूल)।\"},{\"n\":5,\"d\":\"\",\"se\":\"Which of the following errors is <strong>not</strong> disclosed by a trial balance?\",\"sh\":\"निम्नलिखित में से कौन सी त्रुटि तलपट (Trial balance) द्वारा प्रकट <strong>नहीं</strong> होती है?\",\"oe\":[\"Compensating errors\",\"Wrong carrying forward of a ledger balance\",\"Wrong totaling of a subsidiary book\",\"Posting an amount on the wrong side of an account\"],\"oh\":[\"क्षतिपूरक अशुद्धियाँ (Compensating errors)\",\"खाता बही के शेष को आगे ले जाने में गलती\",\"सहायक बही के योग में गलती\",\"खाते के गलत पक्ष में राशि दर्ज करना\"],\"a\":0,\"ee\":\"Compensating errors cancel each other out, leaving the trial balance matched.\",\"eh\":\"क्षतिपूरक अशुद्धियाँ एक-दूसरे को रद्द कर देती हैं, जिससे तलपट मिल जाता है।\"},{\"n\":6,\"d\":\"\",\"se\":\"The primary book in which all cash and bank transactions are recorded is the:\",\"sh\":\"वह प्राथमिक बही जिसमें सभी नकद और बैंक लेनदेन दर्ज किए जाते हैं:\",\"oe\":[\"Ledger\",\"Cash Book\",\"Trial Balance\",\"Journal\"],\"oh\":[\"लेजर\",\"रोकड़ बही (Cash Book)\",\"तलपट\",\"जर्नल\"],\"a\":1,\"ee\":\"Cash Book (which serves as both a journal and a ledger).\",\"eh\":\"रोकड़ बही (जो जर्नल और लेजर दोनों के रूप में कार्य करती है)।\"},{\"n\":7,\"d\":\"\",\"se\":\"The <strong>Purchase Returns Book</strong> (Return Outward Book) is used exclusively to record:\",\"sh\":\"<strong>क्रय वापसी बही (Purchase Returns Book / Return Outward Book)</strong> का उपयोग विशेष रूप से किसे दर्ज करने के लिए किया जाता है:\",\"oe\":[\"Return of cash\",\"Return of goods sold to customers\",\"Return of goods purchased on credit from suppliers\",\"Return of fixed assets\"],\"oh\":[\"नकद की वापसी\",\"ग्राहकों को बेचे गए माल की वापसी\",\"आपूर्तिकर्ताओं से उधार खरीदे गए माल की वापसी\",\"स्थायी संपत्तियों की वापसी\"],\"a\":2,\"ee\":\"Return of credit purchases.\",\"eh\":\"उधार खरीद की वापसी।\"},{\"n\":8,\"d\":\"\",\"se\":\"The process of transferring entries from the journal to the respective ledger accounts is called:\",\"sh\":\"जर्नल से संबंधित लेजर (खाता बही) खातों में प्रविष्टियों को स्थानांतरित करने की प्रक्रिया क्या कहलाती है:\",\"oe\":[\"Summarizing\",\"Journalizing\",\"Balancing\",\"Posting\"],\"oh\":[\"संक्षिप्तीकरण\",\"जर्नलाइजिंग\",\"संतुलन (Balancing)\",\"खतौनी (Posting)\"],\"a\":3,\"ee\":\"Posting.\",\"eh\":\"खतौनी (Posting)।\"},{\"n\":9,\"d\":\"\",\"se\":\"A <strong>trial balance</strong> is primarily prepared to:\",\"sh\":\"<strong>तलपट (Trial balance)</strong> मुख्य रूप से क्यों तैयार किया जाता है:\",\"oe\":[\"Check the arithmetical accuracy of the books of accounts\",\"Determine the financial position\",\"Record initial transactions\",\"Ascertain net profit or loss\"],\"oh\":[\"खातों की पुस्तकों की अंकगणितीय सटीकता (arithmetical accuracy) की जांच करने के लिए\",\"वित्तीय स्थिति निर्धारित करने के लिए\",\"प्रारंभिक लेनदेन दर्ज करने के लिए\",\"शुद्ध लाभ या हानि का पता लगाने के लिए\"],\"a\":0,\"ee\":\"Arithmetical accuracy.\",\"eh\":\"अंकगणितीय सटीकता जांचने के लिए।\"},{\"n\":10,\"d\":\"\",\"se\":\"Which of the following is classified as a <strong>nominal account</strong>?\",\"sh\":\"निम्नलिखित में से किसे <strong>नाममात्र खाता (Nominal account)</strong> के रूप में वर्गीकृत किया गया है?\",\"oe\":[\"Building A/c\",\"Salary A/c\",\"Debtors A/c\",\"Capital A/c\"],\"oh\":[\"भवन खाता\",\"वेतन खाता (Salary A/c)\",\"देनदार खाता\",\"पूंजी खाता\"],\"a\":1,\"ee\":\"Salary is an expense, hence a nominal account.\",\"eh\":\"वेतन एक व्यय है, इसलिए यह एक नाममात्र खाता है।\"},{\"n\":11,\"d\":\"\",\"se\":\"The <strong>imprest system</strong> of accounting is specifically related to the:\",\"sh\":\"लेखांकन की <strong>इम्प्रेस्ट प्रणाली (Imprest system)</strong> विशेष रूप से किससे संबंधित है:\",\"oe\":[\"Sales Book\",\"Journal Proper\",\"Petty Cash Book\",\"Purchase Book\"],\"oh\":[\"बिक्री बही\",\"जर्नल प्रॉपर\",\"खुदरा रोकड़ बही (Petty Cash Book)\",\"क्रय बही\"],\"a\":2,\"ee\":\"A fixed float (imprest) is maintained for petty expenses.\",\"eh\":\"छोटे खर्चों के लिए एक निश्चित फ्लोट (imprest) बनाए रखा जाता है।\"},{\"n\":12,\"d\":\"\",\"se\":\"Goods destroyed by fire (before any insurance claim adjustment) should be credited to the:\",\"sh\":\"आग से नष्ट हुए माल को (किसी भी बीमा दावे के समायोजन से पहले) किसमें क्रेडिट किया जाना चाहिए:\",\"oe\":[\"Insurance Claim A/c\",\"Trading A/c\",\"Profit &amp; Loss A/c\",\"Purchases A/c\"],\"oh\":[\"बीमा दावा खाता\",\"व्यापार खाता\",\"लाभ और हानि खाता\",\"क्रय खाता (Purchases A/c)\"],\"a\":3,\"ee\":\"It reduces the volume of purchases meant for sale.\",\"eh\":\"यह बिक्री के लिए रखे गए माल (खरीद) की मात्रा को कम करता है।\"},{\"n\":13,\"d\":\"\",\"se\":\"The <strong>closing stock</strong> given outside the trial balance is shown in the Trading Account on the:\",\"sh\":\"तलपट के बाहर दिए गए <strong>अंतिम स्टॉक (Closing stock)</strong> को व्यापार खाते (Trading A/c) में किस पक्ष में दिखाया जाता है:\",\"oe\":[\"Debit side\",\"Credit side\",\"Both sides\",\"Not shown\"],\"oh\":[\"डेबिट पक्ष\",\"क्रेडिट पक्ष\",\"दोनों पक्ष\",\"नहीं दिखाया जाता\"],\"a\":1,\"ee\":\"It is credited to the Trading A/c (and shown as an asset in the Balance Sheet).\",\"eh\":\"इसे व्यापार खाते में क्रेडिट किया जाता है (और बैलेंस शीट में संपत्ति के रूप में दिखाया जाता है)।\"},{\"n\":14,\"d\":\"\",\"se\":\"<strong>Outstanding expenses</strong> given as an adjustment are added to the respective expense in the:\",\"sh\":\"समायोजन के रूप में दिए गए <strong>अदत्त व्यय (Outstanding expenses)</strong> को किसमें संबंधित व्यय में जोड़ा जाता है:\",\"oe\":[\"Profit &amp; Loss A/c\",\"Cash Book\",\"Trading A/c\",\"Balance Sheet (Assets)\"],\"oh\":[\"लाभ और हानि खाता (P&amp;L A/c)\",\"रोकड़ बही\",\"व्यापार खाता\",\"बैलेंस शीट (संपत्ति)\"],\"a\":0,\"ee\":\"They are added to the specific expense in the P&amp;L and shown as a liability.\",\"eh\":\"उन्हें P&amp;L में विशिष्ट व्यय में जोड़ा जाता है और दायित्व के रूप में दिखाया जाता है।\"},{\"n\":15,\"d\":\"\",\"se\":\"<strong>Prepaid expenses</strong> are presented in the balance sheet as a:\",\"sh\":\"<strong>पूर्वदत्त व्यय (Prepaid expenses)</strong> को बैलेंस शीट में किस रूप में प्रस्तुत किया जाता है:\",\"oe\":[\"Fixed asset\",\"Current asset\",\"Current liability\",\"Shareholders&rsquo; fund\"],\"oh\":[\"स्थायी संपत्ति\",\"चालू संपत्ति (Current asset)\",\"चालू दायित्व\",\"शेयरधारक निधि\"],\"a\":1,\"ee\":\"They represent future benefits receivable.\",\"eh\":\"ये भविष्य में प्राप्त होने वाले लाभों का प्रतिनिधित्व करते हैं।\"},{\"n\":16,\"d\":\"\",\"se\":\"The <strong>matching concept</strong> fundamentally states that:\",\"sh\":\"<strong>मिलान अवधारणा (Matching concept)</strong> मौलिक रूप से यह बताती है कि:\",\"oe\":[\"Accounting policies should be consistent\",\"Business is separate from the owner\",\"Revenues and the expenses incurred to earn those revenues should be matched in the same accounting period\",\"Assets = Liabilities + Capital\"],\"oh\":[\"लेखांकन नीतियां सुसंगत होनी चाहिए\",\"व्यवसाय मालिक से अलग है\",\"राजस्व और उस राजस्व को अर्जित करने के लिए किए गए खर्चों का उसी लेखांकन अवधि में मिलान किया जाना चाहिए\",\"संपत्ति = देयताएं + पूंजी\"],\"a\":2,\"ee\":\"Matching revenues against expenses.\",\"eh\":\"खर्चों के विरुद्ध राजस्व का मिलान।\"},{\"n\":17,\"d\":\"\",\"se\":\"Under the <strong>going concern concept</strong>, it is fundamentally assumed that the business will:\",\"sh\":\"<strong>चालू व्यापार अवधारणा (Going concern concept)</strong> के तहत, यह मौलिक रूप से माना जाता है कि व्यवसाय:\",\"oe\":[\"Have a legally limited life\",\"Be merged with a competitor soon\",\"Wind up in the next financial year\",\"Continue its operations for a foreseeable future\"],\"oh\":[\"एक कानूनी रूप से सीमित जीवन है\",\"जल्द ही किसी प्रतियोगी के साथ विलय हो जाएगा\",\"अगले वित्तीय वर्ष में बंद हो जाएगा\",\"भविष्य में अपना संचालन जारी रखेगा\"],\"a\":3,\"ee\":\"Continue for the foreseeable future.\",\"eh\":\"निकट भविष्य के लिए जारी रहेगा।\"},{\"n\":18,\"d\":\"\",\"se\":\"<strong>Capital expenditure</strong> is primarily incurred to:\",\"sh\":\"<strong>पूंजीगत व्यय (Capital expenditure)</strong> मुख्य रूप से किसके लिए किया जाता है:\",\"oe\":[\"Acquire or improve fixed assets to increase earning capacity\",\"Meet day-to-day operational expenses\",\"Pay employee salaries\",\"Maintain existing assets\"],\"oh\":[\"कमाई क्षमता बढ़ाने के लिए स्थायी संपत्तियों को प्राप्त करने या सुधारने के लिए\",\"दिन-प्रतिदिन के परिचालन खर्चों को पूरा करने के लिए\",\"कर्मचारी वेतन का भुगतान करने के लिए\",\"मौजूदा संपत्तियों को बनाए रखने के लिए\"],\"a\":0,\"ee\":\"Acquire or upgrade long-term assets.\",\"eh\":\"दीर्घकालिक संपत्तियों को प्राप्त करने या अपग्रेड करने के लिए।\"},{\"n\":19,\"d\":\"\",\"se\":\"<strong>Revenue expenditure</strong> is typically incurred to:\",\"sh\":\"<strong>राजस्व व्यय (Revenue expenditure)</strong> आमतौर पर किसके लिए किया जाता है:\",\"oe\":[\"Purchase a new building\",\"Pay for routine repair and maintenance to keep an asset in working condition\",\"Install heavy machinery\",\"Buy long-term investments\"],\"oh\":[\"नई इमारत खरीदने के लिए\",\"किसी संपत्ति को चालू स्थिति में रखने के लिए नियमित मरम्मत और रखरखाव का भुगतान करने के लिए\",\"भारी मशीनरी स्थापित करने के लिए\",\"दीर्घकालिक निवेश खरीदने के लिए\"],\"a\":1,\"ee\":\"Routine maintenance.\",\"eh\":\"नियमित रखरखाव (Routine maintenance)।\"},{\"n\":20,\"d\":\"\",\"se\":\"<strong>Depreciation</strong> in accounting is strictly:\",\"sh\":\"लेखांकन में <strong>मूल्यह्रास (Depreciation)</strong> कड़ाई से क्या है:\",\"oe\":[\"A process of market appreciation\",\"A process of cash flow generation\",\"A process of allocation of the cost of an asset over its useful life\",\"A process of asset valuation\"],\"oh\":[\"बाजार मूल्यवृद्धि की एक प्रक्रिया\",\"नकदी प्रवाह उत्पन्न करने की एक प्रक्रिया\",\"किसी संपत्ति के उपयोगी जीवन पर उसकी लागत के आवंटन की एक प्रक्रिया\",\"संपत्ति के मूल्यांकन की एक प्रक्रिया\"],\"a\":2,\"ee\":\"Cost allocation.\",\"eh\":\"लागत आवंटन (Cost allocation)।\"},{\"n\":21,\"d\":\"\",\"se\":\"Under the <strong>Straight-Line Method (SLM)</strong>, depreciation is calculated on the:\",\"sh\":\"<strong>सीधी-रेखा विधि (Straight-Line Method - SLM)</strong> के तहत, मूल्यह्रास की गणना किस पर की जाती है:\",\"oe\":[\"Written-down value\",\"Current book value\",\"Current market value\",\"Original cost of the asset minus its salvage value\"],\"oh\":[\"लिखित मूल्य (WDV)\",\"वर्तमान पुस्तक मूल्य\",\"वर्तमान बाजार मूल्य\",\"संपत्ति की मूल लागत (Original cost) माइनस उसका निस्तारण (salvage) मूल्य\"],\"a\":3,\"ee\":\"(Original Cost - Salvage Value) / Useful Life.\",\"eh\":\"(मूल लागत - निस्तारण मूल्य) / उपयोगी जीवन।\"},{\"n\":22,\"d\":\"\",\"se\":\"The <strong>Diminishing Balance Method</strong> of depreciation is also widely known as the:\",\"sh\":\"मूल्यह्रास की घटती शेष विधि (Diminishing Balance Method) को व्यापक रूप से किस नाम से भी जाना जाता है:\",\"oe\":[\"Written Down Value (WDV) method\",\"Sinking fund method\",\"Annuity method\",\"Fixed instalment method\"],\"oh\":[\"लिखित मूल्य (WDV) विधि\",\"सिंकिंग फंड विधि\",\"वार्षिकी विधि\",\"निश्चित किस्त विधि\"],\"a\":0,\"ee\":\"WDV method.\",\"eh\":\"WDV विधि।\"},{\"n\":23,\"d\":\"\",\"se\":\"Which of the following is <strong>not</strong> a valid cause of depreciation?\",\"sh\":\"निम्नलिखित में से कौन सा मूल्यह्रास का वैध कारण <strong>नहीं</strong> है?\",\"oe\":[\"Technological obsolescence\",\"Upward or downward fluctuation in the market price of the asset\",\"Expiration of legal rights (like patents)\",\"Physical wear and tear\"],\"oh\":[\"तकनीकी अप्रचलन (obsolescence)\",\"संपत्ति के बाजार मूल्य में ऊपर या नीचे का उतार-चढ़ाव\",\"कानूनी अधिकारों (जैसे पेटेंट) की समाप्ति\",\"भौतिक टूट-फूट\"],\"a\":1,\"ee\":\"Temporary market price fluctuations do not cause depreciation.\",\"eh\":\"अस्थायी बाजार मूल्य में उतार-चढ़ाव मूल्यह्रास का कारण नहीं बनते हैं।\"},{\"n\":24,\"d\":\"\",\"se\":\"<strong>Goodwill</strong> is the classic example of an:\",\"sh\":\"<strong>ख्याति (Goodwill)</strong> किसका उत्कृष्ट उदाहरण है:\",\"oe\":[\"Fictitious asset\",\"Liquid asset\",\"Intangible fixed asset\",\"Current asset\"],\"oh\":[\"कृत्रिम संपत्ति\",\"तरल संपत्ति\",\"अमूर्त स्थायी संपत्ति (Intangible fixed asset)\",\"चालू संपत्ति\"],\"a\":2,\"ee\":\"It has value but no physical substance.\",\"eh\":\"इसका मूल्य है लेकिन कोई भौतिक अस्तित्व नहीं है।\"},{\"n\":25,\"d\":\"\",\"se\":\"<strong>Preliminary expenses</strong> incurred during company formation are shown in the balance sheet (until written off) as a:\",\"sh\":\"कंपनी के निर्माण के दौरान किए गए <strong>प्रारंभिक व्यय (Preliminary expenses)</strong> को बैलेंस शीट में (अपलिखित होने तक) किस रूप में दिखाया जाता है:\",\"oe\":[\"Current asset\",\"Fixed asset\",\"Intangible asset\",\"Fictitious asset (Unamortized expenditure)\"],\"oh\":[\"चालू संपत्ति\",\"स्थायी संपत्ति\",\"अमूर्त संपत्ति\",\"कृत्रिम संपत्ति (Fictitious asset / असमायोजित व्यय)\"],\"a\":3,\"ee\":\"Fictitious asset.\",\"eh\":\"कृत्रिम संपत्ति।\"},{\"n\":26,\"d\":\"\",\"se\":\"In a partnership firm, the <strong>Profit and Loss Appropriation Account</strong> is prepared primarily to:\",\"sh\":\"साझेदारी फर्म में, <strong>लाभ और हानि विनियोग खाता (P&amp;L Appropriation A/c)</strong> मुख्य रूप से क्यों तैयार किया जाता है:\",\"oe\":[\"Distribute the net profit among the partners\",\"Record all direct operational expenses\",\"Ascertain gross profit\",\"Calculate operating net profit\"],\"oh\":[\"साझेदारों के बीच शुद्ध लाभ वितरित करने के लिए\",\"सभी प्रत्यक्ष परिचालन खर्चों को दर्ज करने के लिए\",\"सकल लाभ का पता लगाने के लिए\",\"परिचालन शुद्ध लाभ की गणना करने के लिए\"],\"a\":0,\"ee\":\"Distribute profit (interest on capital, salary, share of profit).\",\"eh\":\"लाभ वितरित करने के लिए (पूंजी पर ब्याज, वेतन, लाभ का हिस्सा)।\"},{\"n\":27,\"d\":\"\",\"se\":\"In the complete absence of a partnership deed, the profits or losses are shared by the partners:\",\"sh\":\"साझेदारी विलेख की पूर्ण अनुपस्थिति में, साझेदारों द्वारा लाभ या हानि को साझा किया जाता है:\",\"oe\":[\"In the ratio of their capital contributions\",\"Equally\",\"In the ratio of 2:1\",\"As per mutual verbal agreement at year-end\"],\"oh\":[\"उनके पूंजी योगदान के अनुपात में\",\"समान रूप से (Equally)\",\"2:1 के अनुपात में\",\"वर्ष के अंत में आपसी मौखिक समझौते के अनुसार\"],\"a\":1,\"ee\":\"Equally (Partnership Act, 1932).\",\"eh\":\"समान रूप से (साझेदारी अधिनियम, 1932)।\"},{\"n\":28,\"d\":\"\",\"se\":\"Interest on capital is provided to partners only if:\",\"sh\":\"साझेदारों को पूंजी पर ब्याज केवल तभी प्रदान किया जाता है जब:\",\"oe\":[\"The partners demand it at the end of the year\",\"It is allowed by the court\",\"It is explicitly specified in the partnership deed\",\"It is a fixed statutory right\"],\"oh\":[\"साझेदार वर्ष के अंत में इसकी मांग करते हैं\",\"न्यायालय द्वारा इसकी अनुमति दी जाती है\",\"यह साझेदारी विलेख में स्पष्ट रूप से निर्दिष्ट हो\",\"यह एक निश्चित वैधानिक अधिकार है\"],\"a\":2,\"ee\":\"Must be specified in the deed.\",\"eh\":\"विलेख (deed) में निर्दिष्ट होना चाहिए।\"},{\"n\":29,\"d\":\"\",\"se\":\"At the time of the admission of a new partner, the <strong>premium for goodwill brought in cash</strong> is credited to the:\",\"sh\":\"नए साझेदार के प्रवेश के समय, <strong>नकद में लाए गए ख्याति के प्रीमियम</strong> को क्रेडिट किया जाता है:\",\"oe\":[\"Profit &amp; Loss account\",\"Goodwill account permanently\",\"New partner&rsquo;s capital account\",\"Old partners&rsquo; capital accounts in their sacrificing ratio\"],\"oh\":[\"लाभ और हानि खाते में\",\"स्थायी रूप से ख्याति खाते में\",\"नए साझेदार के पूंजी खाते में\",\"पुराने साझेदारों के पूंजी खातों में उनके त्याग अनुपात (sacrificing ratio) में\"],\"a\":3,\"ee\":\"Old partners in sacrificing ratio.\",\"eh\":\"त्याग अनुपात में पुराने साझेदार।\"},{\"n\":30,\"d\":\"\",\"se\":\"The <strong>sacrificing ratio</strong> is mathematically calculated as:\",\"sh\":\"<strong>त्याग अनुपात (Sacrificing ratio)</strong> की गणना गणितीय रूप से कैसे की जाती है:\",\"oe\":[\"Old Ratio – New Ratio\",\"Old Ratio + New Ratio\",\"Old Ratio × New Ratio\",\"New Ratio – Old Ratio\"],\"oh\":[\"पुराना अनुपात - नया अनुपात (Old Ratio - New Ratio)\",\"पुराना अनुपात + नया अनुपात\",\"पुराना अनुपात × नया अनुपात\",\"नया अनुपात - पुराना अनुपात\"],\"a\":0,\"ee\":\"Old Ratio - New Ratio.\",\"eh\":\"पुराना अनुपात - नया अनुपात।\"},{\"n\":31,\"d\":\"\",\"se\":\"When a partner retires from a firm, the share of profit gained by the remaining partners is known as the:\",\"sh\":\"जब कोई साझेदार फर्म से सेवानिवृत्त (retire) होता है, तो शेष साझेदारों द्वारा प्राप्त लाभ के हिस्से को क्या कहा जाता है:\",\"oe\":[\"Sacrificing ratio\",\"Gaining ratio\",\"New ratio\",\"Old ratio\"],\"oh\":[\"त्याग अनुपात\",\"लाभ-प्राप्ति अनुपात (Gaining ratio)\",\"नया अनुपात\",\"पुराना अनुपात\"],\"a\":1,\"ee\":\"Gaining ratio.\",\"eh\":\"लाभ-प्राप्ति अनुपात (Gaining ratio)।\"},{\"n\":32,\"d\":\"\",\"se\":\"The retiring partner&rsquo;s share of the firm's hidden/valued goodwill is credited to the:\",\"sh\":\"सेवानिवृत्त होने वाले साझेदार के फर्म की छिपी/मूल्यांकित ख्याति के हिस्से को क्रेडिट किया जाता है:\",\"oe\":[\"Goodwill account\",\"Revaluation account\",\"Retiring partner&rsquo;s capital account\",\"Continuing partners&rsquo; capital accounts\"],\"oh\":[\"ख्याति खाते में\",\"पुनर्मूल्यांकन खाते में\",\"सेवानिवृत्त साझेदार के पूंजी खाते में\",\"चालू साझेदारों के पूंजी खातों में\"],\"a\":2,\"ee\":\"The retiring partner is compensated, so their account is credited.\",\"eh\":\"सेवानिवृत्त होने वाले साझेदार को मुआवजा दिया जाता है, इसलिए उनके खाते में क्रेडिट किया जाता है।\"},{\"n\":33,\"d\":\"\",\"se\":\"A <strong>Revaluation Account</strong> is normally prepared at the time of:\",\"sh\":\"<strong>पुनर्मूल्यांकन खाता (Revaluation Account)</strong> सामान्यतः कब तैयार किया जाता है:\",\"oe\":[\"Dissolution of the entire firm\",\"Routine purchase of fixed assets\",\"Routine closing of annual books\",\"Admission, retirement, or death of a partner\"],\"oh\":[\"पूरी फर्म के विघटन के समय\",\"स्थायी संपत्तियों की नियमित खरीद पर\",\"वार्षिक पुस्तकों के नियमित बंद होने पर\",\"किसी साझेदार के प्रवेश, सेवानिवृत्ति या मृत्यु के समय\"],\"a\":3,\"ee\":\"To adjust asset/liability values before reconstitution.\",\"eh\":\"पुनर्गठन से पहले संपत्ति/दायित्व मूल्यों को समायोजित करने के लिए।\"},{\"n\":34,\"d\":\"\",\"se\":\"The net profit arising on the revaluation of assets is transferred to the:\",\"sh\":\"संपत्तियों के पुनर्मूल्यांकन पर उत्पन्न होने वाले शुद्ध लाभ को स्थानांतरित किया जाता है:\",\"oe\":[\"Partners&rsquo; capital accounts in their old profit-sharing ratio\",\"Revaluation account (credit side)\",\"General reserve\",\"Profit &amp; Loss account\"],\"oh\":[\"साझेदारों के पूंजी खातों में उनके पुराने लाभ-विभाजन अनुपात में\",\"पुनर्मूल्यांकन खाते (क्रेडिट पक्ष) में\",\"सामान्य संचय में\",\"लाभ और हानि खाते में\"],\"a\":0,\"ee\":\"Old partners in old ratio.\",\"eh\":\"पुराने अनुपात में पुराने साझेदारों को।\"},{\"n\":35,\"d\":\"\",\"se\":\"At the time of the dissolution of a partnership, a <strong>Realisation Account</strong> is prepared specifically to:\",\"sh\":\"साझेदारी के विघटन (Dissolution) के समय, एक <strong>वसूली खाता (Realisation Account)</strong> विशेष रूप से क्यों तैयार किया जाता है:\",\"oe\":[\"Calculate annual depreciation\",\"Record the sale/realisation of assets and the settlement of outside liabilities\",\"Distribute normal trading profit\",\"Record the creation of goodwill\"],\"oh\":[\"वार्षिक मूल्यह्रास की गणना करने के लिए\",\"संपत्तियों की बिक्री/वसूली और बाहरी देनदारियों के निपटान को दर्ज करने के लिए\",\"सामान्य व्यापार लाभ वितरित करने के लिए\",\"ख्याति के निर्माण को दर्ज करने के लिए\"],\"a\":1,\"ee\":\"To close the books and determine final dissolution profit/loss.\",\"eh\":\"पुस्तकों को बंद करने और अंतिम विघटन लाभ/हानि निर्धारित करने के लिए।\"},{\"n\":36,\"d\":\"\",\"se\":\"The final loss on the realisation of assets during dissolution is transferred to the:\",\"sh\":\"विघटन के दौरान संपत्तियों की वसूली पर अंतिम हानि (loss) को स्थानांतरित किया जाता है:\",\"oe\":[\"Bank account\",\"Realisation account\",\"Partners&rsquo; capital accounts in their profit-sharing ratio (debited)\",\"Profit &amp; Loss account\"],\"oh\":[\"बैंक खाते में\",\"वसूली खाते में\",\"साझेदारों के पूंजी खातों में उनके लाभ-विभाजन अनुपात में (डेबिटेड)\",\"लाभ और हानि खाते में\"],\"a\":2,\"ee\":\"It reduces partners' capital, hence debited in their profit-sharing ratio.\",\"eh\":\"यह साझेदारों की पूंजी को कम करता है, इसलिए उनके लाभ-विभाजन अनुपात में डेबिट किया जाता है।\"},{\"n\":37,\"d\":\"\",\"se\":\"Under the Companies Act, 2013, the minimum number of members required to form a <strong>Private Limited Company</strong> is:\",\"sh\":\"कंपनी अधिनियम, 2013 के तहत, एक <strong>प्राइवेट लिमिटेड कंपनी</strong> बनाने के लिए आवश्यक सदस्यों की न्यूनतम संख्या है:\",\"oe\":[\"7\",\"1\",\"3\",\"2\"],\"oh\":[\"7\",\"1\",\"3\",\"2\"],\"a\":3,\"ee\":\"2 members.\",\"eh\":\"2 सदस्य।\"},{\"n\":38,\"d\":\"\",\"se\":\"The maximum number of members allowed in a <strong>Public Limited Company</strong> is:\",\"sh\":\"एक <strong>पब्लिक लिमिटेड कंपनी</strong> में अनुमत सदस्यों की अधिकतम संख्या है:\",\"oe\":[\"Unlimited\",\"200\",\"500\",\"50\"],\"oh\":[\"असीमित (Unlimited)\",\"200\",\"500\",\"50\"],\"a\":0,\"ee\":\"Unlimited.\",\"eh\":\"असीमित।\"},{\"n\":39,\"d\":\"\",\"se\":\"The <strong>Authorised Share Capital</strong> (Nominal Capital) of a company is:\",\"sh\":\"किसी कंपनी की <strong>अधिकृत शेयर पूंजी (Authorised Share Capital)</strong> क्या है:\",\"oe\":[\"The capital actually issued to the public\",\"The maximum amount of share capital a company is legally authorized to raise as per its Memorandum\",\"The capital paid up by shareholders\",\"The capital called up by directors\"],\"oh\":[\"वास्तव में जनता को जारी की गई पूंजी\",\"शेयर पूंजी की वह अधिकतम राशि जिसे कंपनी अपने मेमोरेंडम के अनुसार कानूनी रूप से जुटाने के लिए अधिकृत है\",\"शेयरधारकों द्वारा भुगतान की गई पूंजी\",\"निदेशकों द्वारा मांगी गई पूंजी\"],\"a\":1,\"ee\":\"The maximum registered limit.\",\"eh\":\"अधिकतम पंजीकृत सीमा।\"},{\"n\":40,\"d\":\"\",\"se\":\"<strong>Paid-up capital</strong> refers to:\",\"sh\":\"<strong>चुकता पूंजी (Paid-up capital)</strong> का तात्पर्य है:\",\"oe\":[\"The amount called up but not paid\",\"The total face value of all shares issued\",\"The amount actually received by the company from shareholders against the called-up capital\",\"The authorised capital\"],\"oh\":[\"मांगी गई लेकिन भुगतान न की गई राशि\",\"जारी किए गए सभी शेयरों का कुल अंकित मूल्य\",\"मांगी गई पूंजी के एवज में शेयरधारकों से कंपनी द्वारा वास्तव में प्राप्त की गई राशि\",\"अधिकृत पूंजी\"],\"a\":2,\"ee\":\"Actual amount paid by shareholders.\",\"eh\":\"शेयरधारकों द्वारा भुगतान की गई वास्तविक राशि।\"},{\"n\":41,\"d\":\"\",\"se\":\"When shares are issued at a price higher than their nominal/face value, they are said to be issued at a:\",\"sh\":\"जब शेयर उनके नाममात्र/अंकित मूल्य से अधिक कीमत पर जारी किए जाते हैं, तो उन्हें किस पर जारी किया गया कहा जाता है:\",\"oe\":[\"Discount\",\"Par\",\"Market price\",\"Premium\"],\"oh\":[\"छूट (Discount)\",\"सममूल्य (Par)\",\"बाजार मूल्य\",\"प्रीमियम (Premium)\"],\"a\":3,\"ee\":\"Premium.\",\"eh\":\"प्रीमियम।\"},{\"n\":42,\"d\":\"\",\"se\":\"The excess amount received as a <strong>premium on the issue of shares</strong> must be credited to a separate account called the:\",\"sh\":\"शेयरों के निर्गम पर <strong>प्रीमियम</strong> के रूप में प्राप्त अतिरिक्त राशि को एक अलग खाते में क्रेडिट किया जाना चाहिए जिसे कहा जाता है:\",\"oe\":[\"Securities Premium A/c\",\"Capital Reserve A/c\",\"General Reserve A/c\",\"Share Capital A/c\"],\"oh\":[\"प्रतिभूति प्रीमियम खाता (Securities Premium A/c)\",\"पूंजीगत संचय खाता\",\"सामान्य संचय खाता\",\"शेयर पूंजी खाता\"],\"a\":0,\"ee\":\"Securities Premium Account.\",\"eh\":\"प्रतिभूति प्रीमियम खाता।\"},{\"n\":43,\"d\":\"\",\"se\":\"When shares are forfeited due to non-payment of calls, the <strong>Share Capital Account</strong> is debited with the:\",\"sh\":\"जब किस्तों का भुगतान न करने के कारण शेयरों को जब्त कर लिया जाता है, तो <strong>शेयर पूंजी खाते</strong> को किस राशि से डेबिट किया जाता है:\",\"oe\":[\"Face value per share (assuming fully called up)\",\"Called-up amount per share\",\"Premium amount\",\"Paid-up amount per share\"],\"oh\":[\"प्रति शेयर अंकित मूल्य (यह मानते हुए कि पूरा मांगा गया है)\",\"प्रति शेयर मांगी गई राशि (Called-up amount)\",\"प्रीमियम राशि\",\"प्रति शेयर चुकता राशि\"],\"a\":1,\"ee\":\"The amount called up on the forfeited shares.\",\"eh\":\"जब्त किए गए शेयरों पर मांगी गई राशि।\"},{\"n\":44,\"d\":\"\",\"se\":\"Upon forfeiture, the <strong>Share Forfeiture Account</strong> is credited with the:\",\"sh\":\"जब्ती पर, <strong>शेयर जब्ती खाते (Share Forfeiture A/c)</strong> को क्रेडिट किया जाता है:\",\"oe\":[\"Face value of the shares\",\"Amount called up\",\"Amount actually paid/received from the defaulting shareholder\",\"Amount unpaid (arrears)\"],\"oh\":[\"शेयरों के अंकित मूल्य से\",\"मांगी गई राशि से\",\"डिफॉल्टर शेयरधारक से वास्तव में प्राप्त/भुगतान की गई राशि से\",\"अवैतनिक राशि (बकाया) से\"],\"a\":2,\"ee\":\"The money already paid is confiscated.\",\"eh\":\"जो पैसा पहले ही चुकाया जा चुका है उसे जब्त कर लिया जाता है।\"},{\"n\":45,\"d\":\"\",\"se\":\"On the re-issue of forfeited shares, the maximum permissible discount allowed cannot exceed:\",\"sh\":\"जब्त किए गए शेयरों को फिर से जारी (re-issue) करने पर, दी जाने वाली अधिकतम अनुमेय छूट (discount) इससे अधिक नहीं हो सकती:\",\"oe\":[\"The face value of the shares\",\"The called-up amount\",\"The securities premium\",\"The amount previously credited to the Share Forfeiture Account for those specific shares\"],\"oh\":[\"शेयरों का अंकित मूल्य\",\"मांगी गई राशि\",\"प्रतिभूति प्रीमियम\",\"उन विशिष्ट शेयरों के लिए शेयर जब्ती खाते में पहले से जमा की गई राशि\"],\"a\":3,\"ee\":\"Reissue discount is capped at the forfeited amount.\",\"eh\":\"पुन: जारी करने पर छूट जब्त की गई राशि तक सीमित होती है।\"},{\"n\":46,\"d\":\"\",\"se\":\"The credit balance left in the Share Forfeiture Account, after the re-issue of all those forfeited shares, is transferred to the:\",\"sh\":\"उन सभी जब्त किए गए शेयरों को फिर से जारी करने के बाद, शेयर जब्ती खाते में बचा क्रेडिट बैलेंस कहाँ स्थानांतरित किया जाता है:\",\"oe\":[\"Capital Reserve\",\"Profit &amp; Loss Account\",\"General Reserve\",\"Securities Premium\"],\"oh\":[\"पूंजीगत संचय (Capital Reserve)\",\"लाभ और हानि खाता\",\"सामान्य संचय\",\"प्रतिभूति प्रीमियम\"],\"a\":0,\"ee\":\"Capital Reserve.\",\"eh\":\"पूंजीगत संचय।\"},{\"n\":47,\"d\":\"\",\"se\":\"<strong>Debentures</strong> represent:\",\"sh\":\"<strong>डिबेंचर (Debentures)</strong> किसका प्रतिनिधित्व करते हैं:\",\"oe\":[\"Ownership securities of the company\",\"Long-term debt/borrowing instruments of the company\",\"Short-term equity instruments\",\"Current liabilities\"],\"oh\":[\"कंपनी की स्वामित्व प्रतिभूतियों का\",\"कंपनी के दीर्घकालिक ऋण/उधार उपकरणों का\",\"अल्पकालिक इक्विटी उपकरणों का\",\"चालू दायित्वों का\"],\"a\":1,\"ee\":\"Long-term debt.\",\"eh\":\"दीर्घकालिक ऋण।\"},{\"n\":48,\"d\":\"\",\"se\":\"Debentures issued at a discount are presented in the balance sheet at their:\",\"sh\":\"छूट (discount) पर जारी किए गए डिबेंचर को बैलेंस शीट में किस मूल्य पर प्रस्तुत किया जाता है:\",\"oe\":[\"Face value exactly\",\"Market value\",\"Net book value (Face value minus unamortized discount)\",\"Premium value\"],\"oh\":[\"ठीक अंकित मूल्य पर\",\"बाजार मूल्य पर\",\"शुद्ध पुस्तक मूल्य (अंकित मूल्य माइनस असमायोजित छूट) पर\",\"प्रीमियम मूल्य पर\"],\"a\":2,\"ee\":\"Stated at net carrying amount.\",\"eh\":\"शुद्ध वहन राशि (net carrying amount) पर दर्शाया जाता है।\"},{\"n\":49,\"d\":\"\",\"se\":\"The <strong>discount on the issue of debentures</strong> is a capital loss and is typically written off over:\",\"sh\":\"<strong>डिबेंचर जारी करने पर छूट</strong> एक पूंजीगत हानि है और इसे आम तौर पर कितने समय में अपलिखित (written off) किया जाता है:\",\"oe\":[\"1 year strictly\",\"3 years\",\"10 years fixed\",\"The tenure/life of the debentures\"],\"oh\":[\"सख्ती से 1 वर्ष में\",\"3 वर्षों में\",\"निश्चित 10 वर्षों में\",\"डिबेंचर के कार्यकाल/जीवनकाल में (Over the life of debentures)\"],\"a\":3,\"ee\":\"Over the life of the debentures.\",\"eh\":\"डिबेंचर के जीवनकाल में।\"},{\"n\":50,\"d\":\"\",\"se\":\"The <strong>interest paid on debentures</strong> by a company is treated as:\",\"sh\":\"कंपनी द्वारा <strong>डिबेंचर पर भुगतान किए गए ब्याज</strong> को माना जाता है:\",\"oe\":[\"A charge against profit (an expense)\",\"An appropriation of profit\",\"A dividend payout\",\"A capital expenditure\"],\"oh\":[\"लाभ के विरुद्ध प्रभार (एक व्यय / Charge against profit)\",\"लाभ का विनियोग (Appropriation)\",\"एक लाभांश भुगतान\",\"एक पूंजीगत व्यय\"],\"a\":0,\"ee\":\"It must be paid regardless of whether the company makes a profit or loss.\",\"eh\":\"इसका भुगतान किया जाना चाहिए चाहे कंपनी लाभ कमाए या हानि।\"},{\"n\":51,\"d\":\"\",\"se\":\"In India, <strong>Bills of Exchange</strong> are legally defined and governed by the:\",\"sh\":\"भारत में, <strong>विनिमय विपत्र (Bills of Exchange)</strong> को कानूनी रूप से किसके द्वारा परिभाषित और नियंत्रित किया जाता है:\",\"oe\":[\"Sale of Goods Act, 1930\",\"Negotiable Instruments Act, 1881\",\"Indian Contract Act, 1872\",\"Companies Act, 2013\"],\"oh\":[\"माल बिक्री अधिनियम, 1930\",\"परक्राम्य लिखत अधिनियम, 1881 (Negotiable Instruments Act)\",\"भारतीय अनुबंध अधिनियम, 1872\",\"कंपनी अधिनियम, 2013\"],\"a\":1,\"ee\":\"Negotiable Instruments Act.\",\"eh\":\"नेगोशिएबल इंस्ट्रूमेंट्स एक्ट।\"},{\"n\":52,\"d\":\"\",\"se\":\"For a bill of exchange to become a legally binding document on the debtor, it must be accepted by the:\",\"sh\":\"विनिमय विपत्र को देनदार पर कानूनी रूप से बाध्यकारी दस्तावेज बनने के लिए, इसे किसके द्वारा स्वीकार (accept) किया जाना चाहिए:\",\"oe\":[\"Endorser\",\"Drawer (Creditor)\",\"Drawee (Debtor)\",\"Payee\"],\"oh\":[\"पृष्ठांकक (Endorser)\",\"आहर्ता (Drawer / लेनदार)\",\"आदाता (Drawee / देनदार)\",\"प्राप्तकर्ता (Payee)\"],\"a\":2,\"ee\":\"The drawee must sign their acceptance.\",\"eh\":\"ड्रावी (देनदार) को अपनी स्वीकृति पर हस्ताक्षर करना होगा।\"},{\"n\":53,\"d\":\"\",\"se\":\"A bill of exchange is drawn on 15th January for a term of 2 months. The legal due date (including 3 days of grace) is:\",\"sh\":\"15 जनवरी को 2 महीने की अवधि के लिए एक विनिमय विपत्र लिखा गया। कानूनी देय तिथि (अनुग्रह के 3 दिन सहित) है:\",\"oe\":[\"20th March\",\"15th March\",\"16th March\",\"18th March\"],\"oh\":[\"20 मार्च\",\"15 मार्च\",\"16 मार्च\",\"18 मार्च\"],\"a\":3,\"ee\":\"15th Jan + 2 months = 15th March. Adding 3 grace days = 18th March.\",\"eh\":\"15 जनवरी + 2 महीने = 15 मार्च। 3 अनुग्रह के दिन जोड़ने पर = 18 मार्च।\"},{\"n\":54,\"d\":\"\",\"se\":\"When a holder discounts a bill with the bank before maturity, the discounting charge deducted by the bank is treated by the holder as a:\",\"sh\":\"जब कोई धारक परिपक्वता (maturity) से पहले बैंक से बिल भुनाता (discount) है, तो बैंक द्वारा काटी गई छूट का प्रभार धारक द्वारा क्या माना जाता है:\",\"oe\":[\"Financial expense / Revenue charge against profit\",\"Gain\",\"Capital loss\",\"Capital expenditure\"],\"oh\":[\"वित्तीय व्यय / लाभ के विरुद्ध राजस्व प्रभार (Financial expense)\",\"लाभ\",\"पूंजीगत हानि\",\"पूंजीगत व्यय\"],\"a\":0,\"ee\":\"It is a financing expense charged to the P&amp;L account.\",\"eh\":\"यह P&amp;L खाते में प्रभारित एक वित्तपोषण व्यय है।\"},{\"n\":55,\"d\":\"\",\"se\":\"A <strong>Consignment</strong> arrangement is fundamentally a:\",\"sh\":\"एक <strong>कंसाइनमेंट (Consignment)</strong> व्यवस्था मौलिक रूप से क्या है:\",\"oe\":[\"Charitable donation\",\"Transfer of possession of goods where ownership/risk is retained by the consignor\",\"Direct cash sale\",\"Credit purchase\"],\"oh\":[\"धर्मार्थ दान\",\"माल के कब्जे का हस्तांतरण जहां स्वामित्व/जोखिम प्रेषक (consignor) के पास रहता है\",\"प्रत्यक्ष नकद बिक्री\",\"उधार खरीद\"],\"a\":1,\"ee\":\"The consignor retains ownership until the goods are sold by the consignee.\",\"eh\":\"प्रेषक तब तक स्वामित्व रखता है जब तक कि माल प्राप्तकर्ता (consignee) द्वारा बेचा नहीं जाता।\"},{\"n\":56,\"d\":\"\",\"se\":\"In a consignment, the <strong>consignee</strong> acts as the:\",\"sh\":\"कंसाइनमेंट में, <strong>प्राप्तकर्ता (consignee)</strong> किस रूप में कार्य करता है:\",\"oe\":[\"Manufacturer\",\"Legal owner of the goods\",\"Agent who sells the goods on behalf of the principal\",\"Ultimate consumer\"],\"oh\":[\"निर्माता\",\"माल का कानूनी मालिक\",\"एजेंट जो प्रिंसिपल (consignor) की ओर से माल बेचता है\",\"अंतिम उपभोक्ता\"],\"a\":2,\"ee\":\"Agent.\",\"eh\":\"एजेंट।\"},{\"n\":57,\"d\":\"\",\"se\":\"An extra commission given to the consignee by the consignor for taking the risk of bad debts (guaranteeing payment) is called:\",\"sh\":\"डूबत ऋणों (bad debts) का जोखिम उठाने (भुगतान की गारंटी देने) के लिए प्रेषक द्वारा प्राप्तकर्ता को दिया गया अतिरिक्त कमीशन कहलाता है:\",\"oe\":[\"Brokerage\",\"Ordinary commission\",\"Over-riding commission\",\"Del-credere commission\"],\"oh\":[\"ब्रोकरेज\",\"साधारण कमीशन\",\"ओवर-राइडिंग कमीशन\",\"डेल-क्रेडर कमीशन (Del-credere commission)\"],\"a\":3,\"ee\":\"Del-credere commission.\",\"eh\":\"डेल-क्रेडर कमीशन।\"},{\"n\":58,\"d\":\"\",\"se\":\"In consignment accounting, the unsold closing stock lying with the consignee is valued at:\",\"sh\":\"कंसाइनमेंट लेखांकन में, प्राप्तकर्ता के पास पड़े बिना बिके अंतिम स्टॉक (closing stock) का मूल्यांकन किस पर किया जाता है:\",\"oe\":[\"Cost price plus proportionate non-recurring expenses incurred till the goods reach the consignee's godown\",\"Invoice price irrespective of cost\",\"Retail market value\",\"Pure cost price only\"],\"oh\":[\"लागत मूल्य प्लस माल को प्राप्तकर्ता के गोदाम तक पहुंचने तक किए गए आनुपातिक गैर-आवर्ती व्यय (non-recurring expenses)\",\"लागत पर ध्यान दिए बिना चालान मूल्य\",\"खुदरा बाजार मूल्य\",\"केवल शुद्ध लागत मूल्य\"],\"a\":0,\"ee\":\"Cost plus proportionate non-recurring expenses.\",\"eh\":\"लागत प्लस आनुपातिक गैर-आवर्ती व्यय।\"},{\"n\":59,\"d\":\"\",\"se\":\"A <strong>Joint Venture</strong> in accounting terms is usually a:\",\"sh\":\"लेखांकन के संदर्भ में एक <strong>संयुक्त उद्यम (Joint Venture)</strong> आमतौर पर क्या होता है:\",\"oe\":[\"Permanent partnership firm\",\"Temporary partnership formed for a specific project or limited period\",\"Registered Joint Stock Company\",\"Sole proprietorship\"],\"oh\":[\"स्थायी साझेदारी फर्म\",\"एक विशिष्ट परियोजना या सीमित अवधि के लिए गठित अस्थायी साझेदारी\",\"पंजीकृत संयुक्त स्टॉक कंपनी\",\"एकल स्वामित्व\"],\"a\":1,\"ee\":\"Temporary partnership for a specific venture.\",\"eh\":\"एक विशिष्ट उद्यम के लिए अस्थायी साझेदारी।\"},{\"n\":60,\"d\":\"\",\"se\":\"Upon the successful completion of a joint venture, the venture's accounts are settled by:\",\"sh\":\"एक संयुक्त उद्यम के सफलतापूर्वक पूरा होने पर, उद्यम के खातों का निपटान कैसे किया जाता है:\",\"oe\":[\"Keeping the books open indefinitely\",\"Converting it into a permanent company\",\"The co-venturers distributing the final profit or loss as agreed and closing the books\",\"Transferring everything to a general P&amp;L\"],\"oh\":[\"पुस्तकों को अनिश्चित काल तक खुला रखकर\",\"इसे एक स्थायी कंपनी में परिवर्तित करके\",\"सह-उद्यमी (co-venturers) सहमत अनुसार अंतिम लाभ या हानि वितरित करते हैं और पुस्तकों को बंद कर देते हैं\",\"सब कुछ सामान्य P&amp;L में स्थानांतरित करके\"],\"a\":2,\"ee\":\"Profit/loss is shared and accounts are settled.\",\"eh\":\"लाभ/हानि साझा किया जाता है और खातों का निपटान किया जाता है।\"},{\"n\":61,\"d\":\"\",\"se\":\"Under Branch Accounting (Debtors System), when goods are sent to the branch at cost, the Branch Stock Account (or Goods Sent to Branch A/c) is maintained at:\",\"sh\":\"शाखा लेखांकन (Branch Accounting - Debtors System) के तहत, जब शाखा को लागत मूल्य (cost) पर माल भेजा जाता है, तो शाखा स्टॉक खाता (या माल शाखा को भेजा गया खाता) किस पर बनाए रखा जाता है:\",\"oe\":[\"Invoice price (Cost + Markup)\",\"Retail selling price\",\"Market price\",\"Cost price\"],\"oh\":[\"चालान मूल्य (लागत + मार्कअप)\",\"खुदरा विक्रय मूल्य\",\"बाजार मूल्य\",\"लागत मूल्य (Cost price)\"],\"a\":3,\"ee\":\"Maintained at cost.\",\"eh\":\"लागत पर बनाए रखा जाता है।\"},{\"n\":62,\"d\":\"\",\"se\":\"Under the Debtors System of branch accounting, the net profit or loss of the branch is revealed by the:\",\"sh\":\"शाखा लेखांकन की देनदार प्रणाली (Debtors System) के तहत, शाखा का शुद्ध लाभ या हानि किसके द्वारा प्रकट किया जाता है:\",\"oe\":[\"Branch Account (prepared in HO books)\",\"Branch Trading Account\",\"Branch Profit and Loss Account\",\"Goods sent to branch account\"],\"oh\":[\"शाखा खाता (HO की पुस्तकों में तैयार किया गया Branch Account)\",\"शाखा व्यापार खाता\",\"शाखा लाभ और हानि खाता\",\"शाखा को भेजा गया माल खाता\"],\"a\":0,\"ee\":\"The consolidated Branch Account reveals the profit.\",\"eh\":\"समेकित शाखा खाता (Branch Account) लाभ प्रकट करता है।\"},{\"n\":63,\"d\":\"\",\"se\":\"In <strong>Departmental Accounting</strong>, inter-departmental transfers of goods are typically recorded at:\",\"sh\":\"<strong>विभागीय लेखांकन (Departmental Accounting)</strong> में, माल के अंतर-विभागीय हस्तांतरण को आमतौर पर किस पर दर्ज किया जाता है:\",\"oe\":[\"Zero value\",\"Cost price (or an agreed transfer pricing mechanism)\",\"Maximum retail price\",\"Discounted market price\"],\"oh\":[\"शून्य मूल्य\",\"लागत मूल्य (या एक सहमत हस्तांतरण मूल्य निर्धारण तंत्र)\",\"अधिकतम खुदरा मूल्य\",\"रियायती बाजार मूल्य\"],\"a\":1,\"ee\":\"Usually at cost or normal selling price (with unrealized profit eliminated later).\",\"eh\":\"आमतौर पर लागत या सामान्य विक्रय मूल्य पर (बाद में अवास्तविक लाभ को समाप्त करके)।\"},{\"n\":64,\"d\":\"\",\"se\":\"A <strong>Hire Purchase</strong> agreement is fundamentally a contract where:\",\"sh\":\"एक <strong>हायर परचेज (Hire Purchase)</strong> समझौता मौलिक रूप से एक अनुबंध है जहाँ:\",\"oe\":[\"It is a simple rental lease with no option to buy\",\"It is an immediate absolute sale\",\"Goods are delivered with the option to purchase, but ownership passes only after the final instalment is paid\",\"Goods are gifted\"],\"oh\":[\"यह एक साधारण रेंटल लीज है जिसमें खरीदने का कोई विकल्प नहीं है\",\"यह तत्काल पूर्ण बिक्री है\",\"माल खरीदने के विकल्प के साथ दिया जाता है, लेकिन स्वामित्व केवल अंतिम किस्त के भुगतान के बाद ही स्थानांतरित होता है\",\"माल उपहार में दिया जाता है\"],\"a\":2,\"ee\":\"Ownership transfers upon payment of the last installment.\",\"eh\":\"अंतिम किस्त के भुगतान पर स्वामित्व स्थानांतरित होता है।\"},{\"n\":65,\"d\":\"\",\"se\":\"Under a hire purchase agreement, the party buying the goods is legally referred to as the:\",\"sh\":\"हायर परचेज समझौते के तहत, माल खरीदने वाले पक्ष को कानूनी रूप से क्या कहा जाता है:\",\"oe\":[\"Bailor\",\"Vendor\",\"Lessor\",\"Hirer (Hire Purchaser)\"],\"oh\":[\"बेलर (Bailor)\",\"विक्रेता (Vendor)\",\"पट्टेदार (Lessor)\",\"हायरर (Hirer / Hire Purchaser)\"],\"a\":3,\"ee\":\"Hirer.\",\"eh\":\"हायरर।\"},{\"n\":66,\"d\":\"\",\"se\":\"The interest portion included in each hire purchase instalment is calculated based on the:\",\"sh\":\"प्रत्येक हायर परचेज किस्त में शामिल ब्याज हिस्से की गणना किसके आधार पर की जाती है:\",\"oe\":[\"Outstanding cash price principal at the beginning of that period\",\"Initial down payment\",\"Total original cash price\",\"Total hire purchase price\"],\"oh\":[\"उस अवधि की शुरुआत में बकाया नकद मूल्य (Outstanding cash price) मूलधन पर\",\"प्रारंभिक डाउन पेमेंट पर\",\"कुल मूल नकद मूल्य पर\",\"कुल हायर परचेज मूल्य पर\"],\"a\":0,\"ee\":\"Calculated on the outstanding principal balance.\",\"eh\":\"बकाया मूलधन शेष पर गणना की जाती है।\"},{\"n\":67,\"d\":\"\",\"se\":\"The preparation of a <strong>Cash Flow Statement</strong> for corporate entities in India is governed by:\",\"sh\":\"भारत में कॉर्पोरेट संस्थाओं के लिए <strong>नकद प्रवाह विवरण (Cash Flow Statement)</strong> तैयार करना किसके द्वारा नियंत्रित होता है:\",\"oe\":[\"AS‑4\",\"AS‑3\",\"AS‑1\",\"AS‑2\"],\"oh\":[\"AS-4\",\"AS-3\",\"AS-1\",\"AS-2\"],\"a\":1,\"ee\":\"Accounting Standard 3 (AS-3).\",\"eh\":\"लेखांकन मानक 3 (AS-3)।\"},{\"n\":68,\"d\":\"\",\"se\":\"In a Cash Flow Statement, which of the following is an <strong>Operating Activity</strong>?\",\"sh\":\"नकद प्रवाह विवरण में, निम्नलिखित में से कौन सी एक <strong>परिचालन गतिविधि (Operating Activity)</strong> है?\",\"oe\":[\"Issue of equity shares\",\"Purchase of fixed assets\",\"Cash receipts from customers (sales)\",\"Payment of dividends to shareholders\"],\"oh\":[\"इक्विटी शेयरों का निर्गम\",\"स्थायी संपत्तियों की खरीद\",\"ग्राहकों से नकद प्राप्तियां (बिक्री)\",\"शेयरधारकों को लाभांश का भुगतान\"],\"a\":2,\"ee\":\"Routine business operations.\",\"eh\":\"नियमित व्यावसायिक संचालन।\"},{\"n\":69,\"d\":\"\",\"se\":\"Which of the following is classified as an <strong>Investing Activity</strong> in a Cash Flow Statement?\",\"sh\":\"नकद प्रवाह विवरण में निम्नलिखित में से किसे <strong>निवेश गतिविधि (Investing Activity)</strong> के रूप में वर्गीकृत किया गया है?\",\"oe\":[\"Payment of income tax\",\"Cash received from trade debtors\",\"Issue of debentures\",\"Sale of old machinery\"],\"oh\":[\"आयकर का भुगतान\",\"व्यापार देनदारों से प्राप्त नकद\",\"डिबेंचर का निर्गम\",\"पुरानी मशीनरी की बिक्री\"],\"a\":3,\"ee\":\"Buying and selling of long-term assets.\",\"eh\":\"दीर्घकालिक संपत्तियों की खरीद-बिक्री।\"},{\"n\":70,\"d\":\"\",\"se\":\"Which of the following is classified as a <strong>Financing Activity</strong> in a Cash Flow Statement?\",\"sh\":\"नकद प्रवाह विवरण में निम्नलिखित में से किसे <strong>वित्तपोषण गतिविधि (Financing Activity)</strong> के रूप में वर्गीकृत किया गया है?\",\"oe\":[\"Payment of dividends to shareholders\",\"Purchase of long-term investments\",\"Increase in trade creditors\",\"Charging depreciation on assets\"],\"oh\":[\"शेयरधारकों को लाभांश का भुगतान\",\"दीर्घकालिक निवेश की खरीद\",\"व्यापार लेनदारों में वृद्धि\",\"संपत्तियों पर मूल्यह्रास प्रभारित करना\"],\"a\":0,\"ee\":\"Servicing of equity/debt capital.\",\"eh\":\"इक्विटी/ऋण पूंजी की सर्विसिंग।\"},{\"n\":71,\"d\":\"\",\"se\":\"The formula for calculating the <strong>Current Ratio</strong> is:\",\"sh\":\"<strong>चालू अनुपात (Current Ratio)</strong> की गणना करने का सूत्र है:\",\"oe\":[\"Current Liabilities / Current Assets\",\"Current Assets / Current Liabilities\",\"Total Assets / Total Liabilities\",\"Quick Assets / Current Liabilities\"],\"oh\":[\"चालू दायित्व / चालू संपत्तियां\",\"चालू संपत्तियां / चालू दायित्व (Current Assets / Current Liabilities)\",\"कुल संपत्तियां / कुल दायित्व\",\"त्वरित संपत्तियां / चालू दायित्व\"],\"a\":1,\"ee\":\"Current Assets divided by Current Liabilities.\",\"eh\":\"चालू संपत्तियों को चालू दायित्वों से विभाजित किया जाता है।\"},{\"n\":72,\"d\":\"\",\"se\":\"The <strong>Quick Ratio</strong> is widely known by the alternative name:\",\"sh\":\"<strong>त्वरित अनुपात (Quick Ratio)</strong> को व्यापक रूप से किस वैकल्पिक नाम से जाना जाता है:\",\"oe\":[\"Inventory Turnover Ratio\",\"Debt-Equity Ratio\",\"Acid-Test Ratio\",\"Gross Profit Ratio\"],\"oh\":[\"इन्वेंट्री टर्नओवर अनुपात\",\"ऋण-इक्विटी अनुपात\",\"एसिड-टेस्ट अनुपात (Acid-Test Ratio)\",\"सकल लाभ अनुपात\"],\"a\":2,\"ee\":\"Acid-Test Ratio.\",\"eh\":\"एसिड-टेस्ट अनुपात।\"},{\"n\":73,\"d\":\"\",\"se\":\"The <strong>Gross Profit Ratio</strong> is calculated mathematically as:\",\"sh\":\"<strong>सकल लाभ अनुपात (Gross Profit Ratio)</strong> की गणना गणितीय रूप से कैसे की जाती है:\",\"oe\":[\"(Gross Profit / Cost of Goods Sold) × 100\",\"(Net Profit / Net Sales) × 100\",\"(Net Profit / Total Assets) × 100\",\"(Gross Profit / Net Sales) × 100\"],\"oh\":[\"(सकल लाभ / बेचे गए माल की लागत) × 100\",\"(शुद्ध लाभ / शुद्ध बिक्री) × 100\",\"(शुद्ध लाभ / कुल संपत्ति) × 100\",\"(सकल लाभ / शुद्ध बिक्री) × 100\"],\"a\":3,\"ee\":\"Gross profit expressed as a percentage of Net Sales.\",\"eh\":\"शुद्ध बिक्री के प्रतिशत के रूप में व्यक्त सकल लाभ।\"},{\"n\":74,\"d\":\"\",\"se\":\"The <strong>Debt-Equity Ratio</strong> is a primary indicator of a firm's:\",\"sh\":\"<strong>ऋण-इक्विटी अनुपात (Debt-Equity Ratio)</strong> किसी फर्म के किस पहलू का प्राथमिक संकेतक है:\",\"oe\":[\"Long-term solvency and leverage\",\"Short-term liquidity\",\"Direct profitability\",\"Operational activity\"],\"oh\":[\"दीर्घकालिक शोधन क्षमता (Long-term solvency) और लीवरेज\",\"अल्पकालिक तरलता (Short-term liquidity)\",\"प्रत्यक्ष लाभप्रदता\",\"परिचालन गतिविधि\"],\"a\":0,\"ee\":\"Long-term solvency.\",\"eh\":\"दीर्घकालिक शोधन क्षमता (Long-term solvency)।\"},{\"n\":75,\"d\":\"\",\"se\":\"The <strong>Inventory Turnover Ratio</strong> primarily measures the:\",\"sh\":\"<strong>इन्वेंट्री टर्नओवर अनुपात (Inventory Turnover Ratio)</strong> मुख्य रूप से क्या मापता है:\",\"oe\":[\"Gross profitability\",\"Efficiency and speed of inventory management (how fast inventory is sold)\",\"Debt repayment capacity\",\"Immediate cash liquidity\"],\"oh\":[\"सकल लाभप्रदता\",\"इन्वेंट्री प्रबंधन की दक्षता और गति (इन्वेंट्री कितनी तेजी से बेची जाती है)\",\"ऋण चुकौती क्षमता\",\"तत्काल नकद तरलता\"],\"a\":1,\"ee\":\"Efficiency of turning stock into sales.\",\"eh\":\"स्टॉक को बिक्री में बदलने की दक्षता।\"},{\"n\":76,\"d\":\"\",\"se\":\"In financial analysis, <strong>Working Capital</strong> (Net Working Capital) is defined as:\",\"sh\":\"वित्तीय विश्लेषण में, <strong>कार्यशील पूंजी (Working Capital)</strong> को किस रूप में परिभाषित किया गया है:\",\"oe\":[\"Total Assets – Total Liabilities\",\"Share Capital + Reserves\",\"Current Assets – Current Liabilities\",\"Fixed Assets – Current Liabilities\"],\"oh\":[\"कुल संपत्तियां - कुल दायित्व\",\"शेयर पूंजी + संचय\",\"चालू संपत्तियां - चालू दायित्व (Current Assets – Current Liabilities)\",\"स्थायी संपत्तियां - चालू दायित्व\"],\"a\":2,\"ee\":\"Current Assets minus Current Liabilities.\",\"eh\":\"चालू संपत्तियां माइनस चालू दायित्व।\"},{\"n\":77,\"d\":\"\",\"se\":\"A generally accepted &quot;ideal&quot; or standard <strong>Current Ratio</strong> for a manufacturing firm is:\",\"sh\":\"एक विनिर्माण फर्म के लिए आम तौर पर स्वीकृत &quot;आदर्श&quot; या मानक <strong>चालू अनुपात</strong> है:\",\"oe\":[\"1:1\",\"3:1\",\"0.5:1\",\"2:1\"],\"oh\":[\"1:1\",\"3:1\",\"0.5:1\",\"2:1\"],\"a\":3,\"ee\":\"2:1.\",\"eh\":\"2:1।\"},{\"n\":78,\"d\":\"\",\"se\":\"The <strong>Statement of Profit and Loss</strong> is also universally known as the:\",\"sh\":\"<strong>लाभ और हानि का विवरण (Statement of Profit and Loss)</strong> विश्व स्तर पर किस नाम से भी जाना जाता है:\",\"oe\":[\"Income Statement\",\"Cash Flow Statement\",\"Statement of Retained Earnings\",\"Balance Sheet\"],\"oh\":[\"आय विवरण (Income Statement)\",\"नकद प्रवाह विवरण\",\"प्रतिधारित आय का विवरण\",\"बैलेंस शीट\"],\"a\":0,\"ee\":\"Income Statement.\",\"eh\":\"आय विवरण (Income Statement)।\"},{\"n\":79,\"d\":\"\",\"se\":\"<strong>Earnings Per Share (EPS)</strong> is calculated by the formula:\",\"sh\":\"<strong>प्रति शेयर आय (Earnings Per Share - EPS)</strong> की गणना किस सूत्र से की जाती है:\",\"oe\":[\"Gross Profit / Number of Equity Shares\",\"Net Profit available to Equity Shareholders / Number of Equity Shares\",\"Total Dividend / Paid-up Capital\",\"Net Sales / Number of Equity Shares\"],\"oh\":[\"सकल लाभ / इक्विटी शेयरों की संख्या\",\"इक्विटी शेयरधारकों के लिए उपलब्ध शुद्ध लाभ / इक्विटी शेयरों की संख्या\",\"कुल लाभांश / चुकता पूंजी\",\"शुद्ध बिक्री / इक्विटी शेयरों की संख्या\"],\"a\":1,\"ee\":\"Net profit after tax and preference dividends divided by outstanding equity shares.\",\"eh\":\"कर और पूर्वाधिकार लाभांश के बाद का शुद्ध लाभ बकाया इक्विटी शेयरों से विभाजित किया जाता है।\"},{\"n\":80,\"d\":\"\",\"se\":\"<strong>Dividend Per Share (DPS)</strong> is calculated as:\",\"sh\":\"<strong>प्रति शेयर लाभांश (Dividend Per Share - DPS)</strong> की गणना कैसे की जाती है:\",\"oe\":[\"Net Profit / Number of Equity Shares\",\"Total Reserves / Number of Equity Shares\",\"Total Dividend distributed to Equity Shareholders / Number of Equity Shares\",\"Gross Profit / Number of Equity Shares\"],\"oh\":[\"शुद्ध लाभ / इक्विटी शेयरों की संख्या\",\"कुल संचय / इक्विटी शेयरों की संख्या\",\"इक्विटी शेयरधारकों को वितरित कुल लाभांश / इक्विटी शेयरों की संख्या\",\"सकल लाभ / इक्विटी शेयरों की संख्या\"],\"a\":2,\"ee\":\"Dividend paid per individual share.\",\"eh\":\"प्रति व्यक्तिगत शेयर भुगतान किया गया लाभांश।\"},{\"n\":81,\"d\":\"\",\"se\":\"In accounting, <strong>Reserves</strong> are best defined as:\",\"sh\":\"लेखांकन में, <strong>संचय (Reserves)</strong> को सबसे अच्छी तरह से कैसे परिभाषित किया गया है:\",\"oe\":[\"Direct expenses\",\"Outside liabilities\",\"Tangible assets\",\"Appropriations of surplus/profit set aside for future use\"],\"oh\":[\"प्रत्यक्ष व्यय\",\"बाहरी देनदारियां\",\"मूर्त संपत्तियां\",\"भविष्य के उपयोग के लिए अलग रखे गए अधिशेष/लाभ का विनियोग (Appropriations of surplus)\"],\"a\":3,\"ee\":\"Appropriation of profit.\",\"eh\":\"लाभ का विनियोग।\"},{\"n\":82,\"d\":\"\",\"se\":\"A <strong>Provision</strong> is specifically created in the books to account for a:\",\"sh\":\"पुस्तकों में एक <strong>प्रावधान (Provision)</strong> विशेष रूप से किसके लिए बनाया जाता है:\",\"oe\":[\"Known liability whose exact amount cannot be determined yet\",\"Completely unknown contingent liability\",\"Planned dividend distribution\",\"Future capital expansion plan\"],\"oh\":[\"एक ज्ञात दायित्व जिसकी सटीक राशि अभी तक निर्धारित नहीं की जा सकती है\",\"पूरी तरह से अज्ञात आकस्मिक दायित्व\",\"नियोजित लाभांश वितरण\",\"भविष्य की पूंजी विस्तार योजना\"],\"a\":0,\"ee\":\"Known liability, uncertain amount.\",\"eh\":\"ज्ञात दायित्व, अनिश्चित राशि।\"},{\"n\":83,\"d\":\"\",\"se\":\"<strong>Secret Reserves</strong> (hidden reserves) are characterized by being:\",\"sh\":\"<strong>गुप्त संचय (Secret Reserves)</strong> की विशेषता यह है कि वे:\",\"oe\":[\"Explicitly disclosed on the face of the balance sheet\",\"Not disclosed in the balance sheet, created by undervaluing assets or overvaluing liabilities\",\"Created mandatorily by tax laws\",\"Banned entirely for all types of entities\"],\"oh\":[\"बैलेंस शीट पर स्पष्ट रूप से प्रकट किए जाते हैं\",\"बैलेंस शीट में प्रकट नहीं किए जाते हैं, संपत्तियों का कम मूल्यांकन या देनदारियों का अधिक मूल्यांकन करके बनाए जाते हैं\",\"कर कानूनों द्वारा अनिवार्य रूप से बनाए जाते हैं\",\"सभी प्रकार की संस्थाओं के लिए पूरी तरह से प्रतिबंधित हैं\"],\"a\":1,\"ee\":\"Hidden from the balance sheet.\",\"eh\":\"बैलेंस शीट से छिपे हुए।\"},{\"n\":84,\"d\":\"\",\"se\":\"A <strong>Capital Redemption Reserve (CRR)</strong> must be created out of free reserves when a company:\",\"sh\":\"एक <strong>पूंजी शोधन संचय (Capital Redemption Reserve - CRR)</strong> मुफ्त संचय (free reserves) से तब बनाया जाना चाहिए जब कोई कंपनी:\",\"oe\":[\"Declares a special dividend\",\"Issues new equity shares\",\"Redeems preference shares or buys back equity shares out of free reserves\",\"Issues debentures\"],\"oh\":[\"विशेष लाभांश घोषित करती है\",\"नए इक्विटी शेयर जारी करती है\",\"पूर्वाधिकार शेयरों (preference shares) का शोधन करती है या मुक्त संचय से इक्विटी शेयरों की बाय-बैक (buy-back) करती है\",\"डिबेंचर जारी करती है\"],\"a\":2,\"ee\":\"To protect creditors during redemption/buyback.\",\"eh\":\"शोधन/बायबैक के दौरान लेनदारों की सुरक्षा के लिए।\"},{\"n\":85,\"d\":\"\",\"se\":\"The statutory conditions for the <strong>Buy-back of equity shares</strong> are laid down in which section of the Companies Act, 2013?\",\"sh\":\"<strong>इक्विटी शेयरों की बाय-बैक</strong> के लिए वैधानिक शर्तें कंपनी अधिनियम, 2013 की किस धारा में निर्धारित की गई हैं?\",\"oe\":[\"Section 180\",\"Section 100\",\"Section 70\",\"Section 68\"],\"oh\":[\"धारा 180\",\"धारा 100\",\"धारा 70\",\"धारा 68 (Section 68)\"],\"a\":3,\"ee\":\"Section 68.\",\"eh\":\"धारा 68।\"},{\"n\":86,\"d\":\"\",\"se\":\"The maximum statutory limit for a buy-back of equity shares in a single financial year is:\",\"sh\":\"एक वित्तीय वर्ष में इक्विटी शेयरों की बाय-बैक के लिए अधिकतम वैधानिक सीमा है:\",\"oe\":[\"25% of the aggregate of fully paid-up equity capital and free reserves\",\"10% of paid-up capital\",\"50% of paid-up capital\",\"100% of reserves\"],\"oh\":[\"पूरी तरह से चुकता इक्विटी पूंजी और मुक्त संचय (free reserves) के योग का 25%\",\"चुकता पूंजी का 10%\",\"चुकता पूंजी का 50%\",\"संचय का 100%\"],\"a\":0,\"ee\":\"25% of paid-up equity capital and free reserves.\",\"eh\":\"चुकता इक्विटी पूंजी और मुक्त संचय का 25%।\"},{\"n\":87,\"d\":\"\",\"se\":\"The basic trading formula to calculate the <strong>Cost of Goods Sold (COGS)</strong> is:\",\"sh\":\"<strong>बेचे गए माल की लागत (Cost of Goods Sold - COGS)</strong> की गणना करने का मूल व्यापारिक सूत्र है:\",\"oe\":[\"Opening Stock – Purchases – Closing Stock\",\"Opening Stock + Net Purchases + Direct Expenses – Closing Stock\",\"Net Purchases – Opening Stock – Closing Stock\",\"Opening Stock + Purchases + Closing Stock\"],\"oh\":[\"प्रारंभिक स्टॉक - खरीद - अंतिम स्टॉक\",\"प्रारंभिक स्टॉक + शुद्ध खरीद + प्रत्यक्ष व्यय - अंतिम स्टॉक\",\"शुद्ध खरीद - प्रारंभिक स्टॉक - अंतिम स्टॉक\",\"प्रारंभिक स्टॉक + खरीद + अंतिम स्टॉक\"],\"a\":1,\"ee\":\"(Opening Stock + Purchases + Direct Expenses) - Closing Stock.\",\"eh\":\"(Opening Stock + Purchases + Direct Expenses) - Closing Stock।\"},{\"n\":88,\"d\":\"\",\"se\":\"In marginal costing terminology, <strong>Marginal Cost</strong> is essentially equal to the:\",\"sh\":\"सीमांत लागत (Marginal costing) शब्दावली में, <strong>सीमांत लागत (Marginal Cost)</strong> अनिवार्य रूप से किसके बराबर है:\",\"oe\":[\"Sunk cost\",\"Fixed cost\",\"Total Variable cost\",\"Total administrative cost\"],\"oh\":[\"डूबत लागत (Sunk cost)\",\"स्थिर लागत (Fixed cost)\",\"कुल परिवर्तनीय लागत (Total Variable cost)\",\"कुल प्रशासनिक लागत\"],\"a\":2,\"ee\":\"The cost of producing one additional unit (Variable cost).\",\"eh\":\"एक अतिरिक्त इकाई के उत्पादन की लागत (परिवर्तनीय लागत)।\"},{\"n\":89,\"d\":\"\",\"se\":\"The <strong>Break-Even Point (BEP)</strong> is defined as the exact volume of sales where:\",\"sh\":\"<strong>ब्रेक-ईवन पॉइंट (Break-Even Point - BEP)</strong> को बिक्री की उस सटीक मात्रा के रूप में परिभाषित किया गया है जहाँ:\",\"oe\":[\"Total Revenue is less than Total Cost\",\"Total Revenue exceeds Total Cost\",\"Fixed Costs equal Variable Costs\",\"Total Revenue strictly equals Total Cost (No profit, no loss)\"],\"oh\":[\"कुल राजस्व कुल लागत से कम होता है\",\"कुल राजस्व कुल लागत से अधिक होता है\",\"स्थिर लागत परिवर्तनीय लागत के बराबर होती है\",\"कुल राजस्व कुल लागत के बिल्कुल बराबर होता है (कोई लाभ नहीं, कोई हानि नहीं)\"],\"a\":3,\"ee\":\"Zero profit point.\",\"eh\":\"शून्य लाभ बिंदु।\"},{\"n\":90,\"d\":\"\",\"se\":\"In cost-volume-profit analysis, the <strong>Margin of Safety</strong> represents:\",\"sh\":\"लागत-मात्रा-लाभ (CVP) विश्लेषण में, <strong>सुरक्षा का मार्जिन (Margin of Safety)</strong> दर्शाता है:\",\"oe\":[\"Actual Sales minus Break-even Sales\",\"Total Fixed Cost divided by Contribution Margin\",\"Break-even Sales minus Actual Sales\",\"Net Profit divided by Variable Cost\"],\"oh\":[\"वास्तविक बिक्री माइनस ब्रेक-ईवन बिक्री\",\"कुल स्थिर लागत को अंशदान मार्जिन (Contribution) से विभाजित किया गया\",\"ब्रेक-ईवन बिक्री माइनस वास्तविक बिक्री\",\"शुद्ध लाभ को परिवर्तनीय लागत से विभाजित किया गया\"],\"a\":0,\"ee\":\"Sales volume above the break-even point.\",\"eh\":\"ब्रेक-ईवन बिंदु से ऊपर बिक्री की मात्रा।\"},{\"n\":91,\"d\":\"\",\"se\":\"In management accounting, a <strong>Budget</strong> is best described as a:\",\"sh\":\"प्रबंधन लेखांकन में, <strong>बजट (Budget)</strong> को सबसे अच्छी तरह से वर्णित किया गया है:\",\"oe\":[\"Trial balance variant\",\"Quantitative and monetary plan prepared for a specific future period\",\"Historical record of past expenses\",\"Final audited financial statement\"],\"oh\":[\"तलपट का प्रकार\",\"एक विशिष्ट भविष्य की अवधि के लिए तैयार मात्रात्मक और मौद्रिक योजना\",\"पिछले खर्चों का ऐतिहासिक रिकॉर्ड\",\"अंतिम लेखापरीक्षित वित्तीय विवरण\"],\"a\":1,\"ee\":\"A financial blueprint for the future.\",\"eh\":\"भविष्य के लिए एक वित्तीय खाका (blueprint)।\"},{\"n\":92,\"d\":\"\",\"se\":\"The concept of <strong>Zero-Based Budgeting (ZBB)</strong> fundamentally requires that:\",\"sh\":\"<strong>शून्य-आधारित बजटिंग (Zero-Based Budgeting - ZBB)</strong> की अवधारणा के लिए मौलिक रूप से आवश्यक है कि:\",\"oe\":[\"No formal budgeting is done\",\"The previous year&rsquo;s budget is the unquestioned baseline\",\"Every single expense must be justified from scratch (zero base) for each new period\",\"Budgets only increase incrementally\"],\"oh\":[\"कोई औपचारिक बजटिंग नहीं की जाती है\",\"पिछले वर्ष का बजट निर्विवाद आधार रेखा है\",\"प्रत्येक नई अवधि के लिए हर एक खर्च को शून्य आधार (scratch) से उचित ठहराया जाना चाहिए\",\"बजट केवल क्रमिक रूप से बढ़ते हैं\"],\"a\":2,\"ee\":\"Starting from zero and justifying all allocations.\",\"eh\":\"शून्य से शुरू करना और सभी आवंटन को उचित ठहराना।\"},{\"n\":93,\"d\":\"\",\"se\":\"A <strong>Fund Flow Statement</strong> primarily illustrates the:\",\"sh\":\"एक <strong>फंड फ्लो स्टेटमेंट (Fund Flow Statement)</strong> मुख्य रूप से क्या दर्शाता है:\",\"oe\":[\"Physical movement of cash notes\",\"Movement of fixed assets only\",\"Fluctuation in equity share prices\",\"Sources and applications of Working Capital over a period\"],\"oh\":[\"नकद नोटों की भौतिक आवाजाही\",\"केवल स्थायी संपत्तियों की आवाजाही\",\"इक्विटी शेयर की कीमतों में उतार-चढ़ाव\",\"एक अवधि में कार्यशील पूंजी (Working Capital) के स्रोत और अनुप्रयोग\"],\"a\":3,\"ee\":\"Movement of working capital.\",\"eh\":\"कार्यशील पूंजी की आवाजाही।\"},{\"n\":94,\"d\":\"\",\"se\":\"The <strong>Schedule of Changes in Working Capital</strong> is an integral part of preparing a:\",\"sh\":\"<strong>कार्यशील पूंजी में परिवर्तन की अनुसूची (Schedule of Changes in Working Capital)</strong> किसकी तैयारी का एक अभिन्न अंग है:\",\"oe\":[\"Fund Flow Statement\",\"Common-size Balance Sheet\",\"Cash Flow Statement\",\"Trial Balance\"],\"oh\":[\"फंड फ्लो स्टेटमेंट (Fund Flow Statement)\",\"सामान्य-आकार की बैलेंस शीट\",\"नकद प्रवाह विवरण\",\"तलपट\"],\"a\":0,\"ee\":\"Fund Flow Statement.\",\"eh\":\"फंड फ्लो स्टेटमेंट।\"},{\"n\":95,\"d\":\"\",\"se\":\"<strong>Responsibility Accounting</strong> is a system that divides an organization into logical sub-units called:\",\"sh\":\"<strong>उत्तरदायित्व लेखांकन (Responsibility Accounting)</strong> एक ऐसी प्रणाली है जो किसी संगठन को तार्किक उप-इकाइयों में विभाजित करती है जिन्हें कहा जाता है:\",\"oe\":[\"Only external branches\",\"Responsibility centers (Cost centers, Profit centers, Investment centers)\",\"Sales divisions only\",\"Only legal departments\"],\"oh\":[\"केवल बाहरी शाखाएं\",\"उत्तरदायित्व केंद्र (लागत केंद्र, लाभ केंद्र, निवेश केंद्र)\",\"केवल बिक्री प्रभाग\",\"केवल कानूनी विभाग\"],\"a\":1,\"ee\":\"Responsibility centers.\",\"eh\":\"उत्तरदायित्व केंद्र (Responsibility centers)।\"},{\"n\":96,\"d\":\"\",\"se\":\"In marginal costing, <strong>Contribution</strong> is mathematically calculated as:\",\"sh\":\"सीमांत लागत में, <strong>अंशदान (Contribution)</strong> की गणना गणितीय रूप से कैसे की जाती है:\",\"oe\":[\"Net Sales Revenue – Total Cost\",\"Variable Cost – Fixed Cost\",\"Net Sales Revenue – Total Variable Cost\",\"Net Sales Revenue – Total Fixed Cost\"],\"oh\":[\"शुद्ध बिक्री राजस्व - कुल लागत\",\"परिवर्तनीय लागत - स्थिर लागत\",\"शुद्ध बिक्री राजस्व - कुल परिवर्तनीय लागत (Total Variable Cost)\",\"शुद्ध बिक्री राजस्व - कुल स्थिर लागत\"],\"a\":2,\"ee\":\"Sales minus Variable Cost.\",\"eh\":\"बिक्री माइनस परिवर्तनीय लागत।\"},{\"n\":97,\"d\":\"\",\"se\":\"A <strong>Lease</strong> is fundamentally a commercial contract for the:\",\"sh\":\"<strong>लीज (Lease)</strong> मौलिक रूप से एक वाणिज्यिक अनुबंध है जो किसके लिए होता है:\",\"oe\":[\"Immediate permanent sale of an asset\",\"Exchange of two different assets\",\"Outright gifting of machinery\",\"Right to use an asset for a specific period in return for rent/lease payments\"],\"oh\":[\"किसी संपत्ति की तत्काल स्थायी बिक्री\",\"दो अलग-अलग संपत्तियों का आदान-प्रदान\",\"मशीनरी का पूर्ण उपहार\",\"किराए/पट्टे के भुगतान के बदले एक विशिष्ट अवधि के लिए किसी संपत्ति का उपयोग करने का अधिकार\"],\"a\":3,\"ee\":\"Right to use an asset.\",\"eh\":\"संपत्ति का उपयोग करने का अधिकार।\"},{\"n\":98,\"d\":\"\",\"se\":\"In a <strong>Finance Lease</strong> (capital lease), the substantial risks and rewards incidental to the ownership of the asset are transferred to the:\",\"sh\":\"एक <strong>वित्त पट्टा (Finance Lease / capital lease)</strong> में, संपत्ति के स्वामित्व से जुड़े पर्याप्त जोखिम और पुरस्कार किसे हस्तांतरित किए जाते हैं:\",\"oe\":[\"Lessee (User)\",\"Financing bank\",\"Unrelated third party\",\"Lessor (Owner)\"],\"oh\":[\"पट्टेदार (Lessee / User)\",\"वित्तपोषण बैंक\",\"असंबद्ध तीसरा पक्ष\",\"पट्टादाता (Lessor / Owner)\"],\"a\":0,\"ee\":\"The lessee assumes the economic risks and rewards.\",\"eh\":\"पट्टेदार (Lessee) आर्थिक जोखिमों और पुरस्कारों को वहन करता है।\"},{\"n\":99,\"d\":\"\",\"se\":\"Under the <strong>Sinking Fund Method</strong> for replacing an asset, the annual depreciation amount set aside is:\",\"sh\":\"किसी संपत्ति को बदलने के लिए <strong>सिंकिंग फंड विधि (Sinking Fund Method)</strong> के तहत, अलग रखी गई वार्षिक मूल्यह्रास राशि को:\",\"oe\":[\"Credited directly to the Asset Account\",\"Credited to the Sinking Fund (Depreciation Fund) Account\",\"Credited to the Profit &amp; Loss Account\",\"Debited to the Asset Account\"],\"oh\":[\"सीधे एसेट खाते में क्रेडिट किया जाता है\",\"सिंकिंग फंड (मूल्यह्रास फंड) खाते में क्रेडिट किया जाता है\",\"लाभ और हानि खाते में क्रेडिट किया जाता है\",\"एसेट खाते में डेबिट किया जाता है\"],\"a\":1,\"ee\":\"It accumulates in the Sinking Fund Account to buy a replacement asset later.\",\"eh\":\"यह बाद में प्रतिस्थापन (replacement) संपत्ति खरीदने के लिए सिंकिंग फंड खाते में जमा होता है।\"},{\"n\":100,\"d\":\"\",\"se\":\"The <strong>Realisation Account</strong> used during the dissolution of a partnership is classified as a:\",\"sh\":\"साझेदारी के विघटन के दौरान उपयोग किए जाने वाले <strong>वसूली खाते (Realisation Account)</strong> को किस रूप में वर्गीकृत किया गया है:\",\"oe\":[\"Personal Account\",\"Real Account\",\"Nominal Account\",\"Memorandum Account\"],\"oh\":[\"व्यक्तिगत खाता\",\"वास्तविक खाता\",\"नाममात्र खाता (Nominal Account)\",\"मेमोरेंडम खाता\"],\"a\":2,\"ee\":\"It measures the profit or loss on dissolution, making it a nominal account.\",\"eh\":\"यह विघटन पर लाभ या हानि को मापता है, जिससे यह एक नाममात्र खाता बन जाता है।\"}]},{\"id\":\"as2\",\"num\":2,\"name\":\"Taxation & Laws\",\"q\":[{\"n\":1,\"d\":\"\",\"se\":\"Under the Income Tax Act, 1961, the term <strong>‘assessee&rsquo;</strong> includes:\",\"sh\":\"आयकर अधिनियम, 1961 के तहत, <strong>'करदाता' (Assessee)</strong> शब्द में शामिल हैं:\",\"oe\":[\"Only a person who actually pays income tax\",\"Only corporate entities\",\"Only a person against whom assessment proceedings are initiated\",\"Every person who is liable to pay any tax, interest, or penalty, or file a return\"],\"oh\":[\"केवल वह व्यक्ति जो वास्तव में आयकर का भुगतान करता है\",\"केवल कॉर्पोरेट संस्थाएं\",\"केवल वह व्यक्ति जिसके विरुद्ध कर निर्धारण (Assessment) की कार्यवाही शुरू की गई है\",\"प्रत्येक वह व्यक्ति जो कोई कर, ब्याज, या जुर्माना देने, या रिटर्न दाखिल करने के लिए उत्तरदायी है\"],\"a\":3,\"ee\":\"Assessee encompasses anyone liable under the Act.\",\"eh\":\"अधिनियम के तहत उत्तरदायी किसी भी व्यक्ति को 'करदाता' माना जाता है।\"},{\"n\":2,\"d\":\"\",\"se\":\"The <strong>residential status</strong> of an individual under the Income Tax Act is determined by their physical presence in India during the:\",\"sh\":\"आयकर अधिनियम के तहत किसी व्यक्ति की <strong>निवासी स्थिति (Residential status)</strong> भारत में उसकी भौतिक उपस्थिति के दिनों की संख्या से निर्धारित होती है:\",\"oe\":[\"Previous year\",\"Financial year\",\"Assessment year\",\"Calendar year\"],\"oh\":[\"पिछले वर्ष (Previous year) के दौरान\",\"वित्तीय वर्ष के दौरान\",\"आकलन वर्ष (Assessment year) के दौरान\",\"कैलेंडर वर्ष के दौरान\"],\"a\":0,\"ee\":\"Status is determined based on the stay in the previous year (the year income is earned).\",\"eh\":\"स्थिति का निर्धारण 'पिछले वर्ष' (जिस वर्ष आय अर्जित की गई है) में रहने के आधार पर किया जाता है।\"},{\"n\":3,\"d\":\"\",\"se\":\"An individual is considered <strong>‘Resident and Ordinarily Resident (ROR)&rsquo;</strong> if he/she satisfies:\",\"sh\":\"एक व्यक्ति को <strong>'निवासी और सामान्य निवासी' (Resident and Ordinarily Resident - ROR)</strong> माना जाता है यदि वह संतुष्ट करता है:\",\"oe\":[\"Only the basic condition of 182 days in the previous year\",\"Only the basic condition of 60 days in the previous year + 365 days in 4 preceding years\",\"At least one basic condition AND both additional conditions (resident in 2 out of 10 preceding years + 730 days in 7 preceding years)\",\"Only if the income is from a business in India\"],\"oh\":[\"पिछले वर्ष में भारत में 182 दिनों की केवल मूल शर्त\",\"केवल पिछले वर्ष में 60 दिन + पिछले 4 वर्षों में 365 दिन की शर्त\",\"कम से कम एक मूल शर्त और दोनों अतिरिक्त शर्तें (पिछले 10 में से 2 वर्षों में निवासी + 7 वर्षों में 730 दिन)\",\"केवल तभी जब आय भारत में व्यवसाय से हो\"],\"a\":2,\"ee\":\"An individual must meet the basic conditions and BOTH additional conditions to be ROR.\",\"eh\":\"ROR होने के लिए मूल शर्तों में से एक और दोनों अतिरिक्त शर्तों को पूरा करना होगा।\"},{\"n\":4,\"d\":\"\",\"se\":\"The standard due date for filing the <strong>Income Tax Return (ITR)</strong> for a company (or an entity requiring tax audit) is:\",\"sh\":\"एक कंपनी (या कर ऑडिट की आवश्यकता वाली संस्था) के लिए <strong>आयकर रिटर्न (ITR)</strong> दाखिल करने की मानक नियत तिथि (Due date) क्या है:\",\"oe\":[\"30th September\",\"31st October\",\"31st July\",\"31st December\"],\"oh\":[\"30 सितंबर\",\"31 अक्टूबर\",\"31 जुलाई\",\"31 दिसंबर\"],\"a\":1,\"ee\":\"31st October of the Assessment Year.\",\"eh\":\"आकलन वर्ष (Assessment Year) की 31 अक्टूबर।\"},{\"n\":5,\"d\":\"\",\"se\":\"Which of the following incomes is <strong>exempt</strong> and not included in the ‘Total Taxable Income&rsquo; of an assessee?\",\"sh\":\"निम्नलिखित में से कौन सी आय <strong>छूट प्राप्त (Exempt)</strong> है और किसी करदाता की 'कुल कर योग्य आय' में शामिल नहीं की जाती है?\",\"oe\":[\"Income from Business\",\"Income from House Property\",\"Agricultural Income in India\",\"Income from Salary\"],\"oh\":[\"व्यापार से आय\",\"गृह संपत्ति से आय\",\"भारत में कृषि आय (Agricultural Income)\",\"वेतन से आय\"],\"a\":2,\"ee\":\"Agricultural income in India is completely exempt under Section 10(1).\",\"eh\":\"भारत में कृषि आय धारा 10(1) के तहत पूरी तरह से कर-मुक्त है।\"},{\"n\":6,\"d\":\"\",\"se\":\"The authority to levy tax on <strong>agricultural income</strong> rests solely with the:\",\"sh\":\"<strong>कृषि आय</strong> पर कर लगाने का अधिकार पूरी तरह से किसके पास है:\",\"oe\":[\"Central Government\",\"State Government\",\"Both Central and State Governments\",\"Local Municipalities\"],\"oh\":[\"केंद्र सरकार\",\"राज्य सरकार\",\"केंद्र और राज्य सरकार दोनों\",\"स्थानीय नगर पालिकाएं\"],\"a\":1,\"ee\":\"Under the Constitution, it is a State subject.\",\"eh\":\"संविधान के तहत, कृषि आय एक राज्य का विषय है।\"},{\"n\":7,\"d\":\"\",\"se\":\"Under the <strong>New Tax Regime (Default Regime)</strong> for individuals, the maximum tax rebate available under Section 87A is:\",\"sh\":\"व्यक्तियों के लिए <strong>नई कर व्यवस्था (New Tax Regime - Default)</strong> के तहत, धारा 87A के अंतर्गत अधिकतम कर छूट (Rebate) उपलब्ध है:\",\"oe\":[\"₹15,000\",\"₹12,500\",\"₹50,000\",\"₹25,000\"],\"oh\":[\"₹15,000\",\"₹12,500\",\"₹50,000\",\"₹25,000\"],\"a\":3,\"ee\":\"₹25,000 (making income up to ₹7 lakh completely tax-free under the new regime).\",\"eh\":\"₹25,000 (जिससे नई व्यवस्था के तहत ₹7 लाख तक की आय पूरी तरह कर-मुक्त हो जाती है)।\"},{\"n\":8,\"d\":\"\",\"se\":\"The deduction under <strong>Section 80D</strong> of the Income Tax Act is specifically available for:\",\"sh\":\"आयकर अधिनियम की <strong>धारा 80D</strong> के तहत कटौती विशेष रूप से किसके लिए उपलब्ध है:\",\"oe\":[\"Health/Medical insurance premium payments\",\"Interest on home loans\",\"Life insurance premium payments\",\"Children's tuition fees\"],\"oh\":[\"स्वास्थ्य/चिकित्सा बीमा प्रीमियम भुगतान (Health Insurance)\",\"होम लोन पर ब्याज\",\"जीव
