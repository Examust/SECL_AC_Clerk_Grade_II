3) / 100 = ₹1,200.\",\"eh\":\"SI = (P × R × T) / 100 = (5000 × 8 × 3) / 100 = ₹1,200।\"},{\"n\":42,\"d\":\"\",\"se\":\"A sum of money at simple interest amounts to ₹3,600 in 3 years and ₹4,000 in 4 years. The principal sum is:\",\"sh\":\"साधारण ब्याज पर कोई राशि 3 वर्षों में ₹3,600 और 4 वर्षों में ₹4,000 हो जाती है। मूलधन राशि है:\",\"oe\":[\"₹2,800\",\"₹3,000\",\"₹2,400\",\"₹2,000\"],\"oh\":[\"₹2,800\",\"₹3,000\",\"₹2,400\",\"₹2,000\"],\"a\":2,\"ee\":\"Interest for 1 year = 4000 - 3600 = ₹400. Interest for 3 years = 3 × 400 = ₹1200. Principal = Amount - Interest = 3600 - 1200 = ₹2,400.\",\"eh\":\"1 वर्ष का ब्याज = 4000 - 3600 = ₹400। 3 वर्ष का ब्याज = 3 × 400 = ₹1200। मूलधन = राशि - ब्याज = 3600 - 1200 = ₹2,400।\"},{\"n\":43,\"d\":\"\",\"se\":\"The compound interest on ₹8,000 for 2 years at 10% p.a. (compounded annually) is:\",\"sh\":\"₹8,000 पर 2 वर्ष के लिए 10% प्रति वर्ष (वार्षिक रूप से संयोजित) की दर से चक्रवृद्धि ब्याज (CI) है:\",\"oe\":[\"₹1,600\",\"₹1,720\",\"₹1,800\",\"₹1,680\"],\"oh\":[\"₹1,600\",\"₹1,720\",\"₹1,800\",\"₹1,680\"],\"a\":3,\"ee\":\"Amount = 8000 × (1.10)² = 8000 × 1.21 = ₹9,680. CI = 9680 - 8000 = ₹1,680.\",\"eh\":\"मिश्रधन = 8000 × (1.10)² = 8000 × 1.21 = ₹9,680। CI = 9680 - 8000 = ₹1,680।\"},{\"n\":44,\"d\":\"\",\"se\":\"The absolute difference between compound interest and simple interest on ₹2,000 for 2 years at 5% p.a. is:\",\"sh\":\"₹2,000 पर 2 वर्ष के लिए 5% प्रति वर्ष की दर से चक्रवृद्धि ब्याज और साधारण ब्याज के बीच का पूर्ण अंतर है:\",\"oe\":[\"₹5\",\"₹15\",\"₹10\",\"₹20\"],\"oh\":[\"₹5\",\"₹15\",\"₹10\",\"₹20\"],\"a\":0,\"ee\":\"Difference = P(R/100)² = 2000 × (5/100)² = 2000 × 0.0025 = ₹5.\",\"eh\":\"अंतर = P(R/100)² = 2000 × (5/100)² = 2000 × 0.0025 = ₹5।\"},{\"n\":45,\"d\":\"\",\"se\":\"A sum of money doubles itself in 10 years at simple interest. The rate of interest is:\",\"sh\":\"साधारण ब्याज पर कोई राशि 10 वर्षों में दोगुनी हो जाती है। ब्याज की दर क्या है:\",\"oe\":[\"12%\",\"10%\",\"8%\",\"15%\"],\"oh\":[\"12%\",\"10%\",\"8%\",\"15%\"],\"a\":1,\"ee\":\"If money doubles, Interest = Principal. R = (100 × I) / (P × T) = 100 / 10 = 10%.\",\"eh\":\"यदि धन दोगुना हो जाता है, तो ब्याज = मूलधन। दर (R) = (100 × I) / (P × T) = 100 / 10 = 10%।\"},{\"n\":46,\"d\":\"\",\"se\":\"At what rate percent per annum will ₹1,500 amount to ₹1,800 in 4 years at simple interest?\",\"sh\":\"किस प्रतिशत वार्षिक दर से ₹1,500 की राशि साधारण ब्याज पर 4 वर्षों में ₹1,800 हो जाएगी?\",\"oe\":[\"4%\",\"6%\",\"5%\",\"7%\"],\"oh\":[\"4%\",\"6%\",\"5%\",\"7%\"],\"a\":2,\"ee\":\"Interest = 300. Rate = (300 × 100) / (1500 × 4) = 30000 / 6000 = 5%.\",\"eh\":\"ब्याज = 300। दर = (300 × 100) / (1500 × 4) = 30000 / 6000 = 5%।\"},{\"n\":47,\"d\":\"\",\"se\":\"The compound interest on ₹6,000 for 3 years at 10% p.a. (compounded annually) is:\",\"sh\":\"₹6,000 पर 3 वर्ष के लिए 10% प्रति वर्ष (वार्षिक रूप से संयोजित) की दर से चक्रवृद्धि ब्याज है:\",\"oe\":[\"₹2,000\",\"₹1,800\",\"₹1,500\",\"₹1,986\"],\"oh\":[\"₹2,000\",\"₹1,800\",\"₹1,500\",\"₹1,986\"],\"a\":3,\"ee\":\"Amount = 6000 × (1.10)³ = 6000 × 1.331 = ₹7,986. CI = 7986 - 6000 = ₹1,986.\",\"eh\":\"मिश्रधन = 6000 × (1.10)³ = 6000 × 1.331 = ₹7,986। CI = 7986 - 6000 = ₹1,986।\"},{\"n\":48,\"d\":\"\",\"se\":\"A sum of money amounts to ₹1,260 in 2 years and ₹1,386 in 3 years at simple interest. The principal sum is:\",\"sh\":\"कोई राशि साधारण ब्याज पर 2 वर्षों में ₹1,260 और 3 वर्षों में ₹1,386 हो जाती है। मूलधन राशि क्या है:\",\"oe\":[\"₹1,008\",\"₹1,000\",\"₹1,050\",\"₹950\"],\"oh\":[\"₹1,008\",\"₹1,000\",\"₹1,050\",\"₹950\"],\"a\":0,\"ee\":\"1 year's interest = 1386 - 1260 = ₹126. 2 years' interest = ₹252. Principal = 1260 - 252 = ₹1,008.\",\"eh\":\"1 वर्ष का ब्याज = 1386 - 1260 = ₹126। 2 वर्ष का ब्याज = ₹252। मूलधन = 1260 - 252 = ₹1,008।\"},{\"n\":49,\"d\":\"\",\"se\":\"The final maturity amount received on ₹4,000 invested for 2 years at 12% p.a. compounded half‑yearly is:\",\"sh\":\"12% प्रति वर्ष (अर्ध-वार्षिक संयोजित) की दर से 2 वर्ष के लिए निवेश किए गए ₹4,000 पर प्राप्त अंतिम परिपक्वता (maturity) राशि है:\",\"oe\":[\"₹5,000.00\",\"₹5,049.90\",\"₹5,200.00\",\"₹5,120.50\"],\"oh\":[\"₹5,000.00\",\"₹5,049.90\",\"₹5,200.00\",\"₹5,120.50\"],\"a\":1,\"ee\":\"Rate = 6% per half-year. Periods = 4. Amount = 4000 × (1.06)⁴ = 4000 × 1.26247 = ₹5,049.90.\",\"eh\":\"छमाही दर = 6%। अवधि = 4। राशि = 4000 × (1.06)⁴ = 4000 × 1.26247 = ₹5,049.90।\"},{\"n\":50,\"d\":\"\",\"se\":\"The simple interest on a certain sum for 5 years at 6% p.a. is ₹900. The principal sum is:\",\"sh\":\"एक निश्चित राशि पर 5 वर्ष के लिए 6% प्रति वर्ष की दर से साधारण ब्याज ₹900 है। मूलधन राशि है:\",\"oe\":[\"₹3,500\",\"₹4,000\",\"₹3,000\",\"₹2,500\"],\"oh\":[\"₹3,500\",\"₹4,000\",\"₹3,000\",\"₹2,500\"],\"a\":2,\"ee\":\"P = (900 × 100) / (6 × 5) = 90000 / 30 = ₹3,000.\",\"eh\":\"P = (900 × 100) / (6 × 5) = 90000 / 30 = ₹3,000।\"},{\"n\":51,\"d\":\"\",\"se\":\"A can do a work in 12 days, B in 15 days, and C in 20 days. They work together for 4 days. The fraction of the work left remaining is:\",\"sh\":\"A किसी कार्य को 12 दिनों में, B 15 दिनों में, और C 20 दिनों में कर सकता है। वे 4 दिनों तक एक साथ काम करते हैं। बचे हुए कार्य का अंश (fraction) है:\",\"oe\":[\"1/4\",\"1/3\",\"2/5\",\"1/5\"],\"oh\":[\"1/4\",\"1/3\",\"2/5\",\"1/5\"],\"a\":3,\"ee\":\"Daily work = (1/12 + 1/15 + 1/20) = (5+4+3)/60 = 12/60 = 1/5. In 4 days, they complete 4/5. Remaining = 1 - 4/5 = 1/5.\",\"eh\":\"दैनिक कार्य = (1/12 + 1/15 + 1/20) = (5+4+3)/60 = 12/60 = 1/5। 4 दिनों में, वे 4/5 कार्य पूरा करते हैं। शेष = 1 - 4/5 = 1/5।\"},{\"n\":52,\"d\":\"\",\"se\":\"A and B together can complete a piece of work in 8 days. A alone can do it in 12 days. In how many days can B alone complete the work?\",\"sh\":\"A और B मिलकर किसी कार्य को 8 दिनों में पूरा कर सकते हैं। A अकेला इसे 12 दिनों में कर सकता है। B अकेला इस कार्य को कितने दिनों में पूरा कर सकता है?\",\"oe\":[\"24 days\",\"22 days\",\"26 days\",\"20 days\"],\"oh\":[\"24 दिन\",\"22 दिन\",\"26 दिन\",\"20 दिन\"],\"a\":0,\"ee\":\"B's 1-day work = 1/8 - 1/12 = (3-2)/24 = 1/24. Therefore, B takes 24 days.\",\"eh\":\"B का 1 दिन का काम = 1/8 - 1/12 = (3-2)/24 = 1/24। अतः, B को 24 दिन लगते हैं।\"},{\"n\":53,\"d\":\"\",\"se\":\"A can do a work in 20 days and B in 30 days. They work together for 5 days, and then A leaves. B will complete the remaining work in:\",\"sh\":\"A एक काम को 20 दिनों में कर सकता है और B 30 दिनों में कर सकता है। वे 5 दिनों तक एक साथ काम करते हैं, और फिर A काम छोड़ देता है। B शेष काम को कितने दिनों में पूरा करेगा:\",\"oe\":[\"12.5 days\",\"17.5 days\",\"10 days\",\"15 days\"],\"oh\":[\"12.5 दिन\",\"17.5 दिन\",\"10 दिन\",\"15 दिन\"],\"a\":1,\"ee\":\"Combined 1-day work = 1/20 + 1/30 = 5/60 = 1/12. Work in 5 days = 5/12. Remaining = 7/12. B takes = (7/12) / (1/30) = 210/12 = 17.5 days.\",\"eh\":\"संयुक्त 1 दिन का काम = 1/20 + 1/30 = 5/60 = 1/12। 5 दिनों में काम = 5/12। शेष = 7/12। B द्वारा लिया गया समय = (7/12) / (1/30) = 210/12 = 17.5 दिन।\"},{\"n\":54,\"d\":\"\",\"se\":\"A contractor undertook to complete a road in 60 days with 50 men. After 40 days, he found only 60% of the work was completed. How many extra men must he employ to finish the work exactly on time?\",\"sh\":\"एक ठेकेदार ने 50 आदमियों के साथ 60 दिनों में एक सड़क पूरी करने का ठेका लिया। 40 दिनों के बाद, उसने पाया कि केवल 60% काम ही पूरा हुआ है। काम को ठीक समय पर पूरा करने के लिए उसे कितने अतिरिक्त (extra) आदमियों को लगाना होगा?\",\"oe\":[\"20 men\",\"25 men\",\"17 men\",\"30 men\"],\"oh\":[\"20 आदमी\",\"25 आदमी\",\"17 आदमी\",\"30 आदमी\"],\"a\":2,\"ee\":\"Remaining work = 40%, remaining days = 20. (M1×D1)/W1 = (M2×D2)/W2. (50×40)/60 = (M2×20)/40. 2000/60 = 20M2/40. 33.33 = 0.5M2 → M2 = 66.67. He needs 67 men total. Extra men = 67 - 50 = 17.\",\"eh\":\"शेष कार्य = 40%, शेष दिन = 20। (M1×D1)/W1 = (M2×D2)/W2 सूत्र से: (50×40)/60 = (M2×20)/40। 2000/60 = 20M2/40। 33.33 = 0.5M2 → M2 = 66.67। उसे कुल 67 आदमियों की आवश्यकता है। अतिरिक्त आदमी = 67 - 50 = 17।\"},{\"n\":55,\"d\":\"\",\"se\":\"3 men or 5 women can do a work in 12 days. In how many days can 6 men and 10 women complete the work?\",\"sh\":\"3 पुरुष या 5 महिलाएँ किसी कार्य को 12 दिनों में कर सकते हैं। 6 पुरुष और 10 महिलाएँ उस कार्य को कितने दिनों में पूरा कर सकते हैं?\",\"oe\":[\"2 days\",\"4 days\",\"5 days\",\"3 days\"],\"oh\":[\"2 दिन\",\"4 दिन\",\"5 दिन\",\"3 दिन\"],\"a\":3,\"ee\":\"3M = 5W, so 1M = 5/3W. (6M + 10W) = 6(5/3W) + 10W = 20W. If 5W take 12 days, 20W will take (5×12) / 20 = 3 days.\",\"eh\":\"3M = 5W, इसलिए 1M = 5/3W। (6M + 10W) = 6(5/3W) + 10W = 20W। यदि 5W को 12 दिन लगते हैं, तो 20W को (5×12) / 20 = 3 दिन लगेंगे।\"},{\"n\":56,\"d\":\"\",\"se\":\"Pipe A can fill a tank in 10 hours, and Pipe B in 15 hours. Both pipes are opened together, but after 3 hours, Pipe A is closed. What is the total time taken to fill the tank from the start?\",\"sh\":\"पाइप A एक टैंक को 10 घंटे में भर सकता है, और पाइप B 15 घंटे में। दोनों पाइपों को एक साथ खोला जाता है, लेकिन 3 घंटे के बाद पाइप A को बंद कर दिया जाता है। शुरू से लेकर टैंक को पूरा भरने में कुल कितना समय लगा?\",\"oe\":[\"10.5 hours\",\"8.5 hours\",\"7.5 hours\",\"10 hours\"],\"oh\":[\"10.5 घंटे\",\"8.5 घंटे\",\"7.5 घंटे\",\"10 घंटे\"],\"a\":0,\"ee\":\"A+B 1-hour work = 1/10 + 1/15 = 1/6. In 3 hours = 3/6 = 1/2. Remaining = 1/2. B finishes the rest in (1/2) / (1/15) = 7.5 hours. Total time = 3 + 7.5 = 10.5 hours.\",\"eh\":\"A+B का 1 घंटे का काम = 1/10 + 1/15 = 1/6। 3 घंटे में = 3/6 = 1/2। शेष = 1/2। B शेष को (1/2) / (1/15) = 7.5 घंटे में पूरा करता है। कुल समय = 3 + 7.5 = 10.5 घंटे।\"},{\"n\":57,\"d\":\"\",\"se\":\"A and B can do a work in 12 and 18 days respectively. They work together for 4 days, then A leaves. If they are paid a total of ₹2,700 for the whole contract, B's rightful share based on the work he performed is:\",\"sh\":\"A और B किसी कार्य को क्रमशः 12 और 18 दिनों में कर सकते हैं। वे 4 दिनों तक एक साथ काम करते हैं, फिर A छोड़ देता है। यदि उन्हें पूरे अनुबंध के लिए कुल ₹2,700 का भुगतान किया जाता है, तो उसके द्वारा किए गए काम के आधार पर B का उचित हिस्सा है:\",\"oe\":[\"₹1,500\",\"₹1,800\",\"₹1,000\",\"₹1,200\"],\"oh\":[\"₹1,500\",\"₹1,800\",\"₹1,000\",\"₹1,200\"],\"a\":1,\"ee\":\"A worked for 4 days. A's work = 4/12 = 1/3 of the total. Therefore, B completed 2/3 of the work. B's share = 2/3 × 2700 = ₹1,800.\",\"eh\":\"A ने 4 दिन काम किया। A का काम = 4/12 = कुल का 1/3। इसलिए, B ने काम का 2/3 भाग पूरा किया। B का हिस्सा = 2/3 × 2700 = ₹1,800।\"},{\"n\":58,\"d\":\"\",\"se\":\"12 men can complete a work in 20 days. After working for 5 days, 4 more men join them. In how many days will the remaining work be completed?\",\"sh\":\"12 आदमी किसी कार्य को 20 दिनों में पूरा कर सकते हैं। 5 दिनों तक काम करने के बाद, 4 और आदमी उनके साथ जुड़ जाते हैं। शेष कार्य कितने दिनों में पूरा होगा?\",\"oe\":[\"10 days\",\"15 days\",\"11.25 days\",\"18 days\"],\"oh\":[\"10 दिन\",\"15 दिन\",\"11.25 दिन\",\"18 दिन\"],\"a\":2,\"ee\":\"Total work = 12 × 20 = 240 man-days. Work done in 5 days = 12 × 5 = 60. Remaining = 180 man-days. Total men now = 16. Days = 180 / 16 = 11.25 days.\",\"eh\":\"कुल कार्य = 12 × 20 = 240 मानव-दिवस (man-days)। 5 दिनों में किया गया कार्य = 12 × 5 = 60। शेष = 180 मानव-दिवस। अब कुल आदमी = 16। दिन = 180 / 16 = 11.25 दिन।\"},{\"n\":59,\"d\":\"\",\"se\":\"A cistern has two pipes. Pipe X fills it in 12 hours and Pipe Y empties it in 18 hours. If both are opened simultaneously, the cistern will be completely filled in:\",\"sh\":\"एक टंकी में दो पाइप हैं। पाइप X इसे 12 घंटे में भरता है और पाइप Y इसे 18 घंटे में खाली करता है। यदि दोनों को एक साथ खोल दिया जाए, तो टंकी पूरी तरह से भर जाएगी:\",\"oe\":[\"30 hours\",\"24 hours\",\"20 hours\",\"36 hours\"],\"oh\":[\"30 घंटे में\",\"24 घंटे में\",\"20 घंटे में\",\"36 घंटे में\"],\"a\":3,\"ee\":\"Net fill rate = 1/12 - 1/18 = 3/36 - 2/36 = 1/36. Takes 36 hours.\",\"eh\":\"शुद्ध भरने की दर = 1/12 - 1/18 = 3/36 - 2/36 = 1/36। अतः 36 घंटे लगेंगे।\"},{\"n\":60,\"d\":\"\",\"se\":\"A can do a work in 8 days, B in 10 days, and C in 12 days. If they work together and are paid ₹7,400 for the work, C's proportional share is:\",\"sh\":\"A किसी कार्य को 8 दिनों में, B 10 दिनों में और C 12 दिनों में कर सकता है। यदि वे एक साथ काम करते हैं और काम के लिए ₹7,400 का भुगतान किया जाता है, तो C का आनुपातिक हिस्सा है:\",\"oe\":[\"₹2,000\",\"₹2,600\",\"₹2,400\",\"₹2,200\"],\"oh\":[\"₹2,000\",\"₹2,600\",\"₹2,400\",\"₹2,200\"],\"a\":0,\"ee\":\"Efficiency ratio = 1/8 : 1/10 : 1/12. Multiply by LCM 120 = 15 : 12 : 10. Total ratio = 37. C's share = (10 / 37) × 7400 = ₹2,000.\",\"eh\":\"दक्षता (Efficiency) अनुपात = 1/8 : 1/10 : 1/12। LCM 120 से गुणा करने पर = 15 : 12 : 10। कुल अनुपात = 37। C का हिस्सा = (10 / 37) × 7400 = ₹2,000।\"},{\"n\":61,\"d\":\"\",\"se\":\"A train travels 120 km in 2 hours. Its speed in meters per second (m/s) is:\",\"sh\":\"एक ट्रेन 2 घंटे में 120 किमी की यात्रा करती है। मीटर प्रति सेकंड (m/s) में इसकी गति है:\",\"oe\":[\"20 m/s\",\"16.67 m/s\",\"30 m/s\",\"25 m/s\"],\"oh\":[\"20 m/s\",\"16.67 m/s\",\"30 m/s\",\"25 m/s\"],\"a\":1,\"ee\":\"Speed = 120/2 = 60 km/hr. 60 × (5/18) = 16.67 m/s.\",\"eh\":\"गति = 120/2 = 60 किमी/घंटा। 60 × (5/18) = 16.67 m/s।\"},{\"n\":62,\"d\":\"\",\"se\":\"A train 200 m long crosses a platform 300 m long in 25 seconds. Its speed is:\",\"sh\":\"200 मीटर लंबी एक ट्रेन 300 मीटर लंबे प्लेटफॉर्म को 25 सेकंड में पार करती है। इसकी गति है:\",\"oe\":[\"80 km/hr\",\"54 km/hr\",\"72 km/hr\",\"60 km/hr\"],\"oh\":[\"80 किमी/घंटा\",\"54 किमी/घंटा\",\"72 किमी/घंटा\",\"60 किमी/घंटा\"],\"a\":2,\"ee\":\"Total distance = 200 + 300 = 500 m. Speed = 500/25 = 20 m/s. 20 × (18/5) = 72 km/hr.\",\"eh\":\"कुल दूरी = 200 + 300 = 500 मीटर। गति = 500/25 = 20 मीटर/सेकंड। 20 × (18/5) = 72 किमी/घंटा।\"},{\"n\":63,\"d\":\"\",\"se\":\"A man covers a distance of 60 km in 4 hours. If he increases his speed by 25%, the new time taken to cover the same distance is:\",\"sh\":\"एक व्यक्ति 60 किमी की दूरी 4 घंटे में तय करता है। यदि वह अपनी गति 25% बढ़ाता है, तो समान दूरी तय करने में लगने वाला नया समय है:\",\"oe\":[\"4.5 hours\",\"3.5 hours\",\"3 hours\",\"3.2 hours\"],\"oh\":[\"4.5 घंटे\",\"3.5 घंटे\",\"3 घंटे\",\"3.2 घंटे\"],\"a\":3,\"ee\":\"Original speed = 60/4 = 15 km/h. New speed = 15 × 1.25 = 18.75 km/h. Time = 60 / 18.75 = 3.2 hours.\",\"eh\":\"मूल गति = 60/4 = 15 किमी/घंटा। नई गति = 15 × 1.25 = 18.75 किमी/घंटा। समय = 60 / 18.75 = 3.2 घंटे।\"},{\"n\":64,\"d\":\"\",\"se\":\"A car covers 240 km in 4 hours. If its speed is reduced by 20%, the time required to cover the exact same distance is:\",\"sh\":\"एक कार 4 घंटे में 240 किमी की दूरी तय करती है। यदि इसकी गति 20% कम कर दी जाती है, तो ठीक उसी दूरी को तय करने में लगने वाला समय है:\",\"oe\":[\"5 hours\",\"6 hours\",\"4.5 hours\",\"5.5 hours\"],\"oh\":[\"5 घंटे\",\"6 घंटे\",\"4.5 घंटे\",\"5.5 घंटे\"],\"a\":0,\"ee\":\"Original speed = 60 km/h. Reduced speed = 60 × 0.80 = 48 km/h. Time = 240 / 48 = 5 hours.\",\"eh\":\"मूल गति = 60 किमी/घंटा। कम की गई गति = 60 × 0.80 = 48 किमी/घंटा। समय = 240 / 48 = 5 घंटे।\"},{\"n\":65,\"d\":\"\",\"se\":\"A man walks 10 km at a speed of 5 km/hr, and the next 10 km at 10 km/hr. His average speed for the entire journey is:\",\"sh\":\"एक व्यक्ति 5 किमी/घंटा की गति से 10 किमी चलता है, और अगले 10 किमी 10 किमी/घंटा की गति से चलता है। पूरी यात्रा के लिए उसकी औसत गति है:\",\"oe\":[\"6 km/hr\",\"6.67 km/hr\",\"7.5 km/hr\",\"8 km/hr\"],\"oh\":[\"6 किमी/घंटा\",\"6.67 किमी/घंटा\",\"7.5 किमी/घंटा\",\"8 किमी/घंटा\"],\"a\":1,\"ee\":\"Time 1 = 10/5 = 2h. Time 2 = 10/10 = 1h. Total dist = 20km. Total time = 3h. Average speed = 20/3 = 6.67 km/hr.\",\"eh\":\"समय 1 = 10/5 = 2 घंटे। समय 2 = 10/10 = 1 घंटे। कुल दूरी = 20 किमी। कुल समय = 3 घंटे। औसत गति = 20/3 = 6.67 किमी/घंटा।\"},{\"n\":66,\"d\":\"\",\"se\":\"A boat covers 24 km downstream in 3 hours and 24 km upstream in 4 hours. The speed of the boat in still water is:\",\"sh\":\"एक नाव धारा के अनुकूल 24 किमी की दूरी 3 घंटे में और धारा के प्रतिकूल 24 किमी की दूरी 4 घंटे में तय करती है। शांत जल में नाव की गति है:\",\"oe\":[\"8 km/hr\",\"9 km/hr\",\"7 km/hr\",\"10 km/hr\"],\"oh\":[\"8 किमी/घंटा\",\"9 किमी/घंटा\",\"7 किमी/घंटा\",\"10 किमी/घंटा\"],\"a\":2,\"ee\":\"Downstream speed = 24/3 = 8 km/h. Upstream speed = 24/4 = 6 km/h. Boat speed = (8+6)/2 = 7 km/h.\",\"eh\":\"अनुकूल (Downstream) गति = 24/3 = 8 किमी/घंटा। प्रतिकूल (Upstream) गति = 24/4 = 6 किमी/घंटा। नाव की गति = (8+6)/2 = 7 किमी/घंटा।\"},{\"n\":67,\"d\":\"\",\"se\":\"A train of length 150 m passes a platform of length 250 m in 20 seconds. Its speed is:\",\"sh\":\"150 मीटर लंबी एक ट्रेन 250 मीटर लंबे प्लेटफॉर्म को 20 सेकंड में पार करती है। इसकी गति है:\",\"oe\":[\"60 km/hr\",\"54 km/hr\",\"45 km/hr\",\"72 km/hr\"],\"oh\":[\"60 किमी/घंटा\",\"54 किमी/घंटा\",\"45 किमी/घंटा\",\"72 किमी/घंटा\"],\"a\":3,\"ee\":\"Total distance = 400 m. Speed = 400/20 = 20 m/s. 20 × (18/5) = 72 km/h.\",\"eh\":\"कुल दूरी = 400 मीटर। गति = 400/20 = 20 मीटर/सेकंड। 20 × (18/5) = 72 किमी/घंटा।\"},{\"n\":68,\"d\":\"\",\"se\":\"Two men, A and B, start from the exact same point, walking in opposite directions at 4 km/hr and 6 km/hr respectively. After 3 hours, the distance between them will be:\",\"sh\":\"दो आदमी, A और B, एक ही बिंदु से क्रमशः 4 किमी/घंटा और 6 किमी/घंटा की गति से विपरीत दिशाओं में चलना शुरू करते हैं। 3 घंटे के बाद, उनके बीच की दूरी होगी:\",\"oe\":[\"30 km\",\"20 km\",\"24 km\",\"18 km\"],\"oh\":[\"30 किमी\",\"20 किमी\",\"24 किमी\",\"18 किमी\"],\"a\":0,\"ee\":\"Relative speed = 4 + 6 = 10 km/hr. Distance = 10 × 3 = 30 km.\",\"eh\":\"सापेक्ष (Relative) गति = 4 + 6 = 10 किमी/घंटा। दूरी = 10 × 3 = 30 किमी।\"},{\"n\":69,\"d\":\"\",\"se\":\"A man runs a 200 m race in 25 seconds. His speed in km/hr is:\",\"sh\":\"एक व्यक्ति 200 मीटर की दौड़ 25 सेकंड में पूरी करता है। किमी/घंटा में उसकी गति है:\",\"oe\":[\"32.5 km/hr\",\"28.8 km/hr\",\"30.0 km/hr\",\"29.0 km/hr\"],\"oh\":[\"32.5 किमी/घंटा\",\"28.8 किमी/घंटा\",\"30.0 किमी/घंटा\",\"29.0 किमी/घंटा\"],\"a\":1,\"ee\":\"Speed = 200/25 = 8 m/s. In km/hr = 8 × (18/5) = 144 / 5 = 28.8 km/hr.\",\"eh\":\"गति = 200/25 = 8 मीटर/सेकंड। किमी/घंटा में = 8 × (18/5) = 144 / 5 = 28.8 किमी/घंटा।\"},{\"n\":70,\"d\":\"\",\"se\":\"A person travels at 60 km/hr for 2 hours and then at 80 km/hr for 3 hours. His average speed for the whole journey is:\",\"sh\":\"एक व्यक्ति 2 घंटे के लिए 60 किमी/घंटा की गति से और फिर 3 घंटे के लिए 80 किमी/घंटा की गति से यात्रा करता है। पूरी यात्रा के लिए उसकी औसत गति है:\",\"oe\":[\"70 km/hr\",\"68 km/hr\",\"72 km/hr\",\"74 km/hr\"],\"oh\":[\"70 किमी/घंटा\",\"68 किमी/घंटा\",\"72 किमी/घंटा\",\"74 किमी/घंटा\"],\"a\":2,\"ee\":\"Total Distance = (60×2) + (80×3) = 120 + 240 = 360 km. Total time = 5h. Average = 360/5 = 72 km/hr.\",\"eh\":\"कुल दूरी = (60×2) + (80×3) = 120 + 240 = 360 किमी। कुल समय = 5 घंटे। औसत = 360/5 = 72 किमी/घंटा।\"},{\"n\":71,\"d\":\"\",\"se\":\"The perimeter of a square is 48 cm. Its area is:\",\"sh\":\"एक वर्ग (square) का परिमाप 48 सेमी है। इसका क्षेत्रफल है:\",\"oe\":[\"121 cm²\",\"169 cm²\",\"100 cm²\",\"144 cm²\"],\"oh\":[\"121 वर्ग सेमी\",\"169 वर्ग सेमी\",\"100 वर्ग सेमी\",\"144 वर्ग सेमी\"],\"a\":3,\"ee\":\"Side = 48/4 = 12. Area = 12 × 12 = 144.\",\"eh\":\"भुजा = 48/4 = 12। क्षेत्रफल = 12 × 12 = 144।\"},{\"n\":72,\"d\":\"\",\"se\":\"The area of a rectangle is 240 cm² and its length is 20 cm. Its breadth is:\",\"sh\":\"एक आयत का क्षेत्रफल 240 वर्ग सेमी है और इसकी लंबाई 20 सेमी है। इसकी चौड़ाई है:\",\"oe\":[\"12 cm\",\"15 cm\",\"16 cm\",\"10 cm\"],\"oh\":[\"12 सेमी\",\"15 सेमी\",\"16 सेमी\",\"10 सेमी\"],\"a\":0,\"ee\":\"Breadth = Area / Length = 240 / 20 = 12 cm.\",\"eh\":\"चौड़ाई = क्षेत्रफल / लंबाई = 240 / 20 = 12 सेमी।\"},{\"n\":73,\"d\":\"\",\"se\":\"The length of the diagonal of a square is 10√2 cm. Its area is:\",\"sh\":\"एक वर्ग के विकर्ण (diagonal) की लंबाई 10√2 सेमी है। इसका क्षेत्रफल है:\",\"oe\":[\"200 cm²\",\"100 cm²\",\"150 cm²\",\"50 cm²\"],\"oh\":[\"200 वर्ग सेमी\",\"100 वर्ग सेमी\",\"150 वर्ग सेमी\",\"50 वर्ग सेमी\"],\"a\":1,\"ee\":\"Diagonal = Side × √2. Therefore, Side = 10. Area = 10² = 100.\",\"eh\":\"विकर्ण = भुजा × √2। इसलिए, भुजा = 10। क्षेत्रफल = 10² = 100।\"},{\"n\":74,\"d\":\"\",\"se\":\"The volume of a perfect cube with a side of 5 cm is:\",\"sh\":\"5 सेमी की भुजा वाले एक पूर्ण घन (cube) का आयतन (volume) है:\",\"oe\":[\"100 cm³\",\"150 cm³\",\"125 cm³\",\"175 cm³\"],\"oh\":[\"100 घन सेमी\",\"150 घन सेमी\",\"125 घन सेमी\",\"175 घन सेमी\"],\"a\":2,\"ee\":\"Volume = a³ = 5³ = 125.\",\"eh\":\"आयतन = a³ = 5³ = 125।\"},{\"n\":75,\"d\":\"\",\"se\":\"The volume of a cylinder with radius 7 cm and height 10 cm (using π = 22/7) is:\",\"sh\":\"7 सेमी त्रिज्या और 10 सेमी ऊंचाई वाले एक बेलन (cylinder) का आयतन (π = 22/7 मानकर) है:\",\"oe\":[\"1100 cm³\",\"2200 cm³\",\"154 cm³\",\"1540 cm³\"],\"oh\":[\"1100 घन सेमी\",\"2200 घन सेमी\",\"154 घन सेमी\",\"1540 घन सेमी\"],\"a\":3,\"ee\":\"Volume = πr²h = (22/7) × 49 × 10 = 1540.\",\"eh\":\"आयतन = πr²h = (22/7) × 49 × 10 = 1540।\"},{\"n\":76,\"d\":\"\",\"se\":\"The circumference of a circle is 44 cm. Its radius (using π = 22/7) is:\",\"sh\":\"एक वृत्त (circle) की परिधि 44 सेमी है। इसकी त्रिज्या (π = 22/7 का उपयोग करके) है:\",\"oe\":[\"7 cm\",\"10 cm\",\"14 cm\",\"21 cm\"],\"oh\":[\"7 सेमी\",\"10 सेमी\",\"14 सेमी\",\"21 सेमी\"],\"a\":0,\"ee\":\"2πr = 44 → 2 × (22/7) × r = 44 → r = 7.\",\"eh\":\"2πr = 44 → 2 × (22/7) × r = 44 → r = 7।\"},{\"n\":77,\"d\":\"\",\"se\":\"The area of a triangle with a base of 12 cm and a perpendicular height of 8 cm is:\",\"sh\":\"12 सेमी के आधार और 8 सेमी की लंबवत ऊंचाई वाले एक त्रिभुज (triangle) का क्षेत्रफल है:\",\"oe\":[\"96 cm²\",\"48 cm²\",\"40 cm²\",\"24 cm²\"],\"oh\":[\"96 वर्ग सेमी\",\"48 वर्ग सेमी\",\"40 वर्ग सेमी\",\"24 वर्ग सेमी\"],\"a\":1,\"ee\":\"Area = 1/2 × base × height = 0.5 × 12 × 8 = 48.\",\"eh\":\"क्षेत्रफल = 1/2 × आधार × ऊंचाई = 0.5 × 12 × 8 = 48।\"},{\"n\":78,\"d\":\"\",\"se\":\"The sum of the interior angles of a triangle is always:\",\"sh\":\"एक त्रिभुज के आंतरिक कोणों (interior angles) का योग हमेशा होता है:\",\"oe\":[\"270°\",\"360°\",\"180°\",\"90°\"],\"oh\":[\"270°\",\"360°\",\"180°\",\"90°\"],\"a\":2,\"ee\":\"180°.\",\"eh\":\"180°।\"},{\"n\":79,\"d\":\"\",\"se\":\"The area of a circle with a radius of 14 cm (using π = 22/7) is:\",\"sh\":\"14 सेमी की त्रिज्या वाले एक वृत्त का क्षेत्रफल (π = 22/7 का उपयोग करके) है:\",\"oe\":[\"154 cm²\",\"462 cm²\",\"308 cm²\",\"616 cm²\"],\"oh\":[\"154 वर्ग सेमी\",\"462 वर्ग सेमी\",\"308 वर्ग सेमी\",\"616 वर्ग सेमी\"],\"a\":3,\"ee\":\"Area = πr² = (22/7) × 196 = 616.\",\"eh\":\"क्षेत्रफल = πr² = (22/7) × 196 = 616।\"},{\"n\":80,\"d\":\"\",\"se\":\"The volume of a cuboid with dimensions 5 cm × 4 cm × 3 cm is:\",\"sh\":\"5 सेमी × 4 सेमी × 3 सेमी आयाम (dimensions) वाले एक घनाभ (cuboid) का आयतन है:\",\"oe\":[\"60 cm³\",\"120 cm³\",\"80 cm³\",\"30 cm³\"],\"oh\":[\"60 घन सेमी\",\"120 घन सेमी\",\"80 घन सेमी\",\"30 घन सेमी\"],\"a\":0,\"ee\":\"L × B × H = 5 × 4 × 3 = 60.\",\"eh\":\"L × B × H = 5 × 4 × 3 = 60।\"},{\"n\":81,\"d\":\"\",\"se\":\"What is the total production over the 5 years?\",\"sh\":\"5 वर्षों में कुल उत्पादन कितना है?\",\"oe\":[\"370\",\"350\",\"340\",\"360\"],\"oh\":[\"370\",\"350\",\"340\",\"360\"],\"a\":1,\"ee\":\"50+60+70+80+90 = 350.\",\"eh\":\"50+60+70+80+90 = 350।\"},{\"n\":82,\"d\":\"\",\"se\":\"What is the percentage increase in production from 2018 to 2022?\",\"sh\":\"2018 से 2022 तक उत्पादन में प्रतिशत वृद्धि कितनी है?\",\"oe\":[\"60%\",\"90%\",\"80%\",\"70%\"],\"oh\":[\"60%\",\"90%\",\"80%\",\"70%\"],\"a\":2,\"ee\":\"Increase = 90 - 50 = 40. % = (40/50) × 100 = 80%.\",\"eh\":\"वृद्धि = 90 - 50 = 40। % = (40/50) × 100 = 80%।\"},{\"n\":83,\"d\":\"\",\"se\":\"The average production per year is:\",\"sh\":\"प्रति वर्ष औसत उत्पादन है:\",\"oe\":[\"65\",\"75\",\"80\",\"70\"],\"oh\":[\"65\",\"75\",\"80\",\"70\"],\"a\":3,\"ee\":\"350 / 5 = 70.\",\"eh\":\"350 / 5 = 70।\"},{\"n\":84,\"d\":\"\",\"se\":\"In which year was the production exactly 20% more than the production in 2018?\",\"sh\":\"किस वर्ष में उत्पादन 2018 के उत्पादन से ठीक 20% अधिक था?\",\"oe\":[\"2019\",\"2022\",\"2021\",\"2020\"],\"oh\":[\"2019\",\"2022\",\"2021\",\"2020\"],\"a\":0,\"ee\":\"2018 = 50. 20% of 50 = 10. 50 + 10 = 60. Production was 60 in 2019.\",\"eh\":\"2018 = 50। 50 का 20% = 10। 50 + 10 = 60। 2019 में उत्पादन 60 था।\"},{\"n\":85,\"d\":\"\",\"se\":\"The difference between the highest and lowest production years is:\",\"sh\":\"उच्चतम (highest) और न्यूनतम (lowest) उत्पादन वर्षों के बीच का अंतर है:\",\"oe\":[\"30\",\"40\",\"60\",\"50\"],\"oh\":[\"30\",\"40\",\"60\",\"50\"],\"a\":1,\"ee\":\"90 - 50 = 40.\",\"eh\":\"90 - 50 = 40।\"},{\"n\":86,\"d\":\"\",\"se\":\"If the total monthly income is ₹40,000, the absolute amount spent on food is:\",\"sh\":\"यदि कुल मासिक आय ₹40,000 है, तो भोजन पर खर्च की गई पूर्ण राशि है:\",\"oe\":[\"₹6,000\",\"₹8,000\",\"₹12,000\",\"₹10,000\"],\"oh\":[\"₹6,000\",\"₹8,000\",\"₹12,000\",\"₹10,000\"],\"a\":2,\"ee\":\"30% of 40,000 = ₹12,000.\",\"eh\":\"40,000 का 30% = ₹12,000।\"},{\"n\":87,\"d\":\"\",\"se\":\"If represented on a pie chart, the central angle representing 'Savings' is:\",\"sh\":\"यदि एक पाई चार्ट पर दर्शाया जाए, तो 'बचत' (Savings) का प्रतिनिधित्व करने वाला केंद्रीय कोण है:\",\"oe\":[\"90°\",\"72°\",\"36°\",\"54°\"],\"oh\":[\"90°\",\"72°\",\"36°\",\"54°\"],\"a\":3,\"ee\":\"15% of 360° = 54°.\",\"eh\":\"360° का 15% = 54°।\"},{\"n\":88,\"d\":\"\",\"se\":\"The total amount spent on Transport and Entertainment combined is:\",\"sh\":\"परिवहन और मनोरंजन दोनों पर मिलाकर खर्च की गई कुल राशि है:\",\"oe\":[\"₹8,000\",\"₹10,000\",\"₹12,000\",\"₹6,000\"],\"oh\":[\"₹8,000\",\"₹10,000\",\"₹12,000\",\"₹6,000\"],\"a\":0,\"ee\":\"10% + 10% = 20%. 20% of 40,000 = ₹8,000.\",\"eh\":\"10% + 10% = 20%। 40,000 का 20% = ₹8,000।\"},{\"n\":89,\"d\":\"\",\"se\":\"The ratio of expenditure on Food to Education is:\",\"sh\":\"भोजन और शिक्षा पर व्यय का अनुपात है:\",\"oe\":[\"3:2\",\"2:1\",\"3:1\",\"1:1\"],\"oh\":[\"3:2\",\"2:1\",\"3:1\",\"1:1\"],\"a\":1,\"ee\":\"30% : 15% simplifies to 2:1.\",\"eh\":\"30% : 15% सरल होकर 2:1 हो जाता है।\"},{\"n\":90,\"d\":\"\",\"se\":\"If the total income increases by 10% next month (and the percentage distribution remains identical), the new savings amount will be:\",\"sh\":\"यदि अगले महीने कुल आय में 10% की वृद्धि होती है (और प्रतिशत वितरण समान रहता है), तो नई बचत राशि होगी:\",\"oe\":[\"₹6,300\",\"₹7,200\",\"₹6,600\",\"₹6,000\"],\"oh\":[\"₹6,300\",\"₹7,200\",\"₹6,600\",\"₹6,000\"],\"a\":2,\"ee\":\"New income = 44,000. Savings = 15% of 44,000 = ₹6,600.\",\"eh\":\"नई आय = 44,000। बचत = 44,000 का 15% = ₹6,600।\"},{\"n\":91,\"d\":\"\",\"se\":\"The probability of getting a &quot;Head&quot; in a single toss of a fair coin is:\",\"sh\":\"एक निष्पक्ष सिक्के को एक बार उछालने पर &quot;चित&quot; (Head) आने की प्रायिकता (probability) है:\",\"oe\":[\"2/3\",\"1/3\",\"1/4\",\"1/2\"],\"oh\":[\"2/3\",\"1/3\",\"1/4\",\"1/2\"],\"a\":3,\"ee\":\"1 favorable outcome out of 2.\",\"eh\":\"2 संभावित परिणामों में से 1 अनुकूल परिणाम।\"},{\"n\":92,\"d\":\"\",\"se\":\"A bag contains 3 red, 4 white, and 5 blue balls. If one ball is drawn at random, the probability that it is <strong>not red</strong> is:\",\"sh\":\"एक थैले में 3 लाल, 4 सफेद और 5 नीली गेंदें हैं। यदि एक गेंद यादृच्छिक रूप से (at random) निकाली जाती है, तो उसके <strong>लाल न होने</strong> की प्रायिकता क्या है:\",\"oe\":[\"3/4\",\"2/3\",\"1/4\",\"1/3\"],\"oh\":[\"3/4\",\"2/3\",\"1/4\",\"1/3\"],\"a\":0,\"ee\":\"Total balls = 12. Non-red balls = 4 + 5 = 9. Probability = 9/12 = 3/4.\",\"eh\":\"कुल गेंदें = 12। गैर-लाल गेंदें = 4 + 5 = 9। प्रायिकता = 9/12 = 3/4।\"},{\"n\":93,\"d\":\"\",\"se\":\"In how many ways can 5 distinct books be arranged in a line on a shelf?\",\"sh\":\"5 अलग-अलग किताबों को एक शेल्फ पर एक पंक्ति में कितने तरीकों से व्यवस्थित किया जा सकता है?\",\"oe\":[\"24\",\"120\",\"60\",\"100\"],\"oh\":[\"24\",\"120\",\"60\",\"100\"],\"a\":1,\"ee\":\"5! = 5 × 4 × 3 × 2 × 1 = 120.\",\"eh\":\"5! = 5 × 4 × 3 × 2 × 1 = 120।\"},{\"n\":94,\"d\":\"\",\"se\":\"How many 3-digit numbers can be formed from the digits 1, 2, 3, 4, 5 assuming repetition of digits is <strong>not</strong> allowed?\",\"sh\":\"अंकों की पुनरावृत्ति (repetition) की अनुमति नहीं होने पर, अंक 1, 2, 3, 4, 5 से 3-अंकों वाली कितनी संख्याएँ बनाई जा सकती हैं?\",\"oe\":[\"120\",\"100\",\"60\",\"125\"],\"oh\":[\"120\",\"100\",\"60\",\"125\"],\"a\":2,\"ee\":\"5P3 = 5 × 4 × 3 = 60.\",\"eh\":\"5P3 = 5 × 4 × 3 = 60।\"},{\"n\":95,\"d\":\"\",\"se\":\"If x + (1/x) = 4, then the value of x² + (1/x²) is:\",\"sh\":\"यदि x + (1/x) = 4 है, तो x² + (1/x²) का मान है:\",\"oe\":[\"16\",\"12\",\"10\",\"14\"],\"oh\":[\"16\",\"12\",\"10\",\"14\"],\"a\":3,\"ee\":\"(x + 1/x)² = x² + 1/x² + 2. So, 16 = x² + 1/x² + 2 → 14.\",\"eh\":\"(x + 1/x)² = x² + 1/x² + 2। अतः, 16 = x² + 1/x² + 2 → 14।\"},{\"n\":96,\"d\":\"\",\"se\":\"If x² – 5x + 6 = 0, the values of x are:\",\"sh\":\"यदि x² – 5x + 6 = 0 है, तो x के मान हैं:\",\"oe\":[\"2, 3\",\"2, -3\",\"1, 6\",\"2, -3\"],\"oh\":[\"2, 3\",\"2, -3\",\"1, 6\",\"2, -3\"],\"a\":0,\"ee\":\"Factorizing: (x-2)(x-3) = 0. Therefore, x = 2 or 3.\",\"eh\":\"गुणनखंडन: (x-2)(x-3) = 0। इसलिए, x = 2 या 3।\"},{\"n\":97,\"d\":\"\",\"se\":\"The sum of the roots of the quadratic equation x² – 7x + 10 = 0 is:\",\"sh\":\"द्विघात समीकरण (quadratic equation) x² – 7x + 10 = 0 के मूलों का योग (sum of the roots) है:\",\"oe\":[\"10\",\"7\",\"7\",\"10\"],\"oh\":[\"10\",\"7\",\"7\",\"10\"],\"a\":1,\"ee\":\"Sum of roots = -b/a = -(-7)/1 = 7.\",\"eh\":\"मूलों का योग = -b/a = -(-7)/1 = 7।\"},{\"n\":98,\"d\":\"\",\"se\":\"The probability of getting a sum exactly equal to 7 when two standard dice are thrown simultaneously is:\",\"sh\":\"जब दो मानक पासे (dice) एक साथ फेंके जाते हैं, तो योग ठीक 7 आने की प्रायिकता क्या है:\",\"oe\":[\"5/36\",\"1/12\",\"1/6\",\"1/36\"],\"oh\":[\"5/36\",\"1/12\",\"1/6\",\"1/36\"],\"a\":2,\"ee\":\"Favorable outcomes = (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) = 6. Total = 36. Probability = 6/36 = 1/6.\",\"eh\":\"अनुकूल परिणाम = (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) = 6। कुल = 36। प्रायिकता = 6/36 = 1/6।\"},{\"n\":99,\"d\":\"\",\"se\":\"In how many ways can a group of 4 players be chosen from a total team of 10?\",\"sh\":\"कुल 10 लोगों की टीम में से 4 खिलाड़ियों के समूह को कितने तरीकों से चुना जा सकता है?\",\"oe\":[\"240\",\"120\",\"5040\",\"210\"],\"oh\":[\"240\",\"120\",\"5040\",\"210\"],\"a\":3,\"ee\":\"10C4 = (10 × 9 × 8 × 7) / (4 × 3 × 2 × 1) = 210.\",\"eh\":\"10C4 = (10 × 9 × 8 × 7) / (4 × 3 × 2 × 1) = 210।\"},{\"n\":100,\"d\":\"\",\"se\":\"If x : y = 2 : 3 and y : z = 4 : 5, then the ratio x : z is:\",\"sh\":\"यदि x : y = 2 : 3 और y : z = 4 : 5 है, तो अनुपात x : z है:\",\"oe\":[\"8:15\",\"2:5\",\"4:5\",\"6:10\"],\"oh\":[\"8:15\",\"2:5\",\"4:5\",\"6:10\"],\"a\":0,\"ee\":\"x/z = (x/y) × (y/z) = (2/3) × (4/5) = 8/15.\",\"eh\":\"x/z = (x/y) × (y/z) = (2/3) × (4/5) = 8/15।\"}]},{\"id\":\"as4\",\"num\":4,\"name\":\"Reasoning & Mental Ability\",\"q\":[{\"n\":1,\"d\":\"\",\"se\":\"In a certain code language, &ldquo;PENCIL&rdquo; is written as &ldquo;OFMDHK&rdquo;. How is &ldquo;ERASER&rdquo; written in that code?\",\"sh\":\"एक निश्चित कूट भाषा में, &quot;PENCIL&quot; को &quot;OFMDHK&quot; लिखा जाता है। उसी कूट में &quot;ERASER&quot; कैसे लिखा जाएगा?\",\"oe\":[\"FSBTFS\",\"DQZRDQ\",\"DPYQCQ\",\"EQZREQ\"],\"oh\":[\"FSBTFS\",\"DQZRDQ\",\"DPYQCQ\",\"EQZREQ\"],\"a\":1,\"ee\":\"Each letter is shifted backward by -1. (E-1=D, R-1=Q, A-1=Z, S-1=R, E-1=D, R-1=Q).\",\"eh\":\"प्रत्येक अक्षर को 1 स्थान पीछे (-1) खिसकाया गया है। (E-1=D, R-1=Q, A-1=Z, S-1=R, E-1=D, R-1=Q)।\"},{\"n\":2,\"d\":\"\",\"se\":\"If &ldquo;STAR&rdquo; is coded as &ldquo;UVCT&rdquo;, then &ldquo;MOON&rdquo; is coded as:\",\"sh\":\"यदि &quot;STAR&quot; को &quot;UVCT&quot; के रूप में कोडित किया गया है, तो &quot;MOON&quot; को कैसे कोडित किया जाएगा:\",\"oe\":[\"OQOP\",\"OPPQ\",\"OQQP\",\"QQOP\"],\"oh\":[\"OQOP\",\"OPPQ\",\"OQQP\",\"QQOP\"],\"a\":2,\"ee\":\"Each letter is shifted forward by +2. (M+2=O, O+2=Q, O+2=Q, N+2=P).\",\"eh\":\"प्रत्येक अक्षर को +2 स्थान आगे बढ़ाया गया है। (M+2=O, O+2=Q, O+2=Q, N+2=P)।\"},{\"n\":3,\"d\":\"\",\"se\":\"In a certain code, &ldquo;NUMBER&rdquo; is written as &ldquo;OVNCFS&rdquo;. How is &ldquo;LETTER&rdquo; written?\",\"sh\":\"एक निश्चित कूट में, &quot;NUMBER&quot; को &quot;OVNCFS&quot; लिखा जाता है। &quot;LETTER&quot; को कैसे लिखा जाएगा?\",\"oe\":[\"MFTUFS\",\"MFUVFS\",\"MEUUFS\",\"MFUUFS\"],\"oh\":[\"MFTUFS\",\"MFUVFS\",\"MEUUFS\",\"MFUUFS\"],\"a\":3,\"ee\":\"Each letter is shifted forward by +1. (L→M, E→F, T→U, T→U, E→F, R→S).\",\"eh\":\"प्रत्येक अक्षर को +1 स्थान आगे बढ़ाया गया है। (L→M, E→F, T→U, T→U, E→F, R→S)।\"},{\"n\":4,\"d\":\"\",\"se\":\"If &ldquo;CIRCLE&rdquo; is coded as &ldquo;DJSBMF&rdquo;, then &ldquo;SQUARE&rdquo; is coded as:\",\"sh\":\"यदि &quot;CIRCLE&quot; को &quot;DJSBMF&quot; के रूप में कोडित किया गया है, तो &quot;SQUARE&quot; को कैसे कोडित किया जाएगा:\",\"oe\":[\"TRVBSF\",\"TSVBSF\",\"TRVBFG\",\"TRVBFS\"],\"oh\":[\"TRVBSF\",\"TSVBSF\",\"TRVBFG\",\"TRVBFS\"],\"a\":0,\"ee\":\"Each letter shifts +1 step forward. (S→T, Q→R, U→V, A→B, R→S, E→F).\",\"eh\":\"प्रत्येक अक्षर +1 से आगे बढ़ता है। (S→T, Q→R, U→V, A→B, R→S, E→F)।\"},{\"n\":5,\"d\":\"\",\"se\":\"In a certain code, &ldquo;MILK&rdquo; is written as &ldquo;NJML&rdquo;. How is &ldquo;JUICE&rdquo; written?\",\"sh\":\"एक निश्चित कूट में, &quot;MILK&quot; को &quot;NJML&quot; लिखा जाता है। &quot;JUICE&quot; को कैसे लिखा जाएगा?\",\"oe\":[\"KVJDE\",\"KVJDF\",\"KVIDF\",\"KVJEF\"],\"oh\":[\"KVJDE\",\"KVJDF\",\"KVIDF\",\"KVJEF\"],\"a\":1,\"ee\":\"Each letter is shifted +1 step forward.\",\"eh\":\"प्रत्येक अक्षर +1 से आगे बढ़ता है।\"},{\"n\":6,\"d\":\"\",\"se\":\"If &ldquo;TABLE&rdquo; is coded as &ldquo;UBCMF&rdquo;, then &ldquo;CHAIR&rdquo; is coded as:\",\"sh\":\"यदि &quot;TABLE&quot; को &quot;UBCMF&quot; के रूप में कोडित किया गया है, तो &quot;CHAIR&quot; को कैसे कोडित किया जाएगा:\",\"oe\":[\"CIBJS\",\"DJBJS\",\"DIBJS\",\"DIBKS\"],\"oh\":[\"CIBJS\",\"DJBJS\",\"DIBJS\",\"DIBKS\"],\"a\":2,\"ee\":\"Each letter is shifted +1 step forward.\",\"eh\":\"प्रत्येक अक्षर +1 से आगे बढ़ता है।\"},{\"n\":7,\"d\":\"\",\"se\":\"If &ldquo;ZERO&rdquo; is coded as &ldquo;AFSP&rdquo;, then &ldquo;ONE&rdquo; is coded as:\",\"sh\":\"यदि &quot;ZERO&quot; को &quot;AFSP&quot; के रूप में कोडित किया गया है, तो &quot;ONE&quot; को कैसे कोडित किया जाएगा:\",\"oe\":[\"POG\",\"PNF\",\"PMF\",\"POF\"],\"oh\":[\"POG\",\"PNF\",\"PMF\",\"POF\"],\"a\":3,\"ee\":\"Each letter is shifted +1 step forward.\",\"eh\":\"प्रत्येक अक्षर +1 से आगे बढ़ता है।\"},{\"n\":8,\"d\":\"\",\"se\":\"In a code, &ldquo;FRUIT&rdquo; is written as &ldquo;GSVJU&rdquo;. How is &ldquo;LEMON&rdquo; written?\",\"sh\":\"एक कूट में, &quot;FRUIT&quot; को &quot;GSVJU&quot; लिखा जाता है। &quot;LEMON&quot; को कैसे लिखा जाएगा?\",\"oe\":[\"MFNPO\",\"MFNNP\",\"MGNPO\",\"MFOPP\"],\"oh\":[\"MFNPO\",\"MFNNP\",\"MGNPO\",\"MFOPP\"],\"a\":0,\"ee\":\"Each letter is shifted +1 step forward.\",\"eh\":\"प्रत्येक अक्षर +1 से आगे बढ़ता है।\"},{\"n\":9,\"d\":\"\",\"se\":\"If &ldquo;345&rdquo; means &ldquo;good bad ugly&rdquo;, &ldquo;456&rdquo; means &ldquo;ugly rich poor&rdquo;, and &ldquo;567&rdquo; means &ldquo;poor tall short&rdquo;, then which digit stands for &ldquo;ugly&rdquo;?\",\"sh\":\"यदि &quot;345&quot; का अर्थ &quot;good bad ugly&quot;, &quot;456&quot; का अर्थ &quot;ugly rich poor&quot;, और &quot;567&quot; का अर्थ &quot;poor tall short&quot; है, तो कौन सा अंक &quot;ugly&quot; के लिए है?\",\"oe\":[\"5\",\"4\",\"3\",\"6\"],\"oh\":[\"5\",\"4\",\"3\",\"6\"],\"a\":1,\"ee\":\"Comparing the first and second statements, the common word is &quot;ugly&quot; and the common digit is &quot;4&quot;.\",\"eh\":\"पहले और दूसरे वाक्यों की तुलना करने पर, आम शब्द &quot;ugly&quot; है और आम अंक &quot;4&quot; है।\"},{\"n\":10,\"d\":\"\",\"se\":\"If &ldquo;123&rdquo; means &ldquo;cat dog rat&rdquo;, &ldquo;234&rdquo; means &ldquo;dog rat bat&rdquo;, and &ldquo;345&rdquo; means &ldquo;rat bat mat&rdquo;, then which digit means &ldquo;bat&rdquo;?\",\"sh\":\"यदि &quot;123&quot; का अर्थ &quot;cat dog rat&quot;, &quot;234&quot; का अर्थ &quot;dog rat bat&quot;, और &quot;345&quot; का अर्थ &quot;rat bat mat&quot; है, तो &quot;bat&quot; का अर्थ कौन सा अंक है?\",\"oe\":[\"3\",\"2\",\"4\",\"5\"],\"oh\":[\"3\",\"2\",\"4\",\"5\"],\"a\":2,\"ee\":\"'rat' is present in all three, so '3' is 'rat'. Comparing the 2nd and 3rd, 'bat' is common along with 'rat', and the common digit left is '4'. Thus, '4' means 'bat'.\",\"eh\":\"'rat' तीनों में मौजूद है, इसलिए '3' का अर्थ 'rat' है। दूसरे और तीसरे की तुलना करने पर 'bat' आम है, और बचा हुआ आम अंक '4' है। इस प्रकार, '4' का अर्थ 'bat' है।\"},{\"n\":11,\"d\":\"\",\"se\":\"If &ldquo;BAG&rdquo; is coded as &ldquo;YZT&rdquo;, then &ldquo;CAR&rdquo; is coded as:\",\"sh\":\"यदि &quot;BAG&quot; को &quot;YZT&quot; के रूप में कोडित किया गया है, तो &quot;CAR&quot; को कैसे कोडित किया जाएगा:\",\"oe\":[\"XZJ\",\"YZI\",\"WYI\",\"XZI\"],\"oh\":[\"XZJ\",\"YZI\",\"WYI\",\"XZI\"],\"a\":3,\"ee\":\"The code uses reverse/opposite alphabet letters (A=Z, B=Y, C=X... G=T, R=I). Therefore, CAR = XZI.\",\"eh\":\"कूट विपरीत वर्णमाला अक्षरों (A=Z, B=Y, C=X... G=T, R=I) का उपयोग करता है। इसलिए, CAR = XZI।\"},{\"n\":12,\"d\":\"\",\"se\":\"If &ldquo;GIRL&rdquo; is coded as &ldquo;HKSM&rdquo;, then &ldquo;BOY&rdquo; is coded as:\",\"sh\":\"यदि &quot;GIRL&quot; को &quot;HKSM&quot; के रूप में कोडित किया गया है, तो &quot;BOY&quot; को कैसे कोडित किया जाएगा:\",\"oe\":[\"CPZ\",\"CPY\",\"CQZ\",\"BQZ\"],\"oh\":[\"CPZ\",\"CPY\",\"CQZ\",\"BQZ\"],\"a\":0,\"ee\":\"Each letter shifts +1.\",\"eh\":\"प्रत्येक अक्षर +1 से आगे बढ़ता है।\"},{\"n\":13,\"d\":\"\",\"se\":\"In a certain code, &ldquo;WINDOW&rdquo; is written as &ldquo;XJOEPX&rdquo;. How is &ldquo;FLOOR&rdquo; written?\",\"sh\":\"एक निश्चित कूट में, &quot;WINDOW&quot; को &quot;XJOEPX&quot; लिखा जाता है। &quot;FLOOR&quot; को कैसे लिखा जाएगा?\",\"oe\":[\"GMPPR\",\"GMPPS\",\"HNPPT\",\"GLPPS\"],\"oh\":[\"GMPPR\",\"GMPPS\",\"HNPPT\",\"GLPPS\"],\"a\":1,\"ee\":\"Each letter shifts +1.\",\"eh\":\"प्रत्येक अक्षर +1 से आगे बढ़ता है।\"},{\"n\":14,\"d\":\"\",\"se\":\"If &ldquo;CAT&rdquo; is coded as &ldquo;DBU&rdquo;, then &ldquo;DOG&rdquo; is coded as:\",\"sh\":\"यदि &quot;CAT&quot; को &quot;DBU&quot; के रूप में कोडित किया गया है, तो &quot;DOG&quot; को कैसे कोडित किया जाएगा:\",\"oe\":[\"EPI\",\"EQH\",\"EPH\",\"FPH\"],\"oh\":[\"EPI\",\"EQH\",\"EPH\",\"FPH\"],\"a\":2,\"ee\":\"Each letter shifts +1.\",\"eh\":\"प्रत्येक अक्षर +1 से आगे बढ़ता है।\"},{\"n\":15,\"d\":\"\",\"se\":\"If &ldquo;PAPER&rdquo; is coded as &ldquo;QBQFS&rdquo;, then &ldquo;PENCIL&rdquo; is coded as:\",\"sh\":\"यदि &quot;PAPER&quot; को &quot;QBQFS&quot; के रूप में कोडित किया गया है, तो &quot;PENCIL&quot; को कैसे कोडित किया जाएगा:\",\"oe\":[\"QFNDJM\",\"QEODJM\",\"QFOEJM\",\"QFODJM\"],\"oh\":[\"QFNDJM\",\"QEODJM\",\"QFOEJM\",\"QFODJM\"],\"a\":3,\"ee\":\"Each letter shifts +1.\",\"eh\":\"प्रत्येक अक्षर +1 से आगे बढ़ता है।\"},{\"n\":16,\"d\":\"\",\"se\":\"Pointing to a boy, a woman said, &ldquo;He is the son of my father&rsquo;s only daughter.&rdquo; How is the boy related to the woman?\",\"sh\":\"एक लड़के की ओर इशारा करते हुए एक महिला ने कहा, &quot;वह मेरे पिता की इकलौती बेटी का बेटा है।&quot; लड़का महिला से कैसे संबंधित है?\",\"oe\":[\"Son\",\"Nephew\",\"Brother\",\"Grandson\"],\"oh\":[\"बेटा (Son)\",\"भतीजा/भांजा\",\"भाई\",\"पोता\"],\"a\":0,\"ee\":\"&quot;My father's only daughter&quot; is the woman herself. The boy is her son.\",\"eh\":\"&quot;मेरे पिता की इकलौती बेटी&quot; वह महिला स्वयं है। वह लड़का उसका बेटा है।\"},{\"n\":17,\"d\":\"\",\"se\":\"A is the brother of B. C is the daughter of A. D is the son of B. How are C and D related?\",\"sh\":\"A, B का भाई है। C, A की बेटी है। D, B का बेटा है। C और D आपस में कैसे संबंधित हैं?\",\"oe\":[\"Uncle and Niece\",\"Cousins\",\"Nephew and Aunt\",\"Brother and Sister\"],\"oh\":[\"चाचा और भतीजी\",\"चचेरे/ममेरे भाई-बहन (Cousins)\",\"भतीजा और बुआ/मौसी\",\"भाई-बहन\"],\"a\":1,\"ee\":\"A and B are siblings. Their children, C and D, are cousins.\",\"eh\":\"A और B भाई-बहन हैं। उनके बच्चे C और D चचेरे भाई-बहन (Cousins) हैं।\"},{\"n\":18,\"d\":\"\",\"se\":\"If X is the father of Y, Y is the sister of Z, and Z is the son of W, then how is W related to X?\",\"sh\":\"यदि X, Y का पिता है, Y, Z की बहन है, और Z, W का बेटा है, तो W, X से कैसे संबंधित है?\",\"oe\":[\"Brother\",\"Husband\",\"Wife\",\"Sister\"],\"oh\":[\"भाई\",\"पति\",\"पत्नी (Wife)\",\"बहन\"],\"a\":2,\"ee\":\"Y and Z are siblings. X is their father and W is their mother. Hence, W is the wife of X.\",\"eh\":\"Y और Z भाई-बहन हैं। X उनके पिता हैं और W उनकी माँ है। अतः W, X की पत्नी है।\"},{\"n\":19,\"d\":\"\",\"se\":\"Pointing to a lady, a man said, &ldquo;She is the daughter of the only brother of my mother.&rdquo; How is the lady related to the man?\",\"sh\":\"एक महिला की ओर इशारा करते हुए एक आदमी ने कहा, &quot;वह मेरी माँ के इकलौते भाई की बेटी है।&quot; वह महिला उस आदमी से कैसे संबंधित है?\",\"oe\":[\"Aunt\",\"Sister\",\"Niece\",\"Cousin\"],\"oh\":[\"बुआ/मौसी\",\"बहन\",\"भतीजी\",\"चचेरी/ममेरी बहन (Cousin)\"],\"a\":3,\"ee\":\"&quot;Only brother of my mother&quot; is the maternal uncle. His daughter is the man's cousin.\",\"eh\":\"&quot;मेरी माँ का इकलौता भाई&quot; मामा है। मामा की बेटी ममेरी बहन (Cousin) होती है।\"},{\"n\":20,\"d\":\"\",\"se\":\"A is the mother of B. B is the father of C. C is the sister of D. How is A related to D?\",\"sh\":\"A, B की माँ है। B, C का पिता है। C, D की बहन है। A, D से कैसे संबंधित है?\",\"oe\":[\"Grandmother\",\"Mother\",\"Aunt\",\"Sister\"],\"oh\":[\"दादी (Grandmother)\",\"माँ\",\"बुआ/मौसी\",\"बहन\"],\"a\":0,\"ee\":\"C and D are siblings. B is their father. A is B's mother, making A the grandmother of D.\",\"eh\":\"C और D भाई-बहन हैं। B उनके पिता हैं। A, B की माँ है, जिससे A, D की दादी बन जाती है।\"},{\"n\":21,\"d\":\"\",\"se\":\"If P is the brother of Q, R is the father of P, and S is the mother of Q, then how is S related to R?\",\"sh\":\"यदि P, Q का भाई है, R, P का पिता है, और S, Q की माँ है, तो S, R से कैसे संबंधित है?\",\"oe\":[\"Sister\",\"Wife\",\"Daughter\",\"Mother\"],\"oh\":[\"बहन\",\"पत्नी (Wife)\",\"बेटी\",\"माँ\"],\"a\":1,\"ee\":\"P and Q are siblings. R is their father and S is their mother. Thus, S is the wife of R.\",\"eh\":\"P और Q भाई-बहन हैं। R उनके पिता हैं और S उनकी माँ है। इस प्रकार, S, R की पत्नी है।\"},{\"n\":22,\"d\":\"\",\"se\":\"M is the son of N. N is the daughter of O. O is the son of P. How is M related to P?\",\"sh\":\"M, N का बेटा है। N, O की बेटी है। O, P का बेटा है। M, P से कैसे संबंधित है?\",\"oe\":[\"Son\",\"Son-in-law\",\"Great-grandson\",\"Grandson\"],\"oh\":[\"बेटा\",\"दामाद\",\"परपोता/पड़नाती (Great-grandson)\",\"पोता\"],\"a\":2,\"ee\":\"M is O's grandson, and since O is P's son, M is P's great-grandson.\",\"eh\":\"M, O का नाती है, और चूँकि O, P का बेटा है, इसलिए M, P का पड़नाती (Great-grandson) है।\"},{\"n\":23,\"d\":\"\",\"se\":\"Pointing to a photograph, a woman said, &ldquo;He is the son of my mother&rsquo;s only daughter.&rdquo; How is the person in the photograph related to the woman?\",\"sh\":\"एक तस्वीर की ओर इशारा करते हुए एक महिला ने कहा, &quot;वह मेरी माँ की इकलौती बेटी का बेटा है।&quot; तस्वीर में मौजूद व्यक्ति महिला से कैसे संबंधित है?\",\"oe\":[\"Grandson\",\"Brother\",\"Nephew\",\"Son\"],\"oh\":[\"पोता\",\"भाई\",\"भतीजा/भांजा\",\"बेटा (Son)\"],\"a\":3,\"ee\":\"&quot;Mother's only daughter&quot; is the woman herself. The person is her son.\",\"eh\":\"&quot;माँ की इकलौती बेटी&quot; वह महिला स्वयं है। वह व्यक्ति उसका बेटा है।\"},{\"n\":24,\"d\":\"\",\"se\":\"A is the brother of B. C is the mother of A. D is the father of C. How is D related to B?\",\"sh\":\"A, B का भाई है। C, A की माँ है। D, C का पिता है। D, B से कैसे संबंधित है?\",\"oe\":[\"Grandfather\",\"Father\",\"Brother\",\"Uncle\"],\"oh\":[\"नाना (Maternal Grandfather)\",\"पिता\",\"भाई\",\"चाचा\"],\"a\":0,\"ee\":\"A and B are siblings. C is their mother. D is C's father, making him the maternal grandfather of B.\",\"eh\":\"A और B भाई-बहन हैं। C उनकी माँ है। D, C का पिता है, जिससे वह B का नाना (Grandfather) बन जाता है।\"},{\"n\":25,\"d\":\"\",\"se\":\"If R is the sister of S, S is the father of T, and T is the mother of U, then how is R related to U?\",\"sh\":\"यदि R, S की बहन है, S, T का पिता है, और T, U की माँ है, तो R, U से कैसे संबंधित है?\",\"oe\":[\"Aunt\",\"Grandaunt\",\"Grandmother\",\"Sister\"],\"oh\":[\"बुआ/मौसी\",\"परदादी/दादी की बहन (Grandaunt)\",\"दादी/नानी\",\"बहन\"],\"a\":1,\"ee\":\"R is the sister of U's grandfather (S). Therefore, R is U's grandaunt.\",\"eh\":\"R, U के नाना (S) की बहन है। इसलिए, R, U की Grandaunt है।\"},{\"n\":26,\"d\":\"\",\"se\":\"A man walks 10 km North, turns right and walks 5 km, then turns right again and walks 10 km. How far and in which direction is he from the starting point?\",\"sh\":\"एक आदमी 10 किमी उत्तर (North) की ओर चलता है, दाएँ मुड़ता है और 5 किमी चलता है, फिर से दाएँ मुड़ता है और 10 किमी चलता है। वह अपने प्रारंभिक बिंदु से कितनी दूर और किस दिशा में है?\",\"oe\":[\"15 km North\",\"10 km West\",\"5 km East\",\"5 km West\"],\"oh\":[\"15 किमी उत्तर\",\"10 किमी पश्चिम\",\"5 किमी पूर्व (East)\",\"5 किमी पश्चिम\"],\"a\":2,\"ee\":\"The North 10 km and South 10 km cancel out, leaving him 5 km East.\",\"eh\":\"उत्तर 10 किमी और दक्षिण 10 किमी एक दूसरे को रद्द कर देते हैं, जिससे वह 5 किमी पूर्व में रह जाता है।\"},{\"n\":27,\"d\":\"\",\"se\":\"A person starts from point A, walks 6 km South, turns left and walks 8 km, then turns left again and walks 6 km. What is his distance and direction from point A?\",\"sh\":\"एक व्यक्ति बिंदु A से शुरू करता है, 6 किमी दक्षिण (South) की ओर चलता है, बाएँ मुड़ता है और 8 किमी चलता है, फिर से बाएँ मुड़ता है और 6 किमी चलता है। बिंदु A से उसकी दूरी और दिशा क्या है?\",\"oe\":[\"8 km West\",\"10 km South\",\"6 km North\",\"8 km East\"],\"oh\":[\"8 किमी पश्चिम\",\"10 किमी दक्षिण\",\"6 किमी उत्तर\",\"8 किमी पूर्व (East)\"],\"a\":3,\"ee\":\"Left from South is East (8 km), left from East is North (6 km). South 6 and North 6 cancel out. He is 8 km East.\",\"eh\":\"दक्षिण से बायां मोड़ पूर्व (8 किमी) होता है, पूर्व से बायां मोड़ उत्तर (6 किमी) होता है। दक्षिण 6 और उत्तर 6 रद्द हो जाते हैं। वह 8 किमी पूर्व में है।\"},{\"n\":28,\"d\":\"\",\"se\":\"A boy walks 3 km East, then 4 km South, then 3 km West. How far is he from the starting point?\",\"sh\":\"एक लड़का 3 किमी पूर्व (East), फिर 4 किमी दक्षिण (South), फिर 3 किमी पश्चिम (West) की ओर चलता है। वह अपने प्रारंभिक बिंदु से कितनी दूर है?\",\"oe\":[\"4 km\",\"5 km\",\"3 km\",\"2 km\"],\"oh\":[\"4 किमी\",\"5 किमी\",\"3 किमी\",\"2 किमी\"],\"a\":0,\"ee\":\"The East 3 km and West 3 km cancel out. He is exactly 4 km South of the start.\",\"eh\":\"पूर्व 3 किमी और पश्चिम 3 किमी रद्द हो जाते हैं। वह प्रारंभिक बिंदु से ठीक 4 किमी दक्षिण में है।\"},{\"n\":29,\"d\":\"\",\"se\":\"A car travels 15 km North, then 20 km East, then 15 km South. What is its net displacement from the start?\",\"sh\":\"एक कार 15 किमी उत्तर (North), फिर 20 किमी पूर्व (East), फिर 15 किमी दक्षिण (South) की ओर यात्रा करती है। प्रारंभ से इसका शुद्ध विस्थापन (net displacement) क्या है?\",\"oe\":[\"20 km West\",\"20 km East\",\"15 km South\",\"15 km North\"],\"oh\":[\"20 किमी पश्चिम\",\"20 किमी पूर्व (East)\",\"15 किमी दक्षिण\",\"15 किमी उत्तर\"],\"a\":1,\"ee\":\"The North and South movements cancel each other out.\",\"eh\":\"उत्तर और दक्षिण की चाल एक दूसरे को रद्द कर देती है।\"},{\"n\":30,\"d\":\"\",\"se\":\"A man is facing North. He turns 90° clockwise, then 180° anticlockwise, and finally 90° clockwise. Which direction is he facing now?\",\"sh\":\"एक आदमी उत्तर (North) की ओर मुख किए हुए है। वह 90° दक्षिणावर्त (clockwise), फिर 180° वामावर्त (anticlockwise), और अंत में 90° दक्षिणावर्त घूमता है। अब उसका मुख किस दिशा में है?\",\"oe\":[\"West\",\"East\",\"North\",\"South\"],\"oh\":[\"पश्चिम\",\"पूर्व\",\"उत्तर (North)\",\"दक्षिण\"],\"a\":2,\"ee\":\"+90° - 180° + 90° = 0°. He is back facing his original direction, North.\",\"eh\":\"+90° - 180° + 90° = 0°। वह वापस अपनी मूल दिशा, उत्तर की ओर लौट आता है।\"},{\"n\":31,\"d\":\"\",\"se\":\"From a point, a person goes 5 km East, then 12 km North. What is the shortest straight-line distance to the starting point?\",\"sh\":\"एक बिंदु से, एक व्यक्ति 5 किमी पूर्व (East), फिर 12 किमी उत्तर (North) की ओर जाता है। प्रारंभिक बिंदु से सबसे छोटी सीधी रेखा की दूरी क्या है?\",\"oe\":[\"17 km\",\"7 km\",\"10 km\",\"13 km\"],\"oh\":[\"17 किमी\",\"7 किमी\",\"10 किमी\",\"13 किमी\"],\"a\":3,\"ee\":\"Using Pythagoras theorem: √(5² + 12²) = √(25 + 144) = √169 = 13 km.\",\"eh\":\"पाइथागोरस प्रमेय का उपयोग करके: √(5² + 12²) = √(25 + 144) = √169 = 13 किमी।\"},{\"n\":32,\"d\":\"\",\"se\":\"Point A is 10 m North of B. Point C is 5 m East of B. Point D is 3 m South of C. What is the relative direction of D as seen from A?\",\"sh\":\"बिंदु A, B के 10 मीटर उत्तर में है। बिंदु C, B के 5 मीटर पूर्व में है। बिंदु D, C के 3 मीटर दक्षिण में है। A से देखने पर D की सापेक्ष दिशा क्या है?\",\"oe\":[\"South-East\",\"North-East\",\"South-West\",\"North-West\"],\"oh\":[\"दक्षिण-पूर्व (South-East)\",\"उत्तर-पूर्व\",\"दक्षिण-पश्चिम\",\"उत्तर-पश्चिम\"],\"a\":0,\"ee\":\"D is East of A's longitude and South of A's latitude. Thus, it is South-East.\",\"eh\":\"D, A के देशांतर के पूर्व में और A के अक्षांश के दक्षिण में है। इस प्रकार, यह दक्षिण-पूर्व है।\"},{\"n\":33,\"d\":\"\",\"se\":\"A man walks 10 m towards East, turns right and walks 15 m, then turns left and walks 10 m. In which direction is he now with respect to his starting point?\",\"sh\":\"एक आदमी 10 मीटर पूर्व की ओर चलता है, दाएँ मुड़ता है और 15 मीटर चलता है, फिर बाएँ मुड़ता है और 10 मीटर चलता है। वह अपने प्रारंभिक बिंदु के संबंध में अब किस दिशा में है?\",\"oe\":[\"North-East\",\"South-East\",\"North-West\",\"South-West\"],\"oh\":[\"उत्तर-पूर्व\",\"दक्षिण-पूर्व (South-East)\",\"उत्तर-पश्चिम\",\"दक्षिण-पश्चिम\"],\"a\":1,\"ee\":\"He has moved a total of 20 m East and 15 m South. He is in the South-East quadrant.\",\"eh\":\"वह कुल 20 मीटर पूर्व और 15 मीटर दक्षिण में चला गया है। वह दक्षिण-पूर्व चतुर्थांश में है।\"},{\"n\":34,\"d\":\"\",\"se\":\"A person starts from his house and walks 2 km North, turns left and walks 3 km, turns left again and walks 2 km. How far is he from his house?\",\"sh\":\"एक व्यक्ति अपने घर से चलना शुरू करता है और 2 किमी उत्तर की ओर चलता है, बाएँ मुड़ता है और 3 किमी चलता है, फिर से बाएँ मुड़ता है और 2 किमी चलता है। वह अपने घर से कितनी दूर है?\",\"oe\":[\"5 km\",\"2 km\",\"3 km\",\"4 km\"],\"oh\":[\"5 किमी\",\"2 किमी\",\"3 किमी\",\"4 किमी\"],\"a\":2,\"ee\":\"Left of North is West. Left of West is South. North 2 and South 2 cancel out, leaving him 3 km West.\",\"eh\":\"उत्तर के बाईं ओर पश्चिम है। पश्चिम के बाईं ओर दक्षिण है। उत्तर 2 और दक्षिण 2 रद्द हो जाते हैं, जिससे वह 3 किमी पश्चिम में रह जाता है।\"},{\"n\":35,\"d\":\"\",\"se\":\"A man walks 5 km East, turns North and walks 10 km, then turns West and walks 5 km. In which direction is he relative to his starting point?\",\"sh\":\"एक आदमी 5 किमी पूर्व की ओर चलता है, उत्तर की ओर मुड़ता है और 10 किमी चलता है, फिर पश्चिम की ओर मुड़ता है और 5 किमी चलता है। वह अपने प्रारंभिक बिंदु के सापेक्ष किस दिशा में है?\",\"oe\":[\"South\",\"East\",\"West\",\"North\"],\"oh\":[\"दक्षिण\",\"पूर्व\",\"पश्चिम\",\"उत्तर (North)\"],\"a\":3,\"ee\":\"The East and West movements cancel out. He is 10 km straight North.\",\"eh\":\"पूर्व और पश्चिम की चालें रद्द हो जाती हैं। वह सीधे 10 किमी उत्तर में है।\"},{\"n\":36,\"d\":\"\",\"se\":\"Find the next term in the series: 2, 5, 10, 17, 26, ?\",\"sh\":\"श्रृंखला में अगला पद ज्ञात कीजिए: 2, 5, 10, 17, 26, ?\",\"oe\":[\"37\",\"34\",\"35\",\"36\"],\"oh\":[\"37\",\"34\",\"35\",\"36\"],\"a\":0,\"ee\":\"The differences between terms are consecutive odd numbers: +3, +5, +7, +9. The next difference is +11. 26 + 11 = 37.\",\"eh\":\"पदों के बीच का अंतर लगातार विषम संख्याएं हैं: +3, +5, +7, +9। अगला अंतर +11 है। 26 + 11 = 37।\"},{\"n\":37,\"d\":\"\",\"se\":\"Find the missing term in the series: 1, 8, 27, 64, 125, ?\",\"sh\":\"श्रृंखला में लुप्त पद ज्ञात कीजिए: 1, 8, 27, 64, 125, ?\",\"oe\":[\"180\",\"216\",\"200\",\"225\"],\"oh\":[\"180\",\"216\",\"200\",\"225\"],\"a\":1,\"ee\":\"This is a series of perfect cubes (1³, 2³, 3³, 4³, 5³). The next is 6³ = 216.\",\"eh\":\"यह पूर्ण घनों (1³, 2³, 3³, 4³, 5³) की एक श्रृंखला है। अगला 6³ = 216 है।\"},{\"n\":38,\"d\":\"\",\"se\":\"Find the next term in the series: 3, 7, 15, 31, 63, ?\",\"sh\":\"श्रृंखला में अगला पद ज्ञात कीजिए: 3, 7, 15, 31, 63, ?\",\"oe\":[\"125\",\"129\",\"127\",\"131\"],\"oh\":[\"125\",\"129\",\"127\",\"131\"],\"a\":2,\"ee\":\"The pattern is (n × 2) + 1. (63 × 2) + 1 = 127.\",\"eh\":\"पैटर्न (n × 2) + 1 है। (63 × 2) + 1 = 127।\"},{\"n\":39,\"d\":\"\",\"se\":\"Find the next term in the series: 1, 4, 9, 16, 25, ?\",\"sh\":\"श्रृंखला में अगला पद ज्ञात कीजिए: 1, 4, 9, 16, 25, ?\",\"oe\":[\"30\",\"35\",\"32\",\"36\"],\"oh\":[\"30\",\"35\",\"32\",\"36\"],\"a\":3,\"ee\":\"This is a series of perfect squares (1², 2², 3²...). The next is 6² = 36.\",\"eh\":\"यह पूर्ण वर्गों (1², 2², 3²...) की एक श्रृंखला है। अगला 6² = 36 है।\"},{\"n\":40,\"d\":\"\",\"se\":\"Which number comes next in the sequence? 2, 3, 5, 7, 11, 13, ?\",\"sh\":\"अनुक्रम में अगली संख्या कौन सी आएगी? 2, 3, 5, 7, 11, 13, ?\",\"oe\":[\"17\",\"19\",\"15\",\"23\"],\"oh\":[\"17\",\"19\",\"15\",\"23\"],\"a\":0,\"ee\":\"This is a simple sequence of consecutive prime numbers.\",\"eh\":\"यह लगातार अभाज्य (prime) संख्याओं का एक सरल अनुक्रम है।\"},{\"n\":41,\"d\":\"\",\"se\":\"Find the missing term in the alphabetical series: AZ, BY, CX, DW, ?\",\"sh\":\"वर्णमाला श्रृंखला में लुप्त पद ज्ञात कीजिए: AZ, BY, CX, DW, ?\",\"oe\":[\"EW\",\"EV\",\"EU\",\"FU\"],\"oh\":[\"EW\",\"EV\",\"EU\",\"FU\"],\"a\":1,\"ee\":\"First letters are A, B, C, D (next is E). Second letters are Z, Y, X, W (next is V).\",\"eh\":\"पहले अक्षर A, B, C, D हैं (अगला E है)। दूसरे अक्षर Z, Y, X, W हैं (अगला V है)।\"},{\"n\":42,\"d\":\"\",\"se\":\"Find the odd one out in the following group of numbers:\",\"sh\":\"संख्याओं के निम्नलिखित समूह में बेजोड़ (Odd one out) ज्ञात कीजिए:\",\"oe\":[\"13\",\"11\",\"15\",\"17\"],\"oh\":[\"13\",\"11\",\"15\",\"17\"],\"a\":2,\"ee\":\"15 is a composite number (divisible by 3 and 5), while all others are prime.\",\"eh\":\"15 एक भाज्य संख्या है (3 और 5 से विभाज्य), जबकि अन्य सभी अभाज्य हैं।\"},{\"n\":43,\"d\":\"\",\"se\":\"Find the next term in the alphabetical series: A, C, F, J, O, ?\",\"sh\":\"वर्णमाला श्रृंखला में अगला पद ज्ञात कीजिए: A, C, F, J, O, ?\",\"oe\":[\"T\",\"V\",\"W\",\"U\"],\"oh\":[\"T\",\"V\",\"W\",\"U\"],\"a\":3,\"ee\":\"The positional gaps increase by 1 each time (+2, +3, +4, +5). O (15) + 6 = U (21).\",\"eh\":\"स्थितीय अंतराल हर बार 1 से बढ़ जाता है (+2, +3, +4, +5)। O (15) + 6 = U (21)।\"},{\"n\":44,\"d\":\"\",\"se\":\"Find the missing term in the series: 4, 9, 16, 25, 36, ?\",\"sh\":\"श्रृंखला में लुप्त पद ज्ञात कीजिए: 4, 9, 16, 25, 36, ?\",\"oe\":[\"49\",\"64\",\"40\",\"45\"],\"oh\":[\"49\",\"64\",\"40\",\"45\"],\"a\":0,\"ee\":\"Squares of consecutive integers starting from 2. The next is 7² = 49.\",\"eh\":\"2 से शुरू होने वाले लगातार पूर्णांकों के वर्ग। अगला 7² = 49 है।\"},{\"n\":45,\"d\":\"\",\"se\":\"Find the next term in the series: 2, 6, 14, 30, 62, ?\",\"sh\":\"श्रृंखला में अगला पद ज्ञात कीजिए: 2, 6, 14, 30, 62, ?\",\"oe\":[\"120\",\"126\",\"128\",\"124\"],\"oh\":[\"120\",\"126\",\"128\",\"124\"],\"a\":1,\"ee\":\"The pattern is (n × 2) + 2. (62 × 2) + 2 = 126.\",\"eh\":\"पैटर्न (n × 2) + 2 है। (62 × 2) + 2 = 126।\"},{\"n\":46,\"d\":\"\",\"se\":\"Pen : Write :: Knife : ?\",\"sh\":\"पेन : लिखना :: चाकू : ?\",\"oe\":[\"Sharpen\",\"Stab\",\"Cut\",\"Draw\"],\"oh\":[\"तेज करना\",\"घोंपना\",\"काटना (Cut)\",\"चित्र बनाना\"],\"a\":2,\"ee\":\"A pen's primary function is to write; a knife's primary function is to cut.\",\"eh\":\"पेन का प्राथमिक कार्य लिखना है; चाकू का प्राथमिक कार्य काटना है।\"},{\"n\":47,\"d\":\"\",\"se\":\"Doctor : Hospital :: Teacher : ?\",\"sh\":\"डॉक्टर : अस्पताल :: शिक्षक : ?\",\"oe\":[\"Students\",\"College\",\"Classroom\",\"School\"],\"oh\":[\"छात्र\",\"कॉलेज\",\"कक्षा\",\"विद्यालय (School)\"],\"a\":3,\"ee\":\"A doctor's primary workplace is a hospital; a teacher's is a school.\",\"eh\":\"डॉक्टर का प्राथमिक कार्यस्थल अस्पताल है; शिक्षक का कार्यस्थल विद्यालय है।\"},{\"n\":48,\"d\":\"\",\"se\":\"Find the odd one out:\",\"sh\":\"बेजोड़ (Odd one out) ज्ञात कीजिए:\",\"oe\":[\"Moon\",\"Proxima Centauri\",\"Sun\",\"Sirius\"],\"oh\":[\"चंद्रमा (Moon)\",\"प्रॉक्सिमा सेंटॉरी\",\"सूर्य (Sun)\",\"सिरियस\"],\"a\":0,\"ee\":\"The Moon is a natural satellite, while the others are stars.\",\"eh\":\"चंद्रमा एक प्राकृतिक उपग्रह है, जबकि अन्य सभी तारे हैं।\"},{\"n\":49,\"d\":\"\",\"se\":\"Lion : Cub :: Dog : ?\",\"sh\":\"शेर : शावक (Cub) :: कुत्ता : ?\",\"oe\":[\"Kitten\",\"Puppy\",\"Calf\",\"Foal\"],\"oh\":[\"बिल्ली का बच्चा\",\"पिल्ला (Puppy)\",\"बछड़ा\",\"बछेड़ा\"],\"a\":1,\"ee\":\"The young one of a lion is a cub; the young one of a dog is a puppy.\",\"eh\":\"शेर के बच्चे को शावक कहते हैं; कुत्ते के बच्चे को पिल्ला (Puppy) कहते हैं।\"},{\"n\":50,\"d\":\"\",\"se\":\"Book : Pages :: Tree : ?\",\"sh\":\"पुस्तक : पृष्ठ :: पेड़ : ?\",\"oe\":[\"Branches\",\"Roots\",\"Leaves\",\"Flowers\"],\"oh\":[\"शाखाएँ\",\"जड़ें\",\"पत्ते (Leaves)\",\"फूल\"],\"a\":2,\"ee\":\"A book is composed of pages; a tree's foliage is composed of leaves.\",\"eh\":\"पुस्तक पृष्ठों से बनी होती है; पेड़ के पत्ते उसके आवरण को बनाते हैं।\"},{\"n\":51,\"d\":\"\",\"se\":\"Finger : Hand :: Toe : ?\",\"sh\":\"उंगली : हाथ :: पैर की अंगुली (Toe) : ?\",\"oe\":[\"Knee\",\"Leg\",\"Ankle\",\"Foot\"],\"oh\":[\"घुटना\",\"टांग\",\"टखना\",\"पैर (Foot)\"],\"a\":3,\"ee\":\"Fingers are the digits of the hand; toes are the digits of the foot.\",\"eh\":\"उंगलियाँ हाथ का हिस्सा होती हैं; पैर की उंगलियाँ पैर (Foot) का हिस्सा होती हैं।\"},{\"n\":52,\"d\":\"\",\"se\":\"Find the odd one out:\",\"sh\":\"बेजोड़ (Odd one out) ज्ञात कीजिए:\",\"oe\":[\"Diamond\",\"Silver\",\"Platinum\",\"Gold\"],\"oh\":[\"हीरा (Diamond)\",\"चांदी\",\"प्लेटिनम\",\"सोना\"],\"a\":0,\"ee\":\"Diamond is an allotrope of carbon (non-metal), while the others are precious metals.\",\"eh\":\"हीरा कार्बन का एक अपरूप (अधातु) है, जबकि अन्य कीमती धातुएँ हैं।\"},{\"n\":53,\"d\":\"\",\"se\":\"Word : Sentence :: Letter : ?\",\"sh\":\"शब्द : वाक्य :: अक्षर (Letter) : ?\",\"oe\":[\"Alphabet\",\"Word\",\"Paragraph\",\"Page\"],\"oh\":[\"वर्णमाला\",\"शब्द (Word)\",\"पैराग्राफ\",\"पृष्ठ\"],\"a\":1,\"ee\":\"A sentence is made of words; a word is made of letters.\",\"eh\":\"एक वाक्य शब्दों से बना होता है; एक शब्द अक्षरों से बना होता है।\"},{\"n\":54,\"d\":\"\",\"se\":\"Find the odd one out:\",\"sh\":\"बेजोड़ (Odd one out) ज्ञात कीजिए:\",\"oe\":[\"225\",\"169\",\"250\",\"196\"],\"oh\":[\"225\",\"169\",\"250\",\"196\"],\"a\":2,\"ee\":\"169 (13²), 196 (14²), and 225 (15²) are perfect squares. 250 is not.\",\"eh\":\"169 (13²), 196 (14²), और 225 (15²) पूर्ण वर्ग हैं। 250 नहीं है।\"},{\"n\":55,\"d\":\"\",\"se\":\"Sun : Day :: Moon : ?\",\"sh\":\"सूर्य : दिन :: चंद्रमा : ?\",\"oe\":[\"Satellite\",\"Planet\",\"Star\",\"Night\"],\"oh\":[\"उपग्रह\",\"ग्रह\",\"तारा\",\"रात (Night)\"],\"a\":3,\"ee\":\"The Sun is the primary celestial body seen during the day; the Moon is primarily associated with the night.\",\"eh\":\"सूर्य मुख्य रूप से दिन के समय दिखाई देता है; चंद्रमा मुख्य रूप से रात से जुड़ा हुआ है।\"},{\"n\":56,\"d\":\"\",\"se\":\"A clock shows the time as 4:20. What is the angle between the hour and minute hands?\",\"sh\":\"एक घड़ी में 4:20 का समय हो रहा है। घंटे और मिनट की सुइयों के बीच का कोण क्या है?\",\"oe\":[\"10°\",\"40°\",\"20°\",\"30°\"],\"oh\":[\"10°\",\"40°\",\"20°\",\"30°\"],\"a\":0,\"ee\":\"Hour hand: (4 × 30°) + (20/2)° = 130°. Minute hand: 20 × 6° = 120°. Difference = 130° - 120° = 10°.\",\"eh\":\"घंटे की सुई: (4 × 30°) + (20/2)° = 130°। मिनट की सुई: 20 × 6° = 120°। अंतर = 130° - 120° = 10°।\"},{\"n\":57,\"d\":\"\",\"se\":\"At what time between 2 o'clock and 3 o'clock are the hands of a clock coincident (together)?\",\"sh\":\"2 बजे और 3 बजे के बीच किस समय घड़ी की सुइयां एक साथ (coincident) होंगी?\",\"oe\":[\"2:20\",\"2:10 10/11\",\"2:15\",\"2:25\"],\"oh\":[\"2:20\",\"2 बजकर 10 10/11 मिनट\",\"2:15\",\"2:25\"],\"a\":1,\"ee\":\"The minute hand must gain 10 minute-spaces over the hour hand. Time = 10 × (12/11) = 120/11 = 10 10/11 minutes past 2.\",\"eh\":\"मिनट की सुई को घंटे की सुई से 10 मिनट की दूरी तय करनी होती है। समय = 10 × (12/11) = 120/11 = 2 बजकर 10 10/11 मिनट।\"},{\"n\":58,\"d\":\"\",\"se\":\"If the day before yesterday was Friday, what day of the week will the day after tomorrow be?\",\"sh\":\"यदि बीते हुए कल से एक दिन पहले (day before yesterday) शुक्रवार था, तो आने वाले कल के बाद (day after tomorrow) सप्ताह का कौन सा दिन होगा?\",\"oe\":[\"Wednesday\",\"Monday\",\"Tuesday\",\"Thursday\"],\"oh\":[\"बुधवार\",\"सोमवार\",\"मंगलवार (Tuesday)\",\"गुरुवार\"],\"a\":2,\"ee\":\"Day before yesterday = Friday, so today is Sunday. Tomorrow is Monday, and the day after tomorrow is Tuesday.\",\"eh\":\"परसों शुक्रवार था, इसलिए आज रविवार है। कल सोमवार है, और परसों मंगलवार है।\"},{\"n\":59,\"d\":\"\",\"se\":\"If today is Monday, what day of the week will it be exactly 61 days from today?\",\"sh\":\"यदि आज सोमवार है, तो आज से ठीक 61 दिन बाद सप्ताह का कौन सा दिन होगा?\",\"oe\":[\"Thursday\",\"Wednesday\",\"Friday\",\"Saturday\"],\"oh\":[\"गुरुवार\",\"बुधवार\",\"शुक्रवार\",\"शनिवार (Saturday)\"],\"a\":3,\"ee\":\"61 divided by 7 leaves a remainder of 5. Monday + 5 days = Saturday.\",\"eh\":\"61 को 7 से विभाजित करने पर 5 शेष बचता है। सोमवार + 5 दिन = शनिवार।\"},{\"n\":61,\"d\":\"\",\"se\":\"A clock constantly loses 5 minutes every hour. If it is set right at 12:00 noon, what time will it show exactly 6 actual hours later?\",\"sh\":\"एक घड़ी हर घंटे में 5 मिनट पीछे हो जाती है। यदि इसे दोपहर 12:00 बजे सही सेट किया जाता है, तो वास्तविक समय 6 घंटे बाद होने पर यह क्या समय दिखाएगी?\",\"oe\":[\"5:30\",\"6:30\",\"5:00\",\"6:00\"],\"oh\":[\"5:30\",\"6:30\",\"5:00\",\"6:00\"],\"a\":0,\"ee\":\"It loses 5 mins × 6 hours = 30 minutes. Therefore, at 6:00 PM actual time, it will show 5:30.\",\"eh\":\"यह 5 मिनट × 6 घंटे = 30 मिनट पीछे हो जाती है। इसलिए, वास्तविक समय शाम 6:00 बजे, यह 5:30 दिखाएगी।\"},{\"n\":62,\"d\":\"\",\"se\":\"A clock shows the time as 3:15. What is the acute angle between the hour and minute hands?\",\"sh\":\"एक घड़ी 3:15 का समय दिखाती है। घंटे और मिनट की सुइयों के बीच का न्यून कोण (acute angle) क्या है?\",\"oe\":[\"30°\",\"7.5°\",\"22.5°\",\"15°\"],\"oh\":[\"30°\",\"7.5°\",\"22.5°\",\"15°\"],\"a\":1,\"ee\":\"Hour hand: (3 × 30°) + 7.5° = 97.5°. Minute hand: 90°. Difference = 7.5°.\",\"eh\":\"घंटे की सुई: (3 × 30°) + 7.5° = 97.5°। मिनट की सुई: 90°। अंतर = 7.5°।\"},{\"n\":63,\"d\":\"\",\"se\":\"If 1st January 2025 was a Wednesday, what day of the week will 1st April 2025 be? (Assume standard non-leap year)\",\"sh\":\"यदि 1 जनवरी 2025 को बुधवार था, तो 1 अप्रैल 2025 को सप्ताह का कौन सा दिन होगा? (मान लें कि यह सामान्य गैर-लीप वर्ष है)\",\"oe\":[\"Wednesday\",\"Monday\",\"Tuesday\",\"Thursday\"],\"oh\":[\"बुधवार\",\"सोमवार\",\"मंगलवार (Tuesday)\",\"गुरुवार\"],\"a\":2,\"ee\":\"Days remaining: Jan (30), Feb (28), Mar (31), Apr (1). Total = 90 days. 90 ÷ 7 leaves a remainder of 6. Wednesday + 6 days = Tuesday.\",\"eh\":\"शेष दिन: जनवरी (30), फरवरी (28), मार्च (31), अप्रैल (1)। कुल = 90 दिन। 90 ÷ 7 से 6 शेष बचता है। बुधवार + 6 दिन = मंगलवार।\"},{\"n\":64,\"d\":\"\",\"se\":\"What is the exact number of days from 1st January to 15th August (including both dates) in a leap year?\",\"sh\":\"एक लीप वर्ष में 1 जनवरी से 15 अगस्त तक (दोनों तिथियों सहित) दिनों की सटीक संख्या क्या है?\",\"oe\":[\"229\",\"227\",\"230\",\"228\"],\"oh\":[\"229\",\"227\",\"230\",\"228\"],\"a\":3,\"ee\":\"Jan(31) + Feb(29) + Mar(31) + Apr(30) + May(31) + Jun(30) + Jul(31) + Aug(15) = 228 days.\",\"eh\":\"जन(31) + फर(29) + मार्च(31) + अप्रै(30) + मई(31) + जून(30) + जुला(31) + अग(15) = 228 दिन।\"},{\"n\":65,\"d\":\"\",\"se\":\"A clock shows 8:00 AM. If it steadily gains 10 minutes every hour, what time will it display when the actual time is 12:00 noon?\",\"sh\":\"एक घड़ी सुबह 8:00 बजे का समय दिखाती है। यदि यह हर घंटे 10 मिनट आगे हो जाती है, तो वास्तविक समय दोपहर 12:00 बजे होने पर यह क्या समय दिखाएगी?\",\"oe\":[\"12:40 PM\",\"12:30 PM\",\"1:00 PM\",\"12:50 PM\"],\"oh\":[\"12:40 PM\",\"12:30 PM\",\"1:00 PM\",\"12:50 PM\"],\"a\":0,\"ee\":\"In 4 hours, it gains 40 minutes. It will show 12:40 PM.\",\"eh\":\"4 घंटे में, यह 40 मिनट आगे हो जाती है। यह 12:40 PM दिखाएगी।\"},{\"n\":66,\"d\":\"\",\"se\":\"Five people (A, B, C, D, E) are standing in a straight line facing North. D is to the left of A. A is to the left of B. E is sitting exactly between A and B. C is to the right of B. Who is sitting at the extreme left end?\",\"sh\":\"पाँच व्यक्ति (A, B, C, D, E) उत्तर की ओर मुख करके एक सीधी रेखा में खड़े हैं। D, A के बाईं ओर है। A, B के बाईं ओर है। E, A और B के ठीक बीच में खड़ा है। C, B के दाईं ओर है। चरम बाएँ छोर (extreme left) पर कौन खड़ा है?\",\"oe\":[\"C\",\"D\",\"A\",\"E\"],\"oh\":[\"C\",\"D\",\"A\",\"E\"],\"a\":1,\"ee\":\"The logical left-to-right order is D, A, E, B, C. D is at the extreme left.\",\"eh\":\"तार्किक बाएँ-से-दाएँ क्रम है: D, A, E, B, C। D चरम बाएँ छोर पर है।\"},{\"n\":67,\"d\":\"\",\"se\":\"In a family, there is a married couple. The husband's sister is the biological daughter of the wife's father. How is the husband related to the wife's father?\",\"sh\":\"एक परिवार में, एक विवाहित जोड़ा है। पति की बहन पत्नी के पिता की जैविक बेटी (biological daughter) है। पति का पत्नी के पिता से क्या संबंध है?\",\"oe\":[\"Brother\",\"Nephew\",\"Son-in-law\",\"Son\"],\"oh\":[\"भाई\",\"भतीजा\",\"दामाद (Son-in-law)\",\"बेटा\"],\"a\":2,\"ee\":\"The wife's father is the husband's father-in-law. Thus, the husband is the son-in-law.\",\"eh\":\"पत्नी का पिता पति का ससुर होता है। इस प्रकार, पति दामाद है।\"},{\"n\":68,\"d\":\"\",\"se\":\"In a row of 40 students, Ravi is 15th from the left and Suresh is 20th from the right. How many students are sitting between them?\",\"sh\":\"40 छात्रों की एक पंक्ति में, रवि बाएँ से 15वें और सुरेश दाएँ से 20वें स्थान पर है। उनके बीच कितने छात्र बैठे हैं?\",\"oe\":[\"7\",\"8\",\"6\",\"5\"],\"oh\":[\"7\",\"8\",\"6\",\"5\"],\"a\":3,\"ee\":\"Suresh's position from the left = 40 - 20 + 1 = 21st. The students between 15th and 21st are those at 16, 17, 18, 19, and 20 (Total = 5).\",\"eh\":\"बाएँ से सुरेश का स्थान = 40 - 20 + 1 = 21वाँ। 15वें और 21वें स्थान के बीच के छात्र वे हैं जो 16, 17, 18, 19 और 20 (कुल = 5) पर हैं।\"},{\"n\":69,\"d\":\"\",\"se\":\"Five boxes are stacked vertically. Box D is above Box A. Box A is above Box B. Box B is above Box C. Box E is stacked exactly between Box A and Box B. Which box is at the absolute top of the stack?\",\"sh\":\"पाँच बक्से (boxes) लंबवत रखे गए हैं। बॉक्स D, बॉक्स A के ऊपर है। बॉक्स A, बॉक्स B के ऊपर है। बॉक्स B, बॉक्स C के ऊपर है। बॉक्स E, बॉक्स A और बॉक्स B के ठीक बीच में रखा गया है। स्टैक के बिल्कुल शीर्ष (top) पर कौन सा बॉक्स है?\",\"oe\":[\"D\",\"A\",\"C\",\"E\"],\"oh\":[\"D\",\"A\",\"C\",\"E\"],\"a\":0,\"ee\":\"The top-to-bottom order is D, A, E, B, C. Box D is at the top.\",\"eh\":\"ऊपर-से-नीचे का क्रम है: D, A, E, B, C। बॉक्स D शीर्ष पर है।\"},{\"n\":70,\"d\":\"\",\"se\":\"In a queue, Ramesh is standing 12th from the front and 18th from the back. How many total people are standing in the queue?\",\"sh\":\"एक कतार में, रमेश आगे से 12वें और पीछे से 18वें स्थान पर खड़ा है। कतार में कुल कितने लोग खड़े हैं?\",\"oe\":[\"30\",\"29\",\"31\",\"28\"],\"oh\":[\"30\",\"29\",\"31\",\"28\"],\"a\":1,\"ee\":\"Total = (Front Position + Back Position) - 1 = 12 + 18 - 1 = 29.\",\"eh\":\"कुल = (सामने का स्थान + पीछे का स्थान) - 1 = 12 + 18 - 1 = 29।\"},{\"n\":71,\"d\":\"\",\"se\":\"<em>Statements:</em> All pens are stationary. Some stationary are books. <em>Conclusions:</em> I. Some books are pens. II. All pens are books.\",\"sh\":\"<em>कथन:</em> सभी पेन स्टेशनरी हैं। कुछ स्टेशनरी किताबें हैं। <em>निष्कर्ष:</em> I. कुछ किताबें पेन हैं। II. सभी पेन किताबें हैं।\",\"oe\":[\"Only I follows\",\"Only II follows\",\"Both follow\",\"Neither follows\"],\"oh\":[\"केवल I अनुसरण करता है\",\"केवल II अनुसरण करता है\",\"दोनों अनुसरण करते हैं\",\"कोई भी अनुसरण नहीं करता है\"],\"a\":3,\"ee\":\"The subset of &quot;books&quot; intersecting with &quot;stationary&quot; does not necessarily intersect with the &quot;pens&quot; subset inside stationary.\",\"eh\":\"&quot;किताबों&quot; का उपसमूह &quot;स्टेशनरी&quot; के साथ प्रतिच्छेद करता है, लेकिन जरूरी नहीं कि वह &quot;पेन&quot; के साथ प्रतिच्छेद करे।\"},{\"n\":72,\"d\":\"\",\"se\":\"<em>Statements:</em> Some cats are dogs. All dogs are animals. <em>Conclusions:</em> I. Some cats are animals. II. All cats are animals.\",\"sh\":\"<em>कथन:</em> कुछ बिल्लियाँ कुत्ते हैं। सभी कुत्ते जानवर हैं। <em>निष्कर्ष:</em> I. कुछ बिल्लियाँ जानवर हैं। II. सभी बिल्लियाँ जानवर हैं।\",\"oe\":[\"Only I follows\",\"Only II follows\",\"Both follow\",\"Neither follows\"],\"oh\":[\"केवल I अनुसरण करता है\",\"केवल II अनुसरण करता है\",\"दोनों अनुसरण करते हैं\",\"कोई भी अनुसरण नहीं करता है\"],\"a\":0,\"ee\":\"The cats that overlap with dogs fall entirely within the animals circle. Thus, some cats are animals.\",\"eh\":\"जो बिल्लियाँ कुत्तों के साथ ओवरलैप करती हैं, वे पूरी तरह से जानवरों के घेरे में आती हैं। इस प्रकार, कुछ बिल्लियाँ जानवर हैं।\"},{\"n\":73,\"d\":\"\",\"se\":\"<em>Statements:</em> All trees are green. Some green things are plants. <em>Conclusions:</em> I. Some plants are trees. II. All trees are plants.\",\"sh\":\"<em>कथन:</em> सभी पेड़ हरे हैं। कुछ हरी चीजें पौधे हैं। <em>निष्कर्ष:</em> I. कुछ पौधे पेड़ हैं। II. सभी पेड़ पौधे हैं।\",\"oe\":[\"Only I follows\",\"Only II follows\",\"Both follow\",\"Neither follows\"],\"oh\":[\"केवल I अनुसरण करता है\",\"केवल II अनुसरण करता है\",\"दोनों अनुसरण करते हैं\",\"कोई भी अनुसरण नहीं करता है\"],\"a\":3,\"ee\":\"No direct relationship is established between trees and plants.\",\"eh\":\"पेड़ों और पौधों के बीच कोई सीधा संबंध स्थापित नहीं होता है।\"},{\"n\":74,\"d\":\"\",\"se\":\"<em>Statements:</em> No apple is a banana. Some bananas are fruits. <em>Conclusions:</em> I. Some fruits are not apples. II. All bananas are fruits.\",\"sh\":\"<em>कथन:</em> कोई सेब केला नहीं है। कुछ केले फल हैं। <em>निष्कर्ष:</em> I. कुछ फल सेब नहीं हैं। II. सभी केले फल हैं।\",\"oe\":[\"Only I follows\",\"Only II follows\",\"Both follow\",\"Neither follows\"],\"oh\":[\"केवल I अनुसरण करता है\",\"केवल II अनुसरण करता है\",\"दोनों अनुसरण करते हैं\",\"कोई भी अनुसरण नहीं करता है\"],\"a\":0,\"ee\":\"The portion of fruits that are bananas can never be apples, hence Conclusion I is true. Statement II is a false assumption.\",\"eh\":\"फलों का वह हिस्सा जो केले हैं, वे कभी सेब नहीं हो सकते, इसलिए निष्कर्ष I सत्य है।\"},{\"n\":75,\"d\":\"\",\"se\":\"<em>Statements:</em> All stars are planets. Some planets are moons. <em>Conclusions:</em> I. Some moons are stars. II. All moons are planets.\",\"sh\":\"<em>कथन:</em> सभी तारे ग्रह हैं। कुछ ग्रह चंद्रमा हैं। <em>निष्कर्ष:</em> I. कुछ चंद्रमा तारे हैं। II. सभी चंद्रमा ग्रह हैं।\",\"oe\":[\"Only I follows\",\"Only II follows\",\"Both follow\",\"Neither follows\"],\"oh\":[\"केवल I अनुसरण करता है\",\"केवल II अनुसरण करता है\",\"दोनों अनुसरण करते हैं\",\"कोई भी अनुसरण नहीं करता है\"],\"a\":3,\"ee\":\"Neither conclusion is logically certain based strictly on the premises.\",\"eh\":\"दिए गए आधारों के आधार पर कोई भी निष्कर्ष तार्किक रूप से निश्चित नहीं है।\"},{\"n\":76,\"d\":\"\",\"se\":\"<em>Statements:</em> Some doctors are engineers. All engineers are graduates. <em>Conclusions:</em> I. Some doctors are graduates. II. All graduates are doctors.\",\"sh\":\"<em>कथन:</em> कुछ डॉक्टर इंजीनियर हैं। सभी इंजीनियर स्नातक (graduates) हैं। <em>निष्कर्ष:</em> I. कुछ डॉक्टर स्नातक हैं। II. सभी स्नातक डॉक्टर हैं।\",\"oe\":[\"Only I follows\",\"Only II follows\",\"Both follow\",\"Neither follows\"],\"oh\":[\"केवल I अनुसरण करता है\",\"केवल II अनुसरण करता है\",\"दोनों अनुसरण करते हैं\",\"कोई भी अनुसरण नहीं करता है\"],\"a\":0,\"ee\":\"The doctors who are engineers are automatically graduates.\",\"eh\":\"जो डॉक्टर इंजीनियर हैं वे स्वचालित रूप से स्नातक हैं।\"},{\"n\":77,\"d\":\"\",\"se\":\"<em>Statements:</em> All chairs are furniture. Some furniture is made of wood. <em>Conclusions:</em> I. Some wood is chair. II. All chairs are wood.\",\"sh\":\"<em>कथन:</em> सभी कुर्सियां ​​फर्नीचर हैं। कुछ फर्नीचर लकड़ी के बने होते हैं। <em>निष्कर्ष:</em> I. कुछ लकड़ी कुर्सी है। II. सभी कुर्सियां ​​लकड़ी हैं।\",\"oe\":[\"Only I follows\",\"Only II follows\",\"Both follow\",\"Neither follows\"],\"oh\":[\"केवल I अनुसरण करता है\",\"केवल II अनुसरण करता है\",\"दोनों अनुसरण करते हैं\",\"कोई भी अनुसरण नहीं करता है\"],\"a\":3,\"ee\":\"Neither follows.\",\"eh\":\"कोई भी अनुसरण नहीं करता है।\"},{\"n\":78,\"d\":\"\",\"se\":\"<em>Statements:</em> No dog is a cat. Some cats are mice. <em>Conclusions:</em> I. Some mice are not dogs. II. All dogs are mice.\",\"sh\":\"<em>कथन:</em> कोई कुत्ता बिल्ली नहीं है। कुछ बिल्लियाँ चूहे हैं। <em>निष्कर्ष:</em> I. कुछ चूहे कुत्ते नहीं हैं। II. सभी कुत्ते चूहे हैं।\",\"oe\":[\"Only I follows\",\"Only II follows\",\"Both follow\",\"Neither follows\"],\"oh\":[\"केवल I अनुसरण करता है\",\"केवल II अनुसरण करता है\",\"दोनों अनुसरण करते हैं\",\"कोई भी अनुसरण नहीं करता है\"],\"a\":0,\"ee\":\"The mice that are cats can never be dogs.\",\"eh\":\"जो चूहे बिल्लियाँ हैं वे कभी कुत्ते नहीं हो सकते।\"},{\"n\":79,\"d\":\"\",\"se\":\"<em>Statements:</em> All books are papers. Some papers are pencils. <em>Conclusions:</em> I. Some pencils are books. II. All papers are books.\",\"sh\":\"<em>कथन:</em> सभी किताबें कागज हैं। कुछ कागज पेंसिल हैं। <em>निष्कर्ष:</em> I. कुछ पेंसिल किताबें हैं। II. सभी कागज किताबें हैं।\",\"oe\":[\"Only I follows\",\"Only II follows\",\"Both follow\",\"Neither follows\"],\"oh\":[\"केवल I अनुसरण करता है\",\"केवल II अनुसरण करता है\",\"दोनों अनुसरण करते हैं\",\"कोई भी अनुसरण नहीं करता है\"],\"a\":3,\"ee\":\"Neither follows.\",\"eh\":\"कोई भी अनुसरण नहीं करता है।\"},{\"n\":80,\"d\":\"\",\"se\":\"<em>Statements:</em> Some birds are parrots. All parrots are green. <em>Conclusions:</em> I. Some green things are birds. II. All birds are green.\",\"sh\":\"<em>कथन:</em> कुछ पक्षी तोते हैं। सभी तोते हरे हैं। <em>निष्कर्ष:</em> I. कुछ हरी चीजें पक्षी हैं। II. सभी पक्षी हरे हैं।\",\"oe\":[\"Only I follows\",\"Only II follows\",\"Both follow\",\"Neither follows\"],\"oh\":[\"केवल I अनुसरण करता है\",\"केवल II अनुसरण करता है\",\"दोनों अनुसरण करते हैं\",\"कोई भी अनुसरण नहीं करता है\"],\"a\":0,\"ee\":\"The birds that are parrots are definitely green.\",\"eh\":\"जो पक्षी तोते हैं वे निश्चित रूप से हरे हैं।\"},{\"n\":81,\"d\":\"\",\"se\":\"In a class of 100 students, 60 like playing cricket, 50 like football, and 20 like both. How many students like neither of the two sports?\",\"sh\":\"100 छात्रों की एक कक्षा में, 60 क्रिकेट खेलना पसंद करते हैं, 50 फुटबॉल पसंद करते हैं, और 20 दोनों पसंद करते हैं। कितने छात्रों को दोनों में से कोई भी खेल पसंद नहीं है?\",\"oe\":[\"30\",\"40\",\"10\",\"20\"],\"oh\":[\"30\",\"40\",\"10\",\"20\"],\"a\":2,\"ee\":\"Students liking at least one = 60 + 50 - 20 = 90. Neither = 100 - 90 = 10.\",\"eh\":\"कम से कम एक पसंद करने वाले छात्र = 60 + 50 - 20 = 90। कोई नहीं (Neither) = 100 - 90 = 10।\"},{\"n\":82,\"d\":\"\",\"se\":\"In a survey of 200 people, 120 read the Times, 80 read the Hindu, and 40 read both. How many people read at least one of these newspapers?\",\"sh\":\"200 लोगों के सर्वेक्षण में, 120 लोग टाइम्स पढ़ते हैं, 80 हिंदू पढ़ते हैं, और 40 दोनों पढ़ते हैं। कितने लोग इनमें से कम से कम एक समाचार पत्र पढ़ते हैं?\",\"oe\":[\"180\",\"150\",\"120\",\"160\"],\"oh\":[\"180\",\"150\",\"120\",\"160\"],\"a\":3,\"ee\":\"Union = A + B - Intersection = 120 + 80 - 40 = 160.\",\"eh\":\"यूनियन (Union) = A + B - इंटरसेक्शन = 120 + 80 - 40 = 160।\"},{\"n\":83,\"d\":\"\",\"se\":\"In a standard logical dice puzzle, if 3 is on the face opposite to 4, and 5 is opposite to 2, what number must be on the face opposite to 1?\",\"sh\":\"एक मानक तार्किक पासा पहेली में, यदि 3, 4 के विपरीत फलक (face) पर है, और 5, 2 के विपरीत है, तो 1 के विपरीत फलक पर कौन सी संख्या होनी चाहिए?\",\"oe\":[\"6\",\"5\",\"4\",\"2\"],\"oh\":[\"6\",\"5\",\"4\",\"2\"],\"a\":0,\"ee\":\"6. (The remaining available pair is 1 and 6).\",\"eh\":\"6. (शेष बची जोड़ी 1 और 6 है)।\"},{\"n\":84,\"d\":\"\",\"se\":\"If a dice has 1 opposite to 6, and 2 opposite to 5, what number is opposite to 3?\",\"sh\":\"यदि एक पासे में 1, 6 के विपरीत है, और 2, 5 के विपरीत है, तो 3 के विपरीत कौन सी संख्या है?\",\"oe\":[\"5\",\"4\",\"1\",\"6\"],\"oh\":[\"5\",\"4\",\"1\",\"6\"],\"a\":1,\"ee\":\"4.\",\"eh\":\"4।\"},{\"n\":85,\"d\":\"\",\"se\":\"In a Venn diagram of two overlapping sets A and B, if Set A has 40 elements, Set B has 30 elements, and their intersection (A∩B) has 10 elements, what is the total number of unique elements in A∪B?\",\"sh\":\"दो ओवरलैपिंग सेट ए और बी के वेन आरेख (Venn diagram) में, यदि सेट ए में 40 तत्व हैं, सेट बी में 30 तत्व हैं, और उनके प्रतिच्छेदन (A∩B) में 10 तत्व हैं, तो A∪B में अद्वितीय तत्वों की कुल संख्या क्या है?\",\"oe\":[\"50\",\"70\",\"60\",\"40\"],\"oh\":[\"50\",\"70\",\"60\",\"40\"],\"a\":2,\"ee\":\"40 + 30 - 10 = 60.\",\"eh\":\"40 + 30 - 10 = 60।\"},{\"n\":86,\"d\":\"\",\"se\":\"A woman introduces a man saying, &quot;He is the son of my father's only son.&quot; How is the man related to the woman?\",\"sh\":\"एक महिला एक आदमी का परिचय देते हुए कहती है, &quot;वह मेरे पिता के इकलौते बेटे का बेटा है।&quot; आदमी महिला से कैसे संबंधित है?\",\"oe\":[\"Brother\",\"Son\",\"Cousin\",\"Nephew\"],\"oh\":[\"भाई\",\"बेटा\",\"चचेरा भाई\",\"भतीजा (Nephew)\"],\"a\":3,\"ee\":\"&quot;My father's only son&quot; is the woman's brother. The son of her brother is her nephew.\",\"eh\":\"&quot;मेरे पिता का इकलौता बेटा&quot; महिला का भाई है। उसके भाई का बेटा उसका भतीजा है।\"},{\"n\":87,\"d\":\"\",\"se\":\"In a class, there are 12 boys and 8 girls. If a student is chosen entirely at random, what is the probability that the student is a girl?\",\"sh\":\"एक कक्षा में, 12 लड़के और 8 लड़कियां हैं। यदि एक छात्र को पूरी तरह से यादृच्छिक रूप से (at random) चुना जाता है, तो उस छात्र के लड़की होने की प्रायिकता (probability) क्या है?\",\"oe\":[\"2/5\",\"1/2\",\"4/5\",\"3/5\"],\"oh\":[\"2/5\",\"1/2\",\"4/5\",\"3/5\"],\"a\":0,\"ee\":\"Favorable outcomes = 8. Total = 20. Probability = 8/20 = 2/5.\",\"eh\":\"अनुकूल परिणाम = 8। कुल = 20। प्रायिकता = 8/20 = 2/5।\"},{\"n\":88,\"d\":\"\",\"se\":\"What is the total number of ways to choose 3 books from a stack of 5 distinct books?\",\"sh\":\"5 अलग-अलग किताबों के ढेर से 3 किताबें चुनने के कुल कितने तरीके हैं?\",\"oe\":[\"60\",\"10\",\"20\",\"120\"],\"oh\":[\"60\",\"10\",\"20\",\"120\"],\"a\":1,\"ee\":\"Combinations: 5C3 = (5 × 4 × 3) / (3 × 2 × 1) = 10.\",\"eh\":\"संचय (Combinations): 5C3 = (5 × 4 × 3) / (3 × 2 × 1) = 10।\"},{\"n\":89,\"d\":\"\",\"se\":\"If &quot;All cats are animals&quot; and &quot;All animals are living beings&quot;, which of the following is true?\",\"sh\":\"यदि &quot;सभी बिल्लियाँ जानवर हैं&quot; और &quot;सभी जानवर जीवित प्राणी हैं&quot;, तो निम्नलिखित में से कौन सा सत्य है?\",\"oe\":[\"All cats are living beings\",\"Some animals are cats\",\"Both A and B are true\",\"Neither is true\"],\"oh\":[\"सभी बिल्लियाँ जीवित प्राणी हैं\",\"कुछ जानवर बिल्लियाँ हैं\",\"A और B दोनों सत्य हैं\",\"कोई भी सत्य नहीं है\"],\"a\":2,\"ee\":\"Both are logically true deductions.\",\"eh\":\"दोनों तार्किक रूप से सत्य कटौतियां हैं।\"},{\"n\":90,\"d\":\"\",\"se\":\"Read the statement: &quot;If it rains, the outdoor match will be cancelled.&quot; It rained heavily today. What can be logically concluded?\",\"sh\":\"कथन पढ़ें: &quot;यदि बारिश होती है, तो बाहरी मैच रद्द कर दिया जाएगा।&quot; आज भारी बारिश हुई। तार्किक रूप से क्या निष्कर्ष निकाला जा सकता है?\",\"oe\":[\"The match is not cancelled\",\"The match is postponed\",\"The match is cancelled\",\"Cannot be concluded\"],\"oh\":[\"मैच रद्द नहीं हुआ है\",\"मैच स्थगित कर दिया गया है\",\"मैच रद्द हो गया है\",\"निष्कर्ष नहीं निकाला जा सकता\"],\"a\":2,\"ee\":\"Based purely on the given condition (Modus Ponens), it is cancelled.\",\"eh\":\"दी गई स्थिति (Modus Ponens) के आधार पर, यह रद्द कर दिया गया है।\"},{\"n\":91,\"d\":\"\",\"se\":\"Find the odd one out in the series:\",\"sh\":\"श्रृंखला में बेजोड़ (Odd one out) ज्ञात कीजिए:\",\"oe\":[\"2, 4, 6, 8\",\"3, 6, 9, 12\",\"4, 8, 12, 16\",\"1, 3, 5, 7\"],\"oh\":[\"2, 4, 6, 8\",\"3, 6, 9, 12\",\"4, 8, 12, 16\",\"1, 3, 5, 7\"],\"a\"
